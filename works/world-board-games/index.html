<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f151b">
<title>世界の伝統ボードゲーム</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
</head>
<body>
<style>
/* 盤上の夜: 藍墨の背景に真鍮と漆の差し色。全画面の3Dキャンバスを常に背景に敷き、
   選択→確認→難易度→確認→対局 を同じ一画面の中で切り替える（スクロール無し） */
:root {
  --bg: #0f151b;
  --bg-2: #161d25;
  --panel: rgba(19, 25, 32, 0.86);
  --panel-solid: #161d25;
  --edge: rgba(214, 182, 120, 0.26);
  --edge-strong: rgba(214, 182, 120, 0.6);
  --fg: #ede6d7;
  --fg-dim: #a79e8c;
  --fg-faint: #6f6a5f;
  --accent: #d6b678;
  --accent-ink: #2a2110;
  --lacquer: #b8503a;
  --ok: #86b47d;
  --danger: #d5695c;
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --radius: 10px;
  --hud-top: 52px;
  --hud-bottom: 60px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; -webkit-text-size-adjust: 100%; overscroll-behavior: none; touch-action: none; }
button { font: inherit; color: inherit; touch-action: manipulation; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#ripple { position: fixed; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 2px solid rgba(214,182,120,0.9); pointer-events: none; opacity: 0; transform: scale(0.4); z-index: 5; }
#ripple.on { animation: ripple 0.45s ease-out forwards; }
@keyframes ripple { 0% { opacity: 0.9; transform: scale(0.4); } 100% { opacity: 0; transform: scale(1.3); } }
#noweb { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--fg-dim); }

/* ---- 画面（オーバーレイ） ---- */
.screen {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  opacity: 0; pointer-events: none; transform: translateY(10px) scale(0.985);
  transition: opacity .28s ease, transform .32s cubic-bezier(.2,.7,.2,1);
  background: radial-gradient(120% 90% at 50% 10%, rgba(15,21,27,0.35), rgba(15,21,27,0.78));
}
.screen.on { opacity: 1; pointer-events: auto; transform: none; }
.screen > .inner { width: 100%; max-width: 820px; max-height: 100%; display: flex; flex-direction: column; gap: 12px; min-height: 0; }

.brand { text-align: center; display: flex; flex-direction: column; gap: 2px; }
.brand h1 { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.12em; margin: 0; font-size: clamp(22px, 4.6vw, 38px); text-wrap: balance; color: var(--fg); text-shadow: 0 2px 18px rgba(0,0,0,0.6); }
.brand .sub { color: var(--accent); letter-spacing: 0.3em; text-transform: uppercase; font-size: 10.5px; }
.brand .lead { color: var(--fg-dim); font-size: 12.5px; }

.finder { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.search { position: relative; display: flex; align-items: center; width: 100%; max-width: 420px; }
.search svg { position: absolute; left: 12px; width: 17px; height: 17px; fill: none; stroke: var(--fg-dim); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
.search input { width: 100%; height: 38px; padding: 0 38px 0 38px; border-radius: 999px; border: 1px solid var(--edge); background: rgba(12,17,22,0.78); color: var(--fg); font: inherit; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none; touch-action: manipulation; }
.search input::placeholder { color: var(--fg-faint); }
.search input::-webkit-search-cancel-button { display: none; }
.search input:focus { border-color: var(--edge-strong); box-shadow: 0 0 0 3px rgba(214,182,120,0.15); }
.search button { position: absolute; right: 4px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; color: var(--fg-dim); cursor: pointer; font-size: 13px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.tab { font-size: 12px; letter-spacing: 0.06em; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--edge); background: rgba(12,17,22,0.62); color: var(--fg-dim); cursor: pointer; white-space: nowrap; }
.tab .n { font-size: 10px; color: var(--fg-faint); margin-left: 4px; font-variant-numeric: tabular-nums; }
.tab.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.tab.sel .n { color: var(--accent-ink); opacity: 0.7; }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); align-content: start; gap: 8px; min-height: 0; overflow-x: hidden; overflow-y: auto; padding: 2px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.card {
  position: relative; display: flex; flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; text-align: left; min-width: 0;
  padding: 9px 12px; border: 1px solid var(--edge); border-radius: var(--radius); background: var(--panel);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); cursor: pointer;
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; color: var(--fg);
}
.card:focus-visible { border-color: var(--edge-strong); box-shadow: 0 0 0 2px rgba(214,182,120,0.5); outline: none; }
@media (hover: hover) { .card:hover { transform: translateY(-3px); border-color: var(--edge-strong); box-shadow: 0 14px 40px rgba(0,0,0,0.45); } }
.card:active { border-color: var(--edge-strong); background: rgba(40,46,52,0.92); }
.card .glyph { font-family: var(--font-display); font-size: 30px; line-height: 1; color: var(--accent); width: 38px; text-align: center; flex: none; text-shadow: 0 4px 24px rgba(214,182,120,0.25); }
.card .txt { display: flex; flex-direction: column; align-items: stretch; gap: 1px; min-width: 0; flex: 1; }
.card .name-row { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.card .name { font-family: var(--font-display); font-size: 14.5px; font-weight: 700; letter-spacing: 0.04em; line-height: 1.35; min-width: 0; overflow-wrap: anywhere; }
.card .tag { display: none; flex: none; margin-left: auto; font-size: 10px; letter-spacing: 0.04em; color: var(--fg-dim); border: 1px solid rgba(214,182,120,0.22); border-radius: 999px; padding: 0 7px; line-height: 16px; white-space: nowrap; }
.card .meta { display: flex; flex-direction: column; min-width: 0; }
.card .en { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .origin { font-size: 10.5px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .desc { display: none; }
.cards .sect { grid-column: 1 / -1; position: sticky; top: -2px; z-index: 2; padding: 7px 4px 5px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); background: linear-gradient(to bottom, rgba(15,21,27,0.96) 70%, rgba(15,21,27,0)); }
.cards .sect .n { font-size: 10px; color: var(--fg-faint); margin-left: 6px; letter-spacing: 0; font-weight: 400; }
.cards .empty { grid-column: 1 / -1; padding: 28px 12px; text-align: center; color: var(--fg-dim); font-size: 13px; line-height: 1.7; background: var(--panel); border: 1px dashed var(--edge); border-radius: var(--radius); }
.count { text-align: center; font-size: 11px; color: var(--fg-faint); letter-spacing: 0.1em; }
.soon { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
.soon .label { font-size: 10.5px; letter-spacing: 0.2em; color: var(--fg-faint); text-transform: uppercase; margin-right: 4px; }
.chip { font-size: 11.5px; color: var(--fg-dim); border: 1px dashed var(--edge); border-radius: 999px; padding: 3px 10px; }

/* パネル（確認・難易度） */
.panel {
  border: 1px solid var(--edge); border-radius: var(--radius); background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; width: 100%; max-width: 560px; margin: 0 auto;
  box-shadow: 0 24px 60px rgba(0,0,0,0.5);
}
.panel .head { display: flex; align-items: center; gap: 14px; }
.panel .head .glyph { font-family: var(--font-display); font-size: 52px; line-height: 1; color: var(--accent); flex: none; width: 64px; text-align: center; }
.panel .head .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.panel .head .t .name { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: 0.08em; }
.panel .head .t .meta { font-size: 12px; color: var(--fg-dim); }
.panel .desc { color: var(--fg); font-size: 13.5px; }
.panel ul.rules { margin: 0; padding-left: 1.1em; color: var(--fg-dim); font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; }
.eyebrow { font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
.opt { display: flex; flex-direction: column; gap: 6px; }
.opt .seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 72px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--edge); background: rgba(255,255,255,0.03); color: var(--fg-dim); cursor: pointer; transition: all .15s; }
.seg button.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 2px; }
.btn { padding: 10px 18px; border-radius: 8px; border: 1px solid var(--edge); background: rgba(255,255,255,0.04); cursor: pointer; letter-spacing: 0.06em; transition: all .15s; }
.btn:hover { border-color: var(--edge-strong); background: rgba(255,255,255,0.07); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.primary:hover { background: #e4c689; }
.btn.lacquer { background: var(--lacquer); border-color: var(--lacquer); color: #fff; font-weight: 700; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: 0.4; cursor: default; }

.levels { display: flex; flex-direction: column; gap: 7px; min-height: 0; }
.lv { display: grid; grid-template-columns: 54px 1fr auto; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--edge); border-radius: 8px; background: rgba(255,255,255,0.025); cursor: pointer; text-align: left; transition: all .15s; color: var(--fg); }
.lv:hover, .lv:focus-visible { border-color: var(--edge-strong); background: rgba(214,182,120,0.08); outline: none; }
.lv .num { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.lv .num small { font-size: 10px; letter-spacing: 0.2em; color: var(--fg-dim); display: block; margin-top: -2px; }
.lv .ttl { font-weight: 700; font-size: 15px; letter-spacing: 0.08em; }
.lv .dsc { font-size: 12px; color: var(--fg-dim); }
.stars { font-size: 12px; letter-spacing: 2px; color: var(--accent); font-variant-numeric: tabular-nums; }
.stars .off { color: var(--fg-faint); }
.stars .plus { color: var(--lacquer); font-weight: 700; }
.lv.max { border-color: rgba(184,80,58,0.55); background: linear-gradient(90deg, rgba(184,80,58,0.14), rgba(255,255,255,0.025)); }
.lv.max .num { color: var(--lacquer); }

/* ---- 対局 HUD ---- */
#hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
#hud .bar { pointer-events: auto; display: flex; align-items: center; gap: 10px; background: linear-gradient(to bottom, rgba(10,14,18,0.86), rgba(10,14,18,0.55)); border-bottom: 1px solid rgba(214,182,120,0.14); min-height: var(--hud-top);
  padding-block: 6px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
#hud .bar.bottom { background: linear-gradient(to top, rgba(10,14,18,0.9), rgba(10,14,18,0.6)); border-bottom: 0; border-top: 1px solid rgba(214,182,120,0.14); min-height: var(--hud-bottom); justify-content: center; gap: 8px; flex-wrap: wrap;
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); }
.hud-game { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hud-game .g { font-family: var(--font-display); font-size: 22px; color: var(--accent); line-height: 1; }
.hud-game .n { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.08em; font-size: 15px; white-space: nowrap; }
.hud-game .lvl { font-size: 10.5px; color: var(--accent); border: 1px solid var(--edge); border-radius: 999px; padding: 2px 8px; letter-spacing: 0.1em; white-space: nowrap; }
.hud-status { flex: 1; text-align: center; min-width: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.hud-status .turn { font-weight: 700; letter-spacing: 0.1em; font-size: 14px; white-space: nowrap; }
.hud-status .turn.cpu { color: var(--accent); }
.hud-status .turn.check { color: var(--danger); }
.hud-status .note { font-size: 11px; color: var(--fg-dim); white-space: nowrap; }
.hud-right { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--fg-dim); white-space: nowrap; line-height: 1.25; }
.hud-right b { color: var(--fg); font-size: 14px; }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.ib { padding: 8px 13px; border-radius: 8px; border: 1px solid var(--edge); background: rgba(255,255,255,0.04); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; letter-spacing: 0.04em; white-space: nowrap; transition: all .15s; }
.ib:hover { background: rgba(255,255,255,0.08); border-color: var(--edge-strong); }
.ib:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ib[disabled] { opacity: 0.35; cursor: default; }
.ib .k { font-family: var(--font-display); color: var(--accent); }
.ib.on { background: var(--accent); border-color: var(--accent); }
.ib.on .k { color: var(--accent-ink); font-weight: 700; }
.ib { min-height: 38px; justify-content: center; }

/* ---- モーダル ---- */
#modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5,8,11,0.55); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#modal.on { opacity: 1; pointer-events: auto; }
#modal .box { width: 100%; max-width: 420px; background: var(--panel-solid); border: 1px solid var(--edge-strong); border-radius: var(--radius); padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 30px 80px rgba(0,0,0,0.6); transform: translateY(8px); transition: transform .25s cubic-bezier(.2,.7,.2,1); max-height: 90%; overflow: auto; }
#modal.on .box { transform: none; }
#modal h2 { margin: 0; font-family: var(--font-display); font-size: 22px; letter-spacing: 0.1em; font-weight: 700; text-wrap: balance; }
#modal h2.win { color: var(--accent); } #modal h2.lose { color: var(--danger); }
#modal .body { color: var(--fg-dim); font-size: 13.5px; }
#modal .body b { color: var(--fg); }
#modal .score { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-variant-numeric: tabular-nums; }
#modal .score div { border: 1px solid var(--edge); border-radius: 8px; padding: 8px 10px; }
#modal .score .lab { font-size: 11px; color: var(--fg-dim); letter-spacing: 0.1em; }
#modal .score .val { font-size: 20px; font-family: var(--font-display); font-weight: 700; }
#modal .promo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
#modal .promo button { font-family: var(--font-display); font-size: 30px; padding: 10px 0; border-radius: 8px; border: 1px solid var(--edge); background: rgba(255,255,255,0.04); cursor: pointer; }
#modal .promo button:hover { border-color: var(--edge-strong); background: rgba(214,182,120,0.12); }
#modal .actions { flex-wrap: wrap; }

#toast { position: fixed; left: 50%; bottom: calc(var(--hud-bottom) + 18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); background: rgba(19,25,32,0.95); border: 1px solid var(--edge-strong); color: var(--fg); padding: 8px 16px; border-radius: 999px; font-size: 13px; letter-spacing: 0.06em; opacity: 0; transition: all .25s; pointer-events: none; z-index: 30; white-space: nowrap; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: var(--bg); z-index: 40; transition: opacity .4s; color: var(--fg-dim); letter-spacing: 0.2em; font-size: 12px; }
#loading .t { font-family: var(--font-display); font-size: 22px; color: var(--fg); letter-spacing: 0.14em; }
#loading.off { opacity: 0; pointer-events: none; }


/* ---- ルール解説 ---- */
#rules { position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center; background: rgba(5,8,11,0.6); opacity: 0; transition: opacity .2s; padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
#rules.on { opacity: 1; }
#rules .rv-box { width: 100%; max-width: 760px; height: 100%; max-height: 980px; background: var(--panel-solid); border: 1px solid var(--edge-strong); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
.rv-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px 8px 16px; border-bottom: 1px solid rgba(214,182,120,0.14); }
.rv-glyph { font-family: var(--font-display); font-size: 30px; color: var(--accent); width: 46px; height: 46px; display: grid; place-items: center; border: 1px solid var(--edge); border-radius: 8px; flex: none; }
.rv-title { flex: 1; min-width: 0; }
.rv-title h2 { margin: 2px 0 0; font-family: var(--font-display); font-size: 21px; letter-spacing: 0.06em; line-height: 1.25; }
.rv-title .eyebrow { font-size: 11px; color: var(--fg-dim); letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-nav { display: flex; gap: 6px; padding: 8px 14px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; border-bottom: 1px solid rgba(214,182,120,0.1); }
.rv-nav::-webkit-scrollbar { display: none; }
.rv-nav button { flex: none; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--edge); background: rgba(255,255,255,0.03); color: var(--fg-dim); font-size: 12.5px; cursor: pointer; }
.rv-nav button:hover { color: var(--fg); border-color: var(--edge-strong); }
.rv-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; padding: 4px 18px 28px; font-size: 14.5px; line-height: 1.85; color: #e2dacb; }
.rv-sec { padding-top: 14px; }
.rv-sec h3 { font-family: var(--font-display); font-size: 18px; color: var(--accent); letter-spacing: 0.12em; margin: 10px 0 6px; padding-bottom: 4px; border-bottom: 1px solid rgba(214,182,120,0.22); }
.rv-sec h4 { font-size: 15px; margin: 18px 0 4px; color: var(--fg); letter-spacing: 0.04em; }
.rv-sec h4::before { content: ''; display: inline-block; width: 4px; height: 0.9em; background: var(--accent); margin-right: 8px; border-radius: 2px; vertical-align: -0.08em; }
.rv-sec p { margin: 6px 0; }
.rv-sec ul { margin: 6px 0; padding-left: 1.3em; }
.rv-sec li { margin: 3px 0; }
.rv-sec b { color: #fff3d6; }
.rv-lead { font-size: 15.5px; color: var(--fg); }
.rv-facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin: 10px 0 4px; }
.rv-fact { border: 1px solid var(--edge); border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; line-height: 1.4; }
.rv-fact span { font-size: 11px; color: var(--fg-dim); letter-spacing: 0.08em; }
.rv-fact b { font-size: 13.5px; font-weight: 500; }

  { id: 'thai', region: 'seasia', glyph: '暹', name: "タイ式チェッカー（マークホース）", en: 'Makyek', origin: 'タイ', engine: { family: 'jump', variant: 'thai' }, sides: ['白', '黒'],
    desc: '8×8で8個ずつ。飛び王は取った駒のすぐ先に止まります。', rules: ["兵は前にしか取れません。", "取った駒はすぐに盤から除かれます（その後を通って取り続けられます）。"], options: [sideOpt('白', '黒')] },
  { id: 'congkak', region: 'seasia', glyph: '貝', name: 'コンカク／スンカ', en: 'Congkak', origin: 'マレーシア・インドネシア・フィリピン', engine: { family: 'mancala', variant: 'congkak' }, sides: ['手前', '向こう'],
    desc: '7個ずつの穴から種を蒔きます。最後の種が入った穴に種があればそこから続けて蒔き（リレー）、自分の倉に入ればもう一度。', rules: ['自分側の空の穴で終われば向かいの種を取ります。', '相手側が空になると残りは自分の倉へ。'], options: [sideOpt('手前', '向こう')] },
  { id: 'oanquan', region: 'seasia', glyph: '官', name: 'オー・アン・クアン', en: 'Ô ăn quan', origin: 'ベトナム', engine: { family: 'mancala', variant: 'oanquan' }, sides: ['手前', '向こう'],
    desc: '両端の「関」に官（10点）がいる蒔き取りゲーム。穴をタップしてから隣の穴をタップして向きを選びます。', rules: ["蒔いた先の次に種があれば続けて蒔き、空の次に種があれば取ります。", "官は民が5個以上たまるまで取れません。", "自分の5つの穴が空になったら、取った石から1個ずつ置き直します（足りなければ相手から借ります）。", "両方の関が空になったら終局。残った民はそれぞれの列の持ち主のものに。"], options: [sideOpt('手前', '向こう')] },
  // ---- 南アジア ----
  { id: 'chaturanga', region: 'southasia', glyph: '印', name: 'チャトランガ', en: 'Chaturanga', origin: 'インド・6世紀', engine: { family: 'fairy', variant: 'chaturanga' }, sides: ['白', '黒'],
    desc: 'チェスの祖先。大臣（マントリ）は斜め1、象（ガジャ）は斜め2跳び。', rules: ["相手を裸の王（王だけ）にすると勝ち。ただし相手が次の手で取り返して双方裸の王になれば引き分け（シャトランジと同じ扱い）。", "動けなくなった側の勝ちという古い規則を採用。"], options: [sideOpt('白', '黒')] },
  { id: 'baghchal', region: 'southasia', glyph: '虎', name: 'バグ・チャル', en: 'Bagh-Chal', origin: 'ネパール', engine: { family: 'hunt', variant: 'baghchal' }, sides: ['山羊', '虎'],
    desc: '4頭の虎と20頭の山羊。虎は山羊を飛び越えて取り、山羊は虎を閉じ込めます。', rules: ["山羊は20個を置き終えるまで動かせません。", "虎が5個取れば虎の勝ち、全ての虎を動けなくすれば山羊の勝ち。", "本来は「以前の局面に戻す手」が禁止ですが、ここでは同じ局面が3回で引き分けにしています。"], options: [sideOpt('山羊', '虎')] },
  { id: 'pulijudam', region: 'southasia', glyph: '羊', name: 'アードゥ・プリ・アッタム', en: 'Aadu Puli Attam', origin: '南インド', engine: { family: 'hunt', variant: 'pulijudam' }, sides: ['山羊', '虎'],
    desc: '3頭の虎と15頭の山羊。三角形の盤で戦います。', rules: ['虎が6個取れば虎の勝ち。', '盤の形は近似です。'], options: [sideOpt('山羊', '虎')] },
  { id: 'hatdiviyan', region: 'southasia', glyph: '錫', name: "ハット・ディヴィヤン・ケリヤ", en: 'Hat Diviyan Keliya', origin: 'スリランカ', engine: { family: 'hunt', variant: 'hatdiviyan' }, sides: ["豹", "虎"],
    desc: "スリランカの「7頭の豹」のゲーム。10点の三角形の盤で、1頭の虎と7頭の豹が戦います。", rules: ["虎が先手で、頂点から始めます（本来は好きな点に置けます）。", "豹は7個を置き終えるまで動かせません。虎は豹を1つ飛び越えて取ります。", "虎が4個取れば虎の勝ち、動けなくすれば豹の勝ち。"], options: [{ key: 'human', label: 'あなたの側', values: [{ v: 0, label: '豹（後手）' }, { v: 1, label: '虎（先手）' }] }] },
  { id: 'sixteen', region: 'southasia', glyph: '兵', name: '16人の兵士', en: 'Sixteen Soldiers', origin: 'インド・バングラデシュ', engine: { family: 'jump', variant: 'sixteen' }, sides: ['白', '黒'],
    desc: "アルケルケ盤の上下に三角形を足した37点の盤で16個ずつ。飛び越えて取り、全部取れば勝ち。", rules: ["どの方向にも動けます。", "取るのは自由（義務ではありません）。連続で飛び越えられ、途中でやめることもできます（最後の点をもう一度タップで確定）。"], options: [sideOpt('白', '黒')] },
  { id: 'pallanguzhi', region: 'southasia', glyph: '南', name: 'パッランクリ', en: 'Pallanguzhi', origin: 'タミル（南インド）', engine: { family: 'mancala', variant: 'pallanguzhi' }, sides: ['手前', '向こう'],
    desc: "7個の穴に6個ずつ。蒔き終えた次の穴に種があれば続けて蒔き、空の穴の次にある種を取ります。", rules: ["蒔いている途中で穴の種がちょうど4個になったら、蒔いた人がその4個を取ります（パス）。", "相手側が空になると残りは自分のものに。", "本来の複数ラウンド制は未対応です。地域によって規則がかなり異なります。"], options: [sideOpt('手前', '向こう')] },
  { id: 'pachisi', region: 'southasia', glyph: '廿', name: 'パチシ', en: 'Pachisi', origin: 'インド・中世', engine: { family: 'race', variant: 'pachisi' }, sides: ['黄', '緑'],
    desc: 'インドの国民的ゲームでルードの原型。6個のタカラガイを投げ、口が上を向いた数で進みます（0個なら25、1個なら10）。4つの駒を先に中央へ戻した方が勝ち（2人用）。',
    rules: ["6・10・25が出たときだけ駒を出せ、もう一度投げられます。", "相手の駒がいるマスに止まると相手の駒は振り出しに戻ります。星印のマスは安全地帯です。", "中央へ戻るにはぴったりの目が必要です。", "盤はルードと同じ形を使っています（本来は各腕が3列×8マスで、駒は中央から出発します）。「城」の配置や複数駒のブロックも省略しています。"], options: [sideOpt('黄', '緑')] },
  // ---- 中東・古代 ----
  { id: 'shatranj', region: 'mideast', glyph: '波', name: 'シャトランジ', en: 'Shatranj', origin: 'ペルシア〜イスラム世界', engine: { family: 'fairy', variant: 'shatranj' }, sides: ['白', '黒'],
    desc: '中世のチェス。女王（フェルズ）は斜め1、僧（アルフィル）は斜め2跳び。', rules: ["相手を裸の王にすると勝ち（ただし相手が次の手で取り返して双方裸の王になれば引き分け）。", "ステイルメイトは動けなくした側の勝ち。", "キャスリング・2歩進みなし。歩はフェルズに成る。"], options: [sideOpt('白', '黒')] },
  { id: 'seega', region: 'mideast', glyph: '埃', name: 'セーガ', en: 'Seega', origin: 'エジプト・スーダン', engine: { family: 'misc', variant: 'seega' }, sides: ['白', '黒'],
    desc: '5×5の盤に2個ずつ置いていき、置き終えたら縦横に挟んで取ります。', rules: ["中央のマスには置けず、中央の駒は取られません。", "置き終わったら、後から置き終えた側（後手）から動かし始めます。", "取った後に同じ駒で続けて動く規則は省略しています。", "動けないときはパスになります。駒が1個になったら負け。"], options: [sideOpt('白', '黒')] },
  { id: 'turkish', region: 'mideast', glyph: '土', name: 'ダーマ（トルコ式ドラフツ）', en: 'Dama', origin: 'トルコ・中東', engine: { family: 'jump', variant: 'turkish' }, sides: ['白', '黒'],
    desc: '縦横に動くドラフツ。16個ずつ、前と横へ進み、飛び王は縦横にどこまでも。', rules: ["取れるときは必ず取り、最も多く取れる手を選ばなければなりません。", "取った駒はすぐに盤から除かれます。連続取りで真後ろへ折り返すことはできません。"], options: [sideOpt('白', '黒')] },
  { id: 'latrunculi', region: 'europe', glyph: '盗', name: 'ラトルンクリ', en: 'Ludus Latrunculorum', origin: 'ローマ', engine: { family: 'misc', variant: 'latrunculi' }, sides: ['白', '黒'],
    desc: 'ローマの兵隊ゲーム（復元ルール）。駒は縦横に1歩動き、挟んで取ります。', rules: ['相手を1個にするか動けなくすれば勝ち。'], options: [sideOpt('白', '黒')] },
  { id: 'petteia', region: 'europe', glyph: '希', name: 'ペッテイア', en: 'Petteia', origin: 'ギリシャ', engine: { family: 'misc', variant: 'petteia' }, sides: ['白', '黒'],
    desc: '古代ギリシャの挟み取りゲーム（復元ルール）。駒は飛車のように動きます。', rules: ['角の駒は2方向から挟めば取れます。'], options: [sideOpt('白', '黒')] },
  { id: 'toguz', region: 'mideast', glyph: '玖', name: 'トグズ・コルゴール', en: 'Toguz Korgool', origin: 'キルギス・カザフスタン', engine: { family: 'mancala', variant: 'toguz' }, sides: ['手前', '向こう'],
    desc: '9個の穴に9個ずつ、計162個の石。相手側の穴を偶数にすれば全部取り、ちょうど3にすると「トゥズ」になります。', rules: ['トゥズに落ちた石は持ち主のものに。', '82個取れば勝ち。'], options: [sideOpt('手前', '向こう')] },
  { id: 'mangala', region: 'mideast', glyph: '石', name: 'マンガラ', en: 'Mangala', origin: 'トルコ', engine: { family: 'mancala', variant: 'mangala' }, sides: ['手前', '向こう'],
    desc: 'トルコのマンカラ。最初の1個を元の穴に戻して蒔き、相手側を偶数にすれば取り、自分の倉で終われば続けて打てます。', rules: ["自分側の空の穴で終われば向かいの石も取ります。", "自分の列の石を先に使い切った側が、相手の列に残った石を全部取ります。"], options: [sideOpt('手前', '向こう')] },
  { id: 'ur', region: 'mideast', glyph: '烏', name: 'ウル王朝のゲーム', en: 'Royal Game of Ur', origin: 'メソポタミア・紀元前2600年頃', engine: { family: 'race', variant: 'ur' }, sides: ['白', '黒'],
    desc: '知られる限り最古のボードゲームの一つ。4個の四面サイコロ（0〜4）で7個の駒を進め、全てを先に上げた方が勝ち。中央の列は共有路で、相手の駒を追い出せます。',
    rules: ['ロゼット（花印）に止まるともう一度振れ、中央のロゼットにいる駒は取られません。', '上がりはぴったりの目が必要です。', 'ルールはフィンケル版（大英博物館）に基づく簡略版です。'], options: [sideOpt('白', '黒')] },
  { id: 'senet', region: 'mideast', glyph: '冥', name: 'セネト', en: 'Senet', origin: '古代エジプト・紀元前3000年頃', engine: { family: 'race', variant: 'senet' }, sides: ['白', '黒'],
    desc: '古代エジプトの30マスのレースゲーム。4本の棒で出た目（1〜5）だけ進め、5個の駒を先に全て盤から出した方が勝ち。ルールは復元案（ケンダル版をもとにした簡略版）です。',
    rules: ['相手の駒がいるマスに止まるとその駒と入れ替わります。ただし2個以上並んだ駒は守られて取れません。', '3個並んだ相手の駒は通り抜けられません。', '27マス目（水）に止まると15マス目へ戻されます。', '1・4・5の目が出るともう一度振れます。'], options: [sideOpt('白', '黒')] },
  { id: 'nard', region: 'mideast', glyph: '長', name: 'ナルド（長いナルディ）', en: 'Nard / Long Nardy', origin: 'ペルシャ・コーカサス', engine: { family: 'tables', variant: 'nard' }, sides: ['白', '赤'],
    desc: "ヒットのないバックギャモン。両者とも対角の隅にある「頭」の点から15個で出発し、同じ向きに盤を一周します。相手の駒がある点には入れません。全部上げた方が勝ち。",
    rules: ["1手番に頭から出せる駒は1個まで。ただし最初の手番の6-6・4-4・3-3は2個まで出せます。", "相手の駒が1個でもある点には止まれません。", "相手が1個も上げないうちに勝つと「マルス」で2点。", "6点連続のブロックで相手を完全に閉じ込めることの禁止は省略しています。"], options: [sideOpt('白', '赤')] },
  // ---- アフリカ ----
  { id: 'oware', region: 'africa', glyph: '種', name: 'オワリ', en: 'Oware', origin: 'ガーナ・西アフリカ', engine: { family: 'mancala', variant: 'oware' }, sides: ['手前', '向こう'],
    desc: 'マンカラの代表。6個の穴に4個ずつ。相手側で最後の種が2か3になればその穴から手前へ続けて取ります。', rules: ["相手の種が尽きたら種を与える手を選ばなければなりません。相手の種を全部取ってしまう取り方は無効です。", "25個取れば勝ち。", "同じ局面の繰り返しや長手数で終わったときは、盤に残った種を各自の列の分だけ足して比べます。"], options: [sideOpt('手前', '向こう')] },
  { id: 'fanorona', region: 'africa', glyph: '馬', name: 'ファノロナ', en: 'Fanorona', origin: 'マダガスカル', engine: { family: 'misc', variant: 'fanorona' }, sides: ['白', '黒'],
    desc: '駒を動かした先の延長線上にいる敵（接近）か、動いた元の後ろにいる敵（離脱）を、並んでいるだけまとめて取ります。',
    rules: ['取れるときは必ず取ります。同じ駒で続けて取れます（確定するには最後の点をもう一度タップ）。', '接近と離脱の両方ができるときは、取る駒をタップして選びます。'], options: [sideOpt('白', '黒')] },
  { id: 'yote', region: 'africa', glyph: '塞', name: 'ヨテ', en: 'Yoté', origin: 'セネガル・西アフリカ', engine: { family: 'misc', variant: 'yote' }, sides: ['白', '黒'],
    desc: '手持ちの12個を置くか、盤上の駒を動かすか、飛び越えて取るか。取ったときは相手の駒をもう1個取り除けます。',
    rules: ['飛び越えた後、盤上の相手駒を1つタップしておまけで取ります。'], options: [sideOpt('白', '黒')] },
  { id: 'morabaraba', region: 'africa', glyph: '牛', name: 'モラバラバ', en: 'Morabaraba', origin: '南アフリカ', engine: { family: 'mill', variant: 'morabaraba' }, sides: ['白', '黒'],
    desc: '12個の「牛」で遊ぶミル系ゲーム。斜めの線もあります。3つ並べると相手の牛を1頭取ります。', rules: ["牛が3頭になるとどこへでも跳べます。", "2頭以下になると負け。", "公式規則の「崩したミルをすぐに作り直せない」「3頭どうしで10手取り合いがなければ引き分け」は省略しています。"], options: [sideOpt('白', '黒')] },
  { id: 'shax', region: 'africa', glyph: '索', name: 'シャクス', en: 'Shax', origin: 'ソマリア', engine: { family: 'mill', variant: 'shax' }, sides: ['白', '黒'],
    desc: 'ソマリアのミル系ゲーム。12個ずつ置いて盤を埋め、置く間は取れません。', rules: ["盤が埋まったら、置く間に最初にミルを作った側（いなければ後手）から1個ずつ相手の駒を取り除き、動き始めます（資料により1個だけとする説もあります）。", "動けないときはパス（相手が道を開ける本来の手順は簡略化しています）。"], options: [sideOpt('白', '黒')] },
  { id: 'achi', region: 'africa', glyph: '加', name: 'アチ', en: 'Achi', origin: 'ガーナ', engine: { family: 'mill', variant: 'achi' }, sides: ['白', '黒'],
    desc: '3×3の盤に4個ずつ置き、3つ並べたら勝ち。', rules: ["置き終えたら線に沿って隣へ動かします。", "動けなくなった側の負け。"], options: [sideOpt('白', '黒')] },
  { id: 'dara', region: 'africa', glyph: '奈', name: 'ダラ', en: 'Dara', origin: 'ナイジェリア', engine: { family: 'mill', variant: 'dara' }, sides: ['白', '黒'],
    desc: '5×6の盤に12個ずつ置き、置き終えてから縦横に動かして3つ並べると相手の駒を取ります。', rules: ["置く間は3つ並べても取れません。", "4つ以上並べることは、置くときも動かすときも反則です。ちょうど3つだけが有効です。", "2個以下になると負け。"], options: [sideOpt('白', '黒')] },
  { id: 'kharbaga', region: 'africa', glyph: '突', name: 'ハルバガ', en: 'Kharbaga', origin: 'チュニジア', engine: { family: 'jump', variant: 'kharbaga' }, sides: ['白', '黒'],
    desc: "5×5の格子に、各マスの対角線の交点を加えた41点の盤で20個ずつ。中央だけ空けて始めます。", rules: ["兵は前（まっすぐか斜め）にだけ動きます。", "最も多く取れる手を選ばなければなりません。", "資料によって規則が食い違うゲームで、ここではその一説です。"], options: [sideOpt('白', '黒')] },
  // ---- ヨーロッパ ----
  { id: 'chess', region: 'europe', glyph: '♞', name: 'チェス', en: 'Chess', origin: 'インド → ペルシア → 欧州', engine: 'chess', sides: ['白', '黒'],
    desc: '相手のキングを逃げ場のない状態（チェックメイト）に追い込めば勝ちです。',
    rules: ['キャスリング・アンパッサン・プロモーション対応。', 'ステイルメイト／50手／同形三復／駒不足は引き分け。'], options: [sideOpt('白', '黒')] },
  { id: 'english', region: 'europe', glyph: '英', name: 'チェッカー（英式）', en: 'English Draughts', origin: 'イギリス・アメリカ', engine: { family: 'jump', variant: 'english' }, sides: ["黒", "白"],
    desc: '8×8で12個ずつ。斜め前に進み、飛び越えて取ります。奥まで進むと王になり後ろへも動けます。', rules: ["黒が先手です。", "取れるときは必ず取ります。", "王は1マスずつ。"], options: [sideOpt('黒', '白')] },
  { id: 'international', region: 'europe', glyph: '蘭', name: '国際ドラフツ', en: 'International Draughts', origin: 'オランダ・フランス', engine: { family: 'jump', variant: 'international' }, sides: ['白', '黒'],
    desc: '10×10で20個ずつ。兵も後ろへ取れ、王は斜めにどこまでも飛びます。', rules: ['最も多く取れる手を選ばなければなりません。', '王が複数マス飛ぶ場合は着地点をタップします。'], options: [sideOpt('白', '黒')] },
  { id: 'russian', region: 'europe', glyph: '露', name: 'ロシア式ドラフツ', en: 'Shashki', origin: 'ロシア', engine: { family: 'jump', variant: 'russian' }, sides: ['白', '黒'],
    desc: '8×8で飛び王あり。兵は後ろへも取れ、取っている途中で王になればそのまま王として続けます。', rules: ['取れるときは必ず取りますが、数は自由。'], options: [sideOpt('白', '黒')] },
  { id: 'italian', region: 'europe', glyph: '伊', name: 'イタリア式ダーマ', en: 'Dama Italiana', origin: 'イタリア', engine: { family: 'jump', variant: 'italian' }, sides: ['白', '黒'],
    desc: '8×8。兵は王を取れず、王は1マスずつ。最も多く取れる手が優先。', rules: ["兵は前にしか取れません。", "取り方の優先順位: ①最も多く取れる手 ②同数なら王で取る手 ③王を多く取る手 ④王を先に取る手。"], options: [sideOpt('白', '黒')] },

// ============================================================
//  ルール解説の図解（SVG）。ルールエンジンの盤・初期配置・合法手からその場で描くので、
//  図と実際の遊び方が食い違わない。DOM を使わず文字列を返す（Node でも動く）
//
//  図の指定（RULES[id].sections[].figs[] の各要素）
//   { type: 'setup' }                         … 初期配置
//   { type: 'board' }                         … 何も置かない盤
//   { type: 'pos', pieces: [...], ... }       … 任意の局面（空の盤に pieces を置く）
//  共通の項目
//   caption: '説明'           pieces: [[x, y, 駒コード], ...] または [[ノード番号, 駒コード], ...]
//   keep: true                … pos でも初期配置を消さずに pieces を上書きする
//   state: { ... }            … 状態を直接上書き（hands, stores, pc, bar, off など）
//   turn: 0|1                 … 手番
//   auto: [x, y]              … その駒の合法手をエンジンで計算して印を付ける（取りは赤丸、経路は矢印）
//   marks: [[x, y, 種類], ...] 種類: 'dot' 'cap' 'sel' 'x' 'goal' 'hl' 'star' 't:文字'
//   arrows: [[x1, y1, x2, y2(, 'red'|'blue'|'gold')], ...] または [[ノード1, ノード2(, 色)], ...]
//   route: 0|1                … （レース系・テーブルズ系）そのプレイヤーの進む道順を矢印で描く
//   numbers: true             … （テーブルズ系）点の番号（先手から見た 1〜24）を描く
//   crop: [x0, y0, x1, y1]    … 盤の一部だけを表示（盤の座標）
//   size: 9                   … 囲碁の路数

  const src = document.getElementById('engines').textContent + `
self.onmessage = function (e) { var d = e.data; try { var E = d.ref.family ? ENGINES[d.ref.family][d.ref.variant] : ENGINES[d.ref.id], r;
  if (d.op === 'move') r = E.ai(d.state, d.level, d.opt || {});
  else if (d.op === 'score') r = E.finalScore(d.state, d.opt || {});
  self.postMessage({ id: d.id, result: r }); } catch (err) { self.postMessage({ id: d.id, error: String(err && err.stack || err) }); } };`;
  try {
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = (e) => { const p = pending.get(e.data.id); if (!p) return; pending.delete(e.data.id); if (e.data.error) p.reject(new Error(e.data.error)); else p.resolve(e.data.result); };

    return new Promise((resolve, reject) => setTimeout(() => { try { const E = ref.family ? ENGINES[ref.family][ref.variant] : ENGINES[ref.id]; resolve(op === 'move' ? E.ai(state, level, opt || {}) : E.finalScore(state, opt || {})); } catch (e) { reject(e); } }, 30));
  }

    if (E.chance && st.dice == null) { autoRoll(byCpu ? 500 : 700); return; }
    if (!humanTurn()) setTimeout(cpuMove, 350);
    else if (m.kind !== 'go') {
      const lg = legal();
      if (lg.length && lg.every(x => x.pass)) { toast(E.chance ? '動かせる駒がないのでパス' : '打てる手がないのでパス'); setTimeout(() => { if (m && m.state === st) applyMove(lg[0]); }, 900); }
    }
  }
  function cpuMove() {
    if (!m || m.over || humanTurn()) return;
    m.thinking = true; updateHud();
    const t0 = Date.now(), my = m, st = m.state;
    const opt = m.kind === 'go' ? { timeMs: m.level >= 6 ? GO_TIME_STRONG[st.n] || 12000 : GO_TIME[m.level] } : { reps: Object.fromEntries(m.reps) };
    const timer = setInterval(() => { const e = $('#think-sec'); if (!e || my !== m || !m.thinking) { clearInterval(timer); return; } e.textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's'; }, 200);
    Brain.ask(engineRef(m.game), 'move', st, m.level, opt).then(res => {
      if (my !== m || m.state !== st) return;
      const wait = Math.max(0, 450 - (Date.now() - t0));
      setTimeout(() => {
        if (my !== m || m.state !== st) return;
        m.thinking = false;
        if (!res) { finish({ over: true, winner: m.human, reason: 'CPUに指し手がありません' }); return; }
        if (res.resign) { finish({ over: true, winner: m.human, reason: 'CPUの投了' }); return; }
        if (m.kind === 'go') { if (res.pass) toast('CPU: パス'); applyMove(res.pass ? { pass: true } : { i: res.i }, true); }
        else { if (res.pass) toast('CPU: パス'); applyMove(res, true); }
      }, wait);
    }).catch(err => { if (my !== m) return; console.error(err); m.thinking = false; toast('CPUの思考でエラーが起きました'); updateHud(); });
  }

  function finish(s) {
    m.over = true; m.thinking = false; m.sel = null; m.ghost = null; m.path = [];
    updateHud(); refreshMarkers();
    if (m.kind === 'go' && s.needsScore) {
      $('#hud-turn').innerHTML = '<span class="spin"></span>計算中';
      const my = m;
      Brain.ask({ id: 'go' }, 'score', m.state, 0, { timeMs: 2500, playouts: 600 }).then(r => {
        if (my !== m) return;
        m.final = r; refreshMarkers();
        const youWin = r.winner === m.human;
        const html = `<div class="score"><div><div class="lab">黒（石＋地）</div><div class="val">${r.black}</div></div><div><div class="lab">白（石＋地）＋コミ</div><div class="val">${r.white} + ${r.komi}</div></div></div>
          <div style="margin-top:8px">${r.margin > 0 ? '黒' : '白'}の <b>${Math.abs(r.margin)} 目</b> 勝ち${r.dead.length ? `（死に石 ${r.dead.length} 個を取り除いて計算）` : ''}</div>`;
        resultModal(youWin ? 'あなたの勝ち' : 'CPUの勝ち', youWin, html);
        updateHud();
      }).catch(err => { console.error(err); resultModal('終局', false, '計算に失敗しました'); });
      return;
    }
    let title, win = false;
    if (s.winner == null) title = '引き分け';
    else if (s.winner === m.human) { title = 'あなたの勝ち'; win = true; } else title = 'CPUの勝ち';
    resultModal(title, win, s.reason);
  }
  function resultModal(title, win, html) {
    modal({ title, cls: win ? 'win' : (title === '引き分け' ? '' : 'lose'), html, buttons: [
      { label: 'タイトルへ', cls: 'ghost', onClick: quitToTitle },
      { label: '難易度を変える', cls: '', onClick: () => { m = null; previewGame(App.game); openLevel(); } },
      { label: 'もう一度', cls: 'primary', onClick: () => start(m.game, m.opts, m.level) }
    ] });
  }
  function undo() {
    if (!m || m.over || !humanTurn() || m.thinking || !m.history.length) return;
    const back = m.history.length >= 2 ? 2 : 1;
    for (let i = 0; i < back; i++) { const k = key(); if (k) m.reps.set(k, Math.max(0, (m.reps.get(k) || 1) - 1)); m.state = m.history.pop(); }
    m.sel = null; m.ghost = null; m.path = []; m.legal = null; m.final = null;
    V.sync(m.state, null);
    const s = m.E.status(m.state, repCount()); m.check = !!s.check;
    updateHud(); refreshMarkers();
    if (!humanTurn()) setTimeout(cpuMove, 300);
  }
  function pass() {
    if (!m || !humanTurn() || m.thinking || m.over) return;
    if (m.kind === 'go') { m.ghost = null; applyMove({ pass: true }); return; }
    const pm = legal().find(x => x.pass); if (pm) applyMove(pm);
  }
  function resign() { if (!m || m.over) return; modal({ title: '投了しますか？', html: 'この対局はあなたの負けになります。', buttons: [{ label: 'やめる', cls: 'ghost' }, { label: '投了する', cls: 'lacquer', onClick: () => finish({ over: true, winner: 1 - m.human, reason: '投了' }) }] }); }
  function quit() { if (!m || m.over) { quitToTitle(); return; } modal({ title: '対局をやめますか？', html: '盤面は保存されません。', buttons: [{ label: '続ける', cls: 'ghost' }, { label: 'やめる', cls: 'lacquer', onClick: quitToTitle }] }); }
  function quitToTitle() { Brain.cancelAll(); m = null; showScreen('select'); previewGame(App.game); }
  function viewPhi() { return App.topView ? 0 : V.defaultPhi(); }
  function resetView() {
    if (!m) return;
    V.resetZoom(); V.setTopView(App.topView, V.sideTheta(m.human));
    if (V.needsRelayout()) { V.buildBoard(m.game, m.opts, m.E); V.sync(m.state, null); V.setTopView(App.topView, V.sideTheta(m.human)); refreshMarkers(); } // 将棋の駒台の置き場所を変える
    V.frame(V.sideTheta(m.human), viewPhi(), true);
  }
  // 俯瞰固定 ⇄ 立体 の切り替え（設定は端末に覚えておく）
  function toggleTopView() {
    App.topView = !App.topView; saveViewPref(); updateViewButton();
    if (!m) return;
    resetView();
    toast(App.topView ? '俯瞰固定: 真上から見ます（ドラッグしても回りません）' : '立体: ドラッグで盤を回せます');
  }
  function snapshot() {
    if (!m) return { screen: App.screen, game: App.game.id, level: App.level, optsFor: App.optsFor, region: App.region, view: App.topView ? 'top' : '3d' };
    return { screen: 'play', game: m.game.id, level: m.level, optsFor: App.optsFor, region: App.region, view: App.topView ? 'top' : '3d', match: { gameId: m.game.id, opts: m.opts, level: m.level, state: m.state, history: m.history, over: m.over } };
  }
  function restore(data) {
    if (!data) return false;
    if (data.optsFor) for (const k of Object.keys(data.optsFor)) if (App.optsFor[k]) Object.assign(App.optsFor[k], data.optsFor[k]);
    if (data.game) App.game = GAMES.find(g => g.id === data.game) || GAMES[0];
    if (data.region) App.region = data.region;
    if (data.level) App.level = data.level;
    if (data.view) { App.topView = data.view === 'top'; updateViewButton(); }
    if (data.match && !data.match.over) { const g = GAMES.find(x => x.id === data.match.gameId); if (g) { start(g, data.match.opts, data.match.level, { state: data.match.state, history: data.match.history }); return true; } }
    return false;
  }
  return { start, onTap, undo, pass, resign, quit, resetView, toggleTopView, snapshot, restore, current: () => m };
})();

// ============================================================
//  ルール解説ウインドウ（歴史・ルール・用語・このアプリでの扱い）。図はエンジンから描く
// ============================================================
const RuleView = (() => {
  let current = null;
  const inl = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function paras(arr) { // 「・」で始まる行は箇条書きにまとめる
    let html = '', list = [];
    const flush = () => { if (list.length) { html += '<ul>' + list.map(li => '<li>' + inl(li) + '</li>').join('') + '</ul>'; list = []; } };
    for (const t of (arr || [])) { if (/^[・•]/.test(t)) list.push(t.replace(/^[・•]\s*/, '')); else { flush(); html += '<p>' + inl(t) + '</p>'; } }
    flush(); return html;
  }
  function figs(g, list) {
    if (!list || !list.length) return '';
    const E = engineOf(g), kind = kindOf(g);
    return '<div class="rv-figs">' + list.map(spec => {
      let r; try { r = Diagram.render(E, kind, g, spec); } catch (e) { console.warn('diagram', g.id, e); return ''; }
      return `<figure class="rv-fig">${r.svg}${spec.caption ? `<figcaption>${inl(spec.caption)}</figcaption>` : ''}</figure>`;
    }).join('') + '</div>';
  }
  function build(g) {
    const R = RULES[g.id] || {};
    const secs = [];
    // 概要
    const facts = (R.facts || []).map(([k, v]) => `<div class="rv-fact"><span>${esc(k)}</span><b>${inl(v)}</b></div>`).join('');
    secs.push({ id: 'about', name: '概要', html: `<p class="rv-lead">${inl(R.summary || g.desc)}</p>${facts ? `<div class="rv-facts">${facts}</div>` : ''}${figs(g, R.overviewFigs || ((R.sections || []).some(sc => (sc.figs || []).some(fg => fg.type === 'setup')) ? [] : [{ type: 'setup', caption: 'はじめの配置' }]))}` });
    if (R.history && R.history.length) secs.push({ id: 'history', name: '歴史', html: paras(R.history) });
    const rs = R.sections && R.sections.length ? R.sections : [{ title: 'ルール', body: [g.desc].concat(g.rules.map(x => '・' + x)) }];
    secs.push({ id: 'rules', name: 'ルール', html: rs.map(sec => `<h4>${inl(sec.title)}</h4>${paras(sec.body)}${figs(g, sec.figs)}`).join('') });
    if (R.terms && R.terms.length) secs.push({ id: 'terms', name: '用語', html: '<dl class="rv-terms">' + R.terms.map(([t, d]) => `<dt>${inl(t)}</dt><dd>${inl(d)}</dd>`).join('') + '</dl>' });
    if (R.tips && R.tips.length) secs.push({ id: 'tips', name: 'コツ', html: paras(R.tips.map(t => '・' + t)) });
    secs.push({ id: 'app', name: 'このアプリでは', html: paras((g.rules.length ? g.rules : ['特別な簡略化はありません。']).map(t => '・' + t).concat(R.appNote || [])) + `<p class="rv-dim">操作: 動かす駒（または置く点）をタップし、光った行き先をタップします。連続して取る手は、通る点を順にタップします（途中で止めるときは最後の点をもう一度タップ）。</p>` });
    if (R.sources && R.sources.length) secs.push({ id: 'src', name: '参考', html: '<ul class="rv-src">' + R.sources.map(s2 => `<li>${inl(s2)}</li>`).join('') + '</ul>' });
    return secs;
  }
  function open(g) {
    if (!g) return;
    current = g;
    $('#rv-glyph').textContent = g.glyph; $('#rv-name').textContent = g.name; $('#rv-eyebrow').textContent = `${g.en} · ${g.origin}`;
    const secs = build(g), body = $('#rv-body'), nav = $('#rv-nav');
    body.innerHTML = secs.map(sc => `<section class="rv-sec" id="rv-${sc.id}"><h3>${sc.name}</h3>${sc.html}</section>`).join('');
    nav.innerHTML = secs.map(sc => `<button data-k="${sc.id}">${sc.name}</button>`).join('');
    nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { const t = $('#rv-' + b.dataset.k); if (t) body.scrollTo({ top: t.offsetTop - 6, behavior: 'smooth' }); }));
    body.scrollTop = 0;
    $('#rules').hidden = false; requestAnimationFrame(() => $('#rules').classList.add('on'));
    $('#rv-close').focus({ preventScroll: true });
  }
  function close() { const r = $('#rules'); r.classList.remove('on'); setTimeout(() => { if (!r.classList.contains('on')) r.hidden = true; }, 200); }
  function isOpen() { return !$('#rules').hidden; }
  $('#rv-close').addEventListener('click', close);
  $('#rules').addEventListener('click', e => { if (e.target.id === 'rules') close(); });
  return { open, close, isOpen, build };
})();

// ============================================================
//  起動
// ============================================================
function boot(data) {
  if (typeof THREE === 'undefined') { $('#loading').classList.add('off'); const nw = $('#noweb'); nw.textContent = '3Dライブラリ（three.js）を読み込めませんでした。通信状態を確認して再読み込みしてください。'; nw.style.display = 'grid'; return; }
  if (!V.init()) { $('#loading').classList.add('off'); return; }
  renderTabs(); renderCards(); bindSearch();
  V.setTapHandler(Match.onTap);
  V.setOrientHandler(() => { if (Match.current()) Match.resetView(); else V.fit(false); });
  $('#b-undo').addEventListener('click', Match.undo);
  $('#b-pass').addEventListener('click', Match.pass);
  $('#b-resign').addEventListener('click', Match.resign);
  $('#b-view').addEventListener('click', Match.resetView);
  $('#b-top').addEventListener('click', Match.toggleTopView); updateViewButton();
  $('#b-rules').addEventListener('click', () => { const mm = Match.current(); RuleView.open(mm ? mm.game : App.game); });
  $('#b-quit').addEventListener('click', Match.quit);
  window.addEventListener('keydown', e => { if (e.key === 'Escape') { if (RuleView.isOpen()) RuleView.close(); else if ($('#modal').classList.contains('on')) closeModal(); } });
  const fontP = (document.fonts && document.fonts.load) ? Promise.race([document.fonts.load('700 100px "Shippori Mincho"'), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
  fontP.catch(() => { }).then(() => {
    V.setFontReady(!!(document.fonts && document.fonts.check && document.fonts.check('700 100px "Shippori Mincho"')));
    if (!Match.restore(data)) { showScreen('select'); renderTabs(); renderCards(); previewGame(App.game); }
    $('#loading').classList.add('off');
  });
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot(() => Match.snapshot()); } catch (e) { } }
}
window.BoardGames = { V, Match, App, GAMES, REGIONS, LEVELS, engineOf, RuleView, RULES };
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data ? hot.data : null);
})();
</script>
