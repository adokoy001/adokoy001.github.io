}

// ------------------------------------------------------------ 飛沫
function emitSpray(dt) {
  const sh = sim.ship, R = sim.R, p = sim.p;
  if (!sim.stVy || sim.stat.submergedAll) return;
  const vth = 0.35 * Math.sqrt(9.81 * Math.max(0.3, sh.T));
  const sz = Math.max(0.12, Math.min(2.5, 0.025 * sh.B));
  for (let i = 0; i < S.NS; i += 2) {
    const ch = sim.stCh[i]; if (ch <= 0) continue;
    const vy = -sim.stVy[i]; if (vy < vth) continue;
    const n = Math.min(6, Math.floor((vy - vth) / vth * 3 * dt * 60 + Math.random()));
    const s0 = sh.st[i];
    for (let k = 0; k < n; k++) {
      const side = Math.random() < 0.5 ? -1 : 1;
      const yb = sim.stCy[i], zb = side * ch * 0.5;
      const X = p[0] + R[0] * s0.x + R[1] * yb + R[2] * zb, Y = p[1] + R[3] * s0.x + R[4] * yb + R[5] * zb, Z = p[2] + R[6] * s0.x + R[7] * yb + R[8] * zb;
      const ox = R[2] * side, oz = R[8] * side, sp = vy * (0.5 + 0.6 * Math.random());
      spray.emit(X, Y, Z, (sim.vG ? sim.vG[0] : 0) + ox * sp * 0.8 + (Math.random() - 0.5) * sp * 0.4, sp * (0.7 + 0.6 * Math.random()), (sim.vG ? sim.vG[2] : 0) + oz * sp * 0.8 + (Math.random() - 0.5) * sp * 0.4, sz * (0.6 + Math.random()), 0.8 + Math.random() * 0.8);
    }
  }
  // 船首波の飛沫
  const u = sim.uSurge || 0, Ud = sh.type.speed * KN;
  if (u > 0.55 * Ud && sim.stCh[S.NS - 6] > 0) {
    const rate = Math.pow((u - 0.55 * Ud) / Ud, 1.5) * 90 * dt;
    let n = Math.floor(rate + Math.random());
    while (n-- > 0) {
      const xb = sh.hull.xMax - 0.04 * sh.L * Math.random(), yb = sh.T * (0.9 + 0.3 * Math.random()), side = Math.random() < 0.5 ? -1 : 1, zb = side * sh.hull.halfWidth(sh.hull.u(xb), yb);
      const X = p[0] + R[0] * xb + R[1] * yb + R[2] * zb, Y = p[1] + R[3] * xb + R[4] * yb + R[5] * zb, Z = p[2] + R[6] * xb + R[7] * yb + R[8] * zb;
      const sp = u * 0.35;
      spray.emit(X, Y, Z, sim.vG[0] + R[2] * side * sp, sp * 0.6 * Math.random() + 0.5, sim.vG[2] + R[8] * side * sp, sz * 0.8, 0.6 + 0.5 * Math.random());
    }
  }
  // 破口・開口からの噴流
  const all = sh.holes.concat(sh.openings.filter(o => o.group !== 'gunwale' && o.group !== 'trunk'));
  for (const o of all) {
    if (!o.q || Math.abs(o.q) < 1e-4 * Math.max(1, sh.s * sh.s)) continue;
    const ob = o.pos, n = o.nrm || [1, 0, 0];
    const X = p[0] + R[0] * ob[0] + R[1] * ob[1] + R[2] * ob[2], Y = p[1] + R[3] * ob[0] + R[4] * ob[1] + R[5] * ob[2], Z = p[2] + R[6] * ob[0] + R[7] * ob[1] + R[8] * ob[2];
    const sea = sim.etaAt(X, Z);
    const inflow = o.q < 0;
    if (inflow && Y < sea - 0.5 * (o.r || 0.5)) continue;   // 水面下の流入は見えない
    const nx = R[0] * n[0] + R[1] * n[1] + R[2] * n[2], ny = R[3] * n[0] + R[4] * n[1] + R[5] * n[2], nz = R[6] * n[0] + R[7] * n[1] + R[8] * n[2];
    const v = Math.min(12, Math.sqrt(Math.abs(o.q) / Math.max(1e-4, o.area || 0.1)) * 1.2 + 1);
    const cnt = Math.min(8, Math.floor(Math.abs(o.q) * 4 * dt * 60 / Math.max(0.05, sh.s * sh.s) + Math.random()));

      const sgn = inflow ? -1 : 1;
      spray.emit(X, Y, Z, nx * v * sgn + (Math.random() - 0.5), ny * v * sgn + Math.random(), nz * v * sgn + (Math.random() - 0.5), Math.max(0.06, (o.r || 0.3) * 0.8), 0.5 + 0.4 * Math.random());
    }
  }
}

// ------------------------------------------------------------ メインループ
let last = performance.now(), stepCost = 0.3, maxSteps = 60, effSpeed = 1, hudT = 0, instT = 0;
const camW = new Float64Array(3), evOut = new Float64Array(4);
function frame(now) {
  requestAnimationFrame(frame);
  const dtR = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  let simDt = 0;
  if (!st.paused && dtR > 0) {
    const t0 = performance.now();
    const tBefore = sim.t;
    const n = sim.advance(dtR * st.speed, maxSteps);
    const el2 = performance.now() - t0;
    if (n > 0) stepCost = stepCost * 0.9 + 0.1 * (el2 / n);
    maxSteps = Math.max(2, Math.min(800, Math.floor(13 / Math.max(0.005, stepCost))));
    simDt = sim.t - tBefore;
    effSpeed = effSpeed * 0.95 + 0.05 * (simDt / dtR);
  }
  // 浸水があるときは GZ を逐次再計算 (1 フレーム 1 角度)
  const flooded = sim.ship.comps.some(c => Math.abs(c.V - c.V0) > 1e-6 * c.cap + 1e-9);

  if (flooded && !sim.flags.sunk && (gzTimer & 1)) { if (sim.gzIncremental() && !$('i-gz').hidden) drawGZ(); }

  render(dtR, simDt);
  hudT += dtR; instT += dtR;
  if (hudT > 0.12) { hudT = 0; updateHUD(); $('eff').textContent = st.paused ? '停止中' : Math.abs(effSpeed - st.speed) / st.speed > 0.15 ? `実効 ×${effSpeed.toFixed(1)}` : ''; checkEnd(); }
  if (instT > 0.25) { instT = 0; drawInst(); if (sim.ship.holes.length && UI.holeLis && UI.holeLis.length !== sim.ship.holes.length) refreshHoles(); }
}
function render(dtR, simDt) {

  gfx.updateWaves(sim.waves, sim.t);     // 波源の描画用プロファイルもここで更新 (カメラ高さの評価で再利用)
  sim.waves.evalAt(camW[0], camW[2], sim.t, evOut);
  const camH = camW[1] - evOut[0];
  const under = camH < -0.02;
  // 天候
  const storm = Math.max(0, Math.min(1, (sim.seaParams.wind - 9) / 20));
  gfx.updateWeather(st.tod, storm);
  gfx.updateEnv();
  gfx.updateOceanGrid(camW, Math.max(1, Math.abs(camH)));

  u.uCamPos.value.copy(gfx.camera.position);
  // 細部法線の流れ (風向)
  const wd = sim.seaParams.dir, ws = Math.max(1, sim.seaParams.wind);
  st.dOff = st.dOff || [0, 0, 0, 0];
  const tt = sim.t;
  const tile1 = Math.max(9, sh.L * 0.05), tile2 = tile1 * 4.1;
  const ox1 = (-Math.cos(wd) * tt * ws * 0.12), oz1 = (-Math.sin(wd) * tt * ws * 0.12);
  const ox2 = (-Math.cos(wd + 0.6) * tt * ws * 0.05), oz2 = (-Math.sin(wd + 0.6) * tt * ws * 0.05);
  const mod = (v, m) => v - m * Math.floor(v / m);
  u.uDOff.value.set(mod(O[0] + ox1, tile1), mod(O[2] + oz1, tile1), mod(O[0] + ox2, tile2), mod(O[2] + oz2, tile2));
  u.uDTile.value.set(tile1, tile2);
  u.uDStr.value = 0.22 + 0.5 * Math.min(1, ws / 18);
  const fnt = Math.max(3, Math.min(40, sh.L * 0.25));
  u.uFNOff.value.set(mod(O[0] / fnt + tt * 0.01, 1), mod(O[2] / fnt + tt * 0.007, 1));
  u.uFNTile.value = fnt;
  u.uFoamCover.value = Math.min(1, Math.max(0, (sim.seaParams.wind - 4) / 12));
  u.uJacTh.value = 0.55 - 0.25 * Math.min(1, Math.max(0, (sim.seaParams.wind - 6) / 16));
  u.uShiny.value = 900 - 650 * storm;
  u.uWD.value.set(Math.cos(wd), Math.sin(wd));
  u.uStreak.value = Math.max(0, Math.min(1, ((sim.windNow || 0) - 13) / 10));
  { const ca = Math.cos(wd), sa = Math.sin(wd), qx = (O[0] * ca + O[2] * sa) * 0.22 - tt * ws * 0.02, qz = (-O[0] * sa + O[2] * ca) * 2.2; u.uSOff.value.set(mod(qx / fnt, 1), mod(qz / fnt, 1)); }
  u.uWC.value = Math.min(0.3, 3.84e-6 * Math.pow(Math.max(0, sim.windNow || sim.seaParams.wind), 3.41));   // Monahan & O'Muircheartaigh 推定/C
  const vis = 45000 * (1 - 0.88 * storm) * (st.tod < 6.5 || st.tod > 17.8 ? 0.7 : 1);
  u.uFogDen.value = 3 / vis;
  u.uCamUnder.value = under ? 1 : 0;
  const camDist = camctl.mode === 'onboard' ? sh.L * 0.5 : camctl.dist;
  u.uUnderDen.value = 2.2 / Math.max(25, camDist * 1.2);
  // 航跡泡

  } else {

  }

  gfx.seabed.visible = under || sim.flags.sunk;
  // 太陽 (影の範囲を船に合わせる)
  const sd = gfx.sunDir || new THREE.Vector3(0, 1, 0);
  const tgt = view.group.position;
  gfx.sun.position.set(tgt.x + sd.x * sh.L * 2, tgt.y + sd.y * sh.L * 2, tgt.z + sd.z * sh.L * 2);
  gfx.sun.target.position.copy(tgt);
  const sc2 = gfx.sun.shadow.camera, half = sh.L * 0.62 + sh.B;
  if (sc2.right !== half) { sc2.left = -half; sc2.right = half; sc2.top = half; sc2.bottom = -half; sc2.near = 0.1; sc2.far = sh.L * 5; sc2.updateProjectionMatrix(); }

  updateSrcGizmo();
  if (simDt > 0) emitSpray(simDt);

  // 巻き波のリップとしぶき

  if (simDt > 0) for (const p of tips) {
    const sz = Math.max(0.4, p.H / 18);
    if (p.b < 0.95) {
      // 巻いている最中: 峰から後ろへ吹き上がる霧 (オフショア)
      if (Math.random() < simDt * 10) bigSpray.emit(p.rx, p.ry + 0.5, p.rz, -p.nx * (3 + 5 * Math.random()), 3 + 5 * Math.random(), -p.nz * (3 + 5 * Math.random()), 2.2 * sz * (0.6 + Math.random()), 1.2 + Math.random());
    } else {
      // 着水: 白波が爆発的に立ち上がる
      const n = Math.floor(simDt * 90 * Math.min(2, p.H / 10) + Math.random());
      for (let k = 0; k < n; k++) {
        const up = p.c * (0.15 + 0.3 * Math.random()), fw = p.c * (0.1 + 0.45 * Math.random()), lat = (Math.random() - 0.5) * 0.2 * p.c;
        bigSpray.emit(p.x + (Math.random() - 0.5) * p.H * 0.4, p.y + Math.random() * 2, p.z + (Math.random() - 0.5) * p.H * 0.4, p.nx * fw - p.nz * lat, up, p.nz * fw + p.nx * lat, sz * (2.5 + 5 * Math.random()), 1.6 + 1.8 * Math.random());
      }
    }
  }
  bigSpray.update(Math.min(0.1, simDt), O, u.uSunLum.value);
  const rainOn = st.rain === 'on' || (st.rain === 'auto' && sim.seaParams.wind > 17);
  gfx.updateRain(dtR, gfx.camera.position, sim.windNow || 0, wd, rainOn && !under);
  // カメラ近遠
  const cam = gfx.camera;
  cam.near = Math.max(0.03, Math.min(5, (camctl.mode === 'onboard' ? 0.3 : camDist) * 0.004));
  cam.far = 70000; cam.updateProjectionMatrix();
  gfx.renderer.render(sc, cam);

  if (gfx.oceanOK === undefined) {
    const r = gfx.checkOcean();
    if (r) { if (UI.gfxInfo) UI.gfxInfo.textContent = gfxInfoText(r); if (gfx.oceanOK === false) toast(r); else if (gfx.waveMode[0] !== 'tex') toast('この GPU 向けに簡易海面へ切り替えました'); }
  }
}
function gfxInfoText(status) {

  return `海面: ${status} · ${gfx.renderer.capabilities.isWebGL2 ? 'WebGL2' : 'WebGL1'} · 頂点 uniform 上限 ${gl.getParameter(gl.MAX_VERTEX_UNIFORM_VECTORS)} · 頂点テクスチャ 浮動小数 ${gfx.vtf.float ? '可' : '不可'}/8bit ${gfx.vtf.byte ? '可' : '不可'} · 航跡 ${gfx.foam8 ? '8 bit' : '半精度'} · 版 ${BUILD}`;
}

// ------------------------------------------------------------ 起動
function boot() {
  const canvas = $('view');
  gfx = new X.Gfx(canvas, st.quality);
  gfx.setQuality(st.quality);
  gfx.onEnv = (env) => { if (view) view.setEnv(env); };
  camctl = new X.CameraCtl(canvas);
  camctl.onTap = onTap;

  bigSpray = new X.Spray(gfx, 7000);

  gizmo = new X.SourceGizmo(gfx);

  view = new X.ShipView(gfx, sim);

  buildShipTab(); buildSeaTab(); buildNavTab(); buildDmgTab(); buildViewTab(); wireTabs(); buildTimebar(); wireTip(); wireEndcard(); wireSource();
  syncNavUI(); updateSpecs();
  window.addEventListener('resize', () => { gfx.resize(); drawInst(); });
  // 起動直後の数秒は波が立ち上がる途中
  for (let i = 0; i < 4; i++) sim.advance(0.05, 50);
  requestAnimationFrame((t) => { last = t; frame(t); const ld = $('loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 700); });
}
window.ShipLab = { sim, st, get gfx() { return gfx; }, get view() { return view; }, get cam() { return camctl; }, relaunch, setPaused };
try { boot(); }
catch (e) { $('loading').textContent = 'WebGL を初期化できませんでした: ' + e.message; console.error(e); }
})();
