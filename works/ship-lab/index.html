<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シップラボ</title>
<meta name="description" content="船の浮力・浸水・沈没を物理で解く 3D シミュレーター">
<style>
/* Layout: 全面の 3D 海原に、船橋の計器盤のようなガラスパネルを四隅に固定する */
:root {
  --sea-ink: #07111a;
  --panel: rgba(8, 17, 26, 0.80);
  --panel-hi: rgba(18, 33, 46, 0.92);
  --rule: rgba(150, 190, 215, 0.16);
  --rule-hi: rgba(150, 190, 215, 0.32);
  --fg: #dce7ee;
  --fg-dim: #8aa0b0;
  --fg-faint: #5d7282;
  --water: #4fb3e8;          /* 浸水・水に関わる情報 */
  --signal: #ff7b33;         /* 損傷操作・救命 (国際オレンジ) */
  --ok: #49c98a;
  --warn: #f0b23a;
  --danger: #ff5537;
  --sunk: #c2ccd3;
  --font-ui: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-num: "SF Mono", "Cascadia Mono", "Consolas", "BIZ UDGothic", "Menlo", monospace;
  --r: 10px;
  --gap: 12px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--sea-ink); color: var(--fg); font-family: var(--font-ui); font-size: 13px; overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#view.damage { cursor: crosshair; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.glass { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35); }
.eyebrow { font-size: 10.5px; letter-spacing: 0.12em; color: var(--fg-dim); text-transform: uppercase; }

/* ---------------- HUD */
#hud { position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); width: 318px; padding: 12px 14px 12px; display: grid; gap: 10px; }
#hud .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
#hud .brand b { font-size: 15px; letter-spacing: 0.06em; font-weight: 700; }
#hud .brand span { color: var(--fg-dim); font-size: 11px; }
.status { display: flex; align-items: center; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 8px; border-radius: 999px; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; border: 1px solid currentColor; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
.lv0 { color: var(--ok); } .lv1 { color: var(--water); } .lv2 { color: var(--warn); } .lv3 { color: var(--danger); } .lv4 { color: var(--sunk); }
.lv3 .chip, .chip.lv3 { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255, 85, 55, 0.18); } }
.status .ship { color: var(--fg-dim); font-size: 11.5px; line-height: 1.35; min-width: 0; }
.readouts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.ro { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; border-bottom: 1px solid var(--rule); padding-bottom: 3px; min-width: 0; }
.ro span { color: var(--fg-dim); font-size: 11px; white-space: nowrap; }
.ro b { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; white-space: nowrap; }
.ro b.w { color: var(--water); } .ro b.d { color: var(--danger); } .ro b.a { color: var(--warn); }
.clino { display: grid; grid-template-columns: 132px 1fr; gap: 10px; align-items: center; }
.clino canvas { width: 132px; height: 74px; display: block; }
.resbar { display: grid; gap: 4px; }
.resbar .bar { height: 7px; border-radius: 4px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.resbar .bar i { display: block; height: 100%; width: 50%; background: var(--ok); border-radius: 4px; transition: width 0.3s, background 0.3s; }
.resbar .lab { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg-dim); }
.resbar .lab b { color: var(--fg); font-family: var(--font-num); }

/* ---------------- Control panel */
#panel { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); width: 344px; max-height: calc(100% - 96px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--rule); }
.tabs button { flex: 1; border: 0; background: transparent; padding: 7px 0; border-radius: 7px; color: var(--fg-dim); cursor: pointer; font-size: 12.5px; letter-spacing: 0.04em; }
.tabs button[aria-selected="true"] { background: var(--panel-hi); color: var(--fg); box-shadow: inset 0 -2px 0 var(--water); }
.tabs button:focus-visible, .seg button:focus-visible, .btn:focus-visible, .card:focus-visible { outline: 2px solid var(--water); outline-offset: 1px; }
.pane { overflow-y: auto; padding: 12px 14px 16px; display: grid; gap: 14px; overscroll-behavior: contain; }
.pane[hidden] { display: none !important; }
.group { display: grid; gap: 9px; }
.group > h3 { margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em; color: var(--fg-dim); display: flex; justify-content: space-between; align-items: baseline; }
.group > h3 small { letter-spacing: 0; font-weight: 400; color: var(--fg-faint); font-size: 11px; }
.note { margin: 0; color: var(--fg-faint); font-size: 11px; line-height: 1.55; }
.cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.card { border: 1px solid var(--rule); background: rgba(255, 255, 255, 0.025); border-radius: 8px; padding: 7px 2px 6px; cursor: pointer; display: grid; justify-items: center; gap: 3px; text-align: center; }
.card canvas { width: 50px; height: 22px; }
.card span { font-size: 10.5px; line-height: 1.2; }
.card small { font-size: 9.5px; color: var(--fg-faint); font-family: var(--font-num); }
.card[aria-pressed="true"] { border-color: var(--water); background: rgba(79, 179, 232, 0.12); }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; align-items: center; }
.slider label { color: var(--fg-dim); font-size: 12px; }
.slider output { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; color: var(--fg); }
.slider input { grid-column: 1 / -1; width: 100%; }
input[type="range"] { -webkit-appearance: none; appearance: none; height: 18px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--water) var(--p, 50%), rgba(255, 255, 255, 0.12) var(--p, 50%)); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); }
input[type="range"]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--water); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #e9f3f9; margin-top: -5px; border: 2px solid var(--water); }
input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #e9f3f9; border: 2px solid var(--water); }
input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(79, 179, 232, 0.4); }
input[type="range"]:disabled { opacity: 0.35; cursor: default; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--rule); background: rgba(255, 255, 255, 0.025); border-radius: 7px; padding: 5px 9px; cursor: pointer; font-size: 12px; color: var(--fg-dim); }
.seg button[aria-pressed="true"] { border-color: var(--water); color: var(--fg); background: rgba(79, 179, 232, 0.14); }
.seg.scale button { flex: 1; padding: 5px 0; min-width: 0; display: grid; gap: 1px; justify-items: center; }
.seg.scale button b { font-family: var(--font-num); font-size: 12px; }
.seg.scale button span { font-size: 9.5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--rule-hi); background: rgba(255, 255, 255, 0.04); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 12.5px; }
.btn:hover { border-color: var(--water); }
.btn.signal { border-color: var(--signal); color: #ffd6c0; background: rgba(255, 123, 51, 0.12); }
.btn.signal[aria-pressed="true"] { background: var(--signal); color: #1a0d05; font-weight: 700; }
.btn.block { width: 100%; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; font-size: 12.5px; }
.switch input { appearance: none; -webkit-appearance: none; width: 34px; height: 19px; border-radius: 10px; background: rgba(255, 255, 255, 0.14); position: relative; cursor: pointer; transition: background 0.2s; flex: none; }
.switch input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 15px; height: 15px; border-radius: 50%; background: #dfe9ef; transition: transform 0.2s; }
.switch input:checked { background: var(--water); }
.switch input.sig:checked { background: var(--signal); }
.switch input:checked::after { transform: translateX(15px); }
.switch input:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }
.scen { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.scen button { text-align: left; border: 1px solid var(--rule); border-left: 3px solid var(--signal); background: rgba(255, 123, 51, 0.05); border-radius: 7px; padding: 7px 9px; cursor: pointer; font-size: 12px; line-height: 1.35; }
.scen button:hover { background: rgba(255, 123, 51, 0.13); }
.holes { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.holes li { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; font-size: 12px; padding: 5px 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.03); }
.holes li .q { font-family: var(--font-num); color: var(--water); font-size: 11.5px; }
.holes li button { border: 0; background: transparent; color: var(--fg-dim); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; margin: 0; }
.kv dt { color: var(--fg-dim); } .kv dd { margin: 0; text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---------------- Instruments (bottom-left) */
#inst { position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 470px; display: flex; flex-direction: column; overflow: hidden; }
#inst .tabs button[aria-selected="true"] { box-shadow: inset 0 -2px 0 var(--water); }
#inst .body { position: relative; height: 212px; }
#inst canvas { width: 100%; height: 100%; display: block; }
#inst .log { height: 100%; overflow-y: auto; margin: 0; padding: 8px 12px; list-style: none; display: grid; align-content: start; gap: 4px; font-size: 12px; }
.log li { display: grid; grid-template-columns: 64px 1fr; gap: 8px; line-height: 1.45; }
.log li time { font-family: var(--font-num); color: var(--fg-faint); font-size: 11.5px; }
.log li.warn span { color: var(--warn); } .log li.danger span { color: var(--danger); font-weight: 600; } .log li.info span { color: var(--fg); }
#tip { position: absolute; pointer-events: none; padding: 6px 9px; border-radius: 7px; background: var(--panel-hi); border: 1px solid var(--rule-hi); font-size: 11.5px; line-height: 1.45; white-space: nowrap; z-index: 5; }

/* ---------------- Time bar */
#timebar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 6px; }
#timebar .play { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--rule-hi); background: rgba(255, 255, 255, 0.05); cursor: pointer; display: grid; place-items: center; }
#timebar .clock { font-family: var(--font-num); font-size: 15px; font-variant-numeric: tabular-nums; min-width: 78px; text-align: center; }
#timebar .eff { font-size: 10.5px; color: var(--fg-faint); font-family: var(--font-num); min-width: 46px; }
#timebar .seg button { padding: 5px 7px; font-family: var(--font-num); }
#timebar .mob { display: none; }

#hint { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); padding: 8px 14px; font-size: 12.5px; border-color: var(--signal); color: #ffd9c4; }
#toast { position: absolute; top: calc(60px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); padding: 8px 14px; font-size: 12.5px; transition: opacity 0.4s; pointer-events: none; }
#alert { position: absolute; top: calc(104px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 13px; font-weight: 700; color: #ffd9c4; border-color: var(--danger); font-variant-numeric: tabular-nums; animation: pulse 1.2s ease-in-out infinite; }
.fab { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px 9px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--signal); color: #ffd6c0; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; cursor: pointer; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35); }
.fab[aria-pressed="true"] { background: var(--signal); color: #1a0d05; }
.fab:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }
#view.rogue { cursor: crosshair; }
#srcbar { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(62px + env(safe-area-inset-bottom, 0px)); width: 248px; padding: 10px 12px; display: grid; gap: 8px; border-color: var(--signal); z-index: 5; }
#srcbar .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#srcbar .seg button { min-width: 46px; font-size: 13px; padding: 6px 10px; }
#srcbar #src-bw { display: grid; gap: 6px; }
#srcbar #src-bw[hidden] { display: none; }
#srcbar .seg button[aria-pressed="true"] { border-color: var(--signal); background: rgba(255, 123, 51, 0.18); }
#srcbar #src-x { padding: 4px 10px; font-size: 15px; line-height: 1; }
#rglabel { position: absolute; pointer-events: none; padding: 7px 10px; font-size: 12px; line-height: 1.5; max-width: min(380px, calc(100vw - 24px)); border-color: var(--signal); z-index: 6; }
#rglabel b { font-family: var(--font-num); font-size: 15px; color: #ffd6c0; }
#rglabel .hit { color: var(--danger); font-weight: 700; } #rglabel .miss { color: var(--warn); }
#endcard { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100% - 32px)); padding: 20px 22px; display: grid; gap: 12px; border-color: var(--rule-hi); }
#endcard h2 { margin: 0; font-size: 26px; letter-spacing: 0.08em; }
#endcard p { margin: 0; color: var(--fg-dim); line-height: 1.6; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--sea-ink); color: var(--fg-dim); font-size: 13px; letter-spacing: 0.1em; transition: opacity 0.6s; z-index: 50; }

@media (max-width: 1100px) {
  #inst { width: 400px; }
  #inst .body { height: 180px; }
}
@media (max-width: 1180px) {
  /* 操作パネルと計器はボタンで開閉 (アーティファクトの横パネルなど中幅でも船が隠れないように) */
  #panel { top: auto; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); max-height: 62%; }
  #inst { bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
  #panel:not(.open), #inst:not(.open) { display: none; }
  #timebar .mob { display: inline-flex; }
  #timebar .seg { flex-wrap: nowrap; }
  #timebar .seg button.x { display: none; }
  #timebar .btn { white-space: nowrap; }
}
@media (max-width: 860px) {
  #hud { width: auto; right: calc(16px + env(safe-area-inset-right, 0px)); padding: 9px 11px; gap: 7px; }
  #hud .brand span, #hud .clino canvas { display: none; }
  #hud .clino { grid-template-columns: 1fr; }
  .resbar { grid-template-columns: 1fr 1fr 1fr; gap: 2px 10px; align-items: center; }
  .resbar .bar { grid-column: 1 / -1; order: 2; }
  .readouts { grid-template-columns: 1fr 1fr 1fr; gap: 4px 10px; }
  .readouts .opt { display: none; }
  #panel { left: calc(16px + env(safe-area-inset-left, 0px)); width: auto; max-height: 58%; }
  #inst { right: calc(16px + env(safe-area-inset-right, 0px)); width: auto; }
  #timebar { left: calc(16px + env(safe-area-inset-left, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); transform: none; justify-content: space-between; flex-wrap: nowrap; }
  #timebar .eff { display: none; }
  #timebar .seg button.x, #timebar .seg button.xm { display: none; }
  #timebar { gap: 6px; padding: 6px; }
  #timebar .clock { min-width: 0; font-size: 14px; }
  #timebar .btn { white-space: nowrap; padding: 7px 10px; }
  #timebar .seg { flex-wrap: nowrap; }
  .fab { bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
  #srcbar { bottom: calc(114px + env(safe-area-inset-bottom, 0px)); width: min(248px, calc(100vw - 32px)); }
  #panel.open ~ #srcbar, #inst.open ~ #srcbar { display: none; }
  #panel.open ~ .fab, #inst.open ~ .fab { display: none; }
}
@media (prefers-reduced-motion: reduce) { .lv3 .chip, .chip.lv3 { animation: none; } * { transition: none !important; } }

</style>
</head>
<body>
<div id="app">
  <canvas id="view" tabindex="0" aria-label="3D 海面と船"></canvas>

  <header id="hud" class="glass" aria-live="polite">
    <div class="brand"><b>シップラボ</b><span>浮力・浸水・沈没シミュレーター</span></div>
    <div class="status"><div id="chip" class="chip lv0">安定</div><div class="ship" id="shipline">—</div></div>
    <div class="clino">
      <canvas id="clino" width="264" height="148" aria-label="傾斜計"></canvas>
      <div class="resbar">
        <div class="lab"><span>予備浮力</span><b id="r-res">—</b></div>
        <div class="bar"><i id="r-resbar"></i></div>
        <div class="lab"><span>浸水量</span><b id="r-flood">—</b></div>
        <div class="lab"><span>沈没まで</span><b id="r-tsink">—</b></div>
      </div>
    </div>
    <div class="readouts">
      <div class="ro"><span>傾斜</span><b id="r-heel">—</b></div>
      <div class="ro"><span>トリム</span><b id="r-trim">—</b></div>
      <div class="ro"><span>乾舷</span><b id="r-fb">—</b></div>
      <div class="ro"><span>流入</span><b id="r-in" class="w">—</b></div>
      <div class="ro opt"><span>GM</span><b id="r-gm">—</b></div>
      <div class="ro opt"><span>速力</span><b id="r-spd">—</b></div>
      <div class="ro opt"><span>波高 Hs</span><b id="r-hs">—</b></div>
      <div class="ro opt"><span>風速</span><b id="r-wind">—</b></div>
    </div>
  </header>

  <aside id="panel" class="glass" aria-label="設定">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-ship" aria-selected="true" data-pane="p-ship">船</button>
      <button role="tab" id="tab-sea" aria-selected="false" data-pane="p-sea">海況</button>
      <button role="tab" id="tab-nav" aria-selected="false" data-pane="p-nav">航行</button>
      <button role="tab" id="tab-dmg" aria-selected="false" data-pane="p-dmg">損傷</button>
      <button role="tab" id="tab-view" aria-selected="false" data-pane="p-view">表示</button>
    </div>
    <div class="pane" id="p-ship" role="tabpanel">
      <div class="group"><h3>船種 <small>変更すると再出航</small></h3><div class="cards" id="types"></div></div>
      <div class="group" id="g-ship"></div>
      <div class="group"><h3>諸元 <small>現在の積付け</small></h3><dl class="kv" id="specs"></dl></div>
    </div>
    <div class="pane" id="p-sea" role="tabpanel" hidden>
      <div class="group"><h3>波浪階級 <small>気象庁の 10 段階</small></h3><div class="seg scale" id="presets"></div></div>
      <div class="group" id="g-wind"></div>
      <div class="group" id="g-wave"></div>
      <div class="group" id="g-swell"></div>
      <div class="group" id="g-rogue"></div>
    </div>
    <div class="pane" id="p-nav" role="tabpanel" hidden>
      <div class="group" id="g-nav"></div>
      <div class="group" id="g-pump"></div>
    </div>
    <div class="pane" id="p-dmg" role="tabpanel" hidden>
      <div class="group"><h3>破口を開ける</h3>
        <button class="btn signal block" id="dmgmode" aria-pressed="false">船体をクリックして破口を開ける</button>
        <div id="g-hole"></div>
      </div>
      <div class="group"><h3>事故シナリオ</h3><div class="scen" id="scen"></div></div>
      <div class="group" id="g-open"><h3>開口部</h3></div>
      <div class="group"><h3>破口一覧 <small id="holesum"></small></h3><ul class="holes" id="holes"></ul>

<script>
/* =====================================================================
 * シップラボ — 物理コア (physics.js)
 * 依存なし・DOM なし・決定論的。Node テストとブラウザの両方で同一コードを使う。
 *
 * 座標系
 *   world : X,Z 水平, Y 上向き (Three.js と同じ)
 *   body  : x 船首方向, y 上向き (y=0 が基線=キール), z 右舷方向, x=0 は船体中央
 *   ヒール φ>0 = 右舷側へ傾斜, トリム θ>0 = 船首上げ

 *   波      : JONSWAP + cos^2s 方向分布 + うねり。単一和法の Gerstner 波 (CPU/GPU 同一式)
 *   浮力    : 64 ステーションの断面多角形を局所波面で切断 (Sutherland–Hodgman)。

 *   判定    : 予備浮力 < 0 → 沈没確定、|φ|>90° 持続 → 転覆、全没 → 沈没、海底接触 → 着底

    this.hb = H / BW_GAMMA;                                              // 想定する浅瀬の水深 (波の変形だけに使う)
    this.Hn = BW_SET[N].map(r => r * H);

  /** n 番目の峰 (0 = 先頭) の位置 (始点基準・進行方向) */
  crest(n, t) { return this.s0 + this.c * (t - this.t0) - n * this.L; }
  expired(t) { return this.crest(this.N - 1, t) > this.sEnd; }

  fade(t) { const x = (this.crest(this.N - 1, t) - (this.sEnd - this.L)) / this.L; return 1 - sm01(x); }
  /** 峰 n の位置 v (峰方向) での状態 → st: {H, steep (0..1), b (巻きの段階 0..2), ww (白波), Lf (前面長), ac, at, q} */
  state(C, Hn, v, st) {

    const onR = sm01((v + 0.1 * L) / (0.15 * L)) * (1 - sm01((v - this.LrC + 0.05 * L) / (0.15 * L)));
    const g = sm01((v - this.vMin) / this.M) * (1 - sm01((v - (this.vMax - this.M)) / this.M));

    const H = Hn * (0.6 + (fA - 0.6) * onR) * g;

    const b = onR * clamp(d / this.dP, 0, 2);
    const ww = onR * sm01((d / this.dP - 0.7) / 0.4) * Math.exp(-dd / (1.5 * L));

  /** 進行方向の座標 s・峰方向の座標 v での水面高と白波 → out [eta, foam, roller(0..1)] */
  profile(s, v, t, out) {
    const N = this.N, L = this.L, R = 0.35 * L, S = this._st || (this._st = [{}, {}, {}, {}]), Cs = this._cs || (this._cs = [0, 0, 0, 0]);

      roll = Math.max(roll, Math.max(a.ww * win, pitch * winC));
    }
    const f = this.fade(t);
    out[0] = eta * f; out[1] = foam * f; out[2] = roll * f;
    return out;
  }
  /** world (x,z) の水面高・流速。out [eta, ux, uy(=∂η/∂t), uz, foam] */
  evalAt(x, z, t, out) {
    const rx = x - this.R1[0], rz = z - this.R1[1];

      if (os.kind === 'rect') { o.nrm = os.nrm; o.w = os.w * s; o.h = os.h * s; o.area = o.w * o.h; o.wv = os.wAxis === 'z' ? [0, 0, o.w] : [o.w, 0, 0]; o.hv = [0, o.h, 0]; }

      // 船内経由の吸気口 (例: フェリー機関室吸気は車両甲板上にあるが機関室へ通じる)
      if (o.via != null) { o.b = -1; }
      mk(o);
    }
    // オープン区画の舷縁 (ガンネル) 堰
    for (const c of this.comps) {
      if (!c.open) continue;
      const nseg = 14, i0 = c.stations[0].i, i1 = c.stations[c.stations.length - 1].i;
      for (let side = -1; side <= 1; side += 2) {
        for (let k = 0; k < nseg; k++) {
          const xa = this.st[i0].x - this.dx / 2 + (k + 0.5) * (c.x1 - c.x0) / nseg;
          const u = hull.u(xa), yd = hull.deck(u);
          mk({ kind: 'weir', label: '舷縁', group: 'gunwale', a: c.id, b: -1, pos: [xa, yd, side * hull.halfWidth(u, yd)], width: (c.x1 - c.x0) / nseg, open: 1, Cd: 0.6 });
        }
      }
    }
    // 船倉ハッチ (コンテナ船)
    if (t.hatches) {
      for (const c of this.comps) {
        if (c.kind !== 'hold') continue;
        const xm = (c.x0 + c.x1) / 2, u = hull.u(xm);
        const area = t.hatches.area * (c.x1 - c.x0) * this.B;
        mk({ kind: 'hole', label: c.name + 'ハッチ', group: 'hatch', a: c.id, b: -1, pos: [xm, hull.deck(u) + t.hatches.coaming * s, 0], nrm: [0, 1, 0], r: Math.sqrt(area / Math.PI), area, open: 0, Cd: 0.6 });
      }
    }
    // 隔壁甲板上の非水密開口 (フェリー: 下層区画 → 車両甲板)
    if (t.trunks) {
      const up = findComp(t.trunks.to);
      for (const c of this.comps) {
        if (c === up || c.box.y1 > t.trunks.y * s + 1e-6) continue;
        const xm = (c.x0 + c.x1) / 2;
        const area = t.trunks.area * s * s;
        mk({ kind: 'hole', label: c.name + '→' + up.name + ' 開口', group: 'trunk', a: c.id, b: up.id, pos: [xm, (t.trunks.y + (t.trunks.coaming || 0)) * s, 0.3 * this.B], nrm: [0, 1, 0], r: Math.sqrt(area / Math.PI), area, open: 1, Cd: 0.6 });

    // 水密扉 (下層の隣接区画間)
    if (t.doors) {
      const lower = this.comps.filter(c => c.box.y1 <= (t.carDeck || 1e9) * s + 1e-6).sort((p, q) => p.x0 - q.x0);
      for (let k = 0; k + 1 < lower.length; k++) {
        const a = lower[k], b = lower[k + 1];
        if (Math.abs(a.x1 - b.x0) > this.dx * 0.6) continue;
        mk({ kind: 'rect', label: a.name + '⇔' + b.name + ' 水密扉', group: 'wtdoor', a: a.id, b: b.id, pos: [a.x1, t.doors.y * s, 0], nrm: [1, 0, 0], w: t.doors.w * s, h: t.doors.h * s, wv: [0, 0, t.doors.w * s], hv: [0, t.doors.h * s, 0], area: t.doors.w * t.doors.h * s * s, open: 0, Cd: 0.6 });
      }
    }
    this.holes = [];
  }

  buildMass() {
    const t = this.type, s = this.s, hull = this.hull;
    // 設計喫水での排水量 (直立・等喫水)
    let Vd = 0;
    for (const st of this.st) {
      const ds = new Float64Array(st.n); for (let j = 0; j < st.n; j++) ds[j] = this.T - st.y[j];
      const r = clipWet(st.z, st.y, ds, st.n, {}); Vd += r.A * this.dx;
    }
    this.Vdesign = Vd;
    const dispFull = RHO * Vd;
    // 積荷区画の容積から DW を決める (タンカーは油の容積から、他は lsFrac から)
    const items = [];
    const compsFor = (d) => d.comp === 'H' ? this.comps.filter(c => c.spec.H) : d.comp === 'C' ? this.comps.filter(c => c.spec.C) : [this.compByName[d.comp]].filter(Boolean);
    let lsMass;
    if (t.lsFrac != null) lsMass = t.lsFrac * dispFull;
    else {
      // タンカー: 98% 充填の油量 / 0.95 = DW
      const cargo = this.comps.filter(c => c.spec.C).reduce((a, c) => a + c.Vg, 0) * 850 * 0.98;
      lsMass = dispFull - cargo / 0.95;
    }
    const DW = dispFull - lsMass;
    this.lsMass = lsMass; this.DWfull = DW;
    const L = this.L;
    // 積荷の配置 (積載率 ld)
    const makeCargo = (ld, apply) => {
      const items = [];
      for (const d of t.dw) {
        const m = d.frac * DW * ld;
        if (d.pt) { items.push({ m, pos: [(d.pt[0] - 0.5) * L, d.pt[1] * this.D, 0], label: d.label, deckCargo: !!d.deckCargo }); continue; }
        const cs = compsFor(d), Vtot = cs.reduce((a, c) => a + c.Vg, 0);
        for (const c of cs) {
          const mc = m * c.Vg / Vtot;
          const fill = clamp(mc / (d.density * c.Vg), 0, 0.98);
          const g = this.fillCentroid(c, fill);
          items.push({ m: mc, pos: g, label: d.label, comp: c.id });
          if (apply) { c.cargoFill = fill; c.muBase = c.muBase * (1 - fill * (1 - d.porosity)); }
        }
      }
      return items;
    };
    // 設計状態 (満載・等喫水) の静水力: LCB, KB, BM
    let Vh = 0, mxh = 0, myh = 0, IT = 0; const rr = {};
    for (const st of this.st) {
      const ds = new Float64Array(st.n); for (let j = 0; j < st.n; j++) ds[j] = this.T - st.y[j];
      clipWet(st.z, st.y, ds, st.n, rr); const v = rr.A * this.dx;
      Vh += v; mxh += v * st.x; myh += v * rr.cy;
      const hw = hull.halfWidth(st.u, this.T); IT += (2 / 3) * hw * hw * hw * this.dx;
    }
    this.LCB = mxh / Vh; this.KB = myh / Vh; this.BM = IT / Vh; this.KM = this.KB + this.BM;
    // 満載時に GM = 設計 GM, LCG = LCB (等喫水) となるよう軽荷重量の重心を決める 推定/C
    const full = makeCargo(1, false);
    const mFull = lsMass + full.reduce((a, c) => a + c.m, 0);
    const KGreq = this.KM - t.gm * this.s;
    let kgLS = (KGreq * mFull - full.reduce((a, c) => a + c.m * c.pos[1], 0)) / lsMass;
    kgLS = clamp(kgLS, 0.12 * this.D, 1.3 * this.D);
    let lcgLS = (this.LCB * mFull - full.reduce((a, c) => a + c.m * c.pos[0], 0)) / lsMass;
    lcgLS = clamp(lcgLS, -0.35 * L, 0.35 * L);
    this.lsG = [lcgLS, kgLS + this.kgShift, 0];
    this.cargo = makeCargo(this.load, true).map(c => ({ ...c, pos: [c.pos[0], c.pos[1] + this.kgShift, c.pos[2]] }));
    for (const c of this.comps) {
      c.mu = Math.max(0.01, c.muBase);
      c.cap = c.mu * c.Vg;
    }
    // バラスト (積載率 < 50% で自動注水) — 初期水量として台帳に計上
    const bf = clamp((0.5 - this.load) / 0.5, 0, 1);
    for (const c of this.comps) if (c.spec.ballast) c.V = bf * c.cap;
    // 固定質量と重心・慣性
    let m = lsMass, gx = lsMass * this.lsG[0], gy = lsMass * this.lsG[1], gz = 0;
    for (const c of this.cargo) { m += c.m; gx += c.m * c.pos[0]; gy += c.m * c.pos[1]; gz += c.m * c.pos[2]; }
    this.ms = m; this.Gs = [gx / m, gy / m, gz / m];
    // 慣性半径 推定/C: kxx=0.35B, kyy=0.25L, kzz=0.26L (付加慣性は別途)
    this.Is = [m * Math.pow(0.35 * this.B, 2), m * Math.pow(0.26 * L, 2), m * Math.pow(0.25 * L, 2)]; // body x, y(yaw), z(pitch)
    this.dispNow = m + this.comps.reduce((a, c) => a + RHO * c.V, 0);
    // 風圧面積 (上部構造)
    this.supers = (t.supers || []).map(b => {
      const um = (b.u0 + b.u1) / 2;
      const y0 = typeof b.y0 === 'string' ? (b.y0 === 'deck' ? hull.deck(um) : this.resolveY(b.y0, um)) : b.y0 * s;
      return { x0: (b.u0 - 0.5) * L, x1: (b.u1 - 0.5) * L, y0, y1: y0 + b.h * s, w: b.w * this.B, kind: b.kind };
    });
  }
  /** 区画の下から体積比 f を占める部分の図心 (直立) */
  fillCentroid(c, f) {
    if (f <= 0) return [(c.x0 + c.x1) / 2, c.yminB, 0];
    let lo = c.yminB, hi = c.ymaxB, res = {};
    const target = f * c.Vg;
    const evalH = (h) => {
      let V = 0, mx = 0, my = 0, mz = 0;
      for (const p of c.stations) {
        const ds = new Float64Array(p.n); for (let j = 0; j < p.n; j++) ds[j] = h - p.y[j];
        clipWet(p.z, p.y, ds, p.n, res);
        const v = res.A * this.dx; V += v; mx += v * p.x; my += v * res.cy; mz += v * res.cz;
      }
      return [V, mx, my, mz];
    };
    for (let it = 0; it < 60; it++) { const h = (lo + hi) / 2; if (evalH(h)[0] < target) lo = h; else hi = h; }
    const r = evalH((lo + hi) / 2);
    return [r[1] / r[0], r[2] / r[0], r[3] / r[0]];
  }

  /** 船体表面の点 (body) から区画を特定 */
  compAt(pb, nb) {
    const k = 0.03 * Math.max(this.B, 0.5);
    const x = pb[0] - nb[0] * k, y = pb[1] - nb[1] * k, z = pb[2] - nb[2] * k;
    const u = this.hull.u(x);
    let best = null;
    for (const c of this.comps) {
      if (x < c.x0 || x > c.x1) continue;
      const b = c.box;
      if (y < b.y0 - 1e-6 || y > (isFinite(b.y1) ? b.y1 : this.hull.deck(u)) + 1e-6) continue;
      if (z < b.z0 - 1e-6 || z > b.z1 + 1e-6) continue;
      best = c; break;
    }
    if (!best) {
      // 最寄り区画 (箱の距離)
      let dmin = 1e30;
      for (const c of this.comps) {
        const b = c.box, y1 = isFinite(b.y1) ? b.y1 : this.hull.deck(u);
        const dxv = Math.max(c.x0 - x, 0, x - c.x1), dyv = Math.max(b.y0 - y, 0, y - y1), dzv = Math.max(b.z0 - z, 0, z - b.z1);
        const d = Math.hypot(dxv, dyv, dzv); if (d < dmin) { dmin = d; best = c; }
      }
      if (dmin > 0.08 * this.B + 0.05) return null;
    }
    return best;
  }
}

// ============================================================ SIMULATION
class Sim {
  constructor() {
    this.waves = new WaveField();
    this.R = new Float64Array(9);
    this.res = {};
    this.ds = new Float64Array(64);
    this.evalOut = new Float64Array(4);
    this.seaParams = { wind: 8, fetch: 300, manual: false, Hs: 1.5, Tp: 7, gamma: 3.3, dir: 0, spread: 10, swellHs: 0.8, swellTp: 11, swellRel: 40, swellSpread: 40, chop: 0.9, nl: 1.0, gust: 0.15, seed: 7 };
    this.nav = { speedKn: 0, rel: 0, engine: true };
    this.depth = 200;
    this.pumpsOn = true; this.pumpFactor = 1;
  }

  // ------------------------------------------------------------ setup
  configure(typeKey, opts) {
    this.ship = new Ship(typeKey, opts);
    const sh = this.ship;
    // 前の船の派生キャッシュを捨てる
    this.wetDes = 0; this.gustW = null; this.netF = 0; this.flowIn = 0; this.flowOut = 0; this.acc = 0;
    this.contact = false; this.settled = false; this.uSurge = 0; this.thrust = 0; this.windNow = 0;
    this.stWet = this.stVy = this.stCh = this.stCy = null; this._all = this._flows = null;
    this.typeKey = typeKey;
    this.t = 0;
    this.events = [];
    this.ledger = { V0: sh.comps.reduce((a, c) => a + c.V, 0), inSea: 0, outSea: 0, pumped: 0 };
    for (const c of sh.comps) c.V0 = c.V;
    this.stat = {};
    this.flags = {};
    this.maxHeel = 0;
    this.sunkT = null; this.capsizeT = null;
    this.capTimer = 0; this.subTimer = 0;
    this.gzState = null; this.gzIntact = null; this.gzCurrent = null;
    // 付加質量比 推定/C (没水率で縮尺)
    this.addM = [0.05, 1.0, 0.8];       // surge, heave, sway  (body x,y,z)
    this.addI = [0.25, 0.8, 1.0];       // roll, yaw, pitch
    // 初期姿勢: 静水平衡
    const eq = this.staticBalance(0, null, { trim: 0, py: -sh.T });
    const psi = this.headingTarget();
    this.q = poseQuat(psi, eq ? eq.trim : 0, 0);
    quatToMat(this.q, this.R);
    this.p = [0, eq ? eq.py : -sh.T, 0];
    this.v = [0, 0, 0];          // body origin velocity (world)
    this.w = [0, 0, 0];          // angular velocity (body)
    const u0 = this.nav.engine ? this.nav.speedKn * KN : 0;
    this.v[0] = Math.cos(psi) * u0; this.v[2] = Math.sin(psi) * u0;
    this.thrustI = 0;
    // 横揺れ減衰係数 (無損傷 GM から) 推定/C
    const gm = this.gmIntact = this.computeGM();
    const I44 = sh.Is[0] * (1 + this.addI[0]);
    const K44 = sh.ms * G * Math.max(0.05 * sh.B * 0.02 + 0.01, gm);
    // 横揺れ減衰: 線形 ζ=0.03 + 二次項 (ビルジキール・付加物・渦) を振幅 20° で等価 ζ=0.06 となるよう較正 推定/C
    const crit = 2 * Math.sqrt(K44 * I44), wn = Math.sqrt(K44 / I44), phiRef = 20 * Math.PI / 180;
    this.B44 = 0.03 * crit;
    this.Troll = TAU / wn;
    this.listF = 0; this.trimF = 0;
    this.B44q = 0.06 * crit * 3 * Math.PI / (8 * wn * phiRef);
    this.B66 = 0.04 * sh.Is[1] * (1 + this.addI[1]) * Math.sqrt(G / sh.L);
    // 波 (凪からランプ)
    this.waves.sets = []; this.waves.focus = null; this.rogueN = 0; this.waves.dists = []; this.waves.breakers = []; this.srcN = 0; this.srcPredT = 0; this.bwN = 0;
    this.applySea(true);
    this.gridInit();
    this.updateGrid();
    this.updateLevels();
    this.computeStatus(0);
    this.log('info', `${sh.type.name} 全長 ${sh.L.toFixed(1)} m・排水量 ${fmtMass(this.dispNow())} で出航`);
    this.gzIntact = this.gzCurve(false);
    return this;
  }
  dispNow() { return this.ship.ms + this.ship.comps.reduce((a, c) => a + RHO * c.V, 0); }
  headingTarget() {
    // 波の来る方向 μ (船首から右回り) → 船首方位 ψ = θw − μ − π
    return wrapPi(this.seaParams.dir - this.nav.rel * Math.PI / 180 - Math.PI);
  }
  seaState() {
    const p = this.seaParams;
    let Hs = Math.min(HS_MAX, p.Hs), Tp = p.Tp;
    if (!p.manual) { const r = Waves.seaFromWind(p.wind, p.fetch); Hs = r.Hs; Tp = r.Tp; }
    return { Hs, Tp, steep: Hs > 0 ? Hs / (G * Tp * Tp / TAU) : 0 };
  }
  applySea(initial) {
    const p = this.seaParams, ss = this.seaState();
    const shortL = clamp(0.4 * this.ship.L, 0.8, 40);
    const comps = Waves.buildSet({ Hs: ss.Hs, Tp: ss.Tp, gamma: p.gamma, dir: p.dir, spread: p.spread,
      swellHs: p.swellHs, swellTp: p.swellTp, swellDir: p.dir + p.swellRel * Math.PI / 180, swellSpread: p.swellSpread, seed: p.seed }, shortL);
    this.waves.chopUser = p.chop; this.waves.nlUser = p.nl == null ? 1 : p.nl;
    if (initial) { this.waves.sets = []; this.waves.blendTime = 5; this.waves.setTarget(comps, false); }
    else { this.waves.blendTime = 4; this.waves.setTarget(comps, false); }
    this.seaHs = ss.Hs; this.seaTp = ss.Tp;
  }
  setSea(params) { Object.assign(this.seaParams, params); this.applySea(false); }

  // ------------------------------------------------------------ water grid
  gridInit() {
    const sh = this.ship;
    const g = this.grid = {};
    g.La = (sh.hull.xMax - sh.hull.xMin) / 2 + 0.06 * sh.L + 0.3;
    g.Wb = 0.5 * Math.hypot(sh.B, sh.D * 1.3) + 0.06 * sh.L + 0.3;
    g.ax = 1; g.az = 0; g.na = 0; g.nb = 0;
    const NG = 25 * 11;
    g.eta = new Float64Array(NG); g.ux = new Float64Array(NG); g.uy = new Float64Array(NG); g.uz = new Float64Array(NG); g.eta0 = new Float64Array(NG);
    g.age = 1e9; g.t0 = 0; g.cx = 0; g.cz = 0;
  }
  /**
   * 船体周りの水面格子。毎ステップの完全評価は重いので、最短成分周期の 1/40 以内は
   * η(t0+τ) ≈ η(t0) + ∂η/∂t·τ で時間外挿する (振幅誤差 ~1%) 推定/C
   */
  updateGrid(force) {
    const sh = this.ship, g = this.grid, R = this.R, p = this.p, wf = this.waves;
    const xm = (sh.hull.xMin + sh.hull.xMax) / 2, ym = sh.D / 2;
    const cx = p[0] + R[0] * xm + R[1] * ym, cz = p[2] + R[6] * xm + R[7] * ym;
    const tau = this.t - g.t0;
    // 波源を持ち上げている最中 (高さが変わった) は外挿せず評価し直す
    for (const d of wf.dists) if (d.dirty) { force = true; d.dirty = false; }
    if (!force && g.na && tau < g.tauMax && Math.hypot(cx - g.cx, cz - g.cz) < 0.35 * Math.min(g.da, g.db)) {
      const n = g.na * g.nb; let emin = 1e9, emax = -1e9;
      for (let k = 0; k < n; k++) { const e = g.eta0[k] + g.uy[k] * tau; g.eta[k] = e; if (e < emin) emin = e; if (e > emax) emax = e; }
      g.emin = emin; g.emax = emax;
      return;
    }
    // 解像度: 最短有効波長の 1/3 間隔 (ただし船長の 1/16 より細かくしない)
    let lmin = 1e9;
    for (let i = 0; i < wf.n; i++) if (wf.a[i] * wf.kk[i] > 0.002 * wf.steep) lmin = Math.min(lmin, TAU / wf.kk[i]);
    for (const d of wf.dists) if (d.amp(this.t) > 0) lmin = Math.min(lmin, 1.5 * d.R);
    for (const b of wf.breakers) lmin = Math.min(lmin, 1.1 * b.H);   // 急な前面 (長さ ≈1.1H) を 3 点以上で
    const sp = Math.max(lmin / 3, sh.L / 16, 0.05);
    g.na = clamp(Math.ceil(2 * g.La / sp) + 1, 7, 25); g.nb = clamp(Math.ceil(2 * g.Wb / sp) + 1, 5, 11);
    g.cx = cx; g.cz = cz; g.t0 = this.t;
    let ax = R[0], az = R[6]; const hn = Math.hypot(ax, az);
    if (hn > 0.15) { ax /= hn; az /= hn; g.ax = ax; g.az = az; } else { ax = g.ax; az = g.az; }
    g.bx = -az; g.bz = ax;
    g.da = 2 * g.La / (g.na - 1); g.db = 2 * g.Wb / (g.nb - 1);
    g.ox = cx - ax * g.La - g.bx * g.Wb; g.oz = cz - az * g.La - g.bz * g.Wb;
    let emin = 1e9, emax = -1e9;
    const out = this.evalOut, t = this.t;
    // 格子間隔の 2.5 倍未満の波長はエイリアスするので格子評価から除外 (船体平均で寄与は小さい)
    wf.cut = TAU / (2.5 * Math.max(g.da, g.db));
    let wmax = 0; for (let i = 0; i < wf.n; i++) if (wf.kk[i] <= wf.cut) wmax = Math.max(wmax, wf.w[i]);
    g.tauMax = wmax > 0 ? TAU / wmax / 40 : 0.05;
    for (const d of wf.dists) if (d.amp(t) > 0) g.tauMax = Math.min(g.tauMax, d.t0 == null ? 0.25 : d.Tmin / 40);
    for (const b of wf.breakers) g.tauMax = Math.min(g.tauMax, 1.2 * b.H / b.c / 12);   // 急な前面 (長さ ~1.2H) が波速で通り過ぎる時間の 1/12
    if (wf.dists.length) wf.prepareDist(t, cx, cz, Math.hypot(g.La, g.Wb));
    for (let i = 0; i < g.na; i++) for (let j = 0; j < g.nb; j++) {
      const X = g.ox + ax * i * g.da + g.bx * j * g.db, Z = g.oz + az * i * g.da + g.bz * j * g.db;
      wf.evalAt(X, Z, t, out, wf.cut);
      const k = i * g.nb + j; g.eta[k] = out[0]; g.eta0[k] = out[0]; g.ux[k] = out[1]; g.uy[k] = out[2]; g.uz[k] = out[3];
      if (out[0] < emin) emin = out[0]; if (out[0] > emax) emax = out[0];
    }
    g.emin = emin; g.emax = emax;
  }
  /** 格子から双線形補間。which: 0 eta,1 ux,2 uy,3 uz → out */
  sampleGrid(X, Z, out) {
    const g = this.grid;
    const dx = X - g.ox, dz = Z - g.oz;
    let fi = (dx * g.ax + dz * g.az) / g.da, fj = (dx * g.bx + dz * g.bz) / g.db;
    fi = clamp(fi, 0, g.na - 1.000001); fj = clamp(fj, 0, g.nb - 1.000001);
    const i = fi | 0, j = fj | 0, ti = fi - i, tj = fj - j;
    const k = i * g.nb + j, nb = g.nb;
    const w00 = (1 - ti) * (1 - tj), w10 = ti * (1 - tj), w01 = (1 - ti) * tj, w11 = ti * tj;
    out[0] = g.eta[k] * w00 + g.eta[k + nb] * w10 + g.eta[k + 1] * w01 + g.eta[k + nb + 1] * w11;
    if (out.length > 1) {
      out[1] = g.ux[k] * w00 + g.ux[k + nb] * w10 + g.ux[k + 1] * w01 + g.ux[k + nb + 1] * w11;
      out[2] = g.uy[k] * w00 + g.uy[k + nb] * w10 + g.uy[k + 1] * w01 + g.uy[k + nb + 1] * w11;
      out[3] = g.uz[k] * w00 + g.uz[k + nb] * w10 + g.uz[k + 1] * w01 + g.uz[k + nb + 1] * w11;
    }
    return out;
  }
  etaAt(X, Z) {
    const g = this.grid;
    const dx = X - g.ox, dz = Z - g.oz;
    let fi = (dx * g.ax + dz * g.az) / g.da, fj = (dx * g.bx + dz * g.bz) / g.db;
    fi = clamp(fi, 0, g.na - 1.000001); fj = clamp(fj, 0, g.nb - 1.000001);
    const i = fi | 0, j = fj | 0, ti = fi - i, tj = fj - j, k = i * g.nb + j, nb = g.nb;
    return g.eta[k] * (1 - ti) * (1 - tj) + g.eta[k + nb] * ti * (1 - tj) + g.eta[k + 1] * (1 - ti) * tj + g.eta[k + nb + 1] * ti * tj;
  }

  // ------------------------------------------------------------ compartments
  /** 区画 c の world 水平面 H 以下の幾何体積 (図心・自由表面弦長も) — R,py は姿勢 */
  compGeomBelow(c, H, R, py, acc) {
    const res = this.res, ds = this.ds, dx = this.ship.dx;
    let V = 0, mx = 0, my = 0, mz = 0, dVdH = 0;
    const gn = Math.hypot(R[4], R[5]);
    for (const p of c.stations) {
      const base = py + R[3] * p.x;
      for (let j = 0; j < p.n; j++) ds[j] = H - (base + R[4] * p.y[j] + R[5] * p.z[j]);
      clipWet(p.z, p.y, ds, p.n, res);
      const v = res.A * dx;
      V += v; mx += v * p.x; my += v * res.cy; mz += v * res.cz;
      if (gn > 1e-9) dVdH += res.chord * dx / gn;
    }
    if (acc) { acc.V = V; acc.cx = V > 0 ? mx / V : 0; acc.cy = V > 0 ? my / V : 0; acc.cz = V > 0 ? mz / V : 0; acc.dVdH = dVdH; }
    return V;
  }
  compExtent(c, R, py) {
    let lo = 1e30, hi = -1e30, jhi = null;
    for (const p of c.stations) {
      const base = py + R[3] * p.x;
      for (let j = 0; j < p.n; j++) {
        const y = base + R[4] * p.y[j] + R[5] * p.z[j];
        if (y < lo) lo = y; if (y > hi) { hi = y; jhi = [p.x, p.y[j], p.z[j]]; }
      }
    }
    c.bot = lo; c.top = hi; c.topB = jhi;
  }
  /** 水量 V → 水位 H (Illinois 法 + Newton) */
  solveLevel(c, R, py, acc) {
    this.compExtent(c, R, py);
    const V = c.V;
    if (V <= 1e-12) { c.H = c.bot; acc.V = 0; acc.cx = (c.x0 + c.x1) / 2; acc.cy = c.yminB; acc.cz = 0; acc.dVdH = 0; return c.bot; }
    if (V >= c.cap) {
      // 満水: 水位は最高点。図心は全容積の図心 (丸め誤差の超過分は最高点に置く)
      if (!c.gFull) { const a2 = {}; c.gFull = a2; }
      this.compGeomBelow(c, c.top + 1e-9, R, py, acc);
      const ex = (V - c.cap) / c.mu, Vg = acc.V, tb = c.topB;
      acc.cx = (acc.cx * Vg + tb[0] * ex) / (Vg + ex); acc.cy = (acc.cy * Vg + tb[1] * ex) / (Vg + ex); acc.cz = (acc.cz * Vg + tb[2] * ex) / (Vg + ex);
      acc.dVdH = 0;
      c.H = c.top; return c.top;
    }
    const target = V / c.mu;
    let a = c.bot, b = c.top, fa = -target, fb = c.Vg - target;
    let H = (c.H > a && c.H < b) ? c.H : a + (b - a) * (target / c.Vg);
    let side = 0;
    for (let it = 0; it < 50; it++) {
      const f = this.compGeomBelow(c, H, R, py, acc) - target;
      if (Math.abs(f) <= 1e-9 * c.Vg + 1e-12) break;
      if (f < 0) { a = H; fa = f; if (side === -1) fb *= 0.5; side = -1; } else { b = H; fb = f; if (side === 1) fa *= 0.5; side = 1; }
      let Hn = acc.dVdH > 1e-12 ? H - f / acc.dVdH : NaN;
      if (!(Hn > a && Hn < b)) Hn = (a * fb - b * fa) / (fb - fa);
      if (!(Hn > a && Hn < b)) Hn = 0.5 * (a + b);
      if (Math.abs(b - a) < 1e-7 * c.hBody) break;
      H = Hn;
    }
    c.H = H; return H;
  }
  volAt(c, H, R, py) {
    if (H <= c.bot) return 0;
    if (H >= c.top) return c.cap;
    return c.mu * this.compGeomBelow(c, H, R, py, null);
  }
  updateLevels() {
    const R = this.R, py = this.p[1], acc = {};
    for (const c of this.ship.comps) {
      this.solveLevel(c, R, py, acc);
      c.cx = acc.cx; c.cy = acc.cy; c.cz = acc.cz; c.fs = acc.dVdH * c.mu;
    }
  }

  // ------------------------------------------------------------ openings / flow
  openingWorld(o, out) {
    const R = this.R, p = this.p, b = o.pos;
    out.X = p[0] + R[0] * b[0] + R[1] * b[1] + R[2] * b[2];
    out.Y = p[1] + R[3] * b[0] + R[4] * b[1] + R[5] * b[2];
    out.Z = p[2] + R[6] * b[0] + R[7] * b[1] + R[8] * b[2];
    let ext = 0;
    if (o.kind === 'hole') { const ny = R[3] * o.nrm[0] + R[4] * o.nrm[1] + R[5] * o.nrm[2]; ext = o.r * Math.sqrt(Math.max(0, 1 - ny * ny)); }
    else if (o.kind === 'rect') { ext = 0.5 * (Math.abs(R[3] * o.hv[0] + R[4] * o.hv[1] + R[5] * o.hv[2]) + Math.abs(R[3] * o.wv[0] + R[4] * o.wv[1] + R[5] * o.wv[2])); }
    out.ext = ext;
    return out;
  }
  /** 開口の流量 (a→b 正)。Ha,Hb: 両側水位, Y: 開口中心, ext: 鉛直半幅 */
  openingFlow(o, Ha, Hb, Y, ext) {
    const f = o.open; if (f <= 0) return 0;
    const up = Math.max(Ha, Hb), sgn = Ha >= Hb ? 1 : -1;
    if (o.kind === 'weir') {
      if (up <= Y) return 0;
      const H1 = up - Y, H2 = Math.max(0, Math.min(Ha, Hb) - Y);
      const sub = Math.pow(Math.max(0, 1 - Math.pow(H2 / H1, 1.5)), 0.385);   // Villemonte
      return sgn * f * o.Cd * (2 / 3) * o.width * Math.sqrt(2 * G) * Math.pow(H1, 1.5) * sub;
    }
    const dn0 = Math.min(Ha, Hb);
    const A = o.area * f;
    if (ext < 1e-6) {
      if (up <= Y) return 0;
      return sgn * o.Cd * A * Math.sqrt(2 * G * (up - Math.max(dn0, Y)));
    }
    const K = 6; let q = 0, wsum = 0;
    for (let k = 0; k < K; k++) {
      const yk = Y - ext + (k + 0.5) * 2 * ext / K;
      const wk = o.kind === 'hole' ? Math.sqrt(Math.max(0, 1 - Math.pow((yk - Y) / ext, 2))) : 1;
      wsum += wk;
      if (up <= yk) continue;
      q += wk * Math.sqrt(2 * G * (up - Math.max(dn0, yk)));
    }
    return sgn * o.Cd * A * q / wsum;
  }
  /**
   * 船首波 (自船の造波) による局所水位上昇 — 船首部の開口にのみ適用。
   * よどみ点水頭 U²/2g の 0.6 倍を船首端で与え、0.06L で減衰 推定/C
   */
  bowWave(pb, nb) {
    const sh = this.ship, u = Math.max(0, this.uSurge || 0);
    if (u < 0.5) return 0;
    const xs = sh.L / 2 + sh.L * sh.hull.p.rake * 0.3;
    const d = Math.max(0, xs - pb[0]);
    // 前向き開口はラム圧 (よどみ点水頭そのもの) を受ける
    const k = 0.6 + 0.4 * Math.max(0, nb ? nb[0] : 0);
    return k * u * u / (2 * G) * Math.exp(-d / (0.06 * sh.L));
  }
  /** 区画ごとの接続開口リストを再構築 */
  rebuildOps() {
    const sh = this.ship;
    for (const c of sh.comps) c.ops = [];
    for (const o of sh.openings.concat(sh.holes)) { sh.comps[o.a].ops.push(o); if (o.b >= 0) sh.comps[o.b].ops.push(o); }
  }
  /**
   * 浸水の 1 ステップ。
   *  - 未満水区画: 水量 V から水位 (貯留)
   *  - 満水区画  : 貯留なしの加圧ノード。流入=流出となる圧力水頭 H を二分法で解く (Gauss–Seidel 3 回)
   *  - 流量は開口ごとのストリップ・オリフィス/堰。貯留区画は水位が交差しない量に制限
   */
  floodStep(dt) {
    const sh = this.ship, comps = sh.comps, R = this.R, py = this.p[1];
    if (!comps[0].ops) this.rebuildOps();
    const all = this._all || (this._all = []); all.length = 0;
    const ow = {};
    for (const o of sh.openings) if (o.open > 0) all.push(o);
    for (const o of sh.holes) if (o.open > 0) all.push(o);
    for (const c of comps) { c.full = c.V >= c.cap * (1 - 1e-9); c.Hh = c.full ? c.top : (c.V > 1e-12 ? c.H : c.bot); c.nAct = 0; }
    for (const o of all) {
      this.openingWorld(o, ow); o.wy = ow.Y; o.ext = ow.ext;
      if (o.b < 0) {
        o.sea = this.etaAt(ow.X, ow.Z) + this.bowWave(o.pos, o.nrm);
        // 他区画内に開口する吸気口などは、その区画の水位にも浸かる
        if (o.via != null) { const cv = comps[o.via]; if (cv.V > 1e-12) o.sea = Math.max(o.sea, cv.Hh); }
      }
    }
    // 風雨密閉鎖 (ハッチカバー・扉) の水圧破損 — 外側水頭が閾値を超えたら開放 推定/C
    for (const o of sh.openings) {
      if (o.open > 0 || o.b >= 0 || !COLLAPSE[o.group]) continue;
      this.openingWorld(o, ow);
      const head = this.etaAt(ow.X, ow.Z) - ow.Y;
      if (head > COLLAPSE[o.group]) {
        o.open = 1; o.collapsed = true; o.wy = ow.Y; o.ext = ow.ext; o.sea = head + ow.Y; all.push(o);
        this.log('danger', `${o.label} が水圧で破損 (水頭 ${head.toFixed(1)} m)`);
      }
    }
    const headB = (o) => o.b < 0 ? o.sea : comps[o.b].Hh;
    const netIn = (c, H) => {
      let q = 0;
      for (const o of c.ops) {
        if (o.open <= 0) continue;
        if (o.a === c.id) q -= this.openingFlow(o, H, headB(o), o.wy, o.ext);
        else q += this.openingFlow(o, comps[o.a].Hh, H, o.wy, o.ext);
      }
      return q;
    };
    // 満水区画の加圧水頭
    for (let pass = 0; pass < 3; pass++) {
      let any = false;
      for (const c of comps) {
        if (!c.full) continue; any = true;
        if (netIn(c, c.top) <= 0) { c.Hh = c.top; continue; }
        let hi = c.top;
        for (const o of c.ops) { if (o.open <= 0) continue; const h = o.a === c.id ? headB(o) : comps[o.a].Hh; if (h > hi) hi = h; }
        if (netIn(c, hi) >= 0) { c.Hh = hi; continue; }
        let lo = c.top;
        for (let it = 0; it < 28; it++) { const m = 0.5 * (lo + hi); if (netIn(c, m) > 0) lo = m; else hi = m; }
        c.Hh = 0.5 * (lo + hi);
      }
      if (!any) break;
    }
    const flows = this._flows || (this._flows = []); flows.length = 0;
    for (const o of all) {
      const Ha = comps[o.a].Hh, Hb = headB(o);
      const q = this.openingFlow(o, Ha, Hb, o.wy, o.ext);
      o.q = q; o.Hb = Hb;
      if (q === 0) continue;
      flows.push(o); comps[o.a].nAct++; if (o.b >= 0) comps[o.b].nAct++;
    }
    for (const o of sh.openings) if (o.open <= 0) o.q = 0;
    let inSea = 0, outSea = 0;
    for (const o of flows) {
      const ca = comps[o.a];
      let dV = o.q * dt;   // a → b
      if (o.b < 0) {
        if (dV < 0) {
          if (!ca.full) { const lim = (Math.min(ca.cap, this.volAt(ca, o.Hb, R, py)) - ca.V) / ca.nAct * 0.9; dV = -Math.min(-dV, Math.max(0, lim)); }
          ca.V -= dV; inSea -= dV;
        } else {
          const lim = ca.full ? ca.V : (ca.V - this.volAt(ca, Math.max(o.Hb, o.wy - o.ext), R, py)) / ca.nAct * 0.9;
          dV = Math.min(dV, Math.max(0, lim), ca.V);
          ca.V -= dV; outSea += dV;
        }
      } else {
        const cb = comps[o.b];
        const src = dV > 0 ? ca : cb, dst = dV > 0 ? cb : ca;
        let m = Math.abs(dV);
        if (!src.full) m = Math.min(m, Math.max(0, (src.V - this.volAt(src, Math.max(dst.Hh, o.wy - o.ext), R, py)) / src.nAct * 0.45));
        if (!dst.full) m = Math.min(m, Math.max(0, (Math.min(dst.cap, this.volAt(dst, src.Hh, R, py)) - dst.V) / dst.nAct * 0.45));
        m = Math.min(m, src.V);
        src.V -= m; dst.V += m;
      }
    }
    // 排水ポンプ (吸込口は区画底部 — 水がある限り定格で排水 簡略)
    let pumped = 0;
    if (this.pumpsOn) for (const c of comps) {
      if (c.pump <= 0 || c.V <= c.V0 + 1e-9) continue;
      const d = Math.min(c.V - c.V0, c.pump * this.pumpFactor * dt);
      c.V -= d; pumped += d;
    }
    this.ledger.inSea += inSea; this.ledger.outSea += outSea; this.ledger.pumped += pumped;
    this.flowIn = inSea / dt; this.flowOut = (outSea + pumped) / dt;
  }
  ledgerResidual() {
    const L = this.ledger, V = this.ship.comps.reduce((a, c) => a + c.V, 0);
    const lhs = V - L.V0, rhs = L.inSea - L.outSea - L.pumped;
    return { abs: lhs - rhs, rel: Math.abs(lhs - rhs) / Math.max(1e-9, Math.abs(V) + L.inSea + L.V0) };
  }

  // ------------------------------------------------------------ dynamics
  step() {
    const sh = this.ship, dt = sh.dt, R = this.R, p = this.p;
    // 着底して静止したら物理を休止 (時間のみ進める)
    if (this.flags.ground && Math.hypot(this.v[0], this.v[1], this.v[2]) < 0.02 && Math.hypot(this.w[0], this.w[1], this.w[2]) < 0.002) {
      this.settled = true; this.waves.update(dt, this.t); this.t += dt; this.stat.t = this.t; return;
    }
    this.waves.update(dt, this.t);
    quatToMat(this.q, R);
    this.updateGrid();
    this.updateLevels();

    // ---- 質量特性
    let M = sh.ms, gx = sh.ms * sh.Gs[0], gy = sh.ms * sh.Gs[1], gz = sh.ms * sh.Gs[2];
    for (const c of sh.comps) { const m = RHO * c.V; if (m <= 0) continue; M += m; gx += m * c.cx; gy += m * c.cy; gz += m * c.cz; }
    const Gb = [gx / M, gy / M, gz / M];
    // 慣性 (body: Ixx roll, Iyy yaw, Izz pitch) — 平行軸
    let Ixx = sh.Is[0], Iyy = sh.Is[1], Izz = sh.Is[2];
    const pa = (m, r0, r1, r2) => { Ixx += m * (r1 * r1 + r2 * r2); Iyy += m * (r0 * r0 + r2 * r2); Izz += m * (r0 * r0 + r1 * r1); };
    pa(sh.ms, sh.Gs[0] - Gb[0], sh.Gs[1] - Gb[1], sh.Gs[2] - Gb[2]);
    for (const c of sh.comps) { const m = RHO * c.V; if (m > 0) pa(m, c.cx - Gb[0], c.cy - Gb[1], c.cz - Gb[2]); }
    const rG = [R[0] * Gb[0] + R[1] * Gb[1] + R[2] * Gb[2], R[3] * Gb[0] + R[4] * Gb[1] + R[5] * Gb[2], R[6] * Gb[0] + R[7] * Gb[1] + R[8] * Gb[2]];
    const pG = [p[0] + rG[0], p[1] + rG[1], p[2] + rG[2]];
    const wb = this.w;
    const ww = [R[0] * wb[0] + R[1] * wb[1] + R[2] * wb[2], R[3] * wb[0] + R[4] * wb[1] + R[5] * wb[2], R[6] * wb[0] + R[7] * wb[1] + R[8] * wb[2]];
    const vG = [this.v[0] + ww[1] * rG[2] - ww[2] * rG[1], this.v[1] + ww[2] * rG[0] - ww[0] * rG[2], this.v[2] + ww[0] * rG[1] - ww[1] * rG[0]];

    const F = [0, -M * G, 0], Mo = [0, 0, 0];
    const addF = (fx, fy, fz, X, Y, Z) => {
      F[0] += fx; F[1] += fy; F[2] += fz;
      const rx = X - pG[0], ry = Y - pG[1], rz = Z - pG[2];
      Mo[0] += ry * fz - rz * fy; Mo[1] += rz * fx - rx * fz; Mo[2] += rx * fy - ry * fx;
    };

    // ---- 静水圧・流体力 (ストリップ)
    const res = this.res, ds = this.ds, dx = sh.dx, g = this.grid, smp = this.evalOut;
    const kM = this.waves.kMean;
    let Vsub = 0, wetS = 0, AL = 0, ALy = 0;
    const zeta = 0.2;     // 上下揺れ線形減衰比 推定/C
    const Cdv = 1.0, Cdl = 0.9, Cf = sh.type.Cf;
    const stWet = this.stWet || (this.stWet = new Float64Array(NS));
    const stVy = this.stVy || (this.stVy = new Float64Array(NS)), stCh = this.stCh || (this.stCh = new Float64Array(NS)), stCy = this.stCy || (this.stCy = new Float64Array(NS));
    for (let si = 0; si < NS; si++) {
      const st = sh.st[si];
      const bx = p[0] + R[0] * st.x, by = p[1] + R[3] * st.x, bz = p[2] + R[6] * st.x;
      // 早期判定 (完全乾燥/完全没水)
      let ylo = 1e30, yhi = -1e30;
      for (let j = 0; j < st.n; j++) { const y = by + R[4] * st.y[j] + R[5] * st.z[j]; ds[j] = y; if (y < ylo) ylo = y; if (y > yhi) yhi = y; }
      // 風圧用: 甲板端の水面上高さ
      const deckY = by + R[4] * st.yd, etaC = this.etaAt(bx + R[1] * st.yd, bz + R[7] * st.yd);
      const fb = Math.max(0, deckY - etaC); AL += fb * dx * Math.abs(R[4]); ALy += fb * dx * (etaC + fb / 2);
      if (ylo > g.emax + 1e-6) { stWet[si] = 0; stCh[si] = 0; continue; }
      if (yhi < g.emin - 1e-6) {
        res.A = st.A; res.chord = 0; res.perim = 0;
        // 完全没水: 図心は事前計算せず多角形全体から
        for (let j = 0; j < st.n; j++) ds[j] = 1;
        clipWet(st.z, st.y, ds, st.n, res);
      } else {
        for (let j = 0; j < st.n; j++) {
          const X = bx + R[1] * st.y[j] + R[2] * st.z[j], Z = bz + R[7] * st.y[j] + R[8] * st.z[j];
          ds[j] = this.etaAt(X, Z) - ds[j];
        }
        clipWet(st.z, st.y, ds, st.n, res);

  /** 実時間 dtReal × 倍率 だけ進める (1 フレームのステップ上限あり) */
  advance(simDt, maxSteps) {

  }

  // ------------------------------------------------------------ status / judgment
  attitude() {

  }
  computeStatus(dt) {

    const { heel, trim } = this.attitude();
    st.heel = heel * 180 / Math.PI; st.trim = trim * 180 / Math.PI;
    st.t = this.t;
    st.M = this.dispNow();

    st.rogueIn = fc && !fc.arrived ? fc.tf - this.t : null;

    else {

    for (const th of [5, 10, 20, 30]) if (!F['l' + th] && Math.abs(st.list) > th) { F['l' + th] = true; this.log(th >= 20 ? 'danger' : 'warn', `定常傾斜 ${th}° 超過 (${st.list > 0 ? '右舷' : '左舷'})`); }
    for (const th of [30, 45, 60]) if (!F['r' + th] && Math.abs(st.heel) > th) { F['r' + th] = true; this.log(th >= 45 ? 'danger' : 'warn', `横揺れ ${th}° 到達 (${st.heel > 0 ? '右舷' : '左舷'})`); }
    for (const th of [3, 8, 20]) if (!F['t' + th] && Math.abs(st.trimMean) > th) { F['t' + th] = true; this.log(th >= 8 ? 'danger' : 'warn', `トリム ${th}° 超過 (${st.trimMean < 0 ? '船首' : '船尾'}沈下)`); }
    if (!F.reserve && st.reserve < 0) { F.reserve = true; this.log('danger', '予備浮力喪失 — 沈没は不可避 (総重量 > 全没時浮力)'); }

    if (st.submergedAll) this.subTimer = (this.subTimer || 0) + dt; else this.subTimer = 0;
    if (!F.sunk && this.subTimer > 3 && (st.reserve < 0 || st.contact)) { F.sunk = true; this.sunkT = this.t; this.log('danger', '沈没 — 船体全没'); }
    }

    let level = 0, label = '安定';
    if (sh.comps.some(c => c.flags.wet)) { level = 1; label = '浸水中'; }
    if (st.reserve < 0.15 || Math.abs(st.list) > 15 || Math.abs(st.heel) > 35 || (st.deckAwash && sh.comps.some(c => c.flags.wet)) || Math.abs(st.trimMean) > 5) { level = Math.max(level, 2); label = '危険'; }
    if (this.gzCurrent && this.gzCurrent.vanish != null && Math.abs(st.heel) > this.gzCurrent.vanish && Math.abs(st.heel) < 90) { level = 3; label = '復原力喪失'; }
    if (F.reserve) { level = 3; label = '沈没確定'; }
    if (F.capsized) { level = 3; label = F.sunk ? '転覆・沈没' : '転覆'; }
    if (F.sunk) { level = 4; label = F.ground ? '沈没 (着底)' : '沈没'; if (F.capsized) label = '転覆・沈没'; }
    if (level === 1 && st.inflow <= 1e-6 && sh.comps.some(c => c.flags.wet) && Math.abs(st.heel) < 10 && st.reserve > 0.15) label = '浸水 (平衡)';

  // ------------------------------------------------------------ static stability

  staticEval(R, py, withWater) {

  /** ヒール φ 固定でトリム自由の静的平衡 (py, trim) を 2D Newton で求める (初期値があれば二分法を省略) */
  staticBalance(phi, guess, opts) {

      const h = this.box((c.x1 - c.x0) * 0.86, 1.8 * sh.s, sh.B * 0.78, hm, xm, yd + 0.9 * sh.s, 0);

  buildExtras() {
    const sim = this.sim, sh = sim.ship, s = sh.s, t = sh.type, hull = sh.hull;

      }

      // マニホールドとクレーン
      this.box(1.2 * s, 2.2 * s, sh.B * 0.7, pipe, 0.02 * sh.L, hull.deck(0.5) + 1.1 * s, 0);
      for (const z of [-1, 1]) {
        this.box(1.2 * s, 8 * s, 1.2 * s, this.M(0xe2b230), 0.06 * sh.L, hull.deck(0.5) + 4 * s, z * sh.B * 0.36);
      }
      this.box(2 * s, 14 * s, 2 * s, this.M(0xe9e9e4), 0.47 * sh.L, hull.deck(0.97) + 7 * s, 0);
    }
    if (t.key === 'ferry') {
      // 救命艇
      const lb = this.M(0xf26a1b, { roughness: 0.5 });
      for (const side of [-1, 1]) for (let k = 0; k < 6; k++) {
        const x = (0.25 + 0.08 * k - 0.5) * sh.L;
        const c = new THREE.Mesh(new THREE.CylinderGeometry(1.4 * s, 1.4 * s, 8 * s, 10), lb);
        c.rotation.z = Math.PI / 2; c.position.set(x, sh.D + 8.5 * s, side * (sh.B * 0.5 + 0.6 * s)); c.castShadow = true; this.group.add(c);
      }

      const plate = this.box(9 * s, 0.4 * s, hull.halfWidth(u, hull.deck(u)) * 1.7, this.M(0xf5f6f7), 4.5 * s, 0, 0, vis);
      void plate; void yb;
      this.group.add(vis); this.visor = vis;
      this.doorHole = this.box(0.3 * s, 4.8 * s, 5.5 * s, this.M(0x050608), (0.958 - 0.5) * sh.L + 0.5, 10 * s, 0);

      drum.rotation.x = Math.PI / 2; drum.position.set(-0.4 * sh.L, hull.deck(0.1) + 0.6 * s, 0); drum.castShadow = true; this.group.add(drum);
      this.box(1.6 * s, 0.5 * s, 1.6 * s, this.M(0x6d8696), 0.14 * sh.L, hull.deck(0.64) + 0.25 * s, 0);   // 魚倉ハッチ
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.35 * s, 0.08 * s, 8, 16), this.M(0xf26a1b)); ring.position.set(-0.15 * sh.L, hull.deck(0.35) + 1.4 * s, sh.B * 0.38); this.group.add(ring);

  // -------------------------------------------------- X 線 (区画)
  buildXray() {
    const sh = this.sim.ship, comps = sh.comps, M = 28;
    const grp = this.xray = new THREE.Group();
    const pos = [], cid = [], idx = [], lines = [];
    const ring = (p) => {
      // 図心からの放射で M 点に再標本化
      let cz = 0, cy = 0; for (let j = 0; j < p.n; j++) { cz += p.z[j]; cy += p.y[j]; } cz /= p.n; cy /= p.n;
      const out = [];
      for (let k = 0; k < M; k++) {
        const a = -Math.PI / 2 + TAU * k / M, dz = Math.cos(a), dy = Math.sin(a);
        let best = 0;
        for (let j = 0; j < p.n; j++) {
          const j2 = (j + 1) % p.n;
          const ez = p.z[j2] - p.z[j], ey = p.y[j2] - p.y[j];
          const den = dz * ey - dy * ez; if (Math.abs(den) < 1e-12) continue;
          const wz = p.z[j] - cz, wy = p.y[j] - cy;
          const tt = (wz * ey - wy * ez) / den, s2 = (wz * dy - wy * dz) / den;
          if (tt >= 0 && s2 >= -1e-9 && s2 <= 1 + 1e-9 && tt > best) best = tt;
        }
        out.push([cz + dz * best, cy + dy * best]);
      }
      return { pts: out, c: [cz, cy] };
    };
    for (const c of comps) {
      const rings = [];
      const st = c.stations;
      rings.push({ x: c.x0, r: ring(st[0]) });
      for (const p of st) rings.push({ x: p.x, r: ring(p) });
      rings.push({ x: c.x1, r: ring(st[st.length - 1]) });
      const base = pos.length / 3;
      for (const rg of rings) for (const [z, y] of rg.r.pts) { pos.push(rg.x, y, z); cid.push(c.id); }
      for (let i = 0; i < rings.length - 1; i++) for (let k = 0; k < M; k++) {
        const a = base + i * M + k, b = base + i * M + (k + 1) % M, d = base + (i + 1) * M + k, e = base + (i + 1) * M + (k + 1) % M;
        idx.push(a, d, e, a, e, b);
      }
      for (const end of [0, rings.length - 1]) {
        const cIdx = pos.length / 3, rg = rings[end];
        pos.push(rg.x, rg.r.c[1], rg.r.c[0]); cid.push(c.id);
        for (let k = 0; k < M; k++) idx.push(cIdx, base + end * M + k, base + end * M + (k + 1) % M);
        for (let k = 0; k < M; k++) { const p1 = rg.r.pts[k], p2 = rg.r.pts[(k + 1) % M]; lines.push(rg.x, p1[1], p1[0], rg.x, p2[1], p2[0]); }
      }
      for (const k of [0, M / 4, M / 2, 3 * M / 4]) for (let i = 0; i < rings.length - 1; i++) {
        const p1 = rings[i].r.pts[k], p2 = rings[i + 1].r.pts[k]; lines.push(rings[i].x, p1[1], p1[0], rings[i + 1].x, p2[1], p2[0]);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('cid', new THREE.Float32BufferAttribute(cid, 1));
    g.setIndex(idx);
    const NC = 32;
    this.xrU = { uLevel: { value: new Array(NC).fill(-1e6) }, uState: { value: new Array(NC).fill(0) }, uTime: { value: 0 } };
    const mat = new THREE.ShaderMaterial({
      uniforms: this.xrU, transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
      vertexShader: `attribute float cid; uniform float uLevel[${NC}]; uniform float uState[${NC}];
        varying float vY; varying float vL; varying float vS; varying vec3 vN; varying vec3 vV;
        void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vY = wp.y; int i = int(cid + 0.5);
          float L = -1e6; float St = 0.0; for (int k = 0; k < ${NC}; k++) { if (k == i) { L = uLevel[k]; St = uState[k]; } }
          vL = L; vS = St; vV = cameraPosition - wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`,
      fragmentShader: `uniform float uTime; varying float vY; varying float vL; varying float vS; varying vec3 vV;
        void main(){ bool wet = vY < vL;
          vec3 c = wet ? vec3(0.1, 0.55, 0.95) : (vS > 0.5 ? vec3(1.0, 0.45, 0.25) : vec3(0.55, 0.85, 1.0));
          float a = wet ? 0.42 : (vS > 0.5 ? 0.16 : 0.05);
          gl_FragColor = vec4(c, a); }`,
    });
    const mesh = new THREE.Mesh(g, mat); mesh.renderOrder = 30; mesh.frustumCulled = false;
    grp.add(mesh);
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(lines, 3));
    const lm = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0x9fdcff, transparent: true, opacity: 0.55, depthTest: false, depthWrite: false }));
    lm.renderOrder = 31; lm.frustumCulled = false; grp.add(lm);
    // 自由表面リボン
    this.fs = [];
    const fsMat = new THREE.MeshBasicMaterial({ color: 0x3aa0ff, transparent: true, opacity: 0.55, depthTest: false, depthWrite: false, side: THREE.DoubleSide });
    // オープン艇の艇内水面: 海面マスク (renderOrder 2) より先に不透明で描く
    const fsOpen = this.M(0x1f5a6b, { roughness: 0.08, metalness: 0.0, side: THREE.DoubleSide, flatShading: true });
    fsOpen.envMapIntensity = 1.0;
    for (const c of comps) {
      const n = c.stations.length + 2;
      const g2 = new THREE.BufferGeometry();
      g2.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 2 * 3), 3));
      const id2 = []; for (let i = 0; i < n - 1; i++) { const a = i * 2; id2.push(a, a + 1, a + 3, a, a + 3, a + 2); }
      g2.setIndex(id2);
      const m = new THREE.Mesh(g2, fsMat); m.renderOrder = 32; m.frustumCulled = false; m.visible = false;
      grp.add(m);
      let mo = null;
      if (c.open) { mo = new THREE.Mesh(g2, fsOpen); mo.renderOrder = 1; mo.frustumCulled = false; mo.visible = false; this.group.add(mo); }
      this.fs.push({ c, mesh: m, open: mo });
    }
    this.group.add(grp);
    grp.visible = false;
  }
  setXray(on) {
    this.xray.visible = on;
    this.xrayOn = on;
    for (const m of this.mats) {
      if (m === this.hullMat || this.hullMeshes.some(h => h.material === m)) continue;
    }
    const op = on ? 0.16 : 1;
    this.group.traverse(o => {
      if (!o.isMesh || this.xray === o.parent || o.parent === this.holeMarks) return;
      if (o.material && o.material.isMeshStandardMaterial && !this.fs.some(f => f.open === o)) {
        o.material.transparent = on; o.material.opacity = op; o.material.depthWrite = !on; o.material.needsUpdate = true;
      }
    });
    this.holeMarks.visible = on;
  }

  // -------------------------------------------------- per frame
  update(O, time) {
    const sim = this.sim, sh = sim.ship, R = sim.R, p = sim.p;
    this.group.position.set(p[0] - O[0], p[1] - O[1], p[2] - O[2]);
    this.group.quaternion.set(sim.q[1], sim.q[2], sim.q[3], sim.q[0]);
    if (this.prop) this.prop.rotation.x += (sim.thrust > 0 ? 0.35 : 0.02) * (sim.propImm > 0.1 ? 1 : 3) * (sim.nav.engine ? 1 : 0);
    // 区画の水位 (シーン座標)
    const lv = this.xrU.uLevel.value, stt = this.xrU.uState.value;
    for (const c of sh.comps) {
      lv[c.id] = c.V > 1e-9 ? c.H - O[1] : -1e6;
      stt[c.id] = (c.flags.wet || c.V > c.V0 + 1e-6) ? 1 : 0;
    }
    // 自由表面
    const py = p[1];
    for (const f of this.fs) {
      const c = f.c;
      const show = c.V > 1e-6 && c.V < c.cap * 0.999;
      f.mesh.visible = show && this.xrayOn;
      if (f.open) f.open.visible = show;
      if (!show) continue;
      const arr = f.mesh.geometry.attributes.position.array;
      const H = c.H;
      const put = (k, x, poly) => {
        const ds = []; let any = false, all = true;
        for (let j = 0; j < poly.n; j++) { const d = H - (py + R[3] * x + R[4] * poly.y[j] + R[5] * poly.z[j]); ds.push(d); if (d > 0) any = true; else all = false; }
        let a = null, b = null, tmin = 1e9, tmax = -1e9;
        const dz = R[4], dy = -R[5];
        if (any && !all) {
          for (let j = 0; j < poly.n; j++) {
            const j2 = (j + 1) % poly.n;
            if ((ds[j] > 0) !== (ds[j2] > 0)) {
              const tt = ds[j] / (ds[j] - ds[j2]);
              const z = poly.z[j] + tt * (poly.z[j2] - poly.z[j]), y = poly.y[j] + tt * (poly.y[j2] - poly.y[j]);
              const pr = z * dz + y * dy;
              if (pr < tmin) { tmin = pr; a = [z, y]; } if (pr > tmax) { tmax = pr; b = [z, y]; }
            }
          }
        }
        if (!a) { let yb = all ? -1e9 : 1e9, zb = 0; for (let j = 0; j < poly.n; j++) { if (all ? poly.y[j] > yb : poly.y[j] < yb) { yb = poly.y[j]; zb = poly.z[j]; } } a = b = [zb, yb]; }
        arr[k * 6] = x; arr[k * 6 + 1] = a[1]; arr[k * 6 + 2] = a[0]; arr[k * 6 + 3] = x; arr[k * 6 + 4] = b[1]; arr[k * 6 + 5] = b[0];
      };
      const st = c.stations;
      put(0, c.x0, st[0]);
      for (let i = 0; i < st.length; i++) put(i + 1, st[i].x, st[i]);
      put(st.length + 1, c.x1, st[st.length - 1]);
      f.mesh.geometry.attributes.position.needsUpdate = true;
      f.mesh.geometry.computeBoundingSphere();
    }
    // 破口デカール
    const holes = sh.holes;
    if (this.holeCount !== holes.length) {
      this.holeCount = holes.length;
      this.holeGroup.clear(); this.holeMarks.clear();
      for (const h of holes) {
        const r = Math.max(h.r * 1.25, 0.02);
        const m = new THREE.Mesh(new THREE.CircleGeometry(r, 24), new THREE.MeshBasicMaterial({ map: this.holeTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4 }));
        const n = new THREE.Vector3(h.nrm[0], h.nrm[1], h.nrm[2]);
        m.position.set(h.pos[0] + n.x * 0.002 * sh.s, h.pos[1] + n.y * 0.002 * sh.s, h.pos[2] + n.z * 0.002 * sh.s);
        m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);
        m.renderOrder = 1;
        this.holeGroup.add(m);
        const mk = new THREE.Mesh(new THREE.RingGeometry(r * 1.6 + 0.01 * sh.L, r * 1.6 + 0.016 * sh.L, 28), new THREE.MeshBasicMaterial({ color: 0xff4a2a, transparent: true, opacity: 0.95, depthTest: false, depthWrite: false, side: THREE.DoubleSide }));
        mk.position.copy(m.position); mk.quaternion.copy(m.quaternion); mk.renderOrder = 40;
        this.holeMarks.add(mk);
      }
      this.holeMarks.visible = !!this.xrayOn;
    }
    // 開口部の表示 (ハッチカバー喪失, バウドア)
    if (this.hatchCovers) {
      for (const hc of this.hatchCovers) {
        const op = sh.openings.find(o => o.group === 'hatch' && o.a === hc.userData.comp);
        const open = op && op.open > 0;
        hc.visible = !open;
        if (this.containers && open && !hc.userData.lost) {
          hc.userData.lost = true;
          const c = sh.comps[hc.userData.comp];
          const m4 = new THREE.Matrix4().makeScale(0, 0, 0);
          for (const b of this.bayInst) if (b.x > c.x0 && b.x < c.x1) for (const k of b.list) this.containers.setMatrixAt(k, m4);
          this.containers.instanceMatrix.needsUpdate = true;
        }
      }
    }
    if (this.visor) {
      const open = sh.openings.some(o => o.group === 'bowdoor' && o.open > 0);
      const target = open ? -0.9 : 0;
      this.visor.rotation.z += (target - this.visor.rotation.z) * 0.05;
      this.doorHole.visible = open;
    }
  }
}

// ============================================================ PARTICLES (飛沫)
class Spray {
  constructor(gfx, n) {
    this.gfx = gfx; this.n = n;
    this.p = new Float64Array(n * 3); this.v = new Float32Array(n * 3); this.life = new Float32Array(n); this.size = new Float32Array(n); this.max = new Float32Array(n);
    this.head = 0;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    g.setAttribute('a', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
    this.mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { uScale: { value: 800 }, uCol: { value: new THREE.Color(1, 1, 1) } },
      vertexShader: `attribute vec2 a; uniform float uScale; varying float vA; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vA = a.y; gl_PointSize = clamp(a.x * uScale / max(0.1, -mv.z), 0.0, 90.0); gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `uniform vec3 uCol; varying float vA; void main(){ vec2 d = gl_PointCoord - 0.5; float r = dot(d, d) * 4.0; if (r > 1.0) discard; gl_FragColor = vec4(uCol, vA * (1.0 - r) * (1.0 - r)); }`,
    });
    this.points = new THREE.Points(g, this.mat); this.points.frustumCulled = false; this.points.renderOrder = 15;
    gfx.scene.add(this.points);
  }
  emit(x, y, z, vx, vy, vz, size, life) {
    const i = this.head; this.head = (this.head + 1) % this.n;
    this.p[i * 3] = x; this.p[i * 3 + 1] = y; this.p[i * 3 + 2] = z; this.v[i * 3] = vx; this.v[i * 3 + 1] = vy; this.v[i * 3 + 2] = vz;
    this.life[i] = life; this.max[i] = life; this.size[i] = size;
  }
  update(dt, O, light) {
    const pos = this.points.geometry.attributes.position.array, a = this.points.geometry.attributes.a.array;
    for (let i = 0; i < this.n; i++) {
      if (this.life[i] <= 0) { a[i * 2] = 0; a[i * 2 + 1] = 0; continue; }
      this.life[i] -= dt;
      this.v[i * 3 + 1] -= 9.81 * dt;
      const dr = Math.exp(-dt * 0.8);
      this.v[i * 3] *= dr; this.v[i * 3 + 2] *= dr;
      this.p[i * 3] += this.v[i * 3] * dt; this.p[i * 3 + 1] += this.v[i * 3 + 1] * dt; this.p[i * 3 + 2] += this.v[i * 3 + 2] * dt;
      pos[i * 3] = this.p[i * 3] - O[0]; pos[i * 3 + 1] = this.p[i * 3 + 1] - O[1]; pos[i * 3 + 2] = this.p[i * 3 + 2] - O[2];
      const f = this.life[i] / this.max[i];
      a[i * 2] = this.size[i] * (1.4 - 0.6 * f); a[i * 2 + 1] = Math.min(1, f * 2.5) * 0.75;
    }
    this.points.geometry.attributes.position.needsUpdate = true; this.points.geometry.attributes.a.needsUpdate = true;
    this.mat.uniforms.uCol.value.setScalar(0.55 + 0.45 * light);
    this.mat.uniforms.uScale.value = this.gfx.renderer.domElement.height / (2 * Math.tan(this.gfx.camera.fov * Math.PI / 360));
  }
}

// ============================================================ 巻き波のリップ (前へ投げ出されて巻く水の膜)
// 一価の海面では表せない張り出し (チューブ) だけを専用メッシュで描く。陰影は海面と同じフラグメントシェーダ
const RIBBON_VS = `attribute float aFoam; attribute float aEta; uniform vec3 uCamPos;
varying vec3 vPos; varying vec3 vNrm; varying float vJac; varying float vEta; varying float vDist; varying float vBW;
void main(){ vPos = position; vNrm = normal; vJac = 1.0; vEta = aEta; vBW = aFoam; vDist = length(position - uCamPos); gl_Position = projectionMatrix * viewMatrix * vec4(position, 1.0); }`;
class BreakerView {
  constructor(gfx) {
    this.gfx = gfx;
    this.NU = 72; this.NB = 4; this.NL = 24;   // 峰方向の列数 / 背面の行数 / リップの行数
    const u = Object.assign({}, gfx.oceanMat.uniforms, { uRibbon: { value: 1 } });
    this.mat = new THREE.ShaderMaterial({ vertexShader: RIBBON_VS, fragmentShader: OCEAN_FS, uniforms: u, side: THREE.DoubleSide });
    this.mat.extensions = { derivatives: true };
    this.meshes = [];
    const NR = this.NB + this.NL, nv = this.NU * NR, idx = [];
    for (let i = 0; i < this.NU - 1; i++) for (let j = 0; j < NR - 1; j++) { const a = i * NR + j, b = (i + 1) * NR + j; idx.push(a, b, a + 1, b, b + 1, a + 1); }
    for (let k = 0; k < S.BW_MAX * 4; k++) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(nv * 3), 3));
      g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(nv * 3), 3));
      g.setAttribute('aFoam', new THREE.BufferAttribute(new Float32Array(nv), 1));
      g.setAttribute('aEta', new THREE.BufferAttribute(new Float32Array(nv), 1));
      g.setIndex(idx);
      const m = new THREE.Mesh(g, this.mat); m.frustumCulled = false; m.renderOrder = 4; m.visible = false;
      gfx.scene.add(m); this.meshes.push(m);
    }
    this.P = new Float64Array(nv * 3);
    this.tip = [];      // しぶき用: 巻いている列の先端 (world)
    this.out = new Float64Array(3);
  }
  /** wf: WaveField, t: 時刻, O: 原点。戻り値: しぶきの発生点 [{x,y,z, nx, nz, b, H, c}] */
  update(wf, t, O) {
    const NU = this.NU, NB = this.NB, NL = this.NL, NR = NB + NL, P = this.P, st = {}, sp = [];
    let mi = 0;
    for (const b of wf.breakers) {
      const tanA = b.tanA, fade = b.fade(t);
      for (let n = 0; n < b.N; n++) {
        const mesh = this.meshes[mi++]; if (!mesh) break;

function silhouette(cv, key) {
  const t = S.TYPES[key], h = new S.Hull(t, t.L0), g = cv.getContext('2d');
  const W = cv.width, H = cv.height; g.clearRect(0, 0, W, H);
  const xs = h.xMin, xe = h.xMax;
  let top = h.D * 1.0;
  const sup = (t.supers || []).map(b => { const um = (b.u0 + b.u1) / 2, y0 = typeof b.y0 === 'string' ? (b.y0.startsWith('deck') ? h.deck(um) + parseFloat(b.y0.slice(4) || '0') : 0) : b.y0; top = Math.max(top, y0 + b.h); return { x0: (b.u0 - 0.5) * t.L0, x1: (b.u1 - 0.5) * t.L0, y0, y1: y0 + b.h, k: b.kind }; });
  const sx = (W - 4) / (xe - xs), sy = Math.min(sx * 2.2, (H - 4) / top), base = H - 2;
  const X = (x) => 2 + (x - xs) * sx, Y = (y) => base - y * sy;
  g.fillStyle = '#4fb3e8'; g.globalAlpha = 0.18; g.fillRect(0, Y(t.T), W, H); g.globalAlpha = 1;
  g.beginPath();
  for (let i = 0; i <= 40; i++) { const x = xs + (xe - xs) * i / 40; g.lineTo(X(x), Y(h.bottom(h.u(x)))); }
  for (let i = 40; i >= 0; i--) { const x = xs + (xe - xs) * i / 40; g.lineTo(X(x), Y(h.deck(h.u(x)))); }
  g.closePath(); g.fillStyle = '#c9d6df'; g.fill();
  for (const b of sup) { g.fillStyle = b.k === 'containers' ? '#d8572a' : b.k === 'funnel' ? '#8aa0b0' : '#e8eef2'; g.fillRect(X(b.x0), Y(b.y1), (b.x1 - b.x0) * sx, (b.y1 - b.y0) * sy); }
}

// ------------------------------------------------------------ 計器: 区画図 / GZ / 記録
function cvSetup(cv) {
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;

let dcLayout = null;

  let dmax = 0; for (let i = 0; i <= 30; i++) dmax = Math.max(dmax, hull.deck(hull.u(xs + (xe - xs) * i / 30)));
  const profH = h * 0.47;
  const sy = Math.min(profH * 0.8 / dmax, sx * 6);
  const ex = sy / sx;
  const base = top + profH * 0.86;
  const X = (x) => padX + (x - xs) * sx, Y = (y) => base - y * sy;
  g.font = '10.5px ' + getComputedStyle(document.body).getPropertyValue('--font-ui');
  g.fillStyle = COL.dim; g.textAlign = 'left';
  g.fillText(`側面図${ex > 1.05 ? `（縦 ×${ex.toFixed(1)}）` : ''}`, padX, 13);
  g.textAlign = 'right'; g.fillText('船首 →', w - padX, 13);

  const seaY = (x) => { const X0 = p[0] + R[0] * x, Z0 = p[2] + R[6] * x; const e = sim.etaAt(X0, Z0); return (e - p[1] - R[3] * x) / R4; };
  g.save(); g.beginPath(); g.rect(0, top - 4, w, profH + 6); g.clip();

  for (let i = 0; i <= 40; i++) { const x = xs + (xe - xs) * i / 40; g.lineTo(X(x), Y(seaY(x))); }
  g.lineTo(w, Y(seaY(xe))); g.lineTo(w, top + profH + 4); g.lineTo(0, top + profH + 4); g.closePath();
  g.fillStyle = 'rgba(79,179,232,0.10)'; g.fill();

  for (let i = 0; i <= 60; i++) { const x = xs + (xe - xs) * i / 60; const y = hull.bottom(hull.u(x)); i ? hullPath.lineTo(X(x), Y(y)) : hullPath.moveTo(X(x), Y(y)); }
  for (let i = 60; i >= 0; i--) { const x = xs + (xe - xs) * i / 60; hullPath.lineTo(X(x), Y(hull.deck(hull.u(x)))); }
  hullPath.closePath();
  g.fillStyle = 'rgba(12,24,35,0.85)'; g.fill(hullPath);
  g.save(); g.clip(hullPath);
  dcLayout = { comps: [], X, Y, sx, sy };
  const prof = sh.comps.filter(c2 => c2.box.z0 <= 1e-6 && c2.box.z1 >= -1e-6);
  for (const c2 of prof) {
    const y0 = c2.box.y0, y1 = isFinite(c2.box.y1) ? c2.box.y1 : dmax * 1.2;
    const zc = 0;
    if (c2.V > 1e-9) {

      const full = c2.V >= c2.cap * 0.999;
      const wy = (x) => full ? y1 : (c2.H - p[1] - R[3] * x - R[5] * zc) / R4;
      const n = 8;
      g.moveTo(X(c2.x0), Y(y0));
      for (let i = 0; i <= n; i++) { const x = c2.x0 + (c2.x1 - c2.x0) * i / n; g.lineTo(X(x), Y(Math.max(y0, Math.min(y1, R[4] < 0 ? y1 : wy(x))))); }

    dcLayout.comps.push({ c: c2, x0: X(c2.x0), x1: X(c2.x1), y0: Y(y1), y1: Y(y0) });

  g.restore();
  // ---- 平面図

}
function wireSource() {

  const bw = $('src-bw');
  UI.bwHB = slider(bw, { id: 'sb-bh', label: '崩れる高さ', min: 4, max: 30, step: 0.5, value: st.bwH, fmt: v => `${v.toFixed(1)} m`, oninput: v => setBw('H', v) });
  UI.bwTB = slider(bw, { id: 'sb-bt', label: '周期', min: 8, max: 20, step: 0.5, value: st.bwT, fmt: v => `${v.toFixed(1)} 秒`, oninput: v => setBw('T', v) });
  UI.bwNB = slider(bw, { id: 'sb-bn', label: '本数', min: 1, max: 4, step: 1, value: st.bwN, fmt: v => `${v.toFixed(0)} 本`, oninput: v => setBw('N', v) });
  setSrcKind(st.srcKind);
  UI.srcRB = slider($('src-w'), { id: 'sb-r', label: '標準偏差 σ', min: 10, max: 200, step: 1, value: st.srcSig, fmt: v => `${v.toFixed(0)} m (目安 ≤ ${S.Disturbance.steepSigma(v).toFixed(0)} m)`, oninput: v => setSrcR(v) });
