<style>
/* Layout: a darkened vitrine with the piece under a ceiling spot; one quiet row of controls bottom-right, hidden in gallery mode */
:root{
  --void:#06070c;
  --vitrine:#121527;
  --beam:rgba(150,170,255,.10);
  --fg:#e7eaf2;
  --hair:rgba(220,228,255,.22);
  --live:#bfe9ff;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:
    radial-gradient(38% 60% at 50% -6%, var(--beam), transparent 70%),
    radial-gradient(90% 70% at 50% 48%, var(--vitrine) 0%, #0b0d18 55%, var(--void) 100%);
  color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;
}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}

body.gallery.idle, body.gallery.idle #stage{cursor:none}

.veil{position:fixed;inset:0;background:var(--void);opacity:0;pointer-events:none}

.frame{
  position:fixed;left:0;right:0;bottom:0;
  padding-left:max(24px, env(safe-area-inset-left,0px));
  padding-right:max(24px, env(safe-area-inset-right,0px));

  pointer-events:none;transition:opacity .9s ease;
}
body.gallery.idle .frame{opacity:0}
body.gallery.idle .frame .btns{pointer-events:none}
.btns{display:flex;gap:.55rem;align-items:center;pointer-events:auto}
button{
  font-family:var(--body);font-size:.82rem;letter-spacing:.22em;color:var(--fg);cursor:pointer;
  background:rgba(10,12,24,.35);border:1px solid var(--hair);border-radius:999px;
  height:2.75rem;padding:0 1.3rem 0 1.5rem;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);

}
button:hover{border-color:rgba(220,228,255,.55);background:rgba(220,228,255,.07)}

button:disabled{opacity:.32;cursor:default;background:rgba(10,12,24,.35);border-color:var(--hair)}

.sizes{display:flex;border:1px solid var(--hair);border-radius:999px;padding:3px;gap:2px;
  background:rgba(10,12,24,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sizes button{border:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;
  height:calc(2.75rem - 8px);min-width:2.6rem;padding:0 .7rem;letter-spacing:.04em;font-size:.82rem;font-variant-numeric:tabular-nums;color:var(--fg);opacity:.62}
.sizes button sup{font-size:.62em;margin-left:1px}
.sizes button:hover{background:rgba(220,228,255,.07);opacity:1}
.sizes button[aria-pressed="true"]{background:rgba(220,228,255,.14);opacity:1;color:var(--live)}

@media (max-width:640px){
  .frame{
    justify-content:center;
    padding-left:max(16px, env(safe-area-inset-left,0px));

    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);

  .btns{width:100%;max-width:26rem;flex-wrap:wrap;row-gap:.6rem}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function SOLVER(G){
  'use strict';
  var FN='URFDLB';
  var FR={U:[[0,1,0],[0,0,-1],[1,0,0]],R:[[1,0,0],[0,1,0],[0,0,-1]],F:[[0,0,1],[0,1,0],[1,0,0]],
          D:[[0,-1,0],[0,0,1],[1,0,0]],L:[[-1,0,0],[0,1,0],[0,0,1]],B:[[0,0,-1],[0,1,0],[-1,0,0]]};
  var models={};
  function key(p,n){ return p[0]+','+p[1]+','+p[2]+'|'+n[0]+','+n[1]+','+n[2]; }
  function rot(v,a,q){
    var x=v[0],y=v[1],z=v[2],t; q=((q%4)+4)%4;
    for(var i=0;i<q;i++){
      if(a===0){ t=y; y=-z; z=t; }
      else if(a===1){ t=x; x=z; z=-t; }
      else { t=x; x=-y; y=t; }
    }
    return [x,y,z];
  }
  function model(N){
    if(models[N]) return models[N];
    var M=N-1, st=[], index=new Map(), cubieOf=new Map(), cubies=[];
    for(var f=0;f<6;f++){ var fr=FR[FN[f]], n=fr[0], u=fr[1], r=fr[2];
      for(var i=0;i<N;i++) for(var j=0;j<N;j++){
        var p=[0,1,2].map(function(k){ return n[k]*M + r[k]*(2*j-M) + u[k]*(M-2*i); });
        var pk=p.join(',');
        if(!cubieOf.has(pk)){ cubieOf.set(pk,cubies.length); cubies.push({p:p,st:[]}); }
        var cid=cubieOf.get(pk);
        var ext=p.filter(function(x){return Math.abs(x)===M;}).length;
        index.set(key(p,n),st.length);
        cubies[cid].st.push(st.length);
        st.push({p:p,n:n,f:f,i:i,j:j,cubie:cid,type:ext});
      } }
    var S=st.length, moves=[];
    for(var a=0;a<3;a++) for(var li=0;li<N;li++){ var c=2*li-M;
      [[1,1],[-1,1],[1,2]].forEach(function(dt){
        var q=dt[0]*dt[1], perm=new Int16Array(S);
        for(var k=0;k<S;k++){ var s=st[k];
          perm[k] = s.p[a]===c ? index.get(key(rot(s.p,a,q),rot(s.n,a,q))) : k; }
        moves.push({a:a,li:li,dir:dt[0],turns:dt[1],perm:perm});
      }); }
    moves.forEach(function(m,id){ m.id=id; m.inv = m.turns===2 ? id : (m.dir===1 ? id+1 : id-1); });
    var md={N:N,M:M,st:st,index:index,cubies:cubies,cubieOf:cubieOf,moves:moves,S:S,lib:null};
    models[N]=md; return md;
  }
  function seqPerm(md,seq){
    var S=md.S, P=new Int16Array(S); for(var i=0;i<S;i++) P[i]=i;
    for(var k=0;k<seq.length;k++){ var mp=md.moves[seq[k]].perm; for(var i2=0;i2<S;i2++) P[i2]=mp[P[i2]]; }
    return P;
  }
  // Library of pure 3-cycles (commutators [s f s', y] and their conjugates)
  function buildLib(md){
    if(md.lib) return md.lib;
    var S=md.S, mv=md.moves, st=md.st, lib=new Map();
    function orbitOk(moved){
      var t=st[moved[0]].type; if(t===3) return false;
      var cs={};
      for(var k=0;k<moved.length;k++){ var s=st[moved[k]]; if(s.type!==t) return false; cs[s.cubie]=1; }
      if(Object.keys(cs).length!==3) return false;
      if(t===2){ // reject midges
        for(var k2=0;k2<moved.length;k2++){ var p=st[moved[k2]].p; if(p.filter(function(x){return x===0;}).length) return false; }
      }
      return true;
    }
    var cub=new Int16Array(S); for(var ci=0;ci<S;ci++) cub[ci]=st[ci].cubie;
    var fc=[0,0,0], tc=[0,0,0];
    // key of a cubie 3-cycle, with stickers optionally remapped through Pi
    function cycleKey(pairs,Pi){
      var n=0;
      for(var k=0;k<pairs.length;k++){
        var f=cub[Pi?Pi[pairs[k][0]]:pairs[k][0]], t=cub[Pi?Pi[pairs[k][1]]:pairs[k][1]];
        var dup=false; for(var q=0;q<n;q++) if(fc[q]===f) dup=true;
        if(!dup){ fc[n]=f; tc[n]=t; n++; }
      }
      var ia=0; if(fc[1]<fc[ia]) ia=1; if(fc[2]<fc[ia]) ia=2;
      var A=fc[ia], B=tc[ia], ib=fc.indexOf(B), Cc=tc[ib];
      return A*1000000+B*1000+Cc;
    }
    var bases=new Map();
    var C=new Int16Array(S);
    for(var si=0;si<mv.length;si++) for(var fi=0;fi<mv.length;fi++){
      if(mv[fi].a===mv[si].a) continue;
      var X=seqPerm(md,[si,fi,mv[si].inv]), Xi=new Int16Array(S); for(var i=0;i<S;i++) Xi[X[i]]=i;
      for(var yi=0;yi<mv.length;yi++){
        var Y=mv[yi].perm, Yi=mv[mv[yi].inv].perm;
        var moved=[];
        for(var i3=0;i3<S;i3++){ var v=Yi[Xi[Y[X[i3]]]]; C[i3]=v; if(v!==i3){ moved.push(i3); if(moved.length>6) break; } }
        if(moved.length!==3 && moved.length!==6) continue;
        if(!orbitOk(moved)) continue;
        var pairs=moved.map(function(x){return [x,C[x]];});
        var k=cycleKey(pairs,null);
        if(!bases.has(k)) bases.set(k,{seq:[si,fi,mv[si].inv,yi,si,mv[fi].inv,mv[si].inv,mv[yi].inv],pairs:pairs});
      }
    }
    bases=Array.from(bases.values());
    bases.forEach(function(b){ lib.set(cycleKey(b.pairs,null),{seq:b.seq,pairs:b.pairs}); });
    // how many distinct directed 3-cycles exist in total (24 pieces per orbit)
    var orbits={};
    st.forEach(function(x){ if(x.type===3) return; var p=x.p.map(Math.abs).sort(function(a,b){return a-b;}).join(',');
      if(x.p.filter(function(v){return v===0;}).length >= (x.type===2?1:2)) return; orbits[p+'|'+x.type]=1; });
    var full=Object.keys(orbits).length*4048;
    function conj(su){
      var P=seqPerm(md,su), Pi=new Int16Array(S); for(var i=0;i<S;i++) Pi[P[i]]=i;
      var L=8+2*su.length, inv=null;
      for(var bi=0;bi<bases.length;bi++){ var b=bases[bi];
        var k=cycleKey(b.pairs,Pi), e=lib.get(k);
        if(!e || e.seq.length>L){
          if(!inv) inv=su.slice().reverse().map(function(x){return mv[x].inv;});
          lib.set(k,{seq:su.concat(b.seq,inv),pairs:b.pairs.map(function(pr){return [Pi[pr[0]],Pi[pr[1]]];})});
        }
      }
    }
    for(var a1=0;a1<mv.length;a1++) conj([a1]);
    if(lib.size<full){
      outer: for(var a2=0;a2<mv.length;a2++) for(var b2=0;b2<mv.length;b2++){
        if(mv[a2].a===mv[b2].a && mv[a2].li===mv[b2].li) continue;
        conj([a2,b2]);
        if(lib.size>=full) break outer;
      }
    }
    md.lib=Array.from(lib.values());
    md.lib.forEach(function(en){ var by={}; en.pairs.forEach(function(pr){ var c=st[pr[1]].cubie; (by[c]=by[c]||[]).push(pr); }); en.groups=Object.keys(by).map(function(k){return by[k];}); });
    md.libFull=full;
    return md.lib;
  }
  function parity(perm){ // perm: array mapping index->index over a set (object)
    var seen={}, par=0;
    Object.keys(perm).forEach(function(s){
      if(seen[s]) return; var len=0, x=s;
      while(!seen[x]){ seen[x]=1; x=String(perm[x]); len++; }
      par+=len-1;
    });
    return par%2;
  }
  function det(a,b,c){ return a[0]*(b[1]*c[2]-b[2]*c[1])-a[1]*(b[0]*c[2]-b[2]*c[0])+a[2]*(b[0]*c[1]-b[1]*c[0]); }
  var NORMALS=[[0,1,0],[1,0,0],[0,0,1],[0,-1,0],[-1,0,0],[0,0,-1]];

  G.warm=function(N){ buildLib(model(N)); };
  G.solveCube=function(N, stickers){
    var md=model(N), st=md.st, S=md.S, M=md.M, mv=md.moves;
    var color=new Int8Array(S), tmp=new Int8Array(S), out=[];
    stickers.forEach(function(s){ var i=md.index.get(key(s.p,s.n)); if(i===undefined) throw new Error('bad sticker'); color[i]=s.c; });
    function apply(id){ var P=mv[id].perm; for(var i=0;i<S;i++) tmp[P[i]]=color[i]; color.set(tmp); out.push(id); }
    function findMove(a,li,dir,turns){ for(var k=0;k<mv.length;k++){ var m=mv[k]; if(m.a===a&&m.li===li&&m.turns===turns&&(turns===2||m.dir===dir)) return k; } return -1; }

    // 1. Wing parity, one orbit at a time (fixed with a single inner-slice quarter turn)
    var wingsByOrbit={};
    md.cubies.forEach(function(cb,cid){
      if(cb.st.length!==2) return;
      var ax=[0,1,2].filter(function(k){return Math.abs(cb.p[k])!==M;})[0], v=cb.p[ax];
      if(v===0) return;
      (wingsByOrbit[Math.abs(v)]=wingsByOrbit[Math.abs(v)]||[]).push({cid:cid,ax:ax,v:v});
    });
    function wingId(w,col){
      var s1=st[md.cubies[w.cid].st[0]], s2=st[md.cubies[w.cid].st[1]];
      var c1=col(s1), c2=col(s2), nA=s1.n, nB=s2.n;
      if(c1>c2){ var t=c1; c1=c2; c2=t; nA=s2.n; nB=s1.n; }
      var e=[0,0,0]; e[w.ax]=Math.sign(w.v);
      return c1+','+c2+','+Math.sign(det(nA,nB,e));
    }
    function wingPar(o){ var ws=wingsByOrbit[o], home={}, perm={};
      ws.forEach(function(w){ home[wingId(w,function(s){return s.f;})]=w.cid; });
      ws.forEach(function(w){ perm[w.cid]=home[wingId(w,function(s){return color[md.index.get(key(s.p,s.n))];})]; });
      return parity(perm); }
    Object.keys(wingsByOrbit).forEach(function(o){
      var ws=wingsByOrbit[o], home={}, perm={};
      ws.forEach(function(w){ home[wingId(w,function(s){return s.f;})]=w.cid; });
      ws.forEach(function(w){ perm[w.cid]=home[wingId(w,function(s){return color[md.index.get(key(s.p,s.n))];})]; });
      if(parity(perm)) apply(findMove(0,(Number(o)+M)/2,1,1));
    });

    // 2. Odd cubes: bring the fixed centres home with middle-slice turns
    var mid=M/2;
    if(N%2===1){
      var cIdx=[0,1,2,3,4,5].map(function(f){ return md.index.get(key(NORMALS[f].map(function(x){return x*M;}),NORMALS[f])); });
      var sl=[]; for(var a=0;a<3;a++) [[1,1],[-1,1],[1,2]].forEach(function(dt){ sl.push(findMove(a,mid,dt[0],dt[1])); });
      var startK=cIdx.map(function(i){return color[i];}).join(''), goal='012345';
      var prev={}; prev[startK]=null; var q=[startK], found=startK===goal;
      while(q.length && !found){
        var cur=q.shift();
        for(var k=0;k<sl.length;k++){
          var P=mv[sl[k]].perm, arr=cur.split('').map(Number), nx=new Array(6);
          // where does centre i go
          for(var f2=0;f2<6;f2++){ var dst=P[cIdx[f2]], df=cIdx.indexOf(dst); nx[df]=arr[f2]; }
          var nk=nx.join('');
          if(!(nk in prev)){ prev[nk]=[cur,sl[k]]; if(nk===goal){found=true;break;} q.push(nk); }
        }
      }
      var path=[], kk=goal; while(prev[kk]){ path.unshift(prev[kk][1]); kk=prev[kk][0]; }
      path.forEach(apply);
    }

    // 3. Corners (+ midges on odd cubes) as a 3x3, solved with Kociemba two-phase
    var grid=[0,mid,M], s3='';
    var cornerPerm={}, needSwap=false;
    if(N%2===0){
      var homeC={};
      md.cubies.forEach(function(cb,cid){ if(cb.st.length===3) homeC[cb.st.map(function(i){return st[i].f;}).sort().join('')]=cid; });
      md.cubies.forEach(function(cb,cid){ if(cb.st.length===3) cornerPerm[cid]=homeC[cb.st.map(function(i){return color[i];}).sort().join('')]; });
      needSwap=parity(cornerPerm)===1;
    }
    for(var f=0;f<6;f++) for(var i3=0;i3<3;i3++) for(var j3=0;j3<3;j3++){
      var isCorner=i3!==1&&j3!==1;
      var letter;
      if(N%2===1 || isCorner){
        var fr=FR[FN[f]], n=fr[0], u=fr[1], r=fr[2], gi=Math.round(grid[i3]*2)/2, gj=Math.round(grid[j3]*2)/2;
        var p=[0,1,2].map(function(k){ return n[k]*M + r[k]*(2*gj-M) + u[k]*(M-2*gi); });
        letter=FN[color[md.index.get(key(p,n))]];
      } else letter=FN[f];
      s3+=letter;
    }
    if(needSwap){
      // swap the UF and UR edges of the virtual 3x3 so the parity is legal
      var a3=s3.split(''); var F01=18+1, R01=9+1; var t2=a3[F01]; a3[F01]=a3[R01]; a3[R01]=t2; s3=a3.join('');
    }
    var sol=G.Cube.fromString(s3).solve();
    (sol||'').trim().split(/\s+/).filter(Boolean).forEach(function(tok){
      var L=tok[0], a=({U:1,D:1,R:0,L:0,F:2,B:2})[L], li=('UFR'.indexOf(L)>=0)?N-1:0, cw=('URF'.indexOf(L)>=0)?-1:1;
      var two=tok.indexOf('2')>=0, prime=tok.indexOf("'")>=0;
      apply(findMove(a,li,prime?-cw:cw,two?2:1));
    });

    // 4. Remaining centres and wings: greedy pure 3-cycles
    if(N>=4){
      var lib=buildLib(md), guard=0;
      while(guard++<400){
        var best=null, bs=0;
        for(var e=0;e<lib.length;e++){ var en=lib[e], g=0, gs=en.groups;
          for(var k3=0;k3<gs.length;k3++){ var grp=gs[k3], after=1, before=1;
            for(var k4=0;k4<grp.length;k4++){ var pr=grp[k4], tf=st[pr[1]].f;

/* ================= Turns ================= */
const queue=[]; let anim=null;
const busy=()=>!!anim||queue.length>0;
function startNext(){
  if(anim||!queue.length) return;
  const m=queue.shift();
  cubeRoot.updateMatrixWorld(true);
  pivot.rotation.set(0,0,0); pivot.updateMatrixWorld(true);
  const coord=m.li-H;
  const sel=cubies.filter(c=>Math.abs(c.position[m.axis]-coord)<0.25);
  sel.forEach(c=>pivot.attach(c));
  anim={m,sel,t:0};
}
const Rm=new THREE.Matrix4();
function snap(c){
  c.position.set(Math.round(c.position.x*2)/2,Math.round(c.position.y*2)/2,Math.round(c.position.z*2)/2);
  Rm.makeRotationFromQuaternion(c.quaternion);
  const e=Rm.elements; for(let i=0;i<16;i++) e[i]=Math.round(e[i]);
  c.quaternion.setFromRotationMatrix(Rm);
}
function finishAnim(){
  const {m,sel}=anim;
  pivot.rotation[m.axis]=m.dir*m.turns*Math.PI/2; pivot.updateMatrixWorld(true);
  sel.forEach(c=>{cubeRoot.attach(c); snap(c);});
  pivot.rotation.set(0,0,0);
  anim=null;
  if(!queue.length) jobDone();
}
const ease=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

const vTmp=new V3();
function stickerState(){
  return stickers.map(s=>{
    const c=s.userData.cubie;
    vTmp.copy(s.userData.n).applyQuaternion(c.quaternion);
    return {p:[c.position.x,c.position.y,c.position.z].map(v=>Math.round(v*2)), n:[vTmp.x,vTmp.y,vTmp.z].map(Math.round), c:s.userData.c};
  });
}
function isSolved(){
  const seen={};
  for(const s of stickers){
    vTmp.copy(s.userData.n).applyQuaternion(s.userData.cubie.quaternion);
    const k=Math.round(vTmp.x)+','+Math.round(vTmp.y)+','+Math.round(vTmp.z);
    if(seen[k]===undefined) seen[k]=s.userData.c; else if(seen[k]!==s.userData.c) return false;
  }
  return true;
}

/* ================= Solver worker: Kociemba for 3x3, reduction + pure 3-cycles for 4x4/5x5 ================= */
const CJ='https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/';
const solver={ready:false, worker:null, main:false, pending:[], cb:{}, seq:0};
function startSolver(){
  try{
    const src=`importScripts('${CJ}cube.js','${CJ}solve.js');Cube.initSolver();
(${SOLVER.toString()})(self);
postMessage({ready:true});
onmessage=function(e){ var d=e.data;
  if(d.warm){ try{ self.warm(d.warm); }catch(err){} return; }
  var r; try{ r={id:d.id, moves:self.solveCube(d.N,d.stickers)}; }catch(err){ r={id:d.id, error:String(err)}; }
  postMessage(r); };`;
    const w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    w.onmessage=e=>{
      if(e.data.ready){ solver.ready=true; flush(); }
      else { const cb=solver.cb[e.data.id]; delete solver.cb[e.data.id]; if(cb) cb(e.data.moves||null); }
    };
    w.onerror=()=>{ w.terminate(); solver.worker=null; mainThreadSolver(); };
    solver.worker=w;
  }catch(e){ mainThreadSolver(); }
}
function flush(){
  const p=solver.pending; solver.pending=[];
  p.forEach(msg=>{
    if(solver.worker) solver.worker.postMessage(msg);
    else setTimeout(()=>{ if(msg.warm){ try{ window.warm(msg.warm); }catch(e){} return; }
      let mv=null; try{ mv=window.solveCube(msg.N,msg.stickers); }catch(e){}
      const cb=solver.cb[msg.id]; delete solver.cb[msg.id]; if(cb) cb(mv); },30);
  });
}
function mainThreadSolver(){
  if(solver.main) return; solver.main=true; solver.ready=false;
  const load=src=>new Promise((res,rej)=>{const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s);});
  load(CJ+'cube.js').then(()=>load(CJ+'solve.js')).then(()=>{
    setTimeout(()=>{ window.Cube.initSolver(); SOLVER(window); solver.ready=true; flush(); },60);
  }).catch(()=>{ Object.keys(solver.cb).forEach(id=>{ const cb=solver.cb[id]; delete solver.cb[id]; cb(null); }); });
}
function send(msg){
  if(solver.ready) { solver.pending.push(msg); flush(); }
  else { solver.pending.push(msg); if(!solver.worker && !solver.main) mainThreadSolver(); }
}
function requestSolve(cb){
  const id=++solver.seq; solver.cb[id]=cb;
  send({id, N, stickers:stickerState()});
  return id;
}
function warmSolver(n){ if(n>=4) send({warm:n}); }
setTimeout(startSolver, 400);

const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];

const gallery={on:false, phase:'wait', phaseT:0, phaseDur:8, shot:null, shotT:0, trans:null, cut:null, lastType:null, wake:null};

function refresh(){
  sizeBtns.forEach(b=>b.disabled=gallery.on);
  shuffleBtn.disabled=gallery.on||busy()||thinking;
  solveBtn.disabled=gallery.on||busy()||thinking||isSolved();

function runJob(moves,dur,isSolve){
  moves.forEach(m=>{ m.dur=dur*(m.turns===2?1.55:1); queue.push(m); });
  job={solve:isSolve}; refresh();
}
function jobDone(){
  if(job){
    const j=job; job=null;
    if(j.solve && isSolved()) celebT=0;
    if(gallery.on){
      gallery.phase='wait'; gallery.phaseT=0;
      gallery.phaseDur = j.solve ? 15.5 : rand(2.5,3.5);
    }
  }
  refresh();
}
function doShuffle(dur){
  const sp=SPEED[N], moves=[]; let last=null;
  for(let i=0;i<sp.n;i++){
    let ax; do{ ax=['x','y','z'][Math.floor(Math.random()*3)]; }while(ax===last); last=ax;
    const li = sp.face ? (Math.random()<0.5?0:N-1) : Math.floor(Math.random()*N);
    moves.push({axis:ax,li,dir:Math.random()<0.5?-1:1,turns:1});
  }
  runJob(moves,dur,false);
}
function doSolve(dur, onFail){
  thinking=true; refresh();
  const myN=N;
  solveId=requestSolve(moves=>{
    if(myN!==N) return;
    thinking=false;
    if(!moves||!moves.length){ refresh(); if(onFail) onFail(); return; }
    runJob(moves.map(m=>({axis:m.axis,li:m.li,dir:m.dir,turns:m.turns})),dur,true);
  });
}

/* ================= Camera pose ================= */
const KEYS=['az','el','dist','tx','ty','tz','roll','fov'];
let normalDist=12, galleryDist=12, viewOffTarget=0, viewOff=0;
const homePose=()=>({az:0, el:0.07, dist:normalDist, tx:0, ty:0, tz:0, roll:0, fov:28});

/* ================= Gallery director ================= */
function makeShot(from){
  const types = gallery.phase==='wait' && !busy() && !thinking
    ? ['core','detail','push','orbit','top','detail']
    : ['orbit','push','low','top','detail','orbit'];
  const t=pick(types.filter(x=>x!==gallery.lastType)); gallery.lastType=t;
  const s=Math.random()<0.5?1:-1, az=from.az+rand(-1.3,1.3), D=galleryDist;
  const base={az, el:0.3, dist:D, tx:0, ty:0, tz:0, roll:0, fov:28};
  let a, b;
  switch(t){
    case 'orbit': a={...base, el:rand(0.18,0.45)}; b={...a, az:az+s*rand(0.7,1.1), el:a.el+rand(-0.12,0.12)}; break;
    case 'push':  a={...base, el:rand(0.12,0.4), dist:D*1.06}; b={...a, dist:D*0.7, az:az+s*0.28}; break;
    case 'low':   a={...base, el:rand(-0.34,-0.18), dist:D*0.9, roll:s*0.05}; b={...a, el:rand(0.04,0.18), az:az+s*0.55, roll:-s*0.02}; break;
    case 'top':   a={...base, el:rand(0.95,1.15), dist:D*0.95}; b={...a, az:az+s*0.85, el:a.el+0.12, dist:D*0.85}; break;
    case 'detail':{
      const d=new V3(rand(-1,1),rand(-1,1),rand(-1,1)).normalize().multiplyScalar(1.35);
      a={...base, tx:d.x, ty:d.y, tz:d.z, dist:D*0.5, fov:22, el:rand(-0.1,0.5), roll:s*0.04};
      b={...a, az:az+s*0.42, dist:D*0.43, tx:d.x*0.75, ty:d.y*0.75, tz:d.z*0.75, roll:-s*0.01};
      break; }
    default:      a={...base, dist:D*0.56, fov:24, el:rand(0.1,0.5), roll:s*0.03}; b={...a, dist:D*0.43, az:az+s*0.5};
  }
  return {type:t, a, b, dur:rand(7.5,11)};
}
function nextShot(allowCut){
  const shot=makeShot(pose);
  if(allowCut && Math.random()<0.4){
    gallery.cut={t:0, shot};            // dip to dark, swap at the darkest frame
  } else {
    gallery.shot=shot; gallery.shotT=0;
    gallery.trans={from:copyPose(pose), t:0, dur:2.4};
  }
}
function directorStep(dt){
  const G=gallery;
  // story: wait (breathing) → shuffle → short wait → solve → long wait …
  G.phaseT+=dt;
  if(G.phase==='wait' && G.phaseT>G.phaseDur && !busy() && !thinking && !sizeSwitch){
    if(isSolved()){ G.phase='shuffle'; doShuffle(SPEED[N].gsh); }
    else { G.phase='solve'; doSolve(SPEED[N].gso, ()=>{ G.phase='wait'; G.phaseT=0; G.phaseDur=4; }); }
  }
  // camera
  if(G.cut){
    G.cut.t+=dt;
    if(G.cut.t>=0.55 && !G.cut.swapped){ G.cut.swapped=true; G.shot=G.cut.shot; G.shotT=0; G.trans=null; lerpPose(G.shot.a,G.shot.a,0,pose); }
    veil.style.opacity = G.cut.t<0.55 ? smooth(G.cut.t/0.55) : 1-smooth((G.cut.t-0.55)/0.7);
    if(G.cut.t>=1.25){ G.cut=null; veil.style.opacity=0; }
  }
  const S=G.shot; if(!S) return;
  G.shotT+=dt;
  const target=lerpPose(S.a,S.b,smooth(G.shotT/S.dur),{});
  if(G.trans){
    G.trans.t+=dt;
    lerpPose(G.trans.from,target,smooth(G.trans.t/G.trans.dur),pose);
    if(G.trans.t>=G.trans.dur) G.trans=null;
  } else if(!G.cut || !G.cut.swapped){
    Object.assign(pose,target);
  } else {
    Object.assign(pose,target);
  }
  if(G.shotT>=S.dur && !G.cut) nextShot(true);
}
async function enterGallery(){

let drag=null, zoom=1, zoomTarget=1;
const ZMIN=0.4, ZMAX=1.9;
const clampZ=z=>Math.min(ZMAX,Math.max(ZMIN,z));
const qT=new THREE.Quaternion(), XA=new V3(1,0,0);
const pts=new Map();
let pinch=null, lastTap={t:0,x:0,y:0};
const pinchDist=()=>{ const a=[...pts.values()]; return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1; };
canvas.addEventListener('pointerdown',e=>{
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY,moved:0});
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  lastInteract=performance.now();
  if(pts.size===2){ drag=null; pinch={d0:pinchDist(), z0:zoomTarget}; canvas.classList.remove('grabbing'); return; }
  if(pts.size===1){
    drag={id:e.pointerId,x:e.clientX,y:e.clientY}; canvas.classList.add('grabbing');
    const now=performance.now();
    if(now-lastTap.t<320 && Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<36){ zoomTarget=1; lastTap.t=0; }
    else lastTap={t:now,x:e.clientX,y:e.clientY};
  }
});
canvas.addEventListener('pointermove',e=>{
  const p=pts.get(e.pointerId); if(!p) return;
  p.moved+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y); p.x=e.clientX; p.y=e.clientY;
  if(p.moved>12) lastTap.t=0;
  lastInteract=performance.now();
  if(pinch && pts.size>=2){ zoomTarget=clampZ(pinch.z0*pinch.d0/pinchDist()); return; }
  if(!drag||e.pointerId!==drag.id) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  cubeRoot.quaternion.premultiply(qT.setFromAxisAngle(YUP,dx*0.008));
  cubeRoot.quaternion.premultiply(qT.setFromAxisAngle(XA,dy*0.008));
});
const endPointer=e=>{
  if(!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if(pts.size<2) pinch=null;
  if(pts.size===1){ const [id,q]=[...pts.entries()][0]; drag={id,x:q.x,y:q.y}; }   // keep turning with the finger left down, without a jump
  else if(pts.size===0){ drag=null; canvas.classList.remove('grabbing'); }
};
canvas.addEventListener('pointerup',endPointer); canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{
  e.preventDefault(); lastInteract=performance.now();
  const k=e.deltaMode===1?0.05:0.0016;
  zoomTarget=clampZ(zoomTarget*Math.exp(e.deltaY*k));
},{passive:false});
canvas.addEventListener('dblclick',()=>{ zoomTarget=1; });
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));

/* ================= Loop ================= */
let last=performance.now(), clock=0, openness=0.0, breathT=0;
// Breathing cycle (seconds): closed 5 → opening 4 → open 6 → closing 4
function breath(t){
  const T=19, x=t%T;
  if(x<5) return 0;
  if(x<9) return ease((x-5)/4);
  if(x<15) return 1;
  return 1-ease((x-15)/4);
}
function frame(now){
  const rawDt=Math.min(0.5,(now-last)/1000);
  const dt=Math.min(0.05,rawDt); last=now; clock+=dt;
  shared.time.value=clock;
  startNext();
  if(anim){
    anim.t=Math.min(1,anim.t+dt/anim.m.dur);
    pivot.rotation.set(0,0,0);
    pivot.rotation[anim.m.axis]=ease(anim.t)*anim.m.dir*anim.m.turns*Math.PI/2;
    if(anim.t>=1){ finishAnim(); startNext(); }
  }
  // Exploded view: open gently while resting, close to a hair's gap while turning
  let target;
  if(busy()||thinking){ target=0.05; breathT=4.2; }
  else if(reduceMotion){ target=0.12; }
  else { breathT+=dt; target=0.02+0.52*breath(breathT); }
  openness+=(target-openness)*Math.min(1,dt*(busy()?3.0:1.6));
  for(const c of cubies) c.userData.body.position.copy(c.userData.home).multiplyScalar(openness);

  sizeStep(rawDt);
  if(gallery.on){ directorStep(dt); }
  else {
    lerpPose(pose,homePose(),1-Math.exp(-dt*2.2),pose);
    if(!reduceMotion && !drag && now-lastInteract>4000) cubeRoot.quaternion.premultiply(qT.setFromAxisAngle(YUP,dt*0.1));
  }
  viewOff+=(viewOffTarget-viewOff)*(1-Math.exp(-dt*3));
  applyCamera(dt);

  if(!reduceMotion){ cubeRoot.position.y=Math.sin(clock*0.6)*0.05; dust.rotation.y+=dt*0.012; }
  if(celebT>=0){
    celebT+=dt; const k=Math.min(1,celebT/2.2);
    shared.pulse.value=Math.sin(Math.PI*k);
    if(k>=1){ celebT=-1; shared.pulse.value=0; }
  }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
let startN=3;
try{ const v=Number(localStorage.getItem('glass-cube-size')); if(v===4||v===5) startN=v; }catch(e){}
buildCube(startN); markSize(); refresh();
setTimeout(()=>warmSolver(N),2500);
requestAnimationFrame(frame);
})();
