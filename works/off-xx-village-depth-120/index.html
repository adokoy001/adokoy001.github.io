   暗い艦内の見た目に固定（暗い一色。上から赤い灯り）。色は、カメラの青緑、ソナーの銅色、聴音の緑、計器の琥珀色。 */

  for(let c=0;c<2;c++){const i=q.findIndex(x=>x.ch===c);if(i<0)continue;const it=q[i];if(it.at>S.t)continue;

}

/* ---------- 柱（乗員は「脚」と呼ぶ） ----------
   4〜6本が、岸と平行に進む。数秒おきに、いちばん後ろの1本が、根もとごと滑って、群れの先頭へ出る（持ち上がらない）。止まるたびに、鈍い音がして、泥が舞う。
   st：rest 立っている／pre 動きだす前の震え／slide 滑っている／sink 下へ沈む／rise 下から立ちあがる。k は、立っている割合（0〜1）。s は、音を返す強さ */
function mkLeg(x,z){return{x,z,r:rnd(8.5,13),s:1,k:1,hp:2,st:'rest',t:0,x0:x,z0:z,x1:x,z1:z,dur:0,tau:1.6,vx:0,vz:0,lx:0,lz:0,lvx:0,lvz:0}}
function freeSpot(x,z,min){for(const l of LEG)if(Math.hypot(l.x-x,l.z-z)<min||Math.hypot(l.x1-x,l.z1-z)<min)return false;return !(D.live&&Math.hypot(D.x-x,D.z-z)<48)}
function legsInit(){LEG.length=0;const al=[0,50,98,150];for(let i=0;i<4;i++)LEG.push(mkLeg(al[i]+rnd(-8,8),(i%2?1:-1)*rnd(18,46)))}
function thud(l,k){S.thudT=S.t;const d=dist(MS,l);A.thud(d,k||1);SILT.push({x:l.x,z:l.z,rad:rnd(20,28),a:1});if(SILT.length>4)SILT.shift();
  if(D.live){const dd=dist(D,l);if(dd<90)S.shake=Math.max(S.shake,(1-dd/90)*.9)}WF.pulse=1}
function stepStart(){
  const rest=LEG.filter(l=>l.st==='rest');if(rest.length<2)return;
  const [tx,tz]=dirT(),C=centroid();let r=rest[0],fa=-1e9;
  for(const l of rest)if((l.x-C.x)*tx+(l.z-C.z)*tz<(r.x-C.x)*tx+(r.z-C.z)*tz)r=l;
  for(const l of LEG)fa=Math.max(fa,(l.x1-C.x)*tx+(l.z1-C.z)*tz);
  for(let k=0;k<10;k++){const a=fa+rnd(22,40),b=rnd(-52,52),x=C.x+tx*a-tz*b,z=C.z+tz*a+tx*b;if(k===9||freeSpot(x,z,32)){r.x1=x;r.z1=z;break}}
  r.st='pre';r.t=0;r.dur=clamp(Math.hypot(r.x1-r.x,r.z1-r.z)/12.5,8,13);A.drag(dist(MS,r),r.dur);
}
function legSink(l){if(l.st==='sink')return;l.st='sink';l.t=0;l.x1=l.x;l.z1=l.z}
function legRise(){if(LEG.length>=6)return null;const [tx,tz]=dirT(),C=centroid();
  for(let k=0;k<14;k++){const a=rnd(-30,150),b=rnd(-62,62),x=C.x+tx*a-tz*b,z=C.z+tz*a+tx*b;if(k===13||freeSpot(x,z,34)){const l=mkLeg(x,z);l.st='rise';l.k=0;l.t=0;LEG.push(l);A.drag(dist(MS,l),5.4);return l}}return null}
function legsTick(dt){
  // 次の柱は、前の柱がまだ滑っているうちに、動きだす（歩みは重なる）
  if(S.t>S.nextStep&&!S.end&&!LEG.some(l=>l.st==='pre'||(l.st==='slide'&&l.t<l.dur*.5))){S.nextStep=S.t+rnd(6.2,7.6);stepStart()}
  const st=S.coldOn||!S.bedOn?0:1;
  for(let i=LEG.length-1;i>=0;i--){const l=LEG[i],px=l.x,pz=l.z;l.t+=dt;l.s+=(st-l.s)*ease(dt,.9);
    if(l.st==='pre'){if(l.t>1.6){l.st='slide';l.t=0;l.x0=l.x;l.z0=l.z}}
    // 滑る：ゆっくり動きだし、速さがのる。行き先の 86% まで来ても、まだ速さが残っている
    else if(l.st==='slide'){const q=Math.min(1,l.t/l.dur),u=.86*(.6*q*q*(3-2*q)+.4*q*q);l.x=mix(l.x0,l.x1,u);l.z=mix(l.z0,l.z1,u);
      if(l.t>=l.dur){l.st='settle';l.t=0;l.x0=l.x;l.z0=l.z;l.tau=.14*l.dur/(.86*.8);thud(l);A.groan(dist(MS,l));dust(l.x,l.z,l.r*1.9,1)}}
    // 止まりきれない：海底を押しながら、残りを、だんだん遅くなって進む（速さは、滑りの終わりから、つながっている）
    else if(l.st==='settle'){const u=1-Math.exp(-l.t/l.tau);l.x=mix(l.x0,l.x1,u);l.z=mix(l.z0,l.z1,u);if(l.t>l.tau*4.2){l.st='rest';l.t=0;thud(l,.4)}}
    else if(l.st==='sink'){l.k=1-sstep(0,1,l.t/7);if(l.t>7){LEG.splice(i,1);continue}}
    else if(l.st==='rise'){l.k=sstep(0,1,l.t/7);if(l.t>7){l.st='rest';l.t=0;thud(l,.8)}}
    // 泥：動いているあいだ、14m 進むごとに、うしろに巻き上がる。速いほど濃い
    {const mv=Math.hypot(l.x-px,l.z-pz);if(mv>0){l.dm=(l.dm||0)+mv;if(l.dm>14){l.dm=0;const sp=mv/Math.max(dt,1e-3);dust(l.x-(l.x-px)/mv*l.r*.7+rnd(-4,4),l.z-(l.z-pz)/mv*l.r*.7+rnd(-4,4),l.r*rnd(.9,1.3),clamp(.25+sp/14,.3,1))}}}
    // 芯のかたむき（l.lx, l.lz：高さ1m あたりのずれ）。根もとが速さを変えると、上は遅れる。重い振り子のように、5.5秒の周期で、しばらく揺れつづける
    if(dt>0){const vx=(l.x-px)/dt,vz=(l.z-pz)/dt,ax=clamp((vx-l.vx)/dt,-14,14),az=clamp((vz-l.vz)/dt,-14,14),W=1.14,Z=.15,c=.045;l.vx=vx;l.vz=vz;
      l.lvx+=(-W*W*l.lx-2*Z*W*l.lvx-c*ax)*dt;l.lvz+=(-W*W*l.lz-2*Z*W*l.lvz-c*az)*dt;l.lx=clamp(l.lx+l.lvx*dt,-.2,.2);l.lz=clamp(l.lz+l.lvz*dt,-.2,.2)}
    if(D.live&&(l.st==='slide'||l.st==='settle'||l.st==='rise')&&l.k>.3&&dist(D,l)<l.r*1.3+4.5)droneLost('hit');
  }
  for(let i=DUST.length-1;i>=0;i--){const q=DUST[i];q.r+=q.g*q.a*dt;q.a-=dt/17;if(q.a<=0)DUST.splice(i,1)}
  for(let i=SILT.length-1;i>=0;i--){const s=SILT[i];s.a-=dt/7;s.rad+=dt*2.2;if(s.a<=0)SILT.splice(i,1)}
}

/* ---------- 無人機 ----------
   速さは3つ：ふつう（毎秒10mほど。前の柱との間合いで、自動で加減する）、SPRINT（27m。絵が荒れる）、LOW（4.5m。海底から3.5mまで降りる。カメラに海底が映るが、有線がたるんで海底に触れる）。
   有線が海底に取られると、張力が上がる。SPRINT で引けば外れる。放っておくと、真下へ引かれて失う。CUT で、自分から切って捨てることもできる。 */
function launch(id){const C=centroid();Object.assign(D,{live:1,id,x:MS.x,z:MS.z,psi:Math.atan2(C.x-MS.x,C.z-MS.z),v:6,alt:16,pit:-.16,tens:0,snag:0,foul:0,stat:0,surfT:0,born:S.t});D.hc=D.crs=D.psi;D.w=0;D.light=1;D.loT=0;syncKeys();A.launch(.5)}
function droneLost(why){if(!D.live)return;D.live=0;D.stat=1;GM.lostN++;A.staticHit();hmsg('LINK LOST',6);S.lock=0;
  if(why==='cut'){GM.cut++;ln('tet5',.4)}else if(why==='tether'){ln('tet4',0,'panic');ln('lost1',3)}else ln('lost1',.6,why==='hit'?'panic':'calm');
  if(S.stage>=7)return;
  if(D.id<3){ln('lost2',why==='tether'?6:3.2);at(why==='tether'?10:7,()=>{if(S.black||S.stage>=7)return;launch(D.id+1);ln(D.id===2?'lost3':'lost4',.3)})}
  else{ln('last1',4);ln('last2',7)}
}
function syncKeys(){$('ctl').hidden=!!S.black;$('ui').style.visibility=S.black?'hidden':'';const b=$('kt');if(b)b.setAttribute('aria-pressed',String(!!D.light));const c=$('kc');if(c)c.hidden=!(D.live&&D.tens>.3&&!D.auto);
  for(const [id,v] of [['km',D.mark],['ks',D.sprint],['kl',D.low]]){const e=$(id);if(e)e.classList.toggle('on',!!v)}}
// 乗員の操縦（人が触っていないとき）。群れのいちばん後ろの柱の、さらに後ろにつく（後ろの柱は前へ滑っていくので、後ろにいれば、ぶつからない）。
// ねらうのは、扇に入っている柱のうち、いちばん先のほう（次に動くまでが長い）。当たりかけの柱があれば、それを先に
function autopilot(dt){
  const [tx,tz]=dirT(),C=centroid();let rear=null,ra=1e9,tg=null,ta=-1e9;
  for(const l of LEG){if(l.st==='sink')continue;const a=(l.x-C.x)*tx+(l.z-C.z)*tz;if(l.st!=='slide'&&a<ra){ra=a;rear=l}}
  D.mark=0;D.sprint=0;D.low=0;
  if(!rear){D.hc=Math.atan2(tx,tz);return}
  for(const l of LEG){if((l.st!=='rest'&&!(l.st==='settle'&&l.t>1.5))||l.k<.9||l.s<.3)continue;const dx=l.x-D.x,dz=l.z-D.z,r=Math.hypot(dx,dz);if(r>188||r<58)continue;
    const b=Math.abs(wrapPi(Math.atan2(dx,dz)-Math.atan2(tx,tz)));if(b>.5)continue;const sc=(l.x-C.x)*tx+(l.z-C.z)*tz+(l.hp<2?400:0)+(TP.on&&l===TP.tg?2000:0);if(sc>ta){ta=sc;tg=l}}
  const px=rear.x-tx*50+((C.x-rear.x)*-tz+(C.z-rear.z)*tx)*-tz*.6,pz=rear.z-tz*50+((C.x-rear.x)*-tz+(C.z-rear.z)*tx)*tx*.6,dp=Math.hypot(px-D.x,pz-D.z);
  const beh=(rear.x-D.x)*tx+(rear.z-D.z)*tz;                                   // 後ろの柱まで、進む向きに何m
  if(dp>60||beh<26){D.hc=Math.atan2(px-D.x,pz-D.z);D.sprint=dp>110&&beh>60?1:0}
  else if(tg&&(S.wfree||TP.on)&&!S.coldOn){D.hc=Math.atan2(tg.x-D.x,tg.z-D.z);D.mark=1}
  else D.hc=Math.atan2(px+tx*60-D.x,pz+tz*60-D.z);
  // 行く手（3秒ぶん）に柱があれば、よける
  const fx=Math.sin(D.psi),fz=Math.cos(D.psi);
  for(const l of LEG){for(const [qx,qz] of [[l.x,l.z],[l.x1,l.z1],[l.x+l.vx*2,l.z+l.vz*2]]){const dx=qx-D.x,dz=qz-D.z,al=dx*fx+dz*fz,pe=dx*fz-dz*fx;if(al>-8&&al<Math.max(60,D.v*9)&&Math.abs(pe)<l.r+18){D.hc=D.psi+(pe>0?-1:1)*.9;D.sprint=0;D.mark=0}}}
  // 見せ場：灯りに小さなものが寄ってくる／低く降りて海底を映し、有線を取られかける
  const T=S.ph;let near=1e9;for(const m of MOV)near=Math.min(near,dist(D,m));
  if(D.light&&(near<20||D.foul>.2)&&T>S.said.sml1T+4){D.light=0;D.loT=S.t+9}else if(!D.light&&S.t>(D.loT||0))D.light=1;   // 灯りは、ふだんつけたまま。小さなものが寄ってきたら（一度それを見て、口にしてから）、しばらく消す
  if(T>227&&T<236&&D.tens<.55&&beh>34){D.low=1;D.sprint=0;D.mark=0}
  if(D.tens>.3&&!(T>227&&T<236)){D.sprint=1;D.low=0}
}
function droneTick(dt){
  D.auto=S.t-S.manT>10&&!G.on?1:0;
  if(!D.live){D.stat=Math.min(1,D.stat+dt*3);return}
  D.stat=Math.max(0,D.stat-dt*2);
  if(D.auto)autopilot(dt);else{D.mark=IN.mark;D.sprint=IN.sprint;D.low=IN.low;if(IN.kx)D.hc=D.psi+IN.kx*.5;if(G.on&&G.az0!=null)D.hc=G.base+wrapPi(G.az-G.az0)}
  if(D.surfT){D.mark=D.sprint=D.low=0}
  // 向きを変える：水の中の重い機体。舵を切っても、すぐには回らず、回りはじめると、すぐには止まらない（少し行きすぎて、戻る）。速いほど、回りにくい
  const wmax=(D.sprint?.24:.4)*(1-.5*D.foul),dh=wrapPi(D.hc-D.psi);D.w=clamp(D.w+(1.25*clamp(dh,-.7,.7)-1.5*D.w)*dt,-wmax,wmax);D.psi=wrapPi(D.psi+D.w*dt);
  // 進む向き（D.crs）は、頭の向き（D.psi）に、遅れてついてくる（横すべり）。すべっているあいだ、水の抵抗で、速さが落ちる
  D.crs=wrapPi(D.crs+wrapPi(D.psi-D.crs)*ease(dt,.6));const slip=wrapPi(D.psi-D.crs);D.v-=D.v*Math.min(1,Math.abs(slip))*.55*dt;
  // ふつうの速さは、前の柱との間合いで自動で加減する（近づきすぎず、離されすぎず。およそ 42m を保つ。カメラの灯りが届く近さ）
  let gap=1e9;{const fx=Math.sin(D.psi),fz=Math.cos(D.psi);for(const l of LEG){const dx=l.x-D.x,dz=l.z-D.z,r=Math.hypot(dx,dz);if(r<220&&dx*fx+dz*fz>r*.34)gap=Math.min(gap,r-l.r)}}
  let cr=gap<1e8?clamp(4.2+(gap-42)*.08,1.2,6):5.5;if(TP.on&&TP.tg)cr=Math.min(cr,clamp((dist(D,TP.tg)-TP.tg.r-52)*.2,0,6));   // 魚雷が走っているあいだは、目標から 50m あまり離れて、止まって待つ
  const vt=(D.surfT?2:D.low?3:D.sprint?9:cr)*(1-.55*D.foul)*(1-.6*sstep(.5,1,D.tens));D.vt=vt;const acc=(vt-D.v)*ease(dt,vt>D.v?(D.sprint?.3:.22):.35);D.v+=acc;   // 加速は、ゆっくり。減速は、水の抵抗のぶん、少し早い
  D.x+=Math.sin(D.crs)*D.v*dt;D.z+=Math.cos(D.crs)*D.v*dt;
  D.alt+=((D.surfT?16:D.low?3.5:16)-D.alt)*ease(dt,.5);D.pit+=((D.low?-.62:-.16)-clamp((vt-D.v)*.006,-.05,.05)-D.pit)*ease(dt,.6);/* 加速のあいだ、鼻が少し下がる */D.lightK+=((D.light?1:0)-D.lightK)*ease(dt,.25);
  // 深度の数字：海底までの深さ（柱の群れに近いほど浅い）から、高度を引いたもの。海面へ上げるときは、0 へ
  const C=centroid(),bd=mix(S.snd,140,sstep(250,700,dist(D,C)));
  D.depth=D.surfT?Math.max(0,(bd-D.alt)*(1-sstep(0,12,S.t-D.surfT))):bd-D.alt;
  // 有線
  const slow=D.v<6.5&&D.alt<9&&dist(D,C)<400&&S.stage<7;
  if(slow)D.tens=Math.min(1,D.tens+dt/7.5);else if(D.tens>0)D.tens=Math.max(0,D.tens-dt/(D.sprint&&D.alt>9?2.4:11));
  if(D.tens>.3&&!D.snag){D.snag=1;ln('tet1',0);ln('tet2',3.2)}
  if(D.snag&&D.tens<=.02){D.snag=0;ln('tet3',.2)}
  if(D.tens>=1)droneLost('tether');
  // 小さなものが、まとわりつく
  let nn=0;for(const m of MOV)if(dist(D,m)<5)nn++;
  D.foul=clamp(D.foul+(nn>=2&&D.light?dt/6:-dt/2.5),0,1);if(D.foul>=1)droneLost('foul');
  for(const l of LEG)if(l.st==='rest'&&l.k>.9&&dist(D,l)<l.r*1.3+1.5)droneLost('hit');
}

/* ---------- 標定と魚雷 ----------
   正面（左右9°）の柱を、MARK を押しつづけて捉える。1.6秒で母艦が撃つ。魚雷は12秒で届く。そのあいだに、合わせて3秒、同じ柱を捉えていれば、当たる。
   当たると、柱は「下へ」沈む（2発で）。爆発の30m以内にいると、無人機も失う。 */
function markTick(dt){
  let best=null,bb=1e9;
  if(D.live)for(const l of LEG){if(l.st==='sink'||l.k<.6||l.s<.3)continue;const dx=l.x-D.x,dz=l.z-D.z,r=Math.hypot(dx,dz),b=Math.abs(wrapPi(Math.atan2(dx,dz)-D.psi));if(r>l.r+10&&r<192&&b<.16&&b<bb){bb=b;best=l}}
  S.cand=best;const holding=D.live&&D.mark&&best&&S.noise<.4;
  if(TP.on){TP.t+=dt;const u=TP.t/TP.T;if(LEG.indexOf(TP.tg)<0){TP.on=0;ln('miss',.2);return}
    TP.x=mix(TP.x0,TP.tg.x,u*u*(3-2*u));TP.z=mix(TP.z0,TP.tg.z,u*u*(3-2*u));
    if(holding&&best===TP.tg)TP.guide+=dt;
    if(TP.t>TP.T-10&&TP.T>11.5&&!(TP.said&1)){TP.said|=1;ln('t10',0)}
    if(TP.t>5&&TP.guide<1&&!(TP.said&2)){TP.said|=2;ln('hold',0)}
    if(TP.t>=TP.T){TP.on=0;TP.ready=S.t+(D.auto?34:9);A.trun(0);if(TP.guide>=GD)hitLeg(TP.tg);else{ln('miss',.3);hmsg('NO DETONATION',4)}if(GM.wpn<=0)once('wout',7)}
  }else if(S.wfree&&GM.wpn>0&&S.t>TP.ready&&!S.end&&S.stage<7){
    if(holding){if(S.lockL!==best){S.lockL=best;S.lock=0}S.lock+=dt/1.6;if(S.lock>=1)fire(best)}else S.lock=Math.max(0,S.lock-dt*1.4)}
  else S.lock=0;
}
function fire(l){A.clack(1);TP.gk=0;S.lock=0;S.lockL=null;GM.wpn--;GM.fired++;Object.assign(TP,{on:1,tg:l,t:0,T:12,guide:0,said:0,x0:MS.x,z0:MS.z,x:MS.x,z:MS.z});
  ln('sol',0);ln('shoot',1);ln('fired',2);at(1.6,()=>{A.launch(1);A.trun(1)});hmsg('UNIT RUNNING',5)}
function hitLeg(l){S.hull=Math.max(S.hull,.3);GM.hits++;l.hp--;{const dx=MS.x-l.x,dz=MS.z-l.z,dd=Math.hypot(dx,dz)||1,q=legAt(l,14);EXP.x=q.x+dx/dd*(q.r+1.5);EXP.z=q.z+dz/dd*(q.r+1.5);EXP.y=14}EXP.t=0;EXP.on=1;snowBlast();S.flash=.8;A.expl(dist(MS,l));ln(anyOf(['hit1','hit2']),.9);hmsg('DETONATION',4);WF.pulse=1;

/* ---------- 母艦の聴音の帯 ----------
   横が方位（左端が北、右へ時計回り）、縦が時間（新しい音が上から流れ落ちる）。漁船は細い筋、柱の群れはぼんやりした帯で、止まるたびに明るく光る。

  if(!WF.cv){WF.cv=document.createElement('canvas');WF.cv.width=WF.w;WF.cv.height=WF.h;WF.cx=WF.cv.getContext('2d')}
  const c=WF.cx;if(WF.reset){c.fillStyle='#000';c.fillRect(0,0,WF.w,WF.h);WF.reset=0}
  WF.acc+=dt;let n=0;
  while(WF.acc>.17&&n++<4){WF.acc-=.17;c.drawImage(WF.cv,0,1);const im=c.createImageData(WF.w,1),d=im.data,C=centroid(),bg=Math.atan2(C.x-MS.x,C.z-MS.z);
    const bt=TP.on?Math.atan2(TP.x-MS.x,TP.z-MS.z):null,pu=WF.pulse>0?1:0,vo=WF.voice>0?1:0;
    for(let x=0;x<WF.w;x++){const th=x/WF.w*6.283;let v=.05+.09*Math.random();
      for(const b of BOAT)if(b.on){const dd=wrapPi(th-Math.atan2(b.x-MS.x,b.z-MS.z));v+=.42*Math.exp(-dd*dd/.0012)*(.7+.3*Math.random())}
      {const dd=wrapPi(th-bg);v+=(.05+.8*pu)*Math.exp(-dd*dd/.02)*(.6+.4*Math.random())}
      if(bt!=null){const dd=wrapPi(th-bt);v+=.85*Math.exp(-dd*dd/.0006)}
