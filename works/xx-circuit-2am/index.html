<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>✕✕サーキット 午前二時</title>
<meta name="description" content="夜の山あいのサーキットを、全開で逃げ続ける。">
<style>
/* 画面いっぱいの映像が1枚。操作は右下の小さなボタンだけ。夜の操縦席の見た目に固定（暗い一色）。 */
:root{
  --bg:#000; --fg:#e8e6dc; --ui:#d8d8cc; --ui-bg:rgba(8,10,8,.5); --ui-line:rgba(216,216,204,.28); --focus:#ffd98a;
  --font:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg);touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#ui{position:fixed;display:flex;gap:10px;transition:opacity .6s;
  right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#ui.idle{opacity:.12}
#ui button{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%;cursor:pointer;
  background:var(--ui-bg);color:var(--ui);border:1px solid var(--ui-line)}
#ui button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#ui button[aria-pressed="true"]{color:var(--focus);border-color:var(--focus)}
#ui svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
#msg{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;max-width:calc(100% - 32px);bottom:calc(66px + env(safe-area-inset-bottom,0px));
  padding:7px 12px;border-radius:6px;background:var(--ui-bg);border:1px solid var(--ui-line);color:var(--ui);font-size:13px;line-height:1.5;text-align:center;pointer-events:none}
#nogl{position:fixed;inset:0;display:grid;place-items:center;text-align:center;line-height:1.8;font-size:15px;
  padding-inline:max(16px,env(safe-area-inset-left,0px))}
</style>
</head>
<body>


<canvas id="c" aria-label="夜の山あいのサーキットを走るレーシングカーの、運転席からの眺め。ドラッグで見回せます"></canvas>
<p id="nogl" hidden>この端末では WebGL が使えないため、映像を表示できません。</p>
<p id="msg" role="status" hidden></p>
<div id="ui">
  <button id="bg" type="button" aria-pressed="false" aria-label="端末の向きで見回す" title="ジャイロ" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="5" width="7" height="14" rx="1.6"/><path d="M4.5 9.5a8 8 0 0 0 0 5M19.5 9.5a8 8 0 0 1 0 5M3 8l1.5 1.5L6.2 8.2M21 16l-1.5-1.5-1.7 1.3"/></svg>
  </button>
  <button id="bs" type="button" aria-pressed="false" aria-label="音" title="音">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z"/><path id="bs1" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.4 7.4 0 0 1 0 10.4"/><path id="bs0" d="M16 9.5l5 5m0-5l-5 5"/></svg>
  </button>
  <button id="bf" type="button" aria-pressed="false" aria-label="全画面" title="全画面">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
  </button>
  <button id="bl" type="button" aria-pressed="false" aria-label="軽量モード" title="軽量モード">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C5 10 10 5 19 5c0 9-5 14-14 14zM5 19l8-8"/></svg>
  </button>
</div>

<script>
/*! sasayaki.js v2 — 囁き声の合成エンジン（依存なし・外部通信なし）
 *
 * 雑音を、時間で動く母音の共鳴に通して囁き声を作る。音声ファイルは使わない。
 * 単一HTMLの作品には、このファイルの中身を <script> にそのまま貼る。
 *
 *   const sas = Sasayaki.create(ac, { out: master, voice: 'shojo' });   // ac は AudioContext
 *   sas.add(Sasayaki.PHRASES);                            // 意味のない10句を少しずつ焼く
 *   sas.say();                                            // どれかを、どれかの鳴り方で
 *   sas.say('near', { text: 'ほさな', voice: 'rojin' });  // 句・鳴り方・声を指定
 *   sas.auto(15, 34);                                     // 15〜34秒おきに勝手に囁く
 *
 * 句の書き方：ひらがな・カタカナ、またはローマ字の音節を空白で区切る（'ho sa na'）。
 *   「、」「。」と '_' は間、「っ」は短い詰まり、「ー」は母音を伸ばす、「ん」は鼻音。
 *   囁きには声帯の振動がないので、濁音は清音と同じ音になる（が→か、ざ→さ、だ→た、ば→ぱ）。
 * 鳴り方：'far' 遠くから長いこだまで ／ 'canon' 別の声が遅れて重なる ／ 'rev' 逆再生 ／ 'near' 耳元で乾いたまま
 * 声：Sasayaki.VOICES の名前（otoko, onna, shonen, shojo, osanago, rojin, roba, ookii）か、
 *   { scale, speed, breath, bright, tremor } を直接渡す。
 * 軽量モード：create と render に lite: true。合成を 22.05kHz・共鳴3本にし、畳み込みの残響を短い遅延の輪に替える。
 */
(function (root) {
'use strict';
const SR = 32000, SR_LITE = 22050;
// 母音の共鳴 F1,F2,F3（Hz）。大人の男性の囁きを基準にした値。N は「ん」
const VOW = { a:[850,1400,2800], i:[330,2500,3250], u:[390,1500,2650], e:[560,2050,2850], o:[530,960,2750], N:[300,1300,2500] };
// 子音の雑音：[中心周波数, Q, 長さ(秒), 強さ]
const FRIC = { s:[6400,1.4,.10,.34], sh:[3300,2,.11,.4], ch:[3300,2,.07,.45], ts:[5600,1.6,.06,.4], f:[4800,.7,.08,.16],
               k:[2000,3.5,.028,.7], t:[4700,1.6,.02,.55], p:[900,1.5,.016,.5] };
const STOP = { k:1, t:1, p:1, ch:1, ts:1 };
const ALIAS = { g:'k', z:'s', d:'t', b:'p', j:'ch', c:'k', l:'r', v:'f' };
/* 声。囁きには声の高さがないので、年齢と性別は主に共鳴の位置（声道の長さ）で決まる。
   scale  共鳴全体の倍率。声道が短いほど大きい   speed  話す速さ
   breath 息のゆらぎ（大きいほど荒れる）          bright 高い共鳴の強さ   tremor 震え（約5.5Hz） */
const VOICES = {
  otoko:   { label:'男',       scale:1.00, speed:.95, breath:1,   bright:.85, tremor:0 },
  onna:    { label:'女',       scale:1.16, speed:1,   breath:1,   bright:1.1, tremor:0 },
  shonen:  { label:'男の子',   scale:1.29, speed:1.05,breath:1.1, bright:1,   tremor:0 },
  shojo:   { label:'女の子',   scale:1.35, speed:1.05,breath:1,   bright:1.2, tremor:0 },
  osanago: { label:'幼い子',   scale:1.46, speed:.88, breath:1.3, bright:1.15,tremor:0 },
  rojin:   { label:'老人',     scale:.97,  speed:.78, breath:2.4, bright:.8,  tremor:.3 },
  roba:    { label:'老女',     scale:1.12, speed:.8,  breath:2.2, bright:.95, tremor:.28 },
  ookii:   { label:'大きなもの', scale:.8, speed:.72, breath:1.6, bright:.7,  tremor:.08 }
};
const PHRASES = ['ho sa na','ki he to ne','su mi ha e','to ko shi no _ ha ne','ha ne i so',
                 'ke su ra _ ke su ra','shi na ho e to','mo i ka su ne','he e _ so no ha','chi ra to mo e'];
const KANA = {};
('あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno ' +
 'はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をo んN ' +
 'がka ぎki ぐku げke ごko ざsa じchi ずsu ぜse ぞso だta ぢchi づtsu でte どto ばpa びpi ぶpu べpe ぼpo ぱpa ぴpi ぷpu ぺpe ぽpo ' +
 'ぁa ぃi ぅu ぇe ぉo').split(' ').forEach(p => { KANA[p[0]] = p.slice(1); });
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const PKEYS = ['scale', 'speed', 'breath', 'bright', 'tremor'];
// 声の指定をまとめる。優先順は 個別の数値 ＞ voice ＞ 既定（女）
function voiceOf(opt, base) {
  opt = opt || {};
  const pick = v => typeof v === 'string' ? VOICES[v] : v;
  const o = Object.assign({ scale: 1.16, speed: 1, breath: 1, bright: 1, tremor: 0 }, pick(base), pick(opt.voice));
  for (const k of PKEYS) if (opt[k] != null) o[k] = +opt[k];
  delete o.label;
  return o;
}

// 句を音節の列にする
function parse(text) {
  let s = String(text).replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  if (/[ぁ-ゖー]/.test(s)) {
    const out = [];
    for (const ch of s) {
      if (KANA[ch]) out.push(KANA[ch]);
      else if ('ゃゅょ'.includes(ch) && out.length) {
        const c = out[out.length - 1].slice(0, -1), y = { 'ゃ':'a', 'ゅ':'u', 'ょ':'o' }[ch];
        out[out.length - 1] = (c === 'sh' || c === 'ch' ? c : c + 'y') + y;
      }
      else if (ch === 'っ') out.push('.');
      else if (ch === 'ー' && out.length) { const p = out[out.length - 1]; if (/[aiueo]$/.test(p)) out.push(p.slice(-1)); }
      else if (/[\s、。,.!?！？…_]/.test(ch)) out.push('_');
    }
    s = out.join(' ');
  }
  return s.trim().split(/\s+/).map(tok => {
    if (tok === '_') return { p: 1 };
    if (tok === '.') return { p: .25 };
    if (tok === 'N' || tok === 'n') return { c: '', g: '', v: 'N' };
    tok = tok.toLowerCase();
    let v = tok.slice(-1), c = tok.slice(0, -1), g = '';
    if (!VOW[v]) return null;
    if (c.length > 1 && c.endsWith('y')) { g = 'y'; c = c.slice(0, -1); }
    else if (c === 'y' || c === 'w') { g = c; c = ''; }
    c = ALIAS[c] || c;
    return { c, g, v };
  }).filter(Boolean);
}

/* 句を合成して Float32Array（モノラル・ピーク0.9）で返す。AudioContext は要らない。
   返り値の sampleRate に標本化周波数が入る（通常 32000、軽量 22050）。
   opt.voice  声の名前か { scale, speed, breath, bright, tremor }。個別に opt.scale なども渡せる
   opt.lite   軽量モード
   opt.rand   乱数の関数（既定 Math.random）。種つきの乱数を渡すと毎回同じ波形になる */
function render(text, opt) {
  opt = opt || {};
  const V = voiceOf(opt), lite = !!opt.lite, sr = lite ? SR_LITE : SR, step = lite ? 16 : 8;
  const scale = V.scale, sp = 1 / V.speed, br = V.bright;
  const R = opt.rand || Math.random, rnd = (a, b) => a + R() * (b - a);
  const sy = parse(text);
  if (!sy.some(x => x.v)) { const z = new Float32Array(1); z.sampleRate = sr; return z; }
  // 制御点：[時刻, F1, F2, F3, 母音の強さ, 子音の強さ, 子音の中心, 子音のQ]
  const K = []; let tt = 0, cur = VOW.a, fc = 4000, fq = 1;
  const k = (dt, f, av, af) => { tt += dt * sp; cur = f; K.push([tt, f[0], f[1], f[2], av, af, fc, fq]); };
  K.push([0, cur[0], cur[1], cur[2], 0, 0, fc, fq]); k(.03, cur, 0, 0);
  sy.forEach((s, n) => {
    if (s.p) { k(.07, cur, 0, 0); k(s.p * rnd(.2, .38), cur, 0, 0); return; }
    const v = VOW[s.v], c = s.c, last = n === sy.length - 1 || !!sy[n + 1].p;
    const st = rnd(.7, 1) * (s.v === 'N' ? .3 : 1);
    const mix = v.map((x, j) => x * .6 + [420, 1800, 2700][j] * .4), F = FRIC[c];
    if (F) {
      fc = F[0]; fq = F[1];
      if (STOP[c]) { k(.03, mix, 0, 0); k(.045, mix, 0, 0); k(.004, mix, 0, F[3]); k(F[2], mix, .1, F[3] * .8); k(.02, v, st * .6, 0); }
      else { k(.03, mix, .04, 0); k(.02, mix, 0, F[3]); k(F[2], mix, 0, F[3]); k(.03, v, st * .5, 0); }
    }
    else if (c === 'h') { k(.03, v, .12, 0); k(.07, v, .4 * st, 0); }
    else if (c === 'n' || c === 'm') { const nf = [300, c === 'n' ? 1500 : 1050, 2500]; k(.03, nf, .16, 0); k(.055, nf, .2, 0); k(.035, v, st * .7, 0); }
    else if (c === 'r') { k(.025, [v[0] * .8, v[1], 1900], .22, 0); k(.03, v, st * .7, 0); }
    else if (!s.g) k(.04, v, st * .6, 0);
    if (s.g) { const gv = s.g === 'y' ? VOW.i : VOW.u; k(.03, gv, st * .45, 0); k(.04, gv, st * .6, 0); k(.06, v, st * .9, 0); }
    k(.03, v, st, 0);
    k(rnd(.07, .12) * (last ? 1.7 : 1), v, st * .85, 0);
    k(last ? .17 : .04, v, last ? 0 : .3 * st, 0);
  });
  k(.06, cur, 0, 0);
  const N = Math.ceil(tt * sr), o = new Float32Array(N);
  // 状態変数フィルタ（帯域通過、山の高さ1）
  const flt = () => ({ a: 0, b: 0, k: 1, a1: 0, a2: 0, a3: 0 });
  const set = (F, f, q) => { const g = Math.tan(Math.PI * Math.min(f, sr * .45) / sr); F.k = 1 / q; F.a1 = 1 / (1 + g * (g + F.k)); F.a2 = g * F.a1; F.a3 = g * F.a2; };
  const run = (F, x) => { const v3 = x - F.b, v1 = F.a1 * F.a + F.a2 * v3, v2 = F.b + F.a2 * F.a + F.a3 * v3; F.a = 2 * v1 - F.a; F.b = 2 * v2 - F.b; return v1 * F.k; };
  const f1 = flt(), f2 = flt(), f3 = flt(), f4 = flt(), ff = flt();
  const sm = 1 - Math.exp(-step / sr / .004), flc = .006 * SR / sr, g1 = .75 / Math.sqrt(br), g3 = .6 * br, g4 = .25 * br, gh = .03 * br;
  const trem = V.tremor, tph = R() * 6.28, mask = step - 1;
  let ki = 0, c1 = K[0][1], c2 = K[0][2], c3 = K[0][3], av = 0, af = 0, fl = 0, prev = 0, pk = 1e-6;
  if (!lite) set(f4, 3900 * scale, 8);
  for (let i = 0; i < N; i++) {
    if ((i & mask) === 0) {
      const x = i / sr; while (ki < K.length - 2 && K[ki + 1][0] <= x) ki++;
      const A = K[ki], B = K[ki + 1], u = clamp((x - A[0]) / (B[0] - A[0] || 1), 0, 1), L = j => A[j] + (B[j] - A[j]) * u;
      c1 += (L(1) - c1) * sm; c2 += (L(2) - c2) * sm; c3 += (L(3) - c3) * sm; af = L(5);
      av = L(4) * (trem ? 1 + trem * Math.sin(x * 34.6 + tph + 2 * Math.sin(x * 3.1)) : 1);
      set(f1, c1 * scale, 4.5); set(f2, c2 * scale, 8); set(f3, c3 * scale, 9); set(ff, L(6) * scale, L(7));
    }
    const w = R() * 2 - 1;
    fl += ((R() * 2 - 1) - fl) * flc;
    const x = w * (1 + fl * 5 * V.breath);
    let s = run(f1, x) * g1 + run(f2, x) + run(f3, x) * g3;
    if (!lite) { s += run(f4, x) * g4 + (w - prev) * gh; prev = w; }
    s = av * s + af * run(ff, w);
    o[i] = s; if (Math.abs(s) > pk) pk = Math.abs(s);
  }
  for (let i = 0; i < N; i++) o[i] *= .9 / pk;
  o.sampleRate = sr;
  return o;
}

// 部屋の残響の型（だんだん暗くなる雑音）。ConvolverNode の buffer に入れる
function roomIR(ac, seconds) {
  const sr = ac.sampleRate, sec = seconds || 3.6, L = (sr * sec) | 0, ir = ac.createBuffer(2, L, sr);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c); let lp = 0;
    for (let i = 0; i < L; i++) {
      const x = i / sr, a = .5 - .42 * Math.min(1, x / (sec * .67)); lp += ((Math.random() * 2 - 1) - lp) * a;
      d[i] = x < .018 ? 0 : lp * Math.exp(-x * 6.9 / sec) * (1 + .6 * Math.exp(-x * 14));
    }
  }
  return ir;
}

/* 鳴らす側。こだまと残響を自前で持つ。
   opt.out    出力先の AudioNode（既定 ac.destination）
   opt.room   作品が自分の残響を持っているなら、その入口の AudioNode。渡すと自前の残響は作らない
   opt.level  全体の音量（既定 1）
   opt.voice  句ごとに指定がないときの声（既定は女）。opt.scale なども同じ意味で渡せる
   opt.lite   軽量モード。合成が軽くなり、畳み込みの残響の代わりに短い遅延3本の輪を使う */
function create(ac, opt) {
  opt = opt || {};
  const lite = !!opt.lite, base = voiceOf(opt);
  const gn = v => { const x = ac.createGain(); x.gain.value = v; return x; };
  const biq = (t, f, q) => { const b = ac.createBiquadFilter(); b.type = t; b.frequency.value = f; b.Q.value = q; return b; };
  const pan = v => { if (!ac.createStereoPanner) return gn(1); const p = ac.createStereoPanner(); p.pan.value = v; return p; };
  const bus = gn(opt.level == null ? 1 : opt.level); bus.connect(opt.out || ac.destination);
  let room = opt.room;
  if (!room && !lite) { room = gn(1); const cv = ac.createConvolver(); cv.buffer = roomIR(ac, 3.6); const rw = gn(.5); room.connect(cv); cv.connect(rw); rw.connect(bus); }
  if (!room && lite) {
    room = gn(1); const lp = biq('lowpass', 2400, .5), fb = gn(.27), rw = gn(.45); lp.connect(fb); rw.connect(bus);
    [[.061, -.5], [.089, .5], [.127, 0]].forEach(([t, p]) => { const d = ac.createDelay(.5); d.delayTime.value = t; const pp = pan(p);
      room.connect(d); fb.connect(d); d.connect(lp); d.connect(pp); pp.connect(rw); });
  }
  // 長いこだま：0.73秒と1.13秒が左右を行き来し、戻るたびに暗くなる
  const echoIn = gn(1), d1 = ac.createDelay(2), d2 = ac.createDelay(2);
  d1.delayTime.value = .73; d2.delayTime.value = 1.13;
  const l1 = biq('lowpass', 2300, .5), l2 = biq('lowpass', 2300, .5), h1 = biq('highpass', 350, .5), fb1 = gn(.44), fb2 = gn(.44);
  echoIn.connect(d1); d1.connect(l1); l1.connect(h1); h1.connect(fb1); fb1.connect(d2); d2.connect(l2); l2.connect(fb2); fb2.connect(d1);
  const p1 = pan(-.8), p2 = pan(.8), eo = gn(.7), er = gn(.35);
  l1.connect(p1); l2.connect(p2); p1.connect(eo); p2.connect(eo); eo.connect(bus); eo.connect(er); er.connect(room);

  const lib = [], cache = {}, queue = [];
  let baking = false, timer = 0, nextAt = 0, dead = false;
  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
  const mk = d => { const b = ac.createBuffer(1, d.length, d.sampleRate); b.getChannelData(0).set(d); return b; };
  function bake(text, o) {
    const V = voiceOf(o, base), key = text + '|' + PKEYS.map(k => V[k]).join(',');
    if (!cache[key]) {
      const t0 = now(), d = render(text, Object.assign({ lite }, V)), f = mk(d);
      let r = null;                                   // 逆再生の分は、最初に使うときに作る
      cache[key] = { text, f, get r() { return r || (r = mk(Object.assign(d.slice().reverse(), { sampleRate: d.sampleRate }))); } };
      api.lastBake = { ms: now() - t0, seconds: d.length / d.sampleRate };
    }
    return cache[key];
  }
  function pump() { const j = queue.shift(); if (!j || dead) { baking = false; return; } lib.push(bake(j[0], j[1])); setTimeout(pump, 30); }

        a0=fd.lp[0];a1=fd.lp[1];a2=fd.lp[2];a3=fd.lp[3];

        fd.buf[0][fi]=inx+h*(a0+a1+a2+a3);fd.buf[1][fi]=inx+h*(a0-a1+a2-a3);
        fd.buf[2][fi]=L+h*(a0+a1-a2-a3);fd.buf[3][fi]=R+h*(a0-a1-a2+a3);
        L+=wS*(a0+a2);R+=wS*(a1+a3);

      let y=L-P.dcL[0]+0.9975*P.dcL[1];P.dcL[0]=L;P.dcL[1]=y;L=y;

      const e2=(L*L+R*R)*0.5;P.env+=(e2-P.env)*(e2>P.env?0.004:0.00025)*(48000/sr);

    }
  }
}

function syncChunks(carS){
  const ci=Math.floor(carS/DS),cc=Math.floor(ci/CH);
  // 後ろは捨てる
  if(ci-RD0>300){RD.splice(0,120);RD0+=120;PROPS=PROPS.filter(p=>p.i>=RD0);BUMPS=BUMPS.filter(b=>b.s>carS-80);LAMPS=LAMPS.filter(l=>l.i>=RD0);HUTS=HUTS.filter(h=>h.s>carS-120)}
  ensure((cc+16)*CH+40);
  for(let c=Math.max(cc-2,Math.ceil(RD0/CH));c<=cc+13;c++)if(!CHK.has(c)){
    CHK.set(c,buildChunk(c));
    // 小屋の位置を覚える（近づくと目が行く）
    for(const p of PROPS)if(p.t==='hut'&&p.i>=c*CH&&p.i<(c+1)*CH&&!p.reg){p.reg=1;HUTS.push({i:p.i,s:p.i*DS,sd:p.sd,lat:HUT_LAT,fig:p.fig})}
    // 街灯の位置を覚える
    for(const p of PROPS)if(p.t==='lamp'&&p.i>=c*CH&&p.i<(c+1)*CH&&!p.reg){p.reg=1;const a=sm(p.i),w=(p.sd<0?a.L:a.R).w>.5,lat=p.sd*((w?EDGE-.25:HW+.6)-1.5);
      LAMPS.push({i:p.i,x:a.x+a.rx*lat,y:a.y+5.9,z:a.z+a.rz*lat,dead:p.dead?1:0,fl:Math.random()<.25?rnd(3,9):0})}
  }
  for(const [c,k] of CHK)if(c<cc-6||c>cc+14){gl.deleteBuffer(k.buf);CHK.delete(c)}       // 後ろは約200m残す（ルームミラーに映る）
}

/* ---------- 天気 ----------

      if(i===7)S.pitQ.push([S.t+d*.45,()=>A.radioVoice('laugh')]);
      if(i===12){const t0=S.t+d+rnd(3,5);S.pitQ.push([t0,()=>{S.pitOn=3.4;A.radio(1);A.radioTune(.3);A.radioWhisper({ctx:'radio'})}],[t0+3.3,()=>A.radio(0)])}

  S.expo+=(te-S.expo)*ease(dt,te<S.expo?.25:2.2);

/* ---------- カメラ（運転者の目） ---------- */
const EYE_H=.95,CAR_X=0;
function camera(){
  const p=at(S.s),t=S.t,s=S.s,rm=RM?.4:1,vk=Math.min(S.v/8,1.2);
  // 路面のざらつき：距離で決まるので、速いほど細かく速く揺れる。止まっているとエンジンの震えだけ（大きな揺れはサスペンションの計算から来る）
  const idle=S.engOn?(nz(t*61)-.5)*.0009*(.4+S.rpm/9000):0;          // 固く積んだエンジンの震え
  const vk2=clamp(S.v/60,0,1.4)*S.surf,rh=0,rp=((nz(t*23+9)-.5)+.6*(nz(t*37+3)-.5))*.0016*rm*vk2,rr=((nz(t*19+70)-.5)+.6*(nz(t*31+5)-.5))*.0011*rm*vk2;
  // 車内の揺れ（目に対して、車体のほうが動く）：路面の細かい振動、エンジンの震え、突き上げの速い上下動。景色は動かさない
  const shake=[((nz(t*41+8)-.5)*.0013*vk2+(nz(t*67+1)-.5)*.0006*(.4+S.rpm/9000))*rm,(((nz(t*47)-.5)+(nz(t*71+2)-.5))*.0021*vk2+idle-(S.heave-S.heaveLP)*.75)*rm,0];
  // 車体の向き：道の向き、勾配、傾きに、ばねの揺れを足す
  const h=p.h+clamp(S.latV/Math.max(S.v,8),-.06,.06),pr=Math.atan(p.sl)+S.pitch*rm+rp,rl=Math.atan(p.bank)+S.roll*rm+rr;
  const F0=[Math.sin(h),0,Math.cos(h)],R0=[Math.cos(h),0,-Math.sin(h)],cp=Math.cos(pr),sp=Math.sin(pr),cr=Math.cos(rl),sr=Math.sin(rl);
  const F=[F0[0]*cp,sp,F0[2]*cp],U1=[-F0[0]*sp,cp,-F0[2]*sp];
  const R=[R0[0]*cr-U1[0]*sr,-U1[1]*sr,R0[2]*cr-U1[2]*sr],U=[U1[0]*cr+R0[0]*sr,U1[1]*cr,U1[2]*cr+R0[2]*sr];
  const body={r:R,u:U,f:F};
  // 傾きの軸は床のあたりにあるので、傾くと目の位置も横へ動く
  const lt=S.lat+S.roll*rm*(EYE_H-.3),rest=[p.x+R0[0]*lt,p.y-S.lat*p.bank+EYE_H+S.heave*rm+rh,p.z+R0[2]*lt];
  const eye=[S.headX*rm,S.headY*rm-S.heave*.25*rm,S.headZ*rm];
  const pos=v3.add(rest,v3.basis(body,eye));
  // 頭の向き（車体に対して）
  const yaw=S.yawU+S.yawA+S.gaze+(nz(t*.7)-.5)*.014*rm;
  // 端末を横に倒して持っているぶん（0〜1）。画面が回らない設定のまま横に持っても、横長の眺めになるようにする
  const side=G.on?Math.sin(S.rollU)**2:0;
  const pit=clamp(S.pitU,-1.2,1.2)+S.pitA-.06-.13*clamp((1-ASP)*2,0,1)*(1-side)+(nz(t*.6+40)-.5)*.01*rm-S.pitchV*.02*rm-S.heaveV*.03*rm;
  const roll=S.rollU+S.roll*rm-clamp(S.aLat*.0009,-.025,.025)*rm;        // 頭は車体の傾きを打ち消し、コーナーの内側へ少し傾ける
  const cy=Math.cos(yaw),sy=Math.sin(yaw),c2=Math.cos(pit),s2=Math.sin(pit),c3=Math.cos(roll),s3=Math.sin(roll);
  const lf=[sy*c2,s2,cy*c2],r0=[cy,0,-sy],u0=[-sy*s2,c2,-cy*s2];
  const lr=[r0[0]*c3+u0[0]*s3,r0[1]*c3+u0[1]*s3,r0[2]*c3+u0[2]*s3],lu=[u0[0]*c3-r0[0]*s3,u0[1]*c3-r0[1]*s3,u0[2]*c3-r0[2]*s3];
  return{pos,rest,body,eye,shake,lr,lu,lf,r:v3.basis(body,lr),u:v3.basis(body,lu),f:v3.basis(body,lf),p,side};
}

/* ---------- 動くもの（人影、目、ほかの車） ---------- */
let dynBuf=null;
function buildDyn(cam){
  const mb=new MB();let n0=0;
  for(const pass of[0,1]){                          // 0 どこからでも見えるもの / 1 ルームミラーの中にだけ見えるもの
    for(const o of S.objs){
      if(!!o.mir!==!!pass)continue;
      const d=o.s-S.s;if(Math.abs(d)>300)continue;
      const p=at(o.s),c=Math.cos(p.h),sn=Math.sin(p.h),gy=o.t==='car'?0:groundAt(p.a,o.lat);
      const w=[p.x+c*o.lat-cam.pos[0],p.y-o.lat*p.bank+gy-cam.pos[1],p.z-sn*o.lat-cam.pos[2]];
      const l=Math.hypot(w[0],w[2])||1,rt=[w[2]/l,0,-w[0]/l],n=[-w[0]/l,0,-w[2]/l],dist=Math.hypot(l,w[1]);
      if(o.t==='fig'){
        /* 人の形。追ってくるものだけは、コーナーでバイクのように内側へ深く傾き、すぐ後ろまで来ると、かがんで覗き込む（顔が鏡の高さまで下りてくる）。
           傾きは足もとを軸に、板の面の中で回す。目と口と灯りも、傾いた体についていく */
        const bend=o.chaser?clamp((11-dist)/6,0,1):0,H=mix(o.h*1.1,Math.min(o.h*1.1,1.3),bend),hh=H+.04;
        const th=o.chaser?(o.lean||0)*(c*rt[0]-sn*rt[2]):0,ct=Math.cos(th),st=Math.sin(th),U=[rt[0]*st,ct,rt[2]*st],Rr=[rt[0]*ct,-st,rt[2]*ct];
        const A=(u,r,d)=>[w[0]+U[0]*u+Rr[0]*r+n[0]*d,w[1]-.02+U[1]*u+Rr[1]*r,w[2]+U[2]*u+Rr[2]*r+n[2]*d];
        mb.board(A(hh/2,0,0),v3.mul(Rr,.45),v3.mul(U,hh/2),[-.45,hh,.45,0],13,H,0,n);
        if(o.chaser){
          // 目：遠くても、鏡の中に、ふたつの点が見える
          if(o.eyes>0){const r=Math.max(.012,dist*.0022);for(const sd of[-1,1])mb.board(A(H-.085,sd*.05,.06),v3.mul(Rr,r),v3.mul(U,r),[-1,-1,1,1],20,.5*o.eyes,0,n)}
          // 口：近づくと、笑っている。顔の幅いっぱいに裂けた、白い三日月
          const sm=clamp((14-dist)/7,0,1);if(sm>0)mb.board(A(H-.15,0,.07),v3.mul(Rr,.085),v3.mul(U,.034),[-1,1,1,-1],24,sm,0,n);
          // 照らしてくる光：胸の高さの、ひとつの灯り
          if(o.glare>0){const r=Math.max(.35,dist*.06)*(.45+.55*o.glare);mb.board(A(Math.min(1.05,H*.62),0,.1),v3.mul(Rr,r),v3.mul(U,r),[-1,-1,1,1],20,2.4*o.glare,0,n)}}
      }       // 細長い（背は1.76〜1.98m）
      else if(o.t==='eyes'){if(!o.on)continue;const r=Math.max(.016,dist*.0021);
        for(const sd of[-1,1])mb.board([w[0]+rt[0]*sd*o.sep/2,w[1]+o.h,w[2]+rt[2]*sd*o.sep/2],v3.mul(rt,r),[0,r,0],[-1,-1,1,1],19,1,0,n)}
      else if(o.t==='car'){if(o.on<=0)continue;
        // すれ違ったあとの車は、赤い尾灯になる。後ろについた車がハイビームにすると、大きく明るい
        const tail=!o.rear&&d<-1.5,hi=o.rear&&S.mir.high,r=Math.max(.11,dist*.0032)*(tail?.7:hi?1.6:o.rear?1:1.25);
        for(const sd of o.bike?[0]:[-1,1])mb.board([w[0]+rt[0]*sd*.62,w[1]+(o.bike?.86:tail?.8:.66),w[2]+rt[2]*sd*.62],v3.mul(rt,r),[0,r,0],[-1,-1,1,1],20,o.on*(hi?2.2:1),tail?1:0,n)}     // バイクは灯りがひとつ
    }
    if(!pass)n0=mb.a.length/12;
  }
  dynBuf=dynBuf||gl.createBuffer();return{n0,n:mb.a.length?mb.upload(dynBuf):0};
}

    for(const o of S.objs){if(o.t!=='car'||o.rear||o.on<=0||o.s<S.s)continue;
      const q=v3.sub(wpt(o.s,o.lat,.66),cam.pos),z=v3.dot(q,cam.f),d=Math.hypot(q[0],q[1],q[2]);if(z<1)continue;
      const I=o.on*clamp(1000/(d*d+50),0,1.15)*sstep(3,14,d)*(1+1.4*S.drops)*(RM?.6:1)*(o.bike?.7:1);
      if(I>gi){gi=I;gx=.5+.5*v3.dot(q,cam.r)/(z*fv*ASP);gy=.5+.5*v3.dot(q,cam.u)/(z*fv)+(o.bike?.5*.2/(z*fv):0);gs=o.bike?0:.5*.62/(z*fv*ASP)}}
    if(S.P.glare>.02){const q=v3.sub([0,.15+YO,.5],cam.eye),x=v3.dot(q,cam.lr),y=v3.dot(q,cam.lu),z=v3.dot(q,cam.lf);
      if(z>.05){const ux=.5+.5*x/(z*fv*ASP),uy=.5+.5*y/(z*fv);if(ux>.02&&ux<.98&&uy>.02&&uy<.98){gx=ux;gy=uy;gs=.5*.04/(z*fv*ASP);gi=S.P.glare*(RM?.5:.95)}}}
    gl.uniform4f(PP.u.uGl,gx,gy,gs,gi)}
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ---------- 起動 ---------- */
try{if(!setupGL()){$('nogl').hidden=false;$('ui').hidden=true;return}buildCar()}
catch(e){$('nogl').hidden=false;$('nogl').textContent='映像の準備に失敗しました。';$('ui').hidden=true;console.error(e);return}
let last=0,slow=0,lost=false;
function loop(now){
  requestAnimationFrame(loop);
  if(lost||document.hidden||S.hold)return;
  if(now-last<(lite?31:15))return;                 // 軽量モードは毎秒30コマ
  const dt=Math.min(.1,(now-last)/1000),gap=now-last;last=now;
  tick(dt);draw();
  // 重い端末では内部の解像度を下げる
  slow=slow*.96+(gap>45?1:0)*.04;
  if(slow>.6&&resScale>.4){resScale*=.75;slow=0}
}
requestAnimationFrame(loop);
cv.addEventListener('webglcontextlost',e=>{e.preventDefault();lost=true});
cv.addEventListener('webglcontextrestored',()=>{try{CHK.clear();carBuf=wheelBuf=wipBuf=dynBuf=null;for(const p of PROPS)p.reg=0;LAMPS.length=0;setupGL();buildCar();lost=false}catch(e){}});
let away=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){away=Date.now();if(ac&&ac.state==='running')ac.suspend().catch(()=>{})}
  else{last=performance.now();if(ac&&A.on)ac.resume().catch(()=>{});
    if(away&&Date.now()-away>20000)S.level+=.5}    // 目を離していたあいだに、少し進んでいる
});
// 見回す
let drag=null;
cv.addEventListener('pointerdown',e=>{startAudio();drag={x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId)}catch(_){}wake()});
cv.addEventListener('pointermove',e=>{
  wake();if(!drag)return;
  const k=2*FOV*ASP/(cv.clientWidth||innerWidth)*.9;
  if(G.on)G.off-=(e.clientX-drag.x)*k;
  else{S.yawU=clamp(S.yawU-(e.clientX-drag.x)*k,-2.9,2.9);S.pitU=clamp(S.pitU+(e.clientY-drag.y)*k,-.7,.7)}
  drag.x=e.clientX;drag.y=e.clientY;S.lastInput=S.t;
});
const up=()=>{drag=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{
  const d={ArrowLeft:[-.12,0],ArrowRight:[.12,0],ArrowUp:[0,.08],ArrowDown:[0,-.08]}[e.key];
  if(!d)return;e.preventDefault();S.yawU=clamp(S.yawU+d[0],-2.9,2.9);S.pitU=clamp(S.pitU+d[1],-.7,.7);S.lastInput=S.t;wake();
});
// ボタン
const ui=$('ui'),bs=$('bs'),bf=$('bf'),bl=$('bl'),bg=$('bg');let idleT=0;
function wake(){ui.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>ui.classList.add('idle'),3500)}
function syncUI(){
  bs.setAttribute('aria-pressed',String(A.on));$('bs1').style.display=A.on?'':'none';$('bs0').style.display=A.on?'none':'';
  bl.setAttribute('aria-pressed',String(lite));bg.setAttribute('aria-pressed',String(G.on));
  bf.setAttribute('aria-pressed',String(!!(document.fullscreenElement||document.webkitFullscreenElement)));
}
bs.addEventListener('click',()=>{if(A.on){userMuted=true;A.setOn(false);syncUI()}else{userMuted=false;startAudio()}wake()});
const fsEl=document.documentElement,reqFS=fsEl.requestFullscreen||fsEl.webkitRequestFullscreen;
if(!reqFS)bf.hidden=true;
bf.addEventListener('click',()=>{
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else{const r=reqFS.call(fsEl);if(r&&r.catch)r.catch(()=>{})}
  }catch(_){}
  wake();
});
document.addEventListener('fullscreenchange',syncUI);document.addEventListener('webkitfullscreenchange',syncUI);
bl.addEventListener('click',()=>{lite=!lite;store.set('nigeru-lite',lite?'1':'0');resScale=1;if(ac)A.relite();syncUI();wake()});
// ジャイロのボタンは、タッチ端末で、枠の方針がセンサーを禁じていないときだけ出す
{const fp=document.featurePolicy||document.permissionsPolicy;let ok=TOUCH&&'DeviceOrientationEvent' in window;
  try{if(ok&&fp&&fp.allowsFeature&&(!fp.allowsFeature('gyroscope')||!fp.allowsFeature('accelerometer')))ok=false}catch(_){}
  bg.hidden=!ok}
bg.addEventListener('click',()=>{startAudio();gyroToggle();wake()});
// 眺めているあいだ画面が消えないように（断られてもそのまま）
let wl=null;
function keepAwake(){try{if(navigator.wakeLock&&!wl&&!document.hidden)navigator.wakeLock.request('screen').then(x=>{wl=x;x.addEventListener('release',()=>{wl=null})}).catch(()=>{})}catch(_){}}
addEventListener('pointerdown',keepAwake);document.addEventListener('visibilitychange',()=>{if(!document.hidden)keepAwake()});
syncUI();wake();
say('画面に触れると、音が出ます');

})();
