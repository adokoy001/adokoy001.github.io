<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>落ちきらない灯</title>
<meta name="description" content="超大質量ブラックホールへ落ちていく灯は、外からは永遠に落ちきらない。">
<style>
/* 一枚の窓：全面の描画と、隅で眠る3つのアイコンだけ。暗い単一の世界に固定する */
:root{
  --void:#000;
  --bone:#d6cfc4;
  --bone-dim:rgba(214,207,196,.5);
  --glass:rgba(14,10,9,.46);
  --glass-hi:rgba(40,28,24,.62);
  --ember:#8e3a26;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--void);color:var(--bone)}
body{margin:0;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;background:var(--void)}
#ui{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;transition:opacity .9s ease}
#ui.idle{opacity:0;pointer-events:none}
#ui:focus-within{opacity:1;pointer-events:auto}
.btn{appearance:none;-webkit-appearance:none;width:44px;height:44px;border:0;border-radius:50%;padding:0;margin:0;display:grid;place-items:center;background:var(--glass);color:var(--bone-dim);cursor:pointer;transition:color .3s,background .3s}
.btn:hover{color:var(--bone)}
.btn:focus-visible{outline:1.5px solid var(--bone);outline-offset:2px}
.btn svg{width:22px;height:22px;display:block;overflow:visible}
.btn[aria-pressed="true"] .off,.btn[aria-pressed="false"] .on{display:none}
#b-snd.hint{animation:hint 2.8s ease-in-out infinite}
@keyframes hint{0%,100%{color:var(--bone-dim);background:var(--glass)}50%{color:var(--bone);background:var(--glass-hi)}}
@media (prefers-reduced-motion:reduce){#b-snd.hint{animation:none;color:var(--bone)}#ui{transition:none}}
.nogl #gl{display:none}
.nogl body{background:radial-gradient(circle at 50% 50%,var(--void) 0 17vmin,var(--ember) 17.6vmin,rgba(142,58,38,.22) 19.5vmin,var(--void) 28vmin)}
</style>
</head>
<body>

<canvas id="gl" role="img" aria-label="超大質量ブラックホール。タップで灯を落とし、長押しで自分が落ちていく。"></canvas>
<div id="ui" role="toolbar" aria-label="操作">
  <button class="btn hint" id="b-snd" type="button" aria-label="音" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3.5 9.4h3.4L12 5.3v13.4l-5.1-4.1H3.5z" fill="currentColor"/>
      <g class="on" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M15.4 9.1a4.1 4.1 0 0 1 0 5.8"/><path d="M17.9 6.6a7.6 7.6 0 0 1 0 10.8"/></g>
      <g class="off" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M15.8 9.6l4.8 4.8M20.6 9.6l-4.8 4.8"/></g>
    </svg>
  </button>
  <button class="btn" id="b-fs" type="button" aria-label="全画面" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <g class="off" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></g>
      <g class="on" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></g>
    </svg>
  </button>
  <button class="btn" id="b-lite" type="button" aria-label="軽量モード" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <g class="off" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19.6 4.4c-5.6.3-10.1 4.3-11.4 9.9l-.6 2.6 2.6-.6c5.6-1.3 9.6-5.8 9.4-11.9z"/><path d="M4.4 19.6l8.4-8.4"/></g>
      <g class="on" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19.6 4.4c-5.6.3-10.1 4.3-11.4 9.9l-.6 2.6 2.6-.6c5.6-1.3 9.6-5.8 9.4-11.9z" fill="currentColor"/><path d="M4.4 19.6l8.4-8.4" fill="none"/></g>
    </svg>
  </button>
</div>

<script>
(() => {
'use strict';

/* =========================================================
   落ちきらない灯
   単位は M = GM/c²。M87* 相当（6.5×10⁹ 太陽質量）なら 1M ≈ 64.2 AU。
   事象の地平面 r=2、光子球 r=3、影の半径 √27、最内安定円軌道 r=6。
   ========================================================= */

const cvs = document.getElementById('gl');
const ui = document.getElementById('ui');
const bSnd = document.getElementById('b-snd');
const bFs = document.getElementById('b-fs');
const bLite = document.getElementById('b-lite');

const TAU = Math.PI * 2;
const BCRIT = Math.sqrt(27);
const BFLAT = 58.27047;                 // B♭1。ペルセウス座銀河団のブラックホールが鳴らす音もB♭
const FOVH = Math.tan(28 * Math.PI / 180); // 短辺方向の半画角
const TLOOP = 1.8;                      // 光が光子球を一周して戻るまで（演出上の秒）
const GF = 0.006;                       // 凍った灯の明るさの下限（I0比）
const PENTA = [932.33, 1108.73, 1244.51, 1396.91, 830.61]; // B♭短調の五音
const FLOWP = 140;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => mul(a, 1 / (len(a) || 1));

/* ---------- 設定 ---------- */
const LS_KEY = 'ochikiranai-lite';
function loadLite() {
  try { const v = localStorage.getItem(LS_KEY); if (v === '1') return true; if (v === '0') return false; } catch (e) {}
  const coarse = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  const cores = navigator.hardwareConcurrency || 4;
  return coarse || cores <= 4;
}
function saveLite(v) { try { localStorage.setItem(LS_KEY, v ? '1' : '0'); } catch (e) {} }
let lite = loadLite();
let NB = lite ? 5 : 8;
const mq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
let reduced = !!(mq && mq.matches);
if (mq) { const f = e => { reduced = e.matches; }; if (mq.addEventListener) mq.addEventListener('change', f); else if (mq.addListener) mq.addListener(f); }

/* =========================================================
   描画：シュワルツシルト時空の光線を1画素ずつ逆にたどる
   ========================================================= */
const VS1 = 'attribute vec2 aP;void main(){gl_Position=vec4(aP,0.0,1.0);}';
const VS2 = '#version 300 es\nin vec2 aP;void main(){gl_Position=vec4(aP,0.0,1.0);}';
const FS = `
uniform vec2 uRes;
uniform vec3 uCamPos;
uniform vec3 uCamR;
uniform vec3 uCamU;
uniform vec3 uCamF;
uniform float uFov;
uniform float uFish;
uniform float uAng;
uniform float uTan;
uniform float uShift;
uniform float uGain;
uniform vec4 uFall;
uniform float uResc;
uniform vec4 uFlow;
uniform vec4 uDisk;
uniform float uExp;
uniform float uFade;
uniform float uTime;
uniform vec4 uB[NB];
uniform vec4 uBC[NB];
uniform float uAnyB;
uniform vec4 uArc[2];
uniform vec4 uSolar;
uniform float uPx;
uniform float uPxA;
uniform vec4 uQ;
uniform vec4 uKnot;
uniform vec2 uGlare;
uniform float uQA;
uniform vec4 uBt;
uniform vec4 uBa;
uniform vec4 uIn;

#define PI 3.14159265
#define RIN 6.0
#define ROUT 14.0
#define RMAX 42.5
#define ECHO 14.0
#define BCRIT 5.19615242
#define FLOWP 140.0

float hash13(vec3 p3){
  p3 = fract(p3*0.1031);
  p3 += dot(p3, p3.zyx + 31.32);
  return fract((p3.x + p3.y)*p3.z);
}
float vnoise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  vec3 u = f*f*(3.0 - 2.0*f);
  float a = hash13(i);
  float b = hash13(i + vec3(1.0, 0.0, 0.0));
  float c = hash13(i + vec3(0.0, 1.0, 0.0));
  float d = hash13(i + vec3(1.0, 1.0, 0.0));
  float e = hash13(i + vec3(0.0, 0.0, 1.0));
  float f1 = hash13(i + vec3(1.0, 0.0, 1.0));
  float g = hash13(i + vec3(0.0, 1.0, 1.0));
  float h = hash13(i + vec3(1.0, 1.0, 1.0));
  return mix(mix(mix(a, b, u.x), mix(c, d, u.x), u.y), mix(mix(e, f1, u.x), mix(g, h, u.x), u.y), u.z);
}
float fbm(vec3 p){
  float s = 0.0;
  float a = 0.5;
  for (int i = 0; i < OCT; i++){
    s += a*vnoise(p);
    p = p*2.07 + vec3(5.1, 1.3, 7.7);
    a *= 0.5;
  }
  return s;
}
/* 黒体の色（近似）。二乗して線形の光に戻す */
vec3 bb(float T){
  float t = clamp(T, 800.0, 30000.0)*0.01;
  vec3 c;
  if (t <= 66.0){
    c.r = 1.0;
    c.g = clamp(0.39008158*log(t) - 0.63184144, 0.0, 1.0);
    c.b = t <= 19.0 ? 0.0 : clamp(0.54320679*log(max(t - 10.0, 1.0)) - 1.19625409, 0.0, 1.0);
  } else {
    float u = max(t - 60.0, 1.0);
    c.r = clamp(1.29293619*pow(u, -0.13320476), 0.0, 1.0);
    c.g = clamp(1.12989086*pow(u, -0.07551485), 0.0, 1.0);
    c.b = 1.0;
  }
  return c*c;
}
/* 画素ごとの周波数の比（青方偏移・赤方偏移）と明るさの倍率 */
float gShift = 1.0;
float gGain = 1.0;
/* 光の軌道：u'' + u = 3u² と同値な、中心力 -3h²x/r⁵ */
vec3 accel(vec3 p, float h2){
  float r2 = dot(p, p);
  return -3.0*h2*p/(r2*r2*sqrt(r2));
}
/* クェーサー化の前触れ：外から渦を巻いて注ぎ込むガスの腕（2本の対数らせん）。
   uIn = (強さ, 先端の半径, 流れの位相, 模様の回転角)。塊は腕に沿って内へ流れる */
float streamAt(float r, float phi){
  if (r < 11.0 || r > 42.0) return 0.0;
  float m = smoothstep(uIn.y - 1.5, uIn.y + 2.5, r)*(1.0 - smoothstep(34.0, 42.0, r));
  if (m <= 0.0) return 0.0;
  float d = phi - (uIn.w + 2.6*log(r));
  d = mod(d + 0.5*PI, PI) - 0.5*PI;
  float w = 0.09 + 0.004*r;
  float clump = 0.35 + 0.65*vnoise(vec3(log(r)*9.0 + uIn.z, d*4.0, 5.3));
  return m*exp(-d*d/(w*w))*clump;
}
/* クェーサー化の強さ（経過秒 a の関数。JS 側と同じ形） */
float qxAt(float a){
  if (a < 0.0) return 0.0;
  if (a < 7.0) return 0.22*smoothstep(0.0, 7.0, a);
  if (a < 15.0) return 0.22 + 0.78*smoothstep(7.0, 8.6, a);
  if (a < 24.0) return 1.0 - smoothstep(15.0, 24.0, a);
  return 0.0;
}
/* 心拍の光の脈を、遅れ lag 秒だけずらして足し合わせる */
float pulseAt(float lag){
  vec4 x = uBt - lag;
  vec4 up = smoothstep(0.0, 0.14, x);
  vec4 dn = exp(-max(x - 0.14, 0.0)/0.55);
  vec4 e = mix(up, dn, step(0.14, x))*step(0.0, x);
  return dot(e, uBa);
}
/* 降着円盤：ケプラー回転、ドップラー効果と重力赤方偏移、ずれ続ける渦。
   中心の明るさの変化は光の速さで外へ伝わり、こちらへ届くまでの道のりの差だけ遅れて見える（反響）。
   遅れは (r − q·n)/c。手前側はすぐ、横や奥ほど遅れて光る。
   クェーサー化で温度が上がると、同じ色で光る半径が外へ広がる（降着率の1/3乗） */
vec4 diskAt(vec3 q, float r, float hy){
  float lag = (r - dot(q, normalize(uCamPos)))/ECHO;
  float qr = uQA > -50.0 ? qxAt(uQA - lag) : 0.0;
  float rv = ROUT + 14.0*qr;
  float phi = atan(q.z, q.x);
  float sd = uIn.x > 0.0 ? uIn.x*streamAt(r, phi) : 0.0;
  if (r > rv && sd < 0.002) return vec4(0.0);
  float pl = pulseAt(lag);
  float om = 1.0/(r*sqrt(r));
  float g = sqrt(1.0 - 3.0/r)/(1.0 + om*hy);
  float x = 1.0 - sqrt(RIN/r);
  float prof = pow(r/RIN, -0.75)*sqrt(sqrt(max(x, 0.0)))*2.04;
  float wA = sin(PI*uFlow.x/FLOWP);
  wA *= wA;
  float aA = phi + om*uFlow.x;
  float aB = phi + om*uFlow.y;
  float lr = log(r)*34.0;
  vec3 pA = vec3(cos(aA)*2.2, sin(aA)*2.2, lr + uFlow.z);
  vec3 pB = vec3(cos(aB)*2.2, sin(aB)*2.2, lr + uFlow.w);
  float n = wA*fbm(pA) + (1.0 - wA)*fbm(pB);
  float lanes = 0.75 + 0.25*sin(r*4.1 + n*9.0);
  float edge = smoothstep(RIN, RIN + 0.5, r)*(1.0 - smoothstep(rv - 6.0 - 4.0*qr, rv, r));
  float nc = clamp((n - 0.25)*2.5, 0.0, 1.0);
  float dens = max(edge*(0.15 + 0.85*nc*sqrt(nc))*lanes, sd*(0.55 + 0.6*n));
  float pf = max(prof, 0.8*sd);
  float T = uDisk.y*(1.0 + 0.08*pl)*(1.0 + 2.2*qr)*pf*(0.8 + 0.45*n);
  float p2 = pf*pf;
  float g2 = g*g;
  float I = p2*p2*(0.6 + 0.8*n)*dens*g2*g2*uDisk.x*(1.0 + 0.75*pl)*(1.0 + 14.0*qr)*gGain;
  return vec4(bb(T*g*gShift)*I*3.0, max(edge*clamp(0.62 + dens, 0.0, 0.97), 0.6*sd));
}
vec3 starLayer(vec3 d, float sc, float dens, float pxw){
  vec3 q = d*sc;
  vec3 ci = floor(q);
  if (hash13(ci) > dens) return vec3(0.0);
  vec3 sp = ci + 0.2 + 0.6*vec3(hash13(ci + 17.1), hash13(ci + 31.7), hash13(ci + 47.3));
  vec3 dd = d - normalize(sp);
  float a2 = dot(dd, dd);
  float s = max(uPxA*0.65, min(pxw*0.6, uPxA*5.0));
  float fadeW = 1.0/(1.0 + pxw/(uPxA*3.0));
  float e = exp(-a2/(s*s))*(uPxA*uPxA*0.42)/(s*s)*fadeW*fadeW;
  float br = pow(hash13(ci + 5.9), 10.0)*7.0 + 0.006;
  float temp = 2600.0 + 9500.0*pow(hash13(ci + 71.3), 2.0);
  return bb(temp*gShift)*br*e;
}
/* 噴流：極から出る相対論的ジェット。心拍ごとに塊が打ち出され、外へ流れる。
   近づいてくる側が明るい（ドップラー因子の3乗、β=0.6 に弱めてある） */
vec3 jetEmit(float y, float ay, float w, float rho2, vec3 vn){
  float core = exp(-rho2/(w*w))/w;
  float fall = 1.0/(1.0 + ay*0.07);
  float base = smoothstep(2.2, 4.5, ay);
  float front = 1.0 - smoothstep(uQ.z - 5.0, uQ.z, ay);
  vec4 dk = (vec4(ay) - (uKnot*22.0 + 2.5))*0.45;
  float k = dot(exp(-dk*dk), vec4(1.0));
  float cosT = -sign(y)*vn.y;
  float dl = 1.0/(1.25*(1.0 - 0.6*cosT));
  return vec3(0.5, 0.66, 1.0)*(uQ.y*core*fall*base*front*(0.35 + 1.6*k)*dl*dl*dl*6.0);
}
vec3 sky(vec3 d, float pxw){
  float bd = dot(d, vec3(0.21, 0.93, -0.30));
  float bm = exp(-bd*bd*7.0);
  float n1 = fbm(d*2.4 + 11.0);
  float dust = bm*smoothstep(0.38, 0.7, fbm(d*5.3 + 3.0));
  vec3 c = (vec3(0.012, 0.0045, 0.0035)*smoothstep(0.35, 0.85, n1) + vec3(0.0018, 0.002, 0.0032)*n1)*(0.25 + bm);
  c *= 1.0 - dust*0.85;
  vec3 st = starLayer(d, 150.0, 0.07, pxw);
#if STAR2
  st += starLayer(d, 360.0, 0.10, pxw)*0.35;
#endif
  c += st*(1.0 - dust*0.9);
  return c*pow(gGain, 0.4);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/(0.5*min(uRes.x, uRes.y));
  /* 影が視野を覆うほど近づいたら、魚眼で影の縁を画面に残す */
  float rr = length(uv);
  float th = min(mix(atan(rr*uFov), rr*uAng, uFish), 3.1);
  vec3 d = rr > 1e-5 ? normalize(cos(th)*uCamF + sin(th)*(uv.x*uCamR + uv.y*uCamU)/rr) : uCamF;
  gShift = uShift;
  gGain = uGain;
  /* 地平面で留まるのをやめ、速さ v で自由落下する観測者の目。
     光行差で前方（穴）は縮み、後ろの宇宙は広がる。周波数は 静止系の青方偏移 × γ(1 + v cosθ) */
  if (uFall.x > 0.0){
    vec3 ein = -uCamPos/length(uCamPos);
    float v = uFall.x;
    float cf = dot(d, ein);
    vec3 tv = d - cf*ein;
    float tl = length(tv);
    tv = tl > 1e-5 ? tv/tl : normalize(cross(ein, vec3(0.31, 0.77, 0.56)));
    float cst = (cf - v)/(1.0 - v*cf);
    d = cst*ein + sqrt(max(1.0 - cst*cst, 0.0))*tv;
    float F = uTan*inversesqrt(1.0 - v*v)*(1.0 + v*cst);
    /* 地平面の内側では、外から届く光はすべて後ろから来て、1/(1+v) より強く赤方偏移する */
    F = mix(F, 0.5, uFall.z)*uFall.y;
    gShift = pow(F, mix(0.65, 1.0, v));
    gGain = pow(F, mix(1.6, 1.25, v));
  }
  vec3 p = uCamPos;
  float rc = length(p);
  vec3 rh = p/rc;
  float drr = dot(d, rh);
  /* その場に留まる観測者の方向を、座標上の速度に直す */
  vec3 v = drr*rh + (d - drr*rh)*uTan;
  vec3 hv = cross(p, v);
  float h2 = dot(hv, hv);
  float hy = hv.y;

  vec3 col = vec3(0.0);
  float tr = 1.0;
  float state = 0.0;
  vec3 a = accel(p, h2);
  for (int i = 0; i < MAX_STEPS; i++){
    float r = length(p);
    float dt = STEP_K*r;
    if (r < 4.0) dt = min(dt, max(0.03, (r - 2.0)*0.55));
    v += a*(0.5*dt);
    vec3 pn = p + v*dt;
    a = accel(pn, h2);
    v += a*(0.5*dt);
    if (p.y*pn.y <= 0.0 && tr > 0.01){
      float den = p.y - pn.y;
      float t = abs(den) > 1e-7 ? p.y/den : 0.5;
      vec3 q = mix(p, pn, clamp(t, 0.0, 1.0));
      float rq = length(q.xz);
      if (rq > RIN && rq < RMAX){
        vec4 e = diskAt(q, rq, hy);
        col += tr*e.rgb;
        tr *= 1.0 - e.a;
      }
    }
    if (uAnyB > 0.5){
      vec3 sg = pn - p;
      float L2 = max(dot(sg, sg), 1e-8);
      float sL = sqrt(L2);
      for (int k = 0; k < NB; k++){
        vec4 B = uB[k];
        if (B.w <= 0.0) continue;
        vec3 w = B.xyz - p;
        float tt = clamp(dot(w, sg)/L2, 0.0, 1.0);
        vec3 c = w - sg*tt;

    if (x < 0) continue;

/* =========================================================
   更新

function update(dt) {

  if (keyHold && !fall.active && !crossing && nowS - keyHold > 0.6) startFall();

  // カメラ
  if (fall.active) {
    fall.holdT += dt;
    const k = 0.12 + 0.09 * fall.holdT;
    cam.D = 1.96 + (cam.D - 1.96) * Math.exp(-k * dt);
    if (cam.D < 2.04) startCross();
  } else if (fall.returning && !crossing) {
    cam.D += (Dhome - cam.D) * (1 - Math.exp(-dt * 0.8));
    if (Math.abs(cam.D - Dhome) < 0.03) { cam.D = Dhome; fall.returning = false; }
  }
  if (!(press && press.moved)) { cam.az += cam.vaz * dt; cam.el += cam.vel * dt; }
  const dmp = Math.exp(-dt * 2.6);
  cam.vaz *= dmp; cam.vel *= dmp;
  if (keys.l) cam.az += dt * 0.6;
  if (keys.r) cam.az -= dt * 0.6;
  if (keys.u) cam.el += dt * 0.45;
  if (keys.d) cam.el -= dt * 0.45;

  const blend = sstep(18, 26, idleFor);
  if (blend > 0 && !fall.active && !crossing && !fall.returning) {
    const sp = reduced ? 0.5 : 1;
    cam.az += dt * 0.010 * blend * sp;

    const eye = sstep(0.62, 0.72, ph) * (1 - sstep(0.86, 0.96, ph));

    const qEnv = !quasar ? 0 : sstep(-10, -4, qa) * (1 - sstep(18, 27, qa));
    const elT = 0.20 + 0.22 * Math.sin(nowS * TAU / 150) + 0.95 * eye + 0.2 * qEnv;

  for (let i = beacons.length - 1; i >= 0; i--) { const c = beacons[i]; if (c.dead || (c.kind === 'star' && nowS - c.born > 90)) beacons.splice(i, 1); }

  // 消灯：降着が途絶え、凍った灯だけが見えてくる
  let dg = 1;
  if (dark) {
    const a = nowS - dark.t0;
    if (!dark.hs && a >= 3.0) { dark.hs = true; heart.stopped = true; }
    if (a < 3.0) dg = 1 - 0.45 * sstep(0, 3.0, a);
    else if (a < 3.8) dg = 0.55 - 0.538 * sstep(3.0, 3.8, a);
    else if (a < 11.5) dg = 0.012;
    else if (a < 16) {
      if (!dark.re) {
        dark.re = true;
        // 光が戻る瞬間に、止まっていた心臓が強く打ち直す
        heart.stopped = false; heart.next = nowS + 0.05; heart.strength = 1.8; heart.bpm = HB + 8;
        if (live) { auTinnitus(false); auReignite(); }

      }

  U.solar = [0, 0, 1, 0];
  if (solar) {
    const a = (nowS - solar.t0) / solar.dur;
    if (a >= 1) solar = null;
    else if (!fall.active && !crossing && U.fish < 0.01) {
      const shUV = U.shUV;
      U.solar = [solar.side * (-0.95 + 1.9 * a) * shUV, solar.yo * shUV, 1 / (cam.D * FOVH),
        0.55 * sstep(0, 0.1, a) * (1 - sstep(0.88, 1, a))];
    }
  }

}

  gl.uniform1f(loc.uQA, quasar ? nowS - quasar.t0 : -100);

  gl.uniform1f(loc.uFade, U.fade);

  for (let i = 0; i < NB; i++) {
    const b = beacons[i];

      const lk = beaconLook(b);

}

  const ws = ctx.createGain(); ws.gain.value = 0.6; wt.connect(ws); ws.connect(AU.rv); nodes.push(ws);
  for (const o of [src, w1, w2, vib]) o.start(t);
  AU.qr = { lp, g, hg, wg, w1, w2, src, vib, nodes };

function auQuasarFade() {
  const Q = AU.qr;
  if (!Q) return;
  AU.qr = null;
  const t = AU.ctx.currentTime;
  Q.lp.frequency.cancelScheduledValues(t); Q.lp.frequency.setTargetAtTime(200, t, 2.5);
  Q.g.gain.cancelScheduledValues(t); Q.g.gain.setTargetAtTime(0.0001, t + 1, 2.2);
  Q.hg.gain.cancelScheduledValues(t); Q.hg.gain.setTargetAtTime(0.0001, t, 1.5);
  Q.w1.frequency.cancelScheduledValues(t); Q.w1.frequency.setTargetAtTime(880, t, 3);
  Q.w2.frequency.cancelScheduledValues(t); Q.w2.frequency.setTargetAtTime(884, t, 3);
  Q.wg.gain.cancelScheduledValues(t); Q.wg.gain.setTargetAtTime(0.0001, t + 1, 2);
  for (const o of [Q.src, Q.w1, Q.w2, Q.vib]) o.stop(t + 9.5);
  Q.src.onended = () => disc(Q.nodes);
  const d = AU.duck.gain;
  d.cancelScheduledValues(t); d.setValueAtTime(d.value, t); d.linearRampToValueAtTime(1, t + 7);
}
function auWhisper(gain, close) {
  const buf = SND[Math.random() < 0.5 ? 'wh0' : 'wh1'];
  if (!buf) return;
  const side = Math.random() < 0.5 ? -1 : 1;
  playBuf(buf, { rate: close ? rand(0.92, 1.0) : rand(0.7, 0.85), gain, pan: side * (close ? 0.95 : 0.6), panTo: side * (close ? 0.7 : 0.25),
    panDur: 2.5, rev: close ? 0.1 : 0.9, lp: close ? 0 : 2200 });
}
function auTinnitus(on) {
  const ctx = AU.ctx, t = ctx.currentTime;
  if (on) {
    if (AU.tinn) return;
    const g = ctx.createGain(); g.gain.value = 0.0001;
    const o1 = ctx.createOscillator(); o1.frequency.value = 3150;
    const o2 = ctx.createOscillator(); o2.frequency.value = 3158.5;
    o1.connect(g); o2.connect(g); g.connect(AU.comp);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.006, t + 4);

  } else {
    const T = AU.tinn;
    if (!T) return;
    AU.tinn = null;
    T.g.gain.cancelScheduledValues(t); T.g.gain.setTargetAtTime(0.0001, t, 0.4);
    T.o1.stop(t + 2); T.o2.stop(t + 2);
    T.o1.onended = () => disc([T.o1, T.o2, T.g]);

}
function auDrop() {
  if (!AU.ok || AU.muted) return;
  if (SND.drop) { playBuf(SND.drop, { gain: 0.32, pan: rand(-0.15, 0.15), rev: 0.5 }); return; }
  oscPing(1600, 0.4, 0.05, 0, 0);
}
function auFallStart() {
  if (!AU.ok || AU.muted || AU.fallN) return;
  const ctx = AU.ctx;
  // 圧の塊（B♭ と B）。深くなるほど開くローパス
  const g = ctx.createGain(); g.gain.value = 0.0001;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180; lp.Q.value = 2;
  const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = BFLAT;
  const o2 = ctx.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 61.74;
  o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(AU.ev);
  const rs = ctx.createGain(); rs.gain.value = 0.3; g.connect(rs); rs.connect(AU.rv);
  // 青方偏移した星の光：高いところで擦れ合う二音
  const hg = ctx.createGain(); hg.gain.value = 0.0001;
  const h1 = ctx.createOscillator(); h1.frequency.value = 2800;
  const h2 = ctx.createOscillator(); h2.frequency.value = 2967;
  h1.connect(hg); h2.connect(hg); hg.connect(AU.ev);
  const hs = ctx.createGain(); hs.gain.value = 0.6; hg.connect(hs); hs.connect(AU.rv);

  AU.fallN = { g, lp, o1, o2, hg, h1, h2, nodes: [o1, o2, h1, h2, g, lp, rs, hg, hs], nextCreak: nowS + 0.8 };
}
function auFallUpdate() {
  const N = AU.fallN, t = AU.ctx.currentTime;
  // 深さは距離の対数で測る（最後の数Mが長く感じられるように）
  const depth = clamp(Math.log(Dhome / cam.D) / Math.log(Dhome / 2.04), 0, 1);
  N.lp.frequency.setTargetAtTime(180 + 1400 * depth * depth, t, 0.3);
  N.g.gain.setTargetAtTime(0.02 + 0.12 * depth, t, 0.3);
  N.o1.detune.setTargetAtTime(AU.cents, t, 0.3); N.o2.detune.setTargetAtTime(AU.cents, t, 0.3);
  N.h1.frequency.setTargetAtTime(2800 * AU.pitch, t, 0.3); N.h2.frequency.setTargetAtTime(2967 * AU.pitch, t, 0.3);
  N.hg.gain.setTargetAtTime(0.0001 + 0.02 * depth * depth * depth, t, 0.4);
  // 留まるための推力に、船体がきしむ（r=2.04 では約1600G）
  if (nowS >= N.nextCreak) {
    const b = SND['creak' + ((Math.random() * 3) | 0)];
    if (b) playBuf(b, { rate: rand(0.7, 1.1) * Math.min(AU.pitch, 1.8), gain: 0.06 + 0.2 * depth, pan: rand(-1, 1), rev: 0.5, lp: 3000 });
    N.nextCreak = nowS + rand(0.5, 1.4) * (2.4 - 1.9 * depth);
  }
}
function auFallEnd(hard) {
  const N = AU.fallN;
  if (!N || !AU.ctx) return;
  AU.fallN = null;
  const t = AU.ctx.currentTime;
  N.g.gain.cancelScheduledValues(t); N.g.gain.setTargetAtTime(0.0001, t, hard ? 0.05 : 0.6);
  N.hg.gain.cancelScheduledValues(t); N.hg.gain.setTargetAtTime(0.0001, t, hard ? 0.05 : 0.4);
  const end = t + (hard ? 0.4 : 3.5);
  for (const o of [N.o1, N.o2, N.h1, N.h2]) o.stop(end);
  N.o1.onended = () => disc(N.nodes);
}
// 消灯：吸い込み → ぷつりと切れる → 無音（空電と耳鳴りだけが残る）
function auDarkStart() {
  const ctx = AU.ctx, t = ctx.currentTime;
  if (SND.swell) playBuf(SND.swell, { offset: SND.swell.duration - 3.0, gain: 0.55, rev: 0.3 });
  const d = AU.duck.gain;
  d.cancelScheduledValues(t);
  d.setValueAtTime(d.value, t);
  d.setValueAtTime(d.value, t + 2.97);
  d.linearRampToValueAtTime(0, t + 3.0);
}
function auReignite() {
  const ctx = AU.ctx, t = ctx.currentTime;
  const src = ctx.createBufferSource(); src.buffer = noiseBuf(ctx, 'pink', 8);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(70, t); lp.frequency.exponentialRampToValueAtTime(1100, t + 3.5); lp.frequency.exponentialRampToValueAtTime(200, t + 7.5);
  const g = ctx.createGain();
  env(g.gain, t, [[0, 0.0001], [3.0, 0.45, 'exp'], [7.8, 0.0001, 'exp']]);
  src.connect(lp); lp.connect(g); g.connect(AU.ev);
  const rs = ctx.createGain(); rs.gain.value = 0.5; g.connect(rs); rs.connect(AU.rv);
  src.start(t); src.stop(t + 8);
  const nodes = [src, lp, g, rs];
  // 戻ってくる光の和音：B♭ の上に短九度（B）をのせた濁り
  const cl = ctx.createBiquadFilter(); cl.type = 'lowpass'; cl.frequency.value = 480;
  const cg = ctx.createGain();
  env(cg.gain, t, [[0, 0.0001], [3.2, 0.06, 'exp'], [9.5, 0.0001, 'exp']]);
  cl.connect(cg); cg.connect(AU.ev); cg.connect(rs);
  nodes.push(cl, cg);
  for (const f of [BFLAT, 87.31, 116.54, 123.47]) {
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    o.connect(cl); o.start(t); o.stop(t + 9.6); nodes.push(o);
  }
  src.onended = () => disc(nodes, 2000);
  const d = AU.duck.gain;
  d.cancelScheduledValues(t); d.setValueAtTime(0, t); d.setValueAtTime(0, t + 2.5); d.linearRampToValueAtTime(1, t + 7);
}
function auCross() {
  const ctx = AU.ctx, t = ctx.currentTime;
  const o = ctx.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(116.54, t); o.frequency.exponentialRampToValueAtTime(22, t + 1.3);
  const g = ctx.createGain();
  env(g.gain, t, [[0, 0.0001], [0.08, 0.16, 'exp'], [1.3, 0.0001, 'exp']]);
  o.connect(g); g.connect(AU.ev); o.start(t); o.stop(t + 1.35);
  o.onended = () => disc([o, g]);
  // 外から届く音は赤方偏移して低く遅くなり、こもりながら消えていく
  const m = AU.mlp.frequency, out = AU.out.gain;
  m.cancelScheduledValues(t); m.setValueAtTime(16000, t); m.exponentialRampToValueAtTime(900, t + 3); m.exponentialRampToValueAtTime(120, t + 8.6);
  out.cancelScheduledValues(t); out.setValueAtTime(1, t); out.setValueAtTime(1, t + 7.8); out.linearRampToValueAtTime(0, t + 9.2);

  m.setValueAtTime(16000, back);
  out.setValueAtTime(0, back); out.linearRampToValueAtTime(1, back + 3.2);

// 太陽系が横切るあいだ、遠くでオルゴールが鳴る。少しずつ遅く、低くなり、途中で止まる
function auMusicBox(dur, side) {
  const buf = SND.tine;
  if (!buf) return;
  const t0 = AU.ctx.currentTime + 1.2;
  const mel = [698.46, 1108.73, 1046.5, 932.33, 880.0, 932.33, 698.46, 739.99, 698.46, 659.26];
  let t = t0, step = 0.52, slow = 1;
  for (let rep = 0; rep < 4; rep++) {
    for (let i = 0; i < mel.length; i++) {
      if (t > t0 + dur - 4 || (rep === 3 && i === 6)) return;
      const x = (t - t0) / dur;
      playBuf(buf, { when: t, rate: mel[i] / 1046.5 * slow, gain: 0.09, pan: side * (-0.8 + 1.6 * x), rev: 0.9, echo: 0.35 });
      t += step * rand(0.94, 1.14) * (i === mel.length - 1 ? 2.2 : 1);
      step *= 1.03; slow *= 0.9965;
    }
  }
}
function auStart() {
  if (AU.muted) return;
  if (!AU.ctx && !auCreate()) return;
  const ctx = AU.ctx;
  const done = () => {
    if (ctx !== AU.ctx || ctx.state !== 'running' || AU.ok) return;
    AU.ok = true;
    const t = ctx.currentTime;
    AU.vol.gain.cancelScheduledValues(t);
    AU.vol.gain.setValueAtTime(0, t);
    AU.vol.gain.linearRampToValueAtTime(1, t + 4);
    setSndUI();
  };
  if (ctx.state !== 'running') {
    let p = null;
    try { p = ctx.resume(); } catch (e) {}
    if (p && p.then) p.then(done, () => {}); else setTimeout(done, 50);
  } else done();
}
function auGesture() { if (!AU.ok && !AU.muted) auStart(); }
function toggleSound() {
  if (!AU.ok) { AU.muted = false; auStart(); setSndUI(); return; }
  const ctx = AU.ctx, t = ctx.currentTime;
  AU.muted = !AU.muted;
  AU.vol.gain.cancelScheduledValues(t);
  AU.vol.gain.setValueAtTime(AU.vol.gain.value, t);
  if (AU.muted) {
    AU.vol.gain.linearRampToValueAtTime(0, t + 0.4);
    setTimeout(() => { if (AU.muted && AU.ctx === ctx) ctx.suspend(); }, 500);
  } else {
    ctx.resume();
    AU.vol.gain.linearRampToValueAtTime(1, t + 0.8);
  }
  setSndUI();
}

/* =========================================================
   入力
   ========================================================= */
const ptrs = new Map();
let press = null, pinch = null, keyHold = 0, lastMoveT = 0;
const keys = {};
let uiT = 0;
function showUI() { ui.classList.remove('idle'); uiT = performance.now(); }
function markInput() { lastInput = nowS; showUI(); if (fall.active && fall.auto) release(); }
cvs.addEventListener('pointerdown', e => {
  markInput();
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (crossing) return;
  if (ptrs.size === 1) {
    press = { id: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, t0: nowS, moved: false };
    lastMoveT = performance.now();
  } else if (ptrs.size === 2) {
    press = null;
    if (fall.active) release();
    const [a, b] = [...ptrs.values()];
    pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y), D0: cam.D };
  }
});
cvs.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) { if (e.pointerType === 'mouse') showUI(); return; }
  markInput();
  const p = ptrs.get(e.pointerId); p.x = e.clientX; p.y = e.clientY;
  if (crossing) return;
  if (pinch && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch.d0 > 10) { cam.D = clamp(pinch.D0 * pinch.d0 / Math.max(d, 10), 5.5, 60); Dhome = cam.D; }
    return;
  }
  if (press && press.id === e.pointerId) {
    const dx = e.clientX - press.lx, dy = e.clientY - press.ly;
    press.lx = e.clientX; press.ly = e.clientY;
    if (!press.moved && Math.hypot(e.clientX - press.x0, e.clientY - press.y0) > 9) press.moved = true;
    if (press.moved && !fall.active) {
      const k = 3.2 / Math.max(window.innerHeight, 300);
      cam.az -= dx * k; cam.el += dy * k * 0.8;
      const nt = performance.now(), de = Math.max((nt - lastMoveT) / 1000, 0.008);
      lastMoveT = nt;
      cam.vaz = clamp(cam.vaz * 0.5 + (-dx * k / de) * 0.5, -3, 3);
      cam.vel = clamp(cam.vel * 0.5 + (dy * k * 0.8 / de) * 0.5, -3, 3);
    }
  }
});
function onUp(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (e.type === 'pointerup') auGesture();
  if (pinch && ptrs.size < 2) pinch = null;
  if (press && press.id === e.pointerId) {
    if (fall.active) release();
    else if (!press.moved && nowS - press.t0 < 0.6 && e.type === 'pointerup' && !crossing) dropLantern();
    if (performance.now() - lastMoveT > 90) { cam.vaz = 0; cam.vel = 0; }
    press = null;
  }
}
cvs.addEventListener('pointerup', onUp);
cvs.addEventListener('pointercancel', onUp);
cvs.addEventListener('click', () => auGesture());
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('wheel', e => {
  e.preventDefault(); markInput();
  if (crossing || fall.active) return;
  cam.D = clamp(cam.D * Math.exp(e.deltaY * 0.0011), 5.5, 60); Dhome = cam.D;
}, { passive: false });
window.addEventListener('keydown', e => {
  const onBtn = e.target && e.target.closest && e.target.closest('button');
  if (onBtn && (e.code === 'Space' || e.code === 'Enter')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  markInput();
  if (e.code !== 'KeyM') auGesture();
  switch (e.code) {
    case 'Space': e.preventDefault(); if (!e.repeat && !crossing) keyHold = nowS; break;
    case 'ArrowLeft': keys.l = 1; e.preventDefault(); break;
    case 'ArrowRight': keys.r = 1; e.preventDefault(); break;
    case 'ArrowUp': keys.u = 1; e.preventDefault(); break;
    case 'ArrowDown': keys.d = 1; e.preventDefault(); break;
    case 'Equal': case 'NumpadAdd': keys.zi = 1; break;
    case 'Minus': case 'NumpadSubtract': keys.zo = 1; break;
    case 'KeyM': if (!e.repeat) toggleSound(); break;
    case 'KeyF': if (!e.repeat) toggleFs(); break;
    case 'KeyL': if (!e.repeat) setLite(!lite); break;
  }
});
window.addEventListener('keyup', e => {
  switch (e.code) {
    case 'Space':
      if (fall.active) release();
      else if (keyHold && nowS - keyHold < 0.6) dropLantern();
      keyHold = 0; break;
    case 'ArrowLeft': keys.l = 0; break;
    case 'ArrowRight': keys.r = 0; break;
    case 'ArrowUp': keys.u = 0; break;
    case 'ArrowDown': keys.d = 0; break;
    case 'Equal': case 'NumpadAdd': keys.zi = 0; break;
    case 'Minus': case 'NumpadSubtract': keys.zo = 0; break;
  }
});
window.addEventListener('blur', () => { for (const k in keys) keys[k] = 0; if (fall.active) release(); keyHold = 0; });

/* ---------- アイコン ---------- */
function setSndUI() {
  const on = AU.ok && !AU.muted;
  bSnd.setAttribute('aria-pressed', on ? 'true' : 'false');
  bSnd.classList.toggle('hint', !AU.ok && !AU.muted);
}
const canFs = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
if (!canFs) bFs.hidden = true;
function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
function toggleFs() {
  if (!canFs) return;
  const el = document.documentElement;
  try {
    if (fsEl()) { const x = document.exitFullscreen || document.webkitExitFullscreen; if (x) { const p = x.call(document); if (p && p.catch) p.catch(() => {}); } }
    else { const r = el.requestFullscreen || el.webkitRequestFullscreen; if (r) { const p = r.call(el); if (p && p.catch) p.catch(() => {}); } }
  } catch (e) {}
}
const fsSync = () => bFs.setAttribute('aria-pressed', fsEl() ? 'true' : 'false');
document.addEventListener('fullscreenchange', fsSync);
document.addEventListener('webkitfullscreenchange', fsSync);
function setLite(v) {
  lite = v; saveLite(v);
  NB = lite ? 5 : 8;
  while (beacons.length > NB) dropOldest();
  resScale = Math.min(resScale, resMax());
  if (gl && !buildProgram()) document.documentElement.classList.add('nogl');
  bLite.setAttribute('aria-pressed', lite ? 'true' : 'false');
  setSndUI();
}
// ポインタで押したときはフォーカスを外し、スペースキーを灯に戻す（キーボード操作のフォーカスは残す）
const unfocus = e => { if (e.detail > 0 && e.currentTarget.blur) e.currentTarget.blur(); };
bSnd.addEventListener('click', e => { showUI(); toggleSound(); unfocus(e); });
bFs.addEventListener('click', e => { showUI(); auGesture(); toggleFs(); unfocus(e); });
bLite.addEventListener('click', e => { showUI(); setLite(!lite); unfocus(e); });
bLite.setAttribute('aria-pressed', lite ? 'true' : 'false');
function uiTick() {
  if (!ui.classList.contains('idle') && performance.now() - uiT > 3800 && !ui.contains(document.activeElement)) ui.classList.add('idle');
}
document.addEventListener('visibilitychange', () => {
  paused = document.hidden;
  if (AU.ctx) {
    if (document.hidden) { try { AU.ctx.suspend(); } catch (e) {} }
    else if (AU.ok && !AU.muted) { try { AU.ctx.resume(); } catch (e) {} }
  }
  if (document.hidden && fall.active) release();
});

/* ---------- 始動 ---------- */
let lastTs = null;
function loop(ts) {
  requestAnimationFrame(loop);
  if (paused) { lastTs = null; return; }
  const t = ts / 1000;
  if (lastTs === null) { lastTs = t; return; }
  const raw = t - lastTs;
  lastTs = t;
  const dt = Math.min(Math.max(raw, 0), 0.05);
  nowS += dt;
  update(dt);
  render();
  perf(raw);
  uiTick();
}
if (!initGL()) document.documentElement.classList.add('nogl');
camBasis();
seedAncient(2);
showUI();
requestAnimationFrame(loop);
})();
