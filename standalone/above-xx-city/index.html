function heloTick(dt){
  const dx=H.x-MON.x,dz=H.z-MON.z,r=Math.hypot(dx,dz),th=Math.atan2(dx,dz);H.r=r;
  const er=[Math.sin(th),Math.cos(th)],et=[H.dir*Math.cos(th),-H.dir*Math.sin(th)];
  let ux,uz,vT=42,altT=H.alt0,wmax=.14,pd=0,side=0;
  if(H.mode==='ingress'){ux=-er[0];uz=-er[1];vT=72;wmax=.12;altT=r>2700?115:300;if(r<1720){H.mode='orbit';H.dir=Math.random()<.5?1:-1;nextAct()}}     // 海の上を低く、まっすぐ現地へ。岸が近づいたら上がる
  else if(H.mode==='orbit'){const k=clamp((H.R0-r)/300,-1.3,1.3);ux=et[0]+er[0]*k;uz=et[1]+er[1]*k;vT=42+16*clamp(Math.abs(H.R0-r)/400-.4,0,1)}
  else if(H.mode==='side'){side=1;const k=clamp((H.R0-r)/300,-1,1);ux=et[0]+er[0]*k;uz=et[1]+er[1]*k;vT=H.vs*Math.min(1.6,Math.hypot(1,k));wmax=.3}   // 機首を向けたまま、横へ滑って回る
  else if(H.mode==='retreat'){ux=er[0]+et[0]*.35;uz=er[1]+et[1]*.35;vT=80;wmax=.5;pd=-.08;if(r>H.R0-160){H.mode='side';H.vs=7}}                                  // 背を向けて離れ、離れきったら向き直って見守る
  else if(H.mode==='runin'){ux=-er[0];uz=-er[1];vT=58;wmax=.3;pd=-.05;altT=mix(175,H.alt0,clamp((r-750)/700,0,1));
    if(r<1300&&!H.rk){H.rk=1;S.hits=0;salvo(6);radio('ろけっと、はっしゃ！','gun',0,'calm')}
    if(r<1000&&!H.gb){H.gb=1;gunBurst(1.4);if(H.y<215)A.altWarn()}
    if(H.reach&&r<880&&!MON.swOn&&!MON.tipHit)reachAttack();
    if(r<H.Rb||(MON.swOn&&MON.swT>.25)){H.mode='break';H.dir=Math.random()<.5?1:-1;if(!H.reach)at(2.2,()=>{if(S.hits>1){radio(anyOf(['めいちゅう！ぜんだん めいちゅう！','あたった！あたりました！','めいちゅう〜！きいてる！']),'gun',0,'joy');radio(anyOf(['にばんき、かくにん。いい ぞ！','こうか あり！つづけろ！']),'w2',1.5,'joy')}else radio('はずれた。…もういちど いきます。','gun')})}}
  else{ux=et[0]+er[0]*.9;uz=et[1]+er[1]*.9;vT=H.reach?64:54;wmax=H.reach?.6:.42;altT=H.alt0+(H.reach?90:30);if(r>H.R0-170){H.mode='orbit';H.reach=0;nextAct()}}
  const psiT=side?Math.atan2(-er[0],-er[1]):Math.atan2(ux,uz);
  const w=clamp(wrapPi(psiT-H.psi)*1.2,-wmax,wmax);H.w+=(w-H.w)*ease(dt,.9);H.psi+=H.w*dt;
  let tx,tz;const ul=Math.hypot(ux,uz)||1;
  if(side){tx=ux/ul*vT;tz=uz/ul*vT;H.sp=H.v}else{H.sp+=(vT-H.sp)*ease(dt,3.5);tx=Math.sin(H.psi)*H.sp;tz=Math.cos(H.psi)*H.sp}
  const ox=H.vx,oz=H.vz,k=ease(dt,side?2.6:.6);H.vx+=(tx-H.vx)*k;H.vz+=(tz-H.vz)*k;
  const fx=Math.sin(H.psi),fz=Math.cos(H.psi),ax=(H.vx-ox)/dt,az=(H.vz-oz)/dt,vF=H.vx*fx+H.vz*fz,vR=H.vx*fz-H.vz*fx;
  H.v=Math.hypot(H.vx,H.vz);H.acc+=(ax*fx+az*fz-H.acc)*ease(dt,.5);H.aR+=(ax*fz-az*fx-H.aR)*ease(dt,.4);
  const y0=H.y;H.y+=(altT-H.y)*ease(dt,5);H.vy+=((H.y-y0)/dt-H.vy)*ease(dt,.5);
  H.bank+=(clamp(Math.atan(H.aR/9.81)+vR*.011,-1.05,1.05)-H.bank)*ease(dt,.7);

  H.x+=H.vx*dt;H.z+=H.vz*dt;

/* ---------- ジャイロ ---------- */
function onOri(e){

    if(oa!==G.oa){G.oa=oa;G.snap=1}
    const ux=(cA*cG-sA*sB*sG)*ex-sA*cB*ey,uy=(sA*cG+cA*sB*sG)*ex+cA*cB*ey,uz=-cB*sG*ex+sB*ey;
