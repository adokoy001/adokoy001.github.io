name = "〇〇県✕✕村 沖 深度一二〇"
description = "「午前二時・リエゾン」で崖の下に見えていた、盛り上がる海。その水面の下で、同じ夜に起きていたこと。潜水艦の中で操作卓に向かい、魚雷発射管から出した有線の水中ドローンを操る。大きなモニターにドローンのカメラ、わきに画像ソナーと聴音。海底を、とてつもなく太い柱のようなものが、岸と並んで進んでいる。枠のついた柱を画面のまんなかに捉えて MARK を押しつづけると、母艦が魚雷を撃つ。水の中なので、ドローンはすぐには回らず、すぐには止まらない。触らなければ、乗員が操るので、眺めているだけでもよい。最後は、海面にマストを上げて、岸を見る。艦内の声はすべて英語で、日本語の字幕がつく。1周9分ほど。キーボードとマウスでも遊べる。"
