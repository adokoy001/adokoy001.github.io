name = "Jikkyo スタジオ"
description = "自作のゲームを自動の遊び手が遊び、VTuber がリスナーと雑談しながら配信しているような動画を、ブラウザの中で作る。左に大きくゲーム、右下に VTuber、右上に視聴者の書き込みと投げ銭、下に字幕。体は3D麻雀「翠卓」の8人、声は OtoVoice（アオイとレイは英語で話し、字幕の下に日本語が出る）。ゲームは「上空 左旋回・射手」「上空・射手」「✕✕サーキット 午前二時・周回」「井戸底ソフト 3in1」の4本。録画して動画ファイル（WebM・MP4）にできる。"
