      ctx = cv.getContext('2d', { alpha: false });
      ctx.imageSmoothingEnabled = false;
    }
    cv.style.width = (n.CW * s) + 'px';
    cv.style.height = (n.CH * s) + 'px';
  }
  if (!EMBED) {
    if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(area);
    addEventListener('resize', fit);
    addEventListener('orientationchange', () => setTimeout(fit, 150));
  }

  /* ================= touch on the pixel controller ================= */
  const ptrs = new Map();
  function toLogical(e) {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * L.CW / r.width, (e.clientY - r.top) * L.CH / r.height];
  }
  const d2 = (x, y, q) => (x - q.x) * (x - q.x) + (y - q.y) * (y - q.y);
  function hitCtl(x, y) {
    if (L.mode !== 'none') {
      if (d2(x, y, L.pad) <= 30 * 30) return 'pad';
      const da = d2(x, y, L.A), db = d2(x, y, L.B);
      if (Math.min(da, db) <= 22 * 22) return da <= db ? 'a' : 'b';
      if (Math.abs(x - L.sel.x) <= 14 && y >= L.sel.y - 5 && y <= L.sel.y + 13) return 'select';
      if (Math.abs(x - L.start.x) <= 14 && y >= L.start.y - 5 && y <= L.start.y + 13) return 'start';
    }
    if (x >= L.gx && x < L.gx + W && y >= L.gy && y < L.gy + H) return 'screen';
    return null;
  }
  function padDir(x, y) {
    const dx = x - L.pad.x, dy = y - L.pad.y;
    const o = { left: false, right: false, up: false, down: false };
    if (dx * dx + dy * dy < 9) return o;
    const sec = ((Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) % 8) + 8) % 8;
    o.right = sec === 0 || sec === 1 || sec === 7;
    o.down = sec === 1 || sec === 2 || sec === 3;
    o.left = sec === 3 || sec === 4 || sec === 5;
    o.up = sec === 5 || sec === 6 || sec === 7;
    return o;
  }
  function syncPtrs() {
    const next = {};
    for (const k of BTN) next[k] = false;
    for (const q of ptrs.values()) {
      if (q.ctl === 'pad') { const o = padDir(q.x, q.y); for (const k in o) if (o[k]) next[k] = true; }
      else if (q.ctl === 'a' || q.ctl === 'b' || q.ctl === 'start' || q.ctl === 'select') next[q.ctl] = true;
    }
    for (const k of BTN) {
      if (next[k] && !touch[k]) latch[k] = true;
      touch[k] = next[k];
    }
  }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    ensureAudio();
    const [x, y] = toLogical(e);
    const ctl = hitCtl(x, y);
    if (!ctl) return;
    try { cv.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    if (ctl === 'screen') { if (cstate !== 'game') latch.a = true; return; }
    ptrs.set(e.pointerId, { ctl, x, y });
    syncPtrs();
  });
  cv.addEventListener('pointermove', e => {
    const q = ptrs.get(e.pointerId);
    if (!q) return;
    const [x, y] = toLogical(e);
    q.x = x; q.y = y;
    if (q.ctl === 'a' || q.ctl === 'b' || q.ctl === 'ab') {
      const da = d2(x, y, L.A), db = d2(x, y, L.B);
      q.ctl = Math.min(da, db) <= 26 * 26 ? (da <= db ? 'a' : 'b') : 'ab';
    }
    syncPtrs();
  });
  const endPtr = e => { ptrs.delete(e.pointerId); syncPtrs(); };
  for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) cv.addEventListener(t, endPtr);
  cv.addEventListener('dblclick', () => { if (!isTouch) toggleFullscreen(); });
  document.getElementById('stage').addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('blur', () => { keysDown.clear(); ptrs.clear(); syncPtrs(); });

  /* ================= controller drawing ================= */
  function drawPad(cx, cy, d) {
    const a = 5, R = 16, arm = R - a, full = 2 * R + 1, wide = 2 * a + 1;
    rectC(1, cx - a, cy - R + 2, wide, full);
    rectC(1, cx - R, cy - a + 2, full, wide);
    rectC(2, cx - a, cy - R, wide, full);
    rectC(2, cx - R, cy - a, full, wide);
    rectC(3, cx - a, cy - R, wide, 1);
    rectC(3, cx - a, cy - R, 1, arm);
    rectC(3, cx - R, cy - a, arm, 1);
    rectC(3, cx - R, cy - a, 1, wide);
    rectC(3, cx + a + 1, cy - a, arm, 1);
    if (d.up) rectC(10, cx - a, cy - R, wide, arm);
    if (d.down) rectC(10, cx - a, cy + a + 1, wide, arm);
    if (d.left) rectC(10, cx - R, cy - a, arm, wide);
    if (d.right) rectC(10, cx + a + 1, cy - a, arm, wide);
    let c = d.up ? 4 : 1;
    rectC(c, cx, cy - 12, 1, 1); rectC(c, cx - 1, cy - 11, 3, 1); rectC(c, cx - 2, cy - 10, 5, 1);
    c = d.down ? 4 : 1;
    rectC(c, cx - 2, cy + 10, 5, 1); rectC(c, cx - 1, cy + 11, 3, 1); rectC(c, cx, cy + 12, 1, 1);
    c = d.left ? 4 : 1;
    rectC(c, cx - 12, cy, 1, 1); rectC(c, cx - 11, cy - 1, 1, 3); rectC(c, cx - 10, cy - 2, 1, 5);
    c = d.right ? 4 : 1;
    rectC(c, cx + 10, cy - 2, 1, 5); rectC(c, cx + 11, cy - 1, 1, 3); rectC(c, cx + 12, cy, 1, 1);
    disc(1, cx, cy, 2);
  }
  function drawBtn(cx, cy, label, on) {
    disc(1, cx, cy + 2, 9);
    const y = cy + (on ? 1 : 0);
    disc(on ? 8 : 5, cx, y, 9);
    if (!on) { rectC(7, cx - 5, y - 6, 2, 1); rectC(7, cx - 6, y - 5, 1, 1); }
    text(label, cx - 1, y - 2, on ? 5 : 8);
  }
  function drawPill(cx, y, label, on) {
    const x = cx - 6, w = 13;
    rectC(1, x + 1, y + 1, w - 2, 4); rectC(1, x, y + 2, w, 2);
    const c = on ? 3 : 2, oy = on ? 1 : 0;
    rectC(c, x + 1, y + oy, w - 2, 4); rectC(c, x, y + 1 + oy, w, 2);
    text(label, cx - Math.floor(tw(label) / 2), y + 7, 3);
  }
  function drawControls() {
    drawPad(L.pad.x, L.pad.y, input);
    drawBtn(L.B.x, L.B.y, 'B', input.b);
    drawBtn(L.A.x, L.A.y, 'A', input.a);
    drawPill(L.sel.x, L.sel.y, 'SELECT', input.select);
    drawPill(L.start.x, L.start.y, 'START', input.start);
  }

  /* ================= console screens ================= */
  let cstate = 'boot', bootT = 0, menuT = 0, game = null, pauseSel = 0, flashT = 0, soundToast = 0;
  let sel = EMBED ? 0 : clamp(Number(store.get('idozoko.sel', 0)) | 0, 0, GAMES.length - 1);
  const shell = {
    toMenu() { game = null; cstate = 'menu'; menuT = 0; sfx.pause(); ev('menu'); },
    flash(n) { flashT = n; }
  };
  function launch(i) {
    sel = i;
    if (!EMBED) store.set('idozoko.sel', i);
    game = GAMES[i].create(shell);
    cstate = 'game';
    ev('launch', { id: GAMES[i].id });
  }
  function toggleSound() {
    muted = !muted;
    if (!EMBED) store.set('idozoko.muted', muted);
    soundToast = 70;
    if (!muted) { ensureAudio(); sfx.blip(); }
  }
  document.addEventListener('visibilitychange', () => {
    if (!EMBED && document.hidden && cstate === 'game' && game && game.canPause()) { cstate = 'pause'; pauseSel = 0; }
  });

  function drawBoot() {
    rectC(0, 0, 0, W, H);
    const t = bootT;
    if (t < 14) return;
    const str = 'IDOZOKO SOFT';
    const w = tw(str) + 8, x = Math.floor((W - w) / 2);
    const rest = Math.floor(H / 2) - 6;
    const k = Math.min(1, (t - 14) / 80);
    const y = Math.round(-8 + (rest + 8) * k);
    ctx.drawImage(GEM[t >= 94 ? ((t >> 3) % 3) : 0], x, y);
    text(str, x + 8, y, 7);
    if (t >= 104) text('2026', Math.floor((W - tw('2026')) / 2), rest + 12, 2);
    if (t >= 150) ctx.drawImage(DITHER, 0, 0);
    if (t >= 162) rectC(0, 0, 0, W, H);
  }
  function cursor(x, y, c) { rectC(c, x, y, 1, 7); rectC(c, x + 1, y + 1, 1, 5); rectC(c, x + 2, y + 2, 1, 3); rectC(c, x + 3, y + 3, 1, 1); }
  function drawMenu() {
    rectC(0, 0, 0, W, H);
    for (let i = 0; i < 36; i++) {
      const sp = 0.15 + (i % 3) * 0.2;
      const x = (i * 37 + 5) % W, y = Math.floor((i * 71 + menuT * sp) % H);
      rectC(i % 3 === 2 ? 3 : i % 3 ? 2 : 1, x, y, 1, 1);
    }
    const oy = Math.floor((H - 128) / 2);
    ctext('IDOZOKO SOFT', 6 + oy, 3);
    ctext('3 IN 1', 15 + oy, 4, 2);
    GAMES.forEach((g, i) => {
      const y = 36 + oy + i * 24;
      const on = i === sel;
      rectC(0, 12, y, 104, 22);
      const bc = on ? 4 : 1;
      rectC(bc, 12, y, 104, 1); rectC(bc, 12, y + 21, 104, 1); rectC(bc, 12, y, 1, 22); rectC(bc, 115, y, 1, 22);
      ctx.drawImage(g.icon, 0, 0, g.icon.width, g.icon.height, 18, y + 3, g.icon.width * 2, g.icon.height * 2);
      text(g.name, 40, y + 5, on ? 7 : 3);
      text('HI ' + getBest(g.id), 40, y + 13, on ? 4 : 2);
      if (on && ((menuT >> 4) & 1)) cursor(5, y + 7, 4);
    });
    if (menuT < 20 || (menuT >> 5) & 1) ctext(promptText(), 110 + oy, 7);
  }
  function drawPause() {
    ctx.drawImage(DITHER, 0, 0);
    const y = Math.floor(H / 2) - 22;
    panel(28, y, 72, 46);
    ctext('PAUSE', y + 6, 7, 2);
    ['CONTINUE', 'QUIT'].forEach((s, i) => {
      const yy = y + 23 + i * 10;
      text(s, 46, yy, pauseSel === i ? 7 : 3);
      if (pauseSel === i) { rectC(4, 40, yy, 1, 5); rectC(4, 41, yy + 1, 1, 3); rectC(4, 42, yy + 2, 1, 1); }
    });
  }
  function drawToast() {
    if (soundToast <= 0) return;
    const s = muted ? 'SOUND OFF' : 'SOUND ON';
    const w = tw(s) + 8, x = Math.floor((W - w) / 2), y = H - 14;
    rectC(0, x, y, w, 10);
    rectC(2, x, y, w, 1); rectC(2, x, y + 9, w, 1);
    text(s, x + 4, y + 3, muted ? 3 : 6);
  }

  function render() {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, L.CW, L.CH);
    ctx.save();
    ctx.translate(L.gx, L.gy);
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.clip();
    if (cstate === 'boot') drawBoot();
    else if (cstate === 'menu') drawMenu();
    else if (game) {
      game.render();
      if (cstate === 'pause') drawPause();
    }
    if (flashT > 0) { ctx.globalAlpha = flashT / 8; rectC(7, 0, 0, W, H); ctx.globalAlpha = 1; }
    drawToast();
    ctx.restore();
    if (L.mode !== 'none') drawControls();
  }

  function step() {
    frame++;
    botTick();
    readInput();
    if (soundToast > 0) soundToast--;
    if (flashT > 0) flashT--;
    if (input.selectPressed && cstate !== 'boot') toggleSound();
    if (cstate === 'boot') {
      bootT++;
      if (bootT === 94 && ac) sfx.chime();
      if (input.aPressed || input.startPressed || bootT >= 172) { cstate = 'menu'; menuT = 0; ev('menu_ready'); }
      return;
    }
    if (cstate === 'menu') {
      menuT++;
      if (input.upPressed) { sel = (sel + GAMES.length - 1) % GAMES.length; sfx.move(); }
      if (input.downPressed) { sel = (sel + 1) % GAMES.length; sfx.move(); }
      if (input.aPressed || input.startPressed) launch(sel);
      return;
    }
    if (cstate === 'game') {
      if (input.startPressed && game.canPause()) { cstate = 'pause'; pauseSel = 0; sfx.pause(); ev('pause'); return; }
      game.update();
      return;
    }
    if (cstate === 'pause') {
      if (input.upPressed || input.downPressed) { pauseSel = 1 - pauseSel; sfx.move(); }
      if (input.bPressed) { cstate = 'game'; sfx.pause(); return; }
      if (input.aPressed || input.startPressed) {
        if (pauseSel === 0) { cstate = 'game'; sfx.pause(); }
        else shell.toMenu();
      }
    }
  }
  let last = 0, acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last);
    last = now;
    let n = 0;
    while (acc >= STEP && n < 6) { step(); acc -= STEP; n++; }
    if (n === 6) acc = 0;
    render();
    requestAnimationFrame(loop);
  }

  function boot(data) {
    if (data && Number.isInteger(data.sel)) sel = clamp(data.sel, 0, GAMES.length - 1);
    fit();
    if (EMBED) ensureAudio();
    cstate = 'boot'; bootT = 0;
    render();
    requestAnimationFrame(t => { last = t; requestAnimationFrame(loop); });
  }
  if (!EMBED) {
    try { window.claude?.hot?.snapshot?.(() => ({ sel })); } catch (_) { /* no hot reload */ }
  }
  if (!EMBED && window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(EMBED ? {} : (window.claude?.hot?.data ?? {}));
})();
</script>
</body>
</html>
