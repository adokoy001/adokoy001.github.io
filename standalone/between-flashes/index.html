<script>
const FRAG = `precision highp float;
uniform vec2 uRes;
uniform float uTime;      // seconds, wrapped (noise/anim)
uniform float uRain;      // seconds, wrapped separately (drops)
uniform vec3 uCamPos;
uniform vec2 uCamRot;     // yaw, pitch
uniform float uFov;       // vertical fov in radians
uniform float uFlash;     // total sky flash brightness
uniform float uFlashIn;   // flash light reaching the room (diffuse)
uniform vec3 uFlashDir;   // direction toward the brightest ground strike (unit, world)
uniform float uFlashDirI; // its direct intensity through the window
uniform vec4 uF0, uF1, uF2; // flash sources: az, el, radius, intensity
uniform vec3 uFK;         // their kinds: 0 in-cloud, 1 cloud-to-ground, 2 beyond horizon
uniform float uBolt;      // bolt visibility 0..1
uniform vec4 uBoltP;      // az, el_top, seed, branchiness
uniform vec3 uBoltQ;      // el_bottom, branch brightness, width
uniform float uExpo;      // exposure multiplier (dark adaptation after a near flash)
uniform float uEmber;     // ember light intensity 0..1.5
uniform float uEmberF;    // flicker 0.6..1.3
uniform vec4 uFig;        // x, z, visible(0/1), height scale
uniform vec4 uFigOut;     // x, y, z, visible
uniform float uEyes;      // 0 open .. 1 closed
uniform vec3 uFogOwn;     // u, v, amount
uniform vec3 uFogNext;    // u, v, amount (someone beside you)
uniform vec3 uFogOut;     // u, v, amount (outside pane)
uniform vec3 uClock;      // hour angle, minute angle, pendulum angle
uniform vec3 uKnock;      // u, v, seconds since knock (large if none)
uniform float uDread;     // 0..1 (pulls exposure, grain)
uniform float uMuffle;    // 0..1 (room darkens slightly when eyes close etc)
uniform float uLite;
uniform float uRM;        // reduced motion
uniform float uSteps;     // primary march steps
uniform float uSteps2;    // reflection march steps
uniform float uDbg;

#ifndef MARCH_N
#define MARCH_N 96
#endif
#ifndef SHAD_N
#define SHAD_N 14
#endif
#ifndef FIG_N
#define FIG_N 26
#endif
#define BM 0.12
#define PI 3.14159265
#define GLASSZ -3.9
#define GROUNDY -28.0

// ---------- hashing / noise ----------
float hash1(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float hash1(vec3 p3){ p3 = fract(p3*0.1031); p3 += dot(p3, p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
vec2 hash2(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash1(i), hash1(i+vec2(1,0)), f.x), mix(hash1(i+vec2(0,1)), hash1(i+vec2(1,1)), f.x), f.y);
}
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash1(i), hash1(i+vec3(1,0,0)), f.x), mix(hash1(i+vec3(0,1,0)), hash1(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash1(i+vec3(0,0,1)), hash1(i+vec3(1,0,1)), f.x), mix(hash1(i+vec3(0,1,1)), hash1(i+vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm2(vec2 p){ return 0.5*vnoise(p) + 0.25*vnoise(p*2.03+1.7); }
float fbm3(vec2 p){ return 0.5*vnoise(p) + 0.25*vnoise(p*2.03+1.7) + 0.125*vnoise(p*4.1+3.1); }
float ss(float a, float b, float x){ float t = clamp((x - a)/(b - a), 0.0, 1.0); return t*t*(3.0 - 2.0*t); }
mat2 rot2(float a){ float c=cos(a), s=sin(a); return mat2(c,s,-s,c); }

// ---------- SDF primitives ----------
float sdBox(vec3 p, vec3 b){ vec3 q = abs(p)-b; return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0); }
float sdBox2(vec2 p, vec2 b){ vec2 q = abs(p)-b; return length(max(q,0.0)) + min(max(q.x,q.y),0.0); }
float sdSph(vec3 p, float r){ return length(p)-r; }
float sdCyl(vec3 p, float h, float r){ vec2 d = abs(vec2(length(p.xz),p.y)) - vec2(r,h); return min(max(d.x,d.y),0.0) + length(max(d,0.0)); }
float sdCaps(vec3 p, vec3 a, vec3 b, float r){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0); return length(pa-ba*h)-r; }
float sdCone(vec3 p, float h, float r1, float r2){ // capped cone, y from -h to h, r1 at bottom
  vec2 q = vec2(length(p.xz), p.y);
  vec2 k1 = vec2(r2,h), k2 = vec2(r2-r1,2.0*h);
  vec2 ca = vec2(q.x-min(q.x,(q.y<0.0)?r1:r2), abs(q.y)-h);
  vec2 cb = q - k1 + k2*clamp(dot(k1-q,k2)/dot(k2,k2),0.0,1.0);
  float s = (cb.x<0.0 && ca.y<0.0) ? -1.0 : 1.0;
  return s*sqrt(min(dot(ca,ca),dot(cb,cb)));
}
float sdTorXY(vec3 p, float R, float r){ vec2 q = vec2(length(p.xy)-R, p.z); return length(q)-r; }
float sdTorXZ(vec3 p, float R, float r){ vec2 q = vec2(length(p.xz)-R, p.y); return length(q)-r; }
float sdEll(vec3 p, vec3 r){ float k0 = length(p/r); float k1 = length(p/(r*r)); return k0*(k0-1.0)/k1; }

// ---------- window shape (2D, xy on the wall) ----------
float winMask2D(vec2 p){ // <0 inside opening
  float rect = sdBox2(p - vec2(0.0, 2.075), vec2(1.15, 1.225)); // y 0.85..3.3
  float arch = max(length(p - vec2(0.0, 3.3)) - 1.15, 3.3 - p.y);
  return min(rect, arch);
}
float mullion2D(vec2 p){ // <0 on stone mullion/tracery
  float v = sdBox2(p - vec2(0.0, 2.105), vec2(0.045, 1.26));
  float h1 = sdBox2(p - vec2(0.0, 1.70), vec2(1.2, 0.035));
  float h2 = sdBox2(p - vec2(0.0, 2.55), vec2(1.2, 0.035));
  float ring = abs(length(p - vec2(0.0, 3.75)) - 0.45) - 0.045;
  float d = min(min(v,h1), min(h2,ring));
  // small inner cusps of the arch (two quarter-arcs meeting the ring)
  float cl = abs(length(p - vec2(-0.62, 3.05)) - 0.58) - 0.035; cl = max(cl, 3.3 - p.y); cl = max(cl, p.x + 0.05);
  float cr = abs(length(p - vec2( 0.62, 3.05)) - 0.58) - 0.035; cr = max(cr, 3.3 - p.y); cr = max(cr, -p.x + 0.05);
  d = min(d, min(cl, cr));
  return d;
}

// ---------- figure ----------
float sdFigure(vec3 p, float hs){ // base at origin, faces -z, height ~1.9*hs
  p.y /= hs;
  float skirt = sdCone(p - vec3(0.0, 0.52, 0.0), 0.52, 0.44, 0.17);
  // soft folds in the skirt
  skirt += 0.012*sin(atan(p.x, p.z + 1e-4)*9.0 + p.y*2.0) * ss(1.0, 0.1, p.y);
  float torso = sdCaps(p, vec3(0.0, 1.0, 0.0), vec3(0.0, 1.46, 0.0), 0.165);
  float shoulders = sdEll(p - vec3(0.0, 1.47, 0.0), vec3(0.24, 0.075, 0.12));
  float neck = sdCyl(p - vec3(0.0, 1.55, 0.0), 0.08, 0.05);
  float head = sdEll(p - vec3(0.0, 1.72, 0.01), vec3(0.095, 0.125, 0.105));
  float hair = sdEll(p - vec3(0.0, 1.75, -0.03), vec3(0.105, 0.135, 0.11));
  hair = max(hair, -(p.z - 0.02)); // hair only toward the back
  float armL = sdCaps(p, vec3(-0.21, 1.42, 0.0), vec3(-0.25, 0.86, 0.04), 0.045);
  float armR = sdCaps(p, vec3( 0.21, 1.42, 0.0), vec3( 0.25, 0.86, 0.04), 0.045);
  float d = min(min(skirt, torso), min(shoulders, neck));
  d = min(d, min(head, hair));
  d = min(d, min(armL, armR));
  return d * hs;
}

// ---------- globals for the march ----------
float gFigOn = 0.0;
vec3 gFigPos = vec3(0.0);
float gShadow = 0.0; // 1 while tracing shadows: small objects are skipped

vec2 opU(vec2 a, vec2 b){ return a.x < b.x ? a : b; }

// Materials: 1 shell, 2 stone(mullion/embrasure), 3 curtain, 4 chair fabric, 5 wood,
// 6 brass, 7 ember, 8 figure dress, 9 clock face, 10 mantel stone, 11 figure skin, 12 canvas, 13 door
vec2 map(vec3 p){
  // free space: room ∪ opening ∪ door recess ∪ fireplace recess
  float dRoom = sdBox(p - vec3(0.0, 2.6, 1.0), vec3(4.0, 2.6, 4.0));
  float dOpen = max(winMask2D(p.xy), abs(p.z + 3.6) - 0.72);
  float dDoor = sdBox(p - vec3(-2.6, 1.15, 5.06), vec3(0.52, 1.15, 0.1));
  float dFire = sdBox(p - vec3(-3.85, 0.55, 1.0), vec3(0.3, 0.5, 0.6));
  float shell = -min(min(dRoom, dOpen), min(dDoor, dFire));
  vec2 r = vec2(shell, 1.0);
  float b;

  // mullions, tracery, sill
  b = sdBox(p - vec3(0.0, 2.6, -3.6), vec3(1.4, 2.0, 0.8));
  if (b < BM){
    float m = max(mullion2D(p.xy), abs(p.z - GLASSZ) - 0.12);
    m = max(m, winMask2D(p.xy));
    float sill = sdBox(p - vec3(0.0, 0.78, -3.42), vec3(1.34, 0.07, 0.5));
    r = opU(r, vec2(min(m, sill), 2.0));
  } else r = opU(r, vec2(b, 2.0));

  // fireplace: mantel, embers, grate
  b = sdBox(p - vec3(-3.75, 0.75, 1.0), vec3(0.4, 0.8, 1.1));
  if (b < BM){
    vec3 q = p - vec3(-3.78, 0.7, 1.0);
    float mant = sdBox(q, vec3(0.24, 0.7, 0.95));
    float open = sdBox(q - vec3(-0.1, -0.1, 0.0), vec3(0.4, 0.5, 0.56));
    mant = max(mant, -open);
    float top = sdBox(q - vec3(0.02, 0.73, 0.0), vec3(0.3, 0.035, 1.02));
    r = opU(r, vec2(min(mant, top), 10.0));
    if (gShadow < 0.5){
      float emb = sdBox(p - vec3(-3.88, 0.1, 1.0), vec3(0.14, 0.07, 0.34)) + 0.03*vnoise(p.xz*22.0 + p.y*9.0);
      r = opU(r, vec2(emb, 7.0));
      float bars = sdBox(vec3(mod(p.z - 1.0 + 0.1, 0.2) - 0.1, p.y - 0.16, p.x + 3.62), vec3(0.012, 0.16, 0.012));
      bars = max(bars, abs(p.z - 1.0) - 0.5);
      r = opU(r, vec2(bars, 6.0));
    }
  } else r = opU(r, vec2(b, 10.0));

  // curtains and rod
  b = sdBox(p - vec3(0.0, 2.7, -2.78), vec3(2.2, 2.3, 0.2));
  if (b < BM){
    vec3 q = p - vec3(-1.68, 2.6, -2.78);
    float tq = (q.y + 1.0)*2.2; float tie = 1.0 - 0.32*exp(-tq*tq);
    vec3 qq = q; qq.x /= tie;
    float c = sdBox(qq, vec3(0.26, 2.25, 0.1)) + 0.03*sin(qq.x*24.0 + qq.y*1.5);
    vec3 qq2 = p - vec3(1.68, 2.6, -2.78); qq2.x /= tie;
    float c2 = sdBox(qq2, vec3(0.26, 2.25, 0.1)) + 0.03*sin(qq2.x*24.0 - qq2.y*1.5);
    r = opU(r, vec2(min(c, c2)*0.8, 3.0));
    float rod = sdCyl((p - vec3(0.0, 4.9, -2.8)).yxz, 2.1, 0.025);
    r = opU(r, vec2(rod, 6.0));
  } else r = opU(r, vec2(b, 3.0));

  // armchair near the window, facing it
  b = sdBox(p - vec3(1.75, 0.7, -0.9), vec3(0.45, 0.72, 0.5));
  if (b < BM){
    vec3 q = p - vec3(1.75, 0.0, -0.9);
    float seat = sdBox(q - vec3(0.0, 0.32, 0.0), vec3(0.36, 0.14, 0.34));
    float back = sdBox(q - vec3(0.0, 0.85, 0.36), vec3(0.36, 0.5, 0.07));
    float arms = sdBox(vec3(abs(q.x) - 0.33, q.y - 0.62, q.z - 0.02), vec3(0.05, 0.12, 0.33));
    float ch = min(min(seat, back), arms) - 0.015;
    r = opU(r, vec2(ch, 4.0));
    float legs = sdBox(vec3(abs(q.x) - 0.3, q.y - 0.1, abs(q.z) - 0.28), vec3(0.03, 0.1, 0.03));
    r = opU(r, vec2(legs, 5.0));
  } else r = opU(r, vec2(b, 4.0));

  // small round table with an unlit candelabrum
  b = sdBox(p - vec3(-1.5, 0.6, -1.1), vec3(0.4, 0.65, 0.4));
  if (b < BM){
    vec3 q = p - vec3(-1.5, 0.0, -1.1);
    float top = sdCyl(q - vec3(0.0, 0.74, 0.0), 0.02, 0.32);
    float stem = sdCyl(q - vec3(0.0, 0.37, 0.0), 0.37, 0.035);
    float foot = sdCone(q - vec3(0.0, 0.03, 0.0), 0.03, 0.2, 0.08);
    r = opU(r, vec2(min(min(top, stem), foot), 5.0));
    if (gShadow < 0.5){
      float cs = sdCyl(q - vec3(0.0, 0.9, 0.0), 0.14, 0.012);
      float cb = sdCone(q - vec3(0.0, 0.78, 0.0), 0.02, 0.07, 0.03);
      float ca = sdTorXZ(q - vec3(0.0, 1.03, 0.0), 0.09, 0.012);
      float cn = sdCyl(vec3(abs(q.x) - 0.09, q.y - 1.1, q.z), 0.07, 0.014);
      cn = min(cn, sdCyl(vec3(q.x, q.y - 1.1, abs(q.z) - 0.09), 0.07, 0.014));
      r = opU(r, vec2(min(min(cs, cb), min(ca, cn)), 6.0));
    }
  } else r = opU(r, vec2(b, 5.0));

  // long-case clock against the back wall
  b = sdBox(p - vec3(2.7, 1.15, 4.78), vec3(0.35, 1.2, 0.3));
  if (b < BM){
    vec3 q = p - vec3(2.7, 0.0, 4.78);
    float body = sdBox(q - vec3(0.0, 1.1, 0.0), vec3(0.24, 1.1, 0.18));
    float hood = sdBox(q - vec3(0.0, 2.0, 0.0), vec3(0.3, 0.3, 0.22));
    float face = sdCyl((q - vec3(0.0, 2.0, -0.23)).xzy, 0.012, 0.19);
    float pane = sdBox(q - vec3(0.0, 1.0, -0.185), vec3(0.14, 0.55, 0.01));
    float wood = max(min(body, hood), -pane);
    r = opU(r, vec2(wood, 5.0));
    if (gShadow < 0.5){
      r = opU(r, vec2(face, 9.0));
      vec3 pv = q - vec3(0.0, 1.55, -0.1);
      pv.xy = rot2(uClock.z) * pv.xy;
      float rodp = sdCaps(pv, vec3(0.0), vec3(0.0, -0.5, 0.0), 0.006);
      float bob = sdCyl((pv - vec3(0.0, -0.5, 0.0)).xzy, 0.012, 0.06);
      r = opU(r, vec2(min(rodp, bob), 6.0));
    }
  } else r = opU(r, vec2(b, 5.0));

  // the figure (only in the reflection)
  if (gFigOn > 0.5){
    vec3 q = p - gFigPos;
    if (length(q.xz) < 1.2 && q.y > -0.1 && q.y < 2.5){
      r = opU(r, vec2(sdFigure(q, uFig.w), 8.0));
    } else {
      r = opU(r, vec2(length(vec3(q.x, max(q.y - 1.2, 0.0), q.z)) - 1.0, 8.0));
    }
  }
  if (gShadow > 0.5) return r; // nothing below casts a shadow worth tracing
  // chandelier
  b = sdBox(p - vec3(0.5, 4.2, 0.8), vec3(0.7, 0.5, 0.7));
  if (b < BM){
    vec3 q = p - vec3(0.5, 3.95, 0.8);
    float ring = sdTorXZ(q, 0.55, 0.03);
    float stem = sdCyl(q - vec3(0.0, 0.6, 0.0), 0.65, 0.02);
    float ball = sdSph(q - vec3(0.0, -0.1, 0.0), 0.11);
    float a = atan(q.z, q.x + 1e-5); float sec = PI/3.0;
    float an = floor(a/sec + 0.5)*sec;
    vec3 qa = q; qa.xz = rot2(-an) * qa.xz;
    float arm = sdCaps(qa, vec3(0.0, -0.1, 0.0), vec3(0.55, 0.0, 0.0), 0.014);
    qa.x -= 0.55;
    float cup = sdCyl(qa - vec3(0.0, 0.06, 0.0), 0.06, 0.035);
    float candle = sdCyl(qa - vec3(0.0, 0.2, 0.0), 0.11, 0.016);
    r = opU(r, vec2(min(min(ring, stem), min(ball, min(cup, min(candle, arm)))), 6.0));
  } else r = opU(r, vec2(b, 6.0));

  // portrait on the right wall
  b = sdBox(p - vec3(3.95, 2.5, 1.0), vec3(0.1, 0.85, 0.7));
  if (b < BM){
    vec3 q = p - vec3(3.96, 2.5, 1.0);
    float frame = sdBox(q, vec3(0.045, 0.78, 0.6));
    float canvas = sdBox(q - vec3(-0.02, 0.0, 0.0), vec3(0.035, 0.68, 0.5));
    r = opU(r, vec2(max(frame, -canvas), 6.0));
    r = opU(r, vec2(sdBox(q - vec3(0.01, 0.0, 0.0), vec3(0.01, 0.68, 0.5)), 12.0));
  } else r = opU(r, vec2(b, 6.0));

  // door panel (in the recess)
  r = opU(r, vec2(sdBox(p - vec3(-2.6, 1.15, 5.1), vec3(0.5, 1.12, 0.02)), 13.0));

  return r;
}

vec3 calcNormal(vec3 p){
  vec2 e = vec2(0.0015, -0.0015);
  return normalize(e.xyy*map(p + e.xyy).x + e.yyx*map(p + e.yyx).x + e.yxy*map(p + e.yxy).x + e.xxx*map(p + e.xxx).x);
}

// ---------- marching ----------
vec3 march(vec3 ro, vec3 rd, float tmax, float steps){
  float t = 0.0; float m = -1.0; float it = 0.0; float lastM = -1.0; bool past = false;
  for (int i = 0; i < MARCH_N; i++){
    if (float(i) >= steps) break;
    vec3 p = ro + rd*t;
    vec2 h = map(p); lastM = h.y;
#ifdef LITE
    if (h.x < 0.0025 * (1.0 + t*0.8)){ m = h.y; it = float(i); break; }
#else
    if (h.x < 0.0012 * (1.0 + t*0.6)){ m = h.y; it = float(i); break; }
#endif
    t += h.x * 0.92;
    if (t > tmax){ m = -1.0; past = true; break; }
  }
  // out of steps while still inside: shade the last point rather than leave a black hole
  if (m < 0.0 && !past) m = lastM;
  return vec3(t, m, it);
}
float softShadow(vec3 ro, vec3 rd, float tmax, float steps, float k){
  float res = 1.0; float t = 0.12;
  gShadow = 1.0;
  for (int i = 0; i < SHAD_N; i++){
    if (float(i) >= steps) break;
    float h = map(ro + rd*t).x;
    res = min(res, k*h/t);
    t += clamp(h, 0.08, 0.6);
    if (res < 0.02 || t > tmax) break;
  }
  gShadow = 0.0;
  return clamp(res, 0.0, 1.0);
}
float calcAO(vec3 p, vec3 n){
  float ao = 0.0;
  ao += (0.08 - clamp(map(p + n*0.08).x, 0.0, 0.08));
  ao += (0.3 - clamp(map(p + n*0.3).x, 0.0, 0.3)) * 0.4;
  return clamp(1.0 - ao*3.0, 0.0, 1.0);
}

// ---------- outside ----------
#define OUTERZ -4.3
float angDist(float az, float el, float az2, float el2){
  float da = az - az2; da -= 6.2831853*floor(da/6.2831853 + 0.5);
  return length(vec2(da*cos(el2), el - el2));
}
// up to three simultaneous flash sources: (az, el, radius, intensity); kind 0 = inside cloud, 1 = cloud to ground, 2 = beyond the horizon
float flashSky(float az, float el, float cloud, vec4 f, float kind){
  if (f.w < 0.001) return 0.0;
  float d = angDist(az, el, f.x, f.y);
  float g = exp(-(d*d)/(f.z*f.z));
  float horiz = exp(-max(el, 0.0)*9.0);
  if (kind > 1.5) return f.w * (0.15*horiz + 0.85*g*horiz) * (0.6 + 0.6*cloud);
  if (kind > 0.5){
    float da = az - f.x; da -= 6.2831853*floor(da/6.2831853 + 0.5);
    float de = el - f.y;
    float gw = exp(-(da*da)/(f.z*f.z*2.0) - (de*de)/(f.z*f.z*0.5));
    return f.w * (0.06 + 0.3*gw) * (0.3 + 1.1*cloud) * (0.7 + 0.5*horiz);
  }
  // inside the cloud: a blob lit from within, bright core, cloud bulges in front stay darker
  float core = exp(-(d*d)/(f.z*f.z*0.25));
  float detail = vnoise(vec2(az*9.0, el*15.0 + 2.0));
  return f.w * (0.1 + 0.4*g*(0.6 + 0.6*cloud) + 1.1*core*(0.2 + 0.5*cloud + 0.5*detail)) * (0.8 + 0.3*horiz);
}
float boltGlow(float az, float el){
  if (uBolt < 0.001) return 0.0;
  float d = 10.0; float dd = 10.0;
  vec2 a = vec2(uBoltP.x, uBoltP.y);
  float n = 12.0;
  float dy = (uBoltP.y - uBoltQ.x)/n;
  float tort = 0.11*clamp((uBoltP.y - uBoltQ.x)*2.5, 0.3, 1.0);
  for (int i = 0; i < 12; i++){
    float fi = float(i);
    float z1 = (hash1(vec2(uBoltP.z, fi*1.7)) - 0.5) * tort * (1.0 + 0.5*hash1(vec2(fi, uBoltP.z)));
    vec2 b = vec2(a.x + z1, a.y - dy);
    vec2 pa = vec2(az, el) - a, ba = b - a;
    float h = clamp(dot(pa, ba)/dot(ba, ba), 0.0, 1.0);
    d = min(d, length(pa - ba*h));
    if ((i == 3 || i == 6 || i == 8) && uBoltP.w > 0.5){
      float sgn = sign(z1 + 0.0007);
      vec2 c = b + vec2(0.5*tort*sgn*(1.0 + fi*0.2), -dy*(2.0 + fi*0.3));
      vec2 bb = c - b, pb = vec2(az, el) - b;
      float hh = clamp(dot(pb, bb)/dot(bb, bb), 0.0, 1.0);
      dd = min(dd, length(pb - bb*hh));
      vec2 c2 = c + vec2(0.3*tort*sgn, -dy*1.5);
      vec2 bb2 = c2 - c, pc = vec2(az, el) - c;
      float h2 = clamp(dot(pc, bb2)/dot(bb2, bb2), 0.0, 1.0);
      dd = min(dd, length(pc - bb2*h2) + 0.001);
    }
    a = b;
  }
  float w = uBoltQ.z;
  float core = exp(-d*d/(w*w*2.5)) * 1.0 + exp(-d*90.0) * 0.22;
  float br = (exp(-dd*dd/(w*w*1.2)) * 0.6 + exp(-dd*120.0) * 0.1) * uBoltQ.y;
  return core + br;
}
float streaks(float az, float el, float t){
  float s1 = vnoise(vec2(az*90.0, el*8.0 + t*3.2));
  float s2 = vnoise(vec2(az*160.0 + 7.0, el*14.0 + t*5.1));
#ifdef LITE
  return ss(0.78, 0.96, s1) * 0.8 + ss(0.8, 0.98, s2) * 0.55;
#else
  float s3 = vnoise(vec2(az*55.0 + 3.0, el*5.0 + t*2.3));
  return ss(0.78, 0.96, s1) * 0.7 + ss(0.8, 0.98, s2) * 0.45 + ss(0.84, 0.99, s3) * 0.5;
#endif
}
float cloudDen(float az, float el){
#ifdef LITE
  return fbm2(vec2(az*2.2, el*4.5 + 0.2) + vec2(uTime*0.006, 0.0)) * 1.15;
#else
  return fbm3(vec2(az*2.2, el*4.5 + 0.2) + vec2(uTime*0.006, 0.0));
#endif
}
vec3 skyCol(vec3 rd, float az, float el){
  float horiz = exp(-max(el, 0.0)*7.0);
  vec3 base = vec3(0.0025, 0.003, 0.0045) * (1.0 + 1.8*horiz);
  if (uDbg > 1.5) return vec3(boltGlow(az, el)*2.0 + 0.02);
  float c = cloudDen(az, el);
  float lit = flashSky(az, el, c, uF0, uFK.x) + flashSky(az, el, c, uF1, uFK.y) + flashSky(az, el, c, uF2, uFK.z);
  base += lit * vec3(0.78, 0.84, 1.0);
  base += boltGlow(az, el) * uBolt * vec3(0.9, 0.93, 1.0) * 8.0;
  return base;
}
float flashLobe(vec3 rd){
  float s = 0.0;
  s += uF0.w * (0.35 + 0.65*max(dot(rd, vec3(sin(uF0.x)*cos(uF0.y), sin(uF0.y), -cos(uF0.x)*cos(uF0.y))), 0.0));
  s += uF1.w * (0.35 + 0.65*max(dot(rd, vec3(sin(uF1.x)*cos(uF1.y), sin(uF1.y), -cos(uF1.x)*cos(uF1.y))), 0.0));
  s += uF2.w * (0.35 + 0.65*max(dot(rd, vec3(sin(uF2.x)*cos(uF2.y), sin(uF2.y), -cos(uF2.x)*cos(uF2.y))), 0.0));
  return s;
}
vec3 water(vec3 rd, vec3 n, vec3 fl){
  vec3 rr = reflect(rd, n);
  vec3 refl = skyCol(rr, atan(rr.x, -rr.z + 1e-5), atan(rr.y, max(length(rr.xz), 1e-4)));
  float fr = 0.03 + 0.97*pow(1.0 - max(-rd.y, 0.0), 5.0);
  return refl * (0.5 + 0.5*fr) + fl*0.004;
}
vec3 outside(vec3 ro, vec3 rd){
  float az = atan(rd.x, -rd.z + 1e-5);
  float hl = max(length(rd.xz), 1e-4);
  float el = atan(rd.y, hl);
  vec3 sky = skyCol(rd, az, el);
  vec3 col = sky;
  float dist = 3000.0;
  float amb = 0.003;
  float fl = flashLobe(rd);
  vec3 L = uFlashDir;
  // the tower's own wall below the window (outer face at z = OUTERZ)
  if (rd.z < -1e-4){
    float tw = (OUTERZ - ro.z)/rd.z;
    vec3 wp = ro + rd*tw;
    if (winMask2D(wp.xy) > 0.0 && wp.y > GROUNDY){
      float blk = ss(0.0, 0.02, abs(fract(wp.y/0.36) - 0.5)*0.36 - 0.012) * ss(0.0, 0.02, abs(fract((wp.x + floor(wp.y/0.36)*0.33)/0.72) - 0.5)*0.72 - 0.012);
      vec3 alb = vec3(0.17, 0.165, 0.15) * (0.75 + 0.4*vnoise(wp.xy*5.0)) * (0.55 + 0.45*blk);
      alb *= 0.6 + 0.4*ss(-2.0, 2.0, wp.y); // wet, darker below the sill
      col = alb * (amb + fl*1.4*max(dot(vec3(0.0, 0.0, -1.0), L), 0.2)); dist = tw;
    }
  }
  // ground: moat by the wall, meadow, a track, a river in the distance
  if (rd.y < -1e-4){
    float tg = (GROUNDY - ro.y)/rd.y;
    if (tg < dist){
      vec3 gp = ro + rd*tg;
      float dz = OUTERZ - gp.z; // distance out from the wall
      float moat = ss(13.0, 11.5, dz) * step(0.5, dz);
      float riverC = 190.0 + 25.0*vnoise(vec2(gp.x*0.01 + 1.0, 0.0)) + 8.0*vnoise(vec2(gp.x*0.05, 1.0));
      float river = ss(16.0, 11.0, abs(dz - riverC));
      float track = ss(2.6, 1.8, abs(gp.x - 3.0*sin(dz*0.05))) * step(13.0, dz) * step(dz, 170.0);
      vec3 alb = mix(vec3(0.045, 0.06, 0.03), vec3(0.07, 0.075, 0.04), vnoise(gp.xz*0.9));
      alb = mix(alb, vec3(0.17, 0.16, 0.14), track);
      vec3 n = vec3(0.0, 1.0, 0.0);
      vec3 lit = alb * (amb + fl*1.8);
      float wet = max(moat, river);
      col = mix(lit, water(rd, n, vec3(fl)), wet);
      dist = tg;
    }
  }
  // forest bands and hills as silhouettes at fixed horizontal distances
  { float Lx = 1200.0; float s = Lx/hl; if (s < dist){ float y = ro.y + rd.y*s;
      float top = GROUNDY + 140.0 + 260.0*vnoise(vec2(az*0.9 + 4.0, 0.0)) + 60.0*vnoise(vec2(az*3.5, 0.7));
      if (y < top){ col = vec3(0.0025, 0.003, 0.0045) + vec3(0.03, 0.035, 0.05)*fl; dist = s; } } }
  { float Lx = 420.0; float s = Lx/hl; if (s < dist){ float y = ro.y + rd.y*s;
      float top = GROUNDY + 34.0 + 70.0*vnoise(vec2(az*1.3 + 2.0, 0.0)) + 18.0*vnoise(vec2(az*5.0, 0.5));
      if (y < top){ col = vec3(0.0025, 0.003, 0.0045) + vec3(0.045, 0.05, 0.06)*fl*(0.5 + 0.5*vnoise(vec2(az*20.0, y*0.3))); dist = s; } } }
  { float Lx = 150.0; float s = Lx/hl; if (s < dist){ float y = ro.y + rd.y*s;
      float top = GROUNDY + 18.0 + 10.0*vnoise(vec2(az*2.5 + 1.0, 0.0)) + 4.0*vnoise(vec2(az*12.0, 0.3));
      float edge = 1.2*vnoise(vec2(az*40.0, y*0.8));
      if (y < top - edge){ col = vec3(0.0025, 0.003, 0.004) + vec3(0.06, 0.075, 0.05)*fl*(0.4 + 0.6*vnoise(vec2(az*30.0, y*1.0))); dist = s; } } }
  { float Lx = 60.0; float s = Lx/hl; if (s < dist){ float y = ro.y + rd.y*s;
      float gap = ss(0.3, 0.4, vnoise(vec2(az*1.1 + 5.0, 0.0)));
      float top = GROUNDY + 12.0 + 7.0*vnoise(vec2(az*4.0 + 1.0, 0.0)) + 2.5*vnoise(vec2(az*19.0, 0.3));
      top = mix(GROUNDY - 1.0, top, gap);
      float edge = 0.8*vnoise(vec2(az*40.0, y*1.5));
      if (y < top - edge){ col = vec3(0.002, 0.0028, 0.002) + vec3(0.07, 0.09, 0.05)*fl*(0.4 + 0.6*vnoise(vec2(az*30.0, y*2.0))); dist = s; } } }
  // figure outside (only within its bounding sphere)
  if (uFigOut.w > 0.5){
    vec3 fc = uFigOut.xyz + vec3(0.0, 1.0, 0.0);
    vec3 oc = ro - fc; float bq = dot(oc, rd); float cq = dot(oc, oc) - 1.21;
    float disc = bq*bq - cq;
    if (disc > 0.0){
      float t0 = -bq - sqrt(disc);
      if (t0 > 0.0 && t0 < dist){
        float t = t0;
        for (int i = 0; i < FIG_N; i++){
          vec3 p = ro + rd*t - uFigOut.xyz;
          float h = sdFigure(p, 1.0);
          if (h < 0.004*(1.0 + t*0.05)){ dist = t;
            vec3 p2 = ro + rd*t - uFigOut.xyz;
            float face = step(1.58, p2.y) * step(p2.z, 0.02);
            col = mix(vec3(0.004, 0.004, 0.006), vec3(0.3, 0.26, 0.24)*(amb*6.0 + fl*1.6), face);
            break; }
          t += h;
          if (t > t0 + 2.4) break;
        }
      }
    }
  }
  // rain haze and streaks
  vec3 fogC = vec3(0.003, 0.0035, 0.005) + vec3(0.1, 0.11, 0.13)*fl;
  if (dist < 2500.0) col = mix(col, fogC, 1.0 - exp(-dist*0.0016));
  float st = streaks(az, el, uRain);
  col += st * (vec3(0.5, 0.55, 0.65)*(0.003 + fl*0.18) + vec3(0.3, 0.14, 0.05)*uEmber*0.025);
  return col;
}

// ---------- materials ----------
vec3 woodGrain(vec2 q, vec3 base){
  float g = vnoise(vec2(q.x*2.5, q.y*40.0)) * 0.6 + vnoise(vec2(q.x*9.0, q.y*90.0)) * 0.4;
  return base * (0.75 + 0.5*g);
}
vec3 stoneWall(vec2 w, vec3 p){
  float row = floor(w.y/0.34);
  float stag = mod(row, 2.0)*0.36;
  float colI = floor((w.x + stag)/0.72);
  float h = hash1(vec2(row, colI));
  float mortar = ss(0.0, 0.025, abs(fract(w.y/0.34) - 0.5)*0.34 - 0.014) * ss(0.0, 0.025, abs(fract((w.x + stag)/0.72) - 0.5)*0.72 - 0.014);
  vec3 a = vec3(0.16, 0.15, 0.13) * (0.7 + 0.6*h) * (0.8 + 0.4*vnoise(w*7.0));
  a = mix(vec3(0.07, 0.065, 0.06), a, mortar);
  a *= 0.55 + 0.45*ss(-0.2, 1.4, w.y); // damp near the floor
  return a;
}
vec3 albedoShell(vec3 p, vec3 n, inout float spec, inout float gloss){
  spec = 0.0; gloss = 0.0;
  if (n.y > 0.9 && p.y < 0.2){ // floor: wide planks
    vec2 q = p.xz;
    float row = floor(q.y/0.24);
    float stag = mod(row, 3.0)*0.7;
    float col = floor((q.x + stag)/1.8);
    float h = hash1(vec2(row, col));
    vec3 base = mix(vec3(0.15, 0.09, 0.05), vec3(0.085, 0.05, 0.03), h);
    vec3 a = woodGrain(vec2(q.x + h*7.0, q.y + h*3.0), base);
    float seam = ss(0.0, 0.008, abs(fract(q.y/0.24) - 0.5)*0.24 - 0.006) * ss(0.0, 0.008, abs(fract((q.x + stag)/1.8) - 0.5)*1.8 - 0.005);
    a *= 0.5 + 0.5*seam;
    vec2 rq = (q - vec2(0.35, 0.4)) / vec2(2.3, 1.55);
    float rr = length(rq);
    if (rr < 1.0){
      float border = ss(0.86, 0.9, rr);
      float pat = ss(0.45, 0.55, 0.5 + 0.5*sin(q.x*14.0)*sin(q.y*14.0));
      vec3 rugc = mix(vec3(0.2, 0.03, 0.03), vec3(0.26, 0.11, 0.05), pat*0.5);
      rugc = mix(rugc, vec3(0.1, 0.07, 0.03), border);
      a = rugc; spec = 0.0; gloss = 0.0;
    } else { spec = 0.3; gloss = 60.0; }
    return a;
  }
  if (n.y < -0.9){ // ceiling: beams over plaster
    float beam = step(fract(p.x/0.95 + 0.1), 0.24);
    return mix(vec3(0.13, 0.12, 0.1), woodGrain(vec2(p.z, p.x), vec3(0.07, 0.045, 0.03)), beam);
  }
  if (p.z < -2.96 && abs(p.x) < 1.4 && p.y > 0.6){ // embrasure
    return vec3(0.13, 0.125, 0.115) * (0.8 + 0.3*vnoise(p.xy*6.0 + p.z*3.1));
  }
  if (p.x < -3.55 && abs(p.z - 1.0) < 0.7 && p.y < 1.2){ return vec3(0.05, 0.045, 0.04); } // sooty firebox
  vec2 w = abs(n.x) > 0.5 ? vec2(p.z, p.y) : vec2(p.x, p.y);
  // tapestry on the back wall
  if (n.z < -0.5 && p.z > 4.9 && abs(p.x - 0.6) < 1.25 && p.y > 1.1 && p.y < 3.95){
    vec2 t = vec2(p.x - 0.6, p.y - 2.5);
    float loz = abs(fract(t.x/0.42 + t.y/0.42) - 0.5) + abs(fract(t.x/0.42 - t.y/0.42) - 0.5);
    float lat = ss(0.08, 0.04, abs(loz - 0.5));
    float border = ss(1.1, 1.2, abs(t.x)) + ss(1.3, 1.4, abs(t.y));
    vec3 a = mix(vec3(0.2, 0.05, 0.045), vec3(0.3, 0.22, 0.08), lat*0.7);
    a = mix(a, vec3(0.1, 0.09, 0.05), clamp(border, 0.0, 1.0));
    a *= 0.8 + 0.4*vnoise(t*40.0);
    return a;
  }
  vec3 a = stoneWall(w, p);
  if (p.y > 4.95) a = vec3(0.12, 0.11, 0.09); // top course
  return a;
}
vec3 albedo(vec3 p, vec3 n, float mat, inout float spec, inout float gloss, inout vec3 emis){
  emis = vec3(0.0); spec = 0.0; gloss = 0.0;
  if (mat < 1.5) return albedoShell(p, n, spec, gloss);
  if (mat < 2.5) return vec3(0.3, 0.28, 0.25) * (0.8 + 0.3*vnoise(p.xy*7.0 + p.z*3.3));
  if (mat < 3.5){ spec = 0.08; gloss = 4.0; return vec3(0.2, 0.025, 0.035) * (0.85 + 0.3*vnoise(p.xy*12.0 + p.z*5.0)); }
  if (mat < 4.5){ spec = 0.08; gloss = 10.0; return vec3(0.045, 0.055, 0.032) * (0.8 + 0.4*vnoise(p.xy*14.0 + p.z*6.0)); }
  if (mat < 5.5){ spec = 0.3; gloss = 24.0; return woodGrain(vec2(p.y, p.x + p.z), vec3(0.13, 0.075, 0.04)); }
  if (mat < 6.5){ spec = 0.6; gloss = 40.0; return vec3(0.1, 0.09, 0.08); }
  if (mat < 7.5){
    float gl = vnoise(p*30.0 + vec3(0.0, uTime*0.6, 0.0));
    float hot = ss(0.35, 0.8, gl);
    emis = mix(vec3(0.08, 0.01, 0.0), vec3(1.0, 0.32, 0.06), hot) * uEmber * uEmberF * 1.6;
    return vec3(0.03, 0.02, 0.02);
  }
  if (mat < 8.5){ // figure
    vec3 q = p - gFigPos; q.y /= uFig.w;
    float face = step(1.58, q.y) * step(q.z, 0.015) * step(q.y, 1.9);
    float hands = step(q.y, 0.95) * step(0.86, q.y) * step(0.18, abs(q.x));
    spec = 0.05; gloss = 3.0;
    vec3 skin = vec3(0.62, 0.52, 0.45);
    return mix(vec3(0.03, 0.028, 0.034), skin, max(face, hands));
  }
  if (mat < 9.5){ // clock face
    vec2 q = vec2(p.x - 2.7, p.y - 2.0);
    float r = length(q);
    float ang = atan(-q.x, q.y); // clockwise from 12, seen from the room
    float tick = ss(0.012, 0.004, abs(mod(ang + PI/12.0, PI/6.0) - PI/12.0)*r) * step(0.15, r) * step(r, 0.175);
    vec2 hdir = vec2(-sin(uClock.x), cos(uClock.x));
    vec2 mdir = vec2(-sin(uClock.y), cos(uClock.y));
    float hh = clamp(dot(q, hdir), 0.0, 0.11); float hd = length(q - hdir*hh);
    float mh = clamp(dot(q, mdir), 0.0, 0.165); float md = length(q - mdir*mh);
    float hands = max(ss(0.011, 0.006, hd), ss(0.007, 0.003, md));
    float ring = ss(0.004, 0.0, abs(r - 0.185) - 0.004);
    vec3 a = vec3(0.72, 0.66, 0.52) * (0.9 + 0.15*vnoise(q*40.0));
    a = mix(a, vec3(0.03), max(max(tick, hands), ring));
    spec = 0.1; gloss = 20.0;
    return a;
  }
  if (mat < 10.5){ spec = 0.4; gloss = 40.0; return vec3(0.12, 0.1, 0.1) * (0.7 + 0.6*ss(0.4, 0.6, vnoise(p.zy*5.0 + p.x*2.0))); }
  if (mat < 12.5){ // canvas: a dark painting with a faint pale shape
    vec2 q = vec2(p.z - 1.0, p.y - 2.5);
    float oval = ss(0.26, 0.05, length(q/vec2(0.18, 0.25) - vec2(0.0, 0.5)) - 0.6);
    return mix(vec3(0.05, 0.04, 0.03), vec3(0.16, 0.12, 0.09), oval*0.5) * (0.8 + 0.4*vnoise(q*25.0));
  }
  // plank door with iron bands
  { vec2 w = vec2(p.x + 2.6, p.y);
    float plank = ss(0.0, 0.01, abs(fract(w.x/0.14) - 0.5)*0.14 - 0.006);
    float band = step(abs(w.y - 0.6), 0.05) + step(abs(w.y - 1.7), 0.05);
    spec = 0.15; gloss = 16.0;
    vec3 a = woodGrain(vec2(w.y, w.x), vec3(0.09, 0.055, 0.03)) * (0.6 + 0.4*plank);
    return mix(a, vec3(0.06, 0.055, 0.05), clamp(band, 0.0, 1.0)); }
}

}

// ---- figure ----
function figSetPos(i){ fig.stage = i; fig.x = FIG_PATH[i][0]; fig.z = FIG_PATH[i][1]; fig.vis = 1; fig.hs = fig.hsBase*(1.0 + 0.28*i/(FIG_PATH.length - 1)); if (i === FIG_PATH.length - 1){ fig.x = cam.x; fig.z = cam.z + 0.55; } }
function figStep(fromFlash){
  if (fig.phase === 'wait'){
    if (T < fig.waitUntil) return;
    fig.phase = 'approach'; fig.hsBase = 0.98 + Math.random()*0.07; figSetPos(0);
    if (soundOn && Math.random() < 0.5) AUDIO.creak(fig.x, fig.z, 0.3);
    return;
  }
  if (fig.phase !== 'approach') return;
  const n = FIG_PATH.length, r = Math.random();
  let ns = fig.stage;
  if (r < 0.1) ns = fig.stage; else if (r < 0.2 && fig.stage + 2 < n) ns = fig.stage + 2; else ns = Math.min(n - 1, fig.stage + 1);
  if (ns !== fig.stage){ figSetPos(ns); if (soundOn) AUDIO.creak(fig.x, fig.z, ns/n); }
  if (fig.stage === n - 1) onBehind();
}
function onBehind(){
  fig.phase = 'behind'; fig.climaxT = T; dreadT = 1.0;
  if (soundOn){ AUDIO.breathStart(); AUDIO.muffleSet(0.55, 2.0); }
  clockStop();
  nextBreath.on = true; nextBreath.since = T;
  fig.forcedAt = T + 7 + Math.random()*7;
}
function onVanish(){
  fig.phase = 'gone'; fig.vis = 0; fig.goneAt = T; ember.target = 0.0; nextBreath.on = false;
  if (soundOn){ AUDIO.breathStop(); setTimeout(() => AUDIO.duckAll(1.6, 0.0), (storm.lastKm*2.9 + 0.1)*1000); }
}
function clockStop(){ if (clockStopped) return; clockStopped = true; stoppedAt = T; pendFrozen = pendAngle(); if (soundOn) AUDIO.clockSet(false); }
function clockStart(){ if (!clockStopped) return; clockStopped = false; stoppedTotal += T - stoppedAt; clockT0 = T + 0.6; if (soundOn) AUDIO.clockSet(true, AUDIO.now() + 0.6); }
function pendAngle(){
  if (clockStopped) return pendFrozen;
  const lat = (soundOn && AUDIO.isRunning()) ? AUDIO.latency() : 0;
  return 0.13*Math.cos(Math.PI*(T - clockT0 - lat));
}
function onAudioStarted(){ clockT0 = T + 0.6; if (!clockStopped) AUDIO.clockSet(true, AUDIO.now() + 0.6); AUDIO.setEmber(ember.v); if (fig.phase === 'behind') { AUDIO.breathStart(); AUDIO.muffleSet(0.55, 0.5); } }

// ---- eyes / tap ----
function onEyesClose(){}
function onEyesOpen(){}
function onTap(sx, sy){
  const uv = screenToGlass(sx, sy);
  if (!uv) return;
  knock.uv = uv; knock.t = 0;
  if (soundOn) AUDIO.knockIn();
  knock.times.push(T); knock.times = knock.times.filter(t => T - t < 4.5);
  if (knock.times.length >= 3 && knock.replyAt < 0 && T > knock.cooldownUntil && T > 30 && fig.phase !== 'gone'){
    knock.times = [];
    if (Math.random() < 0.7){ knock.replyAt = T + 2.5 + Math.random()*4; knock.fogUV = [uv[0], uv[1]]; }
    knock.cooldownUntil = T + 45;
  }
}

// ---- visibility ----
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ paused = true; hiddenAt = T; if (soundOn) AUDIO.setMuted(true); }
  else { paused = false; lastT = perfNow(); if (soundOn) AUDIO.setMuted(false); if (T - hiddenAt > 20 && fig.phase === 'approach' && Math.random() < 0.8) figStep(false); }
});

// ---- loop ----
const veil = document.getElementById('veil');
function frame(){
  requestAnimationFrame(frame);
  if (paused) return;
  const now = perfNow(); let dt = (now - lastT)/1000; lastT = now;
  if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
  T += dt;
  const tS = T/1000;

  // storm
  if (T > storm.next){
    const km = Math.max(0.45, Math.min(9, stormKm() + (Math.random() - 0.5)*2.4));
    const ev = newStrike(km, false);
    // cloud flashes come in clusters
    const cluster = ev.kind === 'ic' && Math.random() < 0.5;
    storm.next = T + (cluster ? 1.5 + Math.random()*4 : 5 + Math.random()*18 + km*1.2);
  }
  if (fig.phase === 'behind' && fig.forcedAt > 0 && T > fig.forcedAt){ fig.forcedAt = -1; newStrike(0.45 + Math.random()*0.25, true); storm.next = T + 25 + Math.random()*20; fig.phase = 'vanishing'; }
  evalFlash();
  storm.dazzle *= Math.exp(-dt/5.5);
  if (fig.phase === 'vanishing' && storm.flash > 0.5) onVanish();
  if (outFig.vis && storm.flash < 0.02 && T > storm.lastT0 + 0.6) outFig.vis = 0;

  // phases after the vanish
  if (fig.phase === 'gone' && T > fig.goneAt + 20){ fig.phase = 'relight'; ember.target = 1.0; dreadT = 0.15; if (soundOn) AUDIO.muffleSet(0.0, 3.0); }
  if (fig.phase === 'relight' && T > fig.goneAt + 27){ clockStart(); fig.phase = 'wait'; fig.waitUntil = T + 30 + Math.random()*40; fig.cycle++; dreadT = 0; }

  // unobserved intervals → the figure moves
  const away = Math.abs(wrapA(cam.yaw)) > 1.15;
  const byFlash = storm.flashIn > 0.22;
  const unobs = byFlash || eyes.v > 0.8 || away;
  if (unobs && !fig.unobs){ fig.unobs = true; fig.unobsSince = T; fig.stepped = false; }
  if (!unobs && fig.unobs) fig.unobs = false;
  if (fig.unobs && !fig.stepped && (byFlash || T - fig.unobsSince > 0.8)){ fig.stepped = true; figStep(byFlash); }

  // knock reply
  if (knock.replyAt > 0 && T > knock.replyAt){
    knock.replyAt = -1;
    if (soundOn) AUDIO.knockOut(2 + (Math.random() < 0.4 ? 1 : 0), 0.05, Math.max(-1, Math.min(1, (knock.fogUV[0] - cam.x)*0.6)));
    knock.fogUntil = T + 17;
  }
  knock.t += dt;

  // embers
  ember.v += (ember.target - ember.v)*(1 - Math.exp(-dt/(ember.target > ember.v ? 4.0 : 0.6)));
  if (T > ember.nextF){ ember.ft = 0.78 + Math.random()*0.5; ember.nextF = T + 0.07 + Math.random()*0.25; }
  ember.f += (ember.ft - ember.f)*(1 - Math.exp(-dt/0.07));
  ember.drift = 0.9 + 0.1*Math.sin(T*0.37) + 0.05*Math.sin(T*0.11 + 2.0);
  const emberOut = ember.v*ember.drift;

  // dread
  const stageD = fig.phase === 'approach' ? 0.08 + 0.5*fig.stage/FIG_PATH.length : (fig.phase === 'behind' || fig.phase === 'vanishing') ? 1.0 : 0;
  dread += ((Math.max(stageD, dreadT)) - dread)*(1 - Math.exp(-dt/3.0));

  // eyes
  eyes.v += (eyesTarget - eyes.v)*(1 - Math.exp(-dt/(eyesTarget > eyes.v ? 0.22 : 0.16)));

  // breath fog
  const bp = (T % 4.4)/4.4;
  const ownAmt = 0.75*(bp < 0.3 ? 0 : bp < 0.5 ? (bp - 0.3)/0.2 : Math.max(0, 1 - (bp - 0.5)/0.45));
  let nextAmt = 0;
  if (nextBreath.on){ const np = ((T - nextBreath.since) % 3.1)/3.1; nextAmt = (np < 0.35 ? 0 : np < 0.52 ? (np - 0.35)/0.17 : Math.max(0, 1 - (np - 0.52)/0.42)) * Math.min(1, (T - nextBreath.since)/3); }
  breathNextAmt += (nextAmt - breathNextAmt)*(1 - Math.exp(-dt/0.25));
  let outAmt = 0;
  if (knock.fogUntil > T){ const op = (T % 3.6)/3.6; outAmt = (op < 0.3 ? 0 : op < 0.5 ? (op - 0.3)/0.2 : Math.max(0, 1 - (op - 0.5)/0.45)) * Math.min(1, (knock.fogUntil - T)/3) * 0.9; }

  // idle glance (not when the gyro drives the view)
  if (!gyro.on && (now - lastInput) > 25000 && tS*1000 > idle.next && !idle.active && fig.phase !== 'behind'){
    idle.active = true; idle.t0 = T; idle.from = cam.tYaw; idle.to = cam.tYaw + (Math.random() < 0.5 ? 1 : -1)*(1.0 + Math.random()*1.9); idle.next = tS*1000 + 50 + Math.random()*60;
  }
  if (idle.active){
    const u = T - idle.t0;
    let k = u < 6 ? smooth(0, 6, u) : u < 10 ? 1 : u < 16 ? 1 - smooth(10, 16, u) : 0;
    cam.tYaw = idle.from + (idle.to - idle.from)*k;
    if (u > 16){ idle.active = false; }
  }

  // camera: the viewer leans toward the glass as the figure approaches
  const leanT = fig.phase === 'approach' ? fig.stage/(FIG_PATH.length - 1) : (fig.phase === 'behind' || fig.phase === 'vanishing') ? 1.0 : 0.0;
  const zGoal = -2.0 - 0.7*leanT;
  cam.z += (zGoal - cam.z)*(1 - Math.exp(-dt/(leanT > 0 ? 25.0 : 6.0)));
  if (fig.phase === 'behind' || fig.phase === 'vanishing'){ fig.x = cam.x; fig.z = cam.z + 0.55; }
  if (gyro.on && gyro.has){ cam.tYaw = gyro.yaw + gyro.offYaw; cam.tPitch = Math.max(-0.6, Math.min(0.7, gyro.pitch + gyro.offPitch)); }
  else {
    cam.tYaw += cam.vYaw*dt; cam.tPitch += cam.vPitch*dt;
    const dmp = Math.exp(-dt*2.2); cam.vYaw *= dmp; cam.vPitch *= dmp;
    cam.tPitch = Math.max(-0.55, Math.min(0.6, cam.tPitch));
    if (cam.tPitch === -0.55 || cam.tPitch === 0.6) cam.vPitch = 0;
  }
  // thunder shake: a jolt and a fading tremor
  let shY = 0, shP = 0;
  for (const s of storm.shakes){
    const u = T - s[0]; if (u < 0 || u > s[2]*3) continue;
    const a = s[1]*(u < 0.03 ? u/0.03 : Math.exp(-(u - 0.03)/(s[2]*0.45)));
    shY += a*(0.6*Math.sin(u*41 + s[3]) + 0.4*Math.sin(u*23 + s[3]*1.7));
    shP += a*(0.6*Math.sin(u*37 + s[3]*0.3) + 0.4*Math.sin(u*17 + s[3]*2.3) - 0.3*Math.exp(-u*6.0));
  }
  cam.yaw += (cam.tYaw - cam.yaw)*(1 - Math.exp(-dt/0.13));
  cam.pitch += (cam.tPitch - cam.pitch)*(1 - Math.exp(-dt/0.13));
  cam.fov += (cam.tFov - cam.fov)*(1 - Math.exp(-dt/0.25));
  const swayP = RM ? 0 : 0.004*Math.sin(T*2*Math.PI/4.4) + 0.002*Math.sin(T*0.53);
  const swayY = RM ? 0 : 0.0025*Math.sin(T*0.41 + 1.0);

  // audio
  if (soundOn){ AUDIO.update(dt, cam.x, cam.z, cam.yaw); AUDIO.setEmber(emberOut); AUDIO.setDread(dread); }

  // clock
  const d = new Date(); const secs = d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds() + d.getMilliseconds()/1000 - stoppedTotal - (clockStopped ? (T - stoppedAt) : 0);
  const hourA = ((secs/3600) % 12)/12*2*Math.PI, minA = ((secs/60) % 60)/60*2*Math.PI;

  // draw (lite at 30 fps, full at 60 fps)
  const P = glLost ? null : activeProgram();
  if (!P) return;
  const capMs = P.isLite ? 1000/30 : 1000/60;
  if (FRAME_CAP && now - lastDraw < capMs - 4) return;
  const drawGap = now - lastDraw; lastDraw = now;
  resize();
  gl.uniform2f(U.uRes, W, H);
  gl.uniform1f(U.uTime, T % 600);
  gl.uniform1f(U.uRain, (RM ? T*0.5 : T) % 1000);
  gl.uniform3f(U.uCamPos, cam.x, cam.y, cam.z);
  gl.uniform2f(U.uCamRot, cam.yaw + swayY + shY, cam.pitch + swayP + shP);
  gl.uniform1f(U.uFov, cam.fov);
  gl.uniform1f(U.uFlash, storm.flash);
  gl.uniform1f(U.uFlashIn, storm.flashIn);
  gl.uniform3f(U.uFlashDir, storm.dir[0], storm.dir[1], storm.dir[2]);
  gl.uniform1f(U.uFlashDirI, storm.dirI);
  gl.uniform4f(U.uF0, storm.F[0][0], storm.F[0][1], storm.F[0][2], storm.F[0][3]);
  gl.uniform4f(U.uF1, storm.F[1][0], storm.F[1][1], storm.F[1][2], storm.F[1][3]);
  gl.uniform4f(U.uF2, storm.F[2][0], storm.F[2][1], storm.F[2][2], storm.F[2][3]);
  gl.uniform3f(U.uFK, storm.K[0], storm.K[1], storm.K[2]);
  gl.uniform1f(U.uBolt, storm.bolt);
  gl.uniform4f(U.uBoltP, storm.boltP[0], storm.boltP[1], storm.boltP[2], storm.boltP[3]);
  gl.uniform3f(U.uBoltQ, storm.boltQ[0], storm.boltQ[1], storm.boltQ[2]);
  gl.uniform1f(U.uExpo, 1.0 - 0.92*storm.dazzle);
  gl.uniform1f(U.uEmber, emberOut);
  gl.uniform1f(U.uEmberF, ember.f);
  gl.uniform4f(U.uFig, fig.x, fig.z, fig.vis, fig.hs);
  gl.uniform4f(U.uFigOut, outFig.x, -4.0, outFig.z, outFig.vis);
  gl.uniform1f(U.uEyes, eyes.v);
  gl.uniform3f(U.uFogOwn, 0.45, 1.5, ownAmt);
  gl.uniform3f(U.uFogNext, -0.6, 1.58, breathNextAmt);
  gl.uniform3f(U.uFogOut, knock.fogUV[0], knock.fogUV[1], outAmt);
  gl.uniform3f(U.uClock, hourA, minA, pendAngle());
  gl.uniform3f(U.uKnock, knock.uv[0], knock.uv[1], knock.t);
  gl.uniform1f(U.uDread, dread);
  gl.uniform1f(U.uMuffle, muffle);
  gl.uniform1f(U.uLite, lite ? 1 : 0);
  gl.uniform1f(U.uRM, RM ? 1 : 0);
  gl.uniform1f(U.uSteps, P.isLite ? 52 : 84);
  gl.uniform1f(U.uSteps2, P.isLite ? 30 : 40);
  gl.uniform1f(U.uDbg, DBG);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // dynamic resolution, judged by the gap between draws against the cap
  if (drawGap < 500){ ftAcc += drawGap; frames++; }
  if (frames >= 24 && !RS_FIXED){
    const avg = ftAcc/frames; ftAcc = 0; frames = 0;
    if (avg > capMs*1.3){ fastRuns = 0; rs *= avg > capMs*2 ? 0.75 : 0.87; resize(); }
    else if (avg < capMs*1.1){ if (++fastRuns >= 2 && rs < rsMax){ fastRuns = 0; rs = Math.min(rsMax, rs*1.07); resize(); } }
    else fastRuns = 0;
  }
  if (veil && veil.style.opacity !== '0'){ veil.style.opacity = '0'; }
}
resize(); showUI();
requestAnimationFrame(frame);
})();

</script>
</body>
