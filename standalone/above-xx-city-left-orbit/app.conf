description = "巨大な何かが暴れる夜の市街地の上を、左へ回りつづける対地攻撃機。その赤外線センサーの映像を、ブラウン管の表示器ごしに見る。白黒の温度の絵の中で、105mm・40mm・25mmの砲を撃ち、何かから落ちて街を走り回る小さなものを、先を読みながら掃いていく。乗員の声は英語で、ずっと冷静。約8分で何かは倒れ、そのあと巨大な鳥が集まってくる。「〇〇県✕✕市 上空」と同じ戦いを、2.4km上から見ている。声も砲声も、その場で合成。"
