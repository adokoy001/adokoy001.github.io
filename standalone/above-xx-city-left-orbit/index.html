}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#ui.idle{opacity:.12}
#ui button{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%;cursor:pointer;

  const j=.0003*rm,kx=GS.kick*rm,ax=S.yawU+(nz(t*1.3)-.5)*j*3+(nz(t*31)-.5)*j+(nz(t*43+3)-.5)*.004*kx,ay=S.pitU+(nz(t*1.1+7)-.5)*j*3+(nz(t*37+5)-.5)*j+(nz(t*47+1)-.5)*.004*kx;

  requestAnimationFrame(loop);

  const dt=Math.min(.1,(now-last)/1000),gap=now-last;last=now;
  tick(dt);draw(dt);
  /* 重いとき：まず、温度の絵（1段め）を描くのを、2こまに1回にする（half）。画面へ出す2段めは毎こま描くので、ざらつきやちらつきは止まらない。
     映像そのものは1秒に30こまになる（ブラウン管のテレビの映像と同じくらい）。それでも重ければ、絵を粗くしていく。軽量モードは、もともと1秒に30こま */
  if(lite)half=false;
  if(half){if(frame%2===1)slow=slow*.92+(gap+gap0>58?1:0)*.08}else slow=slow*.96+(gap>(lite?52:40)?1:0)*.04;
  gap0=gap;
