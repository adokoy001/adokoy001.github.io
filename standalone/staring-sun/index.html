<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>見返す太陽</title>
<meta name="description" content="黒点がこちらを見返してくる、不気味な3Dの太陽。">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: gallery mode. Full-bleed WebGL star in a black void, no text.
   Two icon controls bottom-right that fade out when idle. Single dark world by design. */
:root{
  --void:#030201;
  --ember:#c9562b;
  --bone:#efe5da;
  --ash:#b7aba1;
  --scrim:rgba(3,2,1,.5);
  --line:rgba(183,171,161,.26);
  --glow:rgba(201,86,43,.45);
  --glow-0:rgba(201,86,43,0);
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--void);color:var(--ash);overflow:hidden;
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
#sun{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#sun.dragging{cursor:grabbing}
body.idle #sun{cursor:none}

.dock{
  position:fixed;
  right:max(16px, env(safe-area-inset-right, 0px));
  bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  display:flex;gap:10px;
  transition:opacity 1s ease;
}
body.idle .dock{opacity:0;pointer-events:none}
.icon{
  appearance:none;width:44px;height:44px;padding:0;
  display:grid;place-items:center;border-radius:50%;
  background:var(--scrim);border:1px solid var(--line);color:var(--ash);
  cursor:pointer;transition:color .2s,border-color .2s;
}
.icon:hover{color:var(--bone);border-color:var(--ember)}
#lite[aria-pressed="true"]{color:var(--bone);border-color:var(--ember)}
.icon:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.icon.pending{color:var(--ember);border-color:var(--ember);animation:ember 2.8s ease-in-out infinite}
@keyframes ember{0%,100%{box-shadow:0 0 0 0 var(--glow-0)}50%{box-shadow:0 0 18px 2px var(--glow)}}

.fallback{position:fixed;inset:0;display:grid;place-items:center;padding-inline:max(16px, env(safe-area-inset-left, 0px));color:var(--ash);font-size:14px;letter-spacing:.08em;text-align:center}

@media (prefers-reduced-motion:reduce){
  .dock,.icon{transition:none}
  .icon.pending{animation:none}
}
</style>
</head>
<body>
<canvas id="sun" tabindex="0" aria-label="太陽のアート。ドラッグで回転、ホイールやピンチで接近。Fキーで全画面、Mキーで音の切り替え。"></canvas>

<div class="dock" id="dock">
  <button type="button" class="icon" id="lite" aria-label="軽量モードにする" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 4C13 4 8 8.5 7 15l-2 5"/><path d="M20 4c0 7-4.5 11-12.4 11.2"/><path d="M10.5 11.5h5.5"/>
    </svg>
  </button>
  <button type="button" class="icon pending" id="sound" aria-label="BGMを鳴らす" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
      <g id="waves" hidden><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18 6.8a7.5 7.5 0 0 1 0 10.4"/></g>
      <g id="mute"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g>
    </svg>
  </button>
  <button type="button" class="icon" id="full" aria-label="全画面にする" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <g id="fsIn"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></g>
      <g id="fsOut" hidden><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></g>
    </svg>
  </button>
</div>

<p class="fallback" id="fallback" hidden>この環境ではWebGLが使えないため、太陽を描画できません。</p>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('sun');
  const dock = document.getElementById('dock');
  const soundBtn = document.getElementById('sound');
  const fullBtn = document.getElementById('full');
  const fallback = document.getElementById('fallback');
  const wavesG = document.getElementById('waves'), muteG = document.getElementById('mute');
  const fsInG = document.getElementById('fsIn'), fsOutG = document.getElementById('fsOut');
  const liteBtn = document.getElementById('lite');

  const reduce = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };

  /* =========================================================
     BGM: generative, oppressive drone engine (all synthesized)
     ========================================================= */
  function createEngine(lite) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    let ctx;
    try { ctx = new AC({ latencyHint: lite ? 'playback' : 'balanced' }); } catch (e) { ctx = new AC(); }
    const sr = ctx.sampleRate;
    // slow modulation only needs one value per 128-sample block; this keeps filters from recomputing every sample
    const kr = (p) => { try { if ('automationRate' in p) p.automationRate = 'k-rate'; } catch (e) {} return p; };
    const disposer = (list) => () => { list.forEach((n) => { try { n.disconnect(); } catch (e) {} }); };

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 14; comp.ratio.value = 4; comp.attack.value = 0.03; comp.release.value = 0.5;
    comp.connect(ctx.destination);
    const master = ctx.createGain(); master.gain.value = 0; master.connect(comp);

    const gainN = (v) => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const osc = (type, f) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; return o; };
    const filt = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; kr(b.frequency); kr(b.Q); return b; };
    const lfo = (rate, depth, param, aRate) => { if (!aRate) kr(param); const o = osc('sine', rate); const g = gainN(depth); o.connect(g); g.connect(param); o.start(); };

    // reverb from a generated impulse response (short and mono in light mode)
    const irLen = lite ? 1.8 : 5.5, irCh = lite ? 1 : 2, irPow = lite ? 3.0 : 2.4;
    const ir = ctx.createBuffer(irCh, Math.floor(sr * irLen), sr);
    for (let ch = 0; ch < irCh; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < d.length; i++) {
        const x = i / d.length;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - x, irPow) * Math.min(1, i / (sr * 0.04));
      }
    }
    const verb = ctx.createConvolver(); verb.buffer = ir;
    const wet = gainN(lite ? 0.7 : 0.55); verb.connect(wet); wet.connect(master);
    const dry = gainN(1); dry.connect(master);
    const duckDry = gainN(1), duckWet = gainN(1);
    duckDry.connect(dry); duckWet.connect(verb);
    function route(node, d, w, bed) {
      const made = [];
      if (d) { const g = gainN(d); node.connect(g); g.connect(bed ? duckDry : dry); made.push(g); }
      if (w) { const g = gainN(w); node.connect(g); g.connect(bed ? duckWet : verb); made.push(g); }
      return made;
    }

    // long ping-pong echo for the bells (the warble is skipped in light mode)
    const echoIn = gainN(1);
    const dl1 = ctx.createDelay(4), dl2 = ctx.createDelay(4);
    dl1.delayTime.value = 0.73; dl2.delayTime.value = 1.13;
    const fb1 = gainN(0.52), fb2 = gainN(0.5);
    const elp1 = filt('lowpass', 1700, 0.4), elp2 = filt('lowpass', 1300, 0.4);
    echoIn.connect(dl1);
    dl1.connect(elp1); elp1.connect(fb1); fb1.connect(dl2);
    dl2.connect(elp2); elp2.connect(fb2); fb2.connect(dl1);
    if (!lite) { lfo(0.11, 0.006, dl1.delayTime, true); lfo(0.07, 0.008, dl2.delayTime, true); }
    const mkPan = (v) => { if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = v; return p; } return gainN(1); };
    const pan1 = mkPan(-0.7), pan2 = mkPan(0.7);
    elp1.connect(pan1); elp2.connect(pan2);
    const echoOut = gainN(0.9); pan1.connect(echoOut); pan2.connect(echoOut);
    route(echoOut, 0.6, 0.75, false);

    // noise buffers
    const brown = ctx.createBuffer(1, sr * 6, sr);
    { const d = brown.getChannelData(0); let l = 0; for (let i = 0; i < d.length; i++) { l = (l + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = l * 3.5; } }
    const white = ctx.createBuffer(1, sr * 3, sr);
    { const d = white.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const loopSrc = (buf, off) => { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(0, off || 0); return s; };

    // 1. sub drone + growling resonant saw (D1)
    const sub = gainN(0.3);
    [36.71, 36.93].forEach((f) => { const o = osc('sine', f); o.connect(sub); o.start(); });
    const growl = osc('sawtooth', 36.71);
    const growlLP = filt('lowpass', 95, 7);
    const growlG = gainN(0.16);
    growl.connect(growlLP); growlLP.connect(growlG); growlG.connect(sub); growl.start();
    lfo(0.031, 45, growlLP.frequency);
    if (!lite) lfo(0.017, 9, growl.detune);
    const oct = osc('triangle', 73.42); const octG = gainN(0.07);
    oct.connect(octG); octG.connect(sub); oct.start(); lfo(0.023, 0.05, octG.gain);
    route(sub, 1.0, 0.25, true);

    // 2. dissonant cluster pad (4 single voices in light mode, 6 detuned pairs otherwise)
    const padLP = filt('lowpass', 420, 1.2); lfo(0.019, 220, padLP.frequency);
    const VOICES = [[73.42, 0.05, 0.021], [77.78, 0.04, 0.013], [103.83, 0.035, 0.029], [146.83, 0.025, 0.017], [155.56, 0.018, 0.011], [311.13, 0.008, 0.037]];
    (lite ? VOICES.slice(0, 4) : VOICES).forEach(([f, base, rate]) => {
      const amp = lite ? base * 1.5 : base;
      const vg = gainN(amp); lfo(rate, amp * 0.95, vg.gain);
      (lite ? [0] : [-5, 5]).forEach((c) => { const o = osc('sawtooth', f); o.detune.value = c; o.connect(vg); o.start(); });
      vg.connect(padLP);
    });
    const padOut = gainN(0.55); padLP.connect(padOut);
    route(padOut, 0.45, 0.9, true);

    // 3. endless descending Shepard tone
    const SN = lite ? 5 : 7, SBASE = lite ? 55 : 28;
    const shep = []; const shepBus = gainN(0.05);
    for (let k = 0; k < SN; k++) {
      const o = osc('sine', 100); kr(o.frequency);
      const g = gainN(0); kr(g.gain);
      o.connect(g); g.connect(shepBus); o.start(); shep.push({ o, g, f: 100 });
    }
    route(shepBus, 0.25, 1.0, true);
    let shepPhase = 0, shepLast = ctx.currentTime;
    function shepard() {
      const now = ctx.currentTime;
      shepPhase -= (now - shepLast) / 45; shepLast = now;
      const ph = ((shepPhase % 1) + 1) % 1;
      for (let k = 0; k < SN; k++) {
        const lp = (k + ph) / SN;
        const f = SBASE * Math.pow(2, SN * lp);
        const a = Math.exp(-Math.pow((lp - 0.48) / 0.17, 2));
        const v = shep[k];
        v.o.frequency.cancelScheduledValues(now); v.g.gain.cancelScheduledValues(now);
        if (f > v.f * 1.5) v.o.frequency.setValueAtTime(f, now); else v.o.frequency.setTargetAtTime(f, now, 0.08);
        v.f = f;
        v.g.gain.setTargetAtTime(a, now, 0.1);
      }
    }

    // 4. breathing noise, whisper (normal mode only), rumble bed
    const breathBP = filt('bandpass', 380, 1.4); lfo(0.043, 180, breathBP.frequency);
    const breathG = gainN(0.35); lfo(0.061, 0.3, breathG.gain);
    loopSrc(brown).connect(breathBP); breathBP.connect(breathG); route(breathG, 0.5, 0.7, true);
    if (!lite) {
      const hissBP = filt('bandpass', 1650, 9); lfo(0.07, 420, hissBP.frequency);
      const hissG = gainN(0.012); lfo(0.029, 0.01, hissG.gain);
      loopSrc(white).connect(hissBP); hissBP.connect(hissG); route(hissG, 0.3, 1.0, true);
    }
    const rumbleLP = filt('lowpass', 120, 0.7); const rumbleG = gainN(0.5);
    loopSrc(brown, 2.3).connect(rumbleLP); rumbleLP.connect(rumbleG); route(rumbleG, 1.0, 0.3, true);

    // 5. heartbeat
    const hbLP = filt('lowpass', 160, 0.8); route(hbLP, 1.0, 0.2, false);
    function thump(time, amp) {
      const o = osc('sine', 64);
      o.frequency.setValueAtTime(64, time); o.frequency.exponentialRampToValueAtTime(34, time + 0.2);
      const g = gainN(0);
      g.gain.setValueAtTime(0.0001, time); g.gain.exponentialRampToValueAtTime(amp, time + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, time + 0.42);
      o.connect(g); g.connect(hbLP); o.start(time); o.stop(time + 0.5);
      o.onended = disposer([o, g]);
    }

    // 6. bells: inharmonic partials (hum, prime, minor-third tierce, quint, nominal...), sagging pitch
    const BELL = [[0.5, 0.9, 10], [1.0, 0.75, 7], [1.183, 0.6, 5.5], [1.506, 0.35, 4.2], [2.0, 0.55, 4.8],
                  [2.514, 0.28, 3.2], [2.662, 0.22, 3.0], [3.011, 0.2, 2.4], [4.166, 0.12, 1.7], [5.433, 0.07, 1.2]];
    const BELL_LITE = [BELL[0], BELL[1], BELL[2], BELL[3], BELL[4], BELL[6]];
    const bellLP = filt('lowpass', 2800, 0.5);
    route(bellLP, 0.35, 1.25, false);
    const bellEcho = gainN(0.85); bellLP.connect(bellEcho); bellEcho.connect(echoIn);
    function strike(time, f, amp, bend) {
      const nodes = [];
      const b = gainN(amp); b.connect(bellLP); nodes.push(b);
      let last = null, lastEnd = 0;
      (lite ? BELL_LITE : BELL).forEach(([r, a, dec], i) => {
        const end = time + dec * 1.5;
        const mk = (fr, aa) => {
          const o = osc('sine', fr); kr(o.detune);
          o.detune.setValueAtTime(0, time); o.detune.linearRampToValueAtTime(-bend, end);
          const g = gainN(0);
          g.gain.setValueAtTime(0.0001, time); g.gain.exponentialRampToValueAtTime(aa, time + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, end);
          o.connect(g); g.connect(b); o.start(time); o.stop(end + 0.05);
          nodes.push(o, g);
          if (end > lastEnd) { lastEnd = end; last = o; }
        };
        mk(f * r * (1 + (Math.random() - 0.5) * 0.002), a);
        if (!lite && i < 4) mk(f * r + 0.45 + i * 0.2, a * 0.5);
      });
      const n = ctx.createBufferSource(); n.buffer = white; n.loop = true;
      const bp = filt('bandpass', f * 4.2, 3); const g = gainN(0);
      g.gain.setValueAtTime(0.0001, time); g.gain.exponentialRampToValueAtTime(0.25, time + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, time + 0.12);
      n.connect(bp); bp.connect(g); g.connect(b); n.start(time, Math.random()); n.stop(time + 0.15);
      n.onended = disposer([n, bp, g]);
      if (last) last.onended = disposer(nodes);
    }
    function toll(time) {
      const notes = [146.83, 138.59, 103.83, 155.56, 116.54];
      const f = notes[Math.floor(Math.random() * notes.length)];
      const count = 3 + Math.floor(Math.random() * 3);
      for (let k = 0; k < count; k++) {
        const sour = k === count - 1 && Math.random() < 0.4;
        strike(time + k * 4.4 + Math.random() * 0.15, sour ? f * 0.944 : f, 0.34 - k * 0.03, 25);
      }
      return count * 4.4;
    }

    // 7. boom (flare)
    function boom(time, amp) {
      const n = ctx.createBufferSource(); n.buffer = brown; n.loop = true;
      const lp = filt('lowpass', 400, 0.9);
      lp.frequency.setValueAtTime(420, time); lp.frequency.exponentialRampToValueAtTime(55, time + 3);
      const g = gainN(0);
      g.gain.setValueAtTime(0.0001, time); g.gain.exponentialRampToValueAtTime(2.2 * amp, time + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, time + 5);
      n.connect(lp); lp.connect(g);
      n.onended = disposer([n, lp, g, ...route(g, 0.8, 0.8, false)]);
      n.start(time, Math.random() * 3); n.stop(time + 5.5);
      const o = osc('sine', 52);
      o.frequency.setValueAtTime(52, time); o.frequency.exponentialRampToValueAtTime(26, time + 2.5);
      const og = gainN(0);
      og.gain.setValueAtTime(0.0001, time); og.gain.exponentialRampToValueAtTime(0.6 * amp, time + 0.03); og.gain.exponentialRampToValueAtTime(0.0001, time + 3);
      o.connect(og);
      o.onended = disposer([o, og, ...route(og, 1.0, 0.3, false)]);
      o.start(time); o.stop(time + 3.2);
      rumbleG.gain.setTargetAtTime(0.5 + 1.1 * amp, time, 0.3);
      rumbleG.gain.setTargetAtTime(0.5, time + 1.5, 2.5);
    }

    // 8. feeding: a rising drag while the prey is reeled in, then a swallow and a toll
    function reel(time, dur) {
      const n = ctx.createBufferSource(); n.buffer = brown; n.loop = true;
      const bp = filt('bandpass', 70, 6);
      bp.frequency.setValueAtTime(70, time); bp.frequency.exponentialRampToValueAtTime(170, time + dur);
      const g = gainN(0);
      g.gain.setValueAtTime(0.0001, time); g.gain.exponentialRampToValueAtTime(1.4, time + dur); g.gain.exponentialRampToValueAtTime(0.0001, time + dur + 0.4);
      n.connect(bp); bp.connect(g);
      n.onended = disposer([n, bp, g, ...route(g, 0.8, 0.6, false)]);
      n.start(time, Math.random() * 3); n.stop(time + dur + 0.5);
    }
    function devour(time) {
      const o = osc('sawtooth', 70);
      o.frequency.setValueAtTime(70, time); o.frequency.exponentialRampToValueAtTime(30, time + 2.2);
      const lp = filt('lowpass', 420, 8);
      lp.frequency.setValueAtTime(420, time); lp.frequency.exponentialRampToValueAtTime(70, time + 2.0);
      const g = gainN(0);
      g.gain.setValueAtTime(0.0001, time); g.gain.exponentialRampToValueAtTime(0.5, time + 0.15); g.gain.exponentialRampToValueAtTime(0.0001, time + 2.6);
      o.connect(lp); lp.connect(g);
      o.onended = disposer([o, lp, g, ...route(g, 0.9, 0.6, false)]);
      o.start(time); o.stop(time + 2.7);
      const n = ctx.createBufferSource(); n.buffer = brown; n.loop = true;
      const bp = filt('bandpass', 260, 5);
      bp.frequency.setValueAtTime(260, time); bp.frequency.exponentialRampToValueAtTime(70, time + 0.9);
      const ng = gainN(0);
      ng.gain.setValueAtTime(0.0001, time); ng.gain.exponentialRampToValueAtTime(1.6, time + 0.05); ng.gain.exponentialRampToValueAtTime(0.0001, time + 1.1);
      n.connect(bp); bp.connect(ng);
      n.onended = disposer([n, bp, ng, ...route(ng, 0.8, 0.5, false)]);
      n.start(time, Math.random() * 3); n.stop(time + 1.2);
      strike(time + 0.5, 103.83, 0.42, 40);
    }

    // 9. sting: an inhale that rises, a hard cut to near-silence, then the hit
    function sting(time) {
      const n = ctx.createBufferSource(); n.buffer = white; n.loop = true;
      const bp = filt('bandpass', 250, 2.5);
      bp.frequency.setValueAtTime(250, time); bp.frequency.exponentialRampToValueAtTime(2600, time + 4.5);
      const g = gainN(0);
      g.gain.setValueAtTime(0.0001, time); g.gain.exponentialRampToValueAtTime(0.32, time + 4.5); g.gain.setValueAtTime(0, time + 4.52);
      n.connect(bp); bp.connect(g);
      n.onended = disposer([n, bp, g, ...route(g, 0.7, 0.35, false)]);
      n.start(time); n.stop(time + 4.6);
      [duckDry.gain, duckWet.gain].forEach((p) => {
        p.cancelScheduledValues(time);
        p.setValueAtTime(1, time + 4.4);
        p.linearRampToValueAtTime(0.06, time + 4.53);
        p.setValueAtTime(0.06, time + 5.6);
        p.linearRampToValueAtTime(1, time + 10);
      });
      const hit = time + 5.6;
      boom(hit, 1);
      strike(hit, 73.42, 0.5, 60);
      return hit - ctx.currentTime;
    }

    // 10. rage: sudden dead silence, then everything at once
    function rageHit(start, lead) {
      const hit = start + lead;
      [duckDry.gain, duckWet.gain].forEach((p) => {
        p.cancelScheduledValues(start);
        p.setValueAtTime(1, start);
        p.linearRampToValueAtTime(0.0001, start + 0.12);
        p.setValueAtTime(0.0001, hit - 0.02);
        p.linearRampToValueAtTime(0.7, hit + 0.04);
        p.linearRampToValueAtTime(0.45, hit + 3.5);
        p.linearRampToValueAtTime(1, hit + 11);
      });
      boom(hit, 1.6);
      strike(hit, 73.42, 0.55, 90);
      strike(hit + 0.015, 77.78, 0.45, 110);
      if (!lite) strike(hit + 0.03, 103.83, 0.4, 70);
      const o = osc('sine', 60);
      o.frequency.setValueAtTime(60, hit); o.frequency.exponentialRampToValueAtTime(18, hit + 3.5);
      const og = gainN(0);

#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;

precision mediump float;

uniform vec2 uRes;
uniform float uTime;

uniform float uF;

float hash1(vec3 p){
  p = 50.0*fract(p*0.3183099 + vec3(0.71,0.113,0.419));
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
}
float noise(vec3 x){
  vec3 i = floor(x); vec3 f = fract(x);
  f = f*f*(3.0-2.0*f);
  float a = hash1(i);
  float b = hash1(i+vec3(1.0,0.0,0.0));
  float c = hash1(i+vec3(0.0,1.0,0.0));
  float d = hash1(i+vec3(1.0,1.0,0.0));
  float e = hash1(i+vec3(0.0,0.0,1.0));
  float g = hash1(i+vec3(1.0,0.0,1.0));
  float h = hash1(i+vec3(0.0,1.0,1.0));
  float k = hash1(i+vec3(1.0,1.0,1.0));
  return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y), mix(mix(e,g,f.x),mix(h,k,f.x),f.y), f.z);
}
const mat3 M3 = mat3(0.00,0.80,0.60, -0.80,0.36,-0.48, -0.60,-0.48,0.64);
float fbm3(vec3 p){ float s=0.0; float a=0.5; for(int i=0;i<3;i++){ s+=a*noise(p); p=M3*p*2.03; a*=0.5; } return s/0.875; }
float fbm5(vec3 p){ float s=0.0; float a=0.5; for(int i=0;i<5;i++){ s+=a*noise(p); p=M3*p*2.03; a*=0.5; } return s/0.96875; }

vec3 hash3(vec3 p){
  p = vec3(dot(p,vec3(127.1,311.7,74.7)), dot(p,vec3(269.5,183.3,246.1)), dot(p,vec3(113.5,271.9,124.6)));
  return fract(sin(p)*43758.5453);
}
vec2 worley(vec3 x, float t){
  vec3 i = floor(x); vec3 f = fract(x);
  float d1 = 9.0; float d2 = 9.0;
  for(int z=-1; z<=1; z++){
    for(int y=-1; y<=1; y++){
      for(int xx=-1; xx<=1; xx++){
        vec3 g = vec3(float(xx), float(y), float(z));
        vec3 o = hash3(i+g);
        o = 0.5 + 0.4*sin(t + 6.2831*o);
        vec3 r = g + o - f;
        float d = dot(r,r);
        if(d < d1){ d2 = d1; d1 = d; } else if(d < d2){ d2 = d; }
      }
    }
  }
  return vec2(sqrt(d1), sqrt(d2));
}

vec3 ramp(float x){
  vec3 c = vec3(0.30,0.015,0.0)*smoothstep(0.0,0.22,x);
  c = mix(c, vec3(0.78,0.13,0.02), smoothstep(0.18,0.46,x));
  c = mix(c, vec3(1.0,0.43,0.07), smoothstep(0.42,0.74,x));
  c = mix(c, vec3(1.0,0.78,0.42), smoothstep(0.70,0.98,x));
  c = mix(c, vec3(1.0,0.96,0.86), smoothstep(0.95,1.35,x));
  return c;
}

float surface(vec3 n, float mu, float t, float foot, float fe){
  float big = fbm3(n*2.6 + vec3(0.0, t*0.004, t*0.006));

  // frame around the big spot
  float cd = dot(n, uSpot);
  float a = acos(clamp(cd, -1.0, 1.0));
  float R2 = 0.12*uEyeSize;
  float R1 = R2*0.42*uPupil;
  vec3 up = abs(uSpot.y) < 0.9 ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0);
  vec3 tA = normalize(cross(up, uSpot));
  vec3 tB = cross(uSpot, tA);
  vec3 v = n - uSpot*cd;
  float vl = length(v);
  vec3 er = vl > 1e-5 ? v/vl : tA;
  vec2 l = vec2(dot(v, tA), dot(v, tB));

  bool nearEye = a < R2*2.2;
  float rN = 9.0;
  float rU = 9.0;
  vec3 nm = n;
  if(nearEye){
    // ragged outlines that travel with the spot
    float sh = fbm3(vec3(l/R2*1.4, t*0.012)) - 0.5;
    rN = a/(R2*(1.0 + 0.45*sh));
    float shU = fbm3(vec3(l/R2*2.3 + vec2(5.2, 1.3), t*0.02 + 3.0)) - 0.5;
    rU = a/(R1*(1.0 + 0.5*shU));
    // compress the radial coordinate so convection cells stretch into penumbral filaments
    float s = 1.0 - smoothstep(0.8, 1.35, rN);
    float am = mix(a, 0.28*a + 0.62*R2, s);
    nm = uSpot*cos(am) + er*sin(am);
  }

  vec3 gp = nm*36.0;
  gp += (noise(gp*0.33 + vec3(t*0.03)) - 0.5)*1.3;
  vec2 w = worley(gp, t*0.35);
  float cellC = 1.0 - smoothstep(0.0, 0.85, w.x);
  float lane = smoothstep(0.0, 0.17, w.y - w.x);
  float gran = (0.35 + 0.65*cellC)*(0.32 + 0.68*lane);
  gran = mix(0.5, gran, 1.0 - smoothstep(0.012, 0.035, foot));
  float fine = noise(nm*150.0 + vec3(t*0.2));
  gran *= mix(1.0, 0.82 + 0.36*fine, 1.0 - smoothstep(0.002, 0.006, foot));
  float micro = noise(nm*620.0 + vec3(t*0.5));
  gran *= mix(1.0, 0.86 + 0.28*micro, 1.0 - smoothstep(0.0005, 0.0015, foot));
  float heat = (0.52 + 0.52*gran)*(0.8 + 0.4*big);

  // smaller spots: prey. While being pulled they stretch into a teardrop
  // and a dark thread runs from them into the big spot.
  for(int i=0; i<6; i++){
    vec4 P = uPrey[i];
    if(P.w <= 0.0) continue;
    float pull = uPull[i];
    vec3 off = n - P.xyz;
    vec3 toE = uSpot - P.xyz;
    float dE = length(toE);
    vec3 dirE = toE/max(dE, 1e-5);
    float along = dot(off, dirE);
    float dl = length(off - dirE*clamp(along, 0.0, dE));
    if(dl > P.w*1.8 + R2*0.25*pull + 0.01) continue;
    vec3 perp = off - dirE*along;
    float stretch = 1.0 + 2.5*pull*step(0.0, along);
    float dd = length(perp + dirE*(along/stretch));
    float rr = dd/(P.w*(1.0 + 0.4*(noise(off/P.w*1.3 + vec3(float(i)*3.7, 0.0, t*0.03)) - 0.5)));
    float pm = (1.0 - smoothstep(0.85, 1.12, rr))*smoothstep(0.012, 0.024, P.w);
    float um = 1.0 - smoothstep(0.32, 0.55, rr);
    heat = mix(heat, (0.36 + 0.34*gran)*(0.9 + 0.2*big), pm);
    heat = mix(heat, 0.18 + 0.04*noise(n*240.0), um);
    if(pull > 0.0){
      float tt = clamp(along/max(dE, 1e-5), 0.0, 1.0);
      float width = mix(P.w*0.5, R2*0.22, tt)*pull;
      float wob = (noise(n*70.0 + vec3(t*0.5)) - 0.5)*width*0.9;
      float tm = (1.0 - smoothstep(width*0.35, width + 1e-4, dl + wob))*smoothstep(0.0, 0.3, pull);
      heat = mix(heat, 0.26 + 0.2*gran, tm);
    }
  }

  // the big spot
  if(nearEye){
    float pen = 1.0 - smoothstep(0.9, 1.08, rN);
    float umb = 1.0 - smoothstep(0.88, 1.1, rU);
    float penVal = (0.34 + 0.38*gran)*mix(0.78, 1.0, smoothstep(0.3, 1.0, rN))*(0.92 + 0.16*big);
    float dots = smoothstep(0.8, 0.96, noise(n*260.0 + vec3(t*0.15)));
    float umbVal = (0.16 + 0.08*dots)*mix(0.62, 1.0, smoothstep(0.0, 0.9, rU));
    heat = mix(heat, penVal, pen);
    heat = mix(heat, umbVal, umb);
  }
  // faculae around it, mostly visible toward the limb
  if(a < R2*3.0){
    float kf = (a - R2*1.6)/(R2*0.7);
    heat += exp(-kf*kf)*0.12*smoothstep(0.45, 0.8, noise(n*30.0))*(1.0 - mu)*1.4;
  }

  float fcd = dot(n, uFlare.xyz);
  if(fe > 0.001 && fcd > 0.6){
    float fa = acos(clamp(fcd,-1.0,1.0));
    float ft = t - uFlare.w;
    heat += fe*1.2*exp(-fa*fa*650.0)*(0.5 + noise(n*80.0 + vec3(t*0.6)));
    heat += fe*0.22*exp(-fa*fa*50.0);
    float kq = (fa - ft*0.11)/0.012;
    heat += 0.16*uFlareAmp*exp(-ft*0.25)*exp(-kq*kq);
  }
  return heat;
}

vec3 corona(vec3 qs, float h, float t){
  float g1 = exp(-h*10.0);
  float g2 = exp(-h*2.6);
  float g3 = 1.0/(1.0 + h*h*5.0);
  float st = smoothstep(0.32, 0.78, fbm3(qs*2.1 + vec3(0.0, t*0.004, 0.0)));
  float r1 = noise(qs*15.0 + vec3(0.0, 0.0, t*0.006));
  float r2 = noise(qs*41.0 - vec3(t*0.004));
  float ray = 0.6*r1 + 0.4*r2;
  vec3 c = vec3(1.0,0.34,0.07)*g1*0.85;
  c += vec3(0.85,0.36,0.14)*g2*0.20*(0.45 + st);
  c += vec3(0.74,0.69,0.64)*g3*0.17*st*(0.35 + ray);
  c += vec3(0.80,0.72,0.66)*exp(-h*3.2)*0.55*pow(ray, 4.0);
  return c;
}

vec2 flames(vec3 qs, float h, float t){
  if(h > 0.32) return vec2(0.0);
  float region = smoothstep(0.45, 0.68, fbm3(qs*1.6 + vec3(3.1, 0.0, t*0.003)));
  vec3 p = qs*6.5;
  float w = fbm3(p*0.8 + vec3(0.0, t*0.05, 0.0));
  float d = fbm5(p + vec3(w*1.7) + qs*(h*11.0) + vec3(0.0, -t*0.06, t*0.03));
  float thr = 0.40 + h*mix(5.5, 1.5, region);
  float f = smoothstep(thr, thr + 0.07, d)*exp(-h*5.0);
  float core = smoothstep(thr + 0.09, thr + 0.22, d)*exp(-h*9.0);
  float rim = exp(-h*160.0)*0.7;
  return vec2(max(f, rim), core);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y + uShake;
  float px = 1.0/uRes.y;
  float t = uTime;
  vec3 ro = vec3(0.0, 0.0, uDist);
  vec3 rd = normalize(vec3(uv, -uF));
  float b = dot(ro, rd);
  float tca = -b;
  vec3 q = ro + rd*tca;
  float qb = length(q);
  vec3 qs = uRot*(q/qb);
  float pxw = px*tca/uF;
  float breath = (1.0 + 0.035*sin(t*0.63)*sin(t*0.21 + 1.3))*(1.0 + 0.07*uBeat);

  float ft = t - uFlare.w;
  float fe = ft > 0.0 ? smoothstep(0.0, 0.35, ft)*exp(-ft*0.5)*uFlareAmp : 0.0;

  vec3 col = vec3(0.0);
  if(qb > 1.0 - 3.0*pxw){
    float h = max(qb - 1.0, 0.0);
    col = corona(qs, h, t);
    vec2 fl = flames(qs, h, t);
    col = mix(col, vec3(1.0, 0.10, 0.08), fl.x*0.85);
    col += vec3(1.0, 0.5, 0.28)*fl.y*0.9;
    float fd = dot(qs, uFlare.xyz);
    col += vec3(1.0, 0.62, 0.4)*fe*1.4*exp(-h*5.0)*smoothstep(0.86, 0.99, fd);
    col *= breath;
  }

  float disc = b*b - (dot(ro, ro) - 1.0);
  if(disc > 0.0){
    float th = -b - sqrt(disc);
    vec3 n = ro + rd*th;
    float mu = clamp(dot(n, -rd), 0.0, 1.0);
    vec3 ns = uRot*n;
    float foot = th*px/uF/max(mu, 0.15);
    float heat = surface(ns, mu, t, foot, fe);
    float m1 = 1.0 - mu;
    heat *= mix(0.6, 1.0, pow(mu, 0.4));
    float ld = 1.0 - 0.47*m1 - 0.23*m1*m1;
    vec3 sc = ramp(heat*breath)*ld;
    sc += vec3(0.55, 0.04, 0.03)*pow(m1, 6.0)*0.5;
    float cover = 1.0 - smoothstep(1.0 - 1.5*pxw, 1.0, qb);
    col = mix(col, sc, cover);
  }

  col += vec3(0.10, 0.035, 0.02)*0.25/(1.0 + max(qb - 1.0, 0.0)*3.0);

  if(uEarth.z > 0.5){
    float rS = uF/sqrt(uDist*uDist - 1.0);
    vec2 ec = uEarth.xy*rS;
    float er = rS/109.2;
    float d = length(uv - ec);
    float m = 1.0 - smoothstep(er - px*0.75, er + px*0.75, d);
    col *= 1.0 - m;

  if(uRage > 0.001){
    float lum = dot(col, vec3(0.45, 0.4, 0.15));
    vec3 blood = vec3(lum*1.35 + 0.015, lum*0.10, lum*0.07);
    col = mix(col, blood, uRage);
    vec2 vr = gl_FragCoord.xy/uRes - 0.5;

  col = 1.0 - exp(-col*1.6);

    }
    const bx = nowSec - beatAt - 0.03;
    const beat = env(bx) + 0.6 * env(bx - (0.27 - 0.06 * beatAgit));

    // flares on their own clock
    if (!reduce && !rage.active && t > st.nextFlare) {
      triggerFlare(false);
      if (audioLive()) audio.boom(audio.ctx.currentTime + 0.05, 0.45);
    }

    // BGM events
    if (audioLive()) {
      if (nowSec - lastShepAt > audio.shepEvery) { audio.shepard(); lastShepAt = nowSec; }
      if (nowSec >= nextTollAt && !rage.active) {
        const dur = audio.toll(audio.ctx.currentTime + 0.05);
        nextTollAt = nowSec + dur + 30 + Math.random() * 30;
      }
      if (nowSec >= nextStingAt && !rage.active) {
        const delay = audio.sting(audio.ctx.currentTime + 0.05);
        setTimeout(() => triggerFlare(true), Math.max(0, delay * 1000));
        st.nextFlare = Math.max(st.nextFlare, t + delay * speed + 12);
        nextStingAt = nowSec + 85 + Math.random() * 50;
        nextTollAt = Math.max(nextTollAt, nowSec + 22);
        nextRageAt = Math.max(nextRageAt, nowSec + 30);
      }
    }

    // earth transit, in units of the sun's projected radius
    const et = (t % 96) / 96;
    const ex = -1.6 + 3.2 * et, ey = -0.36 + 0.1 * et;

    const expo = smooth(0, 2.5, t) * (1 + 0.9 * clamp((2.3 - D) / 1.1, 0, 1));

    preyBuf.fill(0); pullBuf.fill(0);
    for (let i = 0; i < Math.min(6, prey.length); i++) {
      const q = prey[i];
      preyBuf[i * 4] = q.p[0]; preyBuf[i * 4 + 1] = q.p[1]; preyBuf[i * 4 + 2] = q.p[2]; preyBuf[i * 4 + 3] = q.r;
      pullBuf[i] = q.pull;
    }

    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, t);
    gl.uniform1f(U.uDist, D);
    gl.uniform1f(U.uF, F);
    gl.uniformMatrix3fv(U.uRot, false, new Float32Array(M)); // row-major M == column-major Mᵀ (world -> sun)
    gl.uniform3f(U.uSpot, eye.spot[0], eye.spot[1], eye.spot[2]);
    gl.uniform1f(U.uPupil, Math.min(1.7, eye.pupil + eye.kick) * (1 - bloom) + 1.55 * bloom);
    gl.uniform1f(U.uEyeSize, eye.size * (1 + BLOOM * bloom));
    gl.uniform4fv(U.uPrey, preyBuf);
    gl.uniform1fv(U.uPull, pullBuf);
    gl.uniform4f(U.uFlare, st.flare[0], st.flare[1], st.flare[2], st.flare[3]);
    gl.uniform1f(U.uFlareAmp, st.flareAmp);
    gl.uniform3f(U.uEarth, ex, ey, 1);
    gl.uniform1f(U.uExpo, expo);
    gl.uniform1f(U.uBeat, beat);
    gl.uniform1f(U.uRage, rageAmt);
    gl.uniform2f(U.uShake, shakeX, shakeY);
    gl.uniform1f(U.uFlash, flash);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    const pending = !everStarted && wantSound && AC_OK;
    const idle = !pending && !dockHover && nowSec - lastUi > 3.2;
    document.body.classList.toggle('idle', idle);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
