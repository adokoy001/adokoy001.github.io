<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>某氏 体内にて</title>
<meta name="description" content="誰かの血管の中を、巡回している。">
<style>
/* 配置：画面いっぱいの一枚の絵だけ。文字も部品も置かない。暗い一色の世界に決め打ち */
:root{ --bg:#060102; --ink:#dccac3; color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:none;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg);cursor:pointer}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:1.5rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font:14px/1.9 system-ui,sans-serif;background:var(--bg);text-align:center}
#err[hidden]{display:none}
</style>
</head>
<body>
<canvas id="c" aria-label="血管の中を流れていく、ぼやけた一人称の映像。触れると音が出る"></canvas>
<div id="err" hidden>WebGL が使えないため、表示できません。</div>
<script>
/* 某氏 体内にて — 血管の中を巡回する大食細胞の一人称。単一ファイル、外部通信なし。
   長さの単位は µm（赤血球の直径 7.8、血管の半径 15〜24）。 */
(function () {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c');
const gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) { $('err').hidden = false; return; }
const inst = gl.getExtension('ANGLE_instanced_arrays');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LITE = false;

// ---------- 数学
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const mix = (a, b, u) => a + (b - a) * u;
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const mix3 = (a, b, u) => [mix(a[0], b[0], u), mix(a[1], b[1], u), mix(a[2], b[2], u)];
const qmul = (a, b) => [
  a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
  a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
  a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
  a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]];
const qaxis = (ax, an) => { const s = Math.sin(an / 2); return [ax[0] * s, ax[1] * s, ax[2] * s, Math.cos(an / 2)]; };
const qnorm = q => { const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return [q[0] / l, q[1] / l, q[2] / l, q[3] / l]; };
const qrand = () => qnorm([rnd(-1, 1), rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)]);
const qconj = q => [-q[0], -q[1], -q[2], q[3]];
const qrot = (q, v) => { const u = [q[0], q[1], q[2]], t = mul(cross(u, v), 2); return add(add(v, mul(t, q[3])), cross(u, t)); };
const qmat = q => { const x = q[0], y = q[1], z = q[2], w = q[3];
  return [1 - 2 * (y * y + z * z), 2 * (x * y + z * w), 2 * (x * z - y * w), 2 * (x * y - z * w), 1 - 2 * (x * x + z * z), 2 * (y * z + x * w),
          2 * (x * z + y * w), 2 * (y * z - x * w), 1 - 2 * (x * x + y * y)]; };
const qfromto = (a, b) => { const c = cross(a, b), d = dot(a, b); return qnorm([c[0], c[1], c[2], 1 + d + 1e-6]); };
const m4mul = (a, b) => { const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  return o; };

// ---------- GL の小道具
function prog(vs, fs, attrs) {
  const p = gl.createProgram();
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o) + '\n' + s.split('\n').slice(0, 6).join('\n')); return o; };
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, 'precision highp float;\n' + fs));
  attrs.forEach((a, i) => gl.bindAttribLocation(p, i, a));
  gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; return { p, u: n => (n in u ? u[n] : (u[n] = gl.getUniformLocation(p, n))) };
}
function attribs(n) { for (let i = 0; i < 6; i++) { if (i < n) gl.enableVertexAttribArray(i); else gl.disableVertexAttribArray(i); if (inst) inst.vertexAttribDivisorANGLE(i, 0); } }
const buf = (data, usage) => { const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, usage || gl.STATIC_DRAW); return b; };
const ibuf = data => { const b = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, b); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(data), gl.STATIC_DRAW); return b; };

const GLSL_HASH = `
float hash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 hash2(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y); }`;
const GLSL_FOG = `uniform vec3 uFogC,uAhead; uniform float uFog;
vec3 fogged(vec3 c,vec3 w){ float d=length(w); float g=pow(max(dot(w/d,uAhead),0.),5.);
  return mix(uFogC*(.22+2.9*g),c,exp(-d*uFog)); }`;

// ---------- 血管の壁
const P_WALL = prog(`
attribute vec3 aP,aRad; attribute vec2 aUV; uniform mat4 uVP; uniform vec3 uOff; uniform float uPulse,uSq;
varying vec2 vUV; varying vec3 vW,vN;
void main(){ vW=aP+aRad*(uPulse*.035-uSq*.07)+uOff; vN=-normalize(aRad); vUV=aUV; gl_Position=uVP*vec4(vW,1.); }`, GLSL_HASH + GLSL_FOG + `
varying vec2 vUV; varying vec3 vW,vN; uniform float uPulse,uStage,uGlow,uTime,uOut,uSpark; uniform vec3 uWallC,uGlowC;
const float NX=18.;
void main(){
  vec2 g=vec2(vUV.x*NX,vUV.y/18.), ip=floor(g), fp=fract(g);
  float f1=9.,f2=9.; vec2 cid=vec2(0.);
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 o=vec2(float(i),float(j)), c=vec2(mod(ip.x+o.x,NX),mod(ip.y+o.y,64.));
    vec2 r=o+hash2(c)*.8+.1-fp; float d=dot(r,r);
    if(d<f1){f2=f1;f1=d;cid=c;} else if(d<f2) f2=d; }
  float edge=sqrt(f2)-sqrt(f1);
  float groove=smoothstep(0.,.07,edge);
  float nuc=exp(-f1*16.);
  vec3 base=uWallC*(.72+.3*hash(cid))*(.62+.38*groove)*(.9+.1*sin(vUV.x*400.+hash(cid)*6.))+vec3(.12,.055,.045)*nuc;
  vec3 n=normalize(vN), l=normalize(-vW); float d=length(vW);
  float ndl=max(dot(n,l),0.), at=1./(1.+d*d/520.);
  vec3 col=base*(.05+1.35*at*(.25+.75*ndl))+vec3(.5,.3,.25)*pow(ndl,28.)*at*.22*groove;
  // 壁の外から透けてくる明かり。拍に合わせて息をする
  float bl=sin(vUV.x*12.566+sin(vUV.y*.0491)*2.)*sin(vUV.y*.0327+1.7);
  col+=uGlowC*(smoothstep(.15,.95,bl)*(.35+.65*uPulse)*uGlow+uOut*(.3+.7*smoothstep(-.7,.9,bl)));
  col+=vec3(.45,.6,1.)*step(.988,hash(cid+floor(uTime*7.)))*uSpark;
  // 枝分かれの口（暗い穴）
  float m=floor(vUV.y/96.), h=hash(vec2(m,7.));
  if(h>.42){
    float cx=hash(vec2(m,3.)), dx=vUV.x-cx; dx-=floor(dx+.5);
    vec2 q=vec2(dx*150.,vUV.y-(m+.5)*96.)/vec2(6.5,10.);
    float rr=length(q), hole=1.-smoothstep(.82,1.04,rr);
    col=mix(col,vec3(.012,.0,.0),hole);
    col+=vec3(.16,.05,.04)*exp(-pow((rr-1.08)/.1,2.))*at*1.5;
    // 段階が進むと、穴の奥に白っぽいものがいる
    float w=step(.5,hash(vec2(m,11.)))*smoothstep(3.,4.2,uStage);
    vec2 qq=q-vec2(.12,.18+.05*sin(uTime*.4+m));
    col+=vec3(.30,.25,.24)*exp(-dot(qq,qq)*5.)*hole*w*at*2.2;
  }
  gl_FragColor=vec4(fogged(col,vW),1.);
}`, ['aP', 'aRad', 'aUV']);

// ---------- 赤血球と血小板（インスタンス）
const P_RBC = prog(`
attribute vec4 aV,iPos,iQ,iPar; uniform mat4 uVP; varying vec3 vN,vW,vK;
float zp(float x,float k){ float x2=x*x, s=sqrt(max(1.-x2,0.)); return mix(.5*s*(.207+2.003*x2-1.123*x2*x2),.42*s,k); }
vec3 qrot(vec4 q,vec3 v){ return v+2.*cross(q.xyz,cross(q.xyz,v)+q.w*v); }
void main(){
  float x=aV.x, sg=aV.y, k=iPar.x, bend=iPar.y;
  float z=zp(x,k), xe=min(x,.965), dz=(zp(xe+.02,k)-zp(xe-.02,k))/.04;
  vec3 p=vec3(x*aV.z,x*aV.w,sg*z+bend*(x*x-.4))*iPos.w;
  float sl=sg*dz+bend*2.*x;
  vec3 n=normalize(vec3(-sl*aV.z,-sl*aV.w,1.))*sg;
  vW=qrot(iQ,p)+iPos.xyz; vN=qrot(iQ,n); vK=vec3(z/.33,k,iPar.z);
  gl_Position=uVP*vec4(vW,1.); }`, GLSL_FOG + `
varying vec3 vN,vW,vK; uniform vec3 uTint;
void main(){
  vec3 n=normalize(vN), l=normalize(-vW); float d=length(vW);
  float ndl=abs(dot(n,l)), at=1./(1.+d*d/420.);
  vec3 base=mix(vec3(.33,.022,.020)*uTint,vec3(.44,.37,.26),vK.y)*vK.z;
  vec3 col=base*(.03+1.2*at*(.12+.88*ndl));
  col+=vec3(.30,.06,.02)*(1.-clamp(vK.x,0.,1.))*.3*at;       // まんなかの薄いところは透ける
  col+=vec3(.34,.03,.02)*pow(1.-ndl,2.5)*.32*at;              // 縁
  col+=vec3(.9,.55,.45)*pow(ndl,46.)*.16*at;
  gl_FragColor=vec4(fogged(col,vW),1.);
}`, ['aV', 'iPos', 'iQ', 'iPar']);

// ---------- 血漿の中のちり
const P_MOTE = prog(`
attribute vec4 aP; uniform mat4 uVP; uniform float uPx; varying float vA;
void main(){ float d=length(aP.xyz); gl_Position=uVP*vec4(aP.xyz,1.);
  gl_PointSize=clamp(uPx*(.5+aP.w)/max(d,1.),1.,7.); vA=(.4+.8*aP.w)/(1.+d*d/500.)*exp(-d*.012); }`, `
varying float vA; uniform vec3 uMC;
void main(){ vec2 q=gl_PointCoord*2.-1.; float a=smoothstep(1.,.1,dot(q,q)); gl_FragColor=vec4(uMC*a*vA,1.); }`, ['aP']);

// ---------- 異物・白血球（部品ごとに描く）
const P_OBJ = prog(`
attribute vec3 aP,aN; uniform mat3 uR; uniform vec3 uS,uT; uniform mat4 uVP; uniform vec4 uD; uniform float uTime;
varying vec3 vN,vW,vO; varying float vH;
float n3(vec3 p){ float t=uTime*uD.z;
  return sin(p.x*1.7+sin(p.y*2.3+t))*sin(p.y*1.9+sin(p.z*2.1-t*.7))+.5*sin(p.z*3.1+sin(p.x*2.7+t*.5))*sin(p.x*2.9+p.y*1.3); }
void main(){
  float h=n3(aP*uD.y+uD.w*3.7);
  if(fract(uD.w)>.4) h=pow(abs(h)*.7,.6)*1.5-.25;
  vec3 p=(aP+aN*uD.x*h)*uS;
  vW=uR*p+uT; vN=uR*(aN/uS); vO=aN; vH=h;
  gl_Position=uVP*vec4(vW,1.); }`, GLSL_FOG + `
varying vec3 vN,vW,vO; varying float vH;
uniform vec3 uC,uNucC; uniform vec4 uM,uNuc; uniform float uShade;   // uM = 鏡面, 縁, 自発光, 核の内側（輪）
void main(){
  vec3 n=normalize(vN), l=normalize(-vW); float d=length(vW);
  float ndl=max(dot(n,l),0.), at=1./(1.+d*d/420.);
  vec3 base=uC*(.82+.22*vH);
  float dn=dot(normalize(vO),uNuc.xyz);
  float nm=smoothstep(uNuc.w-.04,uNuc.w+.04,dn)*(1.-smoothstep(uM.w-.02,uM.w+.02,dn));
  base=mix(base,uNucC,nm*.88);
  at*=uShade;
  vec3 col=base*(.03+1.1*at*(.12+.88*ndl))+uC*uM.z;
  col+=vec3(.36,.05,.035)*pow(1.-ndl,2.5)*uM.y*at;
  col+=vec3(1.,.9,.85)*pow(ndl,60.)*uM.x*at;
  gl_FragColor=vec4(fogged(col,vW),1.);
}`, ['aP', 'aN']);

// ---------- 気配（異物のまわりの光や闇、火花）。視点の空間の板
const P_AURA = prog(`
attribute vec2 aP; uniform mat4 uP; uniform vec3 uC0; uniform float uSz; varying vec2 vUV;
void main(){ vUV=aP; gl_Position=uP*vec4(uC0+vec3(aP*uSz,0.),1.); }`, GLSL_HASH + `
varying vec2 vUV; uniform vec3 uCol; uniform vec4 uA; uniform float uTime,uAmt;
void main(){
  float d=length(vUV); vec2 dir=vUV/max(d,1e-3);
  float tn=vnoise(dir*uA.x+vec2(uA.w*9.,-uTime*uA.y)+d*2.);
  float core=exp(-d*d*6.), halo=exp(-d*d*1.7)*smoothstep(1.,.55,d);
  float fl=1.-uA.z*step(.55,hash(vec2(floor(uTime*13.),uA.w)));
  gl_FragColor=vec4(uCol*(core*.7+halo*(.2+1.1*tn*tn))*uAmt*fl,1.);
}`, ['aP']);

// ---------- 偽足（視点の空間で描く）
const P_POD = prog(`
attribute vec3 aP,aN; attribute vec2 aUV; uniform mat4 uP; varying vec3 vN,vW; varying vec2 vUV;
void main(){ vW=aP; vN=aN; vUV=aUV; gl_Position=uP*vec4(aP,1.); }`, GLSL_HASH + `
varying vec3 vN,vW; varying vec2 vUV; uniform float uTime; uniform vec3 uFogC;
void main(){
  vec3 n=normalize(vN), l=normalize(-vW); float d=length(vW);
  float ndl=max(dot(n,l),0.), at=1./(1.+d*d/260.);
  float a=vUV.y*6.2832; vec2 gp=vec2(vUV.x*5.-uTime*.3,0.)+vec2(cos(a),sin(a))*1.6;
  float gr=vnoise(gp*3.1), g2=vnoise(gp*.9+3.);
  vec3 base=vec3(.50,.41,.39)*(.7+.35*g2)-vec3(.12,.10,.09)*smoothstep(.62,.9,gr);
  float rim=pow(1.-ndl,2.);
  vec3 col=base*(.06+.95*at*(.2+.8*ndl))+vec3(.42,.16,.13)*rim*.5+vec3(1.,.9,.86)*pow(ndl,50.)*.16*at+uFogC*.5;
  gl_FragColor=vec4(col,.56+.36*rim);
}`, ['aP', 'aN', 'aUV']);

// ---------- 仕上げ。目はない。にじみ、ゆがみ、残像だけで「感じている」絵にする
const VS_Q = `attribute vec2 aP; varying vec2 vUV; void main(){ vUV=aP*.5+.5; gl_Position=vec4(aP,0.,1.); }`;
// 1) 低い解像度のまま、ゆがめて前のコマへ重ねる（外へ流れる残像）
const P_ACC = prog(VS_Q, GLSL_HASH + `
varying vec2 vUV; uniform sampler2D uCur,uPrev; uniform float uTime,uSpeed,uMix,uStrain; uniform vec2 uPx;
void main(){
  vec2 q=vUV-.5;
  vec2 w=vec2(vnoise(vUV*2.6+vec2(uTime*.33,0.)),vnoise(vUV*2.6+vec2(7.,-uTime*.29)))-.5;
  vec2 w2=vec2(vnoise(vUV*6.5-uTime*.5),vnoise(vUV*6.5+11.+uTime*.45))-.5;
  vec2 uv=vUV+w*(.13+.1*uStrain)+w2*.04;
  vec2 d=uPx*3.5;
  vec3 c=texture2D(uCur,uv).rgb*.36+(texture2D(uCur,uv+vec2(d.x,d.y)).rgb+texture2D(uCur,uv-vec2(d.x,d.y)).rgb
        +texture2D(uCur,uv+vec2(-d.x,d.y)).rgb+texture2D(uCur,uv+vec2(d.x,-d.y)).rgb)*.16;
  float a=.03*sin(uTime*.2)+w.x*.09, ca=cos(a), sa=sin(a);
  vec2 pv=.5+vec2(q.x*ca-q.y*sa,q.x*sa+q.y*ca)*(1.-.02-.035*uSpeed)+w2*.014;
  vec3 p=texture2D(uPrev,pv).rgb;
  gl_FragColor=vec4(mix(p*.99,c,uMix),1.);
}`, ['aP']);
// 2) 自分の細胞質ごしに、画面へ
const P_POST = prog(VS_Q, GLSL_HASH + `
varying vec2 vUV; uniform sampler2D uTex; uniform float uTime,uClose,uFull,uPulse,uDark,uStrain,uGrain,uDrunk,uFlash; uniform vec2 uCen; uniform vec3 uGrade; uniform vec4 uTint;
void main(){
  vec2 q=(vUV-.5)*2.;
  vec2 qc=q-uCen*smoothstep(0.,.45,uClose);
  float e=length(qc), a=atan(qc.y,qc.x);
  float rip=.05*sin(a*3.+uTime*.5)+.02*sin(a*7.-uTime*.8+1.3)+.12*(vnoise(vec2(cos(a),sin(a))*1.7+uTime*.12)-.5);
  float open=1.16-.24*uFull;
  float cl=uClose*uClose*(3.-2.*uClose);
  float e0=mix(open,-.3,cl)+rip*(1.-.6*cl);
  float body=smoothstep(e0-.06,e0+.2,e);
  float lens=smoothstep(e0-.6,e0,e);
  vec2 wob=vec2(vnoise(q*1.7+uTime*.22),vnoise(q*1.7-uTime*.2+7.))-.5;
  vec2 off=-normalize(qc+1e-4)*lens*lens*.07+wob*(.05+.03*uFull+.05*uStrain+.02*uPulse+.07*uDrunk)-q*dot(q,q)*.03;
  vec2 uv=vUV+off;
  float ch=.08+.6*uDrunk;
  vec3 c=vec3(texture2D(uTex,uv+off*ch).r,texture2D(uTex,uv).g,texture2D(uTex,uv-off*ch).b)*1.75;
  float g2=vnoise(q*5.-uTime*.05);
  vec3 cyt=vec3(.13,.07,.066)*(.6+.5*g2)+c*.3;
  cyt*=1.-.55*smoothstep(e0+.1,e0+.75,e);
  float mem=exp(-pow((e-e0-.08)/.09,2.));
  c=mix(c,cyt,body*.94)+vec3(.2,.12,.105)*mem*(.4+.4*uPulse)*(1.-.5*cl);
  c*=1.+.12*uPulse;
  c*=1.-.24*dot(q,q);
  c=mix(vec3(dot(c,vec3(.3,.5,.2))),c,.86); c=pow(max(c,0.),vec3(1.1));
  c*=uGrade; c=mix(c,c*uTint.rgb*2.+uTint.rgb*.07,uTint.a); c+=vec3(1.,.94,.88)*uFlash;
  c+=(hash(gl_FragCoord.xy+fract(uTime)*91.7)-.5)*uGrain;
  gl_FragColor=vec4(c*(1.-uDark),1.);
}`, ['aP']);

// ---------- 取り込んだもの（視野の中に浮く）
const P_INC = prog(`
attribute vec2 aP,aUV; attribute vec4 aC; attribute vec2 aK; varying vec2 vUV,vK; varying vec4 vC;
void main(){ vUV=aUV; vC=aC; vK=aK; gl_Position=vec4(aP,0.,1.); }`, GLSL_HASH + `
varying vec2 vUV,vK; varying vec4 vC;
void main(){
