。信者は経典「コーラン（クルアーン）」の教えに従い、1日5回の礼拝や、決められた月の断食などを守って暮らす。イスラム教は、西アジアから北アフリカ、中央アジア、東南アジアへと広まっていった。\n\nギリシャ・ローマで生まれた政治や法のしくみ、そして仏教、キリスト教、イスラム教は、長い時を経た今も、世界の多くの人々の暮らしや考え方と深く結びついている。話し合いと多数決で物事を決めるしくみや、日本各地にある寺、世界の祭りや習慣。その背景にある歴史を知ると、身の回りや世界の出来事の見え方が変わってくるはずだ。"},{"id":"m4a10","title":"モナ・リザから世界一周へ","kind":"世界史","points":["14世紀のイタリアで、古代ギリシャ・ローマの文化を学び直し、人間らしさを表現しようとするルネサンスが始まった。","1517年、ドイツのルターが免罪符の販売を批判して宗教改革を始め、プロテスタントとよばれる人々が生まれた。","アジアとの直接の取り引きなどを求めて、ポルトガルやスペインが新航路を開き、大航海時代が始まった。"],"body":"静かにほほえむ女性をえがいた名画「モナ・リザ」。今から500年ほど前に、イタリアのレオナルド・ダ・ヴィンチがえがいた作品だ。人物の表情をいきいきと表したこの絵は、新しい時代の始まりを伝えている。このころのヨーロッパでは、文化、信仰、世界の広がりという三つの面で、大きな変化が次々に起こった。\n\n中世のヨーロッパでは、ローマ教皇を頂点とするカトリック教会が大きな力をもっていた。11世紀の末からは、聖地エルサレムを取り戻すために十字軍が送られた。十字軍は結局失敗に終わったが、イスラム世界との交流が深まり、そこで受けつがれていた古代ギリシャの学問などが伝わった。\n\n14世紀になると、イタリアの都市を中心に、古代ギリシャやローマの文化を学び直し、人間のいきいきとした姿や個性を表現しようとする動きが起こった。これをルネサンス（文芸復興）という。レオナルド・ダ・ヴィンチやミケランジェロは、すぐれた絵画や彫刻を残した。科学の分野では、地球が太陽の周りを回るという地動説が唱えられた。火薬や羅針盤が改良され、ドイツでは活版印刷術が実用化された。\n\n16世紀に入ると、信仰をめぐる動きが起こる。ローマ教皇が大聖堂の改築資金を集めるために免罪符を売り出すと、1517年、ドイツのルターがこれを批判し、聖書こそが信仰のよりどころだと主張した。スイスではカルバンも改革を進めた。こうした改革を宗教改革といい、改革を支持した人々はプロテスタント（抗議する者）とよばれた。ルターの考えは、印刷物によって急速に広まった。\n\n同じころ、ヨーロッパの国々は海の向こうへと乗り出していた。アジアでとれるこしょうなどの香辛料は、ヨーロッパでは高い値段で取り引きされていた。イスラム商人などを通さずにアジアと直接取り引きしたいという願いと、キリスト教を広めたいという思いが、ポルトガルとスペインを航海へと向かわせた。\n\n1492年、スペインの援助を受けたコロンブスは、インドをめざして大西洋を西へ進み、西インド諸島に到着した。1498年には、ポルトガルのバスコ・ダ・ガマがアフリカ南端を回ってインドに着いた。スペインの援助を受けたマゼランの船隊は、途中でマゼランを失いながらも、1522年に世界一周をなしとげた。こうしてヨーロッパの人々が世界の海へ進出した時代を大航海時代という。\n\n新しい航路は世界を結びつけたが、その陰には大きな犠牲もあった。スペインはアメリカ大陸のアステカ王国やインカ帝国をほろぼし、先住民を鉱山や農園で働かせた。厳しい労働と持ちこまれた病気のために先住民の人口は大きく減り、代わりの働き手として、アフリカから多くの人々が奴隷として連れてこられた。\n\nヨーロッパの船は、やがて日本にもやってきた。1543年にはポルトガル人が種子島に鉄砲を伝え、1549年にはカトリックの立て直しを進めたイエズス会のザビエルが鹿児島に来てキリスト教を伝えた。遠いヨーロッパで起きた変化は、日本の歴史にもつながっているのである。"}]</script>
<script type="application/json" id="content-lv5">[{"id":"m5a01","title":"何回試せば「必ず」と言えるか","kind":"数学","points":["具体例をいくつ確かめても、すべての場合を示したことにはならない。文字式を使えば、すべての整数についてまとめて説明できる。","m、nを整数とすると、偶数は2m、奇数は2n＋1と表せる。偶数と奇数の和は2（m＋n）＋1となるので奇数である。","連続する3つの整数はn、n＋1、n＋2と表せる。和は3（n＋1）となるので、3の倍数で、真ん中の数の3倍になる。"],"body":"2＋3＝5、4＋7＝11、10＋21＝31。偶数と奇数をたすと、答えはいつも奇数になるようだ。では、100回試して100回とも奇数だったら、偶数と奇数の和は必ず奇数だと言いきってよいだろうか。\n\n答えは「まだ言えない」である。整数は限りなくあるので、何回試しても、試していない組み合わせが必ず残る。101回目に例外が出ないことは、具体例を並べるだけでは保証できない。そこで役に立つのが文字式だ。文字を使えば、限りなくある数をひとまとめにして扱える。\n\nまず、偶数と奇数を文字で表してみよう。偶数は2の倍数なので、整数mを使って2mと表せる。奇数は偶数より1大きい数なので、整数nを使って2n＋1と表せる。ここで、偶数と奇数に別々の文字を使うことが大切だ。もし両方にnを使って2nと2n＋1とすると、4と5のような、となり合う偶数と奇数の組しか表せなくなってしまう。\n\n準備ができたら、和を計算する。2m＋（2n＋1）＝2m＋2n＋1＝2（m＋n）＋1となる。m＋nは整数どうしの和なので、やはり整数だ。つまり、この和は「2×（整数）＋1」の形をしているから奇数である。mとnにどんな整数を入れてもこの計算は成り立つので、これで偶数と奇数の和はいつも奇数だと説明できた。2m＋2nを2（m＋n）とまとめたように、言いたいことに合わせて式の形を整えるのが、説明のいちばんのポイントだ。\n\n同じ考え方で、ほかのきまりも説明できる。3と4と5、10と11と12のように、連続する3つの整数の和は、12や33のようにいつも3の倍数になる。いちばん小さい数をnとすると、3つの数はn、n＋1、n＋2と表せる。和はn＋（n＋1）＋（n＋2）＝3n＋3＝3（n＋1）となり、n＋1は整数なので、和は3の倍数だとわかる。さらに、3（n＋1）という形からは、和が真ん中の数の3倍になっていることも読み取れる。式は、結論を示すだけでなく、新しい発見も教えてくれるのだ。\n\n2けたの数でも試してみよう。37と、十の位と一の位を入れかえた73をたすと110になる。十の位の数をa、一の位の数をbとすると、もとの数は10a＋b、入れかえた数は10b＋aと表せる。和は11a＋11b＝11（a＋b）なので、いつも11の倍数になる。実際、37＋73＝110＝11×10で、a＋b＝3＋7＝10とぴったり合っている。\n\n具体例は、きまりを見つけるきっかけになる。そして文字式は、そのきまりがすべての場合に成り立つことを示す道具になる。「たぶんそうだ」を「必ずそうだ」に変えるこの手順は、このあと学ぶ図形の証明にもつながっていく。"},{"id":"m5a02","title":"2つの手がかりで謎を解く","kind":"数学","points":["二元一次方程式を2つ組にしたものを連立方程式といい、両方を同時に成り立たせるx、yの値の組をその解という。","解き方の基本は文字を1つ消すこと。式どうしをたしたりひいたりする加減法と、式を代入する代入法がある。","文章題では、何をx、yにするかを決め、等しい関係を2つ見つけて式に表し、解いたら答えが問題に合うかを確かめる。"],"body":"つるとかめが合わせて10匹いて、足の数は合わせて28本ある。つるとかめは、それぞれ何匹いるだろうか。昔から知られる「つるかめ算」の問題だ。算数なら、全部がつるだとすると足は20本で8本足りない、というように工夫して考えるところだ。中学2年では、この問題を迷わず、決まった手順で解く方法を学ぶ。それが連立方程式である。\n\nつるの数をx、かめの数をyとすると、数の関係からx＋y＝10、足の数の関係から2x＋4y＝28という2つの式ができる。このように、2つの文字をふくむ一次方程式を二元一次方程式という。x＋y＝10だけを見ると、xが1でyが9、xが2でyが8というように、成り立つ組はいくつもある。1つの式だけでは答えがしぼれないのだ。そこで2つの式を組にして、両方を同時に成り立たせるxとyの値の組を求める。この組にした式を連立方程式、求める値の組をその解という。\n\n解き方の基本は、文字を1つ消すことだ。文字が2つのままでは手が出ないが、1つにできれば中学1年で学んだ一次方程式になる。1つ目の方法は加減法である。x＋y＝10の両辺を2倍すると2x＋2y＝20となる。これを2x＋4y＝28から、左辺どうし、右辺どうしひくと、2xが消えて2y＝8、つまりy＝4となる。これをx＋y＝10に代入すればx＝6だ。つるは6匹、かめは4匹である。足の数を確かめると、2×6＋4×4＝12＋16＝28で、問題に合っている。\n\n2つ目の方法は代入法である。たとえばy＝2x－1と3x＋y＝9の組では、1つ目の式がすでに「y＝」の形になっている。そこで2つ目の式のyに2x－1を代入すると、3x＋（2x－1）＝9となり、5x＝10からx＝2が求められる。これをy＝2x－1に代入して、y＝3である。どちらの方法でも答えは同じになるので、式の形を見て計算が楽になるほうを選べばよい。\n\n連立方程式で文章題を解くときは、手順を決めておくと迷わない。まず、何をxとyにするかを決める。次に、問題文から等しい関係を2つ見つけ、それぞれを式に表す。そして連立方程式を解き、最後に、求めた解が問題に合っているかを確かめる。人数や個数を求めているのに答えが負の数や分数になったら、式の立て方を見直すきっかけになる。\n\n買い物の場面でも、この考え方は使える。たとえば、ノート2冊と鉛筆3本で540円、ノート1冊と鉛筆3本で360円だったとする。2つの式をひけば、鉛筆の分が消えて、ノート1冊が180円だとすぐにわかり、そこから鉛筆1本は60円と求められる。\n\nわからない数が2つあっても、それらを結ぶ関係が2つわかれば答えにたどり着ける。連立方程式は、手がかりを組み合わせて謎を解く方法なのである。"},{"id":"m5a03","title":"水そうの未来を式で読む","kind":"数学","points":["yがxの一次式でy＝ax＋bと表されるとき、yはxの一次関数である。比例y＝axはb＝0の場合にあたる。","変化の割合は（yの増加量）÷（xの増加量）で求め、一次関数では一定で、aに等しい。","一次関数のグラフは傾きa、切片bの直線。連立方程式の解は、2つの方程式のグラフの交点の座標になる。"],"body":"水そうに水が5L入っている。そこへ、蛇口から毎分3Lずつ水を入れていく。1分後には8L、2分後には11L、3分後には14L。では、10分後には何Lになっているだろうか。表を10分まで書き続けてもよいが、式があれば一瞬で答えが出る。\n\n水を入れはじめてからの時間をx分、水そうの水の量をyLとすると、y＝3x＋5と表せる。x＝10を代入すれば、y＝35で、10分後には35Lだ。このように、yがxの一次式で表されるとき、yはxの一次関数であるといい、一般にy＝ax＋bの形で書く。中学1年で学んだ比例y＝axは、bが0の場合にあたり、一次関数の仲間である。\n\n一次関数の大きな特徴は、変化の割合が一定であることだ。変化の割合とは、xの増加量に対するyの増加量の割合で、（yの増加量）÷（xの増加量）で求める。水そうの例では、xが1から4へ3増えると、yは8から17へ9増えるので、変化の割合は9÷3＝3となる。xがどこからどれだけ増えても、この値は必ず3で、式のxの係数aと等しい。毎分3Lという一定のペースが、そのままaに表れているのだ。\n\nグラフにすると、一次関数は直線になる。y＝ax＋bのグラフは、y＝axのグラフをy軸の正の方向にbだけ平行移動した直線で、aを傾き、bを切片という。切片はグラフがy軸と交わる点のy座標で、水そうの例では、はじめに入っていた5Lにあたる。傾きは、右へ1進むと上へいくつ進むかを表し、aが正なら右上がり、負なら右下がりの直線になる。たとえば、30Lの水を毎分2Lずつぬいていくなら、y＝－2x＋30となり、グラフは右下がりだ。y＝0となるx＝15から、15分で水がなくなることも読み取れる。\n\n一次関数は、方程式とも深くつながっている。たとえば二元一次方程式2x＋y＝7は、yについて解くとy＝－2x＋7となる。つまり、この方程式の解を座標とする点をすべて集めると、傾き－2、切片7の直線になる。すると、連立方程式の解は、2つの直線が交わる点を表していることになる。2x＋y＝7とx－y＝2のグラフは点（3，1）で交わり、連立方程式の解もx＝3、y＝1だ。計算で求めた答えを、グラフで目に見える形で確かめられるのである。\n\nおもりをつるしたばねの長さ、一定の速さで進むときの道のり、基本料金に使った分が加わる料金。身の回りには、一定のペースで変わる量がたくさんある。変化の割合が一定だと気づけば、その関係は一次関数として式とグラフで表せ、先のことまで予想できるようになる。"},{"id":"m5a04","title":"外角の和はいつも360°","kind":"数学","points":["対頂角は等しい。2直線が平行ならば同位角・錯角は等しく、逆に同位角か錯角が等しければ2直線は平行である。","三角形の内角の和が180°であることは、頂点を通り底辺に平行な直線をひき、錯角を使って説明できる。","n角形の内角の和は180°×（n－2）で、外角の和は何角形でも360°である。"],"body":"紙で三角形をつくり、3つの角をちぎって頂点を1か所に集めてみる。すると、3つの角はぴったり並んで一直線になる。小学校では、こうした実験で三角形の3つの角の和が180°であることを確かめた。けれど、いくつかの三角形で試しただけでは、どんな三角形でも必ずそうなると言いきることはできない。中学2年では、平行線の性質を使って、これを筋道立てて説明する。\n\nまず、2つの直線が交わってできる角を見てみよう。向かい合う角を対頂角といい、対頂角は等しい。また、2つの直線に別の1本の直線が交わるとき、同じ位置関係にある角を同位角という。そして、2つの直線の内側で、交わる直線をはさんで反対側にある角を錯角という。アルファベットのZの形を思い浮かべると見つけやすい。\n\nこの同位角と錯角には、大切な性質がある。2直線が平行ならば、同位角や錯角は等しい。逆に、同位角か錯角が等しければ、その2直線は平行である。前者を平行線の性質、後者を平行線になるための条件という。\n\nいよいよ三角形の内角の和だ。三角形ABCで、頂点Aを通り、辺BCに平行な直線をひく。すると、角Bと等しい錯角、角Cと等しい錯角が、頂点Aのところに、角Aをはさむように並ぶ。この3つの角は一直線をつくっているので、和は180°だ。紙をちぎって並べた実験を、平行線の性質で裏づけたことになる。同じように考えると、三角形の1つの外角は、それととなり合わない2つの内角の和に等しいこともわかる。\n\n三角形がわかれば、多角形の角も求められる。n角形は、1つの頂点からひいた対角線によって、（n－2）個の三角形に分けられる。だから、n角形の内角の和は180°×（n－2）だ。四角形なら360°、五角形なら540°、六角形なら720°になる。正六角形の1つの内角は、720°を6等分して120°である。\n\nでは、外角の和はどうだろう。n角形のどの頂点でも、内角と外角の和は180°なので、n個の頂点すべてを合わせると180°×nになる。ここから内角の和180°×（n－2）をひくと、180°×2＝360°が残る。何角形であっても、外角の和はいつも360°なのだ。多角形の辺に沿って歩き、角に来るたびに外角の分だけ向きを変えていくと、出発点に戻ったときにちょうど1回転している。そう考えると、この結果にも納得がいく。\n\n対頂角と平行線から三角形の内角の和が導かれ、そこから多角形の内角の和、さらに外角の和へと話が広がっていく。わかっていることを使って次のことを説明するこの流れは、このあと学ぶ証明の考え方そのものである。"},{"id":"m5a05","title":"3つそろえば形が決まる","kind":"数学","points":["三角形の合同条件は、3組の辺、2組の辺とその間の角、1組の辺とその両端の角が、それぞれ等しいこと。","「AならばBである」のAを仮定、Bを結論という。証明では、仮定から出発し、根拠を示しながら結論を導く。","証明を考えるときは結論から逆にたどり、書くときは仮定から結論へ、根拠を省かずに順に並べる。"],"body":"電話の向こうの友だちに、手もとの三角形とまったく同じ三角形をかいてもらいたい。何を伝えればよいだろうか。「2つの辺の長さは5cmと4cm」だけでは足りない。その2辺がどんな角度で開いているかによって、三角形の形はいくらでも変わってしまうからだ。では、どれだけの情報があれば、形と大きさがただ1つに決まるのだろうか。\n\nぴったり重ね合わせることのできる2つの図形は、合同であるという。合同な図形では、対応する辺の長さも、対応する角の大きさもそれぞれ等しい。三角形ABCと三角形DEFが合同であることは、記号≡を使って△ABC≡△DEFと書く。このとき、対応する頂点を同じ順に並べて書くのが約束だ。\n\n三角形は、すべての辺と角を調べなくても、次の3つのどれかがわかれば合同だと言える。1つ目は、3組の辺がそれぞれ等しいこと。2つ目は、2組の辺とその間の角がそれぞれ等しいこと。3つ目は、1組の辺とその両端の角がそれぞれ等しいこと。これを三角形の合同条件という。電話の場面なら、3辺の長さか、2辺とその間の角か、1辺とその両端の角を伝えれば、相手は同じ三角形をかける。2つ目が「間の角」でなければならない点に注意したい。2辺と、その間にない角を伝えても、三角形が2通りできてしまう場合があるからだ。\n\n合同条件は、証明の強力な道具になる。証明とは、すでに正しいと認められていることを根拠にして、ある事柄が正しいことを筋道立てて示すことだ。「AならばBである」という形の文で、Aの部分を仮定、Bの部分を結論という。証明では、仮定から出発し、根拠を1つずつ示しながら結論にたどり着く。\n\n例を見てみよう。2つの線分ABとCDが点Oで交わり、OA＝OB、OC＝ODであるとき、AC＝BDとなることを証明する。仮定はOA＝OBとOC＝OD、結論はAC＝BDだ。ACとBDをそれぞれ辺にもつ△AOCと△BODに目をつける。この2つの三角形で、OA＝OBとOC＝ODは仮定から言える。さらに、∠AOCと∠BODは対頂角なので等しい。2組の辺とその間の角がそれぞれ等しいので、△AOC≡△BODである。合同な図形の対応する辺は等しいから、AC＝BDとなる。\n\n証明を考えるときのこつは、結論から逆にたどることだ。AC＝BDを言うにはどの三角形の合同を示せばよいか、その合同にはあと何がわかればよいか、と考えていくと、道筋が見えてくる。そして書くときは、仮定から結論へ、根拠を省かずに順に並べる。根拠のない部分が1つでもあると、鎖の輪が1つ欠けたように、証明全体が成り立たなくなる。\n\n3辺の長さが決まれば三角形の形は1つに決まる。この性質は、鉄橋や鉄塔の骨組みに三角形が多く使われている理由でもある。四角形の枠は押すと形が変わってしまうが、三角形の枠は辺の長さが変わらないかぎり形がくずれないのだ。"},{"id":"m5a06","title":"平行四辺形になる5つの条件","kind":"数学","points":["二等辺三角形の定義は2つの辺が等しい三角形。底角が等しいことや、頂角の二等分線が底辺を垂直に2等分することは定理である。","ある事柄が正しくても、その逆が正しいとは限らない。正しくないことは反例を1つ示せばよい。","2組の対辺が平行、2組の対辺や対角が等しい、対角線が中点で交わる、1組の対辺が平行で等しい、のどれかなら平行四辺形。"],"body":"紙を2つに折り、折り目に対して斜めにはさみを入れて開くと、2つの辺の長さが等しい三角形ができる。二等辺三角形だ。開いた紙をもう一度折り目で折り返すと、底辺の両端の角、つまり2つの底角がぴったり重なる。二等辺三角形の底角は等しい。小学校から知っているこの事実を、中学2年では証明によって確かめる。\n\nここで大切になるのが、定義と定理の区別である。定義とは、言葉の意味をはっきり決めたものだ。二等辺三角形の定義は「2つの辺が等しい三角形」である。一方、証明された事柄のうち、よく使われる大切なものを定理という。「二等辺三角形の底角は等しい」は、定義ではなく定理だ。頂角の二等分線をひいて2つの三角形に分け、2組の辺とその間の角がそれぞれ等しいことから合同を示せば、証明できる。同じ合同から、頂角の二等分線が底辺を垂直に2等分することもわかる。\n\nでは、逆はどうだろう。「2つの角が等しい三角形は二等辺三角形である」。これも証明でき、正しい。しかし、ある事柄が正しくても、その逆がいつも正しいとは限らない。たとえば「xが6の倍数ならば、xは2の倍数である」は正しいが、逆の「xが2の倍数ならば、xは6の倍数である」は正しくない。x＝4のように、成り立たない例が1つでもあるからだ。このような例を反例という。\n\n四角形では、平行四辺形が主役になる。向かい合う辺を対辺、向かい合う角を対角という。平行四辺形の定義は「2組の対辺がそれぞれ平行な四角形」だ。ここから、2組の対辺はそれぞれ等しい、2組の対角はそれぞれ等しい、対角線はそれぞれの中点で交わる、という3つの性質が証明される。\n\n逆に、ある四角形が平行四辺形だと言うには、次の5つのうちどれか1つが成り立てばよい。2組の対辺がそれぞれ平行である。2組の対辺がそれぞれ等しい。2組の対角がそれぞれ等しい。対角線がそれぞれの中点で交わる。1組の対辺が平行でその長さが等しい。1つ目は定義そのもので、2つ目から4つ目は、さきほどの3つの性質の逆にあたる。5つ目では、平行であることと長さが等しいことが、同じ1組の対辺についてでなければならない。\n\n平行四辺形の中には、特別なものもある。4つの角がすべて等しい長方形、4つの辺がすべて等しいひし形、そしてその両方をあわせもつ正方形だ。どれも平行四辺形の性質をすべて備えたうえで、長方形の対角線は長さが等しく、ひし形の対角線は垂直に交わる、という性質が加わる。\n\n平行四辺形のしくみは身の回りでも活躍している。ふたを開くと中の段がせり出してくる工具箱では、段を支える腕木がつくる四角形の2組の対辺がそれぞれ等しくなっている。だから形が変わっても平行四辺形のままで、上の段は下の段とずっと平行なのだ。"},{"id":"m5a07","title":"偶然とばらつきを数で読む","kind":"数学","points":["起こりうる場合がn通りで、どれも同様に確からしく、Aの起こる場合がa通りなら、Aの起こる確率はn分のaである。","確率を求めるときは、樹形図や表を使って、場合をもれなく、重なりなく数えることが大切である。","四分位範囲は第3四分位数から第1四分位数をひいた値。箱ひげ図は5つの値で分布を表し、比べるのに便利である。"],"body":"さいころを1回投げて1の目が出る確率は6分の1だ。では、6回投げれば1の目は必ず1回出るのだろうか。実際にやってみると、1回も出ないこともあれば、3回出ることもある。確率が6分の1であるとは、投げる回数を何百回、何千回と増やしていくと、1の目が出る割合がしだいに6分の1に近づいていく、という意味である。\n\nさいころの目のように、どれが起こることも同じ程度に期待できるとき、それらは同様に確からしいという。起こりうる場合が全部でn通りあり、どれも同様に確からしいとする。そのうち、ことがらAの起こる場合がa通りなら、Aの起こる確率はn分のaだ。確率は0以上1以下の数で、必ず起こることの確率は1、決して起こらないことの確率は0になる。また、Aの起こらない確率は、1からAの起こる確率をひけば求められる。\n\n確率を求めるときに大切なのは、場合をもれなく、重なりなく数えることだ。2枚の硬貨を同時に投げるとき、2枚とも表、1枚が表で1枚が裏、2枚とも裏の3通りだから、表と裏が1枚ずつになる確率は3分の1だ、と考えるのはまちがいである。2枚の硬貨をAとBに区別して樹形図をかくと、表表、表裏、裏表、裏裏の4通りになる。表と裏が1枚ずつになるのはそのうち2通りなので、確率は4分の2、つまり2分の1だ。2つのさいころを投げる場合も、目の出方を縦と横に並べて整理すると36通りあり、出る目の和が7になるのは6通りなので、確率は6分の1になる。\n\n一方、集めたデータのばらつきを調べる方法も、中学2年で学ぶ。データを小さい順に並べ、全体を4等分する位置にある値を四分位数という。小さいほうから第1四分位数、第2四分位数、第3四分位数とよび、第2四分位数は中央値と同じだ。そして、第3四分位数から第1四分位数をひいた値を四分位範囲という。\n\nたとえば、7人の小テストの得点が2、4、5、6、8、9、10点だったとする。中央値は真ん中の6点だ。データの個数が奇数なので、中央値をのぞいて前半と後半に分ける。前半の2、4、5点の中央値4点が第1四分位数、後半の8、9、10点の中央値9点が第3四分位数で、四分位範囲は9－4＝5点となる。最小値、第1四分位数、中央値、第3四分位数、最大値の5つの値を、長方形の箱とその両側にのびるひげで表した図を箱ひげ図という。箱の部分には、真ん中に集まったおよそ半分のデータが入っている。\n\n最大値から最小値をひいた範囲は、極端に大きい値や小さい値が1つあるだけで大きく変わってしまう。それに対して四分位範囲は、真ん中の半分だけを見るので、そうした値の影響を受けにくい。また、箱ひげ図はいくつも並べてかけるので、クラスごとの得点や月ごとの気温など、複数の分布を比べるのに向いている。\n\n確率は、これから起こる偶然のことがらの起こりやすさを数で表す。箱ひげ図は、すでに集めたデータのばらつきを形で表す。どちらも、天気予報の降水確率や、調査結果のグラフを読み取るときに役立つ考え方だ。"},{"id":"m5b01","title":"ホットケーキがふくらむ秘密","kind":"理科","points":["一種類の物質が二種類以上の物質に分かれる化学変化を分解といい、熱分解や電気分解がある。","物質は原子からできている。原子の種類を元素といい、アルファベットの元素記号で表す。","原子が結びついた、物質の性質を示す最小の粒子が分子。物質は単体と化合物に分けられる。"],"body":"ホットケーキを焼くと、生地がふっくらとふくらむ。その秘密は、生地に混ぜるふくらし粉にある。ふくらし粉には、炭酸水素ナトリウムという物質がふくまれている。重そうともよばれる物質だ。これを加熱すると気体が発生し、その気体が生地の中に小さな泡をつくるのである。\n\n理科の実験で、試験管に入れた炭酸水素ナトリウムを加熱してみよう。発生した気体を石灰水に通すと白くにごるので、二酸化炭素だと分かる。試験管の口近くにたまった液体に青色の塩化コバルト紙をつけると、赤色に変わる。これは水である。あとに残った白い固体は炭酸ナトリウムで、もとの物質より水にとけやすく、水溶液にフェノールフタレイン溶液を加えると濃い赤色になる。\n\n一つの物質から、性質の違う三つの物質ができたことになる。このように、もとの物質とは別の物質ができる変化を化学変化という。中でも、一種類の物質が二種類以上の物質に分かれる化学変化を分解という。加熱による分解は熱分解とよばれ、酸化銀を加熱して銀と酸素に分けるのもその例だ。電流を流して分解することは電気分解という。水に少量の水酸化ナトリウムをとかして電流を流すと、陰極から水素、陽極から酸素が、体積の比でおよそ2対1の割合で発生する。\n\nでは、物質を細かく分けていくと、最後には何が残るのだろうか。19世紀のはじめ、イギリスのドルトンは、物質はそれ以上分けられない小さな粒子からできていると考えた。この粒子を原子という。原子は化学変化でそれ以上分割できず、種類によって質量や大きさが決まっている。また、化学変化で原子がなくなったり、新しくできたり、別の種類の原子に変わったりすることはない。\n\n原子の種類を元素といい、現在およそ120種類が知られている。元素は、アルファベット1文字または2文字の元素記号で表す。水素はH、酸素はO、炭素はC、窒素はN、ナトリウムはNa、銅はCu、銀はAgだ。2文字で表すときは、2文字目を小文字で書く。元素を性質にもとづいて整理した表を周期表という。\n\n原子がいくつか結びついてできた、その物質の性質を示す最小の粒子を分子という。たとえば水の分子は水素原子2個と酸素原子1個が、二酸化炭素の分子は炭素原子1個と酸素原子2個が結びついたものだ。物質は化学式で表すことができ、水はH₂O、二酸化炭素はCO₂と書く。ただし、銅や銀などの金属や塩化ナトリウムのように、分子というまとまりをつくらない物質もある。\n\n物質は、水素や酸素、銅のように一種類の元素だけでできている単体と、水や二酸化炭素のように二種類以上の元素でできている化合物に分けられる。分解できるのは化合物だ。分解とは、化合物をつくる原子の結びつきが組みかわり、より簡単な物質に分かれる変化だと言いかえられる。\n\nホットケーキがふくらむのも、原子の組みかえによって二酸化炭素の分子が生まれるからだ。台所で起こるささやかな変化の奥でも、目に見えない原子たちが、結びつく相手を変えているのである。"},{"id":"m5b02","title":"酸素を取る、酸素を渡す","kind":"理科","points":["化学反応式は、矢印の左に反応前、右に反応後の物質を化学式で書き、左右の原子の数をそろえる。","物質が酸素と結びつく変化を酸化といい、熱や光を出して激しく進む酸化を特に燃焼という。","酸化物から酸素を取り去る変化を還元という。還元が起こるときは、同時に酸化も起こっている。"],"body":"マグネシウムを燃やしたときのまぶしい光、古い自転車の赤茶色のさび、製鉄所で鉄鉱石から鉄を取り出す作業。まったく違って見えるこれらは、どれも酸素がかかわる化学変化だ。そのしくみを考える前に、まず化学変化を記号で書き表す方法を見ておこう。\n\n化学変化を化学式で表したものを化学反応式という。書き方には決まりがある。反応前の物質を矢印の左側に、反応後の物質を右側に書き、矢印の左右で原子の種類と数を等しくする。たとえば水素と酸素が結びついて水ができる変化は、2H₂＋O₂→2H₂Oと書く。左側には水素原子が4個、酸素原子が2個あり、右側にも水素原子4個、酸素原子2個がある。化学式の前の数字は、その分子がいくつあるかを表している。\n\nでは、酸素と結びつく変化を見ていこう。物質が酸素と結びつく化学変化を酸化といい、酸化によってできた物質を酸化物という。マグネシウムを加熱すると、熱と光を出して激しく燃え、白い酸化マグネシウムになる。化学反応式は2Mg＋O₂→2MgOだ。このように熱や光を出しながら激しく進む酸化を、特に燃焼という。銅を加熱すると、マグネシウムのように激しく燃えはしないが、表面が黒く変わって酸化銅ができる。\n\n酸化はいつも激しいとは限らない。鉄が空気中で少しずつさびるのも、ゆっくり進む酸化である。そのため鉄製品には、塗料をぬったり、ほかの金属でめっきをしたりして、空気や水にふれにくくする工夫がされている。また、ろうや木のように炭素と水素をふくむ物質が燃えると、炭素は二酸化炭素に、水素は水になる。\n\n反対に、酸化物から酸素を取り去る化学変化を還元という。黒い酸化銅と炭素の粉末をよく混ぜて加熱すると、気体が発生して石灰水が白くにごり、試験管には赤色の物質が残る。この物質を薬さじでこすると金属光沢が出るので、銅だと分かる。化学反応式は2CuO＋C→2Cu＋CO₂である。\n\nこの反応をよく見ると、酸化銅は酸素をうばわれて還元され、炭素は酸素と結びついて酸化されている。つまり、還元が起こるときには、同時に酸化も起こっているのだ。炭素のように酸素と結びつきやすい物質が、酸化物から酸素を引きはがすのである。水素にも同じはたらきがあり、加熱した酸化銅に水素を通すと、銅と水ができる。\n\nこの実験では、火を消す前に、石灰水からガラス管をぬいておく。先に火を消すと、石灰水が逆流して加熱した試験管が割れるおそれがあるからだ。火を消したあとはゴム管をピンチコックで閉じ、できた銅に空気がふれて再び酸化されるのを防ぐ。\n\n還元は、わたしたちの暮らしを支えている。鉄は自然の中で、多くが酸素と結びついた鉄鉱石の形で存在する。製鉄所では、鉄鉱石をコークスとともに高炉で加熱し、酸素を取り除いて鉄を取り出している。さびるのも酸化、鉄をつくるのも還元。酸素の受けわたしは、身の回りのあちこちで起きているのである。"},{"id":"m5b03","title":"燃えて消えた重さのゆくえ","kind":"理科","points":["化学変化の前後で、物質全体の質量は変わらない。これを質量保存の法則という。","結びつく物質の質量の比は一定で、銅と酸素はおよそ4対1、マグネシウムと酸素は3対2で結びつく。","熱を出して温度が上がる化学変化を発熱反応、熱を吸収して温度が下がる化学変化を吸熱反応という。"],"body":"紙を燃やすと、あとには少しの灰しか残らず、重さが減ったように見える。ところが、スチールウールを燃やすと、燃えたあとの方が重くなる。燃えると軽くなるものと、重くなるもの。この違いはどこから来るのだろうか。\n\n鍵になるのは、気体の出入りだ。紙は炭素や水素をふくむので、燃えると二酸化炭素や水蒸気になって空気中へ出ていく。そのぶん軽くなったように見えるのである。一方、スチールウールは、鉄が空気中の酸素と結びついて酸化鉄になる。結びついた酸素のぶんだけ、重くなるのだ。\n\nこのことを確かめる実験がある。炭酸水素ナトリウムとうすい塩酸を、ふたをしめた容器の中で反応させる。二酸化炭素が発生するが、反応の前後で容器全体の質量をはかると、変わっていない。ところが、ふたをゆるめると気体が外へ出ていき、そのぶん質量が小さくなる。また、うすい硫酸に塩化バリウム水溶液を加えると、硫酸バリウムの白い沈殿ができるが、このときも全体の質量は変わらない。\n\nこのように、化学変化の前後で、物質全体の質量は変わらない。これを質量保存の法則という。化学変化では原子の組み合わせが変わるだけで、原子の種類と数は変わらないからだ。出入りする気体までふくめて考えれば、全体の質量は保たれているのである。この法則は、状態変化や、物質が水にとけるときにも成り立つ。\n\n結びつく物質の質量には、もう一つ決まりがある。銅の粉末を加熱すると酸化銅になるが、何度加熱しても、ある量以上には質量が増えない。銅がすべて酸素と結びつくと、それ以上は反応しないからだ。調べると、銅と酸素はおよそ4対1の質量の比で結びつく。たとえば銅0.8gからは酸化銅が1.0gでき、0.2gの酸素が結びついたことになる。マグネシウムと酸素ではおよそ3対2で、マグネシウム0.6gからは酸化マグネシウムが1.0gできる。反応する物質の質量の比は、いつも一定なのである。\n\n化学変化では、熱の出入りも起こる。鉄粉と活性炭を混ぜて食塩水を加えると、鉄が酸化して温度が上がる。使い捨てカイロは、このしくみを利用したものだ。燃焼も、熱を出す化学変化である。このように、熱を出して周囲の温度が上がる化学変化を発熱反応という。\n\n反対に、周囲から熱を吸収して温度が下がる化学変化もある。炭酸水素ナトリウムとクエン酸を水の中で混ぜると、二酸化炭素が発生し、温度が下がる。塩化アンモニウムと水酸化バリウムを混ぜたときにも、アンモニアが発生して温度が下がる。このような化学変化を吸熱反応という。\n\n物質が姿を変えても、原子は消えずにどこかへ移っている。そして、その変化には熱の出入りがともなう。冬の手を温めるカイロのぬくもりも、目に見えない原子の組みかえが生み出しているのである。"},{"id":"m5b04","title":"葉の裏にある小さな口","kind":"理科","points":["植物の細胞には核や細胞膜のほか、細胞壁や液胞があり、葉などの細胞には葉緑体が見られる。","光合成は、葉緑体で光を受けて水と二酸化炭素からデンプンなどをつくり、酸素を出すはたらきだ。","植物は昼も夜も呼吸をしている。また、気孔から水を水蒸気として出す蒸散を行っている。"],"body":"晴れた日、植物の枝にポリエチレンの袋をかぶせて口をしばっておくと、しばらくして袋の内側が白くくもり、やがて水滴がつく。袋の中にあるのは葉と茎だけだから、この水は植物のからだから出てきたものだ。じっとしているように見える植物も、からだの中では休みなくはたらいている。\n\n植物のからだは、細胞という小さな部屋のようなものが集まってできている。顕微鏡で見ると、細胞には酢酸カーミン液などでよく染まる核があり、細胞はうすい細胞膜で包まれている。ここまでは動物の細胞と同じだ。植物の細胞にはさらに、からだを支えるじょうぶな細胞壁や、成長した細胞で大きく目立つ液胞があり、葉などの細胞には緑色の粒である葉緑体が見られる。形やはたらきが同じ細胞が集まって組織となり、組織が集まって葉や茎、根などの器官ができている。\n\n葉緑体では光合成が行われる。光合成とは、光のエネルギーを使い、根から吸い上げた水と空気中から取り入れた二酸化炭素を材料にして、デンプンなどの養分をつくるはたらきだ。このとき酸素もできて、空気中に出される。日光に当てた葉をあたためたエタノールで脱色し、ヨウ素液につけると青紫色に変わるので、デンプンができたことが分かる。アルミニウムはくでおおって光を当てなかった部分や、ふ入りの葉の白い部分は、色が変わらない。光合成には、光と葉緑体が必要なのだ。\n\n植物も、動物と同じように呼吸をしている。酸素を取り入れて二酸化炭素を出すはたらきで、昼も夜も休まず行われる。それなのに昼の植物が二酸化炭素を吸収しているように見えるのは、光が十分に当たると、呼吸で出す量よりも光合成で取り入れる二酸化炭素の量の方が多くなるからだ。光合成が行われない夜は、呼吸だけが行われる。\n\n葉の表皮には、気孔という小さなすきまがある。気孔は三日月形をした二つの孔辺細胞に囲まれていて、開いたり閉じたりする。光合成や呼吸に使う酸素や二酸化炭素は、ここから出入りする。そして、からだの中の水も、水蒸気となって気孔から出ていく。これを蒸散という。冒頭の袋の水滴は、蒸散で出た水蒸気が冷えて水にもどったものだったのだ。多くの植物では、気孔は葉の表側より裏側に多い。\n\n蒸散は、根からの水の吸い上げにも役立っている。葉から水が出ていくと、それを補うように、根から茎を通って水が引き上げられるのだ。根は、先端近くにある細い根毛によって土にふれる面積を広げ、水や水にとけた肥料分を吸収する。吸収された水は、道管を通って葉まで運ばれる。一方、葉でつくられたデンプンは水にとけやすい物質に変えられ、師管を通ってからだの各部分へ運ばれる。道管と師管が集まった束を維管束という。\n\n光合成で養分をつくり、呼吸で生きるためのエネルギーを取り出し、蒸散で水を吸い上げる。葉の裏にある無数の小さな口は、植物が生きるためのはたらきを、休みなく支えているのである。"},{"id":"m5b05","title":"おにぎり一口の大旅行","kind":"理科","points":["食物は消化酵素で分解され、ブドウ糖やアミノ酸などとなって小腸の柔毛から吸収される。","血液は心臓から送り出され、肺で受け取った酸素や吸収した養分を全身の細胞に届ける。","刺激は感覚神経から脳や脊髄に伝わる。意識と関係なく起こる反射では、脊髄から命令が出る。"],"body":"おにぎりを一口食べたとしよう。米にふくまれるデンプンは、そのままでは大きすぎて、からだに取りこむことができない。からだの中で、デンプンはどのように分解され、どこへ運ばれ、どう使われるのか。その道のりを追ってみよう。\n\n食物を分解して、吸収できる物質に変えることを消化という。口の中では、だ液にふくまれる消化酵素のアミラーゼが、デンプンを分解しはじめる。胃では、胃液にふくまれるペプシンがタンパク質を分解する。肝臓でつくられる胆汁は、消化酵素をふくまないが、脂肪の消化を助ける。さらに、すい液や小腸の壁の消化酵素によって、最終的にデンプンはブドウ糖に、タンパク質はアミノ酸に、脂肪は脂肪酸とモノグリセリドに分解される。\n\n分解された養分は、おもに小腸で吸収される。小腸の内側の壁には多くのひだがあり、その表面は柔毛という小さな突起でびっしりとおおわれている。このつくりによって表面積がとても大きくなり、養分を効率よく吸収できる。ブドウ糖とアミノ酸は柔毛の毛細血管に入り、肝臓を通って全身へ運ばれる。脂肪酸とモノグリセリドは柔毛の中で再び脂肪になり、リンパ管に入る。\n\n運ばれた養分を使うには、酸素が必要だ。息を吸うと、空気は気管を通って肺に入る。肺は肺胞という小さな袋がたくさん集まってできていて、そのまわりを毛細血管が取り巻いている。ここで空気中の酸素が血液に取りこまれ、血液中の二酸化炭素が出される。全身の細胞は、届いた酸素を使って養分を分解し、生きるためのエネルギーを取り出している。このとき二酸化炭素と水ができる。これを細胞による呼吸という。\n\n酸素や養分を運ぶのは血液である。心臓は筋肉でできたポンプで、規則正しく縮んで血液を送り出す。心臓から送り出される血液が流れる血管を動脈、心臓にもどる血液が流れる血管を静脈という。心臓から肺を通ってもどる道すじを肺循環、全身をめぐってもどる道すじを体循環という。赤血球にふくまれるヘモグロビンは、酸素の多いところで酸素と結びつき、少ないところで酸素をはなす。液体成分の血しょうは、養分や、二酸化炭素などの不要な物質をとかして運ぶ。\n\nこうして得たエネルギーで、わたしたちはからだを動かす。目や耳、皮膚などの感覚器官が受け取った刺激は、感覚神経を通って脳や脊髄に伝わる。脳と脊髄を中枢神経といい、そこから出された命令が運動神経を通って筋肉に伝わり、反応が起こる。ところが、熱いものに思わずふれたときは、熱いと感じる前に手を引っこめている。このように、刺激に対して意識とは関係なく起こる反応を反射といい、命令は脳ではなく脊髄から出される。危険からからだをすばやく守るしくみだ。\n\n一口のおにぎりは、消化、吸収、呼吸、循環というはたらきを経て、筋肉を動かすエネルギーになる。一つ一つは別々のはたらきに見えても、からだの中ではすべてがつながっているのである。"},{"id":"m5b06","title":"たこ足配線はなぜ危ない","kind":"理科","points":["直列回路では電流がどこでも等しく、並列回路では各部分に加わる電圧が電源の電圧に等しい。","電圧は抵抗と電流の積で表される。これをオームの法則といい、抵抗の単位はオーム（Ω）だ。","電力（W）は電圧と電流の積で、電力に時間をかけると電力量や熱量（J）が求められる。"],"body":"一つのコンセントにたくさんの電気器具をつなぐ、いわゆるたこ足配線は危ないと言われる。なぜだろうか。その答えには、電流と電圧、そして抵抗の関係が深くかかわっている。\n\n電流の通り道を回路という。電気器具を一本の道すじでつなぐのが直列回路、枝分かれさせてつなぐのが並列回路だ。電流の大きさの単位はアンペア（A）、電流を流そうとするはたらきである電圧の単位はボルト（V）である。電流計は回路に直列に、電圧計ははかりたい部分に並列につなぐ。\n\n直列回路では、電流の大きさはどこでも等しく、各部分に加わる電圧の和が電源の電圧に等しい。並列回路では、各部分に加わる電圧はどれも電源の電圧に等しく、枝分かれした電流の和が、分かれる前の電流に等しい。水の流れにたとえるなら、電圧は水を押し出すポンプのはたらき、電流は流れる水の量にあたる。一本道なら流れる量はどこも同じで、枝分かれすれば流れも分かれる、と考えるとイメージしやすい。\n\n電流の流れにくさを電気抵抗、または抵抗といい、単位はオーム（Ω）だ。金属線に加わる電圧を大きくすると、流れる電流も比例して大きくなる。この関係をオームの法則といい、電圧（V）＝抵抗（Ω）×電流（A）と表せる。たとえば10Ωの抵抗に3Vの電圧を加えると、流れる電流は3÷10で0.3Aになる。金属のように電流を通しやすい物質を導体、ガラスやゴムのように通しにくい物質を不導体、または絶縁体という。\n\n抵抗をつないだときの、回路全体の抵抗も求められる。直列につなぐと、全体の抵抗は各抵抗の和になる。10Ωと20Ωを直列につなぐと30Ωで、6Vの電源なら回路には0.2Aの電流が流れる。並列につなぐと、全体の抵抗はどちらの抵抗よりも小さくなる。電流の通り道が増えるからだ。\n\n電気器具が光や熱、音などを出す能力の大きさは電力で表し、単位はワット（W）である。電力は電圧と電流の積で、電力（W）＝電圧（V）×電流（A）となる。たとえば100Vで1200Wのドライヤーには、1200÷100で12Aの電流が流れる。電力に時間をかけたものが電力量で、単位はジュール（J）だ。このドライヤーを1分間、つまり60秒使うと、電力量は72000Jになる。電熱線から発生する熱量も、同じように電力×時間で求められる。\n\n家庭のコンセントの配線は並列になっていて、どの器具にも100Vの電圧が加わる。並列につなぐ器具を増やすと、コンセントに流れる電流はそれぞれの電流の和になるから、どんどん大きくなる。たとえば1200Wのドライヤーと1000Wの電気ストーブを同じコンセントから同時に使えば、12Aと10Aを合わせて22Aもの電流が流れる。多くのコンセントには、使える電流の上限が15Aなどと決められている。それをこえる電流が流れると導線が発熱し、火災の原因になりかねない。これが、たこ足配線が危ない理由である。\n\nオームの法則や電力の式は、テストのためだけのものではない。器具に書かれたワット数から流れる電流を計算すれば、安全な使い方の目安が立てられるのだ。"},{"id":"m5b07","title":"磁石を動かすと電気が生まれる","kind":"理科","points":["異なる物質をこすり合わせると静電気が生じる。同じ種類の電気はしりぞけ合い、違う種類は引き合う。","電流のまわりには磁界ができ、磁界の中の電流は力を受ける。これを利用したのがモーターだ。","コイルの中の磁界が変化すると電流が流れる。この電磁誘導を利用したのが発電機である。"],"body":"空気が乾いた日にセーターを脱ぐと、パチパチと音がすることがある。下じきで髪の毛をこすってから持ち上げると、髪が下じきに引きつけられて逆立つ。どちらも静電気のしわざだ。電気と磁石、そして運動。この三つは、実は深く結びついている。\n\n種類の違う二つの物質をこすり合わせると、一方は＋の電気を、もう一方は－の電気を帯びる。これが静電気である。同じ種類の電気どうしはしりぞけ合い、違う種類の電気どうしは引き合う。たまった電気が流れ出したり、空間を移動したりする現象を放電といい、雷は自然の中で起こる大規模な放電だ。\n\n中の空気をぬいて気圧を低くしたガラス管に大きな電圧を加えると、管の中を電流が流れて光る。これを真空放電という。特別な放電管を使うと、－極から何かが飛び出しているようすが観察できる。これを陰極線といい、その正体は－の電気をもった非常に小さな粒子、電子の流れである。導線を流れる電流も電子の移動によるもので、電子は－極から＋極へ向かって動いている。電流の向きを＋極から－極と決めたのは、電子が見つかる前のことだった。\n\n磁石のまわりには、磁力がはたらく空間がある。これを磁界という。磁界の向きは方位磁針のN極がさす向きで表し、そのようすを表した線を磁力線という。磁界は、電流のまわりにもできる。まっすぐな導線に電流を流すと、導線を中心とした同心円状の磁界ができる。その向きは、電流の向きに右ねじを進めるときに、ねじを回す向きと同じだ。導線を巻いてコイルにして電流を流すと、棒磁石のような磁界ができる。これを利用したのが電磁石で、コイルに鉄心を入れると磁界はさらに強くなる。\n\nさらに、磁界の中に置いた導線に電流を流すと、導線は力を受けて動く。力の向きは電流の向きと磁界の向きによって決まり、どちらかを逆にすると力の向きも逆になる。電流を大きくしたり、磁界を強くしたりすると、力は大きくなる。この力を利用して、コイルが回転し続けるようにした装置がモーターだ。\n\nでは反対に、磁石を動かして電流をつくることはできないだろうか。コイルに棒磁石を出し入れすると、コイルにつないだ検流計の針がふれる。コイルの中の磁界が変化すると、コイルに電圧が生じて電流が流れるのだ。この現象を電磁誘導、流れる電流を誘導電流という。1831年にイギリスのファラデーが発見した。誘導電流は、磁石を速く動かすほど、磁石が強いほど、コイルの巻数が多いほど大きくなる。磁石を止めると、電流は流れなくなる。\n\n電磁誘導を利用して電流をつくり出すのが発電機だ。発電所では、タービンを回して大きな発電機を動かしている。こうしてつくられるのは、流れる向きが周期的に変わる交流で、家庭のコンセントにも交流が届く。1秒間にくり返す変化の回数を周波数といい、東日本では50ヘルツ、西日本では60ヘルツだ。一方、乾電池から流れる、向きの変わらない電流は直流という。\n\n電気と磁石が互いを生み出すという発見は、モーターと発電機を通して、わたしたちの暮らしを大きく変えた。セーターのパチパチから発電所の巨大な機械まで、電気の世界は一本の糸でつながっているのである。"},{"id":"m5b08","title":"天気は西からやってくる","kind":"理科","points":["高気圧の中心付近は下降気流で晴れやすく、低気圧の中心付近は上昇気流で雲ができやすい。","寒冷前線は短時間の強い雨と通過後の気温低下を、温暖前線は長時間のおだやかな雨をもたらす。","日本の天気は偏西風で西から東へ変わりやすい。冬は西高東低、夏は南高北低の気圧配置になる。"],"body":"天気予報を見ていると、雨の区域が西から東へ移っていくことが多い。たとえば九州で降った雨が、翌日には近畿、その次の日には関東へと進んでいく。日本の天気には、なぜこのような流れがあるのだろうか。天気の変化を読み解く鍵は、空気の重さと動きにある。\n\n空気にも重さがあり、地上のものは上にある空気から押されている。この空気による圧力を大気圧、または気圧という。圧力とは、面を垂直に押す力を、力がはたらく面積で割ったものだ。海面と同じ高さでの気圧はおよそ1013ヘクトパスカル（hPa）で、これを1気圧という。高い山の上では上にある空気が少ないため、気圧が低くなる。山の上で、密閉された菓子の袋がふくらむのはそのためだ。\n\n天気図では、気圧の等しい地点を等圧線で結ぶ。まわりより気圧の高いところが高気圧、低いところが低気圧である。高気圧の中心付近では下降気流が生じ、雲ができにくいので晴れやすい。地上付近では、高気圧から時計回りに風が吹き出す。低気圧の中心付近では上昇気流が生じる。空気は上昇すると膨張して温度が下がり、露点に達すると水蒸気が水滴になって雲ができる。そのため低気圧の付近はくもりや雨になりやすく、地上では反時計回りに風が吹きこむ。\n\n気温や湿度がほぼ一様な、大きな空気のかたまりを気団という。性質の違う気団が接するところには前線ができる。寒気が暖気の下にもぐりこんで暖気を押し上げるのが寒冷前線で、積乱雲が発達し、せまい範囲に短時間の強い雨が降る。通過後は風向きが北寄りに変わり、気温が急に下がる。暖気が寒気の上にはい上がるのが温暖前線で、乱層雲などの雲が広がり、広い範囲に長時間おだやかな雨が降る。通過後は気温が上がる。\n\n日本の上空には、偏西風という強い西風が一年中吹いている。低気圧や高気圧はこの風に流されて西から東へ移動するため、天気も西から東へ変わることが多い。冒頭の疑問の答えは、ここにある。\n\n季節ごとの天気にも特徴がある。冬は大陸でシベリア気団が発達し、西高東低の気圧配置となって、冷たい北西の季節風が吹く。この風は日本海の上で水蒸気をふくんで雲をつくり、日本海側に多くの雪を降らせる。山をこえた太平洋側では、乾燥した晴れの日が多くなる。春と秋は、移動性高気圧と低気圧が交互に通過するため、天気が周期的に変わる。\n\n初夏には、北のオホーツク海気団と南の小笠原気団の間に停滞前線ができ、雨の多いつゆ（梅雨）となる。夏は小笠原気団が勢力を強めて南高北低の気圧配置となり、南東の季節風が吹いて蒸し暑い日が続く。夏から秋にかけては、熱帯の海上で発生した熱帯低気圧が発達した台風が近づき、大雨や強風をもたらすことがある。\n\n空の変化は気まぐれに見えて、気圧と気団と風の決まりにしたがっている。天気図を見るときに等圧線や前線に注目すれば、明日の空を自分で予想できるようになるだろう。"},{"id":"m5c01","title":"等高線が語る山の形","kind":"地理","points":["2万5千分の1の地形図では地図上の1cmが実際の250m。実際の距離は地図上の長さ×縮尺の分母で求める。","等高線は高さが同じ地点を結んだ線で、間隔がせまいほど傾斜が急。張り出しは尾根、食いこみは谷を表す。","地域調査は、テーマと仮説を決め、野外調査・聞き取り調査・文献調査で確かめ、まとめて発表する。"],"body":"平らな紙の上に、山の高さや谷の深さを表すことはできるだろうか。答えは「できる」だ。国土地理院が発行する地形図には、土地の起伏から建物の種類まで、さまざまな情報が決まりにしたがって描きこまれている。読み方さえ分かれば、一枚の地図から、その土地の姿が目の前にあるように浮かび上がってくる。\n\nまず知っておきたいのが縮尺だ。縮尺とは、実際の距離を地図上でどれだけ縮めたかを表す割合である。よく使われる2万5千分の1の地形図では、地図上の1cmが実際には2万5千cm、つまり250mにあたる。地図上で4cmなら1kmだ。実際の距離は「地図上の長さ×縮尺の分母」で求められる。5万分の1の地形図なら、同じ1cmが500mになる。分母が小さい2万5千分の1のほうが、せまい範囲をくわしく表しているわけだ。\n\n次に等高線である。等高線は、海面からの高さが同じ地点を結んだ線だ。2万5千分の1の地形図では、10mごとに細い主曲線、50mごとに太い計曲線が引かれている。等高線の間隔がせまいところは傾斜が急で、広いところはゆるやかだ。また、等高線が高いほうから低いほうへ張り出しているところは尾根、低いほうから高いほうへ食いこんでいるところは谷になる。雨水は谷に集まるので、川がどこを流れるかも等高線から予想できる。\n\n地図記号は、土地の使われ方や建物を表す小さなしるしだ。その形には由来をもつものが多い。学校の「文」は文字から、寺院の「卍」は仏教で使われるしるしから、神社の記号は鳥居の形からきている。消防署の記号は、江戸時代の火消しが使った道具をかたどったものだ。2019年には、過去の津波や洪水などの教訓を伝える石碑を表す「自然災害伝承碑」の記号が新しく加えられた。田や畑、果樹園などの土地利用を読み取れば、その地域の産業の様子も見えてくる。\n\n地形図は、地域調査の強い味方でもある。地域調査では、まず調べたいテーマを決め、「この町に坂が多いのは、台地の上に広がっているからではないか」のように仮説を立てる。そのうえで、実際に歩いて観察する野外調査、地元の人に話を聞く聞き取り調査、図書館や役所の資料を使う文献調査などを行って、仮説を確かめていく。歩くときは、道順と気づいたことを書きこんだルートマップをつくると便利だ。\n\n発行された年代のちがう地形図を比べるのもおもしろい。かつて田が広がっていた場所に住宅地ができていたり、海岸が埋め立てられて港や工場になっていたりと、地域の移り変わりがよく分かる。調べた結果は地図やグラフを使ってまとめ、発表して意見を交換しよう。\n\nふだん何気なく歩いている通学路も、地形図と重ねると新しい発見がある。あの坂道の正体が等高線の集まりだと分かれば、見慣れた町の景色が少し違って見えてくるはずだ。"},{"id":"m5c02","title":"日本の川はなぜ急流か","kind":"地理","points":["日本は環太平洋造山帯に属し、国土の約4分の3が山地と丘陵。川は短く急で、扇状地や三角州をつくる。","夏は南東、冬は北西の季節風が吹く。日本の気候は北海道・日本海側・太平洋側・内陸・瀬戸内・南西諸島の六つに分けられる。","地震・津波・火山・大雨などの災害が多く、ハザードマップの活用や公助・自助・共助で減災をめざす。"],"body":"日本の川と世界の大河を、河口からの距離と標高のグラフで比べてみると、その違いに驚かされる。大陸を流れる川は何千kmもかけてゆっくりと海へ下るのに対し、日本の川は長さが短く、山から海まで一気に流れ下る。日本の川が急流なのは、せまい国土に高い山々がひしめいているからだ。\n\n日本列島は、太平洋を取り巻く環太平洋造山帯の一部で、国土の約4分の3を山地と丘陵がしめる。中央部には3000m級の山々が連なる飛驒、木曽、赤石の三つの山脈があり、日本アルプスと呼ばれる。その東にはフォッサマグナと呼ばれる大きな溝状の地形があり、これを境に、東日本では山地がほぼ南北に、西日本ではほぼ東西に連なっている。\n\n急な川は山をけずり、大量の土砂を運ぶ。川が山地から平地に出るところでは、流れが急にゆるやかになって土砂が積もり、扇形の扇状地ができる。水はけがよいため、果樹園に利用されることが多い。河口付近では細かい土砂が積もって三角州ができる。日本の平野の多くは、こうして川が運んだ土砂でつくられてきた。\n\n気候を見ると、日本の大部分は温帯に属し、北海道は冷帯（亜寒帯）、南西諸島は亜熱帯の気候である。大きな特色は季節風だ。夏は太平洋から湿った南東の季節風が吹き、太平洋側に雨を降らせる。冬は大陸から北西の季節風が吹き、日本海をわたるときに水分をふくんで、日本海側に多くの雪を降らせる。こうした違いから、日本の気候は北海道、日本海側、太平洋側、内陸（中央高地）、瀬戸内、南西諸島の六つに分けられる。瀬戸内は季節風が中国山地と四国山地にさえぎられ、一年を通して雨が少ない。\n\n豊かな自然は、災害と隣り合わせでもある。日本はいくつものプレートの境目に位置するため、地震や火山の噴火が多い。1995年の阪神・淡路大震災では建物の倒壊や火災が、2011年の東日本大震災では巨大な津波が、大きな被害をもたらした。梅雨や台風の時期には大雨による洪水や土砂くずれが起こりやすく、東北地方の太平洋側では、夏に吹く冷たい北東の風「やませ」によって冷害が起こることもある。\n\n災害を完全に防ぐことはできないが、被害をできるだけ小さくする減災はできる。国や都道府県、市町村は堤防やダムを整え、災害の起こりやすい場所や避難場所を示したハザードマップをつくっている。国や地方公共団体による救助や支援を公助、自分や家族の身を自分で守ることを自助、地域の人々が助け合うことを共助という。\n\n自分の住む地域のハザードマップを、一度開いてみよう。家のまわりの川や坂、避難場所までの道のりを知っておくことが、いざというときに自分と家族を守る第一歩になる。"},{"id":"m5c03","title":"火山の島から古都まで","kind":"地理","points":["九州は火山が多く、シラス台地ではさつまいもや茶の栽培、畜産がさかん。宮崎平野では促成栽培が行われる。","中国・四国は山陰・瀬戸内・南四国に分かれる。本州四国連絡橋で交通が便利になる一方、過疎が課題だ。","近畿では京都・奈良の歴史的な景観の保全、阪神工業地帯、琵琶湖の水質を守る取り組みが特色である。"],"body":"新幹線で東京から西へ向かうと、名古屋、京都、大阪を過ぎ、瀬戸内海に沿って山陽地方を走り、やがて海の下のトンネルを抜けて九州へ入る。窓の外の景色が少しずつ変わっていくように、西日本の各地方にはそれぞれ違った特色がある。九州、中国・四国、近畿の三つの地方を見ていこう。\n\n九州地方の特色は、火山とともにある暮らしだ。阿蘇山には、噴火でできた巨大なくぼ地であるカルデラがあり、その中に町や田畑が広がっている。鹿児島の桜島は今も噴火をくり返し、人々は降り積もる火山灰に悩まされてきた。一方で、火山は温泉や地熱発電という恵みももたらす。九州南部には、火山の噴出物が積もってできたシラス台地が広がる。水もちが悪く稲作に向かないため、さつまいもや茶の栽培、豚や肉用牛などを育てる畜産がさかんだ。温暖な宮崎平野では、ビニールハウスを使って野菜の出荷時期を早める促成栽培が行われている。\n\n九州北部では、1901年に操業を始めた官営の八幡製鉄所をきっかけに北九州工業地帯（地域）が発展した。その後、工業の中心は鉄鋼からIC（集積回路）や自動車へと移った。かつて深刻な公害を経験した北九州市は、リサイクル工場を集めたエコタウンを整え、環境に配慮したまちづくりを進めている。\n\n中国・四国地方は、日本海側の山陰、瀬戸内海に面した瀬戸内、太平洋側の南四国に分けられる。雨の少ない瀬戸内では、昔からため池をつくって水を確保してきた。臨海部には石油化学コンビナートが並び、瀬戸内工業地域を形づくっている。1988年の瀬戸大橋の開通をはじめ、本州と四国は三つのルートの本州四国連絡橋で結ばれ、行き来が便利になった。その反面、買い物客が大都市へ吸い寄せられる動きも生まれた。山間部や離島では若い人が都市へ出ていく過疎が進み、特産品を生かした町おこし・村おこしが各地で取り組まれている。\n\n近畿地方は、古くから日本の政治や文化の中心だった。奈良や京都には古い寺社や町並みが数多く残り、京都市では建物の高さやデザイン、看板などを制限して、歴史的な景観を守っている。大阪は江戸時代に「天下の台所」と呼ばれた商業の町で、大阪湾の沿岸を中心に阪神工業地帯が広がり、内陸部には高い技術をもつ中小企業の工場が多い。「近畿の水がめ」と呼ばれる琵琶湖では、生活排水などが原因で赤潮が発生したため、住民の運動をきっかけに、りんをふくむ合成洗剤の使用をやめる取り組みが進められた。\n\n火山とともに生きる九州、交通の変化と向き合う中国・四国、歴史と環境を守る近畿。同じ西日本でも、自然や歴史の条件によって人々の暮らし方はさまざまだ。旅行で訪れるときは、その土地の地形や産業に注目してみよう。見慣れた景色の奥に、人々の工夫が見えてくるはずだ。"},{"id":"m5c04","title":"東日本、四つの顔","kind":"地理","points":["中部は東海・中央高地・北陸に分かれ、中京工業地帯は製造品出荷額が全国一。北陸は米どころで伝統産業も多い。","関東には日本の人口の約3分の1が集まり、京浜・京葉・北関東の工業地帯（地域）や近郊農業が発達している。","東北は稲作や果樹栽培、三陸の養殖がさかん。北海道は明治の開拓以降、稲作・畑作・酪農が大規模に行われる。"],"body":"日本でいちばん多くの工業製品を生み出している工業地帯はどこだろうか。首都東京の周辺を思いうかべるかもしれないが、答えは愛知県を中心とする中京工業地帯だ。東日本の各地方には、こうした意外な素顔がある。中部、関東、東北、北海道の順に見ていこう。\n\n中部地方は、東海、中央高地、北陸の三つに分けられる。東海の中京工業地帯は自動車工業を中心に発展し、製造品出荷額が全国一である。静岡県には楽器やオートバイの生産で知られる東海工業地域があり、温暖な台地では茶の栽培がさかんだ。山に囲まれた中央高地では、甲府盆地の扇状地でぶどうやももが、長野県ではりんごが栽培され、夏もすずしい高原ではレタスなどの高原野菜がつくられる。冬に雪の多い北陸は水田単作の米どころで、農作業のできない冬の副業から、漆器などの伝統産業や地場産業が育った。\n\n関東地方には、日本の人口のおよそ3分の1が集まっている。首都東京には国の機関や大企業の本社が集中し、周辺の県から多くの人が通勤・通学してくるため、都心部では昼間人口が夜間人口を大きく上回る。東京湾の沿岸には京浜工業地帯や京葉工業地域が広がり、高速道路の整った内陸部には、工業団地が集まる北関東工業地域が発展した。大消費地に近い利点を生かし、新鮮な野菜などを出荷する近郊農業もさかんだ。\n\n東北地方は、日本有数の稲作地帯である。中央を奥羽山脈が南北に走り、夏には太平洋側に「やませ」と呼ばれる冷たい北東の風が吹いて、冷害をもたらすことがある。そのため、寒さに強い稲の品種改良が進められてきた。青森県のりんご、山形県のさくらんぼなど、果樹栽培もさかんだ。三陸海岸は入り組んだリアス海岸で、波のおだやかな湾ではかきやわかめの養殖が行われ、沖合には暖流と寒流がぶつかる潮目があって好漁場になっている。2011年の東日本大震災で大きな被害を受けた地域では、復興への歩みが続いている。\n\n北海道では、明治時代に開拓使が置かれ、屯田兵などによって本格的な開拓が進められた。もともとはアイヌの人々が暮らしてきた土地で、アイヌ語に由来する地名が今も多く残る。泥炭地が広がっていた石狩平野では、ほかの土地から土を運び入れる客土によって稲作ができるようになった。十勝平野では、小麦やじゃがいも、てんさいなどを年ごとに順番に作る輪作による大規模な畑作が、根釧台地では酪農が行われている。\n\n同じ東日本でも、気候や地形、歴史が違えば、産業も暮らしもまったく違う形になる。それぞれの特色がどんな条件から生まれたのかを考えながら地図帳を開くと、日本地図がぐっと立体的に見えてくるはずだ。"},{"id":"m5b09","title":"天ぷらそばはどこから来た","kind":"産業","points":["日本の食料自給率はカロリーで見て40％を下回る。米はほぼ自給できるが、小麦や大豆は多くを輸入する。","近郊農業や促成栽培、抑制栽培など地域の特色を生かす一方、高齢化やあとつぎ不足が課題である。","排他的経済水域の設定で遠洋漁業がおとろえ、養殖漁業や栽培漁業など育てる漁業が注目されている。"],"body":"天ぷらそばを一杯思いうかべてみよう。そば粉、天ぷらのえび、衣の小麦粉、揚げ油、そしてつゆのしょうゆの原料となる大豆。実は、これらの材料の多くは外国から輸入されたものだ。日本の食卓は、世界とつながることで成り立っている。\n\n国内で消費される食料のうち、国内で生産された割合を食料自給率という。カロリーで計算した日本の食料自給率は40％を下回り、主な先進国の中でも低い水準にある。品目別に見ると、米はほぼ自給できている一方、小麦や大豆はその大部分を輸入にたよっている。肉や卵は国内でも生産されているが、家畜のえさとなる穀物の多くは輸入品だ。米の消費が減り、パンや肉、油を使った料理が増えるという食生活の変化も、自給率が下がった理由の一つである。\n\n日本の農業には、地域ごとに特色がある。東北地方や北陸地方は、米の生産がさかんな穀倉地帯だ。大都市の近くでは、新鮮な野菜や花を出荷する近郊農業が行われている。冬でも温暖な高知平野や宮崎平野では、ビニールハウスなどを使って野菜の出荷時期を早める促成栽培がさかんである。反対に、夏でもすずしい長野県や群馬県の高原では、キャベツやレタスなどの出荷時期を遅らせる抑制栽培が行われている。北海道では大規模な畑作や酪農が、九州南部では肉牛や豚などの畜産がさかんだ。\n\n一方で、日本の農業は多くの課題をかかえている。農家一戸あたりの耕地面積がせまく、アメリカ合衆国などの大規模な農業に比べて生産費がかかりやすい。農業で働く人の高齢化が進み、あとをつぐ人も不足している。安い輸入農産物との競争もきびしい。そこで、品質の高さや安全性を売りにしたブランド化や、地元でとれたものを地元で消費する地産地消などの取り組みが、各地で進められている。\n\n水産業はどうだろうか。日本の近海には、暖流の黒潮（日本海流）と寒流の親潮（千島海流）がぶつかる潮目や、浅く平らな大陸棚があり、魚の集まる好漁場となっている。日本はかつて、世界でも有数の漁獲量をほこっていた。\n\nしかし1970年代に、各国が沿岸から200海里の排他的経済水域を設定すると、外国の沿岸近くの海で漁をする遠洋漁業は大きく制限された。燃料費の値上がりも重なって、遠洋漁業の漁獲量は大きく減った。その後は沖合漁業の漁獲量も減り、今では多くの魚介類を輸入するようになっている。\n\nそこで注目されているのが、とる漁業から育てる漁業への転換だ。いけすなどで魚や貝を出荷できる大きさまで育てる養殖漁業では、ほたてやかき、のり、ぶりなどが育てられている。また、卵からかえした稚魚や稚貝をある程度まで育てて海に放し、成長してからとる栽培漁業も行われている。資源を守りながら漁を続けるための工夫である。\n\n食卓に並ぶ一皿の向こうには、国内で農業や漁業にたずさわる人々の努力と、海外とのつながりがある。食べ物がどこから来たのかを考えることは、日本の産業の今を知る入り口になる。"},{"id":"m5b10","title":"工場はなぜ海をわたったか","kind":"産業","points":["資源の少ない日本は、原料や燃料を輸入して工業製品を輸出する加工貿易で工業を発展させた。","貿易摩擦や円高、人件費の差などから、工場を海外に移して現地で生産する企業が増えた。","国内の工場が減り製造業がおとろえる産業の空洞化が起こり、高い技術を生かす道が探られている。"],"body":"身の回りの電気製品や衣類の表示を見ると、外国で作られたものが多いことに気づく。日本の会社の製品でも、生産地は中国や東南アジアの国々であることが少なくない。世界に多くの工業製品を送り出してきた日本の工業は、どのように移り変わってきたのだろうか。\n\n日本は、石油や石炭、鉄鉱石などの資源にとぼしい。そこで日本は、原料や燃料を輸入し、それを加工して工業製品を輸出する加工貿易によって経済を成長させてきた。原料を船で運びこむのに便利なため、工場は港のある臨海部に集まった。関東地方から九州地方北部にかけての海沿いに、工業地帯や工業地域が帯のように連なる太平洋ベルトは、こうして形づくられた。\n\n太平洋ベルトには、京浜、中京、阪神の三大工業地帯のほか、京葉工業地域や瀬戸内工業地域、北九州工業地帯（地域）などが並ぶ。臨海部には製鉄所や石油化学コンビナートが建設され、重化学工業が発展した。現在、製造品出荷額が最も多いのは、自動車工業を中心とする中京工業地帯である。\n\n1980年代になると、日本からの自動車や電気製品の輸出が急増し、アメリカ合衆国などとの間で貿易摩擦が深刻になった。そこで日本の企業は、相手国に工場を建てて生産する現地生産を進めた。さらに円高が進むと、日本で作って輸出するよりも、海外で作った方が有利になる場合が増えていった。\n\n1990年代以降は、人件費の安い中国や東南アジアの国々に工場を移す企業が増えた。海外の工場で作った製品を日本に輸入することも多くなり、現在では原油などの燃料とならんで、機械類が輸入品の大きな割合を占めている。原料を輸入して製品を輸出するという、かつての加工貿易の形は、大きく変わったのである。\n\n工場が海外へ移ると、国内では工場が閉鎖されたり縮小されたりして、働く場所が減ってしまう。その影響は、部品をつくる中小の工場や、地域の商店にも広がる。このように、国内の製造業がおとろえていくことを産業の空洞化という。\n\n国内の工業も変わってきた。高速道路の整備が進むと、広い土地が得やすく交通の便もよい内陸部に工場が進出し、北関東などに工業地域が形成された。小さくて軽く、値段の高い集積回路（IC）は、航空機や自動車で運んでも採算がとれるため、空港や高速道路の近くに工場がつくられた。今の日本では、高い技術力を生かした製品の開発や、研究開発の拠点としての役割が重視されるようになっている。\n\n製品のラベルに書かれた国名は、日本の工業が世界とどうつながっているかを物語っている。製品がどこで生まれ、どの道を通って手元に届いたのかを考えると、地図の上に産業の移り変わりが見えてくる。"},{"id":"m5c05","title":"コンセントの向こう側","kind":"産業","points":["日本は石油や石炭など鉱産資源の多くを輸入に頼り、国内でまかなえるエネルギーは1割あまりにすぎない。","発電は火力が中心で臨海部に多い。地球温暖化対策として、太陽光や風力などの再生可能エネルギーが注目される。","重い貨物は海上輸送、軽くて高価な電子部品などは航空輸送が多い。国内の輸送は自動車中心で、通信網も発達した。"],"body":"部屋のスイッチを入れると、明かりがつく。あまりに当たり前で考えたこともないかもしれないが、その電気はどこで、何を使ってつくられているのだろうか。コンセントの向こう側をたどっていくと、世界とつながる日本の産業の姿が見えてくる。\n\n日本は石油や石炭、天然ガスなどの鉱産資源にとぼしく、そのほとんどを輸入に頼っている。石油はおもにサウジアラビアやアラブ首長国連邦など西アジアの国々から、石炭や鉄鉱石はオーストラリアなどから、船で運ばれてくる。必要なエネルギーのうち、国内でまかなえる割合は1割あまりにすぎない。\n\n発電方法を見ると、現在の日本では火力発電が中心だ。火力発電所は、燃料を船で運び入れやすく、電気を多く使う大都市にも近い臨海部に建てられることが多い。水力発電所は、川の上流の山間部につくられたダムを利用する。原子力発電所は、大都市から離れた海沿いの地域に多い。日本ではかつて水力発電が中心だったが、工業の発展とともに電力の需要が増え、1960年代に火力発電が水力発電を上回った。2011年の東日本大震災で福島第一原子力発電所の事故が起きてからは、多くの原子力発電所が運転を停止した。\n\n火力発電は、地球温暖化の原因となる二酸化炭素を多く出すという課題をかかえる。そこで注目されているのが、太陽光、風力、地熱、バイオマスなど、くり返し利用でき、なくなる心配の少ない再生可能エネルギーだ。ただし、天候によって発電量が変わりやすいといった課題もあり、さまざまな発電方法を組み合わせていくことが求められている。\n\n資源や製品を運ぶ交通も、日本の産業を支えている。外国との貿易では、石油や鉄鉱石、自動車のように重くてかさばるものは、タンカーやコンテナ船などによる海上輸送で運ばれる。一方、半導体などの電子部品のように軽くて高価なものは、航空機で運ばれることが多い。そのため、成田国際空港は輸出入額で日本有数の貿易港になっている。\n\n国内では、高速道路の整備とともに、貨物の輸送も人の移動も自動車が中心になった。新幹線や航空路線も整い、各地の間の移動時間は大きく短くなった。さらに、光ファイバーや海底ケーブルなどの通信網が世界中に張りめぐらされ、インターネットを通じて大量の情報が一瞬でやりとりされている。都市から離れた地域でも仕事や買い物がしやすくなる一方で、地域による通信環境の差という課題も残っている。\n\nスイッチ一つで明かりがつき、遠い国の果物が店に並び、地球の裏側の映像がすぐに見られる。そうした毎日の便利さは、資源とエネルギー、そして交通と通信のしくみに支えられているのである。"},{"id":"m5c06","title":"260年続いた幕府の秘密","kind":"日本史","points":["幕府は大名を親藩・譜代大名・外様大名に分けて配置し、武家諸法度や参勤交代で統制した（幕藩体制）。","キリスト教を禁じ、島原・天草一揆の後、ポルトガル船の来航を禁止し、オランダ商館を長崎の出島に移した。","鎖国の下でも、長崎・対馬藩・薩摩藩・松前藩の四つの窓口で、外国や琉球、アイヌの人々と交流していた。"],"body":"戦国時代、日本では100年あまりにわたって各地で争いが続いた。ところが江戸時代になると、幕府による支配がおよそ260年も続き、その間、大きな戦乱はほとんど起こらなかった。徳川氏は、いったいどのようなしくみで全国を治めたのだろうか。\n\n1600年、関ケ原の戦いに勝利した徳川家康は、1603年に征夷大将軍に任じられ、江戸に幕府を開いた。将軍から1万石以上の領地を与えられた武士を大名といい、大名が支配する領地とそのしくみを藩という。このように、幕府と藩が全国の土地と人々を支配するしくみを幕藩体制という。\n\n幕府は大名を、徳川家の一族である親藩、古くからの家臣である譜代大名、関ケ原の戦いのころから従った外様大名に分けた。重要な土地には親藩や譜代大名を置き、外様大名は江戸から遠い地域に配置した。さらに武家諸法度という法律を定め、城を勝手に修理することや、大名どうしが無断で結婚することを禁じた。3代将軍徳川家光は、大名が1年おきに領地と江戸を行き来する参勤交代を制度として定めた。大名の妻子は江戸に住まわされ、往復の費用や江戸での暮らしは、藩の財政に重い負担となった。\n\n人々の身分も区別された。支配する武士のほか、村に住む百姓、城下町などに住む町人がいた。百姓は人口の大部分をしめ、年貢として米を納めた。村では五人組がつくられ、年貢の納入や犯罪の防止に連帯して責任を負わされた。また、これらの身分とは別に、厳しく差別された人々もいた。\n\n幕府は、はじめ貿易に積極的だった。家康は大名や商人に朱印状という渡航の許可証を与えて朱印船貿易を進め、東南アジアの各地には日本町もできた。しかし、キリスト教の信者が増えると、幕府は神への信仰を何より重んじる教えが支配の妨げになると考え、禁教令を出して取りしまりを強めた。信者を見つけ出すため、キリストやマリアの像を踏ませる絵踏も行われた。1637年には、重い年貢とキリスト教徒への迫害に苦しむ人々が、島原・天草一揆を起こした。\n\n一揆をおさえたのち、幕府は1639年にポルトガル船の来航を禁止し、1641年には平戸のオランダ商館を長崎の出島に移した。こうして、貿易と海外の情報を幕府が独占する体制ができあがった。この体制は、のちに鎖国と呼ばれるようになった。\n\nただし、日本は外の世界と完全に切れていたわけではない。長崎ではオランダや中国と貿易を行い、対馬藩を通じて朝鮮と、薩摩藩を通じて琉球王国と、松前藩を通じて蝦夷地のアイヌの人々と交流した。朝鮮からは、将軍の代がわりなどに朝鮮通信使が来日した。幕府はオランダ風説書によって海外の情報も手に入れていた。「鎖国」の中にも、四つの窓口が開かれていたのである。\n\n大名を配置と法でしばり、身分を固め、外国との窓口をしぼる。何重にも張りめぐらされたしくみが、長い平和を支えていたのだ。"},{"id":"m5c07","title":"三都が育てた町人文化","kind":"日本史","points":["新田開発、備中ぐわや千歯こきなどの農具、干鰯などの肥料で農業が発達し、五街道や海の航路も整えられた。","元禄文化は上方の町人が中心で、井原西鶴・近松門左衛門・松尾芭蕉・菱川師宣らが活躍した。","化政文化は江戸が中心で、十返舎一九・曲亭馬琴・小林一茶や、錦絵の葛飾北斎・歌川広重らが人気を集めた。"],"body":"19世紀の初め、弥次郎兵衛と喜多八という二人組が東海道を旅しながら、失敗や笑いをくり広げる物語が大評判になった。十返舎一九の『東海道中膝栗毛』である。旅の物語がこれほど多くの人に読まれた背景には、産業と交通の発達、そして力をつけた町人たちの存在があった。\n\n江戸時代には農業が大きく発展した。幕府や藩は用水路を引き、海や沼地を干拓して新田開発を進め、耕地面積は18世紀の初めには豊臣秀吉のころの約2倍に増えた。深く耕せる備中ぐわや、脱穀の能率を大きく上げた千歯こきなどの農具が広まり、いわしを干した干鰯や油かすが肥料として買われるようになった。綿や菜種、紅花など、売ることを目的とした商品作物の栽培も広がった。\n\n交通も整えられた。江戸の日本橋を起点に、東海道や中山道などの五街道が整備され、宿場町がにぎわった。海では、大阪と江戸を結ぶ航路を菱垣廻船や樽廻船が行き来し、東北や北陸の米を大阪や江戸へ運ぶ西廻り航路と東廻り航路も開かれた。\n\nこうして、三都と呼ばれる三つの大都市が栄えた。「将軍のおひざもと」の江戸は人口100万人ほどの大都市となり、「天下の台所」と呼ばれた大阪には諸藩が蔵屋敷を置いて、年貢米や特産物を売りさばいた。朝廷のある京都では、西陣織などの工芸品がつくられた。大商人たちは株仲間という同業者の組合をつくり、幕府や藩に税を納める代わりに、営業を独占する特権を認められた。\n\n経済力をつけた町人は、新しい文化の担い手になった。17世紀末から18世紀初めにかけて、大阪や京都などの上方を中心に栄えたのが元禄文化だ。井原西鶴は町人の暮らしを浮世草子という小説に描き、近松門左衛門は人形浄瑠璃の脚本で義理と人情の間で悩む人々を描いた。松尾芭蕉は俳諧（俳句）を芸術にまで高め、各地を旅して『おくのほそ道』を書いた。尾形光琳の装飾画や、菱川師宣の浮世絵も生まれた。\n\n19世紀初めには、江戸を中心に化政文化が栄えた。十返舎一九や、『南総里見八犬伝』を書いた曲亭（滝沢）馬琴の小説が広く読まれ、小林一茶は農民の暮らしや身近な生き物を俳句によんだ。世の中を皮肉る川柳や狂歌も流行した。多色刷りの版画である錦絵が広まり、喜多川歌麿の美人画、葛飾北斎の『富嶽三十六景』や歌川広重の『東海道五十三次』などの風景画が人気を集めた。これらの浮世絵は、のちにヨーロッパの画家たちにも影響を与えた。\n\n庶民の間では、読み・書き・そろばんを教える寺子屋が各地に広まった。旅の物語が大評判になったのも、本を読み、実際に旅に出られる人々が増えていたからこそだ。現代の私たちが楽しむ小説や絵、旅行の文化の源流は、江戸の町人たちの暮らしの中にもあったのである。"},{"id":"m5c08","title":"改革はなぜくり返されたか","kind":"日本史","points":["8代将軍徳川吉宗の享保の改革では、倹約や新田開発で財政を立て直し、公事方御定書を定め、目安箱を置いた。","貨幣経済が農村に広がって地主と小作人が生まれ、百姓一揆や都市の打ちこわしが増えた。","老中松平定信の寛政の改革、水野忠邦の天保の改革は、厳しい統制が反発を招き、いずれも長続きしなかった。"],"body":"江戸時代の中ごろから、幕府はくり返し「改革」に取り組んだ。きっかけは財政の悪化である。幕府や武士の収入の中心は年貢として納められる米で、武士はそれを売ってお金にかえて暮らしていた。ところが商業が発達すると、米の値段が下がる一方でほかの品物は高くなり、幕府や武士の暮らしは苦しくなっていった。\n\n最初の大きな改革は、1716年に8代将軍となった徳川吉宗による享保の改革だ。吉宗は質素・倹約をすすめ、新田開発を進めて年貢を増やそうとした。大名には米を差し出させる代わりに、参勤交代で江戸にいる期間を短くした。また、裁判の基準となる公事方御定書を定め、庶民の意見を聞くために目安箱を置いた。キリスト教に関係のない洋書の輸入もゆるめ、これがのちの蘭学の発展につながった。こうして財政は一時的に立ち直った。\n\nしかし、社会は大きく変わりつつあった。農村にも貨幣が広く行きわたり、土地を手放して小作人になる百姓と、土地を集めて地主になる百姓とに分かれていった。年貢の引き下げなどを求めて百姓たちが団結する百姓一揆が増え、都市では、米を買い占めた商人の店を人々がおそう打ちこわしが起こった。\n\n18世紀後半には、老中の田沼意次が商人の経済力を利用しようとした。株仲間をつくることを奨励して営業税をとり、長崎での貿易を活発にした。しかし、役人の間でわいろが横行したと批判され、天明のききんで一揆や打ちこわしが多発すると、田沼は老中を辞めさせられた。\n\n続いて、吉宗の孫である老中の松平定信が寛政の改革を行った。ききんに備えて各地に米をたくわえさせ、江戸に出かせぎに来ていた百姓を農村に帰らせようとした。また、幕府の学校で朱子学以外の学問を教えることを禁じ、政治への批判も厳しく取りしまった。しかし、厳しすぎる統制は人々の反発を招き、改革は6年ほどで終わった。\n\n19世紀に入ると、天保のききんで多くの人々が苦しんだ。1837年には、大阪町奉行所の元役人だった大塩平八郎が、人々を救おうと大阪で反乱を起こし、幕府に大きな衝撃を与えた。その後、老中の水野忠邦が天保の改革を始め、厳しい倹約令を出すとともに、物価を下げるために株仲間を解散させた。さらに江戸や大阪の周辺を幕府の領地にしようとしたが、大名や旗本の強い反対にあい、改革は2年あまりで失敗に終わった。\n\n同じころ、薩摩藩や長州藩などは、特産物の専売や借金の整理によって財政を立て直し、雄藩と呼ばれる力をつけていった。これらの藩は、やがて幕末の政治を大きく動かすことになる。三つの改革の歩みは、幕府のしくみが変わりゆく社会に追いつけなくなっていく過程でもあったのだ。"},{"id":"m5c09","title":"4隻の黒船が変えたもの","kind":"日本史","points":["1853年にペリーが来航し、翌年の日米和親条約で開国。1858年の日米修好通商条約は不平等な内容だった。","尊王攘夷運動ののち薩長同盟が結ばれ、1867年に徳川慶喜が大政奉還を行い、戊辰戦争で旧幕府軍が敗れた。","新政府は五箇条の御誓文、廃藩置県で中央集権を進め、学制・徴兵令・地租改正で富国強兵をめざした。"],"body":"1853年の夏、浦賀（神奈川県）の沖に4隻の黒い船が現れた。アメリカの使節ペリーが率いる艦隊である。煙を上げて進む大きな蒸気船の姿は、人々に強い衝撃を与えた。ペリーは大統領の国書を差し出し、日本に開国を求めた。\n\n翌1854年、幕府は日米和親条約を結び、下田と函館の2港を開いて、アメリカ船に燃料や食料、水を補給することを認めた。さらに1858年、大老の井伊直弼は朝廷の許可を得ないまま日米修好通商条約を結び、函館、神奈川（横浜）、長崎、新潟、兵庫（神戸）の5港を開いて貿易を始めた。この条約は、日本で罪を犯した外国人をその国の領事が裁く領事裁判権を認め、日本に関税自主権がないという不平等なものだった。幕府は同じような条約を、オランダ、ロシア、イギリス、フランスとも結んだ。\n\n貿易が始まると、生糸などが大量に輸出されて国内では品不足になり、物価が急に上がった。人々の暮らしは苦しくなり、天皇を尊び外国を打ち払おうとする尊王攘夷の考えが広がった。井伊直弼は反対する大名や公家、武士たちを厳しく処罰したが（安政の大獄）、1860年、江戸城の桜田門の外で暗殺された（桜田門外の変）。\n\n攘夷の中心となった長州藩は下関海峡を通る外国船を砲撃したが、翌年、イギリスなど4か国の艦隊に砲台を占領された。薩摩藩も、生麦事件をきっかけに起きた薩英戦争でイギリスの力を思い知らされた。外国を打ち払うことはできないと悟った両藩は、幕府を倒して強い国をつくる道へと向かう。1866年、土佐藩出身の坂本龍馬らの仲立ちで薩長同盟が結ばれた。\n\n追いつめられた15代将軍徳川慶喜は、1867年に政権を朝廷に返した。これを大政奉還という。これに対して倒幕派は王政復古の大号令を出し、天皇を中心とする新しい政府の成立を宣言した。こうして約260年続いた江戸幕府はほろびた。翌1868年に始まった戊辰戦争では、新政府軍が旧幕府軍を破った。\n\n新政府は1868年、五箇条の御誓文で政治の方針を示し、江戸を東京と改めた。1869年には大名に領地と人民を天皇に返させる版籍奉還を行い、1871年には藩を廃止して府と県を置く廃藩置県を断行した。府知事や県令は中央から派遣され、政府が全国を直接治める中央集権国家のしくみが整った。こうした一連の改革を明治維新という。\n\n政府は、欧米に負けない国をつくるため富国強兵をめざした。1872年に学制を公布して6歳以上のすべての子どもに小学校教育を受けさせることにし、1873年には徴兵令で満20歳になった男子に兵役を義務づけた。同じ年の地租改正では、土地の価格である地価の3％を、土地の所有者が現金で納めることにして、政府の収入を安定させた。黒船の来航からわずか20年ほどで、日本の姿は大きく変わったのである。"},{"id":"m5c10","title":"条約改正までの半世紀","kind":"日本史","points":["自由民権運動ののち、1889年にドイツの憲法を手本とした大日本帝国憲法が発布され、翌年帝国議会が開かれた。","日清戦争後の下関条約で台湾などを得たが三国干渉を受け、日露戦争後のポーツマス条約では賠償金を得られなかった。","1894年に陸奥宗光が領事裁判権の撤廃に成功し、1911年に小村寿太郎が関税自主権の完全な回復を実現した。"],"body":"幕末に欧米諸国と結んだ条約は、領事裁判権を認め、関税自主権がない不平等なものだった。この条約を改め、欧米と対等な立場に立つことは、明治政府にとって最大の課題の一つだった。その実現には、半世紀以上もの年月がかかることになる。\n\n1871年に欧米へ派遣された岩倉使節団は、条約改正の交渉を試みたが、日本の法律や制度が整っていないことなどから成功しなかった。その後、政府は東京に鹿鳴館を建てて舞踏会を開くなど、欧米の生活様式を取り入れる欧化政策を進めたが、これも改正には結びつかなかった。欧米と対等になるには、憲法や議会をもつ近代国家となることが必要だったのである。\n\n国内でも、国民が政治に参加する議会を求める声が高まっていた。1874年、板垣退助らが民撰議院設立の建白書を政府に出したことをきっかけに、自由民権運動が全国に広がった。政府は1881年、1890年に国会を開くことを約束し、翌年、伊藤博文をヨーロッパに派遣して憲法を調査させた。伊藤は、君主の権力が強いドイツ（プロイセン）の憲法を手本とし、1885年には内閣制度をつくって初代の内閣総理大臣となった。\n\n1889年2月11日、大日本帝国憲法が発布された。この憲法では、天皇が国の元首として国を統治し、軍隊を率いることなどが定められた。国民は「臣民」とされ、言論や集会などの自由は法律の範囲内で認められた。翌1890年には第1回衆議院議員選挙が行われ、貴族院と衆議院からなる帝国議会が開かれた。ただし、選挙権をもつのは直接国税15円以上を納める満25歳以上の男子に限られ、有権者は総人口の約1.1％にすぎなかった。\n\n同じころ、日本は朝鮮をめぐって清と対立を深めていた。1894年、朝鮮で起きた甲午農民戦争をきっかけに日清戦争が始まった。その直前には、外務大臣の陸奥宗光がイギリスとの間で領事裁判権の撤廃に成功している。戦争に勝った日本は、1895年の下関条約で清に朝鮮の独立を認めさせ、遼東半島や台湾などをゆずらせて、多額の賠償金を得た。しかし、ロシア・ドイツ・フランスによる三国干渉を受け、遼東半島は清に返すことになった。\n\nその後、満州や朝鮮に勢力をのばすロシアと日本は対立を深め、1902年、ロシアの南下を警戒するイギリスと日英同盟を結んだ。1904年に始まった日露戦争では、両国とも多くの死者を出し、日本は国力の限界に近づいた。1905年、アメリカの仲介でポーツマス条約が結ばれ、日本は韓国での優越権や樺太の南半分などを得たが、賠償金は得られず、国民の間に強い不満が広がった。\n\n日清・日露戦争の勝利で日本の国際的な地位は高まり、1911年、外務大臣の小村寿太郎が関税自主権の完全な回復に成功した。こうして条約改正は、幕末の条約から約50年をかけて達成された。一方で日本は、1910年に韓国を併合して植民地とするなど、欧米諸国と同じように、ほかの国や地域を支配する側に立っていった。近代国家への歩みは、こうした両面をあわせもっていたのである。"},{"id":"m5a08","title":"生まれながらの自由と平等","kind":"世界史","points":["イギリスではピューリタン革命と名誉革命を経て、1689年に権利章典が定められ、立憲君主制と議会政治が確立した。","北アメリカの13植民地はイギリス本国の課税に反発して独立戦争を起こし、1776年に独立宣言を発表した。","1789年に始まったフランス革命では人権宣言が出され、人は生まれながらに自由で平等であること、国民主権がうたわれた。"],"body":"「人は生まれながらに、自由で平等な権利をもつ」。1789年、フランスの人権宣言はこううたった。今では当たり前に聞こえるが、当時のヨーロッパでは国王が強大な権力をもち、生まれた身分で人生がほぼ決まっていた。17世紀から18世紀にかけて、そのしくみを人々が自らの手で改めていった動きを、市民革命という。\n\n最初に動いたのはイギリスだ。17世紀、議会を無視して専制を強める国王と議会が対立し、内戦となった。1649年には国王が処刑され、クロムウェルの指導のもとで共和政が始まった。これをピューリタン革命という。王政が復活したのちも国王が専制を続けたため、1688年、議会は国王を退け、オランダから新しい王をむかえた。血を流さずに成しとげられたので名誉革命とよばれる。翌1689年には権利章典が定められ、議会の同意なしに法律を停止したり税を課したりできないことが確認された。こうしてイギリスでは、国王も法と議会に従う立憲君主制と議会政治が確立した。\n\n同じころ、新しい政治の考え方が広まった。イギリスのロックは、政府は人々の生命や自由、財産を守るためにあり、それに反する政府には人々が抵抗できると説いた。18世紀のフランスでは、モンテスキューが権力を立法・行政・司法に分ける三権分立を、ルソーが人民主権を唱えた。これらは啓蒙思想とよばれ、各地の革命を後押しした。\n\n次の舞台は北アメリカだ。東海岸にはイギリスの13の植民地があったが、本国は、植民地の代表が加わっていない議会で新しい税を決め、次々と課した。植民地の人々は「代表なくして課税なし」と反発し、1775年に独立戦争が始まった。翌1776年には独立宣言が発表され、人はみな平等であり、生命や自由、幸福を追求する権利をもつとうたわれた。ワシントンの率いる植民地側が勝利し、アメリカ合衆国が誕生した。合衆国憲法には人民主権や三権分立が取り入れられ、ワシントンが初代大統領となった。\n\nそしてフランスである。当時のフランスでは、聖職者と貴族が税を免除されるなどの特権をもち、人口の大部分をしめる平民が重い税を負っていた。財政難に苦しむ国王が身分別の議会を開くと、平民の代表は自分たちこそ国民の代表だとして、新たに国民議会をつくった。1789年7月、パリの民衆がバスチーユ牢獄を襲撃してフランス革命が始まり、8月には人権宣言が発表された。そこには、冒頭の言葉とともに、主権は国民にあることなどが示された。\n\nその後フランスは王政を廃止して共和政となったが、周りの国々との戦争や国内の対立が続いた。その中で軍人のナポレオンが力をのばし、1804年に皇帝となった。ナポレオンは法の下の平等などを定めた民法（ナポレオン法典）をつくり、その遠征は革命の理念をヨーロッパ各地に広めた。\n\nただ、このころの権利の主人公に、女性や奴隷は十分にふくまれていなかった。すべての人の権利が認められるには、さらに長い年月を要した。それでも、国の主人公は国民であり、権力は分けておさえ合うべきだという考えは、この時代に大きく前進した。日本国憲法の国民主権や三権分立も、その流れの先にある。"},{"id":"m5a09","title":"綿と蒸気が世界を変えた","kind":"世界史","points":["18世紀後半のイギリスで、機械の発明と蒸気機関の改良により工場での大量生産が始まった。これを産業革命という。","資本家が労働者をやとい、利益を求めて生産する経済のしくみを資本主義といい、産業革命とともに広まった。","長時間労働や都市の環境悪化などの問題が生まれ、労働組合の結成や、平等をめざす社会主義の考えが広まった。"],"body":"18世紀の半ばまで、イギリスの人々が使う綿の布の多くは、インドから運ばれてきたものだった。軽くて肌ざわりがよく、洗いやすい綿織物は大人気で、何とか国内で安くつくれないかと、多くの人が工夫を重ねた。この願いが、やがて世界の暮らしを根本から変える大きな変化の入り口になる。\n\n18世紀後半、イギリスでは糸をつむぐ機械や布を織る機械が次々に発明された。さらにワットが蒸気機関を改良すると、石炭を燃やして得た力で機械を動かせるようになった。人の手や川の流れに頼っていたころとは比べものにならないほど、多くの製品を速く安くつくれる。工場に機械を並べて大量生産するしくみが広がり、社会と経済のあり方が大きく変わった。これを産業革命という。\n\n変化は交通にもおよんだ。19世紀に入ると、蒸気機関車が走る鉄道や蒸気船が実用化され、原料や製品、そして人を、遠くまで大量に運べるようになった。鉄道や機械をつくるには大量の鉄が必要で、蒸気機関を動かすには石炭が欠かせない。綿工業、製鉄業、石炭業がたがいに発展をうながし合い、イギリスは「世界の工場」とよばれるほどの工業国になった。\n\nなぜイギリスが最初だったのか。石炭や鉄鉱石が豊富だったこと、貿易などで得た富がたくわえられていたこと、植民地が原料の産地や製品の売り先になったこと、農村から都市へ移って働く人が多かったことなどが、理由として挙げられる。やがて産業革命は、ベルギーやフランス、アメリカ、ドイツなどにも広がっていった。\n\n産業革命は、新しい経済のしくみを広げた。工場や機械などをもつ資本家が、賃金を払って労働者をやとい、商品をつくって売り、利益を求める。このしくみを資本主義という。資本家どうしが利益を大きくしようと競い合うことで、技術の改良や生産の拡大が進んだ。\n\nその一方で、働く人々の暮らしは厳しかった。工場では1日に十数時間におよぶ長時間労働や低い賃金がめずらしくなく、女性や幼い子どもも働かされた。人が急に集まった都市では住まいがせまく、空気や水の汚れも深刻になった。こうした中で、労働者は労働組合をつくり、労働時間の短縮や賃金の引き上げを求めるようになった。また、土地や工場などを社会全体のものにして平等な社会をめざす社会主義の考えも生まれ、マルクスがその理論を説いた。\n\n機械で物をつくり、賃金を得て働き、遠くの町へ鉄道で出かける。今では当たり前のこの暮らし方は、およそ250年前のイギリスから広がり始めた。日本でも、明治時代になると産業革命が進んでいく。働く人を守るきまりも、この時代から人々が少しずつ勝ち取ってきたものなのである。"},{"id":"m5a10","title":"一杯の紅茶から始まる歴史","kind":"世界史","points":["イギリスは銀の流出を防ぐため、綿織物をインドへ、インド産のアヘンを清へ、清の茶をイギリスへという三角貿易を行った。","アヘンを取りしまった清にイギリスが戦争をしかけ（アヘン戦争）、敗れた清は南京条約で香港をゆずり、5港を開いた。","インドではイギリスの支配への不満からインド大反乱が起きたが、鎮圧され、インドはイギリスの直接支配を受けた。"],"body":"18世紀のイギリスでは、紅茶を飲む習慣が人々の間に広まっていた。その茶の産地は清、今の中国である。イギリスは清から茶や絹、陶磁器を大量に買い入れ、代金を銀で支払っていた。ところが、清がイギリスから買いたいものはあまりなかった。このままでは銀が出ていくばかりだ。この悩みが、やがてアジアの歴史を大きく動かすことになる。\n\n背景には産業革命がある。工業化を進めた欧米の国々は、工場で使う原料の産地と、大量につくった製品を売る市場を求めて、アジアへの進出を強めていった。19世紀は、その動きが一気に加速した時代である。\n\nイギリスが銀の流出を止めるために始めたのが、三角貿易だった。工場でつくった綿織物をインドへ売る。インドでは麻薬のアヘンを栽培させ、それを清へひそかに持ちこんで売る。そして清から得た銀で茶を買う。こうして銀の流れは逆転し、清からはアヘンの代金として大量の銀が流れ出していった。清の国内ではアヘンを吸う習慣が広がり、人々の健康がむしばまれ、社会も乱れた。\n\n清はアヘンを厳しく取りしまり、広州でイギリス商人のアヘンを没収して処分した。これに対してイギリスは艦隊を送り、1840年にアヘン戦争が始まった。近代的な兵器をもつイギリス軍に清は敗れ、1842年に南京条約を結んだ。清は香港をイギリスにゆずり、上海など5つの港を開き、多額の賠償金を支払うことになった。翌年には、イギリスに領事裁判権を認め、関税自主権のない不平等な条約も結ばされた。その後、清では重い税などに苦しむ人々が太平天国の乱を起こし、国内の混乱が続いた。\n\nインドも大きく変わった。かつてインドの綿織物はヨーロッパに輸出されるほどの人気商品だったが、産業革命によってイギリスの安い機械製の綿織物が流れこむと、インドの綿織物業は大きな打撃を受けた。そのころイギリスは、東インド会社を通じてインドの支配を広げていた。1857年、イギリスにやとわれていたインド人兵士の反乱をきっかけに、支配に不満をもつ人々が各地で立ち上がった。これをインド大反乱という。イギリスはこれをおさえてムガル帝国をほろぼし、インドを直接支配するようになり、やがてイギリス国王を皇帝とするインド帝国をつくった。\n\nアジアの出来事は、海をこえて日本にも伝わった。大国の清がイギリスに敗れたことに江戸幕府は大きな衝撃を受け、外国船を打ち払う方針を改めて、寄港した外国船に燃料や水を与えるようにした。欧米の進出の波は、それから10年あまりのちのペリーの来航によって、日本にも直接押し寄せてくる。\n\nイギリスで今も紅茶が親しまれていることや、香港が20世紀の終わりまでイギリスに治められていたことも、この時代の歴史と深く結びついている。一杯の紅茶の向こうには、アジアの国々が欧米の力にのみこまれていった時代が見えてくるのである。"}]</script>
<script type="application/json" id="content-lv6">[{"id":"m6a01","title":"面積2の正方形の一辺は？","kind":"数学","points":["2乗するとaになる数をaの平方根といい、正の数の平方根は正と負の2つある。","分数で表せる数を有理数、√2やπのように分数で表せない数を無理数という。","√2×√3＝√6のように根号の中どうしをかけられるが、√2＋√3は√5にはならない。"],"body":"方眼紙に一辺が2センチメートルの正方形をかき、各辺のまん中の点を順に結んでみよう。内側に、傾いた正方形ができる。外側の正方形の面積は4平方センチメートルで、切り落とされた四すみの直角三角形は、どれも面積が0.5平方センチメートルだ。だから内側の正方形の面積は、4−0.5×4＝2で、2平方センチメートルになる。では、この正方形の一辺の長さはいくつだろうか。\n\n2乗するとaになる数を、aの平方根という。3²＝9、（−3）²＝9だから、9の平方根は3と−3の2つである。このように、正の数には正と負の2つの平方根があり、その絶対値は等しい。0の平方根は0だけだ。また、正の数も負の数も2乗すれば正になるので、負の数の平方根は中学校で扱う数の中にはない。では、2乗して2になる数はどうだろう。1²＝1、2²＝4なので、整数の中には見つからない。そこで根号という記号を使い、2の平方根を√2と−√2と書く。√2は「ルート2」と読む。さきほどの正方形の一辺は、√2センチメートルというわけだ。\n\n√2がどれくらいの大きさか、見当をつけてみよう。1.4²＝1.96、1.5²＝2.25だから、√2は1.4と1.5のあいだにある。さらに1.41²＝1.9881、1.42²＝2.0164だから、1.41と1.42のあいだにある。こうして調べを進めると、√2＝1.41421356…と、小数がどこまでも続いていく。しかも、同じ数字の並びが規則正しくくり返されることもない。\n\nここで、数を2つの仲間に分けてみる。aを整数、bを0でない整数として、b分のaという分数で表せる数を有理数という。5は1分の5、0.25は4分の1と表せるから、どちらも有理数だ。これに対して、分数の形では表せない数を無理数という。√2がどんな分数でも表せないことは、きちんと証明されている。√3や√5、円周率のπも無理数である。数直線は有理数だけではうめつくせず、そのすき間には無理数が存在しているのだ。\n\n根号をふくむ数の計算には、決まりがある。かけ算では、√2×√3＝√6のように根号の中どうしをかけてよい。また、8＝2²×2なので、√8＝2√2と、根号の外に出して簡単にできる。一方、たし算はそうはいかない。√2＋√3を√5としてしまうのは、よくある誤りだ。√2はおよそ1.414、√3はおよそ1.732なので、和はおよそ3.146になるが、√5はおよそ2.236しかない。\n\n平方根は、身近なところにもひそんでいる。コピー用紙などに使われるA判やB判の紙は、長い辺が短い辺のおよそ√2倍になるように作られている。短い辺を1、長い辺を√2として半分に折ると、新しい紙は長い辺が1、短い辺が√2の半分になる。√2の半分に√2をかけると、2の半分で1になるから、新しい紙でもやはり長い辺は短い辺の√2倍だ。つまり、何度半分に折っても形が変わらない。むだなく拡大や縮小ができるのは、この性質のおかげである。\n\n2乗の計算を逆にたどると、整数や分数ではとらえきれない数が現れる。無理数は特別な数のように見えるが、方眼紙の上のななめの線や、手もとの1枚の紙の中に、ごく自然に存在しているのである。"},{"id":"m6a02","title":"103×97を一瞬で計算する","kind":"数学","points":["分配法則でかっこをはずし、単項式の和の形にすることを式の展開といい、よく使う形は乗法公式にまとめられる。","多項式を因数の積の形に表すのが因数分解で、共通因数のくくり出しや乗法公式の逆を使う。","展開と因数分解は、暗算の工夫や、数の性質がいつも成り立つことの説明に役立つ。"],"body":"103×97を暗算で計算できるだろうか。筆算をすれば答えは出るが、少し工夫するとほとんど一瞬で求められる。103を100＋3、97を100−3と見るのだ。すると103×97は（100＋3）（100−3）になり、これは100²−3²、つまり10000−9＝9991に等しい。この工夫の裏側にあるのが、式の展開である。\n\n単項式や多項式の積の形の式を、かっこをはずして単項式の和の形に表すことを、式を展開するという。基本になるのは分配法則で、（a＋b）（c＋d）は、aとbのそれぞれにcとdをかけて、ac＋ad＋bc＋bdとなる。よく出てくる形は、乗法公式としてまとめられている。（x＋a）（x＋b）＝x²＋（a＋b）x＋ab、（x＋a）²＝x²＋2ax＋a²、（x−a）²＝x²−2ax＋a²、そして（x＋a）（x−a）＝x²−a²の4つだ。最初の暗算は、最後の公式を使ったことになる。\n\n公式を丸暗記する前に、図で確かめてみよう。一辺がx＋aの正方形を、縦も横もxとaの長さに区切ると、一辺xの正方形、一辺aの正方形、縦x横aの長方形2つに分かれる。面積を合わせるとx²＋2ax＋a²となり、（x＋a）²の公式と一致する。2axの「2」は、長方形が2つあることを表しているのだ。\n\n展開とは逆に、多項式をいくつかの因数の積の形に表すことを、因数分解という。まず、すべての項に共通な因数があれば、かっこの外にくくり出す。たとえばax＋ayはa（x＋y）となる。次に、乗法公式を逆向きに使う。x²＋5x＋6なら、かけて6、たして5になる2つの数を探す。2と3が見つかるので、（x＋2）（x＋3）と因数分解できる。x²−x−12なら、かけて−12、たして−1になる3と−4を見つけて、（x＋3）（x−4）となる。\n\n因数分解や展開は、数の性質を説明するときにも役立つ。3×5＋1＝16＝4²、5×7＋1＝36＝6²のように、連続する2つの奇数の積に1を足すと、ある偶数の2乗になる。これはいつでも成り立つのだろうか。nを整数として2つの奇数を2n−1、2n＋1と表すと、その積に1を足した式は、4n²−1＋1＝4n²、つまり（2n）²となる。2nは偶数なので、いくつかの例で気づいたことが、どんな場合にも成り立つと説明できたことになる。\n\n暗算に戻ろう。98²は（100−2）²と見れば、10000−400＋4＝9604と求められる。51²−49²なら、因数分解して（51＋49）（51−49）＝100×2＝200とすぐに分かる。\n\n展開と因数分解は、式の形を目的に合わせて変えるための道具だ。同じ値でも、まとまりの見方を変えるだけで、計算はぐっと楽になり、隠れていた性質も見えてくる。98円の品物を3つ買うとき、100×3−2×3＝294と考えて294円と求めるのも、分配法則を使った同じ発想だ。式の形を変える力は、身近な計算の中でも生きているのである。"},{"id":"m6a03","title":"答えが2つある方程式","kind":"数学","points":["移項して整理すると（xの2次式）＝0の形になる方程式を二次方程式といい、解は2つあることが多い。","平方根の考えや、AB＝0ならA＝0またはB＝0という性質を使った因数分解で解ける。","因数分解できないときは解の公式を使い、文章題では解が問題に合うかを確かめる。"],"body":"縦と横の長さの和が10メートルで、面積が24平方メートルの長方形の花だんをつくりたい。縦の長さは何メートルにすればよいだろうか。縦をxメートルとすると、横は（10−x）メートルなので、x（10−x）＝24という式ができる。かっこをはずして整理すると、x²−10x＋24＝0となる。このように、移項して整理すると（xの2次式）＝0の形になる方程式を、xについての二次方程式という。\n\n二次方程式を解く方法はいくつかある。まず、x²＝9やx²＝5のような形なら、平方根の考えで解ける。x²＝9ならx＝±3、x²＝5ならx＝±√5だ。（x−3）²＝5のような形でも、x−3を一つのまとまりと見ればx−3＝±√5となり、x＝3±√5と求められる。x²＋6x−1＝0のような式も、x²＋6x＝1と移項し、両辺に3²＝9を加えると、左辺が（x＋3）²にまとまり、（x＋3）²＝10となる。だからx＝−3±√10だ。このように（x＋p）²＝qの形に変形すれば、平方根の考えで解くことができる。\n\n次に、因数分解を使う方法である。ここで大切なのは、2つの数A、Bについて、AB＝0ならばA＝0またはB＝0という性質だ。花だんの式x²−10x＋24＝0は、かけて24、たして−10になる−4と−6を使って、（x−4）（x−6）＝0と因数分解できる。だからx−4＝0またはx−6＝0で、x＝4、6となる。縦が4メートルなら横は6メートル、縦が6メートルなら横は4メートルで、どちらも条件に合う。\n\nしかし、いつもうまく因数分解できるとは限らない。そこで役立つのが解の公式だ。二次方程式ax²＋bx＋c＝0の解は、分子を−b±√（b²−4ac）、分母を2aとする分数で表される。この公式は、さきほどの（x＋p）²＝qの形に変形する手順を、文字のまま進めると導くことができる。たとえばx²＋3x＋1＝0では、a＝1、b＝3、c＝1なので、根号の中は9−4＝5となり、xは2分の（−3±√5）と求められる。\n\n二次方程式を使って問題を解くときは、出てきた解がその問題に合っているかを確かめることが欠かせない。たとえば「連続する2つの正の整数があり、その積は56である」という問題で、小さいほうをxとするとx（x＋1）＝56、整理するとx²＋x−56＝0となる。因数分解すると（x＋8）（x−7）＝0で、x＝−8、7が得られる。しかし正の整数という条件があるので、−8は答えにならない。答えは7と8である。\n\n一次方程式の解は1つだった。二次方程式では解が2つあることが多いが、x²−6x＋9＝0のように、（x−3）²＝0となって解がx＝3の1つだけになるものもある。面積や物が落ちる距離など、2乗が関わる量は身の回りに多い。そうした量からもとの長さや時間を逆にたどるとき、二次方程式が頼れる道具になるのである。"},{"id":"m6a04","title":"落ちるボールと放物線","kind":"数学","points":["y＝ax²で表されるとき、yはxの2乗に比例し、xが2倍、3倍になるとyは4倍、9倍になる。","グラフは原点を頂点とし、y軸について対称な放物線で、aが正なら上に、負なら下に開く。","変化の割合は一定でなく、落下の例では、ある時間のあいだの平均の速さを表す。"],"body":"手に持ったボールを静かにはなすと、ボールは落ちながらどんどん速くなる。空気の抵抗を考えないとすると、落ち始めてからx秒間に落ちる距離をyメートルとしたとき、y＝4.9x²という関係がおよそ成り立つ。1秒間では4.9メートル、2秒間では19.6メートル、3秒間では44.1メートルだ。時間が2倍になると距離は4倍、3倍になると9倍になる。\n\nこのように、yがxの関数で、y＝ax²という式で表されるとき、yはxの2乗に比例するという。aは0でない定数で、比例定数とよぶ。身近な例には、自動車の制動距離もある。ブレーキがききはじめてから止まるまでに進む距離は、速さのほぼ2乗に比例する。速さが2倍になると、止まるまでの距離はおよそ4倍にのびるのだ。スピードの出しすぎが危ないことが、式からも分かる。\n\ny＝ax²のグラフをかいてみよう。y＝x²では、xが−2、−1、0、1、2のとき、yは4、1、0、1、4となる。これらの点をなめらかに結ぶと、原点を通り、y軸について対称な曲線ができる。この曲線を放物線という。放物線の対称の軸を単に軸、軸と放物線の交点を頂点といい、y＝ax²のグラフでは頂点は原点だ。aが正なら上に開き、xがどんな値でもyは0以上になる。aが負なら下に開き、yは0以下になる。y＝x²とy＝−x²のように、比例定数の絶対値が等しく符号が反対のグラフは、x軸について対称だ。また、aの絶対値が大きいほど、グラフの開き方は小さくなる。\n\ny＝ax²の大きな特徴は、変化の割合が一定でないことだ。変化の割合は、yの増加量をxの増加量でわったものである。y＝2x²で、xが1から3まで増えるとき、yは2から18まで増えるので、変化の割合は16÷2＝8となる。ところが、xが3から5まで増えるときは、yは18から50まで増え、変化の割合は32÷2＝16になる。一次関数では変化の割合はいつも同じだったが、y＝ax²では、xの値の範囲によって変わるのだ。\n\n落下の例で考えると、変化の割合には「平均の速さ」という意味がある。y＝4.9x²で、xが1から3まで増えるとき、yは4.9から44.1まで増えるので、変化の割合は39.2÷2＝19.6となる。つまり、落ち始めて1秒後から3秒後までの平均の速さは、秒速19.6メートルだ。2秒後から3秒後までなら、（44.1−19.6）÷1＝24.5で、秒速24.5メートルになる。時間がたつにつれて、平均の速さが大きくなっていくことが分かる。\n\n放物線という名前は、物を放り投げたときにえがく線という意味である。空気の抵抗を考えなければ、ななめに投げたボールや、噴水から飛び出す水は、放物線をえがいて飛ぶ。また、電波を集めるパラボラアンテナの「パラボラ」も、放物線を表す外国語だ。教科書のグラフの中の曲線は、実は毎日のように目の前に現れているのである。"},{"id":"m6a05","title":"2倍の模型、重さは何倍？","kind":"数学","points":["拡大・縮小した図形は相似で、対応する線分の長さの比（相似比）はすべて等しく、対応する角も等しい。","相似な図形の面積比は相似比の2乗、相似な立体の体積比は相似比の3乗になる。","三角形の1辺に平行な直線は他の2辺を等しい比に分け、影から木の高さを求めることもできる。"],"body":"粘土で小さな動物の模型を作り、次に縦も横も高さもちょうど2倍にした模型を作るとする。同じ粘土を使うなら、大きな模型の重さは何倍になるだろうか。2倍と答えたくなるが、実は8倍になる。その理由は、相似という考え方で説明できる。\n\n1つの図形を、形を変えずに一定の割合で拡大または縮小した図形は、もとの図形と相似であるという。相似な図形では、対応する線分の長さの比はすべて等しく、対応する角の大きさもそれぞれ等しい。この線分の長さの比を相似比という。三角形の場合は、3組の辺の比がすべて等しい、2組の辺の比とその間の角がそれぞれ等しい、2組の角がそれぞれ等しい、のどれかが成り立てば相似である。これを三角形の相似条件という。\n\n相似比が1：2の正方形を考えよう。一辺が1と2なら、面積は1と4だ。長方形でも三角形でも、縦の長さと横の長さがともに2倍になるので、面積は2×2＝4倍になる。一般に、相似な平面図形の面積比は、相似比の2乗に等しい。立体ではさらに奥行きも2倍になるので、体積は2×2×2＝8倍になる。相似な立体の体積比は、相似比の3乗に等しい。模型の重さが8倍になるのは、粘土の量、つまり体積が8倍になるからである。なお、相似な立体の表面積の比は、平面図形と同じく相似比の2乗になる。大きな模型の表面に色をぬるなら、必要な絵の具はおよそ4倍ですむ。\n\nこの関係から、おもしろいことが分かる。人間の体を形はそのままで2倍に大きくしたら、体重はおよそ8倍になる。ところが、体を支える骨の強さはおもに骨の断面の面積で決まり、その面積は4倍にしかならない。重さの増え方に、支える力が追いつかないのだ。大きな動物ほど、体の大きさに比べて脚が太いのは、こうした理由によると考えられている。\n\n相似は、直接はかれない長さを求めるのにも使われる。三角形ABCの辺AB、AC上にそれぞれ点D、Eをとり、DEとBCが平行なとき、三角形ADEと三角形ABCは相似になり、AD：AB＝AE：AC＝DE：BCが成り立つ。また、AD：DB＝AE：ECも成り立つ。とくに、DとEがそれぞれの辺の中点なら、DEはBCに平行で長さはその半分になる。これを中点連結定理という。さらに、3本以上の平行な直線に2本の直線が交わるとき、平行線で区切られた線分の長さの比は、2本の直線のどちらでも等しくなる。\n\n影を使えば、木の高さも求められる。同じ時刻に、長さ1mの棒の影が1.5m、木の影が9mだったとする。太陽の光は平行に届くと考えてよいので、棒と影がつくる直角三角形と、木と影がつくる直角三角形は相似になる。影の長さの比は1.5：9＝1：6なので、木の高さは1×6＝6mと分かる。\n\n地図も、実際の土地を縮小した相似な図形と考えられる。縮尺2万5千分の1の地図では、長さは2万5千分の1だが、面積は6億2500万分の1になる。長さ、面積、体積がそれぞれ何倍になるのかを区別することが、相似を使いこなすこつなのである。"},{"id":"m6a06","title":"どこから見ても同じ角","kind":"数学","points":["1つの弧に対する円周角の大きさは一定で、その弧に対する中心角の半分である。","半円の弧に対する円周角は90°なので、直径の両端と円周上の点を結ぶと直角ができる。","P、Qが直線ABの同じ側にあり∠APB＝∠AQBなら、4点A、B、P、Qは1つの円周上にある。"],"body":"丸い池のふちに、2本の木A、Bが立っているとする。池のふちを歩きながら、2本の木を見込む角度、つまり自分とA、Bを結んだ2本の線がつくる角をはかってみる。立つ場所が変われば角も変わりそうに思えるが、実は2本の木で区切られた池のふちのうち、同じ側の弧の上にいるかぎり、どこで見ても角の大きさは同じになる。このふしぎな性質を表すのが、円周角の定理である。\n\n円Oで、弧ABを除いた円周上に点Pをとるとき、∠APBを弧ABに対する円周角という。また、∠AOBを弧ABに対する中心角という。円周角の定理は、1つの弧に対する円周角の大きさは一定で、その弧に対する中心角の大きさの半分である、というものだ。たとえば中心角が100°なら、点Pをどこにとっても円周角は50°になる。また、等しい弧に対する円周角は等しい。\n\nなぜ半分になるのか、いちばん簡単な場合で確かめてみよう。線分PBが円の直径になっている場合、つまり中心Oが線分PB上にある場合を考える。OAとOPはどちらも円の半径なので、三角形OAPは二等辺三角形で、∠OAP＝∠OPAである。三角形の外角は、それととなり合わない2つの内角の和に等しいから、∠AOB＝∠OAP＋∠OPA＝2∠APBとなる。つまり、円周角∠APBは中心角∠AOBの半分だ。中心Oが角の内側や外側にある場合も、Pを通る直径を引いて、この結果を組み合わせれば説明できる。\n\nこの定理から、とくに大切な事実が導かれる。弧ABが半円のとき、中心角∠AOBは180°なので、円周角は90°になる。つまり、直径の両端と、円周上のほかの点を結ぶと、必ず直角ができるのだ。たとえば、線分ABが直径で、点Cが円周上にあり、∠CAB＝25°だとする。∠ACB＝90°なので、∠ABC＝180°−90°−25°＝65°と求められる。\n\nこの性質を使うと、丸い板の中心を見つけることができる。三角定規の直角の頂点を板のふちに合わせ、直角をはさむ2辺が円周と交わる2点に印をつける。円周角が90°なので、その2点を結ぶ線分は直径である。三角定規の置き場所を変えて、もう1本直径を引けば、2本の直径の交点が円の中心だ。\n\n円周角の定理は、逆も成り立つ。2点P、Qが直線ABについて同じ側にあり、∠APB＝∠AQBならば、4点A、B、P、Qは1つの円周上にある。角の大きさが等しいという情報から、点が同じ円の上に並んでいると分かるのだ。\n\nサッカーのグラウンドで考えてみよう。ゴールの左右のポストの根もとを2点A、Bとし、その2点を見込む角が同じ大きさになる地点を、ゴールの前の地面に集めていく。すると、それらの地点はA、Bを通る1つの円の弧の上に並ぶ。円周角の定理は、角度という見え方の大きさと、円という形とを結びつけているのである。"},{"id":"m6a07","title":"3、4、5で直角をつくる","kind":"数学","points":["直角三角形の直角をはさむ2辺をa、b、斜辺をcとすると、a²＋b²＝c²が成り立つ（三平方の定理）。","逆に、3辺の間にa²＋b²＝c²が成り立てば、その三角形は斜辺がcの直角三角形である。","正方形の対角線や座標上の2点間の距離、直方体の対角線など、はかりにくい長さを計算で求められる。"],"body":"輪にしたひもに、等しい間隔で12個の印をつける。これを3、4、5の長さの三角形になるように張ると、3と4の辺の間にきちんと直角ができる。定規も分度器もないのに直角が手に入るこの方法は、建物を建てる位置を決めるときなどに使われてきた。そのしくみを説明するのが、三平方の定理である。\n\n直角三角形で、直角をはさむ2辺の長さをa、b、斜辺の長さをcとすると、a²＋b²＝c²が成り立つ。これが三平方の定理で、古代ギリシャの数学者の名をとって、ピタゴラスの定理ともよばれる。3、4、5の三角形では、3²＋4²＝9＋16＝25で、5²＝25と一致する。ほかにも、5、12、13や、8、15、17のように、3辺の長さがすべて整数になる直角三角形がある。\n\nこの定理は、面積を使って証明できる。一辺がa＋bの正方形の中に、直角をはさむ2辺がa、bの直角三角形を4つ、斜辺が内側を向くように並べると、まん中に一辺cの正方形ができる。大きな正方形の面積（a＋b）²は、4つの三角形の面積の合計2abと、まん中の正方形の面積c²の和に等しい。（a＋b）²を展開するとa²＋2ab＋b²なので、両辺から2abをひけば、a²＋b²＝c²が導かれる。\n\n三平方の定理は、逆も成り立つ。三角形の3辺の長さa、b、cの間にa²＋b²＝c²の関係があれば、その三角形は、長さcの辺を斜辺とする直角三角形である。ひもの三角形で直角ができるのは、この逆のおかげだ。たとえば、3辺が6、8、10の三角形は、36＋64＝100なので直角三角形である。一方、3辺が4、5、6の三角形は、16＋25＝41で、36とは等しくないので、直角三角形ではない。\n\n定理を使うと、さまざまな長さが計算で求められる。一辺が1の正方形の対角線は、1²＋1²＝2より√2だ。一辺が2の正三角形の高さをhとすると、1²＋h²＝2²より、h＝√3となる。こうして、3辺の比が1：1：√2と1：2：√3の、2種類の特別な直角三角形が得られる。座標平面上で、右に3、上に4だけ離れた2点の距離も、3²＋4²＝25より5と分かる。\n\n立体にも使える。縦3センチメートル、横4センチメートル、高さ12センチメートルの直方体で、いちばん遠い頂点どうしを結ぶ対角線の長さを求めてみよう。まず底面の長方形の対角線は5センチメートルだ。次に、その対角線と高さを2辺とする直角三角形を考えると、5²＋12²＝169＝13²なので、求める長さは13センチメートルになる。\n\nテレビの画面の大きさを表す「型」の数字も、画面の対角線の長さをインチという単位で表したものだ。直接はかりにくい長さも、どこかに直角三角形を見つけて2辺の長さが分かれば、計算で求められる。三平方の定理は、そのための強力な道具なのである。"},{"id":"m6a08","title":"スープの味見と標本調査","kind":"数学","points":["集団のすべてを調べるのが全数調査、一部を調べて全体の傾向を推定するのが標本調査である。","調べたい集団を母集団、取り出した一部を標本といい、標本はかたよりなく無作為に抽出する。","標本での割合から母集団の数量を推定でき、標本が大きいほど推定は本当の値に近くなりやすい。"],"body":"大きな鍋でスープを作ったとき、味を確かめるのに全部飲み干す人はいない。よくかき混ぜてから、ひとさじすくって味見をすれば十分だ。ただし、かき混ぜずに表面だけをすくうと、底にしずんだ具や塩気を見のがしてしまう。この味見の考え方は、数学で学ぶ標本調査とそっくりである。\n\n調べたい集団のすべてを調べることを全数調査という。日本に住むすべての人を対象に5年ごとに行われる国勢調査や、学校で行う健康診断は全数調査だ。これに対して、集団の一部を調べて全体の傾向を推定することを標本調査という。テレビ番組の視聴率調査や、新聞社などが行う世論調査、工場での製品の品質検査などがその例である。\n\nすべてを調べないのには、理由がある。対象が多すぎると、時間や費用がかかりすぎる。また、缶詰の中身の検査や電球の寿命を調べる検査のように、調べると製品が使えなくなってしまう場合は、全部を調べるわけにはいかない。反対に、健康診断のように一人一人の結果が必要な場合や、国の政策のもとになる正確な人口を知りたい場合には、手間がかかっても全数調査が行われる。目的に合わせて、調べ方を選ぶことが大切なのだ。\n\n標本調査では、調べたい集団全体を母集団、母集団から取り出して実際に調べる一部を標本という。標本にふくまれるものの個数を、標本の大きさという。大切なのは、標本が母集団の性質をよく表していることだ。そのために、母集団からかたよりなく標本を取り出す必要がある。これを無作為に抽出するという。具体的には、くじ引きや乱数さい、乱数表、コンピューターでつくる乱数などを使って選ぶ。\n\n選び方がかたよると、結果は大きくずれる。たとえば、全校生徒のふだんの睡眠時間を知りたいのに、朝早く登校した生徒だけに聞いたとしたらどうだろう。早起きの生徒ばかりが集まり、全体の様子とは異なる結果が出るおそれがある。スープの表面だけをすくって味見をするのと同じ失敗だ。\n\n標本調査を使うと、数えきれないものの数を推定することもできる。池にいる魚の数を知りたいとき、たとえば50匹をつかまえて印をつけ、池にもどす。印の魚が池全体によく混ざったころに、もう一度60匹をつかまえたら、そのうち6匹に印がついていたとする。印のついた魚の割合は6÷60で10分の1だから、池全体でも印の魚は10分の1ほどだと考えられる。印の魚は50匹なので、池の魚はおよそ50×10＝500匹と推定できる。\n\n一般に、標本の大きさが大きいほど、推定した値は母集団の本当の値に近くなりやすい。ただし、いくら大きくしても、選び方にかたよりがあれば正しい推定はできない。ニュースで調査の結果を見たら、だれを、どのように選んだ調査なのかに目を向けてみよう。それだけで、数字の読み方はずっと確かなものになる。"},{"id":"m6b01","title":"電池の中で何が起きている？","kind":"理科","points":["電解質は水に溶けると陽イオンと陰イオンに分かれる（電離）ので、その水溶液には電流が流れる。","原子は電子を失うと陽イオン、電子を受け取ると陰イオンになる。亜鉛は銅よりイオンになりやすい。","ダニエル電池では亜鉛が電子を放して溶け出し、電子は導線を通って銅板へ流れる。亜鉛板が－極である。"],"body":"砂糖水と食塩水は、どちらも無色透明で見分けにくい。ところが、電極を入れて電圧をかけてみると、違いははっきりする。食塩水には電流が流れるのに、砂糖水には流れないのだ。食塩のように、水に溶かしたときに電流が流れる物質を電解質、砂糖のように流れない物質を非電解質という。この違いを生んでいるのが、イオンと呼ばれる小さな粒である。\n\n物質をつくる原子は、中心にある原子核と、そのまわりにある電子からできている。原子核は＋の電気をもつ陽子と、電気をもたない中性子からなり、電子は－の電気をもっている。ふつうは陽子と電子の数が等しいので、原子全体としては電気を帯びていない。ところが、原子が電子を失うと＋の電気を帯びた陽イオンに、電子を受け取ると－の電気を帯びた陰イオンになる。\n\n塩化ナトリウムを水に溶かすと、ナトリウムイオンと塩化物イオンに分かれる。このように、電解質が水に溶けて陽イオンと陰イオンに分かれることを電離という。水溶液の中を電気を帯びた粒が移動できるから、電流が流れるのである。一方、砂糖は水に溶けても分子のまま散らばるだけで、イオンにはならない。\n\nイオンの考え方を使うと、電池のしくみも見えてくる。金属には、イオンになりやすいものとなりにくいものがある。たとえば、青色の硫酸銅水溶液に亜鉛板を入れると、亜鉛の表面に赤い銅が付き、水溶液の青色がしだいにうすくなる。亜鉛が電子を放して亜鉛イオンとなって溶け出し、その電子を水溶液中の銅イオンが受け取って銅に変わったのだ。亜鉛は銅よりもイオンになりやすいことが分かる。\n\nこの性質を利用したのがダニエル電池だ。亜鉛板を硫酸亜鉛水溶液に、銅板を硫酸銅水溶液に入れ、二つの水溶液をセロハンで仕切る。亜鉛板と銅板を導線でつなぐと、亜鉛が電子を放して溶け出し、その電子は導線を通って銅板へ移動する。銅板の表面では、銅イオンが電子を受け取って銅になる。電子が亜鉛板から銅板へ流れるので、亜鉛板が－極、銅板が＋極である。電流は電子の流れと逆向きに、銅板から亜鉛板へと導線を流れる。\n\nセロハンには、二つの水溶液がすぐに混ざらないようにしながら、イオンは少しずつ通すという役割がある。もし混ざってしまうと、銅イオンが亜鉛板の表面で直接電子を受け取ってしまい、導線に電流が流れにくくなる。\n\nこのように電池は、物質がもつ化学エネルギーを電気エネルギーに変える装置である。乾電池のように使い切りの一次電池に対し、充電してくり返し使えるものを二次電池という。また、水素と酸素が結びついて水ができる化学変化を利用した燃料電池もある。水の電気分解とは逆向きの変化で、出てくるのは水だけだ。手の中の小さな電池の中でも、無数のイオンと電子が休みなく動いているのである。"},{"id":"m6b02","title":"酸とアルカリが出会うとき","kind":"理科","points":["酸性はBTB溶液を黄色、中性は緑色、アルカリ性は青色にする。pHは7が中性で、小さいほど酸性が強い。","酸は電離して水素イオンを生じる物質、アルカリは電離して水酸化物イオンを生じる物質である。","中和では水素イオンと水酸化物イオンが結びついて水ができ、酸の陰イオンとアルカリの陽イオンから塩ができる。"],"body":"春の畑で、土の上に白い粉がまかれているのを見たことはないだろうか。あれは石灰である。雨の多い日本では、土が酸性に傾きやすい。酸性が強すぎる土では育ちにくい作物が多いので、アルカリ性の石灰を混ぜて土の性質を整えているのだ。ここで起きているのが、中和という化学変化である。\n\nまず、酸性とアルカリ性の見分け方を確かめておこう。酸性の水溶液は青色リトマス紙を赤色に変え、BTB溶液を黄色にする。マグネシウムなどの金属を入れると水素が発生する。アルカリ性の水溶液は赤色リトマス紙を青色に変え、BTB溶液を青色に、フェノールフタレイン溶液を赤色にする。BTB溶液が緑色になるのは中性のときだ。酸性やアルカリ性の強さはpHで表し、7が中性、7より小さいほど酸性が強く、7より大きいほどアルカリ性が強い。\n\nでは、酸性やアルカリ性の正体は何だろうか。塩酸の中では、塩化水素が水素イオンと塩化物イオンに電離している。水酸化ナトリウム水溶液の中では、水酸化ナトリウムがナトリウムイオンと水酸化物イオンに電離している。このように、水に溶けて水素イオンを生じる物質を酸、水酸化物イオンを生じる物質をアルカリという。\n\nこれを確かめる実験がある。硝酸カリウム水溶液をしみこませたろ紙の上に青色リトマス紙を置き、その中央に塩酸をしみこませた糸をのせて、ろ紙の両端から電圧をかける。すると、赤く変わった部分が陰極の方へ広がっていく。陰極に引き寄せられるのは＋の電気を帯びた粒だから、酸性を示すもとは陽イオンである水素イオンだと分かる。\n\n塩酸にBTB溶液を加えると黄色になる。ここに水酸化ナトリウム水溶液を少しずつ加えていくと、液の色は黄色から緑色、そして青色へと変わる。水素イオンと水酸化物イオンが結びついて水ができ、たがいの性質を打ち消し合うからだ。これが中和である。中和が起こると熱も発生する。緑色になった液を蒸発させると、白い結晶が残る。塩化物イオンとナトリウムイオンが結びついてできた塩化ナトリウム、つまり食塩である。\n\nこのように、酸の陰イオンとアルカリの陽イオンが結びついてできた物質を塩（えん）という。塩には水に溶けやすいものも、溶けにくいものもある。硫酸に水酸化バリウム水溶液を加えると、水に溶けにくい硫酸バリウムができ、白い沈殿となって現れる。\n\nここで大事なのは、中和は液がちょうど中性になったときにだけ起こるのではない、ということだ。酸性の液にアルカリを少し加えただけでも、加えた分だけ中和は起こり、水素イオンは減っている。BTB溶液が黄色のままでも、中和は確かに進んでいるのである。\n\n畑の石灰のほかにも、火山の近くには、酸性の強い川の水に石灰を加えて中和している所がある。目には見えないイオンどうしの出会いが、作物を育て、川の水を整えているのだ。"},{"id":"m6b03","title":"タマネギの根はどこで伸びる？","kind":"理科","points":["根は先端近くで細胞分裂によって細胞の数が増え、増えた細胞が大きくなることで伸びる。","無性生殖の子は親と同じ形質を表す。有性生殖では受精卵が細胞分裂をくり返して胚になり、成長する。","生殖細胞は減数分裂でつくられ、染色体の数が半分になる。受精するともとの数に戻る。"],"body":"水につけたタマネギから、白い根が何本も伸びてきた。そのうちの1本に、先端から根元まで等しい間隔で印をつけておく。数日たって見てみると、根元に近い印の間隔はほとんど変わらないのに、先端に近い部分の間隔だけが大きく広がっている。根は全体が同じように伸びるのではなく、先端の近くで伸びているのだ。\n\nその部分を顕微鏡で観察してみよう。うすい塩酸で処理して細胞を離れやすくし、酢酸オルセイン溶液などで染めると、先端に近い部分には小さな細胞がぎっしりと並んでいるのが見える。中には、ひものようなものが見える細胞もある。一方、根元に近い部分の細胞は大きく、縦に長い。根は、先端近くで細胞分裂によって細胞の数を増やし、増えた細胞が大きくなることで伸びていくのである。\n\n細胞分裂は、次のように進む。分裂の前に、核の中の染色体が複製されて2倍になる。分裂が始まると、核の形が見えなくなり、染色体がひものように現れる。染色体は細胞の中央に並んだあと、二つに分かれて両端へ移動し、それぞれが新しい核になる。最後に、植物の細胞では中央に仕切りができ、動物の細胞ではくびれるようにして、二つの細胞に分かれる。新しい二つの細胞は、もとの細胞と同じ染色体を受け継いでいる。体をつくる細胞のこの分裂を、体細胞分裂という。\n\n生物が自分と同じ種類の新しい個体をつくることを、生殖という。生殖には二つのしかたがある。一つは、受精を行わない無性生殖だ。ゾウリムシやアメーバは、体が二つに分裂して増える。植物でも、ジャガイモのいもや、イチゴの茎の先から新しい個体ができる。さし木で増やせるのも同じしくみだ。無性生殖でできた子は、親の染色体をそのまま受け継ぐので、親と同じ形質を表す。\n\nもう一つは、雌と雄の生殖細胞が受精して子をつくる有性生殖である。動物では卵と精子が受精する。被子植物では、花粉から伸びた花粉管の中を運ばれた精細胞が、胚珠の中の卵細胞と受精する。受精卵は細胞分裂をくり返して胚になり、やがて親と同じような体になる。この過程を発生という。カエルの受精卵が二つ、四つ、八つと分かれ、やがておたまじゃくしの形になっていく様子は、その代表的な例だ。\n\nここで一つ疑問がわく。卵と精子が合体するなら、子の染色体の数は親の2倍になってしまわないだろうか。実は、生殖細胞がつくられるときには、染色体の数がもとの細胞の半分になる特別な細胞分裂が起こる。これを減数分裂という。ヒトの場合、体の細胞の染色体は46本で、卵や精子は23本ずつだ。受精によって、受精卵の染色体の数はもとどおりになる。\n\n有性生殖では、子は両親から半分ずつ染色体を受け継ぐ。そのため、子の形質は親とまったく同じになるとは限らない。そして、わたしたちの体も、もとをたどればたった一つの受精卵だった。背が伸びるのも、タマネギの根の先と同じように、細胞分裂と細胞の成長が積み重なった結果なのである。"},{"id":"m6b04","title":"修道院の庭のエンドウ","kind":"理科","points":["純系の丸としわのエンドウをかけ合わせると、子はすべて丸（顕性形質）、孫は丸：しわがおよそ3：1になる。","対になった遺伝子は減数分裂で別々の生殖細胞に入る（分離の法則）。遺伝子の本体はDNAである。","生物は長い年月をかけて進化してきた。化石の現れる順、シソチョウ、相同器官がその証拠となる。"],"body":"19世紀の中ごろ、当時オーストリアの領土だった町の修道院の庭で、一人の修道士がエンドウを育てていた。名はメンデル。彼は何年もかけてエンドウをかけ合わせ、種子の形や子葉の色などがどのように受け継がれるかを、たくさんの株について記録し続けた。この地道な研究が、遺伝のしくみを解き明かす出発点となった。\n\n生物の形や性質などの特徴を形質といい、親の形質が子や孫に伝わることを遺伝という。遺伝のもとになるのは遺伝子で、細胞の核の中の染色体にふくまれている。エンドウの種子の形には丸としわがあり、一つの種子にはどちらか一方しか現れない。このように対をなす形質を、対立形質という。\n\nメンデルはまず、何代自家受粉させても丸い種子しかできない純系と、しわのある種子しかできない純系をかけ合わせた。すると、できた子の種子はすべて丸になった。しわの形質は消えてしまったのだろうか。次に、その子を自家受粉させると、孫の代では丸としわの両方が現れた。メンデルの記録では丸が5474個、しわが1850個で、比はおよそ3対1である。子に現れる方の形質を顕性形質、現れない方の形質を潜性形質という。\n\nこのしくみは、遺伝子を記号で表すとよく分かる。丸の遺伝子をA、しわの遺伝子をaとすると、純系の丸はAA、純系のしわはaaという遺伝子の対をもつ。生殖細胞がつくられるときには減数分裂が起こり、対になった遺伝子は分かれて別々の生殖細胞に入る。これを分離の法則という。子はAとaを一つずつ受け取ってAaとなり、Aがあれば丸になるので、すべて丸い種子になる。Aaどうしをかけ合わせると、孫ではAA、Aa、aaが1対2対1の割合でできる。丸としわが3対1になるのはこのためだ。\n\nメンデルの時代には、遺伝子の正体はまだ分かっていなかった。現在では、遺伝子の本体がDNA（デオキシリボ核酸）という物質であることが明らかになっている。DNAを扱う技術も進み、医薬品の製造や農作物の品種改良などに利用されている。\n\n遺伝子は、世代を重ねるうちにまれに変化することがあり、それによって形質が変わることもある。こうした変化が長い年月の間に積み重なり、生物が変化していくことを進化という。その証拠の一つが化石だ。脊椎動物の化石は、古い地層から順に、魚類、両生類、は虫類、哺乳類、鳥類の順に現れる。また、シソチョウ（始祖鳥）の化石には、羽毛や翼という鳥類の特徴と、口の中の歯や翼の先のつめ、長い尾の骨というは虫類の特徴がそろっている。\n\nもう一つの証拠が、相同器官である。ヒトの腕、クジラの胸びれ、コウモリの翼は、形もはたらきもまったく違う。ところが骨格を比べると、基本的なつくりがよく似ている。もとは同じ器官が、それぞれの生活に合うように変化したと考えられるのだ。修道院の庭で数えられたエンドウの種子は、生命の長い歴史をひもとく扉を開いたのである。"},{"id":"m6b05","title":"急ブレーキで体が前に出るわけ","kind":"理科","points":["力がはたらかないかつり合っているとき、物体は静止または等速直線運動を続ける（慣性の法則）。","物体に力を加えると、相手から同じ大きさで逆向きの力を受ける（作用・反作用の法則）。","水圧は深いほど大きく、あらゆる向きからはたらく。水中の物体には水圧の差による浮力がはたらく。"],"body":"走っているバスが急ブレーキをかけると、立っている乗客の体は前へよろける。だれかに押されたわけではない。反対に、止まっていたバスが急に動き出すと、体は後ろへ倒れそうになる。この身近な現象には、物体の運動についての大切な法則がかくれている。\n\n物体に力がはたらいていないときや、はたらいていても力がつり合っているとき、止まっている物体は止まり続け、動いている物体は一定の速さで一直線上を進む等速直線運動を続ける。これを慣性の法則といい、物体がもつこの性質を慣性という。バスが止まっても、乗客の体はそれまでの速さで進み続けようとするので、前へ出てしまうのだ。だるま落としで一番下の段だけをすばやく打ち出すと、上の段はその場にとどまろうとして、真下にすとんと落ちる。これも慣性のはたらきである。\n\n次に、スケートリンクで向かい合って立つ二人を考えよう。一方が相手を押すと、押された人だけでなく、押した人も後ろへすべっていく。ある物体が別の物体に力を加えると、同時に相手からも、同じ大きさで逆向きの力を受けるからだ。一方の力を作用、もう一方を反作用といい、二つの力は一直線上にあって、大きさが等しく、向きが反対である。これを作用・反作用の法則という。プールの壁をけると体が前に進むのも、壁から押し返されるためだ。\n\n作用・反作用は、2力のつり合いとまちがえやすい。机の上に置いた本には、下向きの重力と、机が本を押し上げる力がはたらき、つり合っている。つり合う2力は、どちらも本という一つの物体にはたらく力だ。これに対して作用・反作用は、本が机を押す力と机が本を押す力のように、二つの物体がたがいに及ぼし合う力である。\n\n水の中では、水の重さによる圧力がはたらく。これを水圧という。水圧は深いほど大きく、上下左右のあらゆる向きからはたらく。容器の側面に高さを変えて穴をあけ、水を入れると、下の穴ほど水が勢いよく飛び出すのはこのためだ。水深が10m増すごとに、水圧はおよそ10万Pa、つまり大気圧とほぼ同じ大きさずつ大きくなる。\n\n水中の物体には、上向きの力もはたらく。これを浮力という。物体の下の面は上の面より深い所にあるので、下から押す水圧の方が大きい。その差が上向きの浮力になるのだ。たとえば、空気中でばねばかりが1.2Nを示すおもりを水中に沈めたとき、0.8Nを示したとすると、浮力は0.4Nである。浮力は水中にある部分の体積が大きいほど大きく、物体全体が水中にあれば深さには関係しない。浮力が重力より大きければ、物体は浮き上がる。\n\n急ブレーキのときに体を支えるシートベルトも、鉄でできた大きな船が海に浮かぶことも、これらの法則で説明できる。目に見えない力のはたらきを知ると、身の回りの動きが少し違って見えてくる。"},{"id":"m6b06","title":"持って歩いても仕事はゼロ？","kind":"理科","points":["仕事（J）は、力の大きさ（N）×力の向きに動いた距離（m）で求める。1秒間あたりの仕事が仕事率（W）である。","道具を使うと力は小さくなるが、動かす距離が長くなり、仕事の大きさは変わらない（仕事の原理）。","エネルギーは移り変わっても総量は一定（エネルギー保存の法則）だが、一部は熱などとして逃げていく。"],"body":"重いかばんを両手で持ったまま、廊下の端から端まで歩いたとしよう。腕はだるくなり、ふつうの言葉でいえば、たしかにひと仕事だ。ところが理科では、このとき手がかばんにした仕事はゼロと考える。いったいなぜだろうか。\n\n理科でいう仕事とは、物体に力を加えて、その力の向きに物体を動かしたときに使う言葉だ。仕事の大きさは、力の大きさと、力の向きに動いた距離をかけて求め、単位はジュール（J）で表す。かばんを支える手の力は上向きだが、かばんが動いたのは水平な向きだ。力の向きには少しも動いていないので、仕事はゼロになる。一方、重さ20Nの物体を1mの高さまでまっすぐ持ち上げれば、20Nの力で1m動かしたことになり、仕事は20×1＝20で、20Jとなる。\n\nでは、道具を使えば仕事は減らせるのだろうか。動滑車を使うと、同じ物体を半分の10Nの力で持ち上げられる。ただし、物体を1m持ち上げるには、ひもを2m引かなければならない。仕事は10×2＝20で、やはり20Jだ。斜面やてこを使った場合も同じで、力が小さくてすむ分だけ、動かす距離が長くなる。滑車の重さや摩擦を考えなければ、道具を使っても仕事の大きさは変わらない。これを仕事の原理という。\n\n同じ20Jの仕事でも、4秒で終える場合と10秒かかる場合とでは、仕事の能率が違う。1秒間あたりにする仕事を仕事率といい、単位はワット（W）で表す。4秒で終えれば20÷4＝5で5W、10秒かかれば2Wだ。電気器具の電力と同じ単位である。\n\nほかの物体に仕事をする能力をもっているとき、その物体はエネルギーをもっているという。高い所にある物体がもつ位置エネルギーは、高さが高いほど、質量が大きいほど大きい。運動している物体がもつ運動エネルギーは、速さが速いほど、質量が大きいほど大きい。ふりこのおもりは、いちばん高い所で位置エネルギーが最大になり、いちばん低い所で運動エネルギーが最大になる。この二つの和を力学的エネルギーといい、摩擦や空気の抵抗がなければ、つねに一定に保たれる。\n\nエネルギーには、ほかにも電気、熱、光、音、化学、弾性、核などのエネルギーがあり、たがいに移り変わる。電灯は電気エネルギーを光エネルギーに変え、火力発電所は燃料の化学エネルギーを、熱や運動のエネルギーを経て電気エネルギーに変える。エネルギーが移り変わっても、その総量はつねに一定である。これをエネルギー保存の法則という。ただし、変換のたびに、目的以外の熱や音として逃げていく分がある。もとのエネルギーのうち目的のエネルギーに変わった割合を変換効率といい、LED電球は白熱電球よりも変換効率が高い。\n\n最初のかばんの話に戻ろう。かばんにした仕事がゼロでも腕が疲れるのは、筋肉が物体を支えて力を出し続けるだけでも、体の中の化学エネルギーを使い、それを熱などに変えているからだ。理科の仕事とエネルギーの考え方は、わたしたちの体の中にも当てはまるのである。"},{"id":"m6b07","title":"太陽はなぜ東から昇る？","kind":"理科","points":["地球が西から東へ自転するので、天体は東から西へ1時間に約15°動いて見える。これを日周運動という。","公転により星座は1か月に約30°西へずれる。地軸の傾きで南中高度と昼の長さが変わり、季節が生じる。","金星は地球より内側を公転するので、真夜中には見えず、夕方の西の空か明け方の東の空に見える。"],"body":"太陽は毎朝、東の空から昇り、南の空を通って西の空に沈む。夜になれば、星もまた東から昇って西へ沈んでいく。まるで空全体が地球のまわりを回っているようだが、本当に回っているのは地球の方である。\n\n地球は、北極と南極を結ぶ地軸を中心に、1日に1回、西から東へ自転している。そのため地上から見ると、太陽や星は反対に東から西へ動いて見える。これを日周運動という。24時間で360°回るので、1時間に約15°動く計算になる。北の空の星は、北極星をほぼ中心として反時計回りに回って見える。北極星がほとんど動かないのは、地軸を北へのばした先の近くにあるからだ。\n\n地球はまた、太陽のまわりを1年に1回公転している。毎月同じ時刻に同じ方角の星座を観察すると、星座は1か月に約30°ずつ東から西へずれ、1年でもとの位置に戻る。これを年周運動という。季節によって見える星座が変わるのは、公転につれて、地球の夜側が向く方向が変わるからだ。また、地球から見ると、太陽は星座の間を少しずつ動いていくように見える。この太陽の通り道を黄道という。\n\nでは、季節はなぜ生まれるのだろうか。地軸は、公転面に垂直な方向に対して約23.4°傾いたまま公転している。そのため日本では、夏は太陽の南中高度が高く、昼の時間が長い。冬はその反対になる。北緯35°の地点では、南中高度は夏至のころ約78°、冬至のころ約32°と、大きな差がある。太陽が高いほど、同じ面積の地面が受ける光の量が多くなり、そのうえ昼も長いので、地面や空気がよくあたたまる。夏が暑いのは、太陽との距離が近いからではない。実際、地球が太陽に最も近づくのは1月ごろである。\n\n月は地球のまわりを公転する衛星で、太陽の光を反射して光っている。太陽、地球、月の位置関係が変わるので満ち欠けして見え、約1か月でもとの形に戻る。金星は、地球より内側を公転する惑星だ。そのため、地球から見ると太陽から大きく離れることがなく、真夜中には見えない。見えるのは、夕方の西の空か、明け方の東の空だけである。望遠鏡で見ると、金星も月のように満ち欠けし、地球に近いときほど大きく、細く欠けて見える。\n\n太陽は、自ら光を出す恒星である。そのまわりを八つの惑星が公転しており、太陽とそのまわりを回る天体の集まりを太陽系という。水星、金星、地球、火星は小型で、主に岩石でできていて密度が大きい地球型惑星だ。木星、土星、天王星、海王星は大型で、主に気体でできていて密度が小さい木星型惑星である。太陽系には、ほかにも小惑星やすい星、惑星のまわりを回る衛星などがある。\n\n毎朝の日の出も、季節の移り変わりも、地球が回り、しかも傾いていることから説明できる。今度夜空を見上げるときは、自分が回り続ける地球の上に立っていることを思い出してみよう。"},{"id":"m6b08","title":"森の落ち葉はどこへ消える？","kind":"理科","points":["植物は生産者、動物は消費者であり、菌類や細菌類などは有機物を無機物に分解する分解者である。","食べる・食べられるの関係を食物連鎖という。数量は一般に生産者が最も多く、ピラミッド形になる。","炭素などの物質は生物と環境の間を循環している。外来生物や地球温暖化は生態系のつり合いに影響する。"],"body":"秋になると、森には毎年たくさんの落ち葉が積もる。それなのに、何百年もたった森が落ち葉に深く埋もれてしまうことはない。落ち葉はいったいどこへ消えてしまうのだろうか。\n\n落ち葉の下の土をのぞいてみると、ミミズやダンゴムシ、トビムシなど、小さな動物がたくさん見つかる。彼らは落ち葉を食べて細かくする。さらに、カビやキノコなどの菌類や細菌類が、それを二酸化炭素や水などの無機物にまで分解していく。生物の死がいやふん、落ち葉などの有機物を無機物に分解するはたらきにかかわる生物を、分解者という。落ち葉は消えたのではなく、形を変えて土や空気に戻っていたのだ。\n\n植物は光合成によって、無機物である二酸化炭素と水から、デンプンなどの有機物をつくり出す。そのため植物は生産者と呼ばれる。植物を食べる草食動物や、ほかの動物を食べる肉食動物は、生産者がつくった有機物を取り入れて生きているので、消費者と呼ばれる。ある地域にすむ生物と、それを取り巻く水や空気、土などの環境を、一つのまとまりとしてとらえたものを生態系という。\n\n生物どうしの食べる・食べられるの関係を、食物連鎖という。実際には一種類の動物が何種類もの生物を食べるので、つながりは網の目のように複雑になっている。これを食物網という。また、一般に食べられる側の生物の方が、食べる側の生物よりも数量が多い。生産者をいちばん下にして数量を積み上げると、ピラミッドのような形になる。\n\nこのつり合いは、ある程度までは自然に保たれる。たとえば、肉食動物が一時的に減ると、えさとなる草食動物が増え、草食動物に食べられる植物は減る。すると、草食動物はえさ不足で減り、えさの増えた肉食動物は増えていく。こうした増減をくり返しながら、長い目で見ると、もとに近いつり合いに戻ることが多い。\n\n炭素に注目すると、自然の中の大きな循環が見えてくる。大気中の二酸化炭素は光合成によって植物に取りこまれ、有機物として食物連鎖を通じて動物へ、さらに分解者へと移っていく。そして、生産者、消費者、分解者のすべてが行う呼吸によって、再び二酸化炭素として大気中に戻る。物質はこうして、生物と環境の間をめぐっているのである。\n\nしかし、人間の活動は、このつり合いを大きく変えてしまうことがある。もともとその地域にいなかったのに、人間によって持ちこまれて定着した外来生物は、在来の生物を食べたり、すみかを奪ったりする。また、石油や石炭などの化石燃料を大量に燃やしたことで大気中の二酸化炭素が増えており、これが地球温暖化の原因の一つと考えられている。そこで、川にすむ水生生物の種類から水のよごれ具合を調べる調査や、人の手入れによって守られてきた里山の保全など、自然環境を守る取り組みが各地で行われている。\n\n一枚の落ち葉の行方を追っていくと、森全体、そして地球全体の生命のつながりが見えてくる。わたしたち人間もまた、その中で生きる生物の一員なのである。"},{"id":"m6a09","title":"80億人と一つの地球","kind":"地理","points":["世界の人口は1950年ごろの約25億人から80億人を超え、アジアやアフリカで急増している。","化石燃料は限りがあり分布もかたよるため、再生可能エネルギーへの期待が高まっている。","温暖化などの環境問題は国境をこえるため、各国はSDGsなどで持続可能な社会をめざしている。"],"body":"1950年ごろ、世界の人口はおよそ25億人だった。それが2022年には80億人を超えた。わずか70年ほどのあいだに、3倍以上にふえたことになる。とくに人口がふえているのは、アジアやアフリカの発展途上国だ。医療や衛生が改善して亡くなる子どもが減る一方、生まれる子どもの数は多いままの地域があり、人口が急激にふえる人口爆発が起きた。反対に、日本やヨーロッパの国々では少子高齢化が進み、人口が減り始めた国もある。\n\n人口がふえれば、必要な食料や水、エネルギーもふえる。世界には、十分な食料を得られず栄養不足に苦しむ人々がいる一方で、豊かな国では、まだ食べられる食品が大量に捨てられる食品ロスが問題になっている。食料の問題は、量だけでなく、地域による分配のかたよりの問題でもあるのだ。\n\nエネルギー資源にも課題がある。石油、石炭、天然ガスなどの化石燃料は、長い年月をかけて地中でできたもので、使えばなくなる限りある資源だ。しかも、石油はペルシア湾の沿岸に多いように、特定の地域にかたよって分布している。日本は、エネルギー資源の大部分を輸入にたよっている。そこで、太陽光、風力、地熱、バイオマスなど、くり返し利用できる再生可能エネルギーへの期待が高まっている。\n\n化石燃料を燃やすと、二酸化炭素などの温室効果ガスが出る。大気中の温室効果ガスがふえると、地球の平均気温が上がる地球温暖化が進む。温暖化によって海面が上がると、南太平洋のツバルのように標高の低い島国は、国土が失われるおそれがある。ほかにも、アマゾン川の流域や東南アジアでの熱帯林の減少、サハラ砂漠の南に広がるサヘルでの砂漠化など、地球上の各地で環境問題が起きている。\n\nこうした問題の多くは、国境をこえて広がる。一つの国だけでは解決できないため、国際的な協力が欠かせない。2015年には、国際連合で持続可能な開発目標、いわゆるSDGsが採択された。貧困や飢餓をなくすこと、気候変動への対策など、2030年までに達成をめざす17の目標からなる。同じ年には、温暖化を防ぐための国際的な枠組みとして、パリ協定も結ばれた。\n\nただし、各国の立場は同じではない。早くから工業化を進め、多くの温室効果ガスを出してきた先進国と、これから経済を発展させたい発展途上国とでは、何を優先するかが異なる。持続可能な社会とは、将来の世代が必要とするものを損なわずに、今の世代の必要を満たす社会のことだ。その実現には、異なる立場の国々が話し合いを重ねることが求められる。\n\n地球規模の課題は、遠い国の話ではない。食べ残しを減らす、電気をむだにしない、ごみを分別してリサイクルにまわすといった日々の行動も、80億人が一つの地球で暮らし続けるための小さな一歩なのである。"},{"id":"m6a10","title":"キャベツの値段はだれが決める","kind":"産業","points":["需要量は価格が上がると減り、供給量は価格が上がるとふえ、両者が一致する価格を均衡価格という。","品不足なら価格は上がり、売れ残りが出れば下がる。価格は生産と消費を調整するはたらきをもつ。","独占は独占禁止法で規制され、電気や水道などの公共料金は国や地方公共団体が決定や認可をする。"],"body":"台風が続いた年の秋、野菜売り場でキャベツにふだんの倍近い値段がついていることがある。反対に、天候に恵まれた年には、驚くほど安く売られることもある。キャベツの値段は、いったいだれが決めているのだろうか。\n\n商品が売り買いされる場を市場という。市場には、決まった建物だけでなく、ある商品をめぐる売り手と買い手の結びつき全体がふくまれる。多くの売り手と買い手が自由に取り引きし、価格の動きを手がかりに、何をどれだけ生産し消費するかが決まっていく経済のしくみを、市場経済という。日本の経済も、市場経済を基本としている。魚や野菜の卸売市場で行われるせりでは、買い手どうしが値段をつけ合い、いちばん高い値をつけた人が買う。そこでは、売り手と買い手の動きが値段に表れる様子を、目の前で見ることができる。\n\n消費者が買おうとする量を需要量、生産者が売ろうとする量を供給量という。一般に、価格が高くなると、需要量は減り、供給量はふえる。高ければ買うのを控える人がふえ、高く売れるなら多く作って売ろうとする人がふえるからだ。グラフにすると、需要曲線は右下がり、供給曲線は右上がりになる。2本の曲線が交わる点では需要量と供給量が等しくなり、このときの価格を均衡価格という。\n\n需要量が供給量を上回って品不足になると、価格は上がる。供給量が需要量を上回って売れ残りが出ると、価格は下がる。台風で畑が被害を受けると、キャベツの供給量が減るので値段が上がる。豊作の年は供給量がふえるので値段が下がり、農家の収入がかえって減ってしまうこともある。旬の野菜が安いのも、大型連休に旅行や宿泊の料金が高くなるのも、同じしくみで説明できる。\n\n価格の動きは、人々に向けた合図の役割を果たす。値段が上がれば、生産者はもっと作ろうとし、消費者は買う量を減らしたり、別の商品にかえたりする。こうして需要と供給の差が少しずつうまり、限られた資源が必要なところへ配分されていく。価格には、生産や消費を調整するはたらきがあるのだ。\n\nただし、市場がいつもうまくはたらくとは限らない。ある商品を1つの企業だけが供給する独占や、少数の企業が供給する寡占の状態になると、競争が弱まり、価格が高いまま決められやすい。このような状態で、一つまたは少数の企業が決める価格を、独占価格という。そこで、独占禁止法によって企業の自由な競争を守り、公正取引委員会が監視している。また、電気、水道、鉄道の運賃など、暮らしに欠かせないサービスの料金は、国や地方公共団体が決めたり認可したりする。これを公共料金という。\n\n毎日目にする値段の上がり下がりの背景には、たくさんの人々の「買いたい」と「売りたい」の動きがある。キャベツの値段を決めているのは特定のだれかではなく、市場に参加するわたしたち全員なのである。"},{"id":"m6b09","title":"会社はだれのもの？","kind":"産業","points":["株式会社は株式を発行して資金を集める。株主は配当を受け取り、株主総会で議決に参加する。","企業には、利潤の追求だけでなく、法を守り、環境や地域社会に配慮する社会的責任がある。","憲法は勤労の権利と労働三権を保障し、労働基準法は労働時間など労働条件の最低基準を定めている。"],"body":"「会社はだれのもの？」と聞かれたら、何と答えるだろうか。社長だろうか、それともそこで働く人たちだろうか。株式会社のしくみから考えると、一つの答えは株主である。ただし、話はそれだけでは終わらない。\n\n企業とは、財やサービスを生産する組織である。そのうち、利潤を得ることを主な目的とするものを私企業、国や地方公共団体が公共の目的のために運営するものを公企業という。私企業の代表的な形が株式会社だ。また、日本では企業の数の99％以上を中小企業がしめ、企業で働く人の約7割が中小企業で働いている。\n\n新しい事業を始めたり広げたりするには、多くの資金が必要になる。そこで株式会社は、株式を発行して、多くの人から資金を集める。株式を買って出資した人を株主という。株主は、会社が利潤をあげると、その一部を配当として受け取ることができる。また、株主総会に出席し、経営の方針や、会社の運営を任せる取締役の選任などについて議決する。もし会社が倒産しても、株主は出資した金額以上の責任を負わなくてよい。これを有限責任といい、多くの人が安心して出資できるしくみになっている。株式は証券取引所などで売買され、その値段である株価は、会社の業績や将来の見通しなどによって上がったり下がったりする。\n\n一方で、企業は株主のためだけに存在しているわけではない。企業には、法律を守り、安全な商品やサービスを提供し、働く人の生活を支え、環境に配慮し、地域社会に貢献することも求められている。これを企業の社会的責任という。会社は、株主だけでなく、働く人、消費者、地域の人々など、多くの人との関係の中で成り立っているのである。\n\n多くの人は、企業などに雇われて働き、賃金を受け取る。雇う側と雇われる側は、対等な立場で労働契約を結ぶのが原則だ。しかし、一人一人の労働者は、雇う側に比べて弱い立場に置かれやすい。そこで日本国憲法は、勤労の権利を保障するとともに、労働者が労働組合をつくる団結権、使用者と交渉する団体交渉権、要求を実現するためにストライキなどを行う団体行動権を保障している。この三つをまとめて労働基本権、または労働三権という。\n\n働く人を守るための代表的な法律が、労働基準法、労働組合法、労働関係調整法の労働三法である。このうち労働基準法は、労働条件の最低限の基準を定めている。たとえば、労働時間は原則として1日8時間、1週間で40時間以内とし、少なくとも毎週1日の休日を与えなければならない。また、女性であることを理由に、賃金で男性と差をつけることも禁じている。\n\n近年は、パートやアルバイト、派遣などで働く非正規労働者が、雇われて働く人の4割近くをしめるようになった。長時間労働を見直し、仕事と生活を両立させるワーク・ライフ・バランスも重視されている。会社がだれのものかを考えることは、いつか自分が働くとき、どんな立場でだれとかかわるのかを考えることでもある。"},{"id":"m6b10","title":"預けたお金はどこへ行く？","kind":"産業","points":["銀行は預金を集めて企業や家計に貸し出し、貸し出しと預金の利子の差を主な収入にしている。","1ドル＝100円から1ドル＝80円になるように、外国の通貨に対して円の価値が上がることを円高という。","円高は輸入や海外旅行に有利で輸出に不利になり、円安ではその逆になる。"],"body":"銀行にお金を預けると、わずかながら利子がつく。もし銀行が、預かったお金を金庫にしまっておくだけなら、利子を払う理由はないはずだ。実は、預けたお金は金庫の中で眠っているわけではない。\n\nお金に余裕のある人から、お金を必要としている人へ資金を融通することを金融という。銀行は、多くの人や企業から預金を集め、その資金を、工場を建てたい企業や住宅を買いたい家計などに貸し出す。借りた側は、借りたお金に利子を加えて返す。貸し出しの利子率は預金の利子率より高く設定されていて、その差が銀行の主な収入になる。このように銀行を仲立ちとする金融を間接金融といい、企業が株式や債券を発行して直接資金を集める直接金融と区別される。\n\n銀行には、もう一つ大切な役割がある。遠く離れた相手に現金を運ばなくても、振り込みなどで支払いを済ませられるようにすることだ。このしくみを為替という。また、日本の中央銀行である日本銀行は、紙幣を発行する発券銀行、政府のお金を預かる政府の銀行、一般の銀行と取引をする銀行の銀行という三つの役割をもち、景気や物価を安定させるための金融政策も行っている。\n\n為替は、国と国との取引でも欠かせない。日本の円とアメリカのドルのように、通貨の異なる国どうしで取引をするには、通貨を交換する必要がある。その交換の比率を為替相場（為替レート）といい、通貨の需要と供給によって、毎日のように変動している。\n\nたとえば、1ドル＝100円だった為替相場が、1ドル＝80円になったとしよう。1ドルを手に入れるのに必要な円が少なくなったのだから、円の価値が上がったことになる。これを円高という。反対に、1ドル＝120円になれば、円の価値が下がったので円安である。数字が小さくなるのに「高」と呼ぶので混乱しやすいが、円の価値で考えれば分かりやすい。\n\n為替相場の動きは、貿易に大きな影響を与える。日本で100万円の製品をアメリカに輸出すると、1ドル＝100円のときは1万ドルで売れる。ところが1ドル＝80円になると、同じ製品が1万2500ドルになり、アメリカでは値上がりして売れにくくなる。一方、アメリカで1万ドルの品物を輸入するときは、100万円だった代金が80万円ですむ。つまり円高は輸出に不利で、輸入や海外旅行には有利になる。円安ではその逆が起こる。円高が続いた時期には、外国に工場を移す企業が増え、国内の産業がおとろえる産業の空洞化が心配された。\n\nでは、円高は得なのか、損なのか。答えは立場によって違う。輸出をする企業にとっては痛手でも、輸入品を買う消費者には助かることがある。燃料や食料の多くを輸入に頼る日本では、円安が続くと身の回りの物の値段が上がることもある。銀行に預けたお金も、為替相場の動きも、わたしたちの暮らしと世界をつなぐお金の流れの一部なのである。"},{"id":"m6c01","title":"米の値段が政治を動かした","kind":"日本史","points":["第一次世界大戦中の好景気で物価が上がる中、米騒動が起こり、原敬が初の本格的な政党内閣をつくった。","吉野作造の民本主義などを背景に、大正デモクラシーとよばれる民主主義を求める風潮が高まった。","1925年、満25歳以上の男子に選挙権をあたえる普通選挙法が成立し、同じ年に治安維持法も定められた。"],"body":"1918年の夏、富山県の漁村で、女性たちが米の県外への積み出しをやめるよう求めて立ち上がった。米の値段が急に上がり、毎日の食事にも困る家が増えていたからだ。この出来事が新聞で伝えられると、米の安売りを求める騒ぎはまたたく間に全国へ広がり、軍隊が出動するほどの事態になった。これを米騒動という。\n\n米の値段が上がった背景には、第一次世界大戦があった。ヨーロッパが戦場になると、日本はヨーロッパの連合国やアジア、アメリカへの輸出をのばし、かつてない好景気をむかえた。これを大戦景気といい、にわかに大金持ちになった「成金」も現れた。しかし物価も上がり続け、労働者や農民のくらしはかえって苦しくなった。そこへ、シベリア出兵を見こした商人による米の買い占めが重なり、米の値段がはね上がったのである。\n\n米騒動で寺内正毅内閣がたおれると、立憲政友会の総裁だった原敬が首相となった。原内閣は、陸軍・海軍・外務の三大臣以外の大臣をすべて政友会の党員が占める、初めての本格的な政党内閣だった。爵位をもたない原は「平民宰相」とよばれ、人々の期待を集めた。民衆の行動が、政治のしくみを動かしたのである。\n\nこのころ、政治は国民の考えにもとづいて行われるべきだという主張が広まっていた。政治学者の吉野作造は、天皇が主権をもつ大日本帝国憲法のもとでも、民衆の意向を重んじた政治はできると説き、これを民本主義と名づけた。この考えは、政党政治や普通選挙を求める運動を支えた。大正時代に高まった、こうした民主主義を求める風潮を、大正デモクラシーという。\n\n声を上げたのは政治家だけではない。労働者は労働組合をつくって賃金の引き上げなどを求め、農村では小作料の引き下げを求める小作争議が増えた。1922年には、差別に苦しんできた人々が全国水平社を結成し、差別からの解放を目指した。平塚らいてうらは、女性の地位の向上や、女性の政治活動の自由を求めて運動を進めた。\n\nこうした動きの中で、1925年に普通選挙法が成立した。納税額による制限がなくなり、満25歳以上のすべての男子に選挙権があたえられて、有権者はおよそ4倍に増えた。ただし、女性の選挙権は認められなかった。また同じ年には、共産主義などの運動を取りしまる治安維持法も定められた。自由の広がりと取りしまりの強化が、同時に進んだのである。\n\n人々のくらしも変わった。都市では会社に勤めるサラリーマンが増え、バスの車掌や電話交換手などとして働く女性も目立つようになった。1925年にはラジオ放送が始まり、新聞や雑誌も多くの人に読まれた。選挙で代表を選び、ニュースを通じて社会の動きを知るという、今の私たちにとって当たり前のくらしの土台は、この時代に形づくられ始めたのだ。"},{"id":"m6c02","title":"不景気が開いた戦争への道","kind":"日本史","points":["世界恐慌の影響で昭和恐慌が起こり、不景気が続く中で、軍部の一部は満州を勢力下に置こうと考えた。","1931年に満州事変を起こした日本は翌年に満州国をつくり、これを認めない勧告を受けて国際連盟を脱退した。","五・一五事件や二・二六事件で軍部の力が強まり、1937年の盧溝橋事件から日中戦争が始まった。"],"body":"1931年9月、中国東北部の柳条湖で、南満州鉄道の線路が爆破された。満州に置かれていた日本の関東軍は、これを中国側のしわざだとして軍事行動を起こし、数か月のうちに満州の大部分を占領した。しかし、爆破は関東軍自身が計画したものだった。これが満州事変である。日本はなぜ、このような道を進んだのだろうか。\n\n背景の一つは、深刻な不景気だった。1929年にアメリカで始まった世界恐慌は日本にも広がり、翌年には昭和恐慌とよばれる不景気となった。会社の倒産が相次いで失業者があふれ、農村では主な輸出品だった生糸の値段が大きく下がった。東北地方などでは凶作も重なり、食べるものにも困る家が少なくなかった。\n\n人々の不満が高まると、政党や財閥への批判が強まった。日本が鉄道などの権益をもつ満州は「日本の生命線」ともよばれ、軍部の一部には、資源の豊かな満州を日本の勢力下に置けば、行きづまりを打ち破れるという考えが広がった。一方、中国では、日本が満州にもつ権益を取りもどそうとする動きが強まっていた。満州事変は、こうした中で起こされたのである。国内では、新聞などが軍の行動を支持し、多くの国民もこれを歓迎した。翌1932年、日本は清の最後の皇帝であった溥儀を元首とする満州国をつくり、政治の実権をにぎった。\n\n中国はこれを日本の侵略だとして国際連盟に訴えた。連盟はリットン調査団を送って調べ、1933年、満州国を認めず、日本軍の引きあげを求める勧告を採択した。日本はこれに反発して国際連盟を脱退し、国際社会の中で孤立を深めていった。\n\n国内では、軍人が武力で政治を変えようとする事件が続いた。1932年5月15日には、海軍の青年将校らが首相官邸をおそい、犬養毅首相を暗殺した。この五・一五事件によって、政党の党首が内閣をつくる政党政治はとだえた。1936年2月26日には、陸軍の青年将校らが大臣などを殺傷し、東京の中心部を一時占拠する二・二六事件が起こった。反乱はしずめられたが、その後、軍部は政治への発言力をいっそう強めた。\n\nそして1937年7月、北京の郊外にある盧溝橋の付近で、日本軍と中国軍が衝突した。これをきっかけに戦いは中国各地へ広がり、日中戦争が始まった。日本軍は首都の南京を占領し、その際、捕虜や住民をふくむ多くの中国人の命をうばった（南京事件）。中国では、対立していた国民党と共産党が協力して抵抗を続け、政府は首都を内陸の重慶に移した。戦争は日本の予想に反して長引いていった。\n\n満州には、不景気に苦しむ日本の農村などから、多くの人々が開拓団として移り住んだ。しかし彼らも、のちに戦争の大きな犠牲を負うことになる。不景気による行きづまりを、武力で勢力を広げることで解決しようとした結果、日本は国際社会から孤立し、長い戦争へと入っていった。満州事変から太平洋戦争の終わりまで、日本の戦争はおよそ15年にわたって続いたのである。"},{"id":"m6c03","title":"米は通帳、服は切符で","kind":"日本史","points":["日中戦争が長引く中で国家総動員法が定められ、米の配給制など、国民生活は戦争のために統制された。","1941年12月、日本がハワイの真珠湾などを攻撃して太平洋戦争が始まり、ミッドウェー海戦以後は不利になった。","空襲、沖縄戦、広島・長崎への原爆投下で多くの命が失われ、1945年8月に日本は降伏した。"],"body":"お米を買うのに、お金だけでなく「通帳」が必要だった時代がある。1941年、大都市で米が配給制になり、一人あたりの量が決められた。砂糖やマッチはすでに切符と引きかえに配られており、翌年には衣料品も切符がなければ買えなくなった。戦争が長引き、国のあらゆるものが戦争のために使われるようになっていたのだ。\n\nそのしくみの出発点が、日中戦争中の1938年に定められた国家総動員法である。政府は議会の承認なしに、戦争に必要な労働力や物資を動員できるようになった。1940年には、ほとんどの政党が解散して大政翼賛会にまとめられた。町や村では近所の家どうしで隣組がつくられ、配給や防空訓練などが行われた。\n\n中国との戦争が行きづまる中、日本は石油などの資源を求めて東南アジアへ軍を進め、1940年には日独伊三国同盟を結んだ。アメリカとの対立は深まり、アメリカが日本への石油の輸出を禁止すると、日本は開戦を決意した。1941年12月8日、日本軍はハワイの真珠湾にあるアメリカ軍基地と、イギリス領のマレー半島を攻撃し、太平洋戦争が始まった。\n\n日本軍は開戦後まもなく、東南アジアから南太平洋にかけての広い地域を占領した。しかし1942年6月のミッドウェー海戦で大敗すると、戦局は不利になっていった。占領地では物資や労働力の取り立てが人々を苦しめ、抵抗運動も起こった。朝鮮や台湾では日本語の使用や神社への参拝が強いられ、朝鮮では日本式の氏名に改めさせる政策も進められた。また、多くの朝鮮人や中国人が日本に連れてこられ、鉱山や工場などで厳しい労働をさせられた。\n\n国内のくらしも、いっそう厳しくなった。兵力が足りなくなると、1943年からは大学生なども戦場に送られた（学徒出陣）。中学生や女学生は勤労動員によって軍需工場などで働いた。1944年になると、都市の小学生が親元をはなれ、地方の寺や旅館で集団で暮らす学童疎開も始まった。\n\n1944年にサイパン島が占領されると、アメリカ軍の爆撃機による本土への空襲が激しくなった。1945年3月10日の東京大空襲では、一夜のうちにおよそ10万人が亡くなった。3月末からアメリカ軍が上陸した沖縄では、住民を巻きこんだ地上戦が行われ、沖縄県民のおよそ4人に1人が命を落とした。\n\n8月6日、広島に原子爆弾が投下された。8日にはソ連が日ソ中立条約を破って参戦し、満州などに攻めこんだ。9日には長崎にも原子爆弾が投下された。その年のうちに、広島で約14万人、長崎で約7万人が亡くなったと推定されている。日本はポツダム宣言を受け入れて降伏し、8月15日、天皇がラジオ放送で国民に戦争の終わりを伝えた。空襲や疎開を体験した人々が語り伝えてきた記憶は、ふだんのくらしがどれほど大切なものかを、今も静かに教えてくれる。"},{"id":"m6c04","title":"墨でぬられた教科書から","kind":"日本史","points":["敗戦後、連合国軍総司令部（GHQ）の指令のもとで、日本の非軍事化と民主化を目指す改革が進められた。","選挙権が満20歳以上の男女に広げられ、財閥解体や農地改革によって経済の民主化が図られた。","日本国憲法は国民主権、基本的人権の尊重、平和主義を三つの基本原則とし、1947年5月3日に施行された。"],"body":"1945年の秋、戦争が終わったばかりの学校で、子どもたちは先生の指示にしたがい、教科書のあちこちを墨でぬりつぶしていた。戦争をたたえる文章など、軍国主義につながる部分を読めないようにするためだ。空襲で校舎を失った地域では、校庭などで授業を受ける「青空教室」も見られた。人々は食料不足に苦しみ、農村への買い出しや、闇市とよばれる市場で食べ物を手に入れた。海外にいた多くの軍人や民間人も、次々に日本へ引きあげてきた。そうした苦しい生活の中で、日本は新しい国づくりの第一歩をふみ出そうとしていた。\n\n敗戦後の日本は、アメリカ軍を中心とする連合国軍に占領された。マッカーサーを最高司令官とする連合国軍総司令部（GHQ）が置かれ、その指令にもとづいて日本政府が政治を行うしくみがとられた。改革の大きな目標は、日本の非軍事化と民主化である。軍隊は解散させられ、戦争の指導者は極東国際軍事裁判（東京裁判）で裁かれた。\n\n政治の民主化では、1945年に選挙法が改正され、満20歳以上のすべての男女に選挙権があたえられた。翌年の総選挙では、初めて39人の女性の衆議院議員が誕生した。また、治安維持法が廃止され、政治活動や言論の自由が認められた。\n\n経済の民主化も進んだ。戦前の日本経済を動かしてきた財閥は、軍国主義を支えたとして解体された。農村では農地改革が行われ、政府が地主の小作地を強制的に買い上げて、小作人に安く売りわたした。その結果、自分の土地を耕す自作農が大幅に増えた。労働者には労働組合をつくる権利が保障され、労働条件の最低基準を定めた労働基準法もつくられた。\n\nこうした改革の中心となったのが、日本国憲法である。GHQが示した案をもとに政府が改正案をつくり、帝国議会での審議と修正をへて、1946年11月3日に公布、1947年5月3日に施行された。主権は天皇から国民に移り、天皇は日本国と日本国民統合の「象徴」となった。国会は国権の最高機関とされ、内閣は国会に対して責任を負うしくみになった。\n\n日本国憲法には、三つの基本原則がある。国の政治のあり方を最終的に決める力が国民にあるとする国民主権、すべての人が生まれながらにもつ権利を大切にする基本的人権の尊重、そして戦争を放棄し、戦力をもたないことなどを定めた平和主義である。\n\n憲法の精神にそって、ほかの法律も改められた。民法では、戸主が家族を支配する家の制度が廃止され、男女は平等とされた。教育基本法が定められ、小学校6年と中学校3年の9年間が義務教育となって、男女共学も広まった。地方の政治も、住民が知事や市町村長を選挙で選ぶ地方自治のしくみに改められた。\n\n今、5月3日は憲法記念日、11月3日は文化の日として国民の祝日になっている。中学校までの9年間を学ぶ義務教育のしくみも、この時代の改革から始まったものなのだ。"},{"id":"m6c05","title":"豊かになった日本の光と影","kind":"日本史","points":["1950年代半ばから1973年ごろまで高度経済成長が続き、日本は資本主義国で第2位の経済大国となった。","家庭電化製品が広まりくらしが豊かになる一方、公害や都市の過密、農村の過疎などの問題が生まれた。","石油危機で高度経済成長は終わり、バブル経済の崩壊後は長い不況や少子高齢化などの課題が続いている。"],"body":"1964年10月1日、東京と新大阪を結ぶ東海道新幹線が開業した。それまで特急列車でおよそ6時間半かかった道のりを、4時間で結んだのである。その9日後には、アジアで初めてのオリンピックが東京で開幕した。敗戦から20年もたたないうちに、日本はなぜここまで変わることができたのだろうか。\n\n戦後の経済が立ち直るきっかけとなったのは、1950年に始まった朝鮮戦争だった。アメリカ軍が大量の物資を日本に注文したことで、特需景気とよばれる好景気が起こった。1951年、日本はサンフランシスコ平和条約を結び、翌年に独立を回復した。平和条約と同じ日には、日米安全保障条約も結ばれた。1956年には国際連合への加盟も認められた。\n\n1950年代半ばから1973年ごろまで、日本の経済は年平均でおよそ10％という高い成長を続けた。これを高度経済成長という。鉄鋼や造船、自動車などの重化学工業が大きく発展し、1968年には国民総生産（GNP）が資本主義国の中でアメリカに次ぐ第2位となった。\n\nくらしも大きく変わった。白黒テレビ・電気洗濯機・電気冷蔵庫の三つは「三種の神器」とよばれてあこがれの的となり、やがて多くの家庭に広まった。農村からは多くの若者が都市へ働きに出て、都市の周辺には団地が次々に建てられた。\n\n一方で、急速な成長は大きな問題も生んだ。工場が出す廃水やけむりによって、水俣病、新潟水俣病、イタイイタイ病、四日市ぜんそくの四大公害病が発生し、多くの人が苦しんだ。国は1967年に公害対策基本法を定め、1971年には環境庁を設けた。また、人口が集中した都市では過密が、人が減った農村や山間部では過疎が問題となった。\n\n1972年には、アメリカの統治下にあった沖縄が日本に復帰し、中国との国交も正常化した。しかし1973年、中東での戦争をきっかけに石油の価格が急に上がる石油危機が起こり、高度経済成長は終わりをむかえた。それでも日本は、省エネルギーや技術の改良を進めて不況を乗りこえ、自動車や電気製品の輸出をのばした。その結果、アメリカなどとの間で貿易摩擦も起こった。\n\nその後の日本は、1980年代後半に株や土地の値段が異常に上がるバブル経済を経験したが、1990年代の初めにそれが崩壊すると、長い不況が続いた。2011年には東日本大震災が起こり、地震と津波によって多くの命が失われ、原子力発電所の事故も起きた。現在の日本は、少子高齢化や災害への備え、地球環境問題など、多くの課題に向き合っている。\n\n家にテレビや冷蔵庫があり、新幹線で各地へすばやく移動できるくらしは、わずか半世紀あまりのうちに築かれたものだ。その豊かさが何をもたらし、何を引きかえにしてきたのかを知ることは、これからの社会を考える手がかりになる。"},{"id":"m6c06","title":"一発の銃声が世界をまきこむ","kind":"世界史","points":["19世紀後半から、欧米の列強は資源や市場を求めてアジアやアフリカに植民地を広げた。これを帝国主義という。","三国同盟と三国協商が対立する中、1914年のサラエボ事件をきっかけに第一次世界大戦が始まった。","大戦は国の力をすべて注ぐ総力戦となり、アメリカの参戦などをへて、1918年にドイツが降伏して終わった。"],"body":"1914年6月28日、バルカン半島のサラエボで、オーストリアの皇位継承者の夫妻が、セルビア人の青年に銃で撃たれて亡くなった。この事件から1か月あまりのうちに、ヨーロッパの大国が次々と戦争に加わっていく。なぜ一つの事件が、これほど大きな戦争につながったのだろうか。\n\n19世紀の後半、工業が発展した欧米の国々は、原料の産地や製品を売る市場を求めて、軍事力を背景にアジアやアフリカへ進出した。こうした動きを帝国主義という。アフリカでは20世紀の初めまでに、エチオピアとリベリアをのぞくほとんどの地域が、イギリスやフランスなどの植民地として分けられた。アジアでも、インドはイギ
