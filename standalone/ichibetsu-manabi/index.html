リスに、インドシナはフランスに支配され、中国にも列強が勢力をのばした。\n\n植民地をめぐる争いは、列強どうしの対立を生んだ。おくれて工業化を進めたドイツは、海軍を強化して勢力の拡大を図り、オーストリア、イタリアと三国同盟を結んだ。これを警戒したイギリスは、フランス、ロシアとの間で三国協商を結んだ。ヨーロッパは二つの陣営に分かれ、にらみ合うことになった。\n\nとくに不安定だったのがバルカン半島である。多くの民族が入りまじるこの地域では、スラブ民族の動きを支えるロシアと、勢力を広げようとするオーストリアが対立していた。いつ戦争が起きてもおかしくないことから、バルカン半島は「ヨーロッパの火薬庫」とよばれた。サラエボ事件は、まさにその火薬に火をつけたのである。\n\nオーストリアがセルビアに宣戦すると、同盟や協商の関係にそって各国が参戦し、第一次世界大戦が始まった。ドイツやオーストリアなどの同盟国と、イギリス・フランス・ロシアなどの連合国が戦い、イタリアは連合国側についた。日本も日英同盟を理由に連合国側で参戦し、中国にあるドイツの拠点や、太平洋のドイツ領の島々を占領した。さらに1915年には、中国に二十一か条の要求を示し、その多くを認めさせた。\n\nこの戦争では、戦車、飛行機、毒ガス、潜水艦といった新兵器が使われ、戦いは長引いた。各国は兵士だけでなく、国民や経済、さらに植民地の人々や資源までも戦争に動員した。イギリスの植民地だったインドからも、多くの兵士が戦場に送られた。このように国の力をすべて注ぎこむ戦争を総力戦という。男性が戦場に送られたあとの工場では、多くの女性が働いた。\n\n1917年、ドイツの潜水艦による攻撃をきっかけに、アメリカが連合国側で参戦した。同じ年、ロシアでは革命が起こり、やがて戦争から離れた。1918年にはドイツでも革命が起こって皇帝が退位し、ドイツは降伏した。4年あまり続いた戦争で、兵士だけでもおよそ900万人が亡くなったといわれる。植民地を広げる競争の行き着いた先が、世界をまきこむ大戦争だったのである。この反省から、戦後には国際協調の新しいしくみがつくられていく。"},{"id":"m6c07","title":"皇帝が消え、連盟が生まれた","kind":"世界史","points":["1917年のロシア革命でレーニンらがソビエト政府をつくり、1922年に世界初の社会主義国家ソ連が成立した。","大戦後にベルサイユ条約が結ばれ、アメリカのウィルソン大統領の提案で、1920年に国際連盟が発足した。","ワシントン会議などで国際協調が進んだが、国際連盟にはアメリカの不参加などの弱点があった。"],"body":"1917年3月、第一次世界大戦のさなかのロシアの首都ペトログラードで、「パンと平和」を求める労働者や兵士が立ち上がった。長引く戦争で食料が不足し、人々の不満は限界に達していたのだ。この動きは各地に広がり、皇帝は退位に追いこまれた。こうして、300年あまり続いたロマノフ王朝は終わりをむかえた。\n\nしかし、新しくできた臨時政府は戦争を続けたため、人々の不満はおさまらなかった。同じ年の11月、レーニンの指導する勢力が臨時政府をたおし、労働者や兵士の代表会議であるソビエトを中心とする政府をつくった。この一連の動きをロシア革命という。新しい政府は土地を農民に分け、ドイツと講和して戦争から離れた。\n\n資本家ではなく労働者が主役となる社会主義の国の誕生に、資本主義の国々は強い警戒をいだいた。革命の広がりをおそれたイギリス、フランス、アメリカ、日本などは、シベリアに軍隊を送って革命に干渉した（シベリア出兵）。しかし革命政府はこれを退け、1922年にソビエト社会主義共和国連邦（ソ連）が成立した。世界で初めての社会主義の国家である。\n\n第一次世界大戦が終わると、1919年にパリで講和会議が開かれ、ドイツとの間でベルサイユ条約が結ばれた。ドイツはすべての植民地と領土の一部を失い、軍備を制限されたうえ、巨額の賠償金を課せられた。また、アメリカのウィルソン大統領が唱えた民族自決の考えにもとづき、東ヨーロッパでは多くの国が独立した。ただし、アジアやアフリカの植民地には、この考えは当てはめられなかった。\n\nウィルソンは、二度と大きな戦争を起こさないための国際組織をつくることも提案した。こうして1920年に発足したのが、国際連盟である。本部はスイスのジュネーブに置かれ、日本はイギリス、フランス、イタリアとともに常任理事国となった。事務局次長には新渡戸稲造が選ばれ、国際平和のために力をつくした。\n\nところが、提案国であるアメリカは、議会の反対で国際連盟に加わらなかった。ソ連やドイツも、はじめは加盟を認められなかった。さらに、議決は原則として全会一致とされ、侵略をした国に対して軍事的な制裁を加える手段ももたなかった。こうした弱点は、のちに大きな問題となる。\n\nそれでも1920年代は、国際協調が進んだ時代だった。1921年から翌年にかけて開かれたワシントン会議では、主要国の海軍の主力艦を制限する条約が結ばれ、日英同盟も解消された。一方、アジアでは民族の独立を求める声が高まり、1919年には朝鮮で三・一独立運動、中国で五・四運動が起こった。インドではガンディーが、非暴力・不服従をかかげて独立運動を指導した。\n\n戦争をなくすために国々が集まって話し合うという考えは、この時代に初めて形になった。そのしくみは、のちの国際連合へと受けつがれていく。"},{"id":"m6c08","title":"ニューヨーク発の大不況","kind":"世界史","points":["1929年、ニューヨークの株価の暴落から世界恐慌が起こり、各国で会社の倒産や失業が広がった。","アメリカはニューディール政策、英仏はブロック経済で対応し、五か年計画を進めるソ連は影響を受けなかった。","イタリアのムッソリーニやドイツのヒトラーがファシズムの独裁政治を行い、他国への侵略を進めた。"],"body":"1929年10月24日、アメリカのニューヨークにある株式市場で、株価が大きく下がり始めた。売り注文が殺到し、株の値段は数日のうちに暴落した。のちに「暗黒の木曜日」とよばれるこの日が、世界中をまきこむ大不況の始まりだった。\n\n第一次世界大戦後のアメリカは、世界一の経済大国として繁栄していた。しかし、工場でつくられる製品が増え続ける一方で、それを買う力は追いついていなかった。株価の暴落をきっかけに、銀行や会社が次々に倒産し、街には職を失った人々があふれた。もっとも苦しい時期には、アメリカの労働者のおよそ4人に1人が失業していたといわれる。アメリカの不景気は、アメリカの資金にたよっていたヨーロッパなど各国にも広がり、世界恐慌となった。\n\n各国は、それぞれの方法で恐慌を乗りこえようとした。アメリカでは、ローズベルト大統領がニューディール（新規まき直し）政策を始めた。政府が積極的に経済に関わり、ダムの建設などの大規模な公共事業をおこして失業者を雇い、労働組合を保護して労働者の生活を守ろうとした。\n\n多くの植民地をもつイギリスやフランスは、本国と植民地との結びつきを強め、それ以外の国からの輸入品には高い関税をかけて、自国の経済を守ろうとした。これをブロック経済という。一方、ソ連はスターリンの指導のもとで五か年計画を進めており、恐慌の影響をほとんど受けずに工業を成長させた。ただしその裏では、反対する人々への厳しい弾圧も行われていた。\n\n植民地が少なく、経済の行きづまりを打開しにくかった国々では、ファシズムとよばれる動きが力を強めた。ファシズムとは、民主主義や個人の自由を否定し、民族や国家の利益を最優先にかかげる独裁的な政治である。イタリアでは、1922年からムッソリーニのひきいるファシスト党が政権をにぎっていたが、恐慌後の1935年にはエチオピアに侵攻し、翌年に併合した。\n\nドイツでは、敗戦による巨額の賠償金に加えて、恐慌で失業者が急増していた。国民の不満が高まる中、ヒトラーのひきいるナチス（国民社会主義ドイツ労働者党）は、ベルサイユ条約の破棄や民族の復興を訴えて支持を集めた。ナチスは選挙で議席をのばして第一党となり、1933年にヒトラーが首相となって政権をにぎった。その後、他の政党を解散させて独裁を確立し、国際連盟から脱退して軍備を拡大した。公共事業や軍需産業で失業者を減らす一方、言論を厳しく取りしまり、ユダヤ人を迫害した。\n\n日本でも同じころ、軍部が政治の主導権をにぎり、中国への進出を強めていた。やがてドイツ、イタリア、日本は互いに接近し、世界は再び大きな戦争へと向かっていく。不況による生活の苦しさは、人々が強い指導者に期待を寄せる土台となった。経済の危機が、政治や平和のあり方まで大きく変えてしまうことを、この時代の歴史は示している。"},{"id":"m6c09","title":"6年続いた二度目の大戦","kind":"世界史","points":["1939年、ドイツがポーランドに侵攻し、イギリスとフランスがドイツに宣戦して第二次世界大戦が始まった。","日独伊の枢軸国と、米英ソ中などの連合国が戦い、ドイツは占領地でユダヤ人を迫害し、殺害した。","1943年にイタリア、1945年5月にドイツ、8月に日本が降伏し、大戦は数千万人の死者を出して終わった。"],"body":"1939年9月1日の早朝、ドイツ軍がポーランドへの侵攻を始めた。その直前、ドイツは対立していたはずのソ連と独ソ不可侵条約を結び、東側の安全を確保していた。ポーランドと同盟を結んでいたイギリスとフランスは、ドイツに宣戦した。第二次世界大戦の始まりである。\n\nそれまでにもドイツは、オーストリアを併合し、チェコスロバキアの一部を手に入れるなど、領土を広げていた。イギリスやフランスは戦争をさけようとして要求の一部を認めていたが、ポーランドへの侵攻で、ついに戦争となった。ドイツ軍は戦車と飛行機を組み合わせた素早い攻撃で勢力をのばし、1940年にはパリを占領して、フランスを降伏させた。同じ年、イタリアもドイツ側について参戦し、日本はドイツ、イタリアと日独伊三国同盟を結んだ。\n\nドイツはヨーロッパの広い地域を支配し、占領地で厳しい政治を行った。とくにユダヤ人に対しては、ポーランドのアウシュビッツなどの強制収容所に送り、働かせたり殺害したりした。こうして殺害されたユダヤ人は、およそ600万人にのぼるといわれる。オランダの隠れ家で日記を書き続けた少女アンネ・フランクも、収容所に送られて命を落とした一人である。占領された地域の人々は、レジスタンスとよばれる抵抗運動を続けた。\n\n1941年6月、ドイツは不可侵条約を破ってソ連に攻めこんだ。同じ年の8月、アメリカのローズベルト大統領とイギリスのチャーチル首相は大西洋憲章を発表し、領土を広げないことや、民族自決など、戦後の平和の原則を示した。そして12月に日本がアメリカやイギリスとの戦争を始めると、戦争は世界の広い範囲に広がった。\n\nこうして、日本・ドイツ・イタリアなどの枢軸国と、アメリカ・イギリス・ソ連・中国などの連合国が戦う構図が固まった。枢軸国の中心は、民主主義を否定する独裁的な国家だった。連合国側は、この戦争をファシズムに対する戦いだと位置づけた。\n\n戦争の流れは、やがて連合国に傾いた。ソ連はドイツ軍の進撃をくい止めて反撃に転じ、1943年にはイタリアが降伏した。1944年6月には、アメリカやイギリスを中心とする連合国軍がフランス北部のノルマンディーに上陸し、8月にはパリを解放した。東西からはさまれたドイツは、1945年5月に降伏した。日本も8月にポツダム宣言を受け入れて降伏し、6年におよんだ大戦はようやく終わった。\n\nこの戦争では、兵士だけでなく、空襲や虐殺、飢えなどによって多くの一般の市民が命を落とし、死者は世界全体で数千万人にのぼったといわれる。戦争を防げなかった国際連盟の反省から、連合国は大戦中から新しい国際組織づくりを話し合い、1945年に国際連合が生まれた。今日の平和を守るしくみは、この大戦の痛ましい経験の上に築かれているのである。"},{"id":"m6c10","title":"なぜ「冷たい」戦争なのか","kind":"世界史","points":["1945年に国際連合が発足し、安全保障理事会では五つの常任理事国が拒否権をもつしくみがとられた。","戦後、アメリカ中心の資本主義の西側陣営と、ソ連中心の共産主義の東側陣営が対立する冷戦が続いた。","1989年に冷戦の終結が宣言され、ソ連の解体後、世界はグローバル化や地域紛争などの課題に向き合っている。"],"body":"戦争といえば、銃や大砲で撃ち合うものを思いうかべるだろう。ところが第二次世界大戦のあと、アメリカとソ連という二つの大国が、直接には戦火を交えないまま、40年あまりにわたって激しく対立し続けた。これを冷たい戦争、つまり冷戦という。\n\n大戦が終わった1945年、二度と世界大戦を起こさないことを目指して、国際連合（国連）が51か国で発足した。本部はアメリカのニューヨークに置かれた。世界の平和と安全を守る中心となるのが安全保障理事会で、アメリカ、イギリス、フランス、ソ連、中国の5か国が常任理事国となった。常任理事国は拒否権をもち、1か国でも反対すると重要な決定はできない。国際連盟とちがい、国連は軍事的な制裁も行えるしくみをもった。\n\nしかし、大戦で協力したアメリカとソ連は、戦後まもなく対立を深めた。アメリカを中心とする資本主義の西側陣営と、ソ連を中心とする共産主義（社会主義）の東側陣営である。西側は北大西洋条約機構（NATO）、東側はワルシャワ条約機構という軍事同盟をつくり、たがいに核兵器の開発をきそった。ドイツは東西に分かれて独立し、1961年には東西ベルリンの境界にベルリンの壁が築かれた。\n\n米ソが直接戦わなかったとはいえ、冷戦の影響を受けた戦争はアジアなどで起こった。1950年には朝鮮戦争が起こり、1960年代からはベトナム戦争が激しくなった。1962年には、キューバにソ連のミサイル基地がつくられたことをめぐって、米ソが核戦争の一歩手前まで対立した（キューバ危機）。\n\nその一方で、アジアやアフリカでは植民地からの独立が進んだ。1955年にはアジア・アフリカ会議が開かれ、平和共存などが話し合われた。1960年にはアフリカで17か国が独立し、「アフリカの年」とよばれた。新しく独立した国々も国連に加わり、加盟国は大きく増えていった。\n\n1980年代、ソ連では経済が行きづまり、改革が進められた。東ヨーロッパの国々では民主化を求める動きが広がり、1989年にはベルリンの壁が取りこわされた。同じ年、アメリカとソ連の首脳がマルタ会談で冷戦の終結を宣言した。翌1990年には東西ドイツが統一され、1991年にはソ連が解体した。\n\n冷戦が終わっても、世界から争いがなくなったわけではない。民族や宗教の対立などによる地域紛争やテロが各地で起こり、国連は平和維持活動（PKO）などを通じて解決に取り組んでいる。ヨーロッパではヨーロッパ連合（EU）がつくられ、国どうしの結びつきが強まった。人やもの、お金が国境をこえて行き来するグローバル化が進み、地球温暖化のように一つの国だけでは解決できない問題も増えている。\n\n冷戦の時代に二つに分かれていた世界は、今では深く結びついている。だからこそ、国どうしが話し合い、協力するしくみの大切さは、ますます大きくなっているのだ。"}]</script>

<script>
/* 文の分割：文節らしい区切りで切り、目標字数ごとにまとめる */
window.Chunker = (function () {
  const OPEN = '「『（(【〈《［';
  const CLOSE = '」』）)】〉》］';
  const STOP = '。！？!?';
  const PARTICLES = 'をがにはのでともやへかよねな';
  const cls = ch => {
    if (/\s/.test(ch)) return 'S';
    if (STOP.includes(ch) || ch === '、' || ch === '，' || ch === ',' || ch === '．' || ch === '・' || CLOSE.includes(ch)) return 'P';
    if (OPEN.includes(ch)) return 'O';
    if (/[ぁ-ゖ]/.test(ch)) return 'H';
    return 'C';
  };
  // 文字の表示幅（全角1、半角0.56）
  const units = s => { let u = 0; for (const ch of s) u += /[\x20-\x7e]/.test(ch) ? 0.56 : 1; return u; };
  const count = s => s.replace(/\s/g, '').length;

  function phrases(s) {
    const out = []; let cur = ''; let prev = null;
    for (const ch of s) {
      let c = cls(ch);
      if ((ch === 'ー' || ch === '々' || ch === '〜') && prev) c = prev === 'H' ? 'H' : 'C';
      // 送りがな1字をはさむ複合語（食べ物・持ち主・踊り場など）は切らない
      const glue = c === 'C' && prev === 'H' && cur.length >= 2 && cls(cur[cur.length - 2]) === 'C' && /[一-龥々]/.test(ch) && !PARTICLES.includes(cur[cur.length - 1]);
      const brk = cur && !glue && (
        ((c === 'C' || c === 'O') && (prev === 'H' || prev === 'S')) ||
        (prev === 'P' && c !== 'P' && c !== 'S') ||
        (c !== 'S' && prev === 'S'));
      if (brk) { out.push(cur); cur = ''; }
      cur += ch; prev = c;
    }
    if (cur) out.push(cur);
    return out;
  }

  function chunkify(s, target, max) {
    // 数行まとめて出す長い区切りでは、段落を均等な長さに分け、なるべく文末で切る
    const big = target >= 40;
    if (big) { const tot = units(s), n = Math.max(1, Math.round(tot / target)); target = tot / n; max = target * 1.5; }
    const ph = [];
    for (const p of phrases(s)) {
      if (units(p) <= max * 1.6) { ph.push(p); continue; }
      let cur = ''; // 長すぎる語は機械的に切る
      for (const ch of p) { if (units(cur + ch) > max) { ph.push(cur); cur = ''; } cur += ch; }
      if (cur) ph.push(cur);
    }
    if (big) return packBig(ph, target);
    const out = []; let cur = '';
    const flush = () => { if (cur.trim()) out.push(cur.trim()); cur = ''; };
    for (let i = 0; i < ph.length; i++) {
      const p = ph[i];
      if (cur && units(cur + p) > max) flush();
      cur += p;
      const u = units(cur), t = cur.trim(), last = t[t.length - 1];

// あまり読んでいない文章から選ぶ（同じ回数なら無作為、直前の文章は避ける）
function pickLeast(lv, n) {
  const list = poolOf(lv), out = [];
  while (out.length < Math.min(n, list.length)) {
    let cand = list.filter(p => !out.includes(p) && p.id !== S.last[lv]);
    if (!cand.length) cand = list.filter(p => !out.includes(p));
    const min = Math.min(...cand.map(p => seenOf(p.id)));
    const pool = cand.filter(p => seenOf(p.id) === min);
    out.push(pool[Math.floor(Math.random() * pool.length)]);
  }
  return out;
}

      const r = d.documentElement;
      const p = (r.requestFullscreen || r.webkitRequestFullscreen || (() => null)).call(r);
      if (p && p.catch) p.catch(() => {});
    } else if (isFs) {
      const p = (d.exitFullscreen || d.webkitExitFullscreen).call(d); if (p && p.catch) p.catch(() => {});

}

   読書エンジン
   ===================================================== */
const R = { state: 'idle', queue: [], qi: 0, p: null, chunks: [], idx: 0, acc: 0, k: 1, speed: 700, suffix: [], readMs: 0, readChars: 0, counted: -1, maxSpeed: 0, rewinds: 0, cur: null, fs: 40, boxW: 600, maxU: 10, totalChars: 0, lv: 2, timers: [] };

function buildQueue() {
  const lv = S.lv, pick = S.pick[lv], list = poolOf(lv);
  if (pick === 'custom' && S.custom) return [{ lv, id: 'custom', title: S.custom.title, kind: '自分の文章', body: S.custom.body, custom: true }];
  if (pick === 'chain') return pickLeast(lv, 3);
  const one = list.find(p => p.id === pick);
  if (one) return [one];
  return pickLeast(lv, 1);
}
function load(p) {
  const L = LV[R.lv];
  R.p = p; R.chunks = []; R.idx = 0; R.acc = 0; R.counted = -1;
  if (!p.custom) { S.seen[p.id] = seenOf(p.id) + 1; save(); }
  const paras = C.normalize(p.body);
  paras.forEach((para, pi) => {
    const cs = C.chunkify(para, L.target, L.max);
    cs.forEach((t, j) => {
      const n = C.count(t), last = t[t.length - 1];
      const stop = /[。！？!?]/.test(last) || /[」』）)]/.test(last) && /[。！？!?]/.test(t[t.length - 2] || '');
      const comma = /[、，,]/.test(last);
      const paraEnd = j === cs.length - 1;
      const w = n * (1 + (stop ? 0.4 : 0) + (comma ? 0.12 : 0) + (paraEnd ? 0.7 : 0));
      R.chunks.push({ t, n, w, para: pi, stop, paraEnd, u: C.units(t) });
    });
  });
  const totalN = R.chunks.reduce((a, c) => a + c.n, 0), totalW = R.chunks.reduce((a, c) => a + c.w, 0);
  R.k = totalN / totalW; R.passChars = totalN;
  R.prefix = [0]; R.chunks.forEach(c => R.prefix.push(R.prefix[R.prefix.length - 1] + c.n));
  R.suffix = Array(R.chunks.length + 1).fill(0);
  for (let i = R.chunks.length - 1; i >= 0; i--) R.suffix[i] = R.suffix[i + 1] + R.chunks[i].w;
  R.maxU = Math.max(...R.chunks.map(c => c.u));
  R.paras = paras.length;
  layoutFont();
  $('hLv').textContent = `${LV[R.lv].name} ・ ${p.kind}`;
  $('hTitle').textContent = p.title + (R.queue.length > 1 ? `（${R.qi + 1}/${R.queue.length}）` : '');
}
const dur = i => Math.max(90, R.chunks[i].w * R.k / R.speed * 60000);
function layoutFont() {
  const L = LV[R.lv], st = $('stage'), mob = innerWidth < 600;
  st.classList.toggle('blockmode', !!L.block);
  const W = st.clientWidth * (mob ? 0.9 : (L.block ? 0.86 : 0.8)), H = st.clientHeight;
  const ret = $('reticle');
  if (L.block) {
    // 1行の字数を変えながら、画面に収まるいちばん大きな文字サイズを探す
    const LH = 1.6, avail = H * (mob ? 0.74 : 0.72);
    let best = null;
    for (let per = 8; per <= 70; per++) {
      const lines = Math.ceil(R.maxU / per);
      const f = Math.min(W / (per + 0.6), avail / (lines * LH));
      if (!best || f > best.f) best = { f, per, lines };
    }
    const fs = Math.max(11, Math.floor(Math.min(best.f, L.maxFs)));
    const per = Math.min(best.per, Math.floor(W / (fs * 1.02)));
    const lines = Math.ceil(R.maxU / per);
    R.fs = fs; R.boxW = Math.ceil(per * fs * 1.02 + 2);
    ret.style.setProperty('--rw', Math.min(st.clientWidth - 12, R.boxW + fs * 2.4) + 'px');
    ret.style.setProperty('--rh', Math.ceil(fs * LH * lines + fs * 2) + 'px');
  } else {
    const minFs = mob ? 25 : 34;
    let lines = L.lines;
    while (lines < 4 && W / Math.ceil(R.maxU / lines + 0.6) < minFs) lines++;
    const per = Math.ceil(R.maxU / lines + 0.6);
    const fs = Math.max(18, Math.floor(Math.min(W / per, H * 0.42 / (lines * 1.32), 118)));
    R.fs = fs; R.boxW = Math.ceil(per * fs * 1.04 + fs * 0.4);

// 文字は2枚の要素を交互に使い回す（文節ごとに作って捨てない）
const TXT = { nodes: [], front: 0 };
function textNodes() {
  if (!TXT.nodes.length) {
    const st = $('stage');
    for (let i = 0; i < 2; i++) { const n = el('div', 'chunk'); n.style.visibility = 'hidden'; n.setAttribute('aria-live', 'off'); st.append(n); TXT.nodes.push(n); }

}
function sizeNodes() { for (const n of TXT.nodes) { n.style.fontSize = R.fs + 'px'; n.style.width = R.boxW + 'px'; } }
const IN = (back) => [
  Object.assign({ transform: `translate(-50%,-50%) translateZ(${back ? 360 : -620}px) rotateX(${back ? -8 : 10}deg)`, opacity: 0 }, LITE ? {} : { filter: 'blur(6px)' }),
  Object.assign({ transform: 'translate(-50%,-50%) translateZ(0) rotateX(0)', opacity: 1 }, LITE ? {} : { filter: 'blur(0)' }),
];
const OUT = (back) => [
  Object.assign({ transform: 'translate(-50%,-50%) translateZ(0)', opacity: 1 }, LITE ? {} : { filter: 'blur(0)' }),
  Object.assign({ transform: `translate(-50%,-50%) translateZ(${back ? -500 : 340}px)`, opacity: 0 }, LITE ? {} : { filter: 'blur(10px)' }),

  R.cur = null;

  R.idx = ni; R.acc = 0;
  if (R.state === 'paused') renderContext(); else showChunk(R.idx, d);
  hud(true);
}
function changeSpeed(dir, big) {
  const st = stepOf(dir > 0 ? R.speed : R.speed - 1) * (big ? 4 : 1);
  R.speed = Math.max(SMIN, Math.min(smax(R.lv), Math.round((R.speed + dir * st) / 10) * 10));
  R.maxSpeed = Math.max(R.maxSpeed, R.speed);
  S.speed[R.lv] = R.speed; save();
  if (R.state === 'reading') BG.setSpeed(travelFor());
  $('pSpd').textContent = fmt(R.speed);
  toast(`${fmt(R.speed)} 字/分`);
  hud(true);
}
let toastT = 0;
function toast(t) { const n = $('toast'); n.textContent = t; n.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => n.classList.remove('on'), 900); }
let hudLast = 0;
function hud(force) {
  const now = performance.now();
  if (!force && now - hudLast < 120) return;
  hudLast = now;
  $('hSpd').textContent = fmt(R.speed);
  const done = R.prefix[R.idx];
  $('hBar').style.transform = `scaleX(${(R.idx / Math.max(1, R.chunks.length - 1)).toFixed(4)})`;
  $('hChars').textContent = `${fmt(done)} / ${fmt(R.passChars)}字`;
  const remain = R.suffix[R.idx + 1] * R.k / R.speed * 60000 + Math.max(0, (R.chunks[R.idx] ? dur(R.idx) : 0) - R.acc);
  $('hRemain').textContent = '残り ' + clock(remain);
}
function toTitle() {
  R.timers.forEach(clearTimeout); R.timers = [];
  R.state = 'idle'; clearStage();
  $('play').hidden = true; $('clear').hidden = true; $('title').hidden = false; $('cd').hidden = true; $('pause').hidden = true;
  BG.setSpeed(40); BG.setBright(.5); BG.setLens(.35); keepAwake(false);
  renderTitle();
}

/* ---------- 読了 ---------- */
const RATES = [
  { mark: '◎', label: 'ほぼ全部', desc: '要点をすべて言える', f: 1.10, tag: '+10%' },
  { mark: '○', label: 'だいたい', desc: '要点の大半はつかめた', f: 1.00, tag: '据え置き' },
  { mark: '△', label: '半分くらい', desc: '流れは追えたが抜けが多い', f: 0.90, tag: '−10%' },
  { mark: '✕', label: 'ほとんど', desc: '文字を追うので精一杯', f: 0.80, tag: '−20%' },
];
function countUp(node, to, show, ms) {
  if (reduced) { node.textContent = show(to); return; }
  const t0 = performance.now();
  const tick = now => { const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3); node.textContent = show(to * e); if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
function finish() {
  R.state = 'clear';
  R.timers.forEach(clearTimeout); R.timers = [];
  S.last[R.lv] = R.p.id;
  const mins = R.readMs / 60000, avg = mins > 0 ? R.readChars / mins : 0;
  const full = R.readChars >= R.totalChars * 0.9;
  const custom = !!R.queue[0].custom;
  R.result = { avg, full, custom, base: R.speed, rated: -1, prevGrasp: S.grasp[R.lv] || 0 };
  S.total += R.readChars; if (full) { S.done += R.queue.length; for (const p of R.queue) if (!p.custom) S.reads[p.id] = (S.reads[p.id] || 0) + 1; }
  save(); keepAwake(false);
  BG.warp(); BG.setSpeed(30); BG.setBright(.5); BG.setLens(.6);
  clearStage();
  $('play').hidden = true; $('clear').hidden = false;
  const box = $('cbox'); box.textContent = '';
  box.append(el('h1', 'cword', 'COMPLETE'));
  box.append(el('p', 'csub', R.queue.length > 1 ? `${R.queue.length}本を続けて読み終えました` : `「${R.p.title}」を読み終えました`));

  const cs = el('div', 'cstats');
  const stat = (k, u) => { const d = el('div', 'cs'); const v = el('span', 'v'); const n = el('span', null, '0'); v.append(n); if (u) v.append(el('small', null, u)); d.append(el('span', 'k', k), v); cs.append(d); return n; };
  countUp(stat('読んだ字数', '字'), R.readChars, x => fmt(x), 900);
  stat('読書時間').textContent = clock(R.readMs);
  countUp(stat('平均の速さ', '字/分'), avg, x => fmt(x), 900);
  stat('止めた・戻った', '回').textContent = `${R.pauses} ・ ${R.rewinds}`;
  box.append(cs);

  const withPts = R.queue.filter(p => p.points && p.points.length);
  if (withPts.length) {
    const kp = el('section', 'panelx keypts');
    kp.append(el('h2', 'sech', 'KEY POINTS'), el('p', 'sechint', 'この単元のポイントです。頭に残っている内容と照らし合わせてみましょう。'));
    let n = 0;
    for (const p of withPts) {
      if (withPts.length > 1) kp.append(el('h3', 'kpt', p.title));
      const ol = el('ul', 'kplist');
      for (const t of p.points) { const li = el('li', null, t); li.style.animationDelay = (0.35 + 0.12 * n++) + 's'; ol.append(li); }
      kp.append(ol);
    }
    box.append(kp);
  }

  const rs = el('section', 'panelx ratebox');
  rs.append(el('h2', 'sech', 'どれくらいつかめた？'));
  rs.append(el('p', 'sechint', '答えに合わせて、次回の速度を調整します。'));
  const grid = el('div', 'rates');
  RATES.forEach((r, i) => {
    const b = el('button', 'rt'); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
    b.append(el('span', 'mk', r.mark), el('span', 'lb', r.label), el('span', 'ds', r.desc), el('kbd', null, String(i + 1)));
    b.addEventListener('click', () => { rate(i); b.blur(); });
    grid.append(b);
  });
  rs.append(grid, el('div', 'rateout'));
  rs.querySelector('.rateout').id = 'rateOut';
  box.append(rs);

  const row = el('div', 'btnrow');
  const mk = (label, key, fn, pri) => { const b = el('button', 'btn' + (pri ? ' pri' : ''), label); b.type = 'button'; if (key) b.append(el('kbd', null, key)); b.addEventListener('click', fn); row.append(b); return b; };
  const nextB = mk(custom ? 'もう一度読む' : '次の文章へ', 'Enter', nextPassage, true);
  if (!custom) mk('同じ文章をもう一度', 'R', retry);
  mk('全文を確認', null, () => openFullText(R.queue));
  mk('タイトルへ', 'Esc', toTitle);
  box.append(row);
  $('clear').scrollTop = 0;
  nextB.focus({ preventScroll: true });
}
function rate(i) {
  const res = R.result; if (!res) return;
  const r = RATES[i];
  res.rated = i;
  document.querySelectorAll('.rt').forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
  const next = Math.max(SMIN, Math.min(smax(R.lv), Math.round(res.base * r.f / 10) * 10));
  S.speed[R.lv] = next;
  const okRead = i <= 1 && res.full && !res.custom;
  S.grasp[R.lv] = okRead ? Math.max(res.prevGrasp, Math.round(res.avg)) : res.prevGrasp;
  if (!S.grasp[R.lv]) delete S.grasp[R.lv];
  const rec = (S.grasp[R.lv] || 0) > res.prevGrasp;
  save();
  const out = $('rateOut'); out.textContent = '';
  const st = el('div', 'stamp'); st.append(el('span', null, r.mark));
  const msg = el('div', 'rmsg');
  msg.append(el('b', null, `次回は ${fmt(next)} 字/分`), el('span', null, `（${r.tag}）でセットしました`));
  if (rec) msg.append(el('span', 'newrec', 'つかめた最高速度を更新'));
  else if (res.prevGrasp && i <= 1) msg.append(el('span', 'rnote', `このレベルのつかめた最高速度：${fmt(res.prevGrasp)} 字/分`));
  out.append(st, msg);
}
function retry() { start(R.queue); }
function nextPassage() {
  if (R.queue[0].custom) { start(R.queue); return; }
  start(pickLeast(R.lv, R.queue.length > 1 ? 3 : 1));
}

/* ---------- 入力 ---------- */
$('hPause').addEventListener('click', e => { e.stopPropagation(); pause(); });
$('hUp').addEventListener('click', e => { e.stopPropagation(); changeSpeed(1); });
$('hDown').addEventListener('click', e => { e.stopPropagation(); changeSpeed(-1); });
$('pUp').addEventListener('click', () => changeSpeed(1));
$('pDown').addEventListener('click', () => changeSpeed(-1));
$('pResume').addEventListener('click', resume);
$('pBack').addEventListener('click', () => step(-1));
$('pRestart').addEventListener('click', () => { $('pause').hidden = true; start(R.queue); });
$('pTitle').addEventListener('click', toTitle);
$('stage').addEventListener('click', () => { if (R.state === 'reading') pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('resize', () => { if (!$('play').hidden && R.chunks.length) layoutFont(); });

document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = e.target && e.target.tagName;
  if (!$('modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (tag === 'TEXTAREA' || tag === 'INPUT') return;
  const k = e.key, onBtn = tag === 'BUTTON';
  if (k === 'f' || k === 'F') { toggleFs(); return; }
  if (!$('title').hidden) {
    if (k === 'ArrowLeft' || k === 'ArrowRight') { e.preventDefault(); selectLv(((S.lv - 1 + (k === 'ArrowRight' ? 1 : 5)) % 6) + 1); }
    else if (k === 's' || k === 'S') {
      // S：教科を順に切り替える（そのレベルにない教科はとばす）
      const ok = SUBJ.filter(s => s.id === 'all' || passagesOf(S.lv).some(p => inSubj(p, s.id)));
      const i = ok.findIndex(s => s.id === subjOf(S.lv));
      S.subj = ok[(i + 1) % ok.length].id; save(); renderTexts();
    }
    else if (k === 'ArrowUp' || k === 'ArrowDown') { e.preventDefault(); const v = S.speed[S.lv]; setTitleSpeed(v + (k === 'ArrowUp' ? stepOf(v) : -stepOf(v - 1))); }
    else if ((k === 'Enter' || k === ' ') && !onBtn) { e.preventDefault(); start(); }
    return;
  }
  if (!$('play').hidden) {
    if (k === 'Escape' || k === 'q' || k === 'Q') { e.preventDefault(); toTitle(); return; }
    if (R.state === 'countdown' || R.state === 'interlude') return;
    if (k === ' ' || (k === 'Enter' && R.state === 'paused' && !onBtn)) { e.preventDefault(); R.state === 'paused' ? resume() : pause(); return; }
    if (k === 'ArrowUp' || k === 'ArrowDown') { e.preventDefault(); changeSpeed(k === 'ArrowUp' ? 1 : -1, e.shiftKey); return; }
    if (k === 'ArrowLeft' || k === 'ArrowRight') { e.preventDefault(); step(k === 'ArrowLeft' ? -1 : 1); return; }
    return;
  }
  if (!$('clear').hidden) {
    if (k === 'Escape') { e.preventDefault(); toTitle(); }
    else if ((k === 'r' || k === 'R') && !R.queue[0].custom) retry();
    else if (['1', '2', '3', '4'].includes(k)) rate(+k - 1);
    else if (k === 'Enter' && !onBtn) { e.preventDefault(); nextPassage(); }
  }
});

/* ---------- ループ ---------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(100, Math.max(0, now - lastT)); lastT = now;
  if (R.state === 'reading') {
    R.acc += dt; R.readMs += dt;
    let guard = 0;
    while (R.state === 'reading' && R.acc >= dur(R.idx) && guard++ < 8) { R.acc -= dur(R.idx); completeChunk(); }
    hud(false);
  }
  BG.frame(dt);
  requestAnimationFrame(frame);
}

BG.init();
applyWorld(S.lv, true);
BG.setSpeed(40);
renderTitle();
requestAnimationFrame(frame);
})();

</script>
