<script type="application/json" id="content-lv3">[{"id":"m3a01","title":"わるのにかける、分数のなぞ","kind":"算数","points":["分母と分子を入れかえた数を逆数といい、ある数とその逆数をかけると答えは1になる。","わられる数とわる数の両方にわる数の逆数をかけるとわる数が1になるので、分数のわり算は逆数をかける計算になる。","1より小さい数でわると、答えはわられる数より大きくなる。整数でわるときも逆数をかけて計算できる。"],"body":"「3分の2÷5分の4」を計算するとき、学校では「わる数の分母と分子を入れかえて、かけ算にする」と習います。3分の2×4分の5＝12分の10＝6分の5という計算です。わり算だったはずが、いつのまにかかけ算に変わっていて、ふしぎに思った人も多いでしょう。\n\nまず、言葉を確かめておきましょう。分母と分子を入れかえた数を、もとの数の逆数といいます。5分の4の逆数は4分の5です。整数の3は1分の3と考えられるので、逆数は3分の1になります。ある数とその逆数をかけると、5分の4×4分の5＝1のように、答えは必ず1になります。この「かけると1になる」という性質が、なぞをとくかぎです。\n\n1つ目の考え方は、わり算のきまりを使うものです。わり算では、わられる数とわる数に同じ数をかけても、答えは変わりません。たとえば6÷2と、両方を10倍した60÷20は、どちらも答えが3です。そこで、3分の2÷5分の4のわられる数とわる数の両方に、わる数の逆数の4分の5をかけてみます。すると、わる数は5分の4×4分の5で1になり、式は「3分の2×4分の5÷1」に変わります。1でわっても数は変わらないので、残るのは3分の2×4分の5だけです。逆数をかけるのは、わる数を1にしてしまうための工夫だったのです。\n\n2つ目は、場面に当てはめて考える方法です。長さが5分の4mで、重さが3分の2kgの鉄の棒があるとします。この棒1mの重さを求める式が、3分の2÷5分の4です。5分の4mは、1mを5等分した長さの4つ分です。そこで、まず重さを4でわると、5分の1mの重さが分かります。3分の2÷4＝12分の2で、6分の1kgです。1mはその5つ分なので、5をかけて6分の1×5＝6分の5kgになります。「4でわって5をかける」という手順は、4分の5をかけることとまったく同じです。\n\nここで答えをよく見てください。6分の5は、もとの3分の2より大きな数です。わり算なのに答えが大きくなったのは、1より小さい数でわったからです。1mより短い棒の重さをもとに1m分の重さを求めたのですから、重くなるのは当然ですね。反対に、整数でわる場合も逆数の考え方で計算できます。3分の2÷2は、2の逆数の2分の1をかけて、3分の2×2分の1＝6分の2＝3分の1です。3分の2を半分にした数なので、ちゃんと合っています。\n\n逆数をかけるやり方は、ただ暗記するためのきまりではなく、わり算の性質から自然に導かれたものです。身の回りでも、たとえば自転車で4分の3時間、つまり45分かけて12km進んだときの速さは、12÷4分の3＝12×3分の4＝16で、時速16kmと求められます。「1あたりの量」を知りたい場面で、この計算はいつでも役に立ちます。"},{"id":"m3a02","title":"折っても回しても同じ形","kind":"算数","points":["1本の直線を折り目にして2つに折ると両側がぴったり重なる図形を線対称といい、その直線を対称の軸という。","1つの点を中心に180度回すともとの図形に重なる図形を点対称といい、その点を対称の中心という。","平行四辺形は点対称だが線対称ではなく、正方形・長方形・ひし形・円はどちらの性質ももつ。"],"body":"紙を2つに折って、折り目をふくむように好きな形を切りぬいてみましょう。広げると、左右がそっくりな形が現れます。チョウやトンボのような形も、かんたんに作れます。こうした形は、算数では線対称な図形とよばれ、身の回りにたくさんかくれています。\n\n1本の直線を折り目にして2つに折ったとき、両側がぴったり重なる図形を線対称な図形といい、その直線を対称の軸といいます。重なり合う点や辺、角を、それぞれ対応する点、対応する辺、対応する角とよびます。対応する辺の長さや、対応する角の大きさは等しくなります。また、対応する2つの点を結ぶ直線は、対称の軸と垂直に交わり、軸から対応する2つの点までの長さは等しくなっています。\n\nもう1つのなかまが、点対称な図形です。ある点を中心にして180度回したとき、もとの図形にぴったり重なる図形のことで、その中心の点を対称の中心といいます。点対称な図形では、対応する2つの点を結ぶ直線は必ず対称の中心を通り、中心から対応する2つの点までの長さは等しくなります。このきまりを使えば、対応する点を2組結び、その2本の直線が交わる点を見つけることで、対称の中心を探し出せます。\n\nアルファベットで確かめてみましょう。Aは、真ん中にたての軸がある線対称な形です。Nは、どこで折ってもうまく重なりませんが、紙を机の上で半回転、つまり180度回すと、もとと同じ形になります。つまり点対称です。Hは、たてと横の2本の軸をもつ線対称な形であり、しかも点対称でもあります。1つの形が、両方の性質をあわせもつこともあるのです。\n\n四角形ではどうでしょうか。正方形は対称の軸が4本あり、点対称でもあります。長方形とひし形は軸が2本あり、どちらも点対称です。平行四辺形は、どこで折っても重なりませんが、2本の対角線が交わる点を中心に180度回すとぴったり重なるので、点対称な図形です。三角形では、二等辺三角形は軸が1本、正三角形は軸が3本の線対称な図形ですが、どちらも点対称ではありません。円は、中心を通るどの直線も対称の軸になり、中心を対称の中心とする点対称な図形でもあります。\n\n身の回りを見ると、線対称に近い形は、人の顔やチョウの羽、神社の鳥居など、あちこちにあります。点対称な形は、2枚の羽根でできたプロペラや、上下さかさまに置いても同じに見えるようにくふうされたトランプの絵札などに見つかります。線対称は「折ると重なる」、点対称は「回すと重なる」。この2つの見方をもっていると、ふだん目にする模様やマークの見え方が、少し変わってくるはずです。"},{"id":"m3a03","title":"円を切って並べてみたら","kind":"算数","points":["円の面積は、半径×半径×円周率で求められ、円周率はふつう3.14を使って計算する。","円を細かいおうぎ形に分けて並べかえると、たてが半径、横が円周の半分の長方形に近づく。","半径が2倍になると、円の面積は2×2で4倍になる。"],"body":"正方形や長方形の面積は、たて×横で求められます。ところが円には、まっすぐな辺が1本もありません。ふちがぐるりと曲がっているこの形の広さを、どうやって計算すればよいのでしょうか。答えは「半径×半径×円周率」という公式ですが、なぜこの式になるのかを、自分の手で確かめてみましょう。\n\nまず、だいたいの大きさを予想してみます。半径10cmの円を考えましょう。この円がぴったり入る正方形は、1辺が直径の20cmなので、面積は20×20＝400cm²です。円はこれより小さいはずです。反対に、円の内側にぴったり入る正方形は、対角線の長さが20cmなので、面積は20×20÷2＝200cm²です。つまり円の面積は、200cm²より大きく400cm²より小さいと分かります。半径×半径の100cm²でいえば、その2倍と4倍の間です。\n\n次に、円を中心から細かく切り分けます。ピザを切るように、同じ大きさのおうぎ形に16等分してみましょう。それを、とがった方を上と下にたがいちがいに向けながら横に並べていくと、でこぼこした平行四辺形のような形になります。切り分ける数を32、64とふやしていくと、でこぼこはどんどん小さくなり、形は長方形に近づいていきます。\n\nこの長方形のたてと横は、どれだけの長さでしょうか。たては、おうぎ形のまっすぐな部分、つまり円の半径です。横には、おうぎ形の曲がった部分が上と下に半分ずつ並んでいるので、円周の半分の長さになります。円周は直径×円周率でしたから、その半分は半径×円周率です。長方形の面積はたて×横なので、円の面積は半径×（半径×円周率）、つまり半径×半径×円周率になります。\n\n半径10cmの円で計算すると、10×10×3.14＝314で、面積は314cm²です。最初の予想どおり、200cm²と400cm²の間に入っていますね。円周率は、円周の長さが直径の何倍かを表す数で、本当は3.14159…と、どこまでも終わらずに続きます。小学校では、ふつう3.14を使って計算します。\n\nこの公式からは、おもしろいことも分かります。直径20cmのピザと直径40cmのピザをくらべてみましょう。直径は2倍ですが、面積は10×10×3.14＝314cm²と20×20×3.14＝1256cm²で、4倍になります。半径を2回かけるので、半径が2倍になると面積は2×2で4倍になるのです。大きさのちがう丸いケーキやピザを見かけたら、どちらがどれだけ広いのか、公式を使って考えてみてください。"},{"id":"m3a04","title":"地図の1cmは何m？","kind":"算数","points":["比の両方の数に同じ数をかけたり、同じ数でわったりしても比の値は変わらず、等しい比になる。","拡大図や縮図では、対応する角の大きさはそれぞれ等しく、対応する辺の長さの比もすべて等しい。","実際の長さを縮めた割合を縮尺といい、25000分の1の地図では地図上の1cmが実際の250mにあたる。"],"body":"学校のまわりの地図を広げると、家や道路、川が、実物よりずっと小さくかかれています。それでも、地図の上で長さをはかれば、実際のきょりをかなり正確に知ることができます。小さな地図が本物の町の長さを教えてくれるのは、比と縮図のしくみがあるからです。\n\nまず、比について確かめましょう。2つの量の割合を、3：4のように「：」を使って表したものを比といいます。3：4の比の値は3÷4で、4分の3です。比の両方の数に同じ数をかけても、同じ数でわっても、比の値は変わりません。3：4と6：8のように、比の値が同じになる比を、等しい比といいます。\n\n次に、形を変えずに大きくした図を拡大図、小さくした図を縮図といいます。拡大図や縮図では、対応する角の大きさはそれぞれ等しく、対応する辺の長さの比はどこも等しくなっています。たとえば、辺の長さが3cm、4cm、5cmの三角形を、どの辺も2倍にしてかくと、6cm、8cm、10cmの2倍の拡大図になります。どの辺も2分の1にすれば、2分の1の縮図です。角の大きさは、どちらも、もとの三角形と同じままです。\n\n地図は、土地のようすを縮図で表したものです。実際の長さを縮めた割合を縮尺といい、「1：25000」や「25000分の1」、または長さの目もりをつけた線などで地図にかかれています。縮尺が25000分の1の地図では、地図上の1cmが、実際には25000cm、つまり250mにあたります。地図上で4cmはなれている2つの地点なら、4×25000＝100000cmで、実際のきょりは1000m、つまり1kmです。\n\n縮図の考え方を使うと、直接はかれない長さも求められます。晴れた日に、長さ1mの棒を地面にまっすぐ立てたら、かげの長さが1.5mだったとします。同じ時刻に近くの木のかげをはかると、12mでした。棒とそのかげが作る三角形と、木とそのかげが作る三角形は、一方がもう一方の拡大図になっています。かげの長さは12÷1.5＝8で8倍なので、木の高さも1mの8倍で、8mと分かります。\n\n地図には、町の案内図のように、せまいはんいをくわしく表すものもあれば、日本全体を1枚におさめるものもあります。日本全体の地図では、地図上の1cmが何十kmにもあたります。登山などで使う地形図には、25000分の1のものがよく使われます。地図を手に取ったら、すみに書かれた縮尺を見つけて、家から学校までが実際に何mあるのか、計算してみてください。"},{"id":"m3a05","title":"2倍になると、もう一方は？","kind":"算数","points":["xが2倍、3倍になるとyも2倍、3倍になるとき、yはxに比例し、グラフは0の点を通る直線になる。","xが2倍、3倍になるとyが2分の1、3分の1になるとき、yはxに反比例し、x×yはいつも同じ数になる。","一方がふえるともう一方もふえるというだけでは比例とはいえず、2倍、3倍の関係で確かめる。"],"body":"1mあたり80円のリボンを買うとします。2m買えば160円、3m買えば240円です。長さが2倍、3倍になると、代金も2倍、3倍になります。このように、ともなって変わる2つの量の間には、決まった変わり方が見られることがあります。その代表が、比例と反比例です。\n\n2つの量xとyがあって、xが2倍、3倍…になると、yも2倍、3倍…になるとき、yはxに比例するといいます。リボンの例では、長さをxm、代金をy円とすると、y＝80×xという式で表せます。比例する2つの量は、いつも「y＝決まった数×x」の形の式になり、yをxでわった商はいつも同じ数になります。グラフにかくと、0の点を通る直線になるのも大きな特ちょうです。\n\n比例のしくみは、数えるのが大変なときに役立ちます。たとえば、同じ紙がたくさん重なっているとき、1枚ずつ数えなくても、重さで枚数が分かります。紙10枚の重さが40gで、紙の束全体が1200gなら、重さは1200÷40＝30で30倍です。枚数も重さに比例するので、10枚の30倍で300枚と分かります。\n\n次は反比例です。面積が24cm²の長方形を考えましょう。たてが1cmなら横は24cm、2cmなら12cm、3cmなら8cm、4cmなら6cmです。たてが2倍、3倍になると、横は2分の1、3分の1になっています。このように、xが2倍、3倍…になると、yが2分の1、3分の1…になるとき、yはxに反比例するといいます。反比例では、xとyをかけた積がいつも同じ数になり、この例ではx×y＝24です。グラフは直線ではなく、なめらかな曲線になります。\n\nここで注意したいことがあります。一方がふえるともう一方もふえる、というだけでは比例とはいえません。たとえば、年れいと身長はどちらもふえていきますが、10才のときの身長が5才のときの2倍になるわけではありません。同じように、一方がふえるともう一方がへる、というだけでは反比例ではありません。20こあるあめを食べていくとき、食べた数が2こなら残りは18こ、4こなら16こです。食べた数は2倍になっても、残りは2分の1になっていません。比例か反比例かは、2倍、3倍の関係で確かめることが大切です。\n\n身の回りには、比例や反比例の関係がたくさんあります。決まった速さで歩くときの時間と道のりは比例し、同じ道のりを進むときの速さとかかる時間は反比例します。12kmの道のりなら、時速4kmで3時間、時速6kmで2時間です。2つの量がともなって変わるようすを見つけたら、どちらの関係になっているか考えてみましょう。"},{"id":"m3a06","title":"何通り？どれがふつう？","kind":"算数","points":["並べ方や組み合わせ方は、樹形図や表を使って順序よく整理し、落ちや重なりがないように数える。","並べ方では順番を区別するが、組み合わせではAとBの組とBとAの組を同じものとして数える。","代表値には平均値・中央値・最頻値があり、平均値はとびはなれた値に引っぱられることがある。"],"body":"運動会のリレーに、A、B、C、Dの4人で出ることになりました。走る順番の決め方は、全部で何通りあるでしょうか。思いつくままに書き出していくと、同じものを2回書いたり、書きもらしたりしがちです。こんなときは、順序よく整理して数えるのがこつです。\n\n1番目に走る人を決めると、2番目は残りの3人から、3番目は残りの2人から選び、4番目は最後の1人に決まります。1番目をAにした場合を、枝分かれする図にかくと、2番目がBのとき3番目はCかD、というように6通りが見つかります。このような図を樹形図といいます。1番目はA、B、C、Dの4通りあるので、全部で6×4＝24通りです。式で表すと、4×3×2×1＝24になります。\n\n一方、4チームが、どのチームとも1回ずつ試合をするときの試合の数はどうでしょう。AとB、AとC、AとD、BとC、BとD、CとDで、6試合です。リレーでは「AのあとにB」と「BのあとにA」はちがう並べ方ですが、試合では「AとB」と「BとA」は同じ組み合わせです。順番を区別するかどうかで、数え方が変わるのです。表をかいて、同じ組み合わせを消しながら数える方法もあります。\n\n数えることと並んで大切なのが、集めたデータの特ちょうをつかむことです。データ全体を1つの数で代表させた値を代表値といい、小学校では3つを学びます。データの合計を個数でわった平均値、大きさの順に並べたときにちょうど真ん中にくる中央値、データの中でいちばん多く出てくる最頻値です。データの個数が2でわり切れるときは、真ん中に2つの値が並ぶので、その2つの平均を中央値とします。\n\nたとえば、7人が1か月に読んだ本の数を調べたら、0冊、1冊、1冊、1冊、2冊、3冊、13冊だったとします。合計は21冊なので、平均値は21÷7＝3で3冊です。ところが、3冊より多く読んだのは1人だけで、5人は3冊より少ない数です。小さい順に並べて4番目にくる中央値は1冊、いちばん多く出てくる最頻値も1冊です。この場合、1人の13冊に引っぱられて、平均値だけが大きくなっているのです。\n\nどの代表値がふさわしいかは、データのようすや、知りたいことによって変わります。数直線の上にデータを点で表したドットプロットを使うと、かたよりや、とびはなれた値がひと目で分かり、どの代表値を使うかを考えやすくなります。落ちや重なりなく数えることも、データを代表値でまとめることも、ものごとを整理して正しく判断するための大切な道具です。"},{"id":"m3a07","title":"びんの中で火が消えるわけ","kind":"理科","points":["ものが燃え続けるには、空気が入れかわり、新しい空気が送りこまれることが必要である。","空気中の酸素にはものを燃やすはたらきがあり、ちっ素や二酸化炭素にはそのはたらきがない。","ろうそくなどが燃えると空気中の酸素の一部が使われて二酸化炭素ができる。二酸化炭素は石灰水を白くにごらせる。"],"body":"火のついたろうそくに、底のない集気びんをかぶせ、上にふたをしてみます。しばらくすると、ろうそくの火は小さくなり、やがて消えてしまいます。ところが、びんの下にすき間を作り、上のふたを外しておくと、火は燃え続けます。このちがいは、どこから生まれるのでしょうか。\n\n火のついた線香を、びんの下のすき間に近づけてみましょう。けむりはびんの中に吸いこまれ、上の口から出ていきます。下から新しい空気が入り、上から燃えたあとの空気が出ていく流れができているのです。ものが燃え続けるには、空気が入れかわることが必要だと分かります。\n\nでは、空気の中の何が、ものを燃やすはたらきをしているのでしょうか。空気は、体積でおよそ78％のちっ素と、約21％の酸素、それに二酸化炭素などのほかの気体が少しずつ混ざってできています。ちっ素、酸素、二酸化炭素をそれぞれ集めたびんに、火のついたろうそくを入れてみると、ちっ素や二酸化炭素の中では火がすぐに消えますが、酸素の中では、空気中よりもはげしくかがやいて燃えます。酸素には、ものを燃やすはたらきがあるのです。\n\n次に、ろうそくを燃やす前と後で、びんの中の空気を気体検知管で調べます。燃やす前は、酸素が約21％、二酸化炭素が約0.04％です。燃やして火が消えたあとは、酸素が約17％にへり、二酸化炭素は約3％にふえています。また、燃やしたあとのびんに石灰水を入れてふると、白くにごります。石灰水は二酸化炭素にふれると白くにごるので、ろうそくが燃えて二酸化炭素ができたことが確かめられます。\n\nここで、意外なことに気がつきます。火が消えたとき、びんの中の酸素はすっかりなくなったわけではなく、まだ17％ほど残っているのです。ものが燃えるには、ある程度の割合の酸素が必要で、それより少なくなると、火は燃え続けられなくなります。また、燃やす前と後でちっ素の割合はほとんど変わらないことから、ちっ素はものが燃えることには関係していないことも分かります。\n\nこのしくみは、身の回りのいろいろな場面で生かされています。キャンプでたき火をするとき、まきをすき間ができるように組んだり、うちわであおいだりするのは、新しい空気を送りこんで酸素をとどけるためです。反対に、アルコールランプにふたをかぶせて火を消すのは、新しい空気が入らないようにするためです。ろうそくやまきが燃えるとき、目に見えない空気の中では、酸素が使われて二酸化炭素ができるという変化が起きているのです。"},{"id":"m3a08","title":"とう明な液の見分け方","kind":"理科","points":["水よう液は、リトマス紙の色の変わり方によって、酸性・中性・アルカリ性の3つに分けられる。","炭酸水・塩酸・アンモニア水は気体がとけた水よう液で、水を蒸発させても何も残らない。","塩酸はアルミニウムや鉄などの金属をとかし、とけた金属は、もとの金属とは性質のちがう別のものに変わる。"],"body":"実験台の上に、ラベルのない5本の試験管が並んでいます。中身は、食塩水、炭酸水、塩酸、石灰水、アンモニア水のどれかです。炭酸水から小さなあわが出ているほかは、どれも水のようにとう明で、見た目だけでは区別がつきません。けれども、いくつかの方法で順番に調べていけば、正体をつきとめることができます。\n\nまず、においを調べます。においをかぐときは、顔を近づけず、手であおぐようにします。すると、塩酸とアンモニア水からは、鼻をつくようなにおいがします。次に、部屋のかん気をしながら、それぞれを少しずつ蒸発皿に取って熱し、水を蒸発させます。食塩水と石灰水からは白い固体が出てきますが、炭酸水、塩酸、アンモニア水からは何も残りません。この3つには、気体がとけているからです。炭酸水には二酸化炭素、塩酸には塩化水素、アンモニア水にはアンモニアという気体がとけています。\n\nさらに、リトマス紙を使います。青色リトマス紙を赤色に変えるものを酸性、赤色リトマス紙を青色に変えるものをアルカリ性、どちらの色も変えないものを中性といいます。調べると、塩酸と炭酸水は酸性、石灰水とアンモニア水はアルカリ性、食塩水は中性です。液はガラス棒でリトマス紙につけ、一つ調べるたびにガラス棒を水で洗います。におい、蒸発させたあとのようす、リトマス紙の結果を組み合わせれば、5つすべてを見分けられます。\n\n酸性の水よう液には、金属をとかすものがあります。うすい塩酸にアルミニウムや鉄を入れると、あわを出しながらとけていき、やがて見えなくなります。では、とけた金属はどうなったのでしょうか。アルミニウムがとけた液を蒸発させると、白い粉が出てきます。この粉は、塩酸に入れてもあわを出さずにとけ、水にもとけます。もとのアルミニウムとは性質のちがう、別のものに変わったのです。鉄の場合も、出てきた黄色っぽい固体は磁石に引きつけられず、もとの鉄とは別のものになっています。\n\nこのように、水よう液には金属を別のものに変えてしまうほどのはたらきをもつものもあります。そのため実験では、保護めがねをかけ、液が手についたときはすぐに水で洗うことが大切です。見た目は同じとう明な液でも、調べ方を工夫すれば、その中に何がとけていて、どんな性質をもっているのかが分かってきます。\n\n身の回りにも、さまざまな性質の水よう液があります。料理に使う「す」やレモンのしるは酸性、せっけん水の多くはアルカリ性です。台所用の洗ざいの入れ物に、「中性」と書かれているのを見たことがある人もいるでしょう。家にある液体の性質を、表示から探してみるのもおもしろいですよ。"},{"id":"m3a09","title":"地球も動かせる？てこの力","kind":"理科","points":["てこには、棒を支える支点、力を加える力点、ものに力がはたらく作用点の3つの点がある。","力点を支点から遠ざけるほど、また作用点を支点に近づけるほど、小さな力でものを動かせる。","おもりの重さ×支点からのきょりが左右で等しいとき、てこは水平につり合う。"],"body":"古代ギリシャの学者アルキメデスは、「支えになる場所と長い棒があれば、地球だって動かしてみせよう」と言ったと伝えられています。もちろん本当に地球を動かした人はいませんが、この言葉には、てこのしくみのすごさがよく表れています。1本の棒が、なぜ小さな力で重いものを動かせるのでしょうか。\n\n棒の1点を支えにして、棒の一部に力を加え、ものを持ち上げたり動かしたりするしくみを、てこといいます。てこには3つの大切な点があります。棒を支えている点が支点、力を加える点が力点、ものに力がはたらく点が作用点です。たとえば、重い石の下に棒の先を差しこみ、手前に置いた台を支えにして棒をおし下げると、石が持ち上がります。このとき、台のところが支点、手でおす所が力点、石にふれている棒の先が作用点です。\n\n実際に砂ぶくろを持ち上げてみると、手ごたえが変わることに気がつきます。力点を支点から遠ざけるほど、また作用点を支点に近づけるほど、小さな力で持ち上げられるのです。長い棒があれば地球も動かせるという話は、力点を支点からうんと遠くにすれば、とても小さな力で重いものを動かせるという、てこの性質をたとえたものだといえます。\n\nこのことをくわしく調べるのが、実験用てこです。うでには同じ間かくで目もりがつけてあり、左右におもりをつるして、水平につり合う条件を調べます。すると、「おもりの重さ×支点からのきょり」が左右で等しいとき、てこが水平につり合うことが分かります。この値は、てこをかたむけるはたらきの大きさを表しています。たとえば、左のうでの目もり2に30gのおもりをつるすと、30×2＝60です。右のうででは、目もり3に20g、または目もり6に10gをつるせば、どちらも60になってつり合います。\n\nこのきまりは、公園のシーソーにも当てはまります。体重40kgの人と30kgの人が乗るなら、30kgの人が支点から2m、40kgの人が1.5mの所にすわると、30×2＝60、40×1.5＝60で、ちょうどつり合います。軽い人ほど、支点から遠くにすわればよいわけです。また、支点から左右のうでの長さが等しいてんびんは、左右の重さが等しいときにつり合います。上皿てんびんは、このしくみで重さをはかる道具です。\n\n身の回りの道具にも、てこがたくさん使われています。はさみやくぎぬきは支点が力点と作用点の間に、せんぬきは作用点が支点と力点の間にあり、どちらも小さな力で大きな力を生み出せます。一方、ピンセットや和ばさみは力点が支点と作用点の間にあり、作用点の力は加えた力より小さくなりますが、そのぶん力の加減がしやすく、細かい作業に向いています。道具を使うときは、どこが支点、力点、作用点なのか探してみてください。"},{"id":"m3a10","title":"回して、ためて、光らせる","kind":"理科","points":["手回し発電機や光電池で電気をつくることができ、つくった電気はコンデンサーにためられる。","発光ダイオードは、豆電球より少ない電気で明かりをつけることができる。","電気は、光・音・運動・熱などに変えられ、身の回りのさまざまな道具で利用されている。"],"body":"手回し発電機のハンドルをくるくる回すと、つないだ豆電球に明かりがつきます。電池はどこにもつないでいないのに、電気はどこからやってきたのでしょうか。じつは、ハンドルを回す手の動きが、電気に変わっているのです。このように電気をつくることを、発電といいます。\n\n手回し発電機の中には、モーターと同じようなしくみが入っています。ハンドルを速く回すほど電流は大きくなり、豆電球は明るくなります。回す向きを反対にすると、電流の向きも反対になるので、モーターをつないだときは、モーターの回る向きが変わります。発電所でも、大きな発電機を回して電気をつくっています。また、光電池のように、光を当てることで電気をつくる方法もあります。\n\nつくった電気は、ためておくこともできます。そのための部品が、コンデンサーです。手回し発電機をコンデンサーにつないでハンドルを回すと、コンデンサーに電気がたまります。そのコンデンサーを豆電球につなぐと、だれもハンドルを回していないのに、しばらくの間、明かりがつきます。\n\nここで、くらべる実験をしてみましょう。同じ回数だけハンドルを回して電気をためたコンデンサーを2つ用意し、一方を豆電球に、もう一方を発光ダイオードにつなぎます。すると、豆電球は短い時間で消えてしまいますが、発光ダイオードはずっと長い時間光り続けます。発光ダイオードは、豆電球より少ない電気で明かりをつけられるのです。信号機や家の照明に発光ダイオードが多く使われるようになったのは、このためです。\n\n電気は、いろいろなものに変かんして使うことができます。豆電球や発光ダイオードでは光に、ブザーやスピーカーでは音に、モーターでは回る運動に、電熱線では熱に変わります。身の回りの電気製品も、照明は光、テレビは光と音、せん風機は運動、電気ストーブやアイロンは熱というように、電気を目的に合ったものに変えて役立てています。\n\n電気をむだなく使うための工夫もあります。人が近づいたときだけ明かりがつき、いなくなると消える照明は、センサーで人の動きを感じ取り、コンピューターに入れたプログラムによって明かりをつけたり消したりしています。必要なときに必要なだけ電気を使うことで、むだを少なくしているのです。電気をつくり、ため、光や音や熱に変えて使う。わたしたちの毎日の生活は、この流れに支えられています。"},{"id":"m3b01","title":"パンが体の力になるまで","kind":"理科","points":["食べ物は口から食道・胃・小腸・大腸と進み、消化されて、養分はおもに小腸から吸収される。","肺では空気中の酸素が血液に取り入れられ、二酸化炭素が出される。これが呼吸である。","心臓のはく動で血液は全身をめぐり、酸素や養分を運び、二酸化炭素などを受け取ってもどる。"],"body":"パンをひと口かじって、よくかんでいると、だんだんあまく感じてきます。これは、口の中でだ液がはたらき、パンにふくまれるでんぷんを別のものに変えているからです。わたしたちの体は、食べ物を細かくしたり、体に吸収されやすいものに変えたりしています。このはたらきを消化といいます。\n\nだ液のはたらきは、実験で確かめられます。うすいでんぷんの液を2本の試験管に入れ、一方にはだ液を、もう一方には水を加えて、体温くらいの湯であたためます。しばらくしてヨウ素液を入れると、水を加えた方は青むらさき色に変わりますが、だ液を加えた方は色が変わりません。だ液によって、でんぷんが別のものに変わったのです。\n\n口から入った食べ物は、食道を通って胃へ、さらに小腸、大腸へと進みます。口からこう門まで続くこの一本の通り道を、消化管といいます。胃や小腸では消化液によって消化がさらに進み、養分は水といっしょに、おもに小腸から吸収されます。小腸の内側には細かいひだがたくさんあり、養分を吸収しやすいつくりになっています。大腸ではさらに水分が吸収され、残ったものはふんとして体の外に出されます。吸収された養分は、血液によってかん臓に運ばれ、一部はそこにたくわえられて、必要なときに全身へ送られます。\n\n養分と同じくらい大切なのが酸素です。鼻や口から吸いこんだ空気は、肺に送られます。肺では、空気中の酸素が血液に取り入れられ、血液中の二酸化炭素が出されます。吸う空気とはいた息を気体検知管で調べると、はいた息では酸素が減り、二酸化炭素が増えています。二酸化炭素が増えていることは、はいた息を石灰水に通すと白くにごることからも分かります。このように、酸素を取り入れて二酸化炭素を出すことを呼吸といいます。\n\n酸素や養分を全身に届けているのが血液、その血液を送り出しているのが心臓です。心臓は、縮んだりゆるんだりをくり返し、ポンプのように血液を送り出します。この動きをはく動といい、手首などで感じられる血管の動きを脈はくといいます。心臓を出た血液は、血管を通って体のすみずみまで酸素や養分を届け、かわりに二酸化炭素や体にいらなくなったものを受け取って、また心臓にもどってきます。いらなくなったものは、じん臓で血液からこし出され、にょうとして体の外に出されます。\n\nかむこと、息をすること、心臓が動くこと。どれも、ふだんはほとんど意識していません。けれども、それぞれの臓器がつながり合ってはたらいているからこそ、食べたパンは体を動かす力に変わります。走ったあとに息が上がり、胸がどきどきするのは、体がたくさんの酸素を必要としているという合図なのです。"},{"id":"m3b02","title":"タカの命は草から始まる","kind":"理科","points":["植物の葉に日光が当たると、でんぷんができる。植物は自分で養分をつくることができる。","根から吸い上げた水は、くきを通って葉へ行き、気こうから水蒸気として出ていく（蒸散）。","「食べる・食べられる」のつながりを食物連さといい、そのもとをたどると植物に行き着く。"],"body":"空高く飛ぶタカは、ヘビやネズミ、小鳥などをつかまえて食べます。ヘビはカエルを、カエルはバッタなどの虫を、バッタはイネなどの植物の葉を食べます。こうして順にたどっていくと、動物の食べ物は、もとをたどれば植物に行き着きます。生き物どうしの、食べる・食べられるという関係のつながりを、食物連さといいます。\n\nでは、植物は何を食べているのでしょうか。じつは植物は、ほかの生き物を食べなくても、自分で養分をつくることができます。それを確かめる実験があります。前の日の夕方から、ジャガイモの葉をアルミニウムはくで包んでおきます。次の日の朝、一方の葉ははくを外して日光に当て、もう一方は包んだままにします。数時間後に両方の葉をつみ取り、緑色をぬいてからヨウ素液につけます。すると、日光に当てた葉だけが青むらさき色に変わります。葉に日光が当たると、でんぷんがつくられるのです。\n\n植物が生きていくには、水も欠かせません。ホウセンカを根ごとほり出し、根を赤い色水にひたしておくと、しばらくして、くきや葉の中に赤く染まった部分が見えてきます。くきを横に切ってみると、赤く染まった水の通り道がはっきり分かります。根から取り入れた水は、決まった通り道を通って、くきから葉のすみずみまで運ばれているのです。\n\n葉まで来た水は、そのあとどうなるのでしょう。葉のついた枝にふくろをかぶせておくと、ふくろの内側が細かい水てきでくもってきます。葉を全部取った枝で同じことをしても、ふくろはほとんどくもりません。葉の表面には気こうという小さなあながたくさんあり、水はそこから水蒸気となって出ていくのです。これを蒸散といいます。\n\n植物と動物は、空気を通してもつながっています。植物は、日光が当たると空気中の二酸化炭素を取り入れ、酸素を出します。いっぽう、動物も植物も、呼吸によって酸素を取り入れ、二酸化炭素を出しています。わたしたちが吸っている酸素も、植物のはたらきによって生み出されているのです。\n\n池や海の中でも同じです。メダカは、ミジンコなどの小さな生き物を食べ、ミジンコは、水の中の小さな植物などを食べています。そして、メダカのような小さな魚は、もっと大きな魚に食べられます。水の中の食物連さも、出発点は植物です。\n\nわたしたちが食べるご飯やパン、肉や魚も、もとをたどれば、植物が日光を受けてつくった養分から始まっています。校庭のすみに生えている一枚の葉も、多くの生き物の命を支える小さな工場なのです。"},{"id":"m3b03","title":"山の上で見つかる貝のなぞ","kind":"理科","points":["地層は、流れる水が運んだれき・砂・どろや、火山灰などが積み重なってできる。","水のはたらきでできた層のつぶは丸みを帯び、火山灰のつぶは角ばったものが多い。","火山のふん火や地しんで土地は変化する。地しんは、大地に力が加わり断層ができたりずれたりして起こる。"],"body":"山の中のがけで、貝の化石が見つかることがあります。海から遠くはなれた高い場所に、どうして海の生き物のあとが残っているのでしょうか。そのなぞを解くかぎは、がけに見られるしまもようにあります。\n\nがけを注意して見ると、色やつぶの大きさがちがう層が、何枚も重なっていることがあります。これを地層といいます。地層は、れき、砂、どろ、火山灰などが積み重なってできたものです。地層は横にも、おくにも広がっています。\n\n川の水は、山や川岸をけずって、れきや砂やどろを運びます。それらは、流れがゆるやかになる河口や海の底にしずんで積もります。水を入れた容器に、れきと砂とどろを混ぜた土を流しこむ実験をすると、つぶの大きいれきが先にしずみ、その上に砂、いちばん上にどろが積もります。これが何度もくり返され、長い年月をかけて、しまもようの地層ができるのです。流れる水に運ばれたれきや砂は、川底を転がるうちに角がとれて、丸みを帯びています。\n\n積もったものは、上に重なったものの重みなどで、長い時間をかけて固い岩に変わっていきます。れきが固まった岩をれき岩、砂が固まった岩を砂岩、どろが固まった岩をでい岩といいます。海の底に積もった層の中に貝などがうもれると、それが化石となって残ります。その海の底が、大地の大きな力で長い年月をかけておし上げられると、山の上で貝の化石が見つかることになるのです。世界一高いヒマラヤ山脈からも、海の生き物の化石が見つかっています。\n\n地層をつくるのは水だけではありません。火山がふん火すると、火山灰が風に運ばれ、遠くまで降り積もります。火山灰のつぶをけんび鏡で観察すると、角ばったものが多く、とう明なガラスのようなつぶもふくまれています。流れる水に運ばれたつぶとのちがいから、その層がどのようにしてできたのかを知ることができます。\n\n火山のふん火や地しんは、土地のようすを大きく変えることもあります。鹿児島県の桜島は、もとは海にうかぶ島でしたが、1914年の大きなふん火で流れ出たよう岩によって、向かいの半島と陸続きになりました。また、1995年の兵庫県南部地しんでは、野島断層とよばれる大地のずれが地表に現れました。このような大地のずれを断層といいます。地しんは、大地に大きな力が加わって、断層ができたり、ずれ動いたりすることで起こります。\n\nわたしたちが立っている大地は、何万年、何百万年という長い時間をかけてつくられてきました。そして、今も少しずつ変化し続けています。住んでいる地域の地層や、火山・地しんの記録を調べておくことは、災害に備えることにもつながります。"},{"id":"m3b04","title":"食器を持ち上げない国","kind":"地理","points":["韓国では食器を置いたまま金属のはしとスプーンで食べ、ゆか暖ぼうのオンドルやキムチづくりの習わしがある。","サウジアラビアでは多くの人がイスラム教を信じ、1日5回いのる。日本は石油の多くを西アジアから輸入する。","ブラジルには日本からの移民の子孫である日系人が多く、鉄鉱石やとり肉、コーヒー豆が日本に輸入される。"],"body":"日本では、ご飯を食べるとき、茶わんを手に持って食べるのがふつうです。ところが、おとなりの韓国（かんこく）では、食器をテーブルに置いたまま食べるのが礼ぎ正しいとされています。韓国の人は、金属でできたはしとスプーンを使い分け、ご飯やスープはおもにスプーンで食べます。同じように米を主食にしている国でも、食べ方の習慣はずいぶんちがうのです。\n\n韓国のくらしには、寒い冬をすごすくふうも見られます。オンドルとよばれるゆか暖ぼうは、もともと、台所でたく火の熱をゆかの下に通して部屋をあたためるしくみでした。今では、ゆかの下に温水を通す方式が多くの家に広がっています。キムチは、野菜を長く保存するために生まれた食べ物で、冬の前に家族や近所の人が集まって、いっせいにつける習わしがあります。また、年上の人を敬う気持ちが強く、ことばづかいにも気を配ります。\n\n西アジアのサウジアラビアは、国土の大部分がさばくの国です。多くの人がイスラム教を信じていて、1日に5回、聖地メッカの方向を向いていのりをささげます。イスラム教のきまりにより、ぶた肉を食べたり、お酒を飲んだりはしません。男の人は白くて長い服を、女の人は黒くて長い服を着ていることが多く、強い日差しや砂から体を守るのにも役立っています。日本は、くらしや産業に欠かせない石油の多くを、サウジアラビアなど西アジアの国々から輸入しています。\n\n南アメリカのブラジルは、日本から見て、地球のほぼ反対側にある国です。国土の大部分が南半球にあるので、季節が日本と逆になります。ブラジルには、1908年に日本からの移民が初めて船でわたって以来、多くの日本人がうつり住みました。その子や孫にあたる日系人は、日本の外では最も多いといわれ、日本の食べ物や祭りも受けつがれています。また、ブラジルから日本へは、鉄鉱石やとり肉、コーヒー豆などが輸入されていて、わたしたちの毎日のくらしを支えています。\n\n衣食住や習慣のちがいには、その土地の気候や歴史、人々が大切にしてきた考え方が表れています。ふしぎに思えるきまりにも、たいていは、そうするだけの理由があります。ちがいを知ることは、相手を理解するための第一歩です。\n\n給食のこん立てや、身の回りの品物がどこから来たのかを調べてみましょう。世界の国々とのつながりが、思ったよりもずっと近くにあることに気づくはずです。"},{"id":"m3b05","title":"193の国が集まる場所","kind":"地理","points":["国際連合は、第二次世界大戦が終わった1945年に、世界の平和と安全を守るためにつくられた。","日本は1956年に加盟した。総会ではどの国も1票を持ち、安全保障理事会は平和を守るために話し合う。","ユニセフは子どもの健康や教育を、ユネスコは教育・科学・文化と世界遺産の取り組みを進めている。"],"body":"アメリカ合衆国のニューヨークに、世界中の国の旗がずらりと並ぶ建物があります。国際連合（国連）の本部です。国連には、世界の193の国が加盟しています。世界のほとんどすべての国が参加する、最も大きな国際組織です。\n\n国連がつくられたのは、第二次世界大戦が終わった1945年のことです。二度の世界大戦では、数えきれないほど多くの人の命がうばわれました。その反省から、二度と戦争を起こさないように、世界の平和と安全を守ることを目的として国連が生まれました。国どうしの争いを、武力ではなく話し合いによって解決することを目指しています。日本は、戦争が終わって11年後の1956年に、80番目の加盟国として国連に加わり、国際社会に復帰しました。\n\n国連では、すべての加盟国が参加する総会が開かれ、世界のさまざまな問題について話し合います。総会では、国の大きさや人口に関係なく、どの国も1票ずつを持っています。また、世界の平和を守るための重要なことを話し合う安全保障理事会があり、国と国の争いを止めるための取り組みを行っています。争いが終わった地域で、平和を取りもどす手助けをする活動もあり、日本の自衛隊も1992年のカンボジアをはじめとして参加してきました。\n\n国連には、分野ごとにさまざまな機関があります。ユニセフ（国連児童基金）は、世界の子どもたちが健康に育ち、教育を受けられるように活動しています。病気を防ぐための予防接種を広めたり、安全な水を使えるようにしたりする取り組みを進めています。じつは日本も、戦争のあとの食べ物が足りなかった時期に、ユニセフから粉ミルクなどの助けを受けていました。\n\nユネスコ（国連教育科学文化機関）は、教育や科学、文化を通して平和を築くことを目指しています。人類にとって大切な自然や建物を守る世界遺産の取り組みも、ユネスコが中心となって進めているものです。日本にも、富士山や屋久島など、多くの世界遺産があります。\n\n国連の活動は、加盟国が出し合うお金や、世界中の人々からの寄付によって支えられています。学校などで集められるユニセフへの寄付も、遠くの国の子どもたちの命や学びを守るために役立てられています。国と国、人と人とが力を合わせることが、世界の平和を形づくっていくのです。"},{"id":"m3b06","title":"母子手帳が海をわたった","kind":"地理","points":["日本は、発展のとちゅうにある国々に資金や技術で協力している（ODA）。青年海外協力隊もその一つ。","協力隊員は現地でくらしながら、人々が自分たちの力で続けられるように技術や知識を伝えている。","地球温暖化など一つの国では解決できない課題に向け、2015年に国連でSDGsが決められた。"],"body":"赤ちゃんが生まれると、日本では母子健康手帳という一冊の手帳が使われます。お母さんの体のようすや、赤ちゃんの成長、予防接種の記録などを書きこむものです。じつはこの手帳のしくみは、日本の協力などによって、インドネシアをはじめとする世界のいくつもの国に広まりました。日本で生まれたくふうが、海の向こうで多くの命を守っているのです。\n\n日本の政府は、発展のとちゅうにある国々に、道路や橋、学校などをつくるための資金を出したり、技術を伝えたりしています。このような政府による協力を、政府開発えん助（ODA）といいます。その取り組みの一つとして知られているのが、青年海外協力隊です。1965年に始まり、これまでに何万人もの日本人が、アジアやアフリカ、中南米などの国々に出かけていきました。隊員は、ふつう2年間、現地の人々といっしょにくらしながら、農業や漁業の指導、理科や算数の授業、看護、スポーツの指導など、さまざまな分野で力をつくしています。\n\n大切なのは、品物やお金をわたすだけで終わらせないことです。たとえば、井戸をほっても、こわれたときに直せる人がいなければ、いずれ使えなくなってしまいます。そこで隊員たちは、現地の人が自分たちの力で続けていけるように、技術や知識をいっしょに身につけることを大事にしています。国だけでなく、NGO（非政府組織）とよばれる民間の団体も、病気の人の手当てや教育、災害のときの助けなど、世界各地で活動しています。\n\nいっぽう、世界には、一つの国だけでは解決できない課題もあります。その代表が地球温暖化です。石油や石炭を燃やすと出る二酸化炭素などが増え、地球の気温が少しずつ上がっています。海面が上がって低い土地が水につかるおそれや、大雨や干ばつが増えることが心配されています。日本の京都では、1997年に、温暖化を防ぐための国際会議が開かれました。\n\nこのほかにも、熱帯林が減っていること、海にただようプラスチックのごみ、食料や水の不足、争いからのがれて住む場所を失った難民の問題など、地球の課題は数多くあります。\n\n2015年、国連で、2030年までに世界が達成を目指す17の目標が決められました。SDGs（持続可能な開発目標）です。だれ一人取り残さないことをかかげ、貧しさをなくすことや、すべての子どもが教育を受けられること、気候の変化への対策などがふくまれています。日本には、すぐれた技術や、たび重なる災害を乗りこえてきた経験を生かして、世界の役に立つことが期待されています。\n\n電気を大切に使うことや、ごみを分けて出すことも、地球の課題とつながっています。世界の役に立つ方法は、遠くの国だけにあるのではありません。"},{"id":"m3b07","title":"新幹線が走り出した年","kind":"産業","points":["1950年代半ばから1970年代初めの高度経済成長で産業が発展し、1964年に東海道新幹線が開業した。","白黒テレビ・電気洗たく機・電気冷蔵庫が三種の神器とよばれ、家庭のくらしが大きく変わった。","四大公害病などの公害が起き、住民の運動や裁判、国の法律づくりなどで対策が進められた。"],"body":"1964年10月1日、東京駅と新大阪駅の間を、白と青の新しい列車が走り出しました。東海道新幹線です。それまで特急でも6時間半ほどかかっていた道のりを、およそ4時間で結びました。その9日後には、アジアで初めてのオリンピックが東京で開かれました。\n\nこのころの日本は、高度経済成長とよばれる時代のまっただ中にありました。1950年代の半ばから1970年代の初めにかけて、日本の産業は急速に発展し、人々の生活は大きく豊かになりました。1968年には、国全体の生産の大きさを表す国民総生産が、資本主義の国々の中でアメリカ合衆国に次ぐ第2位になりました。戦争で焼け野原になった国が、20年あまりでここまで成長したのです。\n\n人々のくらしを大きく変えたのが、家庭電化製品です。1950年代の後半には、白黒テレビ、電気洗たく機、電気冷蔵庫が「三種の神器」とよばれ、多くの家庭のあこがれになりました。洗たく板でごしごし手で洗っていた洗たくや、氷で冷やしていた食べ物の保存が、ずっと楽になりました。1960年代の後半には、カラーテレビ、クーラー、自動車が「3C」とよばれ、人気を集めました。\n\n産業のすがたも変わりました。エネルギーの中心が石炭から石油へと移り、海沿いには大きな製鉄所や石油化学工場が次々に建てられました。鉄鋼や船、自動車などの重化学工業が大きくのび、日本の製品は世界中へ輸出されるようになりました。仕事を求めて、多くの人が農村から都市へ移り住みました。\n\nしかし、急速な成長には、かげの部分もありました。工場から出るけむりやよごれた水が、人々の健康をむしばんだのです。熊本県や新潟県では、工場から流された水にふくまれていた水銀が、魚や貝を通して人の体に入り、水俣病（みなまたびょう）が起こりました。富山県では、川の上流にある鉱山から流れ出たカドミウムが原因でイタイイタイ病が、三重県では、工場のけむりによって四日市ぜんそくが発生しました。これらは四大公害病とよばれ、多くの人が長く苦しむことになりました。\n\n公害に苦しむ人々は、裁判を起こして会社の責任をうったえ、住民の運動も広がりました。国は1967年に公害対策基本法をつくり、1971年には、公害を防ぎ自然を守る仕事を受けもつ国の役所を設けました。工場ではけむりや水をきれいにする設備が整えられ、空や川は少しずつきれいさを取りもどしていきました。\n\n新幹線も電化製品も、今ではあたりまえのものになりました。そして、公害の苦しい経験から生まれた、自然と人々の健康を守るしくみも、今の社会を支える大切な土台になっています。便利さと安全をどう両立させるかは、今もわたしたちに問われ続けている課題です。"},{"id":"m3b08","title":"朝ごはんで世界一周","kind":"産業","points":["外国から品物を買うことを輸入、売ることを輸出といい、まとめて貿易という。","日本は資源が少なく、原料を輸入して製品をつくり輸出する加工貿易で発展してきた。","近年は外国の工場でつくった機械類などの輸入が増え、食料を輸入にたよることなどの課題もある。"],"body":"朝ごはんのパンは小麦から、みそしるのみそやとうふは大豆からつくられています。そして、その小麦や大豆の多くは、アメリカ合衆国やカナダなどから、大きな船で運ばれてきたものです。朝の食事を見わたすだけでも、日本が世界と深くつながっていることが分かります。\n\n外国から品物を買い入れることを輸入、外国へ品物を売ることを輸出といいます。輸出と輸入をまとめて、貿易といいます。\n\n日本は、石油や鉄鉱石などの資源がほとんどとれません。そこで、原料を外国から輸入し、すぐれた技術で製品に加工して、それを輸出する加工貿易によって産業を発展させてきました。オーストラリアなどから鉄鉱石や石炭を、サウジアラビアなどの西アジアの国々から石油を輸入し、鉄鋼や自動車、電気製品などをつくって世界に送り出してきたのです。\n\nところが、近年は貿易のすがたが変わってきました。日本の会社が、中国や東南アジアなどの国々に工場をつくり、そこでつくった製品を日本に輸入することが増えたのです。そのため、衣類や、電気製品などの機械類の輸入が大きく増えました。今の日本のおもな輸出品は、自動車や機械類です。中国やアメリカ合衆国は、日本にとって特に大きな貿易相手国になっています。\n\n貿易の品物は、何で運ばれるのでしょうか。石油や鉄鉱石のように重くてかさばるものは、大きな船で港へ運ばれます。いっぽう、電子部品や薬のように、小さくて軽く、値段の高いものは、飛行機で空港へ運ばれることが多くなっています。千葉県にある成田国際空港は、輸出入の金額で見ると、日本でも最大級の貿易港です。\n\n貿易には、なやみもあります。日本は、食料の多くを輸入にたよっています。外国が不作になったり、争いが起きたりして輸入がとどこおると、食べ物が手に入りにくくなるおそれがあります。また、安い輸入品が増えると、同じものをつくる国内の農家や工場が苦しくなることもあります。かつては、日本の自動車の輸出が増えすぎて、アメリカ合衆国との間で貿易まさつとよばれる問題が起きたこともありました。\n\n貿易は、それぞれの国が得意なものをつくり、足りないものを補い合うしくみです。たがいの国を信用し、平和な関係を保つことが、安定した貿易の土台になります。次に買い物に行ったら、品物の表示で「原産国」を見てみましょう。小さな文字の中に、世界とのつながりがかくれています。"},{"id":"m3c01","title":"貝塚は大昔のごみ置き場？","kind":"日本史","points":["縄文時代の人々は、けものや魚・貝をとり、木の実を集めてくらし、縄文土器を使い、たて穴住居に住んだ。","大陸から米づくりが伝わって弥生時代となり、水田や石包丁、高床倉庫、弥生土器が使われた。","米づくりでむらがまとまり、争いの中からくにが生まれ、3世紀ごろには卑弥呼が30ほどのくにを従えた。"],"body":"海から少しはなれた台地の土をほると、貝がらがまとまって出てくることがあります。貝塚とよばれるこの場所は、大昔の人々が食べた貝のからや動物の骨、こわれた土器などを捨てたあとです。いわば大昔のごみ置き場ですが、ここを調べると、当時の人々が何を食べ、どのようにくらしていたのかが見えてきます。\n\n今から1万年以上も前、人々は縄目のもようをつけた土器を使っていました。これを縄文土器といい、この土器が使われた時代を縄文時代とよびます。人々はけものや魚、貝をとり、木の実を集めて食料にしていました。土器があれば、木の実や貝をにたり、たくわえたりできます。住まいは、地面をほって柱を立て、草などで屋根をかけたたて穴住居でした。\n\n青森県の三内丸山遺跡では、大きな柱のあとや、たくさんのたて穴住居のあとが見つかっています。くりの木を育てていたことも分かり、人々が長い間、同じ場所に住み続けていたことがうかがえます。また、このころは人々の間に、身分や貧富の差はあまりなかったと考えられています。\n\n縄文時代の終わりごろ、大陸から米づくりが伝わりました。米づくりは九州北部から始まり、やがて東北地方にまで広がっていきます。米づくりが広まったこの時代を、弥生時代といいます。人々は水田をつくり、石包丁でいねのほをつみ取って、とれた米を高床倉庫にたくわえました。ゆかを高くしたのは、しめり気やねずみから米を守るためです。このころ使われた、うすくてかたい土器は、東京の弥生という町で初めて見つかったことから、弥生土器とよばれています。\n\n米づくりは、人々のくらしを大きく変えました。田に水を引いたり、田植えや取り入れをしたりするには、多くの人の協力が必要です。人々はむらをつくってまとまり、作業を指図する指導者が現れました。たくわえた米は富となり、むらどうしで土地や水、米をめぐる争いも起こるようになりました。佐賀県の吉野ヶ里遺跡では、むらのまわりを深いほりやさくで囲み、物見やぐらを建てて守っていたあとが見つかっています。\n\n力の強いむらは、周りのむらを従えて、小さなくにをつくりました。中国の古い歴史の書物によると、3世紀ごろの日本には邪馬台国というくにがあり、女王の卑弥呼が30ほどのくにを従えていました。卑弥呼はうらないなどによって政治を行い、中国の魏という国に使いを送って、王として認められ、銅の鏡などをおくられたと記されています。\n\n自然のめぐみを分け合ってくらした縄文時代から、米づくりを中心にむらがまとまり、やがてくにが生まれた弥生時代へ。わたしたちが毎日食べているご飯の歴史は、日本の社会のしくみが大きく変わる始まりでもあったのです。"},{"id":"m3c02","title":"かぎ穴の形をした大きな墓","kind":"日本史","points":["3世紀後半から各地に王や豪族の古墳がつくられ、大仙古墳のような前方後円墳には、はにわが並べられた。","大和地方の豪族たちは大王を中心にまとまって大和朝廷をつくり、大王はのちに天皇とよばれた。","ワカタケル大王の名がある鉄剣と鉄刀から、5世紀ごろ大和朝廷の力が関東から九州までおよんだと分かる。"],"body":"大阪府堺市の住宅地の中に、こんもりとした緑の森があります。空から見ると、四角と円をつなげた、かぎ穴のような形をしています。これは、仁徳天皇の墓と伝えられてきた大仙古墳で、5世紀ごろにつくられました。全長はおよそ500メートルもあり、日本でいちばん大きな古墳です。\n\n3世紀の後半から、各地で古墳がつくられるようになりました。古墳とは、土をもり上げてつくった、王や豪族の大きな墓です。大仙古墳のように、四角と円を組み合わせた形のものを前方後円墳といいます。古墳の上やまわりには、人や馬、家などの形をしたはにわが並べられ、墓の中には、鏡や玉、鉄の武器などがおさめられました。\n\nこれほど大きな墓をつくるには、どれほどの人手が必要だったのでしょうか。ある計算では、1日に2千人が働いたとしても、完成までに15年以上かかるといわれます。土を運んでもり上げ、表面に石をしきつめ、まわりにほりをほる。それだけの人々を長い年月働かせることができたということは、古墳の主が大きな力をもっていたことを表しています。\n\n前方後円墳は、今の奈良県や大阪府に特に大きなものが多く、やがて九州から東北地方まで広がりました。同じ形の墓が各地につくられたのは、地方の豪族たちが、奈良県を中心とする大和地方の王とつながりをもったためと考えられています。大和地方の豪族たちは、大王とよばれる王を中心にまとまり、大和朝廷（大和政権）をつくりました。大王は、のちに天皇とよばれるようになります。\n\n大和朝廷の力がどこまで広がっていたのかを示す手がかりもあります。埼玉県の稲荷山古墳から見つかった鉄剣と、熊本県の江田船山古墳から見つかった鉄刀には、どちらも「ワカタケル大王」の名がきざまれていました。関東と九州という遠くはなれた場所で同じ大王の名が見つかったことから、5世紀ごろには、大和朝廷の力が広い地域におよんでいたことが分かります。\n\nこのころ、中国や朝鮮半島から日本に移り住む人々もいました。渡来人とよばれるこの人々は、土木の技術や、かたい土器をつくる技術、はたおりなどを伝えました。漢字や仏教も、大陸から伝わってきたものです。大和朝廷は、渡来人の知識や技術を取り入れて、国づくりを進めていきました。\n\n古墳は、文字の記録が少ない時代のことを教えてくれる大切な手がかりです。2019年には、大仙古墳をふくむ百舌鳥・古市古墳群が世界文化遺産に登録されました。住宅地の中に残る緑の森は、日本という国がまとまり始めたころの王たちの力を、今に伝えているのです。"},{"id":"m3c03","title":"大仏はなぜつくられた？","kind":"日本史","points":["聖徳太子は冠位十二階や十七条の憲法を定め、小野妹子らを遣隋使として送り、法隆寺を建てた。","645年、中大兄皇子と中臣鎌足が蘇我氏をたおし、天皇中心の国づくり（大化の改新）を始めた。","聖武天皇は仏教の力で国を守ろうと、国分寺と東大寺の大仏をつくらせ、行基が協力した。"],"body":"奈良の東大寺には、高さがおよそ15メートルもある大きな仏像があります。奈良の大仏です。今から1200年以上前、大仏づくりには、のべ260万人もの人々が関わったといわれます。なぜ、これほど大がかりな仏像がつくられたのでしょうか。答えを探しに、時代をさかのぼってみましょう。\n\n6世紀の終わりごろ、日本では豪族たちが力を争っていました。そのころ、おばの推古天皇を助けて政治を行ったのが聖徳太子です。太子は、家がらにとらわれず、能力や手がらのある人を役人に取り立てるため、冠位十二階を定めました。また、十七条の憲法をつくって、仏教を大切にすることや天皇の命令に従うことなど、役人の心構えを示しました。\n\n太子は、中国の進んだ制度や文化を学ぶため、小野妹子らを遣隋使として中国（隋）に送りました。また、仏教を広めようと法隆寺を建てました。法隆寺は、今に残る木造の建物としては世界で最も古く、世界文化遺産に登録されています。\n\n太子がなくなると、豪族の蘇我氏が天皇をしのぐほどの力をもつようになりました。645年、中大兄皇子と中臣鎌足は蘇我氏をたおし、天皇を中心とする国づくりを始めます。これを大化の改新といいます。それまで豪族が支配していた土地と人々を国のものとし、人々に税を納めさせるしくみが整えられていきました。710年には、中国の都にならった平城京が奈良につくられ、各地の特産物が税として都へ運ばれました。\n\n8世紀の前半に天皇となったのが聖武天皇です。このころ、都では病気が流行し、各地で災害や反乱も起こって、世の中は不安に包まれていました。聖武天皇は、仏教の力で国を守り、人々の心を安らかにしようと考えました。そこで、国ごとに国分寺を建てることを命じ、都には東大寺を建てて、大仏をつくることにしたのです。\n\n大仏づくりには、全国から銅などの材料が集められました。人々に協力をよびかけたのが、行基という僧です。行基は、各地で橋や池、道をつくって人々にしたわれていました。朝廷は、はじめは行基の活動を取りしまっていましたが、やがてその力を借りるようになります。こうして752年、大仏の完成を祝う式が行われました。\n\nこのころ、日本は遣唐使を送って、中国（唐）の文化をさかんに取り入れていました。唐の位の高い僧であった鑑真は、何度も航海に失敗し、目が見えなくなりながらも来日して、仏教の正しい教えを伝えました。東大寺の正倉院には聖武天皇が使った品々が納められ、中には遠く西アジアから伝わったガラスの器もあります。\n\n聖徳太子から大化の改新、そして大仏づくりへ。豪族がそれぞれに力をもっていた国は、天皇を中心にまとまる国へと形を変えていきました。大仏は、そうした国づくりの中で、国の安らかさを願ってつくられたのです。"},{"id":"m3c04","title":"ひらがなは漢字から生まれた","kind":"日本史","points":["794年に都が平安京に移り、藤原道長など藤原氏の貴族が大きな力をもち、寝殿造のやしきでくらした。","遣唐使が取りやめになったあと、中国の文化をもとに、日本の風土に合った日本風の文化（国風文化）が育った。","漢字からかな文字が生まれ、紫式部が「源氏物語」を、清少納言が「枕草子」を書いた。"],"body":"「あ」という字は、どこから来たのでしょう。実は、漢字の「安」をくずして書いた形から生まれました。「い」は「以」、「か」は「加」から生まれています。カタカナも漢字から生まれ、「カ」は「加」の左側、「タ」は「多」の上の部分をとってつくられました。こうしたかな文字が広く使われるようになったのが、平安時代です。\n\n794年、都は今の京都に移され、平安京と名づけられました。それからおよそ400年間を平安時代といいます。このころ政治の中心にいたのは、貴族とよばれる人々でした。中でも藤原氏は、むすめを天皇のきさきにし、天皇との結びつきを強めて、大きな力をにぎりました。藤原氏が最も栄えたのは、11世紀の初めごろの藤原道長のときです。道長は、世の中が自分の思いどおりになることを、欠けたところのない満月にたとえた歌をよんだほどでした。\n\n貴族たちは、寝殿造とよばれる広いやしきに住んでいました。庭には大きな池がつくられ、建物どうしは長いろうかで結ばれていました。女性は十二単とよばれる、何枚も重ねた着物を身につけました。貴族たちは和歌をよみ合ったり、けまりをしたりして楽しみました。七夕や月見など、今も行われている行事の中には、このころの貴族の間でさかんに行われていたものがあります。\n\n奈良時代から、日本は遣唐使を送って中国の文化を熱心に学んできました。しかし、9世紀の終わりに遣唐使は取りやめになります。その後は、それまでに取り入れた中国の文化をもとにしながら、日本の風土や生活に合った文化が育っていきました。これを日本風の文化（国風文化）といいます。かな文字は、その代表です。\n\n漢字だけで日本語を書き表すのは大変でしたが、かな文字を使えば、話し言葉に近い形で、気持ちをこまやかに書き表すことができます。かな文字は特に女性の間で広まり、すぐれた文学が生まれました。天皇のきさきに仕えた紫式部は、貴族の生活をえがいた長い物語「源氏物語」を書きました。同じように宮中に仕えた清少納言は、宮中の出来事や季節の様子を、するどい感覚で書きつづった随筆「枕草子」を残しました。\n\n絵にも日本風の変化が表れました。日本の風景や人々のくらしを、やわらかな線とあざやかな色でえがいた大和絵です。物語の場面を絵と文で表した絵巻物もつくられ、「源氏物語」も絵巻物になりました。\n\n今、わたしたちは漢字とひらがな、カタカナをまぜて文章を書いています。この書き方の土台は、平安時代の人々が漢字からかな文字を生み出したことにあります。ふだん何気なく書いている「あ」の一文字にも、1000年以上の歴史がつまっているのです。"},{"id":"m3c05","title":"いざ鎌倉！武士の約束","kind":"日本史","points":["武士で初めて太政大臣となった平清盛の一族（平氏）は、源頼朝・義経らに敗れ、壇ノ浦でほろんだ。","源頼朝は鎌倉に幕府を開き、将軍と御家人は「御恩と奉公」の関係で結ばれていた。","北条時宗のとき元が2度せめてきたが退けた。しかし新しい領地がなく御家人の不満が高まり、幕府は弱まった。"],"body":"「いざ鎌倉」という言葉があります。大事なことが起きた、さあ行こう、という意味で、今でも使われることがあります。この言葉は、鎌倉時代の武士たちが、何か起こればすぐに鎌倉へかけつけたことから生まれたといわれます。武士たちは、なぜそこまでして鎌倉へ向かったのでしょうか。\n\n武士は、平安時代の中ごろから、自分の土地を守るために武芸をみがいた地方の豪族や有力な農民から生まれました。やがて武士は、一族や家来をまとめて大きな集団となり、中でも源氏と平氏が大きな力をもつようになりました。\n\n先に政治の実権をにぎったのは、平清盛が率いる平氏です。清盛は武士として初めて太政大臣となり、むすめを天皇のきさきにして、朝廷で大きな力をふるいました。また、兵庫の港を整えて、中国（宋）との貿易をさかんにしました。しかし、平氏が重要な役職を一族で固めるようになると、貴族やほかの武士たちの不満が高まっていきました。\n\n1180年、伊豆に流されていた源頼朝が、平氏をたおそうと兵をあげました。頼朝の弟の源義経らの活やくで、源氏は各地で平氏を破り、1185年、壇ノ浦（今の山口県）の戦いで平氏はほろびました。頼朝は、三方を山に囲まれ、一方が海に面した守りやすい鎌倉に幕府を開き、全国に守護や地頭を置きました。1192年には征夷大将軍に任じられています。\n\n幕府と武士を結びつけていたのが、御恩と奉公の関係です。将軍は、家来となった武士（御家人）の領地を認めたり、手がらに応じて新しい領地をあたえたりしました。これが御恩です。そのかわりに御家人は、鎌倉や京都の警備をつとめ、戦いが起これば一族を率いて命がけで戦いました。これが奉公です。「いざ鎌倉」は、この奉公の心構えを表した言葉なのです。\n\n頼朝の死後、幕府の政治は、頼朝の妻の北条政子の一族である北条氏が中心となって進めました。13世紀後半、モンゴル人が中国に建てた元が、日本を従えようと使いを送ってきました。執権の北条時宗がこれを断ると、元の大軍が1274年と1281年の2度にわたり、九州北部にせめてきました。御家人たちは、元の集団での戦い方や火薬を使った武器に苦しみながらも勇ましく戦い、2度目には海岸に築いた石のかべや暴風雨にも助けられて、元軍を退けました。\n\nしかし、この戦いは、せめてきた敵を防いだもので、新しい領地は手に入りませんでした。命がけで戦ったのに十分な御恩を受けられなかった御家人たちは、幕府に不満をもつようになります。御恩と奉公の結びつきがゆらいで幕府の力は弱まり、1333年、鎌倉幕府はほろびました。それでも、武士が政治を行う世の中は、鎌倉幕府の始まりから数えると、江戸時代の終わりまでおよそ700年も続いたのです。"},{"id":"m3c06","title":"たたみの部屋は室町生まれ","kind":"日本史","points":["足利義満は京都の室町で政治を行い、北山に金閣を建てた。足利義政は東山に銀閣を建てた。","たたみ・ふすま・しょうじ・床の間などをもつ書院造が生まれ、今の和室のもとになった。","雪舟の水墨画、能や狂言、茶の湯、生け花など、室町時代の文化は今に受けつがれている。"],"body":"たたみがしきつめられ、ふすまやしょうじで仕切られた部屋。かべぎわの床の間には、花やかけじくがかざられています。こうした和室のつくりのもとになったのが、室町時代に生まれた書院造という建物のつくりです。\n\n鎌倉幕府がほろんだあと、足利尊氏が京都に新しい幕府を開きました。3代将軍の足利義満が京都の室町に立派なやしきを建てて政治を行ったことから、この幕府を室町幕府、この時代を室町時代とよびます。義満は中国（明）との貿易で大きな利益を上げ、幕府の力が最も強かったころの将軍です。\n\n義満が京都の北山に建てたのが金閣です。3階建ての建物の2階と3階には金ぱくがはられ、池にうつる姿はたいへんはなやかです。金閣には、貴族の文化と武士の文化がとけ合った、この時代の文化の特色がよく表れています。\n\nそれからおよそ90年後、8代将軍の足利義政は、京都の東山に銀閣を建てました。名前に「銀」とありますが、調査では、銀ぱくがはられていたあとは見つかっていません。落ち着いた、ひかえめな美しさをもつ建物です。銀閣と同じ寺の中にある東求堂には、義政が使った部屋が残っていて、ここに書院造の特色を見ることができます。\n\n書院造では、部屋全体にたたみをしき、ふすまやしょうじで部屋を仕切ります。床の間やちがいだなを設け、そこに花や絵をかざります。このころ、絵の世界では雪舟が活やくしました。雪舟は中国（明）にわたって絵を学び、帰国後は日本各地を旅して、すみのこさやにじみを生かした水墨画で、自然の姿をえがきました。\n\n室町時代には、今に伝わる文化がほかにもたくさん生まれました。観阿弥・世阿弥の親子は、義満の保護を受けて能を大成させました。能の合間には、人々の日常をおもしろおかしく演じる狂言も演じられました。書院造の部屋で茶を楽しむ茶の湯や、床の間にかざる生け花もさかんになりました。水を使わずに石や砂で山や川の流れを表す庭がつくられたのも、この時代です。\n\n1467年に始まった応仁の乱で京都の町は焼け、多くの貴族や文化人が地方へ移りました。そのため、室町の文化は地方にも広がっていきました。今、わたしたちが和室でくつろいだり、お茶や生け花、能や狂言にふれたりできるのは、室町時代の人々が育てた文化が、受けつがれてきたからなのです。"},{"id":"m3c07","title":"天下統一へのバトンリレー","kind":"日本史","points":["鉄砲とキリスト教が伝わり、織田信長は鉄砲を生かして勢力を広げ、安土城下で楽市・楽座を行った。","豊臣秀吉は全国を統一し、検地と刀狩によって、武士と百姓・町人の身分の区別をはっきりさせた。","徳川家康は関ヶ原の戦いに勝ち、1603年に征夷大将軍となって江戸幕府を開いた。"],"body":"1543年、九州の南にある種子島に、ポルトガル人を乗せた船が流れ着きました。このとき伝えられたのが鉄砲です。鉄砲はまもなく日本でもつくられるようになり、戦い方を大きく変えていきます。その6年後の1549年には、スペイン人の宣教師ザビエルが鹿児島に来て、キリスト教を伝えました。\n\nそのころの日本は、戦国時代とよばれる争いの時代でした。応仁の乱のあと、室町幕府の力は弱まり、各地で戦国大名が領地を広げようと争っていました。この争いを終わらせ、全国を一つにまとめる天下統一を進めたのが、織田信長、豊臣秀吉、徳川家康の3人です。\n\n尾張（今の愛知県）の大名だった織田信長は、1560年の桶狭間の戦いで、大軍を率いる今川義元を破って名を上げました。1573年には室町幕府をほろぼし、1575年の長篠の戦いでは、大量の鉄砲を使って、強い武田氏の軍を破りました。琵琶湖のほとりに安土城を築き、城下町ではだれでも自由に商売ができるようにしました（楽市・楽座）。キリスト教も保護しています。しかし1582年、家来の明智光秀にせめられ、京都の本能寺でなくなりました。\n\n信長の家来だった豊臣秀吉は、光秀をたおして信長のあとをつぎ、大阪城を築いて、1590年に全国を統一しました。秀吉は、全国の田畑の広さや土地のよしあしを調べ、とれる米の量や耕す人の名前を記録させました（検地）。これにより、年貢を確実に取り立てられるようになりました。さらに刀狩を行って、百姓から刀や鉄砲を取り上げました。こうして、武士と百姓・町人の身分の区別がはっきりしていきました。また、秀吉は中国（明）を従えようと、2度にわたり朝鮮に大軍を送りましたが、秀吉の死によって軍は引き上げました。\n\n徳川家康は、三河（今の愛知県）の大名で、信長と手を結び、のちに秀吉に従いました。秀吉の死後、家康は1600年の関ヶ原の戦い（今の岐阜県）で石田三成らの大名を破り、1603年、征夷大将軍となって江戸に幕府を開きます。その後、豊臣氏をほろぼして、徳川氏による政治の土台を固めました。\n\n戦国の世を終わらせ、全国を一つにまとめた3人の歩みは、まるでバトンをつなぐリレーのようです。信長が古い力をたおして道を開き、秀吉が全国を統一してしくみを整え、家康がその上に、260年あまり続く江戸幕府を築きました。今も各地に残る城や城下町は、この時代の歩みを伝えています。"},{"id":"m3c08","title":"大名行列は何のため？","kind":"日本史","points":["江戸幕府は武家諸法度で大名を取りしまり、徳川家光は大名に参勤交代を義務づけた。","幕府はキリスト教を禁止し、貿易の相手をオランダと中国に限って、長崎で行わせた（鎖国）。","町人の文化として歌舞伎や浮世絵が栄え、杉田玄白らの「解体新書」をきっかけに蘭学が広まった。"],"body":"やりを持った武士、荷物をかつぐ人々、そして大名を乗せたかご。長い列が、ゆっくりと街道を進んでいきます。江戸時代の大名行列です。大きな藩では、行列の人数が2千人をこえることもありました。大名たちは、なぜこのような大がかりな旅をくり返したのでしょうか。\n\n江戸幕府は、関ヶ原の戦いのころから徳川氏に従った大名を、江戸から遠い土地に配置しました。また、武家諸法度というきまりを定め、大名が勝手に城を修理したり、幕府のゆるしなく大名の家どうしが親せきになったりすることを禁じました。\n\n3代将軍の徳川家光は、武家諸法度に参勤交代の制度を加えました。大名は1年おきに江戸と自分の領地を行き来し、大名の妻や子は江戸に住まわせられました。行列の費用や江戸でのくらしには多くのお金がかかり、大名の力は弱まりました。これが、大がかりな旅がくり返された理由です。一方で、参勤交代によって街道や宿場町が整い、江戸と地方の間で人や物、文化の行き来がさかんになりました。\n\n幕府は、キリスト教が広まることもおそれました。信者が神の教えを、幕府の命令より大切にすると考えたからです。1637年、重い年貢とキリスト教の取りしまりに苦しんだ人々が、九州の島原・天草で大きな一揆を起こしました。幕府はこれをおさえると、ポルトガル船の来航を禁止し、長崎での貿易の相手を、キリスト教を広めるおそれのないオランダと中国に限りました。このような政策を、のちに鎖国とよびます。ただし、朝鮮や琉球王国、アイヌの人々との交流は続きました。\n\n世の中が落ち着くと、大阪や江戸などの都市では、商業で力をつけた町人たちが新しい文化を生み出しました。近松門左衛門は、町人の義理や人情をえがいた人形浄瑠璃や歌舞伎の台本を書き、人々の心をつかみました。また、木の板で何枚も刷ることのできる浮世絵が安く売られ、歌川広重の「東海道五十三次」のような風景画が人気を集めました。浮世絵は、のちにヨーロッパの画家たちにも大きなえいきょうをあたえました。\n\n学問の世界でも新しい動きがありました。杉田玄白や前野良沢らは、実際の人体と見比べて、オランダ語の医学書の図が正確なことにおどろき、苦労して日本語に訳して、「解体新書」として出版しました。これをきっかけに、オランダ語を通してヨーロッパの学問を学ぶ蘭学が広まりました。また、伊能忠敬は50才ごろから天文学や測量を学び、全国を歩いて測量しました。その測量をもとに、正確な日本地図が完成しました。\n\n参勤交代や鎖国などの政策によって幕府の政治は安定し、江戸時代は260年あまり続きました。その長く平和な世の中で育った歌舞伎や浮世絵は、今も日本を代表する文化として、世界の人々に親しまれています。"},{"id":"m3c09","title":"ちょんまげから洋服へ","kind":"日本史","points":["ペリー来航をきっかけに開国した。1858年の日米修好通商条約は、領事裁判権を認め関税自主権のない不平等条約だった。","明治政府は廃藩置県などの改革（明治維新）を進め、西洋風のくらしが広まる文明開化が起こった。","1889年に大日本帝国憲法が発布され、陸奥宗光と小村寿太郎によって条約改正が実現した。"],"body":"1853年、今の神奈川県の浦賀の沖に、黒い大きな船が4せき現れました。アメリカの使節ペリーが率いる軍の船で、人々はこれを黒船とよびました。ペリーは日本に開国を求め、翌年、幕府は日米和親条約を結んで、長く続いた鎖国は終わりをむかえました。\n\n1858年には日米修好通商条約が結ばれ、外国との貿易が始まりました。しかし、この条約は日本にとって不利な、不平等な条約でした。日本で罪をおかした外国人を日本の法律でさばくことができず（領事裁判権）、輸入品にかける税を日本が自由に決めることもできなかった（関税自主権がない）のです。\n\n開国によって世の中が混乱すると、幕府への不満が高まりました。薩摩藩の西郷隆盛や大久保利通、長州藩の木戸孝允らは、幕府をたおして天皇を中心とする新しい政府をつくろうと動きました。1867年、15代将軍の徳川慶喜は政権を朝廷に返し、江戸幕府は終わりました。翌年には、幕府側の勝海舟と新政府軍の西郷隆盛が話し合い、江戸城は戦いをせずに明けわたされました。\n\n新しい政府は、1868年に五箇条の御誓文で政治の方針を示し、年号を明治と改めました。1871年には藩をなくして県を置き（廃藩置県）、政府が任命した役人に治めさせました。また、江戸時代の身分制度を改めて、国民はみな平等としました。さらに、学校の制度を定め、20才になった男子に兵役を義務づけ、税を土地の価格に応じてお金で納めさせるなど、改革を次々に進めました。この一連の改革を明治維新といいます。\n\n町の様子も大きく変わりました。ちょんまげを切ったかみがたや洋服が広まり、れんがづくりの建物が建ち、夜の通りをガス灯が照らしました。1872年には新橋と横浜の間に鉄道が開通しました。こうして西洋風のくらしが広まった動きを文明開化といいます。福沢諭吉は「学問のすすめ」を書き、人は生まれながらに平等で、学ぶことで差が生まれると説きました。\n\nやがて、国民が政治に参加することを求める自由民権運動が広がりました。政府は国会を開くことを約束し、伊藤博文がヨーロッパで各国の憲法を調べて、君主の力が強いドイツの憲法を手本に憲法づくりを進めました。1889年、天皇が国を治めると定めた大日本帝国憲法が発布され、翌年には第1回の帝国議会が開かれました。\n\n不平等条約を改めることは、明治の日本の大きな目標でした。1894年、外務大臣の陸奥宗光がイギリスとの話し合いで、領事裁判権をなくすことに成功します。日本は日清戦争と日露戦争に勝って国際的な地位を高め、1910年には韓国を併合して植民地にしました。そして1911年、小村寿太郎が関税自主権の回復を実現し、日本は開国から半世紀あまりで、ようやくヨーロッパやアメリカの国々と対等な立場に立ったのです。"},{"id":"m3c10","title":"焼け野原からの再出発","kind":"日本史","points":["日中戦争から太平洋戦争へと戦争が広がり、空襲や沖縄での地上戦、原子爆弾で多くの命がうばわれた。","戦後、民主化が進み、国民主権・基本的人権の尊重・平和主義を原則とする日本国憲法が定められた。","日本は独立を回復して国際連合に加盟し、1964年には東京オリンピック・パラリンピックを開いた。"],"body":"1964年10月10日、東京で、アジアで初めてのオリンピックの開会式が行われました。この大会は、日本が戦争から立ち直ったことを世界に示すものでした。けれども、そのわずか19年前、東京の町の多くは空襲によって焼け野原になっていたのです。\n\n1931年、日本軍は中国東北部（満州）で戦いを起こし、翌年、満州国をつくりました（満州事変）。1937年には中国との全面的な戦争（日中戦争）が始まりました。1939年にヨーロッパで第二次世界大戦が始まると、日本はドイツ・イタリアと同盟を結び、1941年にはアメリカやイギリスなどとも戦争を始め（太平洋戦争）、戦場は東南アジアや太平洋の島々に広がりました。\n\n戦争が長引くと、国民の生活も苦しくなりました。米や衣類は配給制となり、多くの人が兵士として戦場に送られ、学生も工場で働きました。都市の小学生は、空襲をさけるため、親もとをはなれて地方へ集団で移りました（学童疎開）。1945年3月10日の東京大空襲では、一晩でおよそ10万人がなくなりました。\n\n1945年4月には沖縄にアメリカ軍が上陸し、住民を巻きこんだ地上戦で、多くの命がうばわれました。8月6日には広島に、8月9日には長崎に原子爆弾が落とされ、その年のうちに合わせて20万人以上がなくなりました。8月15日、天皇がラジオ放送で戦争の終わりを国民に伝えました。この戦争で、日本人だけでもおよそ310万人がなくなり、中国や朝鮮半島をはじめとするアジアの国々の人々にも、大きな損害と苦しみをあたえました。\n\n戦後の日本では、連合国軍の指示のもとで民主的な改革が進められました。軍隊は解散し、20才以上のすべての男女に選挙権が認められて、初めて女性の国会議員が生まれました。農地改革によって多くの農民が自分の土地をもてるようになり、学校の制度も新しくなりました。\n\n1946年11月3日には日本国憲法が公布され、翌年の5月3日から、この憲法にもとづく政治が始まりました。今の文化の日と憲法記念日です。この憲法は、国の政治を最終的に決めるのは国民であるという国民主権、だれもが生まれながらにもつ権利を大切にする基本的人権の尊重、戦争をしないことをちかう平和主義を、3つの原則としています。\n\n1951年、日本はサンフランシスコ平和条約を結んで、翌年独立を回復し、1956年には国際連合に加盟しました。その後、産業が発展し、くらしは豊かになっていきます。そしてむかえた1964年の東京オリンピック・パラリンピックです。開会式の直前には東海道新幹線が開通しました。\n\n焼け野原から、わずか19年。戦争の苦しみを経験した人々が、新しい憲法のもとで努力を重ねて、この日をむかえたのです。今のわたしたちのくらしは、その歩みの上にあります。"},{"id":"m3b09","title":"命がけで海をわたった使い","kind":"世界史","points":["遣唐使は630年から送られ、唐の進んだ政治のしくみや文化、仏教を学んで日本に持ち帰った。","平城京は唐の都の長安にならってつくられ、聖武天皇は仏教の力で国を治めようと大仏をつくらせた。","唐から来た鑑真は日本の仏教の発展につくし、正倉院には大陸から伝わった宝物が残されている。"],"body":"今からおよそ1300年前、日本の港から大陸に向けて、大きな船が出発しました。乗っていたのは、唐（とう）の国へ送られた使いの人々、遣唐使（けんとうし）です。当時の船は風まかせで、あらしにあえば、しずんでしまうこともありました。それでも人々は、命がけで海をわたりました。\n\n唐は、今の中国にあった大きな国です。都の長安は、100万人ほどが住んでいたともいわれる大都市で、道がごばんの目のように整えられていました。長安は、シルクロードとよばれる東西を結ぶ交通路の東のはしにあたり、西アジアやインドなど遠い国々からも、多くの人や品物が集まっていました。\n\n日本が遣唐使を送り始めたのは、630年のことです。それから200年あまりの間に、十数回にわたって使いが送られました。遣唐使には、役人だけでなく、留学生や、仏教を学ぶおぼうさんも加わりました。多いときには、4せきの船に500人ほどが乗りこんだといわれます。使いたちは、唐の進んだ政治のしくみや文化、仏教を学び、たくさんの書物や品物を日本に持ち帰りました。\n\nその成果は、日本の国づくりに生かされました。710年につくられた平城京（へいじょうきょう）は、長安にならって、ごばんの目のように区切られた都でした。唐の法律を手本にして、国を治めるしくみも整えられました。聖武（しょうむ）天皇は、仏教の力で国を安らかにしようと考え、奈良に東大寺を建てて、大仏をつくらせました。\n\n唐からも、人が海をわたってきました。中国のおぼうさん、鑑真（がんじん）は、日本に正しい仏教を広めてほしいとたのまれ、日本へ向かう決心をしました。ところが、船が流されたり、出航をさまたげられたりして、5回も失敗します。そのあいだに目が見えなくなりながらも、6回目でついに日本にたどり着きました。鑑真は、奈良に唐招提寺（とうしょうだいじ）を開き、日本の仏教の発展につくしました。\n\n東大寺の正倉院には、聖武天皇が大切にしていた品々などが、今も残されています。その中には、ガラスの器や、らくだに乗った人がえがかれた楽器など、西アジアやインドの文化のえいきょうを受けたと考えられる宝物がふくまれています。遠い国の品や文化が、唐を通って日本にまで届いていたのです。\n\nやがて唐の力がおとろえ、航海の危険も大きかったことから、894年に遣唐使はとりやめになりました。その後、日本では、大陸から学んだ文化をもとに、かな文字のような日本風の文化が育っていきます。わたしたちがふだん使っている漢字や、お寺の建物、仏教の行事も、海をこえてきた文化と深くつながっているのです。"},{"id":"m3b10","title":"黒船は何をしに来たのか","kind":"世界史","points":["1853年、アメリカの使節ペリーが4せきの黒船で浦賀に来航し、幕府に開国を求めた。","背景には、イギリスで始まった産業革命と、市場や原料を求めてヨーロッパやアメリカの国々がアジアへ進出した動きがあった。","1854年に日米和親条約、1858年に日米修好通商条約が結ばれたが、通商条約は日本に不平等なものだった。"],"body":"1853年の夏、江戸（えど）に近い浦賀（うらが）の沖に、見たこともない4せきの大きな船が現れました。船体は黒くぬられ、そのうち2せきは、もくもくとけむりをはきながら、風がなくても進むことのできる蒸気船でした。人々はこれを黒船とよび、町は大さわぎになりました。船を率いていたのは、アメリカ合衆国の使節ペリーです。\n\nペリーは、アメリカの大統領の手紙を幕府にわたし、国を開いてアメリカと付き合うことを求めました。当時の江戸幕府は、キリスト教が広まるのをおそれて、外国との行き来をきびしく制限していました。長崎で貿易を許されていたのは、清（しん）とよばれた当時の中国と、ヨーロッパの国ではオランダだけでした。\n\nでは、アメリカはなぜ、はるばる日本までやって来たのでしょうか。そのころのアメリカは、太平洋をわたって清と貿易をしようと考えていました。また、北太平洋では、アメリカの船がさかんにくじらをとっていました。くじらからとれる油は、ランプの明かりなどに使われていたのです。長い航海のとちゅうで、燃料の石炭や水、食料を積みこめる港が、どうしても必要でした。\n\nその背景には、世界の大きな変化がありました。18世紀の後半、イギリスで産業革命が起こり、機械を使って工場で大量に製品をつくれるようになりました。ヨーロッパやアメリカの国々は、製品を売る市場や原料を求めて、アジアへ進出していきました。1840年には、イギリスと清との間でアヘン戦争が起こり、敗れた清は、不利な条約を結ばされました。\n\nこの知らせは、オランダを通して幕府にも伝わっていました。大国の清が敗れたことに、幕府は強い危機感をいだきました。じつは、ペリーが来ることも、前の年にオランダから知らされていました。それでも、たくさんの大ほうを積んだ黒船を前に、幕府は返事を翌年まで待ってもらうのがやっとでした。\n\n翌年の1854年、ペリーは再びやって来て、幕府は日米和親条約を結びました。下田と函館（はこだて）の2つの港を開き、アメリカの船に燃料や水、食料をあたえることを約束したのです。こうして日本は、国を開くことになりました。さらに1858年には日米修好通商条約が結ばれ、長崎や新潟など5つの港を開いて貿易を行うことが決められました。同じような条約は、イギリスなどほかの国々とも結ばれました。\n\nところが、この条約は日本にとって不平等なものでした。日本にいる外国人が罪を犯しても日本の法律で裁けない領事裁判権を認め、輸入品にかける税を日本が自由に決める関税自主権もありませんでした。この不平等をすべて改めるまでに、日本は50年あまりの年月と努力を重ねることになります。黒船の来航は、日本が世界の大きな動きと直接向き合う、時代の曲がり角だったのです。"}]</script>
<script type="application/json" id="content-lv4">[{"id":"m4a01","title":"0より小さい数の正体","kind":"数学","points":["0より大きい数を正の数、0より小さい数を負の数といい、負の数は「－」の符号をつけて表す。","反対の性質をもつ量は、基準を決めて正負の符号で表せる。数直線上の原点からの距離を絶対値という。","ひき算はひく数の符号を変えてたし算に直せる。同じ符号の2数の積や商は正、異なる符号なら負になる。"],"body":"冬の朝、天気予報で「明日の最低気温はマイナス3度」と聞くことがある。小学校の算数では、0がいちばん小さい数だった。何もない状態が0で、それより少ないものは考えようがないからだ。ところが温度計の目もりは、0の下にもちゃんと続いている。0より小さい数とは、いったい何なのだろうか。\n\n中学校の数学では、0より大きい数を正の数、0より小さい数を負の数という。負の数には「－」という符号をつけ、たとえば0より3小さい数を－3と書いて「マイナス3」と読む。正の数であることをはっきり示したいときは、「＋」をつけて＋3と書く。0は正の数でも負の数でもない。また、正の整数1、2、3、…を自然数という。\n\n負の数が役に立つのは、反対の性質をもつ量をまとめて表したいときだ。基準より高い気温と低い気温、東へ進むことと西へ進むこと、増えることと減ること。たとえば東へ5km進むことを＋5kmと表すと決めれば、西へ5km進むことは－5kmと表せる。「2kg減った」を「－2kg増えた」と言いかえることもできる。基準と向きを決めて符号をつければ、反対向きの量を1つの数の仲間として扱えるのである。\n\n数直線では、0の点を原点として、右側に正の数、左側に負の数が並ぶ。数直線上で、ある数を表す点と原点との距離を、その数の絶対値という。＋4の絶対値も－4の絶対値も4である。数直線では右にある数ほど大きいので、負の数は絶対値が大きいほど小さい。たとえば－7は－2より小さく、不等号を使えば－7＜－2と書ける。氷点下7度のほうが氷点下2度より寒いのと同じことだ。\n\nたし算とひき算も、数直線で考えると分かりやすい。（＋3）＋（－5）は、右へ3進んでから左へ5進むことと考えられるので、答えは－2になる。符号が異なる2数の和は、絶対値の大きいほうの符号をつけ、絶対値の差を求めればよい。ひき算は、ひく数の符号を変えてたし算に直せる。（＋2）－（－6）は（＋2）＋（＋6）と同じで、答えは＋8だ。\n\nかけ算とわり算では、符号のきまりが大切になる。同じ符号の2数の積や商は正の数、異なる符号の2数の積や商は負の数になる。たとえば（－4）×（－3）＝＋12、（＋12）÷（－3）＝－4である。負の数どうしをかけると正になるのは不思議に思えるが、水そうの水位で考えると納得できる。水位が毎分2cmずつ下がっているとき、1分あたりの変化を－2cm、今から先の時間を正の数、過去の時間を負の数で表そう。3分前は－3分である。3分前の水位は今より6cm高かったはずだから、（－2）×（－3）＝＋6となり、きまりとぴったり合う。\n\n負の数を手に入れたことで、数の世界は0の左側にも広がった。気温のほかにも、海面より低い土地の高さ、お金の収入と支出、平均点との差など、身の回りには正の数と負の数で表すと便利な量がたくさんある。基準を0として、向きを符号で表す。この考え方は、これから学ぶ数学全体の土台にもなっていく。"},{"id":"m4a02","title":"100個並べると棒は何本？","kind":"数学","points":["文字を使うと、いろいろな数の場合を1つの式にまとめて表せる。文字に数を当てはめることを代入という。","文字式では×を省き、数を文字の前に書く。同じ文字の積は累乗の形で、わり算は分数の形で書く。","数量の関係は等式や不等式で短く表せる。文字の部分が同じ項はまとめて計算できる。"],"body":"棒を使って、正方形を横につなげて並べていこう。正方形が1個なら棒は4本、2個なら7本、3個なら10本いる。では、正方形を100個並べるには何本必要だろうか。1本ずつ数えていたら日が暮れてしまう。\n\n並べ方をよく見ると、最初に1本を縦に置き、そこへ「コ」の字の形に3本ずつ付け足すたびに正方形が1個増えていくことに気づく。正方形が1個なら1＋3×1本、2個なら1＋3×2本、3個なら1＋3×3本だ。それなら100個のときは1＋3×100＝301本である。ここで正方形の個数をxとおくと、棒の本数は1＋3×xという1つの式で表せる。\n\nこれが文字を使う1つ目のうれしさだ。xには1も100も1000も入るので、限りなく多くの場合を1つの式にまとめられる。文字は、いろいろな数が入れかわり入る入れ物のようなものである。式の中の文字に数を当てはめることを代入といい、代入して計算した結果を式の値という。1＋3×xのxに100を代入すると、式の値は301になる。\n\n文字を使った式には、書き方のきまりがある。かけ算の記号×は省き、数は文字の前に書く。だから1＋3×xは、ふつう3x＋1と書く。1×aは1を省いて単にaと書く。同じ文字をかけ合わせたa×aは、aの2乗としてa²と累乗の形で表す。わり算は記号÷を使わずに分数の形で書く。こうしたきまりのおかげで、式は短く読みやすくなる。\n\n2つ目のうれしさは、ことばで長々と説明しなければならない数量の関係を、短く正確に表せることだ。1個a円のりんごを3個と、1個b円のみかんを5個買ったときの代金は、（3a＋5b）円と書ける。「1本x円の鉛筆を5本買うと、代金は500円より高い」という関係なら、5x＞500と表せる。等号を使って数量が等しい関係を表した式を等式、不等号を使って大小関係を表した式を不等式という。\n\n3つ目のうれしさは、数が決まっていなくても計算を進められることだ。3x＋1という式で、＋で結ばれた3xや1を項といい、3xの3をxの係数という。文字の部分が同じ項はまとめられるので、2x＋5xは7xになる。たとえば（2x＋3）＋（4x－1）は、xの項どうし、数の項どうしをまとめて6x＋2と計算できる。あとでxの値が分かれば、代入するだけで答えが出る。\n\n文字式は、数学の共通語のようなものだ。理科で習う公式にも、表計算ソフトで使う計算式にも、文字を使った式の考え方が生きている。棒の本数のように、規則を見つけて文字で表せば、どんなに大きな数でもすぐに答えにたどり着ける。それが文字式の力である。"},{"id":"m4a03","title":"てんびんで解く方程式","kind":"数学","points":["文字に特別な値を代入したときだけ成り立つ等式を方程式といい、その値を方程式の解という。","等式の両辺に同じ数をたしても、ひいても、かけても、0でない同じ数でわっても、等式は成り立つ。","項の符号を変えて他方の辺に移すことを移項という。移項を使うと1次方程式を手順よく解ける。"],"body":"てんびんの左の皿に、同じ重さの袋を3つと20gのおもりをのせる。右の皿に80gのおもりをのせると、てんびんはちょうどつり合った。袋1つの重さは何gだろうか。暗算で答えが分かる人もいるだろうが、ここではてんびんの動きをヒントに、どんな問題にも使える解き方を考えてみよう。\n\n袋1つの重さをxgとすると、つり合いのようすは3x＋20＝80という等式で表せる。等号の左側の式を左辺、右側の式を右辺、両方をあわせて両辺という。この等式は、xに10を代入すると左辺が50になって成り立たないが、20を代入すると左辺が80になって成り立つ。このように、文字に特別な値を代入したときだけ成り立つ等式を方程式といい、方程式を成り立たせる値を、その方程式の解という。解を求めることを、方程式を解くという。\n\n解き方の手がかりは、てんびんにある。つり合っているてんびんは、両方の皿に同じ重さのものをのせても、両方の皿から同じ重さのものを取り去っても、つり合ったままだ。両方の皿にのっているものをそれぞれ2倍にしても、半分にしてもつり合いはくずれない。等式でも同じことがいえる。等式の両辺に同じ数をたしても、両辺から同じ数をひいても、両辺に同じ数をかけても、両辺を同じ数でわっても、等式は成り立つ。ただし、0でわることはできないので、わる数は0以外に限る。これを等式の性質という。\n\nこれを使って3x＋20＝80を解こう。まず両方の皿から20gのおもりを取り去る。つまり両辺から20をひくと、3x＝60となる。次に、袋3つで60gなのだから、両辺を3でわるとx＝20が得られる。袋1つは20gだ。最後にもとの式に代入して、左辺が3×20＋20＝80となり、右辺と等しくなることを確かめておくと安心である。\n\n計算をくり返すうちに、便利な見方に気づく。3x＋20＝80が3x＝80－20に変わるとき、左辺の＋20が、符号を変えて右辺へ移ったように見える。このように、等式の一方の辺にある項を、符号を変えて他方の辺に移すことを移項という。移項を使うと、5x－7＝2x＋8のように両辺にxがある方程式も解きやすい。xをふくむ項を左辺に、数の項を右辺に集めると5x－2x＝8＋7、まとめて3x＝15、両辺を3でわってx＝5となる。\n\n移項して整理すると（1次式）＝0の形になる方程式を、1次方程式という。てんびんでは負の数の重さは考えにくいが、等式の性質は負の数でも分数でも成り立つ。だから、てんびんで確かめたやり方は、どんな1次方程式にもそのまま使えるのである。\n\n方程式のよさは、分からない数をxとおき、問題の中の等しい関係をそのまま式に書けば、あとは決まった手順で答えにたどり着けるところにある。たとえば「1個x円のパンを4個買い、1000円を出したらおつりが280円だった」なら、1000－4x＝280と書ける。これを解くとx＝180となる。何をxにするかを決め、等しい関係を見つける。それが方程式を使いこなすこつである。"},{"id":"m4a04","title":"ともなって変わる2つの量","kind":"数学","points":["ともなって変わるx、yで、xの値を決めるとyの値がただ1つに決まるとき、yはxの関数であるという。","比例はy＝ax、反比例はy＝x分のaで表され、aを比例定数という。反比例ではxとyの積が一定になる。","平面上の点は座標で表す。比例のグラフは原点を通る直線、反比例のグラフは双曲線になる。"],"body":"空の水そうに、毎分3Lずつ水を入れていく。1分後には3L、2分後には6L、5分後には15Lたまる。水を入れた時間が決まれば、たまった水の量もただ1つに決まる。このように、ともなって変わる2つの数量x、yがあって、xの値を決めるとyの値がただ1つに決まるとき、yはxの関数であるという。xやyのように、いろいろな値をとる文字を変数という。\n\n水を入れた時間をx分、水の量をyLとすると、y＝3xと表せる。一般に、yがxの関数で、y＝axという式で表されるとき、yはxに比例するといい、定数aを比例定数という。比例では、xの値が2倍、3倍になると、yの値も2倍、3倍になる。中学校では、変数や比例定数が負の数の場合も考える。たとえばy＝－2xでは、xが1増えるごとにyは2ずつ減るが、これも比例である。\n\n比例のようすを目で見るには、グラフが役に立つ。そのために使うのが座標だ。平面上で、横の数直線をx軸、縦の数直線をy軸といい、2つの軸が交わる点を原点という。原点から右へ3、上へ2進んだ点は（3，2）と表し、3をx座標、2をy座標という。左や下に進むときは負の数を使えばよい。劇場の座席を列と番号で指定するように、2つの数の組で、平面上のどの点も正確に表せるのである。\n\ny＝3xを成り立たせるxとyの組を座標として点をとっていくと、それらは原点を通る1本の直線の上に並ぶ。比例のグラフは原点を通る直線になるのだ。比例定数が正の数なら右上がり、負の数なら右下がりの直線になる。比例定数の絶対値が大きいほど、直線は急になる。\n\n次に、12kmの道のりを進む場合を考えよう。時速xkmで進むときにかかる時間をy時間とすると、時速2kmなら6時間、時速3kmなら4時間、時速4kmなら3時間かかる。式で書けばy＝12÷x、分数の形にするとy＝x分の12である。一般に、y＝x分のaという式で表されるとき、yはxに反比例するといい、aをやはり比例定数という。反比例では、xの値が2倍、3倍になると、yの値は2分の1倍、3分の1倍になる。また、xとyの積はいつも比例定数aに等しい。\n\n反比例のグラフは直線にはならない。y＝x分の12で、xが負の数の場合までふくめて点をとり、なめらかに結ぶと、2つに分かれた曲線が現れる。これを双曲線という。曲線はx軸やy軸に限りなく近づいていくが、軸と交わることはない。xが0のときはわり算ができずyの値が決まらないし、yが0になることもないからだ。\n\n身の回りには、比例や反比例の関係がたくさんある。一定の速さで歩くときの時間と道のりは比例し、ある範囲では、ばねを引く力の大きさとばねののびも比例する。かみ合う2つの歯車では、一方の歯車の歯の数と回転数を決めておくと、もう一方の歯車の歯の数と回転数は反比例する。関数の見方を身につけると、身の回りの変化のしかたを、式とグラフで見通せるようになる。"},{"id":"m4a05","title":"定規とコンパスだけでかく","kind":"数学","points":["定規とコンパスだけを使って図をかくことを作図という。垂直二等分線や角の二等分線は作図できる。","形と大きさを変えずに図形の位置を変えることを移動といい、平行移動、回転移動、対称移動がある。","おうぎ形の弧の長さと面積は中心角に比例し、円全体の何分のいくつにあたるかで求められる。"],"body":"古代ギリシャの数学では、目もりのない定規とコンパスだけを使って図形をかく問題が熱心に研究された。長さを測らずに、どこまで正確な図がかけるのか。中学校の数学でも、この約束で図をかくことを作図という。定規は直線を引くためだけに使い、コンパスは円をかいたり、長さを写し取ったりするのに使う。\n\n作図の基本の1つが、線分の垂直二等分線である。線分ABの両端の点A、Bをそれぞれ中心として、等しい半径の円をかく。2つの円の交点を直線で結べば完成だ。この直線は線分ABの中点を通り、ABに垂直に交わる。しかも垂直二等分線上のどの点も、2点A、Bから等しい距離にある。2つの町から同じ距離にある場所を探したいときには、この性質がそのまま使える。\n\n角の二等分線も作図できる。角の頂点を中心に円をかき、角の2辺との交点をつくる。その2つの交点を中心に等しい半径の円をかき、2つの円の交点と頂点を結べばよい。角の二等分線上の点は、角の2辺から等しい距離にある。直線上にない点を通り、その直線に垂直な直線、つまり垂線も作図できる。これらを組み合わせれば、45°や30°の角も分度器なしでかける。90°の角を二等分すれば45°、正三角形の60°の角を二等分すれば30°になるからだ。\n\n次は図形の移動である。図形を、形と大きさを変えずにほかの位置に移すことを移動という。一定の方向に一定の距離だけずらす移動を平行移動、ある点を中心にして一定の角度だけ回す移動を回転移動、ある直線を折り目として折り返す移動を対称移動という。回転移動の中心にした点を回転の中心、対称移動の折り目にした直線を対称の軸という。とくに180°の回転移動を点対称移動という。床のタイルや布の模様をよく見ると、1つの形をこれらの移動でくり返し写して作られていることが多い。\n\n最後に、円の一部であるおうぎ形を考えよう。円周上の2点A、Bで分けられた円周の一部を弧ABといい、弧の両端を結ぶ線分を弦ABという。2つの半径と弧で囲まれた図形がおうぎ形で、2つの半径がつくる角を中心角という。中学校では、円周率を文字πで表す。半径rの円の周の長さは2πr、面積はπr²である。\n\nおうぎ形の弧の長さと面積は、中心角の大きさに比例する。中心角が90°なら円全体の4分の1、60°なら6分の1だ。たとえば半径6cm、中心角60°のおうぎ形の弧の長さは、円周12πcmの6分の1で2πcm、面積は円の面積36πcm²の6分の1で6πcm²となる。中心角が360°の何分のいくつにあたるかを考えれば、おうぎ形の計算は円の計算に置きかえられる。\n\n切り分けたケーキ、開いた扇、時計の長針が通り過ぎた部分など、おうぎ形は身の回りにあふれている。作図や移動の考え方も、模様のデザインや建物の設計を支えている。定規とコンパスという単純な道具を通して、図形の確かな性質が見えてくるのである。"},{"id":"m4a06","title":"円すいは円柱の何分の1？","kind":"数学","points":["角柱・円柱の体積は底面積×高さ、角すい・円すいの体積は3分の1×底面積×高さで求める。","表面積はすべての面の面積の和で、展開図をもとに側面積と底面積に分けて求める。","半径rの球の表面積は4πr²、体積は3分の4πr³で、球がぴったり入る円柱の体積の3分の2にあたる。"],"body":"底面の大きさと高さが同じ、円柱の形と円すいの形の容器を用意する。円すいの容器に水をいっぱいに入れて、円柱の容器に注ぐ。これをくり返すと、何杯で円柱がいっぱいになるだろうか。見た目から2杯と答えたくなるが、実際には3杯必要になる。円すいの体積は、底面と高さが等しい円柱の体積の3分の1なのである。\n\n立体にはいろいろな種類がある。平面だけで囲まれた立体を多面体という。角柱や円柱は、合同な2つの底面が平行に向かい合った立体で、角すいや円すいは、底面が1つで先が頂点にとがった立体だ。角柱と円柱の体積は、底面積×高さで求められる。角すいと円すいの体積は、その3分の1、つまり3分の1×底面積×高さとなる。\n\nたとえば、底面の半径が3cm、高さが5cmの円柱を考えよう。底面積はπ×3²＝9πcm²だから、体積は9π×5＝45πcm³である。同じ底面と高さの円すいなら、体積はその3分の1で15πcm³になる。\n\n立体のすべての面の面積の和を表面積という。表面積を求めるには、立体を切り開いた展開図を思いうかべるとよい。側面全体の面積を側面積、1つの底面の面積を底面積という。円柱の展開図では、側面は長方形になり、その横の長さは底面の円周と等しい。先ほどの円柱なら、側面積は5×6π＝30πcm²、底面積は2つ分で18πcm²なので、表面積は48πcm²となる。円すいの展開図では側面はおうぎ形になり、その弧の長さは底面の円周と等しい。\n\n次は球である。球は、どの方向から見ても円に見える立体だ。半径rの球の表面積は4πr²、体積は3分の4πr³で求められる。半径3cmの球なら、表面積は4π×9＝36πcm²、体積は3分の4×π×27＝36πcm³となる。数字は同じ36πでも、単位が違うことに注意しよう。面積と体積は別の量なのだ。\n\n球の体積については、古代ギリシャのアルキメデスが示した美しい関係がある。球がぴったり入る円柱、つまり底面の半径がr、高さが2rの円柱を考える。この円柱の体積はπr²×2r＝2πr³だ。球の体積3分の4πr³は、ちょうどその3分の2にあたる。アルキメデスはこの発見を誇りにし、自分の墓に球と円柱の図を刻むよう望んだと伝えられている。\n\n長方形をその1辺を軸として1回転させると円柱が、直角三角形を直角をはさむ1辺を軸として回転させると円すいが、半円を直径を軸として回転させると球ができる。このような立体を回転体という。缶やアイスクリームのコーン、ボールなど、身の回りの多くのものがこれらの形をしている。形の特徴をつかめば、入る量や包むのに必要な紙の広さを、計算で見積もることができる。"},{"id":"m4a07","title":"キャップが上を向く確率","kind":"数学","points":["度数分布表をもとに、階級の幅を横、度数を縦とする長方形を並べたグラフをヒストグラムという。","相対度数は、その階級の度数を度数の合計でわった値で、人数の違う集団を比べるときに役立つ。","多数回の試行で相対度数が近づいていく値を、その事柄の起こる確率と考えることができる。"],"body":"たとえば、ある中学校の1年生40人のハンドボール投げの記録が、名簿の順に並んでいるとする。18m、23m、11m、…。数字をながめているだけでは、全体としてどのくらい投げられているのか、記録がどのくらいばらついているのかは見えてこない。データの特徴をつかむには、整理のしかたにくふうがいる。\n\nまず、記録を5mごとの区間に分ける。この区間を階級、区間の幅を階級の幅、それぞれの階級に入る人数を度数という。10m以上15m未満が何人、15m以上20m未満が何人と数えて表にまとめたものが度数分布表である。さらに、階級の幅を横、度数を縦とする長方形をすき間なく並べたグラフをヒストグラムという。ヒストグラムにすると、山がどこにあるか、左右にどれくらい広がっているか、山が1つか2つかといった分布の形がひと目で分かる。\n\n人数の違う集団を比べるときには注意がいる。たとえば20m以上25m未満の階級に、40人のA組では8人、160人の学年全体では28人が入っていたとする。人数だけ見れば学年全体のほうが多いが、全体に占める割合で比べなければ公平ではない。そこで、各階級の度数を度数の合計でわった値を求める。これを相対度数という。A組は8÷40＝0.2、学年全体は28÷160＝0.175で、割合ではA組のほうがやや大きい。\n\n相対度数の考え方は、起こりやすさを調べるときにも使われる。ペットボトルのキャップを投げると、上向き、下向き、横向きのどれかになって止まる。上向きになりやすさはどのくらいだろうか。キャップは形がかたよっているので、どの向きも同じように起こるとは考えられない。こういうときは、実際に何度も投げて確かめるしかない。\n\nたとえば、あるクラスで実験して、投げた回数と上向きになった回数を記録し、上向きの相対度数を計算したとする。10回のときは0.4だったのが、100回では0.25、500回では0.22、1000回では0.21になった。このように、投げる回数が少ないうちは値が大きくゆれるが、回数を増やすにつれて、ある一定の値の近くに落ち着いていく。\n\nある事柄の起こりやすさの程度を表す数を、その事柄の起こる確率という。実験や観察を多数回くり返したとき、相対度数が近づいていく値を、その事柄の起こる確率と考えることができる。この例なら、キャップが上向きになる確率はおよそ0.21だといえる。ただし、確率が0.21だからといって、100回投げれば必ず21回上向きになるわけではない。確率は、多数回くり返したときの全体としての傾向を表しているのである。\n\n天気予報の降水確率も、似た考え方にもとづいている。降水確率30％という予報は、同じ予報が100回出されたとき、そのうちおよそ30回は1mm以上の雨や雪が降るという意味だ。データを整理して形をとらえ、多数の結果から起こりやすさを読み取る。こうした見方は、身の回りのことを判断するときの確かな手がかりになる。"},{"id":"m4b01","title":"道ばたの植物を仲間分けする","kind":"理科","points":["花は外側からがく・花弁・おしべ・めしべの順に並び、受粉すると子房は果実に、胚珠は種子になる。","種子植物は胚珠が子房に包まれた被子植物とむき出しの裸子植物に分かれ、被子植物は子葉の数で単子葉類と双子葉類に分かれる。","シダ植物とコケ植物は種子をつくらず胞子でふえる。シダ植物には根・茎・葉の区別があり、コケ植物にはない。"],"body":"校庭のすみや道ばたには、名前も知らない植物がたくさん生えている。数えきれないほどの種類があるように見えるが、いくつかの観点を順に当てはめていくと、大きな仲間に整理することができる。その観点とは、仲間のふやし方と、体のつくりである。\n\nまず、花を一つ手に取ってみよう。アブラナの花を外側から順に見ると、がく、花弁、おしべ、めしべが並んでいる。おしべの先にある小さな袋をやくといい、中には花粉が入っている。めしべの先は柱頭とよばれ、根もとのふくらんだ部分を子房という。子房の中には、胚珠という小さな粒がある。\n\n花粉がめしべの柱頭につくことを受粉という。受粉すると、子房は成長して果実になり、中の胚珠は種子になる。エンドウのさやは子房が、さやの中の豆は胚珠が育ったものだ。このように、花を咲かせて種子をつくる植物を種子植物という。\n\n種子植物は、胚珠のようすでさらに二つに分かれる。アブラナやサクラのように、胚珠が子房の中に包まれているものを被子植物という。一方、マツやイチョウには子房がなく、胚珠がむき出しになっている。これを裸子植物という。マツの雌花のりん片には胚珠がむき出しでついていて、風で運ばれた花粉が直接つく。子房がないので、裸子植物には果実ができない。イチョウのぎんなんも、果実ではなく種子なのである。\n\n被子植物は、芽生えのときに出る子葉の数で、さらに分けられる。子葉が1枚のものを単子葉類、2枚のものを双子葉類という。単子葉類のイネやトウモロコシは、葉脈が平行に並び、根はひげ根である。双子葉類のアブラナやホウセンカは、葉脈が網目状に広がり、根は、太い主根と、そこから枝分かれした側根からなる。葉のすじを見れば、根を掘り出さなくても、根のようすの見当がつくわけだ。\n\n種子をつくらない植物もある。イヌワラビやゼンマイなどのシダ植物と、ゼニゴケやスギゴケなどのコケ植物だ。これらは胞子で仲間をふやす。シダ植物の葉の裏には、胞子の入った胞子のうが集まっていることがある。シダ植物には根・茎・葉の区別があるが、コケ植物にはその区別がない。コケの根のように見えるものは仮根といい、おもに体を地面などに固定するはたらきをしている。コケ植物は、水を体の表面全体から取り入れている。\n\n種子をつくるか、胚珠は子房に包まれているか、子葉は何枚か。この問いを順にたどると、身近な植物の多くは仲間分けできる。道ばたの草にも当てはめてみると、見慣れた景色が少しちがって見えてくるはずだ。"},{"id":"m4b02","title":"クジラが魚ではないわけ","kind":"理科","points":["背骨をもつセキツイ動物は、魚類・両生類・ハチュウ類・鳥類・ホニュウ類の5つの仲間に分けられる。","えらか肺か、卵生か胎生か、体の表面のようす、変温動物か恒温動物かが、5つの仲間を分ける手がかりになる。","背骨をもたない無セキツイ動物には、外骨格と節をもつ節足動物や、外とう膜で内臓を包む軟体動物などがいる。"],"body":"クジラは海で暮らし、魚によく似た形をしている。それなのに、魚の仲間ではなく、ヒトやイヌと同じホニュウ類に分類される。なぜだろうか。その理由は、動物を分類するときに何に注目するのかを知るとよくわかる。\n\n動物を大きく分ける最初の観点は、背骨があるかどうかである。背骨をもつ動物をセキツイ動物、もたない動物を無セキツイ動物という。セキツイ動物は、さらに魚類、両生類、ハチュウ類、鳥類、ホニュウ類の5つの仲間に分けられる。分ける手がかりになるのは、呼吸のしかた、子のうまれ方、体の表面のようす、体温の変化のしかたなどだ。\n\n呼吸のしかたを見ると、魚類は一生えらで呼吸する。カエルやイモリなどの両生類は、子のときは水中でえらと皮膚で呼吸し、親になると肺と皮膚で呼吸する。ハチュウ類、鳥類、ホニュウ類は肺で呼吸する。体の表面は、魚類とハチュウ類がうろこ、両生類はしめった皮膚、鳥類は羽毛、ホニュウ類は毛でおおわれている。\n\n子のうまれ方では、魚類、両生類、ハチュウ類、鳥類は卵をうむ。これを卵生という。魚類と両生類の卵には殻がなく、水中にうみつけられる。ハチュウ類と鳥類の卵には殻があり、陸上でも乾燥にたえられる。これに対してホニュウ類は、子が母親の体内である程度育ってからうまれる。これを胎生といい、うまれた子は母親の乳を飲んで育つ。\n\n体温にもちがいがある。魚類、両生類、ハチュウ類は、まわりの温度の変化にともなって体温が変わる変温動物である。鳥類とホニュウ類は、まわりの温度が変わっても体温をほぼ一定に保つ恒温動物だ。冬になるとカエルやヘビが土の中でじっと動かなくなるのは、気温とともに体温が下がり、活発に動けなくなるからである。\n\nここでクジラにもどろう。クジラは海で暮らしているが、えらはなく、ときどき海面に浮かび上がって肺で呼吸する。子は母親の体内で育ってからうまれ、乳を飲んで大きくなる。体温もほぼ一定に保たれている。見た目は魚に似ていても、体のしくみはホニュウ類そのものなのだ。\n\n一方、背骨をもたない無セキツイ動物は、種類の数ではセキツイ動物よりはるかに多い。昆虫やエビ、カニ、クモなどは節足動物とよばれ、体の外側をかたい殻である外骨格がおおい、体やあしに節がある。イカやタコ、アサリやマイマイなどは軟体動物とよばれ、内臓が外とう膜という膜で包まれている。このほかにも、ウニやヒトデ、クラゲ、ミミズなど、さまざまな無セキツイ動物がいる。\n\n見た目や住む場所ではなく、体のつくりや生き方に注目すると、動物どうしのつながりが見えてくる。水族館や動物園では、えらか肺か、卵か胎生かを考えながら見てみるとおもしろい。"},{"id":"m4b03","title":"白い粉の正体を見破る","kind":"理科","points":["炭素をふくみ、燃えると二酸化炭素を出す物質を有機物といい、それ以外の物質を無機物という。","金属は光沢があり、電気や熱をよく通し、のびたり広がったりするが、磁石につくのは鉄など一部だけである。","密度（質量÷体積）は物質ごとに決まっていて、物質を見分ける手がかりになる。気体も性質のちがいで見分けられる。"],"body":"台所に、砂糖、食塩、かたくり粉の三つの白い粉があるとする。見た目はよく似ていて、ぱっと見ただけでは区別しにくい。しかし理科の実験では、なめて確かめることはしない。物質がもつ性質を一つずつ調べて、正体を明らかにしていくのである。\n\n三つの粉を燃焼さじにのせて、ガスバーナーで加熱してみよう。砂糖とかたくり粉は黒くこげ、やがて炎を出して燃える。燃えている粉を集気びんに入れ、火が消えたら取り出して石灰水を入れてふると、白くにごる。二酸化炭素ができたのだ。このように、炭素をふくみ、燃えると二酸化炭素を出す物質を有機物という。紙や木、ろう、プラスチックも有機物である。多くの有機物は水素もふくむので、燃えると水もできる。一方、食塩は加熱しても燃えない。有機物以外の物質を無機物という。なお、炭素そのものや二酸化炭素は、炭素をふくむが無機物に分けられる。\n\n無機物のなかでも、鉄、銅、アルミニウムなどの金属には共通の性質がある。みがくと特有の光沢が出る、電気をよく通す、熱をよく伝える、たたくとうすく広がり、引っぱるとのびる、という性質だ。注意したいのは、磁石につくことは金属に共通の性質ではない点である。磁石につくのは鉄など一部の金属だけで、アルミニウムや銅はつかない。空き缶を分別するときに磁石が役立つのは、このちがいを利用しているからだ。\n\n見た目の似た金属どうしを見分けるには、密度が役に立つ。密度とは、物質1cm³あたりの質量のことで、質量（g）÷体積（cm³）で求められる。たとえば、体積が10cm³で質量が27gの金属なら、密度は2.7g/cm³で、アルミニウムだと考えられる。鉄の密度は約7.9g/cm³なので、同じ体積なら鉄のほうがずっと重い。また、液体に入れた物体は、液体より密度が小さければ浮き、大きければしずむ。\n\n目に見えない気体も、性質で見分けられる。酸素は二酸化マンガンにうすい過酸化水素水を加えると発生し、ものを燃やすはたらきがある。二酸化炭素は石灰石にうすい塩酸を加えると発生し、石灰水を白くにごらせる。水素は亜鉛や鉄にうすい塩酸を加えると発生し、気体の中で最も密度が小さく、火をつけると音を立てて燃えて水ができる。アンモニアは鼻をさすようなにおいがあり、水に非常によくとけて、その水溶液はアルカリ性を示す。\n\nこうした性質は、気体の集め方にも関係している。水にとけにくい酸素や水素は、水上置換法で集める。水によくとけて空気より密度が小さいアンモニアは、上方置換法で集める。\n\n燃やす、磁石を近づける、質量と体積をはかる、水にとかす。性質を一つずつ確かめていけば、見た目では区別できない物質の正体も見えてくる。白い粉の見分けも、こうした手順の積み重ねなのである。"},{"id":"m4b04","title":"冷やすと現れる結晶","kind":"理科","points":["物質がとけた水溶液は透明で、とけた物質の粒子は一様に広がり、濃さはどこでも同じである。","質量パーセント濃度は、溶質の質量÷溶液の質量×100で求め、溶液の質量は溶質と溶媒の質量の和である。","100gの水にとける最大の質量を溶解度といい、温度による溶解度の差などを利用して結晶を取り出すことを再結晶という。"],"body":"コップの水に、食塩をスプーンで一杯ずつ入れてかき混ぜていく。はじめはすぐに見えなくなるが、何杯も入れていくと、やがていくらかき混ぜても底に粒が残るようになる。水にとける物質の量には、限りがあるのだ。そしてこの限りをうまく利用すると、水にとけた物質を、もう一度きれいな粒として取り出すことができる。\n\n食塩を水にとかしたとき、とけている食塩を溶質、とかしている水を溶媒、できた液を溶液という。溶媒が水の溶液を水溶液という。水溶液は透明で、色がついていても向こう側がすけて見える。とけた物質の粒子は水の中に一様に広がっていて、時間がたっても下にたまることはない。そのため、水溶液の濃さはどこでも同じである。\n\n水溶液の濃さは、質量パーセント濃度で表す。溶質の質量を溶液全体の質量でわり、100をかけたものだ。たとえば、水90gに食塩10gをとかすと、溶液の質量は100gになるので、濃度は10÷100×100で10％である。よくある間違いは、水の質量90gでわってしまうことだ。わる数は、溶質と溶媒を合わせた溶液の質量である。逆に、15％の食塩水200gには、200×0.15で30gの食塩がとけていることになる。\n\n一定の量の水にとける物質の最大の質量は、物質の種類と温度によって決まっている。100gの水にとける物質の最大の質量を溶解度といい、物質がそれ以上とけることができなくなった水溶液を飽和水溶液という。溶解度と温度の関係をグラフに表したものが溶解度曲線である。\n\n溶解度曲線を見ると、物質によって温度の影響の受け方がまったくちがうことがわかる。硝酸カリウムの溶解度は、20℃では約32gだが、60℃では約109gにもなる。一方、塩化ナトリウム（食塩）の溶解度は、20℃でも60℃でも約36〜37gで、ほとんど変わらない。\n\nこの差を利用したのが再結晶である。60℃の水100gに硝酸カリウムを100gとかし、20℃まで冷やすと、とけきれなくなった約68gが結晶となって出てくる。一方、食塩水は冷やしても結晶がほとんど出てこないので、水を蒸発させて取り出す。結晶は物質ごとに決まった形をしていて、食塩は立方体、ミョウバンは正八面体に近い形になる。再結晶は、混じり物の少ない純粋な物質を取り出す方法としても使われている。\n\n水にとけて見えなくなった物質も、消えてしまったわけではない。温度を下げたり水を減らしたりすれば、また姿を現す。海水を煮つめて塩をつくる昔ながらの方法も、この性質を利用したものなのである。"},{"id":"m4b05","title":"湯気は気体ではない","kind":"理科","points":["状態変化では体積は変わるが質量は変わらない。多くの物質は液体から固体になると体積が減るが、水は氷になると増える。","純粋な物質は融点・沸点が決まっていて、とけている間や沸騰している間は温度が一定になる。","液体を沸騰させて出てくる気体を冷やし、再び液体として集める方法を蒸留といい、沸点のちがいで混合物を分けられる。"],"body":"やかんでお湯をわかすと、注ぎ口から白い湯気が出てくる。この湯気を水蒸気だと思っている人は多いが、実はちがう。水蒸気は気体で、目には見えない。白く見える湯気は、水蒸気がまわりの空気に冷やされてできた、小さな水の粒、つまり液体なのだ。よく見ると、注ぎ口のすぐ近くには、何も見えない部分がある。そこにあるのが本当の水蒸気である。\n\n物質は温度によって、固体、液体、気体とすがたを変える。これを状態変化という。氷がとけて水になり、水が沸騰して水蒸気になっても、水という物質が別の物質に変わるわけではない。状態変化では、体積は変化するが、質量は変化しない。\n\nこのことは、物質をつくる小さな粒子のようすで考えるとわかりやすい。固体では粒子が規則正しく並び、その場で細かくゆれている。液体になると粒子は位置を変えながら動き回り、気体になると粒子が激しく飛び回って、粒子どうしの間隔が大きく広がる。粒子の数は変わらないので質量は同じままだが、間隔が変わるので体積が変わるのである。水が水蒸気になると、体積は約1700倍にもなる。\n\nふつう、物質は液体から固体になると体積が小さくなる。とかしたろうを冷やすと、固まったろうの中央がへこむのはそのためだ。ところが水は例外で、氷になると体積が約1.1倍に増える。冬の寒い日に水道管が破裂することがあるのも、氷が水に浮くのも、このためである。\n\n固体がとけて液体になるときの温度を融点、液体が沸騰して気体になるときの温度を沸点という。水の融点は0℃、沸点は100℃で、エタノールの沸点は約78℃である。純粋な物質では、融点や沸点は物質の種類によって決まっていて、とけている間や沸騰している間は、加熱を続けても温度が上がらない。一方、いくつかの物質が混ざった混合物では、沸点ははっきりと決まらない。\n\n沸点のちがいを利用すると、混合物から物質を分けることができる。液体を加熱して沸騰させ、出てきた気体を冷やして再び液体として集める方法を蒸留という。たとえば水とエタノールの混合物を加熱すると、はじめのうちに出てくる液体には、沸点の低いエタノールが多くふくまれている。そのため、においが強く、火を近づけると燃える。\n\n石油の精製でも、同じしくみが使われている。地下からくみ上げた原油を加熱し、沸点のちがいを利用して、ガソリンや灯油、軽油などに分けているのだ。湯気の正体から燃料づくりまで、状態変化を知ると、身のまわりの現象が一本の糸でつながって見えてくる。"},{"id":"m4b06","title":"稲妻が先、雷鳴があと","kind":"理科","points":["光は入射角と反射角が等しくなるように反射し、ちがう物質の境目へななめに進むと折れ曲がる。これを屈折という。","凸レンズは光を焦点に集め、物体が焦点の外側にあると逆向きの実像が、内側にあると同じ向きで大きな虚像が見える。","音は物体の振動で生じ、真空中は伝わらない。振幅が大きいほど大きな音、振動数が多いほど高い音になる。"],"body":"遠くで稲妻が光ると、少しおくれてゴロゴロという雷鳴が聞こえてくる。光と音は同時に生まれているのに、届くまでの時間がちがうのだ。光は1秒間に約30万kmも進むので、ほとんど一瞬で目に届く。一方、空気中を伝わる音の速さは秒速約340mである。光ってから音が聞こえるまで3秒かかったなら、雷までの距離は340×3で約1020m、およそ1kmと見積もることができる。\n\n光は、同じ物質の中ではまっすぐに進む。鏡に当たると、入射角と反射角が等しくなるようにはね返る。これを反射の法則という。表面に細かいでこぼこがある物体では、光がいろいろな方向に反射する。これを乱反射といい、紙や壁をどの方向からでも見ることができるのは、乱反射のおかげである。\n\n光が空気から水やガラスへとななめに進むとき、境目で折れ曲がる。これを屈折という。空気から水へ進む光は、屈折角が入射角より小さくなるように曲がる。水に入れたストローが折れて見えたり、プールの底が実際より浅く見えたりするのは、水中からの光が水面で屈折して目に届くからだ。また、水やガラスから空気へ進む光は、入射角が大きくなると境目ですべて反射する。これを全反射といい、光ファイバーに利用されている。\n\n屈折を利用した道具が凸レンズである。光軸に平行に進む光は、凸レンズを通ると屈折して一点に集まる。この点を焦点という。物体を焦点より外側に置くと、反対側のスクリーンに上下左右が逆向きの実像がうつる。物体を焦点より内側に置くと、スクリーンに像はできないが、レンズをのぞくと物体より大きな同じ向きの虚像が見える。虫眼鏡で見る大きな文字は、この虚像である。\n\n一方、音は物体の振動によって生じる。たいこをたたくと皮が振動し、その振動がまわりの空気を次々に振動させて耳に伝わる。音は空気だけでなく、水や金属などの中も伝わる。しかし、容器に入れたブザーを鳴らしながら中の空気をぬいていくと、音はしだいに小さくなる。音は、伝えるものがない真空中では伝わらないのだ。\n\n音の大きさは振幅、つまり振動のはばで決まり、振幅が大きいほど大きな音になる。音の高さは、1秒間に振動する回数である振動数で決まり、単位にはヘルツ（Hz）を使う。振動数が多いほど高い音になる。モノコードの弦を短くしたり、細くしたり、強く張ったりすると、振動数が多くなって高い音が出る。\n\n鏡にうつる顔、虫眼鏡、楽器の音。光と音は、反射したり曲がったり、振動のしかたを変えたりしながら、わたしたちのもとに届いている。次に雷が鳴ったときは、安全な屋内で、光ってから音が聞こえるまでの秒数を数えてみよう。"},{"id":"m4b07","title":"月では体重が6分の1？","kind":"理科","points":["力の大きさの単位はニュートン（N）で、約100gの物体にはたらく重力の大きさが約1Nである。","ばねののびは、ばねを引く力の大きさに比例する。これをフックの法則という。","重さは重力の大きさで場所によって変わるが、質量は変わらない。つり合う二力は一直線上で大きさが等しく向きが反対。"],"body":"月面でばねを使った体重計にのると、目もりは地球でのおよそ6分の1を示すという。では、月へ行くと、体をつくっているものの量まで減ってしまうのだろうか。もちろん、そんなことはない。この不思議を解くかぎは、重さと質量という二つの言葉のちがいにある。\n\nその前に、力とは何かを確認しておこう。力には、物体の形を変える、物体の動きを変える、物体を支える、という三つのはたらきがある。力は目に見えないので、矢印を使って表す。矢印の根もとが力のはたらく点である作用点、矢印の向きが力の向き、矢印の長さが力の大きさを表す。力の大きさの単位はニュートン（N）で、約100gの物体にはたらく重力の大きさが約1Nである。\n\n地球上のすべての物体には、地球の中心に向かって引かれる力、つまり重力がはたらいている。この重力の大きさを重さといい、ばねばかりなどではかる。単位はニュートンだ。これに対して、物体そのものの量を質量といい、上皿てんびんではかる。単位はgやkgである。月の重力は地球の約6分の1なので、月では重さが約6分の1になる。しかし、質量はどこへ行っても変わらない。\n\nばねばかりで重さがはかれるのは、ばねにある性質があるからだ。ばねにおもりをつるしていくと、ばねののびは、ばねを引く力の大きさに比例する。これをフックの法則という。たとえば、1Nの力で2cmのびるばねなら、3Nでは6cm、5Nでは10cmのびる。力の大きさとばねののびの関係をグラフにすると、原点を通る直線になる。\n\nこのばねに、地球上で600gのおもりをつるすと、約6Nの重力がはたらくので、ばねは約12cmのびる。同じおもりを月に持っていくと、重さは約1Nになるので、のびは約2cmしかない。ところが上皿てんびんではかると、月でも600gの分銅とつり合う。おもりと同じように、分銅にはたらく重力も約6分の1になるからだ。\n\n机の上に置いた本は、重力で下に引かれているのに落ちていかない。机が本を上向きに押し返す力、つまり垂直抗力がはたらいているからだ。一つの物体に二つの力がはたらいていて物体が動かないとき、二つの力はつり合っているという。二力がつり合うのは、二つの力が一直線上にあり、大きさが等しく、向きが反対のときである。綱引きで綱が止まっているときも、両側から引く力がつり合っている。\n\nふだん何気なく使っている重さという言葉も、理科では物体にはたらく重力の大きさを指している。宇宙飛行士の体重が月で変わっても、体をつくっているものの量は少しも変わっていないのである。"},{"id":"m4b08","title":"がけのしま模様が語ること","kind":"理科","points":["マグマのねばりけが強いと激しい噴火でドーム状の白っぽい火山に、弱いとおだやかな噴火で傾斜のゆるやかな黒っぽい火山になる。","地震では速いP波が初期微動を、おそいS波が主要動を伝え、初期微動継続時間は震源から遠いほど長い。","地層はふつう下ほど古く、示相化石は当時の環境を、示準化石は地層ができた時代を知る手がかりになる。"],"body":"道路わきのがけや川岸に、しま模様が見えることがある。これは地層とよばれ、長い年月をかけて積み重なった土砂などの層だ。地層を読み解くと、その土地で昔何が起きたのかを知ることができる。\n\n地表の岩石は、気温の変化や雨風によって、長い年月の間にもろくなっていく。これを風化という。もろくなった岩石は流れる水にけずられ、運ばれて、流れのゆるやかな所に積もる。これらのはたらきを侵食、運搬、堆積という。粒の大きいれきは河口の近くに、砂はそれより沖に、細かい泥はさらに沖の深い所に積もりやすい。積み重なった層は、ふつう下にあるものほど古い。長い時間をかけて固まると、れき岩、砂岩、泥岩などの堆積岩になる。\n\n地層の中からは化石が見つかることがある。サンゴの化石が出れば、その地層ができたころ、そこはあたたかく浅い海だったとわかる。このように当時の環境を知る手がかりになる化石を示相化石という。また、サンヨウチュウなら古生代、アンモナイトなら中生代というように、地層ができた時代を知る手がかりになる化石を示準化石という。\n\n地層の中には、火山灰が積もってできた層がふくまれていることもある。火山灰などが固まった岩石を凝灰岩という。火山灰は広い範囲に一度に降り積もるので、はなれた場所の地層を比べるときのよい目印になる。\n\n火山は、地下のマグマが地表にふき出してできる。マグマのねばりけによって、火山の形や噴火のようすは大きく変わる。ねばりけが強いマグマは激しい噴火を起こしやすく、盛り上がったドーム状の火山をつくり、溶岩や火山灰は白っぽい。ねばりけが弱いマグマは溶岩がおだやかに流れ出し、傾斜のゆるやかな火山をつくり、色は黒っぽい。その中間のマグマは、富士山のような円すい形の火山をつくる。\n\n地震が起きると、はじめにカタカタと小さくゆれ、少しおくれてユサユサと大きくゆれることが多い。はじめのゆれを初期微動、あとの大きなゆれを主要動という。震源では二つの波が同時に発生するが、初期微動を伝えるP波は速く、主要動を伝えるS波はおそいため、届くまでに差が生まれる。この差である初期微動継続時間は、震源から遠いほど長くなる。\n\nゆれの大きさは震度で表し、日本では0から7までの10段階に分けられている。地震そのものの規模はマグニチュードで表す。日本列島の付近では、海のプレートが陸のプレートの下に沈みこんでいて、その境目付近などで大きな地震が多く起きる。日本に火山が多いのも、プレートの動きと関係している。\n\n火山や地震は大きな災害をもたらす一方で、温泉や美しい景色などのめぐみも与えてくれる。がけのしま模様に目を向けると、わたしたちが立つ大地が、長い時間をかけて今も変わり続けていることが実感できるだろう。"},{"id":"m4c01","title":"地球を区切る見えない線","kind":"地理","points":["地球の陸地と海洋の面積はおよそ3対7で、陸地は六大陸、海洋は太平洋・大西洋・インド洋の三大洋が中心である。","緯度は赤道を0度として南北を90度ずつ、経度は本初子午線を0度として東西を180度ずつに分けて、位置を表す。","経度15度で約1時間の時差が生じ、東経135度を標準時子午線とする日本とロンドンの時差は9時間である。"],"body":"新しい年を迎えたことを伝えるニュースで、日本の年明けから何時間もたったころ、ヨーロッパの町で年越しの花火が上がる映像を見たことはないだろうか。同じ地球の上なのに、なぜ年の明ける時刻がずれるのだろう。そのなぞを解くかぎは、地球を区切る見えない線にある。\n\nまず、地球の表面を大きくながめてみよう。地球の表面は陸地と海洋に分けられ、その面積の割合はおよそ3対7である。陸地は六つの大陸と多くの島々からなる。六大陸とは、ユーラシア大陸、アフリカ大陸、北アメリカ大陸、南アメリカ大陸、オーストラリア大陸、南極大陸で、最も大きいのはユーラシア大陸だ。海洋のうち特に大きな三つを三大洋といい、太平洋、大西洋、インド洋がこれにあたる。最も広い太平洋は、すべての陸地を合わせた面積よりもさらに広い。\n\n世界は、六つの州に分けて考えることもある。アジア州、ヨーロッパ州、アフリカ州、北アメリカ州、南アメリカ州、オセアニア州である。ユーラシア大陸はアジア州とヨーロッパ州にまたがっており、大陸の分け方と州の分け方は必ずしも一致しない。\n\n地球上の位置を正確に表すために使われるのが、緯度と経度だ。緯度は、赤道を0度として、南北をそれぞれ90度に分けたもので、赤道より北を北緯、南を南緯という。同じ緯度の地点を結んだ線を緯線という。経度は、イギリスのロンドンにある旧グリニッジ天文台を通る本初子午線を0度とし、東西をそれぞれ180度に分けたもので、東経と西経がある。北極と南極を結ぶ線を経線という。たとえば東京は、およそ北緯36度、東経140度の位置にある。\n\nさて、年明けがずれる正体は時差である。地球は24時間で1回転、つまり360度回っている。360÷24＝15だから、経度が15度ちがうと、時刻はおよそ1時間ずれることになる。それぞれの国は基準となる経線を決めて、標準時を定めている。日本の標準時子午線は、兵庫県明石市を通る東経135度の経線だ。ロンドンは経度0度なので、経度の差は135度、135÷15＝9で、日本との時差は9時間となる。日本で1月1日の午前0時を迎えたとき、ロンドンはまだ12月31日の午後3時なのである。\n\nでは、東へ東へと進み続けると、日付はどうなるのか。そのままでは日付が分からなくなってしまうため、太平洋上には、おおむね経度180度の経線に沿って日付変更線が引かれている。この線を西から東へこえるときは日付を1日おくらせ、東から西へこえるときは1日進める。日付変更線のすぐ西側の地域は、世界で最も早く新しい日を迎えることになる。\n\n緯度と経度という目盛りがあるおかげで、世界のどこにいても、場所と時刻を同じものさしで表すことができる。海外で行われるスポーツの試合の生中継が、日本では真夜中や明け方になってしまう理由も、この見えない線が教えてくれるのだ。"},{"id":"m4c02","title":"家の形は気候しだい","kind":"地理","points":["世界の気候は、熱帯・乾燥帯・温帯・冷帯（亜寒帯）・寒帯の五つの気候帯に大きく分けられる。","熱帯では湿気を逃がす高床の家、木の少ない乾燥帯では日干しれんがの家など、住まいは気候に合わせてくふうされている。","冷帯のシベリアで建物を高床にするのは、建物の熱で永久凍土がとけて建物がかたむくのを防ぐためである。"],"body":"床を地面から高く持ち上げた高床の建物は、気候のまったくちがう場所で見られる。たとえば、一年中蒸し暑い東南アジアの村と、冬にマイナス30度を下回ることもめずらしくないシベリアの町だ。正反対ともいえる気候なのに、なぜ似た形の建物がつくられているのだろうか。\n\n世界の気候は、気温と降水量のちがいから、大きく五つの気候帯に分けられる。赤道付近に広がる熱帯、雨の少ない乾燥帯、四季の変化がはっきりした温帯、冬の寒さがきびしい冷帯（亜寒帯）、そして一年を通して気温の低い寒帯である。人々は、それぞれの気候に合わせて、衣服や食べ物、住まいをくふうしてきた。\n\n熱帯の地域は一年中気温が高く、雨も多い。東南アジアや太平洋の島々では、風通しをよくし、地面からの湿気や熱をさけるために、高床の家が建てられてきた。周りの森林からとれる木や葉が材料に使われ、主食には米やいも類などがよく食べられている。\n\n乾燥帯では雨がほとんど降らず、木が育ちにくい。そこで、土をこねて形をつくり、日に干して固めた日干しれんがで家を建てる。強い日差しや砂ぼこりから身を守るため、体を広くおおう、ゆったりとした長そでの衣服を着ることが多い。水がわき出るオアシスの周りでは、なつめやしや小麦が栽培されている。草原が広がるモンゴルでは、羊などの家畜とともに移動する遊牧が行われ、組み立てや片付けのしやすいゲルという住まいが使われてきた。\n\n温帯のうち、夏に雨が少なく乾燥する地中海沿岸では、乾燥に強いオリーブやぶどうが育てられてきた。強い日差しをさえぎるため、石でつくった家は壁を厚くして窓を小さくし、壁を白くぬった町並みも見られる。\n\n冷帯のシベリアには、タイガとよばれる針葉樹の森が広がり、地面の下には一年中こおったままの永久凍土がある。ここで建物を地面の上に直接建てると、暖房の熱が伝わって凍土がとけ、建物がかたむいてしまう。高床にしているのは、熱を地面に伝えないためなのだ。同じ高床でも、熱帯では湿気を逃がすため、冷帯では凍土を守るためと、理由はまったくちがう。さらに北の寒帯では、カナダ北部などに暮らすイヌイットの人々が、かつて狩りの季節に雪のブロックで家をつくり、アザラシやカリブーの肉や毛皮を食料や衣服に生かしてきた。\n\n今では世界の多くの地域でコンクリートの建物や洋服が見られ、暮らしは似通ってきている。それでも、気候に合わせて生まれた知恵は、今も各地の衣食住に生きている。日本の古い家に見られる深いひさしや風通しのよいつくりも、蒸し暑い夏を少しでも快適に過ごすためのくふうなのだ。"},{"id":"m4c03","title":"世界の6割が暮らす州","kind":"地理","points":["アジア州には世界の人口の約6割が住み、中国とインドはどちらも人口が14億人をこえる。","季節風（モンスーン）がもたらす夏の雨を生かして、東アジアから東南アジア、南アジアにかけて稲作がさかんである。","アジアNIESや「世界の工場」とよばれる中国、ICT産業がのびるインドなど、アジアでは急速に工業化が進んでいる。"],"body":"世界の人口はおよそ80億人。そのうち約6割が、アジア州に暮らしている。とりわけ中国とインドは、どちらも人口が14億人をこえる大国だ。なぜアジアには、これほど多くの人が暮らしているのだろうか。その手がかりの一つは、毎日の食卓に上る米にある。\n\nアジアの東部から南部にかけては、季節風（モンスーン）の影響を強く受ける。夏には海から大陸に向かって湿った風がふき、たくさんの雨をもたらす。冬には大陸から海に向かって乾いた風がふく。夏の高い気温と豊かな雨は、水田で育てる稲にぴったりの条件だ。そのため、中国の南部や東南アジア、インドなどでは古くから稲作がさかんで、米の生産量は中国とインドが世界の上位をしめている。一方、降水量の少ない中国の北部では、小麦などを育てる畑作が中心である。\n\n米は、同じ広さの土地からとれる量が多く、多くの人を養うことができる作物だといわれる。東南アジアの一部では、同じ田で1年に2回米をつくる二期作も行われている。こうした米づくりが、アジアの多くの人口を支えてきたと考えられている。タイやベトナムは、米を世界に輸出する国としても知られている。\n\n一方、20世紀の後半から、アジアの国々は工業の分野で大きく姿を変えてきた。まず急速に工業化を進めたのが、韓国、台湾、ホンコン、シンガポールで、これらはアジアNIES（新興工業経済地域）とよばれるようになった。\n\n中国は、1970年代の終わりから沿海部の都市に経済特区を設け、外国の企業を招いて工業化を進めた。豊富で賃金の安い労働力を生かして大量の工業製品をつくり、世界各地へ輸出するようになったことから、「世界の工場」とよばれる。ただし、発展した沿海部と内陸部とのあいだで収入の差が大きくなったことや、大気汚染などの環境問題が深刻になったことが課題となっている。\n\nインドでは、情報通信技術（ICT）産業が急成長している。英語を話せる人が多く、数学などの教育に力を入れてきたことに加え、アメリカとのあいだにほぼ半日の時差があるため、アメリカが夜のあいだにインドで仕事を引きつげるという利点もある。南部の都市ベンガルールには、関連する企業が多く集まっている。また、東南アジアの国々は東南アジア諸国連合（ASEAN）をつくって結びつきを強め、西アジアのペルシア湾岸は世界有数の石油の産出地となっている。\n\n米を育てる水田の風景と、高層ビルが立ち並ぶ大都市。アジアでは、その両方が隣り合っている。私たちが身の回りで使う衣類や電化製品にも、アジアの国々でつくられたものが少なくない。製品についている表示を見てみると、成長するアジアと日本との深い結びつきが見えてくるはずだ。"},{"id":"m4c04","title":"国境をこえて一つに","kind":"地理","points":["二度の世界大戦への反省などからECがつくられ、1993年にEUへと発展し、人・もの・お金の行き来が自由になった。","共通通貨ユーロの導入などで統合が進む一方、加盟国間の経済格差やイギリスの離脱などの課題も生まれている。","ヨーロッパでは、気候に合わせて地中海式農業・混合農業・酪農が行われ、フランスはEU最大の農業国である。"],"body":"ヨーロッパのある国から隣の国へ、車で国境をこえる。多くの場合、検問所で止められることはなく、道路標識の言葉が変わったことで、ようやく国が変わったと気づく。財布の中のお金も、両替せずにそのまま使えることが多い。これは、ヨーロッパの多くの国々がつくるEU（ヨーロッパ連合）の中で見られる光景だ。\n\nヨーロッパの国々が手を結ぶようになったきっかけの一つは、20世紀に二度の世界大戦の戦場となったことへの反省だった。二度と争わないために、また、アメリカなどの大国に対抗できる力をもつために、国々は経済を中心に協力を深めていった。1967年にはEC（ヨーロッパ共同体）が生まれ、1993年にはこれが発展してEUとなった。\n\nEUの中では、加盟国のあいだで人やもの、お金が自由に行き来できる。多くの加盟国のあいだでは、国境でパスポートを見せる必要がなく、加盟国どうしの貿易では輸入品に関税がかからない。2002年からは共通の通貨であるユーロの紙幣と硬貨が使われはじめ、現在は多くの加盟国で導入されている。国境をこえて通勤したり、ほかの国の大学で学んだりすることも、めずらしくなくなった。\n\nしかし、統合には課題もある。その一つが、加盟国のあいだの経済の格差だ。2000年代に東ヨーロッパの国々が次々と加盟すると、西ヨーロッパとの賃金の差が目立つようになった。より高い収入を求めて東から西へ働きに出る人が増える一方、人件費の安い東ヨーロッパへ工場を移す企業も現れた。また、ほかの地域から多くの移民や難民がやってきて、その受け入れ方をめぐって国々の考え方が分かれることもある。2020年には、イギリスが国民投票の結果を受けてEUから離脱した。\n\nヨーロッパの農業は、気候に合わせて大きく三つの型に分けられる。夏に雨が少ない地中海沿岸では、夏に乾燥に強いオリーブやぶどう、オレンジなどを育て、雨の多い冬に小麦をつくる地中海式農業が行われている。フランスからドイツ、東ヨーロッパにかけての平野では、小麦やライ麦などの穀物や家畜のえさとなる作物の栽培と、豚や牛の飼育を組み合わせた混合農業がさかんだ。夏でもすずしく穀物が育ちにくい北海沿岸やアルプス山脈の周辺では、乳牛を飼ってバターやチーズをつくる酪農が中心である。\n\nなかでもフランスはEU最大の農業国で、小麦を大量に生産して世界各地へ輸出している。広い平野と温和な気候にめぐまれていることが、その農業を支えている。\n\n国境をこえて協力するEUの試みは、いまも課題と向き合いながら続いている。チーズやワイン、オリーブオイルなど、日本の食卓にも並ぶヨーロッパの産物の背景には、それぞれの土地の気候と、国々が結びついてきた歴史があるのだ。"},{"id":"m4c05","title":"カカオの国の悩み","kind":"地理","points":["19世紀の終わりから20世紀の初めにかけて、アフリカのほとんどはヨーロッパの国々の植民地とされた。","特定の農産物や鉱産資源の輸出にたよる経済をモノカルチャー経済といい、植民地時代のしくみの影響を受けている。","モノカルチャー経済は国際価格の変動で収入が不安定になりやすく、AUやフェアトレードなどの取り組みが進む。"],"body":"チョコレートの原料であるカカオ豆。その生産量が世界で最も多いのは西アフリカのコートジボワールで、隣のガーナも世界有数の産地だ。日本が輸入するカカオ豆の多くも、ガーナから運ばれてくる。ところが、カカオを育てる農家の中には、完成したチョコレートを食べたことがない人も少なくないという。この不思議な関係の背景には、アフリカがたどってきた歴史がある。\n\nアフリカは、赤道をはさんで南北に広がる大陸である。赤道付近には熱帯雨林、その周りにはサバナとよばれる草原、さらに外側には世界最大のサハラ砂漠などの乾燥した地域が広がる。この大陸には、古くから多くの民族が、それぞれの文化をもって暮らしてきた。\n\nしかし16世紀ごろから、多くのアフリカの人々が、ヨーロッパの人々によって奴隷として南北アメリカ大陸へ連れ去られた。19世紀の終わりから20世紀の初めにかけては、アフリカのほとんどの地域がヨーロッパの国々に分割され、植民地とされた。いまのアフリカの地図を見ると、まっすぐな国境線が多いことに気づく。これは、ヨーロッパの国々が緯線や経線などを利用して境界を引いたなごりで、民族の住む範囲とは関係なく引かれたものも多い。現在も英語やフランス語などを公用語とする国が多いのも、植民地支配の影響である。\n\n植民地の時代、ヨーロッパの国々は、自分たちに必要な作物を大規模な農園（プランテーション）で栽培させ、金やダイヤモンド、銅などの鉱産資源を掘り出した。その結果、多くの地域で、限られた作物や資源を生産して輸出するしくみがつくられた。\n\n第二次世界大戦後、アフリカの国々は次々と独立した。特に17か国が独立した1960年は、「アフリカの年」とよばれる。しかし独立後も、多くの国で、特定の農産物や鉱産資源の輸出にたよる経済が続いた。このような経済をモノカルチャー経済という。ガーナやコートジボワールのカカオ豆、ケニアの茶、ザンビアの銅、ナイジェリアの原油などがその例だ。\n\nモノカルチャー経済には大きな弱点がある。農産物や鉱産資源の国際的な価格は、天候や世界の景気によって大きく上がり下がりする。輸出品が一つにかたよっていると、その価格が下がったとき、国の収入が一気に減ってしまうのだ。たとえば、ある国の輸出の大半をカカオ豆がしめていたとすると、カカオ豆の値下がりは、その国の人々の暮らし全体に打撃をあたえることになる。\n\nこうした課題に対して、アフリカの国々は2002年にアフリカ連合（AU）をつくり、地域の協力を進めている。また、生産者の生活を支えるため、農産物を適正な価格で取り引きするフェアトレードの取り組みも広がっている。私たちが手に取る一枚のチョコレートも、遠いアフリカの歴史や経済と結びついているのだ。"},{"id":"m4c06","title":"海をわたった人々の大陸","kind":"地理","points":["南北アメリカ州とオセアニア州には、先住民と、ヨーロッパやアフリカ、アジアなどから来た人々の子孫が暮らす。","南アメリカのアマゾン川流域では、開発のために熱帯林の伐採が進み、開発と環境保護の両立が課題となっている。","オーストラリアは白豪主義をやめて多文化社会を目指し、鉄鉱石や石炭の輸出などでアジアとの結びつきを強めている。"],"body":"南北アメリカ州とオセアニア州には、一つの共通点がある。もともと先住民が暮らしていた土地にヨーロッパの人々が進出し、その後、海の向こうから多くの人々が移り住んで、新しい社会がつくられてきたことだ。そのため、どちらの州にも、さまざまなルーツをもつ人々が暮らしている。\n\n北アメリカのアメリカ合衆国には、先住民のほか、ヨーロッパから移り住んだ人々、かつてアフリカから奴隷として連れてこられた人々の子孫、アジアからの移民などが暮らしている。近年は、メキシコや中央アメリカ、西インド諸島などから移り住んだ、スペイン語を話すヒスパニックとよばれる人々が増えている。広い国土では、地域の気候や土地に合った作物を大型機械で大規模に育てる農業が行われ、小麦やとうもろこし、大豆などが世界中に輸出されている。\n\n南アメリカでは、16世紀にスペインやポルトガルが進出し、植民地とした。そのため現在も、ブラジルではポルトガル語が、ほかの多くの国ではスペイン語が公用語になっている。先住民とヨーロッパ系の人々との混血の人々も多い。20世紀の初めからは、日本からもブラジルなどへ多くの人が移住し、いまも日系人の社会が築かれている。\n\n南アメリカで大きな課題となっているのが、開発と環境の両立だ。アマゾン川の流域には世界最大級の熱帯林が広がるが、道路や鉱山の開発、牧場や大豆畑をつくるための開墾によって、広い範囲で森林が伐採されてきた。熱帯林は多くの生き物のすみかであり、二酸化炭素を吸収して地球温暖化をおさえる役割ももつ。ブラジルでは、さとうきびなどから自動車の燃料となるバイオ燃料もつくられているが、原料の畑を広げるための開発が環境に与える影響も心配されている。\n\nオセアニア州のオーストラリアには、古くから先住民のアボリジニが暮らしていた。18世紀の終わりからイギリスの植民地となり、移り住んだのはおもにヨーロッパ系の人々だった。20世紀には、ヨーロッパ系以外の移民を制限する白豪主義という政策がとられたが、1970年代に廃止された。それ以降はアジアなどからの移民が増え、さまざまな文化を尊重しあう多文化社会を目指している。ニュージーランドでも、先住民であるマオリの文化が大切に受けつがれている。\n\nオーストラリアとアジアの結びつきは、貿易にもはっきり表れている。かつて最大の貿易相手国はイギリスだったが、現在は中国や日本などアジアの国々が中心だ。北西部でとれる鉄鉱石や東部でとれる石炭は、地表を直接けずりとる露天掘りで大量に掘り出され、日本にも多く輸出されている。日本でつくられる鉄の原料の多くは、オーストラリアから運ばれてくるのだ。\n\n太平洋に面したアメリカ合衆国やカナダ、オーストラリアなどは、アジアの国々とともにアジア太平洋経済協力（APEC）に参加し、結びつきを深めている。多様な人々が暮らし、資源や食料を通じて日本ともつながる南北アメリカ州とオセアニア州は、決して遠い世界ではない。"},{"id":"m4b09","title":"空から見える円い畑","kind":"産業","points":["アメリカでは、気候や土壌に合った作物をつくる適地適作が行われる。西経100度付近より西は雨が少ない。","大型機械を使い少ない人数で広い農地を経営する企業的な農業で穀物を大量に輸出し、「世界の食料庫」とよばれる。","工業の中心は五大湖周辺から北緯37度以南のサンベルトへ広がり、シリコンバレーでは先端技術産業が発達した。"],"body":"飛行機からアメリカの中央部を見下ろすと、緑や茶色の大きな円が、地面いっぱいに並んでいることがある。円の直径は、数百mにもなる。これはセンターピボット方式とよばれるかんがいの畑で、くみ上げた地下水を、中心を軸に回転する長いスプリンクラーでまいている。円い畑は、アメリカの農業の大きさを物語る風景だ。\n\nアメリカでは、地域の気候や土壌に最も適した作物を選んで大量につくる、適地適作が行われている。国土のほぼ中央を通る西経100度の経線付近を境に、東側は雨が多く、西側は乾燥している。北部の五大湖周辺では、すずしい気候をいかした酪農がさかんだ。中部の平原ではとうもろこしや大豆、小麦が広く栽培され、雨の少ない西部では肉牛の放牧が行われる。温暖な南部では綿花の栽培がさかんで、太平洋岸のカリフォルニア州では、夏に乾燥する気候をいかして果物や野菜がつくられている。\n\nアメリカの農業のもう一つの特色は、企業的な農業である。広大な農地を、大型の機械を使って少ない人数で経営し、効率よく大量に生産する。牛を囲いの中で飼い、穀物などのえさを与えて短期間で太らせるフィードロットも、その一つだ。こうしてつくられたとうもろこしや大豆、小麦は世界各地に輸出され、アメリカは「世界の食料庫」とよばれている。穀物の取り引きでは、穀物メジャーとよばれる巨大な企業が、世界の市場に大きな影響力をもっている。\n\n工業も、資源や地形の条件と深く結びついて発展してきた。19世紀の後半から、五大湖周辺では、近くでとれる石炭や鉄鉱石と、湖や運河を使った水運をいかして鉄鋼業が発達した。ピッツバーグは鉄鋼業、デトロイトは自動車工業の中心地となり、アメリカは世界一の工業国へと成長した。\n\nしかし20世紀の後半になると、日本やヨーロッパの国々との競争がはげしくなり、五大湖周辺の鉄鋼業や自動車工業は伸びなやむようになった。かわって成長したのが、北緯37度より南の温暖な地域、サンベルトである。広い土地が安く手に入り、働く人を集めやすいことから、多くの工場が進出した。航空宇宙産業や石油化学工業、コンピュータなどのエレクトロニクス産業がさかんになっている。\n\nなかでも先端技術産業の中心として知られるのが、太平洋岸のサンフランシスコ近郊にあるシリコンバレーだ。半導体の材料となるシリコンにちなんだ名前で、大学や研究機関と結びつきながら、コンピュータやインターネットに関わる企業が数多く集まっている。世界中から技術者が集まり、新しい製品やサービスが次々と生まれている。\n\n広い土地と多様な気候をいかした農業と、時代に合わせて中心地を移してきた工業。アメリカの産業は、自然の条件と、効率や新しさを追い求める姿勢とが組み合わさって形づくられてきた。食卓の牛肉や大豆製品、手もとの情報機器をたどっていくと、その先にアメリカの広い畑や研究所が見えてくるかもしれない。"},{"id":"m4b10","title":"40年で巨大都市になった町","kind":"産業","points":["中国は1970年代の終わりから改革・開放政策を進め、沿岸部に経済特区を設けて外国の企業を招いた。","豊富で賃金の安い労働力をいかして工業製品を大量に輸出し「世界の工場」となり、GDPは世界第2位になった。","沿岸部と内陸部の経済格差や大気汚染などの環境問題が課題で、西部大開発などの取り組みが進められている。"],"body":"ホンコンのすぐ北に、シェンチェンという都市がある。1970年代の終わりごろまで、このあたりは小さな町や農村、漁村が点在する地域だった。それが今では高層ビルが立ち並び、人口が1000万人をこえる大都市になっている。わずか40年ほどのあいだに、いったい何が起きたのだろうか。\n\n中国は1949年に中華人民共和国が成立してから、国が計画を立てて生産を管理する経済のしくみをとってきた。しかし、経済をさらに発展させるため、1970年代の終わりから、外国の資本や技術を取り入れる改革・開放政策を進めた。その中心となったのが経済特区である。1980年、シェンチェンなど南部の沿岸部の都市が経済特区に指定され、税金を安くするなどして外国の企業を積極的に招いた。\n\n外国の企業が進出した大きな理由は、人口が多く、賃金の安い労働力を豊富に得られたことだ。内陸部の農村からも、多くの人が仕事を求めて沿岸部の工場に集まった。衣類やおもちゃから、テレビやパソコン、スマートフォンまで、さまざまな工業製品が大量に生産され、世界中に輸出されるようになった。こうして中国は「世界の工場」とよばれるようになった。\n\n経済の成長はめざましく、2010年には国内総生産（GDP）が日本をぬいて、アメリカに次ぐ世界第2位となった。人々の所得が増えると、自動車や家電製品を買う人も増え、中国は多くの製品が売れる「世界の市場」としても重要な存在になった。今では、外国から技術を取り入れるだけでなく、中国の企業が自ら新しい製品を開発し、世界に進出するようにもなっている。\n\n一方で、急速な発展はさまざまな課題も生んだ。その一つが、地域による経済格差である。工業が発達した沿岸部の都市と、内陸部の農村とのあいだで、収入に大きな差が生まれた。そこで政府は2000年ごろから西部大開発を進め、内陸部に道路や鉄道、発電所などを整備して、格差を小さくしようとしている。\n\nもう一つの課題は環境問題である。工場や自動車の排出ガス、石炭を燃やす火力発電などによって、大気汚染や水のよごれが深刻になった地域がある。大気中の細かな粒子による汚染は、風に乗って周辺の国々に届くこともある。現在は、太陽光や風力など、環境への負担が少ないエネルギーの利用も進められている。\n\nわずか数十年で「世界の工場」となり、「世界の市場」へとすがたを変えてきた中国。わたしたちの身のまわりにも、中国でつくられた製品がたくさんある。手に取った製品の表示を見てみると、遠く感じる国の経済が、毎日の暮らしと深くつながっていることに気づくだろう。"},{"id":"m4c07","title":"ムラがクニになるまで","kind":"日本史","points":["縄文時代の人々は狩り・漁・採集で暮らし、縄文土器を使い、大きな身分の差はなかったと考えられている。","弥生時代に稲作が広まると、たくわえをめぐって貧富の差や争いが生まれ、各地に小さなクニができた。","3世紀後半から各地に古墳がつくられ、大王を中心とする大和政権が九州から東北地方南部までの豪族を従えた。"],"body":"佐賀県の吉野ヶ里遺跡には、深い堀と木の柵で集落を囲み、物見やぐらを備えた弥生時代のムラのあとが残っている。まるで敵の攻撃に備えたとりでのようだ。しかし、それより前の縄文時代の集落には、このような大がかりな守りはほとんど見られない。そのあいだに、人々の暮らしに何が起きたのだろうか。\n\n縄文時代は、今からおよそ1万数千年前に始まった。人々はたて穴住居に住み、木の実を集めたり、けものを狩ったり、魚や貝をとったりして暮らしていた。表面に縄目のような文様をつけた縄文土器で、食べ物を煮たりたくわえたりした。食べた貝のからなどを捨てた貝塚からは、当時の暮らしぶりがよく分かる。食料は自然の恵みに左右され、たくわえも多くはなかったため、人々のあいだに大きな身分の差はなかったと考えられている。\n\n縄文時代の終わりごろ、大陸から九州北部に稲作が伝わり、やがて東日本にも広がった。こうして始まった時代を弥生時代という。人々は水田で米を育て、石包丁で稲の穂をつみ取り、湿気やねずみを防ぐ高床倉庫に米をたくわえた。うすくてかたい弥生土器が使われ、青銅器や鉄器などの金属器も伝わった。\n\n米は長くたくわえることができる。たくわえができると、豊かな人とそうでない人との差が生まれ、人々を指導する有力者が現れた。また、水田に適した土地や水、たくわえた米をめぐって、ムラとムラが争うようにもなった。争いに勝ったムラは周りのムラを従え、やがて各地に小さなクニができていった。吉野ヶ里遺跡の堀や柵は、こうした争いの時代のようすを物語っている。\n\nこのころの日本のようすは、中国の歴史書に記されている。それによると、1世紀には九州北部にあった奴国の王が漢（後漢）に使いを送り、皇帝から金印を授けられた。江戸時代に福岡県の志賀島で見つかった金印は、このときのものと考えられている。3世紀には、邪馬台国の女王卑弥呼が30ほどの国を従え、魏に使いを送って、「親魏倭王」の称号と金印、銅鏡などを授けられたという。\n\n3世紀の後半になると、各地に古墳とよばれる大きな墓がつくられはじめた。奈良盆地を中心とする地域の豪族たちは、大和政権（ヤマト王権）とよばれる勢力をつくり、その王は大王とよばれた。5世紀には、大和政権は九州地方から東北地方南部までの豪族を従えるようになった。大王や豪族の墓として、円形と方形を組み合わせた前方後円墳が数多くつくられた。大阪府堺市にある大仙古墳（仁徳陵古墳）は、全長が480メートルをこえる日本最大の古墳で、古墳の上や周りには、人や馬、家などをかたどった埴輪が並べられた。また、朝鮮半島などから移り住んだ渡来人は、かたい土器（須恵器）をつくる技術や漢字などを日本に伝えた。\n\n狩りと採集のムラから、稲作をもとにしたクニへ、そして大王を中心とする大きな政権へ。米づくりの始まりは、日本の国の成り立ちを大きく動かしたのである。ふだん何気なく食べているご飯は、日本の歴史の出発点の一つともいえるのだ。"},{"id":"m4c08","title":"荷札が語る奈良の都","kind":"日本史","points":["701年の大宝律令によって律令国家が成立し、人々は口分田をあたえられ、租・調・庸などの税を負担した。","710年に平城京、794年に平安京へ都が移され、平安時代には藤原氏が摂政・関白として摂関政治を行った。","遣唐使の停止のころから、仮名文字が生まれ、『源氏物語』や『枕草子』に代表される国風文化が栄えた。"],"body":"奈良の平城京のあとからは、文字を書いた細長い木の札がたくさん見つかっている。これを木簡という。紙が貴重だった時代、役人たちは木の札に文字を書いて、記録や連絡に使った。その中には、各地から都へ運ばれた品物に付けられた荷札もある。遠くの国から、なぜ都へ品物が届けられたのだろうか。\n\nその答えは、法律にある。7世紀の後半、日本は唐（中国）のしくみにならって、法律にもとづいて国を治める国家をつくろうとした。そして701年、大宝律令が完成する。律は刑罰のきまり、令は政治のしくみや人々が守るべききまりである。こうして、律令にもとづいて政治を行う律令国家が成立した。都には中央の役所が置かれ、地方は国・郡・里に分けられて、国には都から国司が送られた。\n\n人々は戸籍に登録され、6歳以上の男女には口分田があたえられた。口分田は、その人が死ぬと国に返すきまりで、これを班田収授法という。そのかわり、人々には税が課された。稲の収穫の約3％を納める租、地方の特産物を納める調、労役のかわりに布を納める庸などである。調や庸は、農民自身が都まで運ばなければならなかった。木簡の荷札の多くは、こうして各地から集められた税の記録だったのだ。兵役の負担も重く、九州の守りにつく防人に選ばれる者もいた。\n\n710年、都は奈良の平城京に移された。唐の都の長安にならい、道路が碁盤の目のように整えられた都である。この時代を奈良時代という。聖武天皇は、仏教の力で国を守ろうと考え、国ごとに国分寺と国分尼寺を建て、都には東大寺を建てて大仏をつくらせた。\n\n794年、桓武天皇は都を京都の平安京に移した。ここからのおよそ400年を平安時代という。やがて貴族の藤原氏が力を強め、娘を天皇のきさきにして、生まれた子を天皇の位につけた。そして、天皇が幼いときは摂政、成人してからは関白という職について、政治の実権をにぎった。これを摂関政治という。11世紀の前半、藤原道長とその子の頼通のころが、藤原氏の最も栄えた時期である。\n\nこのころ、文化にも大きな変化が起きた。894年、菅原道真の意見によって遣唐使の派遣が停止された。それまでに取り入れた唐の文化をもとにしながら、日本の風土や生活に合った文化が発展した。これを国風文化という。漢字を変形させた仮名文字が生まれ、人々は自分の気持ちを日本語のまま書き表せるようになった。仮名文字を使って、紫式部は『源氏物語』を、清少納言は『枕草子』を書いた。貴族たちは、寝殿造とよばれる広い屋敷で暮らした。\n\n私たちがいま使っているひらがなやカタカナも、この時代に形が整えられていったものだ。法律にもとづいて国を治めるという考え方と、日本語を自由に書き表す文字。どちらも奈良・平安の世に根を張り、今の私たちの暮らしにつながっているのである。"},{"id":"m4c09","title":"いざ鎌倉の約束","kind":"日本史","points":["10世紀ごろ武士が現れ、平氏の政権をへて、源頼朝が守護・地頭を置き、1192年に征夷大将軍となった。","将軍が御家人の領地を守り新しい領地をあたえる御恩と、御家人が命をかけて戦う奉公の関係が幕府を支えた。","1274年と1281年の元寇を退けたが、御家人は十分な恩賞を得られず、幕府への不満が高まった。"],"body":"「いざ鎌倉」という言葉がある。今では「さあ、一大事だ」という意味で使われるが、もとは、幕府に一大事が起これば何をおいても鎌倉へかけつけるという、鎌倉時代の武士の心構えを表す言葉だ。武士たちは、なぜそこまでして鎌倉へ向かったのだろうか。\n\n武士が現れたのは、10世紀ごろのことである。地方では、土地をめぐる争いから身を守るため、豪族や有力な農民が武装するようになった。やがて武士たちは、天皇の子孫である源氏や平氏をかしらとして、大きな武士団にまとまっていった。10世紀の半ばに関東で平将門が、瀬戸内海で藤原純友が反乱を起こしたときも、それをしずめたのは武士の力だった。\n\n12世紀の半ば、朝廷の争いに武士が動員されるようになると、武士の地位は一気に高まった。平清盛は武士として初めて太政大臣となり、平氏の一族が朝廷の高い位をしめた。しかし、平氏の政治への不満が高まると、源頼朝が兵をあげ、弟の源義経らの活躍によって、1185年、平氏は壇ノ浦で滅ぼされた。\n\n頼朝は鎌倉を本拠地とし、1185年、国ごとに守護を、荘園や公領ごとに地頭を置くことを朝廷に認めさせた。1192年には征夷大将軍に任じられ、鎌倉幕府による武士の政治が本格的に始まった。頼朝の死後は、北条氏が執権として幕府の実権をにぎった。\n\n幕府を支えたのが、将軍と御家人とよばれる家来の武士とのあいだの、土地を仲立ちにした主従関係である。将軍は、御家人が先祖から受けついできた領地を保護し、手がらを立てれば新しい領地をあたえた。これを御恩という。御家人はそのかわりに、京都や鎌倉の警備につき、戦いが起これば命をかけて戦った。これを奉公という。「いざ鎌倉」の心構えは、この御恩と奉公の関係から生まれたものなのだ。\n\n13世紀の後半、この関係を大きくゆるがす出来事が起きた。モンゴル帝国のフビライ・ハンは、国号を元と定め、日本にも従うよう求めた。執権の北条時宗がこれを退けると、元は1274年と1281年の二度にわたり、九州北部に大軍を送ってきた。これを元寇という。御家人たちは、元軍の集団戦法や火薬を使った武器に苦しめられながらも、博多湾に石の防壁を築くなどして戦い、元軍は暴風雨などで大きな損害を受けて引きあげた。\n\nしかし元寇は国を守るための戦いで、勝っても新しい領地は手に入らなかった。命がけで奉公した御家人たちは、十分な御恩を受けられなかったのである。さらに、領地を分けて相続するうちに領地は小さくなり、生活に苦しむ御家人が増えた。幕府は1297年に徳政令を出し、御家人が手放した土地をただで取りもどさせようとしたが、効果は一時的だった。御家人の心はしだいに幕府から離れ、後醍醐天皇が幕府をたおそうとすると、足利尊氏ら有力な御家人も加わり、1333年、鎌倉幕府は滅亡した。\n\n土地をめぐる御恩と奉公の約束が武士たちを結びつけ、その約束がゆらいだとき、幕府もゆらいだ。今も使われる「いざ鎌倉」という言葉には、そんな武士の世の約束が刻まれているのだ。"},{"id":"m4c10","title":"鉄砲が変えた戦国の世","kind":"日本史","points":["1467年に始まった応仁の乱で室町幕府の力は弱まり、下剋上の風潮の中で戦国大名が各地を支配した。","1543年に種子島に鉄砲が伝わり、1549年にはザビエルがキリスト教を伝え、南蛮貿易が始まった。","織田信長は鉄砲や楽市・楽座を生かして勢力を広げ、豊臣秀吉が全国を統一して太閤検地と刀狩を行った。"],"body":"1543年、九州の南にある種子島に、一そうの中国船が流れ着いた。乗っていたポルトガル人が持っていたのは、火薬の力で弾を撃ち出す鉄砲だった。島の領主はこれを買い求め、家来に使い方や作り方を学ばせたという。この新しい武器は、やがて日本の歴史を大きく動かしていく。そこに至るまでの流れを、室町時代からたどってみよう。\n\n鎌倉幕府が滅びたあと、足利尊氏は1338年に征夷大将軍となり、京都に幕府を開いた。のちに3代将軍の足利義満が京都の室町に御所を建てたことから、この幕府は室町幕府とよばれる。義満は、南と北に分かれて対立していた朝廷を一つにまとめ、明（中国）との貿易も始めて、幕府の力は最も強まった。\n\nしかし15世紀になると、将軍の力はしだいに弱まっていった。8代将軍の足利義政のあとつぎをめぐる争いに、有力な守護大名である細川氏と山名氏の対立などがからみ、1467年、応仁の乱が起こった。戦いは11年も続き、京都は焼け野原となった。乱のあと、幕府の力は京都の周辺にしかおよばなくなり、戦乱は全国へ広がっていった。\n\nこうして戦国時代が始まった。各地では、家来が主君をたおしたり、身分の低い者が実力で上の者に取ってかわったりする下剋上の風潮が広がった。実力で領国を支配するようになった大名を戦国大名という。戦国大名は城の周りに城下町をつくり、独自のきまり（分国法）を定めて領国を治めた。\n\nちょうどこのころ、ヨーロッパの人々がアジアに進出してきた。鉄砲が伝わってまもない1549年には、イエズス会の宣教師フランシスコ・ザビエルが鹿児島に来て、キリスト教を伝えた。ポルトガル人やスペイン人との貿易も始まり、彼らが南蛮人とよばれたことから、これを南蛮貿易という。日本は鉄砲や火薬、中国産の生糸などを輸入し、おもに銀を輸出した。鉄砲は堺（大阪府）などで大量につくられるようになり、戦い方を大きく変えた。\n\nこの新しい時代をたくみに生かしたのが、尾張（愛知県）の織田信長である。信長は1573年に室町幕府を滅ぼし、1575年の長篠の戦いでは、大量の鉄砲を有効に使って武田勝頼の軍を破った。また、安土城の城下では、市での税を免除し、座の特権をなくす楽市・楽座の政策を行って、自由な商工業をさかんにした。しかし信長は、全国統一を目前にした1582年、家臣の明智光秀にそむかれ、京都の本能寺で自害した。\n\n信長のあとをついだ豊臣秀吉は、1590年に全国を統一した。秀吉は、全国の田畑の広さやよしあしを調べて、とれる米の量を石高で表す太閤検地を行い、百姓から刀や鉄砲などの武器を取り上げる刀狩を進めた。これによって武士と百姓の身分の区別がはっきりした。これを兵農分離という。\n\n種子島に流れ着いた一つの武器が戦い方を変え、天下統一への動きを後押しした。いまも各地に残る城や城下町は、この大きく動いた時代を今に伝えているのだ。"},{"id":"m4a08","title":"大河が育てた最初の文明","kind":"世界史","points":["農耕や牧畜が始まり、大河の流域で食料が豊かになると、王が治める国が生まれ、文字や金属器を使う文明がおこった。","エジプトではピラミッドや象形文字、太陽暦が、メソポタミアではくさび形文字や太陰暦、60進法が生まれた。","インダス川流域には計画的な都市モヘンジョ・ダロがつくられ、中国の殷では甲骨文字が使われた。"],"body":"世界地図を広げて、古代の文明がおこった場所に印をつけてみると、ふしぎな共通点が見えてくる。アフリカのナイル川、西アジアのチグリス川とユーフラテス川、南アジアのインダス川、東アジアの黄河と長江。どの文明も、大きな川のほとりで生まれているのだ。なぜ人々は大河のそばで文明を築いたのだろうか。\n\n今から約1万年前に氷河時代が終わると、人々は麦や稲などを育てる農耕や、羊や牛などを飼う牧畜を始め、一つの場所に住みつくようになった。川の近くは水が得やすく、洪水が運んでくる土は作物をよく育てる。食料が豊かになると人口が増え、畑に水を引いたり洪水を防いだりする工事のために、多くの人をまとめる指導者が現れた。やがて身分の差が生まれ、王が治める国ができた。文字や青銅器などの金属器も使われるようになった。こうして文明がおこったのである。\n\nエジプトでは、紀元前3000年ごろにナイル川の流域を治める統一国家が生まれた。ナイル川は毎年決まった時期に増水する。その時期を知るために天文学が発達し、1年を365日とする太陽暦がつくられた。王の墓といわれる巨大なピラミッドが築かれ、象形文字（神聖文字）が使われた。\n\nチグリス川とユーフラテス川の流域は、メソポタミアとよばれる。「川の間の土地」という意味だ。ここでは紀元前3000年ごろまでにいくつもの都市国家が生まれ、粘土板にくさび形文字が刻まれた。月の満ち欠けをもとにした太陰暦や、60を一区切りとして数える60進法も考え出された。1時間を60分、1分を60秒とする数え方は、この60進法がもとになっている。紀元前18世紀ごろには、ハンムラビ王が法典を定めて国を治めた。\n\nインダス川の流域では、紀元前2500年ごろからインダス文明が栄えた。中心都市の一つモヘンジョ・ダロは、れんがでつくられた計画的な都市で、道路が碁盤の目のように整えられ、下水道や大きな浴場もあった。ここで使われたインダス文字は、今もまだ解読されていない。\n\n中国では、黄河の流域であわやきびが、長江の流域で稲が栽培され、早くから農耕が営まれていた。紀元前16世紀ごろには、黄河の流域に殷という国がおこった。殷では、亀の甲や牛などの骨に占いの結果を刻んだ甲骨文字が使われ、これが今の漢字のもとになった。祭りには、すぐれた青銅器が用いられた。\n\n大河、農耕、王、文字、暦。エジプト、メソポタミア、インダス、中国の四つの文明は、まとめて四大文明とよばれることもあり、多くの共通点をもっている。そして、そこで生まれたものの一部は、形を変えながら今の暮らしにも受けつがれている。カレンダーの1年、時計の60分、毎日書いている漢字。身近なものの始まりをたどると、何千年も前の川のほとりに行き着くのである。"},{"id":"m4a09","title":"広場の政治と三つの宗教","kind":"世界史","points":["ギリシャのアテネでは成年男子の市民が民会で話し合う民主政が行われ、ローマは地中海の周辺を統一した。","仏教は紀元前5世紀ごろインドでシャカが開き、キリスト教は紀元前後に生まれたイエスの教えから始まった。","イスラム教は7世紀にアラビア半島でムハンマドが開き、唯一の神アラーを信じ、経典はコーランである。"],"body":"町の広場に大勢の市民が集まっている。戦争をするかどうか、新しいきまりをどうするか。人々は意見を述べ合い、最後は多数決で決める。今から2500年ほど前、ギリシャのアテネで見られた光景である。\n\nギリシャでは紀元前8世紀ごろから、アテネやスパルタなど多くの都市国家（ポリス）が生まれた。アテネでは、成年男子の市民全員が参加する民会を中心に政治を行う民主政が行われた。ただし、女性や奴隷などは政治に参加できず、今の民主主義とは違いもあった。ギリシャではパルテノン神殿などの建築や演劇、哲学や数学が発達した。この文化は、紀元前4世紀に東方へ遠征したアレクサンドロス大王によって広い地域に伝えられた。\n\nイタリア半島の都市国家だったローマは、紀元前6世紀末に王を追放して、貴族が中心となる共和政を始めた。やがて地中海の周辺を統一し、紀元前1世紀の終わりには皇帝が治める帝政となった。ローマは各地に道路や水道を整え、コロッセオとよばれる円形闘技場を建てた。ローマで整えられた法律は、のちのヨーロッパの法の手本となった。\n\n古代には、人々の心の支えとなる宗教も生まれ、やがて国や民族をこえて広がっていった。紀元前5世紀ごろ、インドに生まれたシャカは、人は修行を積んで悟りを開けば、生きる苦しみから救われると説いた。この教えが仏教である。仏教はインドから東南アジアや中国、朝鮮半島へと伝わり、6世紀には日本にも伝えられた。\n\nキリスト教は、紀元前後にパレスチナに生まれたイエスの教えから始まった。イエスはユダヤ教をもとに、神の前ではだれもが平等であり、神の愛を信じる者は救われると説いた。イエスは十字架にかけられて処刑されたが、弟子たちがその教えを広め、のちに教えは「新約聖書」にまとめられた。ローマ帝国は初めキリスト教を迫害したが、4世紀末には国の宗教とし、キリスト教はヨーロッパ各地に広がった。\n\n7世紀の初めには、アラビア半島のメッカの商人だったムハンマドが、唯一の神アラーのことばを授かったとして、イスラム教を開いた
