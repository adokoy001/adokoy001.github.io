<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>〇〇県✕✕村 午前二時・リエゾン</title>
<meta name="description" content="夜の山道を、ラリーカーで回転を上げずに流す。崖の下の街では、とてつもなく大きな何かが動いている。">
<style>
/* 画面いっぱいの映像が1枚。操作は右下の小さなボタンだけ。夜の操縦席の見た目に固定（暗い一色）。 */
:root{
  --bg:#000; --fg:#e8e6dc; --ui:#d8d8cc; --ui-bg:rgba(8,10,8,.5); --ui-line:rgba(216,216,204,.28); --focus:#ffd98a;
  --font:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg);touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#ui{position:fixed;display:flex;gap:10px;transition:opacity .6s;
  right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#ui.idle{opacity:.12}
#ui button{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%;cursor:pointer;
  background:var(--ui-bg);color:var(--ui);border:1px solid var(--ui-line)}
#ui button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#ui button[aria-pressed="true"]{color:var(--focus);border-color:var(--focus)}
#ui svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
#msg{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;max-width:calc(100% - 32px);bottom:calc(66px + env(safe-area-inset-bottom,0px));
  padding:7px 12px;border-radius:6px;background:var(--ui-bg);border:1px solid var(--ui-line);color:var(--ui);font-size:13px;line-height:1.5;text-align:center;pointer-events:none}
#nogl{position:fixed;inset:0;display:grid;place-items:center;text-align:center;line-height:1.8;font-size:15px;
  padding-inline:max(16px,env(safe-area-inset-left,0px))}
</style>
</head>
<body>


<canvas id="c" aria-label="夜の山道を流すラリーカーの、運転席からの眺め。ドラッグで見回せます"></canvas>
<p id="nogl" hidden>この端末では WebGL が使えないため、映像を表示できません。</p>
<p id="msg" role="status" hidden></p>
<div id="ui">
  <button id="bg" type="button" aria-pressed="false" aria-label="端末の向きで見回す" title="ジャイロ" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="5" width="7" height="14" rx="1.6"/><path d="M4.5 9.5a8 8 0 0 0 0 5M19.5 9.5a8 8 0 0 1 0 5M3 8l1.5 1.5L6.2 8.2M21 16l-1.5-1.5-1.7 1.3"/></svg>
  </button>
  <button id="bs" type="button" aria-pressed="false" aria-label="音" title="音">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z"/><path id="bs1" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.4 7.4 0 0 1 0 10.4"/><path id="bs0" d="M16 9.5l5 5m0-5l-5 5"/></svg>
  </button>
  <button id="bf" type="button" aria-pressed="false" aria-label="全画面" title="全画面">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
  </button>
  <button id="bl" type="button" aria-pressed="false" aria-label="軽量モード" title="軽量モード">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C5 10 10 5 19 5c0 9-5 14-14 14zM5 19l8-8"/></svg>
  </button>
</div>

<script>
/*! sasayaki.js v2 — 囁き声の合成エンジン（依存なし・外部通信なし）
 *
 * 雑音を、時間で動く母音の共鳴に通して囁き声を作る。音声ファイルは使わない。
 * 単一HTMLの作品には、このファイルの中身を <script> にそのまま貼る。
 *
 *   const sas = Sasayaki.create(ac, { out: master, voice: 'shojo' });   // ac は AudioContext
 *   sas.add(Sasayaki.PHRASES);                            // 意味のない10句を少しずつ焼く
 *   sas.say();                                            // どれかを、どれかの鳴り方で
 *   sas.say('near', { text: 'ほさな', voice: 'rojin' });  // 句・鳴り方・声を指定
 *   sas.auto(15, 34);                                     // 15〜34秒おきに勝手に囁く
 *
 * 句の書き方：ひらがな・カタカナ、またはローマ字の音節を空白で区切る（'ho sa na'）。
 *   「、」「。」と '_' は間、「っ」は短い詰まり、「ー」は母音を伸ばす、「ん」は鼻音。
 *   囁きには声帯の振動がないので、濁音は清音と同じ音になる（が→か、ざ→さ、だ→た、ば→ぱ）。
 * 鳴り方：'far' 遠くから長いこだまで ／ 'canon' 別の声が遅れて重なる ／ 'rev' 逆再生 ／ 'near' 耳元で乾いたまま
 * 声：Sasayaki.VOICES の名前（otoko, onna, shonen, shojo, osanago, rojin, roba, ookii）か、
 *   { scale, speed, breath, bright, tremor } を直接渡す。
 * 軽量モード：create と render に lite: true。合成を 22.05kHz・共鳴3本にし、畳み込みの残響を短い遅延の輪に替える。
 */
(function (root) {
'use strict';
const SR = 32000, SR_LITE = 22050;
// 母音の共鳴 F1,F2,F3（Hz）。大人の男性の囁きを基準にした値。N は「ん」
const VOW = { a:[850,1400,2800], i:[330,2500,3250], u:[390,1500,2650], e:[560,2050,2850], o:[530,960,2750], N:[300,1300,2500] };
// 子音の雑音：[中心周波数, Q, 長さ(秒), 強さ]
const FRIC = { s:[6400,1.4,.10,.34], sh:[3300,2,.11,.4], ch:[3300,2,.07,.45], ts:[5600,1.6,.06,.4], f:[4800,.7,.08,.16],
               k:[2000,3.5,.028,.7], t:[4700,1.6,.02,.55], p:[900,1.5,.016,.5] };
const STOP = { k:1, t:1, p:1, ch:1, ts:1 };
const ALIAS = { g:'k', z:'s', d:'t', b:'p', j:'ch', c:'k', l:'r', v:'f' };
/* 声。囁きには声の高さがないので、年齢と性別は主に共鳴の位置（声道の長さ）で決まる。
   scale  共鳴全体の倍率。声道が短いほど大きい   speed  話す速さ
   breath 息のゆらぎ（大きいほど荒れる）          bright 高い共鳴の強さ   tremor 震え（約5.5Hz） */
const VOICES = {
  otoko:   { label:'男',       scale:1.00, speed:.95, breath:1,   bright:.85, tremor:0 },
  onna:    { label:'女',       scale:1.16, speed:1,   breath:1,   bright:1.1, tremor:0 },
  shonen:  { label:'男の子',   scale:1.29, speed:1.05,breath:1.1, bright:1,   tremor:0 },
  shojo:   { label:'女の子',   scale:1.35, speed:1.05,breath:1,   bright:1.2, tremor:0 },
  osanago: { label:'幼い子',   scale:1.46, speed:.88, breath:1.3, bright:1.15,tremor:0 },
  rojin:   { label:'老人',     scale:.97,  speed:.78, breath:2.4, bright:.8,  tremor:.3 },
  roba:    { label:'老女',     scale:1.12, speed:.8,  breath:2.2, bright:.95, tremor:.28 },
  ookii:   { label:'大きなもの', scale:.8, speed:.72, breath:1.6, bright:.7,  tremor:.08 }
};
const PHRASES = ['ho sa na','ki he to ne','su mi ha e','to ko shi no _ ha ne','ha ne i so',
                 'ke su ra _ ke su ra','shi na ho e to','mo i ka su ne','he e _ so no ha','chi ra to mo e'];
const KANA = {};
('あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno ' +
 'はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をo んN ' +
 'がka ぎki ぐku げke ごko ざsa じchi ずsu ぜse ぞso だta ぢchi づtsu でte どto ばpa びpi ぶpu べpe ぼpo ぱpa ぴpi ぷpu ぺpe ぽpo ' +
 'ぁa ぃi ぅu ぇe ぉo').split(' ').forEach(p => { KANA[p[0]] = p.slice(1); });
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const PKEYS = ['scale', 'speed', 'breath', 'bright', 'tremor'];
// 声の指定をまとめる。優先順は 個別の数値 ＞ voice ＞ 既定（女）
function voiceOf(opt, base) {
  opt = opt || {};
  const pick = v => typeof v === 'string' ? VOICES[v] : v;
  const o = Object.assign({ scale: 1.16, speed: 1, breath: 1, bright: 1, tremor: 0 }, pick(base), pick(opt.voice));
  for (const k of PKEYS) if (opt[k] != null) o[k] = +opt[k];
  delete o.label;
  return o;
}

// 句を音節の列にする
function parse(text) {
  let s = String(text).replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  if (/[ぁ-ゖー]/.test(s)) {
    const out = [];
    for (const ch of s) {
      if (KANA[ch]) out.push(KANA[ch]);
      else if ('ゃゅょ'.includes(ch) && out.length) {
        const c = out[out.length - 1].slice(0, -1), y = { 'ゃ':'a', 'ゅ':'u', 'ょ':'o' }[ch];
        out[out.length - 1] = (c === 'sh' || c === 'ch' ? c : c + 'y') + y;
      }
      else if (ch === 'っ') out.push('.');
      else if (ch === 'ー' && out.length) { const p = out[out.length - 1]; if (/[aiueo]$/.test(p)) out.push(p.slice(-1)); }
      else if (/[\s、。,.!?！？…_]/.test(ch)) out.push('_');
    }
    s = out.join(' ');
  }
  return s.trim().split(/\s+/).map(tok => {
    if (tok === '_') return { p: 1 };
    if (tok === '.') return { p: .25 };
    if (tok === 'N' || tok === 'n') return { c: '', g: '', v: 'N' };
    tok = tok.toLowerCase();
    let v = tok.slice(-1), c = tok.slice(0, -1), g = '';
    if (!VOW[v]) return null;
    if (c.length > 1 && c.endsWith('y')) { g = 'y'; c = c.slice(0, -1); }
    else if (c === 'y' || c === 'w') { g = c; c = ''; }
    c = ALIAS[c] || c;
    return { c, g, v };
  }).filter(Boolean);
}

/* 句を合成して Float32Array（モノラル・ピーク0.9）で返す。AudioContext は要らない。
   返り値の sampleRate に標本化周波数が入る（通常 32000、軽量 22050）。
   opt.voice  声の名前か { scale, speed, breath, bright, tremor }。個別に opt.scale なども渡せる
   opt.lite   軽量モード
   opt.rand   乱数の関数（既定 Math.random）。種つきの乱数を渡すと毎回同じ波形になる */
function render(text, opt) {
  opt = opt || {};
  const V = voiceOf(opt), lite = !!opt.lite, sr = lite ? SR_LITE : SR, step = lite ? 16 : 8;
  const scale = V.scale, sp = 1 / V.speed, br = V.bright;
  const R = opt.rand || Math.random, rnd = (a, b) => a + R() * (b - a);
  const sy = parse(text);
  if (!sy.some(x => x.v)) { const z = new Float32Array(1); z.sampleRate = sr; return z; }
  // 制御点：[時刻, F1, F2, F3, 母音の強さ, 子音の強さ, 子音の中心, 子音のQ]
  const K = []; let tt = 0, cur = VOW.a, fc = 4000, fq = 1;
  const k = (dt, f, av, af) => { tt += dt * sp; cur = f; K.push([tt, f[0], f[1], f[2], av, af, fc, fq]); };
  K.push([0, cur[0], cur[1], cur[2], 0, 0, fc, fq]); k(.03, cur, 0, 0);
  sy.forEach((s, n) => {
    if (s.p) { k(.07, cur, 0, 0); k(s.p * rnd(.2, .38), cur, 0, 0); return; }
    const v = VOW[s.v], c = s.c, last = n === sy.length - 1 || !!sy[n + 1].p;
    const st = rnd(.7, 1) * (s.v === 'N' ? .3 : 1);
    const mix = v.map((x, j) => x * .6 + [420, 1800, 2700][j] * .4), F = FRIC[c];
    if (F) {
      fc = F[0]; fq = F[1];
      if (STOP[c]) { k(.03, mix, 0, 0); k(.045, mix, 0, 0); k(.004, mix, 0, F[3]); k(F[2], mix, .1, F[3] * .8); k(.02, v, st * .6, 0); }
      else { k(.03, mix, .04, 0); k(.02, mix, 0, F[3]); k(F[2], mix, 0, F[3]); k(.03, v, st * .5, 0); }
    }
    else if (c === 'h') { k(.03, v, .12, 0); k(.07, v, .4 * st, 0); }
    else if (c === 'n' || c === 'm') { const nf = [300, c === 'n' ? 1500 : 1050, 2500]; k(.03, nf, .16, 0); k(.055, nf, .2, 0); k(.035, v, st * .7, 0); }
    else if (c === 'r') { k(.025, [v[0] * .8, v[1], 1900], .22, 0); k(.03, v, st * .7, 0); }
    else if (!s.g) k(.04, v, st * .6, 0);
    if (s.g) { const gv = s.g === 'y' ? VOW.i : VOW.u; k(.03, gv, st * .45, 0); k(.04, gv, st * .6, 0); k(.06, v, st * .9, 0); }
    k(.03, v, st, 0);
    k(rnd(.07, .12) * (last ? 1.7 : 1), v, st * .85, 0);
    k(last ? .17 : .04, v, last ? 0 : .3 * st, 0);
  });
  k(.06, cur, 0, 0);
  const N = Math.ceil(tt * sr), o = new Float32Array(N);
  // 状態変数フィルタ（帯域通過、山の高さ1）
  const flt = () => ({ a: 0, b: 0, k: 1, a1: 0, a2: 0, a3: 0 });
  const set = (F, f, q) => { const g = Math.tan(Math.PI * Math.min(f, sr * .45) / sr); F.k = 1 / q; F.a1 = 1 / (1 + g * (g + F.k)); F.a2 = g * F.a1; F.a3 = g * F.a2; };
  const run = (F, x) => { const v3 = x - F.b, v1 = F.a1 * F.a + F.a2 * v3, v2 = F.b + F.a2 * F.a + F.a3 * v3; F.a = 2 * v1 - F.a; F.b = 2 * v2 - F.b; return v1 * F.k; };
  const f1 = flt(), f2 = flt(), f3 = flt(), f4 = flt(), ff = flt();
  const sm = 1 - Math.exp(-step / sr / .004), flc = .006 * SR / sr, g1 = .75 / Math.sqrt(br), g3 = .6 * br, g4 = .25 * br, gh = .03 * br;
  const trem = V.tremor, tph = R() * 6.28, mask = step - 1;
  let ki = 0, c1 = K[0][1], c2 = K[0][2], c3 = K[0][3], av = 0, af = 0, fl = 0, prev = 0, pk = 1e-6;
  if (!lite) set(f4, 3900 * scale, 8);
  for (let i = 0; i < N; i++) {
    if ((i & mask) === 0) {
      const x = i / sr; while (ki < K.length - 2 && K[ki + 1][0] <= x) ki++;
      const A = K[ki], B = K[ki + 1], u = clamp((x - A[0]) / (B[0] - A[0] || 1), 0, 1), L = j => A[j] + (B[j] - A[j]) * u;
      c1 += (L(1) - c1) * sm; c2 += (L(2) - c2) * sm; c3 += (L(3) - c3) * sm; af = L(5);
      av = L(4) * (trem ? 1 + trem * Math.sin(x * 34.6 + tph + 2 * Math.sin(x * 3.1)) : 1);
      set(f1, c1 * scale, 4.5); set(f2, c2 * scale, 8); set(f3, c3 * scale, 9); set(ff, L(6) * scale, L(7));
    }
    const w = R() * 2 - 1;
    fl += ((R() * 2 - 1) - fl) * flc;
    const x = w * (1 + fl * 5 * V.breath);
    let s = run(f1, x) * g1 + run(f2, x) + run(f3, x) * g3;
    if (!lite) { s += run(f4, x) * g4 + (w - prev) * gh; prev = w; }
    s = av * s + af * run(ff, w);
    o[i] = s; if (Math.abs(s) > pk) pk = Math.abs(s);
  }
  for (let i = 0; i < N; i++) o[i] *= .9 / pk;
  o.sampleRate = sr;
  return o;
}

// 部屋の残響の型（だんだん暗くなる雑音）。ConvolverNode の buffer に入れる
function roomIR(ac, seconds) {
  const sr = ac.sampleRate, sec = seconds || 3.6, L = (sr * sec) | 0, ir = ac.createBuffer(2, L, sr);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c); let lp = 0;
    for (let i = 0; i < L; i++) {
      const x = i / sr, a = .5 - .42 * Math.min(1, x / (sec * .67)); lp += ((Math.random() * 2 - 1) - lp) * a;
      d[i] = x < .018 ? 0 : lp * Math.exp(-x * 6.9 / sec) * (1 + .6 * Math.exp(-x * 14));
    }
  }
  return ir;
}

/* 鳴らす側。こだまと残響を自前で持つ。
   opt.out    出力先の AudioNode（既定 ac.destination）
   opt.room   作品が自分の残響を持っているなら、その入口の AudioNode。渡すと自前の残響は作らない
   opt.level  全体の音量（既定 1）
   opt.voice  句ごとに指定がないときの声（既定は女）。opt.scale なども同じ意味で渡せる
   opt.lite   軽量モード。合成が軽くなり、畳み込みの残響の代わりに短い遅延3本の輪を使う */
function create(ac, opt) {
  opt = opt || {};
  const lite = !!opt.lite, base = voiceOf(opt);
  const gn = v => { const x = ac.createGain(); x.gain.value = v; return x; };
  const biq = (t, f, q) => { const b = ac.createBiquadFilter(); b.type = t; b.frequency.value = f; b.Q.value = q; return b; };
  const pan = v => { if (!ac.createStereoPanner) return gn(1); const p = ac.createStereoPanner(); p.pan.value = v; return p; };
  const bus = gn(opt.level == null ? 1 : opt.level); bus.connect(opt.out || ac.destination);
  let room = opt.room;
  if (!room && !lite) { room = gn(1); const cv = ac.createConvolver(); cv.buffer = roomIR(ac, 3.6); const rw = gn(.5); room.connect(cv); cv.connect(rw); rw.connect(bus); }
  if (!room && lite) {
    room = gn(1); const lp = biq('lowpass', 2400, .5), fb = gn(.27), rw = gn(.45); lp.connect(fb); rw.connect(bus);
    [[.061, -.5], [.089, .5], [.127, 0]].forEach(([t, p]) => { const d = ac.createDelay(.5); d.delayTime.value = t; const pp = pan(p);
      room.connect(d); fb.connect(d); d.connect(lp); d.connect(pp); pp.connect(rw); });
  }
  // 長いこだま：0.73秒と1.13秒が左右を行き来し、戻るたびに暗くなる
  const echoIn = gn(1), d1 = ac.createDelay(2), d2 = ac.createDelay(2);
  d1.delayTime.value = .73; d2.delayTime.value = 1.13;
  const l1 = biq('lowpass', 2300, .5), l2 = biq('lowpass', 2300, .5), h1 = biq('highpass', 350, .5), fb1 = gn(.44), fb2 = gn(.44);
  echoIn.connect(d1); d1.connect(l1); l1.connect(h1); h1.connect(fb1); fb1.connect(d2); d2.connect(l2); l2.connect(fb2); fb2.connect(d1);
  const p1 = pan(-.8), p2 = pan(.8), eo = gn(.7), er = gn(.35);
  l1.connect(p1); l2.connect(p2); p1.connect(eo); p2.connect(eo); eo.connect(bus); eo.connect(er); er.connect(room);

  const lib = [], cache = {}, queue = [];
  let baking = false, timer = 0, nextAt = 0, dead = false;
  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
  const mk = d => { const b = ac.createBuffer(1, d.length, d.sampleRate); b.getChannelData(0).set(d); return b; };
  function bake(text, o) {
    const V = voiceOf(o, base), key = text + '|' + PKEYS.map(k => V[k]).join(',');
    if (!cache[key]) {
      const t0 = now(), d = render(text, Object.assign({ lite }, V)), f = mk(d);
      let r = null;                                   // 逆再生の分は、最初に使うときに作る
      cache[key] = { text, f, get r() { return r || (r = mk(Object.assign(d.slice().reverse(), { sampleRate: d.sampleRate }))); } };
      api.lastBake = { ms: now() - t0, seconds: d.length / d.sampleRate };
    }
    return cache[key];
  }

  const dx=-(cA*sG+sA*sB*cG),dy=-(sA*sG-cA*sB*cG),dz=-cB*cG,hz=Math.hypot(dx,dy);

    // 画面がどちら向きに回っているか。window.orientation（左へ倒すと90、右へ倒すと-90）を先に見る。こちらは、端末の向きの値と組み合わせる決まりが古くから定まっている
    const oa=typeof window.orientation==='number'?window.orientation:(screen.orientation&&screen.orientation.angle)||0,o=oa*D2R,ex=Math.sin(o),ey=Math.cos(o);

    const ux=(cA*cG-sA*sB*sG)*ex-sA*cB*ey,uy=(sA*cG+cA*sB*sG)*ex+cA*cB*ey,uz=-cB*sG*ex+sB*ey;

function gyroOff(){G.on=false;removeEventListener('deviceorientation',onOri);S.rollU=Math.atan2(Math.sin(S.rollU),Math.cos(S.rollU));S.lastInput=S.t-3;syncUI()}
let msgT=0;
function say(t){const m=$('msg');m.textContent=t;m.hidden=false;clearTimeout(msgT);msgT=setTimeout(()=>{m.hidden=true},4200)}
function gyroToggle(){
  if(G.on){gyroOff();return}
  const DO=window.DeviceOrientationEvent,ng='端末の向きを読めません。許可されていないか、埋め込みの画面では使えません。',go=()=>{
    G.n=0;G.az0=null;G.off=S.yawU;G.snap=1;addEventListener('deviceorientation',onOri);G.on=true;syncUI();

/* ---------- 出来事 ----------
   追ってくるものは、いない。夜の山道を、回転を上げずに流していくだけ。
   起きるのは、対向車と、雲の中の稲光と、崖の区間でひらける眺め（遠い街と、暗い海）。
   遠くに何がいても、こちらには来ない。運転している人の目が、ときどきそちらへ行くだけ。 */
const MIR_YAW=Math.atan2(-.25,.5),MIR_PIT=Math.atan2(.155+YO,Math.hypot(.25,.5))-.055;
function mirLook(on,tau){if(on){if(G.on)return;S.yawAT=MIR_YAW;S.pitAT=MIR_PIT+.13*clamp((1-ASP)*2,0,1);S.zoomT=1.42;S.yawTau=tau||.4}else{S.yawAT=0;S.pitAT=0;S.zoomT=1}}
function startBeat(type,o){S.beat=Object.assign({type,t:0},o);S.lastBeat=type;S.nBeats++}
function endBeat(){S.beat=null;S.bm=1;S.yawAT=0;S.pitAT=0;S.zoomT=1;S.yawTau=.8}
function director(dt){if(S.fear>0)S.fear=Math.max(0,S.fear-dt*.035)}
/* 呆然：爆風のあと3秒あまり、目がふらふらと泳ぐ（左右にゆっくり大きく、上下に小さく。はじめは速く、だんだん落ちつく）。ジャイロ中は、視点は動かさない */
function daze(){
  if(S.t<S.dazeEnd){S.dzOn=1;
    if(!G.on){const u=S.t-S.shkT,e=Math.min(1,u/.2)*Math.min(1,(S.dazeEnd-S.t)/.7)*(RM?.4:1),w=1.6+1.6*Math.exp(-u*.9);
      S.yawAT=e*(.4*Math.sin(u*w+S.dazePh)+.2*Math.sin(u*w*2.3+S.dazePh*2.1));S.pitAT=e*(-.07+.13*Math.sin(u*w*1.4+S.dazePh*.7));S.zoomT=1;S.yawTau=.28}}
  else if(S.dzOn){S.dzOn=0;if(!G.on){S.yawAT=0;S.pitAT=0;S.yawTau=.45}}
}
/* 無線：状況に合った文をひとつ選んで、少しあとに流す。大事なもの（pri が大きい）は、待っている文を押しのける。ひとつ流したら、しばらく黙る */
const RDO={txt:null,pri:0,at:0,busy:0,last:{},idleAt:1e9};
function radioAsk(key,delay,pri){
  pri=pri||0;if(RDO.txt&&RDO.pri>=pri)return;
  const L=LINES[key];let t;do{t=L[(Math.random()*L.length)|0]}while(L.length>1&&t===RDO.last[key]);
  RDO.last[key]=t;RDO.txt=t;RDO.pri=pri;RDO.at=S.t+(delay||0);A.triPrep(t);
}
function radioTick(dt){
  if(S.radOn>0){S.radOn-=dt;IC.radio=1;S.radLv=.5+.4*nz(S.t*9);if(S.radOn<=0){IC.radio=0;S.radLv=0}}
  if(RDO.txt&&S.t>=RDO.at&&(S.t>RDO.busy||RDO.pri>=4)&&S.radOn<=0){
    const d=A.tri(RDO.txt);if(d){S.radOn=d;RDO.busy=S.t+d+rnd(5,9);RDO.txt=null;RDO.pri=0;RDO.idleAt=S.t+rnd(60,110)}else if(S.t-RDO.at>7){RDO.txt=null;RDO.pri=0}}
  if(!RDO.txt&&S.awake&&S.t>RDO.idleAt&&!S.flee){RDO.idleAt=S.t+rnd(70,120);radioAsk('idle',0,0)}
}

/* 村の境の標識：近づくと、目が行く（見上げて、少し寄る）。字は、ほとんど剥がれ落ちていて読めない。ここを過ぎてから、空と遠くの様子がおかしくなる */
function village(){
  const vs=GEN.villS;if(!vs)return;const d=vs-S.s;
  if(!S.awake&&d<0){S.awake=1;CF.next=S.t+rnd(2.5,4);S.raceT=S.t+rnd(25,50);radioAsk('start',5.5,3)}
  const look=d>7&&d<95&&!G.on&&S.t-S.lastInput>5;
  if(look){S.pitAT=clamp(Math.atan2(4.4,d)-.03,0,.42)+.1*clamp((1-ASP)*2,0,1);S.yawAT=Math.atan2(-1.75-S.lat,d)*.8;S.zoomT=1.16;S.yawTau=.5;S.villL=1}
  else if(S.villL){S.villL=0;S.pitAT=0;S.yawAT=0;S.zoomT=1;S.yawTau=.8}
}
/* 対向車：20秒〜1分に1回くらい、ばらばらに来る。ときどき2台つづき、ときどき灯りがひとつのバイク。コーナーでは向こうも速さを落とす。
   近づいてくるあいだ、こちらは遠くを照らす補助灯を消し、車線の左へ少し寄る */
function traffic(dt){
  if(S.t>S.trafT){
    if(S.flee||S.objs.some(o=>o.t==='car'&&o.s>S.s))S.trafT=S.t+rnd(6,12);
    else{const r=Math.random(),bike=r<.16,n=!bike&&r>.8?2:1,v=bike?rnd(15,20):rnd(12.5,17),s0=S.s+rnd(310,370);
      for(let j=0;j<n;j++)S.objs.push({t:'car',s:s0+j*rnd(30,48),lat:bike?rnd(1.25,1.8):1.6,v,vn:v,on:1,bike:bike?1:0,amb:1,col:(Math.random()*4)|0,tall:!bike&&Math.random()<.25?1:0});
      S.trafT=S.t+rnd(20,65)}}
  if(!S.raceP&&S.t>6){S.raceP=1;racePrep()}                 // レースカーの音を、走りはじめのうちに作っておく
  /* レースカー：鳥や雷雨の区間では、ごくたまに、対向車線を、いるはずのないレースカーが全開で通りすぎる（V10のフォーミュラカーか、4ローターのレースカー）。
     1km以上先から、こもった唸りが聞こえはじめ、3秒ほど前に姿が見え、すれ違った瞬間に音の高さが落ちて、遠ざかっていく */
  if(S.awake&&SC&&(SC.type==='birds'||SC.type==='storm')&&!S.flee&&S.t>S.raceT){
    if(S.objs.some(o=>o.t==='car'&&o.s>S.s)||SC.s1-S.s<650||S.tun>.1)S.raceT=S.t+rnd(4,9);
    else{const ok=[1,2].filter(r=>RACE_V[r]);
      if(!ok.length)S.raceT=S.t+rnd(4,9);                                                          // 音（と走り）がまだできていない
      else{const race=ok[(Math.random()*ok.length)|0],q=RACE_V[race],ts=rnd(0,q.len),v=q.v[(ts/q.dt)|0];
        S.objs.push({t:'car',race,s:S.s+1150,lat:1.6,v,vn:v,ts,on:race===1?.02:1.5,amb:0,col:3});S.raceT=S.t+rnd(40,90);S.trafT=Math.max(S.trafT,S.t+16);radioAsk('race0',3,1)}}}
  let near=1e9;
  for(const o of S.objs){if(o.t!=='car')continue;
    const d=o.s-S.s,k=Math.abs(at(o.s-12).k),vt=Math.min(o.v,Math.sqrt((o.race?26:3.4)/Math.max(k,.002)));
    if(o.race){const q=RACE_V[o.race];if(q){o.ts=(o.ts+dt)%q.len;o.vn=q.v[Math.min(q.v.length-1,(o.ts/q.dt)|0)]}}       // レースカーの速さは、音を録ったときの走りのまま（全開 → ブレーキ → 立ち上がり、のくり返し）
    else o.vn+=(vt-o.vn)*ease(dt,.8);
    o.s-=o.vn*dt;
    if(o.race){A.racer(o,d,dt);if(d<0&&!o.pp){o.pp=1;S.fear=Math.max(S.fear,.55);A.pass(.4,0);radioAsk('race',1.8,1)}}

/* 雲の中の稲光：音もなく、雲が内側から光る（地上へは落ちてこない）。雷雨の区間では数秒おきに、ほかの区間では10〜30秒おきに、空のどこかで、1〜3回またたく。
   ほとんどは遠くて、雷鳴は聞こえない。ときどき、10秒ほど遅れて、低く小さく届く */
/* 区間：いまいる区間の種類で、天気と、空の鳥が決まる。雷雨の区間では雷雨、それ以外は晴れ */
let SC=null;
function sections(){
  while(SEC.length&&SEC[0].s1<S.s)SEC.shift();
  const c=SEC[0],was=SC;SC=c&&S.s>=c.s0-(c.type==='storm'?120:0)?c:null;
  if(SC&&SC!==was)radioAsk(SC.type,SC.type==='birds'?14:SC.type==='storm'?7:10,1);              // 区間が変わると、本部から、それらしい指示が入る
  if(SC&&SC.type==='storm'){if(WX.kind!=='storm')wxStart('storm');WX.end=S.t+99}
  else if(WX.kind!=='clear')wxClear(99);else WX.end=S.t+99;
}
const CF={next:rnd(4,8),q:[],I:0,az:0,el:.2,seed:0,n:0};
function cloudFl(dt){
  if(!S.awake)CF.next=S.t+9;                          // 村の標識を過ぎるまでは、空は静かなまま
  if(S.t>CF.next&&!CF.q.length){
    const p=at(S.s),storm=WX.kind==='storm',V=VS.V;
    CF.az=p.h+(Math.random()<.7?rnd(-1.3,1.3):rnd(-3.14,3.14));
    if(V&&VS.amt>.5&&Math.random()<.55)CF.az=Math.atan2(V.W[0],V.W[1])+rnd(-.9,.9);        // 眺めのひらけた側の空で光ることが多い
    CF.el=Math.random()<.75?rnd(.07,.24):rnd(.24,.5);CF.seed=rnd(0,30);CF.n++;
    const n=RM?1:1+((Math.random()*3)|0),I0=rnd(.45,1)*(RM?.5:1);let t=S.t;
    for(let j=0;j<n;j++){CF.q.push({t,i:I0*(j?rnd(.4,1):rnd(.65,1))});t+=rnd(.14,.4)}            // またたきは、1秒に3回まで
    CF.next=S.t+(storm?rnd(2.5,7):rnd(10,30));              // 雷雨の区間では、ひっきりなしに光る。ほかの区間では、たまに遠くで
    if(Math.random()<(storm?.6:.28))A.thunder(rnd(.8,1));
  }
  CF.I*=Math.exp(-dt/(RM?.25:.08));
  if(CF.q.length){for(const q of CF.q)if(S.t>=q.t){q.d=1;CF.I=Math.max(CF.I,q.i)}CF.q=CF.q.filter(q=>!q.d)}
  if(CF.I<.004)CF.I=0;
  if(CF.I>0&&S.fl<.09*CF.I){S.fl=.09*CF.I;S.flAz=CF.az;S.flSeed=CF.seed}        // 雲の光が、地上もわずかに照らす
}

/* 崖の区間の眺め。いちばん近い区間をひとつ選んで、空のシェーダーへ渡す数を用意する。
   街：遠くに、巨大な何かがいる。数秒おきに、鈍く一歩ずつ動く。そのたびに、少し遅れて地面が揺れ、低い地鳴りがつづく。通ったあとは灯りが消えている。
       街の3か所から、高射砲がそれを撃っている（曳光弾の列が弧を描いて飛び、ときどき体の上で炸裂する）。
   海：沖の海面の下を、巨大な何かが岸と平行に、こちらと並んで進んでいる。その上だけ、海が盛り上がっている。
       目をやるたびに、前より高く、前より近くなっている。4度めには、道のある高さの近くまで来ている。それに気づいて、踏みこんで逃げる */
const TRN=22,TRB=new Float32Array(TRN*4);
const VS={V:null,amt:0,cu:0,cw:0,ch:100,was:0,lookEnd:0,look0:0,nx:0,nw:1,px:-1,pw:0,td:1800};
const SEA_H=[8,16,27,0],SEA_W=[1,.8,.62,.42],SEA_DU=[170,140,105,80],SEA_WS=[1,1.25,1.6,2];        // 段階ごとの、高さ・沖までの遠さ・前後の位置・幅
const FORM_AIM=[[70,110,235],[60,110,270],[60,215,300],[55,60,200],[100,120,300],[32,200,400],[140,290,395]];        // 形ごとの、狙われる場所（横の幅、高さの下と上）
function visInit(V){
  V.init=1;V.t0=S.t;V.lookAt=S.t+1.2;
  if(V.type==='city'){
    const uc=(V.ua+V.ub)/2+rnd(150,500),dir=Math.random()<.5?-1:1;V.uc=uc;
    do{V.form=(Math.random()*7)|0}while(V.form===VS.lastForm);VS.lastForm=V.form;                // 巨大な何かの形：区間ごとに、前とは違う姿
    V.T={u:uc+rnd(-250,250),w:rnd(1350,1850),vu:dir*rnd(3.4,5.6),ph:rnd(0,100),stepAt:S.t+rnd(2,4),stepP:0};
    V.tr0=[V.T.u-dir*rnd(800,1200),V.T.w+rnd(-260,260)];                               // どこから来たか（そこから今いる所まで、灯りが消えている）
    const site=(a,b)=>({u:V.T.u+rnd(-a,a),w:Math.max(360,V.T.w-rnd(b,b+350))});
    V.bat=[-1,0,1].map(j=>({u:V.T.u+j*rnd(560,820)+rnd(-120,120),w:Math.max(380,V.T.w-rnd(380,760)*(j?0.75:1.2)),next:S.t+rnd(.5,5),n:0,rt:0}));
    /* 人間の側の抵抗：いつもの高射砲に加えて、区間によって、有線誘導の対戦車ミサイル、対空ガトリング砲、攻撃ヘリが出る。4割の区間では、最後に空爆が来る */
    V.ex={tow:Math.random()<.45,gat:Math.random()<.45,heli:Math.random()<.4,air:Math.random()<.4};
    V.tow={s:site(600,550),at:S.t+rnd(4,9),k:0};V.gat={s:site(700,450),at:S.t+rnd(3,8),n:0,t:0,lx:0,ly:0};
    V.heli={a:rnd(0,6.28),R:rnd(480,680),h:rnd(240,340),w:(Math.random()<.5?-1:1)*rnd(.06,.1),next:S.t+rnd(3,7),pos:[0,300,0]};
    V.air={st:0,t0:0,k:0,armT:0,seed:rnd(0,9)};
    V.trc=[];V.fls=[];V.mis=[];V.jet=null;V.airI=0;V.fires=[];V.flash=0;V.fx=0;V.fy=150;V.growlAt=S.t+rnd(5,9);V.roarAt=S.t+rnd(16,26);V.boomT=0;V.flakT=0;A.mvPrep(V.form);
  }else{
    const w0=rnd(520,680);
    V.B={u:null,w:w0,w0,h:SEA_H[0],ws:1,lv:0,lvT:S.t,ph:rnd(0,100)};
    // 雲に隠れた月：沖の、進む先寄りの低い空に置く（海に、ぼんやりした光の道が落ちる）
    {const o=rnd(.3,.75),hx=V.W[0]*Math.cos(o)+V.U[0]*Math.sin(o),hz=V.W[1]*Math.cos(o)+V.U[1]*Math.sin(o),el=rnd(.13,.2),l=Math.hypot(1,el);V.moon=[hx/l,el/l,hz/l,rnd(.12,.15)]}
  }
}
/* 遅れて届く揺れ：{t, k, f} の列。時刻が来たら、車体を突き上げて、音を鳴らす */
const QQ=[];
function quake(t,k,f){QQ.push({t,k,f})}
function vista(dt){
  const i=Math.floor(S.s/DS);
  while(VIS.length&&VIS[0].i1<i-400)VIS.shift();
  let V=null;for(const v of VIS)if(v.y!=null&&i>v.i0-260&&i<v.i1+220){V=v;break}
  VS.V=V;
  {const k=V&&V.type==='city'?clamp((i-(V.i0-240))/160,0,1)*clamp((V.i1+200-i)/160,0,1):0;A.siren(k);A.rumble(k*(.75+.25*nz(S.t*.5)));A.heli(k>0&&V.ex&&V.ex.heli&&V.heli?k*(.7+.3*Math.sin(V.heli.a)):0)}
  // 遅れて届く揺れ
  for(let q=QQ.length-1;q>=0;q--)if(S.t>=QQ[q].t){const e=QQ[q],k=e.k*(RM?.5:1);QQ.splice(q,1);S.qk=Math.max(S.qk,k);S.vf+=.1*k;S.vr+=.12*k;if(e.f)e.f(k);else A.stomp(Math.min(k,1.3))}
  /* 海から逃げだして数秒たつと、後ろで、盛り上がった海が崖に崩れかかる：地響きと、長い轟音。思わず、鏡へ目が行く */
  if(S.roarAt&&S.t>S.roarAt){S.roarAt=0;A.roar();S.fear=1;for(let k=0;k<6;k++)quake(S.t+.15+k*.55,1.5-.2*k,k?null:()=>A.stomp(1.3));if(!G.on){mirLook(1,.22);S.mirT=S.t+1.5}}
  if(S.mirT&&S.t>S.mirT){S.mirT=0;mirLook(0)}
  if(S.flee&&S.s>S.fleeEnd&&S.t-S.fleeT>16){let km=0;for(let j=0;j<=110;j+=5)km=Math.max(km,Math.abs(sm(i+j).k));        // 足をゆるめるのは、先がまっすぐなところか、コーナーで速さが落ちているときに（速いままコーナーの手前では、ゆるめない）
    if(km<.003||S.v<23){S.flee=0;S.fear=Math.max(S.fear,.5)}}                          // 逃げきった
  if(!V){VS.amt=0;if(VS.was){VS.was=0;S.yawAT=0;S.pitAT=0;S.zoomT=1;S.yawTau=.8}return}
  if(!V.init)visInit(V);
  VS.amt=clamp((i-(V.i0-240))/100,0,1)*clamp((V.i1+200-i)/70,0,1);
  const p=at(S.s),px=p.x-V.ox,pz=p.z-V.oz,cu=px*V.U[0]+pz*V.U[1],cw=px*V.W[0]+pz*V.W[1],ch=p.y+EYE_H-V.y;
  VS.cu=cu;VS.cw=cw;VS.ch=ch;
  const sea=V.type==='sea',inV=i>V.i0+10&&i<V.i1;
  let F;                                              // 目が行く先（u, 高さ, w）
  if(!sea){
