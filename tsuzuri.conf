# Tsuzuri site configuration
[site]
name = "NIKKI - 日記"
description = "Toshiaki Yokoda の日記"
url = "https://nikki.yokoda.okinawa"
author = "Toshiaki Yokoda"
language = "ja"

[build]
output = "public"
navigation = "hybrid"
clean = true

[content]
posts_per_page = 10
related_limit = 5
trusted_html_sources = ["content/posts/2020/04/2020-04-16-001.md"]

[standalone]
external_resources = "warn"
trusted_apps = ["dokuhaku-sanbusaku", "kimasu", "misansho", "hoshikuzu-signal", "cyber-break-3d", "tinylm-lab", "tinylm-lab-zero", "engine-sound-lab", "afterburner-lab", "i3-sound-lab", "semantic-inoculation", "aqua-lab", "aqua-lab-notes", "voice-lab", "instrument-lab"]
